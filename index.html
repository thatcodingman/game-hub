<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: #0a0a0f;
    background-image: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #0a0a0f 60%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 20px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 2.2rem;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, #4ade80, #38bdf8, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: #94a3b8;
    margin-top: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    height: 220px;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .card .art {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem;
  }
  .card .info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .card .info h2 { margin: 0; font-size: 1.1rem; }
  .card .info p { margin: 4px 0 0; font-size: 0.85rem; color: #cbd5e1; }
  footer {
    text-align: center;
    color: #475569;
    font-size: 0.8rem;
    padding: 20px;
  }
</style>
</head>
<body>
<style>
  .quote-rail {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 220px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
  }
  .quote-rail--left { left: 0; }
  .quote-rail--right { right: 0; }
  .quote-track {
    display: flex;
    flex-direction: column;
    gap: 36px;
    padding: 40px 24px;
    animation: quote-scroll 220s linear infinite;
  }
  .quote-rail--right .quote-track {
    animation-duration: 260s;
    animation-direction: reverse;
  }
  .quote-item {
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(226, 232, 240, 0.28);
  }
  .quote-item .quote-author {
    display: block;
    margin-top: 4px;
    color: rgba(148, 163, 184, 0.24);
    font-size: 11px;
  }
  @keyframes quote-scroll {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }
  @media (max-width: 1100px) {
    .quote-rail { display: none; }
  }
</style>

<div class="quote-rail quote-rail--left">
  <div class="quote-track" id="quoteTrackLeft"></div>
</div>
<div class="quote-rail quote-rail--right">
  <div class="quote-track" id="quoteTrackRight"></div>
</div>

<script src="assets/quotes.js"></script>
<script>
(function () {
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderTrack(elementId, quoteSubset) {
    const el = document.getElementById(elementId);
    if (!el || typeof QUOTES === 'undefined') return;
    // render the subset twice back-to-back so the -50% translateY loop is seamless
    const doubled = quoteSubset.concat(quoteSubset);
    el.innerHTML = doubled.map(q =>
      '<div class="quote-item">"' + q.text.replace(/</g, '&lt;') + '"' +
      '<span class="quote-author">— ' + q.author.replace(/</g, '&lt;') + '</span></div>'
    ).join('');
  }

  if (typeof QUOTES !== 'undefined' && QUOTES.length > 0) {
    const shuffled = shuffle(QUOTES);
    const half = Math.floor(shuffled.length / 2);
    renderTrack('quoteTrackLeft', shuffled.slice(0, half).slice(0, 60));
    renderTrack('quoteTrackRight', shuffled.slice(half).slice(0, 60));
  }
})();
</script>

<header>
  <h1>THE ARCADE</h1>
  <p>Free browser games. No installs, no accounts, just play.</p>
</header>
<div class="grid" id="game-grid"></div>
<footer>New games added regularly.</footer>

<script>
  // Add one entry here per game — the hub renders itself, so shipping a new
  // game never requires touching this page's HTML/CSS.
  const GAMES = [
    {
      title: 'The Shrink',
      tagline: 'Dodge, shoot, and survive as you shrink to nothing.',
      path: 'games/the-shrink/',
      emoji: '\ud83d\udd3b',
      gradient: 'linear-gradient(135deg, #14532d, #052e16)'
    },
    {
      title: 'Gap Flyer',
      tagline: 'Fly a horse through the gaps, catch hay, beat your best.',
      path: 'games/gap-flyer/',
      emoji: '\ud83d\udc0e',
      gradient: 'linear-gradient(135deg, #7dd3fc, #fed7aa)'
    },
    {
      title: 'DirtySet',
      tagline: 'Whack the cleaning supplies, dodge the dirt, beat the clock.',
      path: 'games/dirtyset/',
      emoji: '\ud83e\uddfd',
      gradient: 'linear-gradient(135deg, #e0f2fe, #bae6fd)'
    },
    {
      title: 'Stack Shift',
      tagline: 'Stack ice over lava \u2014 every few blocks, the tower turns a corner.',
      path: 'games/stack-shift/',
      emoji: '\ud83e\uddca',
      gradient: 'linear-gradient(135deg, #431407, #ea580c)'
    },
    {
      title: 'Home Run Derby',
      tagline: 'Time your swing perfectly \u2014 three strikes and you\'re out.',
      path: 'games/home-run-derby/',
      emoji: '\u26be',
      gradient: 'linear-gradient(135deg, #4d7c0f, #7dd3fc)'
    },
    {
      title: 'Crossword',
      tagline: 'A mini word puzzle \u2014 no timer pressure, just clues and letters.',
      path: 'games/crossword/',
      emoji: '\ud83d\udcdd',
      gradient: 'linear-gradient(135deg, #fffbeb, #fde047)'
    },
    {
      title: 'Color Drop',
      tagline: 'Choose your color, become it, and shrink with every success.',
      path: 'games/color-drop/',
      emoji: '\ud83c\udfae',
      gradient: 'linear-gradient(135deg, #ef4444, #22c55e, #3b82f6)'
    }
  ];

  const grid = document.getElementById('game-grid');
  GAMES.forEach(function (game) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = game.path;
    card.style.background = game.gradient;
    card.innerHTML =
      '<div class="art">' + game.emoji + '</div>' +
      '<div class="info">' +
        '<h2>' + game.title + '</h2>' +
        '<p>' + game.tagline + '</p>' +
      '</div>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
