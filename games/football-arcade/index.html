<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Arcade</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
  #game-root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game-root"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // PHASE 2.7 — Real kickoff returns: catch it and run, or let it go for
  // a touchback / fair-catch-style dead ball. Layered on the locked-in
  // kick meter/direction + full 11v11 formations + QB/snap/throw + field/
  // camera/body style. No blocking/coverage/tackling AI yet on the
  // return — that's still the next phases. Locked decisions: TD=6, no
  // XP/FG/punts, 960x540 canvas, scrollable world ~1300px per 100 yards,
  // camera follows the ball carrier.
  // ---------------------------------------------------------------------

  const W = 960, H = 540;
  const HUD_H = 64;                 // top HUD strip (screen-space, via uiCamera)
  const FIELD_TOP = 90;             // world-space — leaves room for stands above
  const FIELD_H = 360;              // sideline-to-sideline vertical space
  // bottom stand band works out to WORLD_H - (FIELD_TOP + FIELD_H) = 90px,
  // matching the top band, without touching camera zoom/bounds at all.

  const PX_PER_YARD = 13;           // ~1300px per 100 yards, per spec
  const ENDZONE_YARDS = 10;
  const FIELD_YARDS = 100;
  const TOTAL_YARDS = FIELD_YARDS + ENDZONE_YARDS * 2;
  const WORLD_W = TOTAL_YARDS * PX_PER_YARD; // 1560
  const WORLD_H = H;

  const LEFT_EZ_X = 0;
  const LEFT_GOAL_X = ENDZONE_YARDS * PX_PER_YARD;
  const RIGHT_GOAL_X = LEFT_GOAL_X + FIELD_YARDS * PX_PER_YARD;
  const RIGHT_EZ_X = WORLD_W;

  const QUARTER_SECONDS = 70;       // arcade-scaled quarter length

  const COLOR = {
    field: 0x1e5f3a, fieldAlt: 0x1a5534, ezHome: 0x1d3a8f, ezAway: 0x8f1d2c,
    line: 0xf2f4f7, sideline: 0xf2f4f7, hud: 0x0b0f14, ball: 0x7c3f14
  };

  const PLAYER_SPEED = 3.4;
  // this offense always drives toward RIGHT_GOAL_X — fixed for the whole
  // game, unlike qb.facing (which just tracks whichever way he's
  // currently strafing/scrambling frame to frame). Anything that means
  // "forward, downfield" should use this, never qb.facing.
  const OFFENSE_DIR = 1;

  // -----------------------------------------------------------------------
  // Data-driven body system — one universal base body (round head/helmet,
  // torso, line-limbs for arms/legs, shadow) differentiated by proportions
  // + colors per position, rather than a custom draw function per role.
  // Every position on the field — QB, kicker, returner, O-line, skill
  // players, D-line, linebackers, DBs — is just a new preset on this body.
  // -----------------------------------------------------------------------
  function makeBody(overrides) {
    return Object.assign({
      headR: 11,        // 10-12px
      torsoW: 20,        // 18-22px
      torsoH: 22,
      armLen: 16,        // 14-18px
      legLen: 16,        // 14-18px
      jersey: 0x24b7ff,
      helmet: 0x111827,
      stripe: 0xF2F4F7
    }, overrides);
  }

  const HOME = { jersey: 0x24b7ff, helmet: 0x0b1220, stripe: 0xfbbf24 };
  const AWAY = { jersey: 0x94a3b8, helmet: 0x1f2937, stripe: 0xef4444 };

  const QB_BODY = makeBody(HOME);
  const KICKER_BODY = makeBody(AWAY);

  // offense (home) — bulkier line, lean skill players
  const OL_BODY = makeBody(Object.assign({ headR: 12, torsoW: 27, torsoH: 27, armLen: 15, legLen: 15 }, HOME));
  const TE_BODY = makeBody(Object.assign({ headR: 11, torsoW: 21, torsoH: 24, armLen: 16, legLen: 16 }, HOME));
  const RB_BODY = makeBody(Object.assign({ headR: 11, torsoW: 19, torsoH: 21, armLen: 15, legLen: 17 }, HOME));
  const WR_BODY = makeBody(Object.assign({ headR: 10, torsoW: 16, torsoH: 20, armLen: 16, legLen: 18 }, HOME));

  // defense (away) — bulkier line, lean DBs
  const DL_BODY = makeBody(Object.assign({ headR: 12, torsoW: 28, torsoH: 28, armLen: 15, legLen: 15 }, AWAY));
  const LB_BODY = makeBody(Object.assign({ headR: 11, torsoW: 21, torsoH: 23, armLen: 16, legLen: 16 }, AWAY));
  const DB_BODY = makeBody(Object.assign({ headR: 10, torsoW: 16, torsoH: 20, armLen: 16, legLen: 18 }, AWAY));

  function drawFootballPlayer(g, wx, wy, facing, body, anim) {
    anim = anim || {};
    const legPhase = anim.legPhase || 0;
    const gaitAmp = anim.gaitAmp || 0;       // 0 = standing still, 1 = full stride
    const throwT = anim.throwT;              // undefined, or 0..1 windup->release
    const blocking = !!anim.blocking;        // engaged in a run/pass block — hands-up punch pose
    const dark = Phaser.Display.Color.ValueToColor(body.jersey).darken(30).color;
    const helmetDark = Phaser.Display.Color.ValueToColor(body.helmet).darken(20).color;

    // ---- Break Meter spin move — a genuine 360 rotation rather than a
    // faked lean, done by drawing the whole rigid body in coordinates
    // local to the player's own center and letting the Graphics object's
    // own rotation carry it, rather than rotating each shape by hand.
    // rot is radians, 0 the rest of the time. ----
    const rot = anim.spinRot || 0;
    g.setPosition(wx, wy);
    g.setRotation(rot);
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    // convert a LOCAL point back to world space — only needed for the one
    // thing other code reads back out of this draw call (the throw hand,
    // used to place the ball while the QB is carrying it)
    const toWorld = (lx, ly) => ({ x: wx + lx * cosR - ly * sinR, y: wy + lx * sinR + ly * cosR });
    const x = 0, y = 0; // every draw call below is now in local (player-center) space

    const hipY = y + body.torsoH * 0.42;
    const shoulderY = y - body.torsoH * 0.32;
    const lean = throwT !== undefined ? Math.sin(throwT * Math.PI) * 3 * facing : 0;

    g.clear();

    // ---- shadow — squashes/shifts a little with the gait, per the note
    // that a reactive shadow does a lot of work for almost no cost ----
    const shadowW = body.torsoW * 1.5 - gaitAmp * 3;
    g.fillStyle(0x000000, 0.32);
    g.fillEllipse(x, hipY + body.legLen * 0.85, shadowW, shadowW * 0.32);

    // ---- legs — alternating stride, two line-limbs from the hip ----
    const legSwing = Math.sin(legPhase) * gaitAmp * 0.55;
    g.lineStyle(7, dark, 1);
    // back leg
    g.lineBetween(x - facing * 3, hipY, x - facing * 3 + Math.sin(legSwing) * body.legLen * facing, hipY + Math.cos(legSwing) * body.legLen);
    // front leg (opposite phase)
    g.lineBetween(x + facing * 3, hipY, x + facing * 3 - Math.sin(legSwing) * body.legLen * facing, hipY + Math.cos(legSwing) * body.legLen);

    // ---- torso ----
    g.fillStyle(body.jersey, 1);
    g.fillRoundedRect(x - body.torsoW / 2 + lean, y - body.torsoH / 2, body.torsoW, body.torsoH, 7);
    // jersey number stripe
    g.fillStyle(dark, 0.5);
    g.fillRect(x - body.torsoW / 2 + lean, y - 2, body.torsoW, 3);

    if (blocking) {
      // ---- hands-up punch pose — both arms drive forward and up into the
      // block, pulsing on legPhase (which the block-struggle code feeds a
      // slow oscillation into) instead of a normal running arm swing, so an
      // engaged O-lineman actually reads as punching/locked-out rather than
      // just standing there ----
      const punch = 0.55 + Math.sin(legPhase) * 0.45; // 0.1..1 pulse
      g.lineStyle(6, dark, 1);
      const backHandX = x - facing * body.torsoW * 0.05 + facing * body.armLen * 0.5 * punch;
      const backHandY = shoulderY - body.armLen * 0.55 * punch;
      g.lineBetween(x - facing * body.torsoW * 0.3, shoulderY, backHandX, backHandY);
      g.fillStyle(dark, 1);
      g.fillCircle(backHandX, backHandY, 3.5);

      const handX = x + facing * body.torsoW * 0.2 + facing * body.armLen * 0.62 * punch;
      const handY = shoulderY - body.armLen * 0.62 * punch;
      g.lineStyle(6, dark, 1);
      g.lineBetween(x + facing * body.torsoW * 0.35, shoulderY, handX, handY);
      g.fillStyle(dark, 1);
      g.fillCircle(handX, handY, 3.5);
      anim.throwHand = toWorld(handX, handY);
    } else {
      // ---- back arm (non-throwing side) — small run-swing only ----
      const backSwing = -legSwing * 0.8;
      g.lineStyle(6, dark, 1);
      const backHandX = x - facing * body.torsoW * 0.5 + Math.sin(backSwing) * body.armLen * facing * 0.4;
      const backHandY = shoulderY + Math.cos(backSwing) * body.armLen * 0.7 + body.armLen * 0.3;
      g.lineBetween(x - facing * body.torsoW * 0.35, shoulderY, backHandX, backHandY);
      g.fillStyle(dark, 1);
      g.fillCircle(backHandX, backHandY, 3.5);

      // ---- front/throwing arm — run-swing normally, wind-up→release arc
      // during a throw (torso rotates back then snaps forward with it) ----
      let frontAngle; // radians, 0 = pointing straight down
      if (throwT !== undefined) {
        // windup (0 -> 0.55): swings back/up behind the shoulder
        // release (0.55 -> 1): snaps forward/up in the facing direction
        const backAngle = -2.0;   // cocked back, up and behind
        const releaseAngle = -0.65; // forward and slightly up, toward facing
        const restAngle = 0.15;
        if (throwT < 0.55) {
          const t = throwT / 0.55;
          frontAngle = Phaser.Math.Linear(restAngle, backAngle, t);
        } else {
          const t = (throwT - 0.55) / 0.45;
          frontAngle = Phaser.Math.Linear(backAngle, releaseAngle, Phaser.Math.Easing.Cubic.Out(t));
        }
      } else {
        frontAngle = 0.15 - legSwing * 0.9; // normal run swing, opposite the front leg
      }
      const fx = x + facing * body.torsoW * 0.35;
      const fy = shoulderY;
      // hand position: angle measured from straight-down
      const handX = fx + Math.sin(frontAngle) * body.armLen * facing;
      const handY = fy + Math.cos(frontAngle) * body.armLen;
      g.lineStyle(6, dark, 1);
      g.lineBetween(fx, fy, handX, handY);
      g.fillStyle(dark, 1);
      g.fillCircle(handX, handY, 3.5);
      anim.throwHand = toWorld(handX, handY);
    }

    // ---- head / helmet ----
    const headX = x + lean * 0.6, headY = y - body.torsoH / 2 - body.headR * 0.7;
    g.fillStyle(body.helmet, 1);
    g.fillCircle(headX, headY, body.headR);
    // stripe down the middle of the helmet
    g.fillStyle(body.stripe, 0.9);
    g.fillRect(headX - 1.3, headY - body.headR, 2.6, body.headR * 2);
    // facemask hint
    g.fillStyle(helmetDark, 1);
    g.fillRect(headX + facing * body.headR * 0.15, headY - 2, facing * body.headR * 0.7, 2.4);
  }

  // -----------------------------------------------------------------------
  // Formation specs — offsets (dx, dy) from the line of scrimmage / the
  // field's vertical center. 10 offensive teammates around the QB in a
  // shotgun spread, 10 defenders in a 4-3 shell across from them. The
  // line of scrimmage itself moves (touchback spot, downed kick, or
  // wherever a return ends), so these are kept as offsets, not fixed x's.
  // -----------------------------------------------------------------------
  const OFFENSE_SPECS = [
    { role: 'LT', dx: 0, dy: -28, body: OL_BODY },
    { role: 'LG', dx: 0, dy: -14, body: OL_BODY },
    { role: 'C', dx: 0, dy: 0, body: OL_BODY },
    { role: 'RG', dx: 0, dy: 14, body: OL_BODY },
    { role: 'RT', dx: 0, dy: 28, body: OL_BODY },
    { role: 'TE', dx: 0, dy: 54, body: TE_BODY },
    { role: 'WR1', dx: 0, dy: -(FIELD_H / 2 - 30), body: WR_BODY },
    { role: 'WR2', dx: 0, dy: (FIELD_H / 2 - 30), body: WR_BODY },
    { role: 'RB', dx: -52, dy: 20, body: RB_BODY },
    { role: 'FB', dx: -26, dy: -18, body: RB_BODY }
  ];

  const DEFENSE_SPECS = [
    { role: 'DE1', dx: 30, dy: -26, body: DL_BODY },
    { role: 'DT1', dx: 30, dy: -10, body: DL_BODY },
    { role: 'DT2', dx: 30, dy: 10, body: DL_BODY },
    { role: 'DE2', dx: 30, dy: 26, body: DL_BODY },
    { role: 'LB1', dx: 55, dy: -20, body: LB_BODY },
    { role: 'LB2', dx: 55, dy: 0, body: LB_BODY },
    { role: 'LB3', dx: 55, dy: 20, body: LB_BODY },
    { role: 'CB1', dx: 45, dy: -(FIELD_H / 2 - 30), body: DB_BODY },
    { role: 'CB2', dx: 45, dy: (FIELD_H / 2 - 30), body: DB_BODY },
    { role: 'S1', dx: 95, dy: 0, body: DB_BODY }
  ];

  const KICK_DIRS = ['left', 'middle', 'right'];
  const CATCH_RADIUS = 28;
  const CATCH_MAX_HEIGHT = 20;
  const TACKLE_RADIUS = 20;
  const COVERAGE_SPEED = 3.0; // a touch slower than the returner (3.4) — outrunnable in space

  // kickoff coverage — 10 away-team defenders spread across the whole
  // width of the field, sprinting downfield the moment the ball is kicked
  // and converging on the returner once he has the ball.
  const COVERAGE_SPECS = [
    { dy: -(FIELD_H / 2 - 20), body: DB_BODY },
    { dy: -(FIELD_H / 2 - 60), body: DB_BODY },
    { dy: -(FIELD_H / 2 - 100), body: LB_BODY },
    { dy: -(FIELD_H / 2 - 140), body: LB_BODY },
    { dy: -20, body: LB_BODY },
    { dy: 20, body: LB_BODY },
    { dy: (FIELD_H / 2 - 140), body: LB_BODY },
    { dy: (FIELD_H / 2 - 100), body: LB_BODY },
    { dy: (FIELD_H / 2 - 60), body: DB_BODY },
    { dy: (FIELD_H / 2 - 20), body: DB_BODY }
  ];

  const BLOCK_ENGAGE_RADIUS = 24;
  const BLOCK_DURATION = 700;   // ms a blocked coverage defender is locked up
  const BLOCKER_SPEED = 3.1;    // slightly faster than coverage — they have the jump on them

  // return blockers — 10 home-team players seeded ahead of the returner
  // who peel back to engage the nearest oncoming coverage defender.
  const BLOCKER_SPECS = [
    { dy: -(FIELD_H / 2 - 20), body: WR_BODY },
    { dy: -(FIELD_H / 2 - 60), body: WR_BODY },
    { dy: -(FIELD_H / 2 - 100), body: RB_BODY },
    { dy: -(FIELD_H / 2 - 140), body: RB_BODY },
    { dy: -20, body: RB_BODY },
    { dy: 20, body: RB_BODY },
    { dy: (FIELD_H / 2 - 140), body: RB_BODY },
    { dy: (FIELD_H / 2 - 100), body: RB_BODY },
    { dy: (FIELD_H / 2 - 60), body: WR_BODY },
    { dy: (FIELD_H / 2 - 20), body: WR_BODY }
  ];

  // -----------------------------------------------------------------------
  // PHASE A — offensive/defensive playbook + play-calling. Each formation
  // role gets a post-snap "assignment" (route / clear / runBlock / passBlock
  // / block / man / zone / rush) executed by one generic handler per
  // assignment type, rather than bespoke code per play. Route waypoints are
  // [downfieldYards, lateralYards] pairs RELATIVE TO the role's own presnap
  // spot. Only 4 of the eventual 12 plays are wired up this phase (2
  // offense, 2 defense) — same data shape scales to the rest later.
  // -----------------------------------------------------------------------
  const PLAY_CALL_SECONDS = 5;
  const RUSHER_SPEED = 2.9;
  const MAN_COVERAGE_SPEED = 2.6; // trimmed — man defenders also react on a lag now, see updateDefenseAssignments
  const ZONE_SPEED = 2.8;
  const RECEIVER_SPEED = 3.2;
  // small on purpose — OL and DL already line up close together (a real
  // neutral zone is only ~1 yard), so a big engage radius let them "lock"
  // the instant the ball was snapped with zero travel and zero motion.
  // This forces a real step-and-drive before contact resolves.
  const OL_ENGAGE_RADIUS = 13;
  const OL_BLOCK_DURATION = 650;
  const SACK_RADIUS = 22;

  // real presnap looks — the O-line and split-out skill players (TE/WRs)
  // barely move formation to formation in real football, so only the QB's
  // depth and the backfield (RB/FB) actually change; everything else keeps
  // OFFENSE_SPECS' default alignment. Each play picks one of these.
  const FORMATIONS = {
    shotgun: {
      label: 'SHOTGUN',
      qbDx: -70,
      backfield: { RB: { dx: -66, dy: 34 }, FB: { dx: -66, dy: -34 } }
    },
    iForm: {
      label: 'I-FORM',
      qbDx: -16,
      backfield: { FB: { dx: -38, dy: 0 }, RB: { dx: -66, dy: 0 } }
    },
    singleback: {
      label: 'SINGLEBACK',
      qbDx: -16,
      backfield: { RB: { dx: -50, dy: 0 }, FB: { dx: 0, dy: 62 } }
    }
  };

  // playbook tab groups offense plays by their formation, in this order
  const PLAYBOOK_FORMATIONS = ['shotgun', 'iForm', 'singleback'];

  const PLAYS = {
    insideZone: {
      label: 'INSIDE ZONE', type: 'run', carrier: 'RB', formation: 'iForm',
      assignments: {
        LT: { type: 'runBlock' }, LG: { type: 'runBlock' }, C: { type: 'runBlock' },
        RG: { type: 'runBlock' }, RT: { type: 'runBlock' },
        TE: { type: 'runBlock' }, FB: { type: 'runBlock' },
        WR1: { type: 'runBlock' }, WR2: { type: 'runBlock' },
        RB: { type: 'run' }
      }
    },
    slantFlat: {
      label: 'SLANT / FLAT', type: 'pass', formation: 'shotgun',
      assignments: {
        WR1: { type: 'route', route: [[0, 0], [4, 0], [7, 5], [12, 5]], window: { open: 450, duration: 550 }, priority: 1 },
        TE: { type: 'route', route: [[0, 0], [6, 0], [6, 2]], window: { open: 300, duration: 700 }, priority: 2 },
        WR2: { type: 'clear', route: [[0, 0], [18, 0]] },
        RB: { type: 'route', route: [[2, 0], [3, -5], [6, -5]], window: { open: 200, duration: 900 }, priority: 3 },
        FB: { type: 'block' },
        LT: { type: 'passBlock' }, LG: { type: 'passBlock' }, C: { type: 'passBlock' },
        RG: { type: 'passBlock' }, RT: { type: 'passBlock' }
      }
    },
    // strongside gap run — the backside guard pulls around to lead the RB
    // through the playside (right/+dy) hole instead of every lineman
    // blocking straight ahead like Inside Zone. aimDy on the RB's 'run'
    // assignment is what actually bends the play-call diagram's arrow
    // toward the right side, so Power Right visibly differs from Inside Zone.
    powerRight: {
      label: 'POWER RIGHT', type: 'run', carrier: 'RB', formation: 'singleback',
      assignments: {
        LT: { type: 'runBlock' }, LG: { type: 'runBlock', pull: true }, C: { type: 'runBlock' },
        RG: { type: 'runBlock' }, RT: { type: 'runBlock' },
        TE: { type: 'runBlock' }, FB: { type: 'runBlock' },
        WR1: { type: 'runBlock' }, WR2: { type: 'runBlock' },
        RB: { type: 'run', aimDy: 8 }
      }
    },
    // 3-level flood to the right sideline — WR2's deep corner, the TE's
    // intermediate out and the RB's flat all stack the same side at
    // different depths, so one defender can't cover the whole flood.
    // WR1 just clears out deep on the backside to keep the middle honest.
    floodRight: {
      label: 'FLOOD RIGHT', type: 'pass', formation: 'shotgun',
      assignments: {
        WR2: { type: 'route', route: [[0, 0], [10, 0], [16, 10]], window: { open: 600, duration: 600 }, priority: 1 },
        TE: { type: 'route', route: [[0, 0], [8, 0], [8, 8]], window: { open: 350, duration: 650 }, priority: 2 },
        RB: { type: 'route', route: [[2, 0], [3, 6], [6, 10]], window: { open: 150, duration: 900 }, priority: 3 },
        WR1: { type: 'clear', route: [[0, 0], [18, 0]] },
        FB: { type: 'block' },
        LT: { type: 'passBlock' }, LG: { type: 'passBlock' }, C: { type: 'passBlock' },
        RG: { type: 'passBlock' }, RT: { type: 'passBlock' }
      }
    },
    // three verticals — every eligible receiver takes the top off the
    // defense at once; no easy checkdown, but it's the answer to a defense
    // that's sitting on everything short.
    fourVerts: {
      label: 'FOUR VERTS', type: 'pass', formation: 'shotgun',
      assignments: {
        WR2: { type: 'route', route: [[0, 0], [18, 0]], window: { open: 650, duration: 700 }, priority: 1 },
        WR1: { type: 'route', route: [[0, 0], [18, 0]], window: { open: 650, duration: 700 }, priority: 2 },
        TE: { type: 'route', route: [[0, 0], [14, -4]], window: { open: 500, duration: 650 }, priority: 3 },
        RB: { type: 'block' }, FB: { type: 'block' },
        LT: { type: 'passBlock' }, LG: { type: 'passBlock' }, C: { type: 'passBlock' },
        RG: { type: 'passBlock' }, RT: { type: 'passBlock' }
      }
    },
    // quick screen left to the RB — everyone else clears out to drag
    // coverage away and give him the whole left sideline to work with.
    screenLeft: {
      label: 'SCREEN LEFT', type: 'pass', formation: 'shotgun',
      assignments: {
        RB: { type: 'route', route: [[1, 0], [2, -8], [4, -8]], window: { open: 150, duration: 900 }, priority: 1 },
        WR1: { type: 'clear', route: [[0, 0], [16, 0]] },
        WR2: { type: 'clear', route: [[0, 0], [16, 0]] },
        TE: { type: 'clear', route: [[0, 0], [10, 4]] },
        FB: { type: 'block' },
        LT: { type: 'passBlock' }, LG: { type: 'passBlock' }, C: { type: 'passBlock' },
        RG: { type: 'passBlock' }, RT: { type: 'passBlock' }
      }
    },
    // downhill gap run behind the fullback's lead block to the left —
    // I-Form's answer to Power Right on the opposite side.
    isoLeft: {
      label: 'ISO LEFT', type: 'run', carrier: 'RB', formation: 'iForm',
      assignments: {
        LT: { type: 'runBlock' }, LG: { type: 'runBlock' }, C: { type: 'runBlock' },
        RG: { type: 'runBlock' }, RT: { type: 'runBlock' },
        TE: { type: 'runBlock' }, FB: { type: 'runBlock' },
        WR1: { type: 'runBlock' }, WR2: { type: 'runBlock' },
        RB: { type: 'run', aimDy: -8 }
      }
    },
    // backside guard pulls all the way around to the left edge — slower to
    // develop than Power Right, but it gets outside the tackle box entirely.
    sweepLeft: {
      label: 'SWEEP LEFT', type: 'run', carrier: 'RB', formation: 'singleback',
      assignments: {
        LT: { type: 'runBlock' }, LG: { type: 'runBlock' }, C: { type: 'runBlock' },
        RG: { type: 'runBlock', pull: true }, RT: { type: 'runBlock' },
        TE: { type: 'runBlock' }, FB: { type: 'runBlock' },
        WR1: { type: 'runBlock' }, WR2: { type: 'runBlock' },
        RB: { type: 'run', aimDy: -14 }
      }
    }
  };
  const OFFENSE_PLAY_KEYS = ['insideZone', 'slantFlat', 'powerRight', 'floodRight', 'fourVerts', 'screenLeft', 'isoLeft', 'sweepLeft'];

  // zone anchors — depth (yards downfield of the LOS) + lateral offset from
  // the field's vertical center. Zone defenders drift from this anchor
  // toward the nearest route-runner who wanders into range.
  const ZONES = {
    shortLeft: { depth: 6, lateral: -(FIELD_H / 2 - 60) },
    middleHook: { depth: 8, lateral: 0 },
    shortRight: { depth: 6, lateral: (FIELD_H / 2 - 60) },
    deepLeft: { depth: 16, lateral: -(FIELD_H / 2 - 40) },
    deepRight: { depth: 16, lateral: (FIELD_H / 2 - 40) },
    deepMiddle: { depth: 18, lateral: 0 }
  };

  const DEFENSES = {
    cover3: {
      label: 'COVER 3',
      assignments: {
        DE1: { type: 'rush' }, DT1: { type: 'rush' }, DT2: { type: 'rush' }, DE2: { type: 'rush' },
        LB1: { type: 'zone', zone: 'shortLeft' }, LB2: { type: 'zone', zone: 'middleHook' }, LB3: { type: 'zone', zone: 'shortRight' },
        CB1: { type: 'zone', zone: 'deepLeft' }, CB2: { type: 'zone', zone: 'deepRight' }, S1: { type: 'zone', zone: 'deepMiddle' }
      }
    },
    manPress: {
      label: 'MAN PRESS',
      assignments: {
        DE1: { type: 'rush' }, DT1: { type: 'rush' }, DT2: { type: 'rush' }, DE2: { type: 'rush' },
        CB1: { type: 'man', target: 'WR1' }, CB2: { type: 'man', target: 'WR2' }, S1: { type: 'man', target: 'TE' },
        LB1: { type: 'man', target: 'RB' }, LB2: { type: 'man', target: 'FB' }, LB3: { type: 'zone', zone: 'middleHook' }
      }
    },
    // two deep-half zones instead of one deep-middle — better against a
    // sideline shot like Flood Right, softer underneath (only 3 defenders
    // covering the short/middle zones plus a single-high robber).
    cover2: {
      label: 'COVER 2',
      assignments: {
        DE1: { type: 'rush' }, DT1: { type: 'rush' }, DT2: { type: 'rush' }, DE2: { type: 'rush' },
        CB1: { type: 'zone', zone: 'deepLeft' }, CB2: { type: 'zone', zone: 'deepRight' },
        LB1: { type: 'zone', zone: 'shortLeft' }, LB2: { type: 'zone', zone: 'middleHook' }, LB3: { type: 'zone', zone: 'shortRight' },
        S1: { type: 'zone', zone: 'deepMiddle' }
      }
    },
    // sends 2 extra rushers to blow up a run before it develops; strong
    // vs Inside Zone/Power Right, but the RB and FB are left completely
    // uncovered — a quick pass beats it easily.
    runBlitz: {
      label: 'RUN BLITZ',
      assignments: {
        DE1: { type: 'rush' }, DT1: { type: 'rush' }, DT2: { type: 'rush' }, DE2: { type: 'rush' },
        LB1: { type: 'rush' }, LB2: { type: 'rush' }, LB3: { type: 'zone', zone: 'middleHook' },
        CB1: { type: 'man', target: 'WR1' }, CB2: { type: 'man', target: 'WR2' }, S1: { type: 'man', target: 'TE' }
      }
    }
  };
  const DEFENSE_PLAY_KEYS = ['cover3', 'manPress', 'cover2', 'runBlitz'];

  // ---- mini play-diagram for the play-call cards — driven straight off a
  // play's own assignment data (not hand-drawn per play), so any play added
  // to PLAYS later gets a diagram for free. Gold dot+line = an eligible
  // receiver/ball-carrier and his route/run path; slate dot = a blocker.
  // A handful of decorative defender dots sit across the LOS for context. ----
  function drawPlayDiagram(g, cx, cy, size, playKey) {
    g.clear();
    const play = PLAYS[playKey];
    const w = size - 40, h = size - 64;
    const losX = cx - w * 0.32;
    const dyScale = (h * 0.46) / (FIELD_H / 2);
    const yardScale = (w * 0.66) / 14;

    g.lineStyle(2, 0x334155, 1);
    g.lineBetween(losX, cy - h / 2, losX, cy + h / 2);

    OFFENSE_SPECS.forEach(spec => {
      const a = play.assignments[spec.role];
      if (!a) return;
      const py = cy + spec.dy * dyScale;
      const isEligible = a.type === 'route' || a.type === 'clear' || a.type === 'run';
      g.fillStyle(isEligible ? 0xfbbf24 : 0x64748b, 1);
      g.fillCircle(losX, py, 4);

      // a pulling lineman (Power Right's backside guard) gets a short blue
      // arrow showing him pulling toward the ball carrier's actual side,
      // instead of looking identical to every other lineman's dot
      if (a.pull) {
        const rbAssign = play.assignments.RB;
        const targetDy = (rbAssign && rbAssign.aimDy) || 0;
        const pullNx = losX + 4 * yardScale;
        const pullNy = Phaser.Math.Clamp(py + targetDy * yardScale * 0.7, cy - h / 2 + 4, cy + h / 2 - 4);
        g.lineStyle(2, 0x60a5fa, 0.9);
        g.lineBetween(losX, py, pullNx, pullNy);
        g.fillStyle(0x60a5fa, 1);
        g.fillCircle(pullNx, pullNy, 3);
      }

      if (a.type === 'route' || a.type === 'clear') {
        g.lineStyle(2, 0xfbbf24, 0.9);
        let curX = losX, curY = py;
        a.route.forEach(wp => {
          // both axes of a route waypoint are yards, so both use the same
          // px-per-yard scale — using dyScale (the formation-spread scale)
          // here made every lateral break shrink to ~1px, which is why the
          // slant looked like a straight go route instead of an actual break
          const nx = losX + wp[0] * yardScale;
          const ny = Phaser.Math.Clamp(py + wp[1] * yardScale, cy - h / 2 + 4, cy + h / 2 - 4);
          g.lineBetween(curX, curY, nx, ny);
          curX = nx; curY = ny;
        });
        g.fillStyle(0xfbbf24, 1);
        g.fillCircle(curX, curY, 2.5);
      } else if (a.type === 'run') {
        // aimDy (yards, same convention as a route's lateral waypoints)
        // bends the arrow toward the actual playside hole — Power Right's
        // arrow visibly cuts right instead of drawing an identical
        // straight-ahead arrow to Inside Zone's
        const nx = losX + 10 * yardScale;
        const ny = Phaser.Math.Clamp(py + (a.aimDy || 0) * yardScale, cy - h / 2 + 4, cy + h / 2 - 4);
        g.lineStyle(3, 0xfbbf24, 0.9);
        g.lineBetween(losX, py, nx, ny);
        const ang = Math.atan2(ny - py, nx - losX);
        g.fillStyle(0xfbbf24, 1);
        g.fillTriangle(
          nx + Math.cos(ang) * 6, ny + Math.sin(ang) * 6,
          nx + Math.cos(ang + 2.4) * 6, ny + Math.sin(ang + 2.4) * 6,
          nx + Math.cos(ang - 2.4) * 6, ny + Math.sin(ang - 2.4) * 6
        );
      }
    });

    g.fillStyle(0x475569, 1);
    for (let i = -2; i <= 2; i++) g.fillCircle(losX + 14, cy + i * (h * 0.14), 3.5);
  }

  // ---- shortest distance from a point to a line SEGMENT (not an infinite
  // line) — lets a fast-moving ball's catch check look at the whole path
  // it swept through this frame instead of just where it ended up, so it
  // can't skip clean over a receiver standing between two frame positions. ----
  function distanceToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq > 0 ? ((px - ax) * dx + (py - ay) * dy) / lenSq : 0;
    t = Phaser.Math.Clamp(t, 0, 1);
    const cx = ax + dx * t, cy = ay + dy * t;
    return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
  }

  class FieldScene extends Phaser.Scene {
    constructor() { super('field'); }

    create() {
      this.cameras.main.setBackgroundColor(0x0b0f14);

      this.drawStadium();
      this.drawField();
      this.buildHUD();
      this.buildKickUI();
      this.buildPlayCallUI();
      this.buildPauseMenu();

      this.paused = false;
      this.prePausePhase = null;
      this.prePauseClockRunning = false;

      this.score = { home: 0, away: 0 };
      this.clock = { quarter: 1, secondsLeft: QUARTER_SECONDS, running: false, over: false };

      const snapY = FIELD_TOP + FIELD_H / 2;
      this.snapY = snapY;
      this.snapX = LEFT_GOAL_X + 25 * PX_PER_YARD; // touchback line of scrimmage — the 25
      this.driveSpotX = this.snapX;
      this.returnStartX = LEFT_GOAL_X - 5 * PX_PER_YARD; // 5 yards deep in the home end zone

      // ---- Ball, kicker, returner and QB all exist from the start (clean
      // camera/graphics setup); teeUpKickoff() positions/activates them ----
      this.ball = {
        x: 0, y: 0, gfx: this.add.graphics().setDepth(9),
        carriedBy: null, snapped: false,
        inFlight: false, vx: 0, vy: 0, height: 0, heightVel: 0, gravity: 0.028
      };
      this.kicker = {
        x: 0, y: snapY, facing: -1,
        gfx: this.add.graphics().setDepth(10),
        body: KICKER_BODY, animPhase: 0, gaitAmp: 0
      };
      this.returner = {
        x: 0, y: snapY, facing: 1,
        gfx: this.add.graphics().setDepth(10),
        body: RB_BODY, animPhase: 0, gaitAmp: 0, active: false
      };
      this.qb = {
        x: 0, y: snapY, facing: 1,
        gfx: this.add.graphics().setDepth(10),
        body: QB_BODY, animPhase: 0, gaitAmp: 0,
        throwState: null, active: false
      };

      // ---- The other 20 players — proper formation, drawn once presnap
      // begins. Positions are static for now (no blocking/coverage AI yet). ----
      this.offenseFormation = OFFENSE_SPECS.map(spec => ({
        role: spec.role, body: spec.body, facing: 1, dx: spec.dx, dy: spec.dy,
        x: this.snapX + spec.dx, y: snapY + spec.dy,
        gfx: this.add.graphics().setDepth(8),
        gaitAmp: 0, animPhase: 0, cooldown: 0, blockTimer: 0,
        routeIndex: 0, routeWaypoints: null, homeX: 0, homeY: 0
      }));
      this.defenseFormation = DEFENSE_SPECS.map(spec => ({
        role: spec.role, body: spec.body, facing: -1, dx: spec.dx, dy: spec.dy,
        x: this.snapX + spec.dx, y: snapY + spec.dy,
        gfx: this.add.graphics().setDepth(8),
        gaitAmp: 0, animPhase: 0, cooldown: 0, blockTimer: 0
      }));

      // ---- Kickoff coverage — live defenders on the return, reset/spread
      // by teeUpKickoff() and activated the instant the ball is kicked ----
      this.coverage = COVERAGE_SPECS.map(spec => ({
        body: spec.body, dy: spec.dy, facing: -1,
        x: 0, y: snapY + spec.dy, gaitAmp: 0, animPhase: 0, blockTimer: 0,
        gfx: this.add.graphics().setDepth(8)
      }));
      this.coverageActive = false;

      // ---- Return blockers — peel back to engage the nearest oncoming
      // coverage defender and lock them up for a bit ----
      this.blockers = BLOCKER_SPECS.map(spec => ({
        body: spec.body, dy: spec.dy, facing: 1,
        x: 0, y: snapY + spec.dy, gaitAmp: 0, animPhase: 0, cooldown: 0,
        gfx: this.add.graphics().setDepth(8)
      }));
      this.blockersActive = false;

      // ---- receiver-select overlay for manual passing — a "1/2/3/4" tag
      // floating over each eligible receiver (in priority order) plus a
      // pulsing ring on whichever one is currently picked. Lives in world
      // space (not hudObjects) so it tracks players as the camera pans. ----
      this.targetLabels = [1, 2, 3, 4].map(n => this.add.text(0, 0, String(n), {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#0b0f14', fontStyle: 'bold',
        backgroundColor: '#fbbf24', padding: { x: 4, y: 1 }
      }).setOrigin(0.5).setDepth(20).setVisible(false));
      this.targetRing = this.add.graphics().setDepth(19);
      this.manualTarget = null;

      // ---- Visual Read & React cues — world-space rings/arcs showing each
      // eligible receiver's window state (opening soon / open / closing) and
      // how contested he is. Separate layer from targetRing/targetLabels
      // above, which stay purely "who can I pick." ----
      this.readReactGfx = this.add.graphics().setDepth(18);

      // ---- Break Meter feedback — a world-space ring that lights up
      // while a carrier's evasion window is active, and a floating popup
      // for "JUKE!"/"SPIN!"/"STIFF ARM!"/"BROKEN TACKLE!" call-outs ----
      this.breakRing = this.add.graphics().setDepth(19);
      this.breakPopupText = this.add.text(0, 0, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#fbbf24', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(21).setVisible(false);
      this.breakPopupTimer = 0;

      this.snapAnim = null;
      this.kickDirIndex = 1;
      this.kickDirection = KICK_DIRS[this.kickDirIndex];
      this.kickPower = 0;
      this.kickMeterT = 0;

      this.drive = null;
      this.liveCarrier = null;
      this.chaseMode = false;
      this.currentOffensePlay = null;
      this.currentDefensePlay = null;
      this.selectedOffensePlay = null;
      this.selectedDefensePlay = null;
      this.lastOffensePlay = null;
      this.playCallIndex = 0;
      this.playCallTab = 'suggestions';
      this.playbookFormationIndex = 0;
      this.suggestedPlays = [];
      this.recentPlays = [];

      this.keys = this.input.keyboard.addKeys({
        up: 'W', down: 'S', left: 'A', right: 'D',
        upArrow: 'UP', downArrow: 'DOWN', leftArrow: 'LEFT', rightArrow: 'RIGHT',
        throw: 'SPACE'
      });
      this.keys.throw.on('down', () => {
        if (this.phase === 'kickoff-aim') this.confirmKickDirection();
        else if (this.phase === 'kickoff-power') this.lockKickPower();
        else if (this.phase === 'kickoff-return') this.downReturner();
        else if (this.phase === 'playcall') this.confirmPlayCall();
        else if (this.phase === 'live-run') this.downCarrier();
        else this.tryThrow();
      });
      this.input.keyboard.on('keydown-A', () => { this.cycleKickDirection(-1); this.cyclePlayCallChoice(-1); });
      this.input.keyboard.on('keydown-LEFT', () => { this.cycleKickDirection(-1); this.cyclePlayCallChoice(-1); });
      this.input.keyboard.on('keydown-D', () => { this.cycleKickDirection(1); this.cyclePlayCallChoice(1); });
      this.input.keyboard.on('keydown-RIGHT', () => { this.cycleKickDirection(1); this.cyclePlayCallChoice(1); });
      // play-call tab bar (1/2/3) — also doubles as the manual pass-target
      // picker once the ball is live; each handler guards on its own phase
      // so the two uses never step on each other.
      this.input.keyboard.on('keydown-ONE', () => { this.setPlayCallTab('suggestions'); this.selectThrowTarget(1); });
      this.input.keyboard.on('keydown-TWO', () => { this.setPlayCallTab('playbook'); this.selectThrowTarget(2); });
      this.input.keyboard.on('keydown-THREE', () => { this.setPlayCallTab('recent'); this.selectThrowTarget(3); });
      this.input.keyboard.on('keydown-FOUR', () => { this.selectThrowTarget(4); });
      // W/S (or ▲▼) flip through playbook formations while on that tab
      this.input.keyboard.on('keydown-W', () => this.cyclePlaybookFormation(-1));
      this.input.keyboard.on('keydown-UP', () => this.cyclePlaybookFormation(-1));
      this.input.keyboard.on('keydown-S', () => this.cyclePlaybookFormation(1));
      this.input.keyboard.on('keydown-DOWN', () => this.cyclePlaybookFormation(1));
      // pause menu — the on-screen MENU button, or Esc/M from the keyboard
      this.input.keyboard.on('keydown-ESC', () => this.togglePauseMenu());
      this.input.keyboard.on('keydown-M', () => this.togglePauseMenu());
      // Break Meter moves — only do anything while you're actually the
      // live ball carrier (tryBreakMove guards on phase === 'live-run')
      this.input.keyboard.on('keydown-SHIFT', () => this.tryBreakMove('juke'));
      this.input.keyboard.on('keydown-Q', () => this.tryBreakMove('spin'));
      this.input.keyboard.on('keydown-E', () => this.tryBreakMove('stiffarm'));

      // ---- Camera: kicker during the kick, the returner from the moment
      // the ball is booted (so the player can track/position for it) all
      // the way through the return, then the QB once a drive is live —
      // same bounded/zoomed camera throughout, just a shared follow target ----
      this.cameras.main.setZoom(1.3);
      this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
      this.followTarget = new Phaser.Math.Vector2(0, 0);
      this.cameras.main.startFollow(this.followTarget, true, 0.12, 0.12);

      this.teeUpKickoff();

      this.cameras.main.ignore(this.hudObjects);
      this.uiCamera = this.cameras.add(0, 0, W, H);
      this.uiCamera.ignore(this.children.list.filter(o => this.hudObjects.indexOf(o) === -1));
    }

    // ---- kickoff: run-up -> aim (pick a lane) -> power (timed meter) ->
    // kick -> returner either catches it and runs, or it's downed where
    // it lands (touchback if it's in the end zone) ----
    teeUpKickoff() {
      const ballSpotX = RIGHT_GOAL_X - 35 * PX_PER_YARD;
      this.kickerStartX = ballSpotX + 40;
      this.kickerPlantX = ballSpotX - 6;
      this.kickoffT = 0;

      this.kicker.x = this.kickerStartX; this.kicker.y = this.snapY; this.kicker.facing = -1;
      this.kicker.gaitAmp = 0; this.kicker.animPhase = 0;

      this.ball.x = ballSpotX; this.ball.y = this.snapY;
      this.ball.carriedBy = null; this.ball.snapped = false;
      this.ball.inFlight = false; this.ball.vx = 0; this.ball.vy = 0;
      this.ball.height = 0; this.ball.heightVel = 0; this.ball.gravity = 0.028;

      this.returner.x = this.returnStartX; this.returner.y = this.snapY; this.returner.facing = 1;
      this.returner.gaitAmp = 0; this.returner.animPhase = 0; this.returner.active = false;
      this.returner.gfx.clear();

      const coverX = ballSpotX + 15; // kicking team's restraining line
      this.coverage.forEach(d => {
        d.x = coverX; d.y = this.snapY + d.dy; d.facing = -1;
        d.gaitAmp = 0; d.animPhase = 0; d.blockTimer = 0;
        drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, {});
      });
      this.coverageActive = false;

      const blockerX = LEFT_GOAL_X + 20 * PX_PER_YARD; // the wall, ahead of the returner
      this.blockers.forEach(b => {
        b.x = blockerX; b.y = this.snapY + b.dy; b.facing = 1;
        b.gaitAmp = 0; b.animPhase = 0; b.cooldown = 0;
        drawFootballPlayer(b.gfx, b.x, b.y, b.facing, b.body, {});
      });
      this.blockersActive = false;

      this.qb.active = false;
      this.qb.gfx.clear();

      this.kickDirIndex = 1;
      this.kickDirection = KICK_DIRS[this.kickDirIndex];

      this.phase = 'kickoff-setup';
      this.hint.setText('');
      this.followTarget.set(this.kicker.x, this.kicker.y);
      drawFootballPlayer(this.kicker.gfx, this.kicker.x, this.kicker.y, this.kicker.facing, this.kicker.body, {});
      this.drawBall();

      this.time.delayedCall(900, () => this.beginKickAim());
    }

    beginKickAim() {
      if (this.phase !== 'kickoff-setup') return;
      this.phase = 'kickoff-aim';
      this.kickDirIndex = 1;
      this.kickDirection = KICK_DIRS[this.kickDirIndex];
      this.kickPrompt.setText('A / D or ◀ ▶ to pick a lane · SPACE to lock it in');
      this.kickPrompt.setVisible(true);
      this.kickChips.forEach(chip => { chip.bg.setVisible(true); chip.txt.setVisible(true); });
      this.refreshKickChips();
    }

    cycleKickDirection(delta) {
      if (this.phase !== 'kickoff-aim') return;
      this.kickDirIndex = Phaser.Math.Clamp(this.kickDirIndex + delta, 0, KICK_DIRS.length - 1);
      this.kickDirection = KICK_DIRS[this.kickDirIndex];
      this.refreshKickChips();
    }

    confirmKickDirection() {
      if (this.phase !== 'kickoff-aim') return;
      this.phase = 'kickoff-power';
      this.kickMeterT = 0;
      this.kickChips.forEach(chip => { chip.bg.setVisible(false); chip.txt.setVisible(false); });
      this.kickPrompt.setText('SPACE to set your kick power — hit the green for a big boot!');
      this.kickMeterBg.setVisible(true);
      this.kickMeterSweet.setVisible(true);
      this.kickMeterFill.setVisible(true);
    }

    lockKickPower() {
      if (this.phase !== 'kickoff-power') return;
      const power = this.kickPower;
      const direction = this.kickDirection;
      this.kickPrompt.setVisible(false);
      this.kickMeterBg.setVisible(false);
      this.kickMeterSweet.setVisible(false);
      this.kickMeterFill.setVisible(false);
      this.executeKick(power, direction);
    }

    executeKick(power, direction) {
      this.phase = 'kickoff-flight';
      const distYards = Phaser.Math.Linear(32, 72, power);      // weak tap -> full boot
      const distPx = distYards * PX_PER_YARD;
      const gravity = 0.05;                                     // punchier/higher arc than a throw
      const heightVel = Phaser.Math.Linear(2.6, 4.4, power);
      const frames = (2 * heightVel) / gravity;
      const vx = (distPx / frames) * this.kicker.facing;

      let targetY = this.snapY;
      if (direction === 'left') targetY = FIELD_TOP + FIELD_H * 0.22;
      else if (direction === 'right') targetY = FIELD_TOP + FIELD_H * 0.78;
      const vy = (targetY - this.ball.y) / frames;

      this.ball.inFlight = true;
      this.ball.vx = vx;
      this.ball.vy = vy;
      this.ball.height = 4;
      this.ball.heightVel = heightVel;
      this.ball.gravity = gravity;

      this.returner.active = true;
      this.coverageActive = true;
      this.blockersActive = true;
      this.followTarget.set(this.returner.x, this.returner.y);
      this.hint.setText('Get under it — catch and run, or let it go');

      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(300, 0.08); } catch (e) {}
      }
    }

    catchBall() {
      this.ball.inFlight = false;
      this.ball.vx = 0; this.ball.vy = 0; this.ball.heightVel = 0; this.ball.height = 0;
      this.ball.carriedBy = 'returner';
      this.phase = 'kickoff-return';
      this.resetBreakMeter(this.returner);
      this.hint.setText('WASD to run · Shift/Q/E to juke/spin/stiff-arm · Space to down the ball');
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(650, 0.05); } catch (e) {}
      }
    }

    onKickLanded() {
      this.ball.gravity = 0.028; // back to throw/carry scale for later
      if (this.ball.x < LEFT_GOAL_X) {
        this.endKickoffAt(this.snapX, 'TOUCHBACK', 'BALL ON THE 25');
      } else {
        const spot = Phaser.Math.Clamp(this.ball.x, LEFT_GOAL_X + 10, RIGHT_GOAL_X - 10);
        this.endKickoffAt(spot, 'BALL DOWNED', 'AT THE ' + this.yardLineLabel(spot));
      }
    }

    downReturner() {
      if (this.phase !== 'kickoff-return') return;
      const spot = Phaser.Math.Clamp(this.returner.x, LEFT_GOAL_X + 10, RIGHT_GOAL_X - 10);
      this.endKickoffAt(spot, 'BALL DOWNED', 'AT THE ' + this.yardLineLabel(spot));
    }

    tackleReturner() {
      if (this.phase !== 'kickoff-return') return;
      const spot = Phaser.Math.Clamp(this.returner.x, LEFT_GOAL_X + 10, RIGHT_GOAL_X - 10);
      this.endKickoffAt(spot, 'TACKLED', 'AT THE ' + this.yardLineLabel(spot));
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(150, 0.07); } catch (e) {}
      }
    }

    // ---- coverage AI: simple pursuit toward the returner's current spot,
    // a touch slower than him so open space is escapable. Tackles once a
    // defender closes within TACKLE_RADIUS while he's carrying the ball.
    // A defender with blockTimer > 0 is engaged by a blocker and stands
    // his ground (struggling) instead of chasing. ----
    updateCoverage(dt) {
      for (const d of this.coverage) {
        if (d.blockTimer > 0) {
          d.blockTimer -= dt;
          d.gaitAmp = Math.max(0, d.gaitAmp - 0.1);
          d.animPhase += dt * 0.004; // slow struggle, not a run cycle
          drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, { legPhase: d.animPhase, gaitAmp: d.gaitAmp });
          continue;
        }

        const dx = this.returner.x - d.x, dy = this.returner.y - d.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const moveX = (dx / dist) * COVERAGE_SPEED, moveY = (dy / dist) * COVERAGE_SPEED;
        d.x = Phaser.Math.Clamp(d.x + moveX, 20, WORLD_W - 20);
        d.y = Phaser.Math.Clamp(d.y + moveY, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
        if (Math.abs(moveX) > 0.05) d.facing = moveX > 0 ? 1 : -1;

        d.gaitAmp = Math.min(1, d.gaitAmp + 0.08);
        d.animPhase += dt * 0.014;
        if (d.animPhase > Math.PI * 2) d.animPhase -= Math.PI * 2;
        drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, { legPhase: d.animPhase, gaitAmp: d.gaitAmp });

        if (this.phase === 'kickoff-return') {
          const tdx = this.returner.x - d.x, tdy = this.returner.y - d.y;
          if (Math.sqrt(tdx * tdx + tdy * tdy) < TACKLE_RADIUS) {
            if (this.returner.evasionT > 0 || Math.random() < 0.08) {
              d.blockTimer = 420;
              d.strugglePhase = 0;
              this.returner.evasionT = 0;
              this.returner.brokenTackles = (this.returner.brokenTackles || 0) + 1;
              this.showBreakPopup(this.returner, 'BROKEN TACKLE!', '#22c55e');
              if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
                try { SFX.tone(330, 0.06); } catch (e) {}
              }
              continue;
            }
            this.tackleReturner();
            break;
          }
        }
      }
    }

    // ---- blocker AI: each blocker seeks the nearest unblocked coverage
    // defender; on contact it locks that defender down for BLOCK_DURATION
    // and then takes a short cooldown itself, so no single matchup turns
    // into a permanent, every-frame re-lock. ----
    updateBlockers(dt) {
      for (const b of this.blockers) {
        if (b.cooldown > 0) {
          b.cooldown -= dt;
          b.gaitAmp = Math.max(0, b.gaitAmp - 0.1);
          drawFootballPlayer(b.gfx, b.x, b.y, b.facing, b.body, { legPhase: b.animPhase, gaitAmp: b.gaitAmp });
          continue;
        }

        let target = null, bestDist = Infinity;
        for (const d of this.coverage) {
          if (d.blockTimer > 0) continue;
          const dx = d.x - b.x, dy = d.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) { bestDist = dist; target = d; }
        }

        if (target && bestDist < BLOCK_ENGAGE_RADIUS) {
          target.blockTimer = BLOCK_DURATION;
          b.cooldown = BLOCK_DURATION + 500;
          b.gaitAmp = Math.max(0, b.gaitAmp - 0.2);
          if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
            try { SFX.tone(180, 0.05); } catch (e) {}
          }
        } else if (target) {
          const dx = target.x - b.x, dy = target.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const moveX = (dx / dist) * BLOCKER_SPEED, moveY = (dy / dist) * BLOCKER_SPEED;
          b.x = Phaser.Math.Clamp(b.x + moveX, 20, WORLD_W - 20);
          b.y = Phaser.Math.Clamp(b.y + moveY, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
          if (Math.abs(moveX) > 0.05) b.facing = moveX > 0 ? 1 : -1;
          b.gaitAmp = Math.min(1, b.gaitAmp + 0.08);
        }

        b.animPhase += dt * 0.014;
        if (b.animPhase > Math.PI * 2) b.animPhase -= Math.PI * 2;
        drawFootballPlayer(b.gfx, b.x, b.y, b.facing, b.body, { legPhase: b.animPhase, gaitAmp: b.gaitAmp });
      }
    }

    // ---- scoring — a real scoreboard now backs every TD, whether it comes
    // from a kickoff return or a live offensive drive. Locked rule: TD=6,
    // no XP/2pt/FG, so a score always just resets to another kickoff. ----
    scoreTouchdown() {
      if (this.phase === 'dead-ball') return;
      this.phase = 'dead-ball';
      this.clock.running = false;
      this.score.home += 6;
      this.scoreLabel.setText('HOME ' + this.score.home + ' — AWAY ' + this.score.away);
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(700, 0.1); } catch (e) {}
      }
      this.showPlayMessage('TOUCHDOWN!', 'HOME ' + this.score.home + ' — AWAY ' + this.score.away, () => this.awayPossession());
    }

    // shared "the play just ended here, pause on a message, then run some
    // callback" — used by touchbacks, downed kicks, a returner giving
    // himself up, and now every live-drive play result too
    showPlayMessage(headline, sub, callback) {
      this.hint.setText('');
      // the play's over — hide the Break Meter HUD/ring/popup, they only
      // mean anything while someone's actually carrying the ball live
      this.breakMeterLabel.setVisible(false);
      this.breakMeterBg.setVisible(false);
      this.breakMeterFill.setVisible(false);
      this.breakRing.clear();
      this.breakPopupText.setVisible(false);
      this.breakPopupTimer = 0;
      this.touchbackMsg = this.add.text(W / 2, H / 2 - 14, headline, {
        fontFamily: 'system-ui, sans-serif', fontSize: '28px', color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(60);
      this.touchbackSub = this.add.text(W / 2, H / 2 + 18, sub, {
        fontFamily: 'system-ui, sans-serif', fontSize: '16px', color: '#94a3b8'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(60);
      // these are fixed HUD-style overlays created after the initial
      // camera/ignore setup, so they need their own explicit exclusion
      // from the zoomed main camera (same trick buildHUD() relies on)
      this.cameras.main.ignore([this.touchbackMsg, this.touchbackSub]);
      this.time.delayedCall(1600, () => {
        if (this.touchbackMsg) { this.touchbackMsg.destroy(); this.touchbackMsg = null; }
        if (this.touchbackSub) { this.touchbackSub.destroy(); this.touchbackSub = null; }
        callback();
      });
    }

    endKickoffAt(x, headline, sub) {
      this.driveSpotX = x;
      this.phase = 'dead-ball';
      this.showPlayMessage(headline, sub, () => this.startPresnap(true));
    }

    // freshDrive=true (default) starts a brand-new drive (1st & 10 at
    // driveSpotX) — used after a kickoff/touchback/downed kick. false keeps
    // the current drive's down/distance going, just moving the LOS to
    // wherever the last play ended — used between downs on a live drive.
    startPresnap(freshDrive) {
      if (freshDrive === undefined) freshDrive = true;
      if (this.touchbackMsg) { this.touchbackMsg.destroy(); this.touchbackMsg = null; }
      if (this.touchbackSub) { this.touchbackSub.destroy(); this.touchbackSub = null; }
      this.kicker.gfx.clear();
      this.returner.gfx.clear();
      this.returner.active = false;
      this.coverage.forEach(d => d.gfx.clear());
      this.coverageActive = false;
      this.blockers.forEach(b => b.gfx.clear());
      this.blockersActive = false;

      if (freshDrive) {
        this.drive = { down: 1, toGo: 10, losX: this.driveSpotX };
      } else {
        this.drive.losX = this.driveSpotX;
      }

      const losX = this.driveSpotX;
      this.qb.x = losX - 34;
      this.qb.y = this.snapY;
      this.qb.facing = 1;
      this.qb.active = true;
      this.qb.throwState = null;

      this.ball.x = losX;
      this.ball.y = this.snapY;
      this.ball.carriedBy = null;
      this.ball.snapped = false;

      // proper 11-man formations line up for the snap, relative to
      // wherever this drive is actually starting from
      this.offenseFormation.forEach(p => {
        p.x = losX + p.dx; p.y = this.snapY + p.dy; p.facing = 1;
        p.gaitAmp = 0; p.animPhase = 0; p.routeWaypoints = null; p.routeIndex = 0;
        drawFootballPlayer(p.gfx, p.x, p.y, p.facing, p.body, {});
      });
      this.defenseFormation.forEach(p => {
        p.x = losX + p.dx; p.y = this.snapY + p.dy; p.facing = -1;
        p.gaitAmp = 0; p.animPhase = 0; p.blockTimer = 0;
        drawFootballPlayer(p.gfx, p.x, p.y, p.facing, p.body, {});
      });

      this.redrawQB();
      this.followTarget.set(this.qb.x, this.qb.y);
      this.startPlayCall();
    }

    // ---- play-calling: offense picks from the 2 wired-up calls via a
    // chip selector (A/D or ◀ ▶, SPACE to lock in), 5s timer auto-confirms
    // (falling back to the previous call, or the first one on your very
    // first snap) if you don't choose in time. Defense is 100% AI this
    // phase — it just rolls one of its 2 calls at random. ----
    startPlayCall() {
      this.phase = 'playcall';
      this.playCallTab = 'suggestions';
      this.suggestedPlays = this.computeSuggestedPlays();
      this.playbookFormationIndex = 0;
      this.playCallIndex = 0;
      this.playCallTimeLeft = PLAY_CALL_SECONDS * 1000;
      this.playCallBackdrop.setVisible(true);
      this.playCallTabs.forEach(t => t.txt.setVisible(true));
      this.playCallSubHeader.setVisible(true);
      this.playCallPrompt.setVisible(true);
      this.refreshPlayCallChips();
    }

    // ---- 3 lists to pick a play from: hand-picked SUGGESTIONS for the
    // current down & distance, the full PLAYBOOK grouped by formation, and
    // a running RECENT list of your own last calls. All three just resolve
    // to a play-key array; the card row and the confirm/cycle logic below
    // don't care which tab produced it. ----
    getPlayCallList() {
      if (this.playCallTab === 'suggestions') return this.suggestedPlays || [];
      if (this.playCallTab === 'recent') return this.recentPlays || [];
      const formationKey = PLAYBOOK_FORMATIONS[this.playbookFormationIndex];
      return OFFENSE_PLAY_KEYS.filter(k => PLAYS[k].formation === formationKey);
    }

    // ---- a simple down & distance heuristic, not a real defense read (the
    // defense's call isn't even picked until confirmPlayCall) — short
    // yardage leans run, long yardage leans pass, otherwise a balanced mix,
    // always topped off with whatever else is in the book. ----
    computeSuggestedPlays() {
      const toGo = this.drive ? this.drive.toGo : 10;
      const down = this.drive ? this.drive.down : 1;
      let order;
      if (toGo <= 3) {
        order = ['powerRight', 'isoLeft', 'sweepLeft', 'insideZone', 'slantFlat', 'screenLeft', 'floodRight', 'fourVerts'];
      } else if (toGo >= 8 || down >= 3) {
        order = ['fourVerts', 'floodRight', 'slantFlat', 'screenLeft', 'powerRight', 'sweepLeft', 'insideZone', 'isoLeft'];
      } else {
        order = ['slantFlat', 'powerRight', 'floodRight', 'isoLeft', 'insideZone', 'sweepLeft', 'fourVerts', 'screenLeft'];
      }
      const seen = new Set(), list = [];
      order.forEach(k => { if (OFFENSE_PLAY_KEYS.includes(k) && !seen.has(k)) { seen.add(k); list.push(k); } });
      return list.slice(0, 4);
    }

    setPlayCallTab(tab) {
      if (this.phase !== 'playcall' || this.playCallTab === tab) return;
      this.playCallTab = tab;
      this.playCallIndex = 0;
      this.refreshPlayCallChips();
    }

    cyclePlaybookFormation(delta) {
      if (this.phase !== 'playcall' || this.playCallTab !== 'playbook') return;
      this.playbookFormationIndex = Phaser.Math.Clamp(this.playbookFormationIndex + delta, 0, PLAYBOOK_FORMATIONS.length - 1);
      this.playCallIndex = 0;
      this.refreshPlayCallChips();
    }

    cyclePlayCallChoice(delta) {
      if (this.phase !== 'playcall') return;
      const list = this.getPlayCallList();
      if (!list.length) return;
      this.playCallIndex = Phaser.Math.Clamp(this.playCallIndex + delta, 0, list.length - 1);
      this.refreshPlayCallChips();
    }

    confirmPlayCall() {
      if (this.phase !== 'playcall') return;
      const list = this.getPlayCallList();
      this.selectedOffensePlay = list[this.playCallIndex] || list[0] || this.lastOffensePlay || OFFENSE_PLAY_KEYS[0];
      this.lastOffensePlay = this.selectedOffensePlay;
      this.recentPlays = [this.selectedOffensePlay].concat((this.recentPlays || []).filter(k => k !== this.selectedOffensePlay)).slice(0, 4);
      this.selectedDefensePlay = DEFENSE_PLAY_KEYS[Phaser.Math.Between(0, DEFENSE_PLAY_KEYS.length - 1)];
      this.playCallBackdrop.setVisible(false);
      this.playCallTabs.forEach(t => t.txt.setVisible(false));
      this.playCallSubHeader.setVisible(false);
      this.playCallEmptyMsg.setVisible(false);
      this.playCallChips.forEach(c => { c.bg.setVisible(false); c.diagram.setVisible(false); c.txt.setVisible(false); });
      this.playCallPrompt.setVisible(false);
      // the offense actually shifts into the called play's real formation
      // now that we know which one it is — Shotgun/I-Form/Singleback all
      // look different at the line, not just one generic spread every snap
      this.applyFormation(PLAYS[this.selectedOffensePlay].formation);
      this.phase = 'presnap';
      this.hint.setText('Get set...');
      this.time.delayedCall(700, () => this.doSnap());
    }

    // ---- lines the QB and backfield up in the called play's real formation.
    // The O-line, TE and both WRs keep their normal split (that barely
    // changes formation to formation in real football) — only QB depth and
    // RB/FB alignment actually move. ----
    applyFormation(formationKey) {
      const formation = FORMATIONS[formationKey] || FORMATIONS.singleback;
      const losX = this.drive.losX;
      this.qb.x = losX + formation.qbDx;
      this.qb.y = this.snapY;
      this.qb.facing = 1;

      this.offenseFormation.forEach(p => {
        const spec = OFFENSE_SPECS.find(s => s.role === p.role);
        const override = formation.backfield && formation.backfield[p.role];
        const dx = override ? override.dx : spec.dx;
        const dy = override ? override.dy : spec.dy;
        p.x = losX + dx; p.y = this.snapY + dy; p.facing = 1;
        drawFootballPlayer(p.gfx, p.x, p.y, p.facing, p.body, {});
      });

      this.redrawQB();
    }

    refreshPlayCallChips() {
      const list = this.getPlayCallList();
      if (this.playCallIndex > Math.max(0, list.length - 1)) this.playCallIndex = Math.max(0, list.length - 1);

      this.playCallTabs.forEach(tab => {
        tab.txt.setColor(tab.key === this.playCallTab ? '#fbbf24' : '#64748b');
      });

      if (this.playCallTab === 'suggestions') {
        const d = this.drive;
        this.playCallSubHeader.setText(d ? ('SUGGESTED FOR ' + this.ordinal(d.down) + ' & ' + d.toGo) : 'SUGGESTED PLAYS');
      } else if (this.playCallTab === 'playbook') {
        const formationKey = PLAYBOOK_FORMATIONS[this.playbookFormationIndex];
        this.playCallSubHeader.setText('◀ ' + FORMATIONS[formationKey].label + ' ▶   (W/S to change formation)');
      } else {
        this.playCallSubHeader.setText(list.length ? 'YOUR LAST CALLS' : 'NO PLAYS CALLED YET');
      }

      this.playCallEmptyMsg.setVisible(!list.length);
      if (!list.length) {
        this.playCallEmptyMsg.setText(this.playCallTab === 'recent' ? "You haven't called a play yet this game." : 'Nothing in this formation.');
      }

      this.playCallChips.forEach((chip, i) => {
        const key = list[i];
        if (!key) {
          chip.bg.setVisible(false); chip.diagram.setVisible(false); chip.txt.setVisible(false);
          chip.key = null;
          return;
        }
        chip.key = key;
        chip.bg.setVisible(true); chip.diagram.setVisible(true); chip.txt.setVisible(true);
        const selected = i === this.playCallIndex;
        chip.bg.setFillStyle(selected ? 0x1c3a5e : 0x141a24, 1);
        chip.bg.setStrokeStyle(3, selected ? 0xfbbf24 : 0x2a3140);
        chip.txt.setColor(selected ? '#F2F4F7' : '#64748b');
        chip.txt.setText(PLAYS[key].label);
        drawPlayDiagram(chip.diagram, chip.cx, chip.cy - 14, chip.size, key);
      });
    }

    doSnap() {
      this.snapAnim = { t: 0, duration: 150, fromX: this.ball.x, fromY: this.ball.y };
    }

    // ---- fires the instant the snap animation finishes — assigns every
    // formation player their route/block/coverage job for the play just
    // called, and drops into either 'live-run' (ball goes straight to the
    // RB) or 'live-pass' (QB holds it, can move/scramble/throw). ----
    beginLivePlay() {
      this.ball.carriedBy = 'qb';
      this.ball.snapped = true;
      this.clock.running = true;
      this.livePlayElapsedMs = 0;
      this.chaseMode = false;
      this.liveCarrier = null;

      const offPlay = PLAYS[this.selectedOffensePlay];
      const defPlay = DEFENSES[this.selectedDefensePlay];
      this.currentOffensePlay = offPlay;
      this.currentDefensePlay = defPlay;

      this.offenseFormation.forEach(p => {
        p.cooldown = 0; p.blockTimer = 0; p.strugglePhase = 0; p.homeX = p.x; p.homeY = p.y; p.routeIndex = 0;
        const a = offPlay.assignments[p.role];
        if (a && (a.type === 'route' || a.type === 'clear')) {
          p.routeWaypoints = a.route.map(wp => ({ x: p.x + wp[0] * PX_PER_YARD, y: p.y + wp[1] * PX_PER_YARD }));
        } else {
          p.routeWaypoints = null;
        }
      });
      this.defenseFormation.forEach(d => { d.cooldown = 0; d.blockTimer = 0; d.strugglePhase = 0; d.trackX = d.x; d.trackY = d.y; });
      this.manualTarget = null;

      if (offPlay.type === 'run') {
        this.phase = 'live-run';
        this.chaseMode = true;
        const carrier = this.offenseFormation.find(p => p.role === (offPlay.carrier || 'RB'));
        this.liveCarrier = carrier;
        this.ball.carriedBy = carrier.role;
        this.followTarget.set(carrier.x, carrier.y);
        this.resetBreakMeter(carrier);
        this.hint.setText('WASD to run · Shift/Q/E to juke/spin/stiff-arm · Space to go down');
      } else {
        this.phase = 'live-pass';
        this.resetBreakMeter(this.qb);
        this.hint.setText('WASD to move · Shift/Q/E to juke/spin/stiff-arm · 1-4 target · Space to throw');
      }
    }

    tryThrow() {
      if (this.phase !== 'live-pass' || !this.qb.active || this.ball.carriedBy !== 'qb' || this.qb.throwState) return;
      this.qb.throwState = { t: 0, duration: 420 };
    }

    // ---- distance from a world point to the nearest live defender — the
    // same "how contested is this" number the catch/drop/pick model uses,
    // shared here so the Read & React cues stay honestly in sync with what
    // actually determines the throw's odds. ----
    nearestDefenderSeparation(x, y) {
      let sep = Infinity;
      for (const d of this.defenseFormation) {
        const dx = x - d.x, dy = y - d.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < sep) sep = dist;
      }
      return sep;
    }

    // ---- every eligible receiver in the current play, ranked by their own
    // route priority (1 = primary read) — the same ranking both the 1-4
    // target-select keys and the auto-throw fallback use, so "2" always
    // means the same receiver the HUD tag over his head says it does. ----
    eligibleReceivers() {
      if (!this.currentOffensePlay) return [];
      const assignments = this.currentOffensePlay.assignments;
      return this.offenseFormation
        .filter(p => {
          const a = assignments[p.role];
          return a && (a.type === 'route' || a.type === 'clear');
        })
        .sort((a, b) => (assignments[a.role].priority || 9) - (assignments[b.role].priority || 9));
    }

    // ---- manual targeting: 1-4 locks the QB onto whichever receiver is
    // currently wearing that number (same priority order as the HUD tags).
    // The lock only matters if that receiver is still throwable when Space
    // is pressed — pickThrowTarget() below falls back to the old auto-read
    // logic if he isn't (e.g. the QB has since turned away from him). ----
    selectThrowTarget(n) {
      if (this.phase !== 'live-pass') return;
      const picked = this.eligibleReceivers()[n - 1];
      if (!picked) return;
      this.manualTarget = picked.role;
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(680 + n * 55, 0.03); } catch (e) {}
      }
    }

    // picks who the ball is going to: a manually-selected target if one's
    // been locked in and is still throwable, otherwise the highest-priority
    // eligible receiver currently inside their Read & React window (falling
    // back to priority order among everyone downfield of the QB if nobody's
    // window is open yet) — a stand-in for real analog aiming, per the
    // PDF's own note that the QB still just throws in the direction he's
    // facing.
    pickThrowTarget() {
      if (!this.currentOffensePlay) return null;
      const assignments = this.currentOffensePlay.assignments;
      const elapsed = this.livePlayElapsedMs || 0;
      // NOTE: no qb.facing check here on purpose — facing is just whichever
      // way he's currently strafing (updates every frame off arrow-key
      // input), not the offense's actual driving direction, and gating
      // eligibility on it meant a QB who'd drifted left while scrambling
      // would drop every real receiver (all of whom are downfield to the
      // right) and either whiff on a manual target or fall through to the
      // "nobody's open" branch below.
      const eligibles = this.offenseFormation.filter(p => {
        const a = assignments[p.role];
        return a && (a.type === 'route' || a.type === 'clear');
      });
      if (!eligibles.length) return null;

      if (this.manualTarget) {
        const picked = eligibles.find(p => p.role === this.manualTarget);
        if (picked) return picked;
      }

      const open = eligibles.filter(p => {
        const w = assignments[p.role].window;
        return !w || (elapsed >= w.open && elapsed <= w.open + w.duration);
      });
      const pool = open.length ? open : eligibles;
      pool.sort((a, b) => (assignments[a.role].priority || 9) - (assignments[b.role].priority || 9));
      return pool[0];
    }

    // ---- draws the floating "1/2/3/4" tags over each eligible receiver
    // and a pulsing ring around the manually-selected one, every frame
    // while a pass is live; hidden the rest of the time. ----
    updateTargetIndicators() {
      if (this.phase !== 'live-pass' && this.phase !== 'live-pass-air') {
        this.targetLabels.forEach(t => t.setVisible(false));
        this.targetRing.clear();
        return;
      }
      const eligibles = this.eligibleReceivers();
      this.targetLabels.forEach((label, i) => {
        const p = eligibles[i];
        if (p) {
          label.setPosition(p.x, p.y - p.body.torsoH - 14);
          label.setVisible(true);
        } else {
          label.setVisible(false);
        }
      });

      this.targetRing.clear();
      if (this.manualTarget) {
        const picked = eligibles.find(p => p.role === this.manualTarget);
        if (picked) {
          const pulse = 3 + Math.sin((this.livePlayElapsedMs || 0) * 0.012) * 2;
          this.targetRing.lineStyle(2.5, 0xfbbf24, 0.9);
          this.targetRing.strokeCircle(picked.x, picked.y, 18 + pulse);
        }
      }
    }

    // ---- Visual Read & React cues — one world-space ring + countdown arc
    // per eligible receiver, built entirely from geometry (never color
    // alone) so it's legible without a key:
    //   ring size/thickness  = how open he is (defender separation, same
    //                          bands the catch/drop/pick model itself uses)
    //   dashed vs solid ring = window not open yet vs. currently open
    //   draining arc         = time left in the window — the "throw now or
    //                          lose it" tell, this system's signature cue
    //   pulse speed          = urgency as the window nears its close
    //   small tick at 12:00  = this is the priority-1 read
    // This only tells the player WHEN/HOW OPEN — it never touches who gets
    // picked (that's still the 1-4 tags + manual/auto pickThrowTarget). A
    // route with no window (a 'clear' decoy) draws nothing. ----
    updateReadReactCues() {
      this.readReactGfx.clear();
      if (this.phase !== 'live-pass' || !this.currentOffensePlay) return;

      const assignments = this.currentOffensePlay.assignments;
      const elapsed = this.livePlayElapsedMs || 0;
      const g = this.readReactGfx;

      this.eligibleReceivers().forEach(p => {
        const a = assignments[p.role];
        const w = a.window;
        if (!w) return; // decoy route — no timing data, no cue

        const timeUntilOpen = w.open - elapsed;
        const timeUntilClose = (w.open + w.duration) - elapsed;
        const isPrimary = (a.priority || 9) === 1;

        if (timeUntilOpen > 400) return;   // too early to telegraph yet
        if (timeUntilClose < -200) return; // long closed — nothing left to show

        // openness bands mirror the separation numbers resolveAirBall
        // already uses for catch/drop/pick, so a wide-open ring really
        // does mean a safer throw, not just a bigger circle
        const sep = this.nearestDefenderSeparation(p.x, p.y);
        let openness;
        if (sep < 15) openness = 0.12;
        else if (sep < 25) openness = 0.35;
        else if (sep < 40) openness = 0.6;
        else if (sep < 60) openness = 0.85;
        else openness = 1;

        const baseRadius = (isPrimary ? 20 : 16) + openness * 6;
        const thickness = 1.5 + openness * 2.5;

        if (timeUntilOpen > 0) {
          // ---- OPENING SOON — faint dashed ring, no arc yet ----
          const t = Phaser.Math.Clamp(1 - timeUntilOpen / 400, 0, 1);
          g.lineStyle(1.5, 0x94a3b8, 0.15 + t * 0.15);
          const dashes = 10;
          for (let i = 0; i < dashes; i++) {
            const a0 = (i / dashes) * Math.PI * 2;
            const a1 = a0 + (Math.PI * 2 / dashes) * 0.6;
            g.beginPath();
            g.arc(p.x, p.y, baseRadius, a0, a1, false);
            g.strokePath();
          }
          return;
        }

        if (timeUntilClose <= 0) {
          // ---- JUST CLOSED — quick fade, no arc ----
          const fadeT = Phaser.Math.Clamp(1 + timeUntilClose / 200, 0, 1);
          g.lineStyle(1.5, 0x64748b, 0.25 * fadeT);
          g.strokeCircle(p.x, p.y, baseRadius);
          return;
        }

        // ---- OPEN — solid separation-weighted ring + draining arc ----
        const windowFrac = Phaser.Math.Clamp(timeUntilClose / w.duration, 0, 1);
        const urgent = timeUntilClose < 200 || windowFrac < 0.25;
        const critical = timeUntilClose < 100 || windowFrac < 0.12;
        const pulseHz = critical ? 6 : urgent ? 3.5 : 1.6;
        const pulse = 0.85 + Math.sin(elapsed * 0.001 * pulseHz * Math.PI * 2) * (critical ? 0.15 : 0.08);
        const ringAlpha = (0.55 + openness * 0.35) * pulse;
        const ringRadius = baseRadius * pulse;

        g.lineStyle(thickness, isPrimary ? 0x38bdf8 : 0x94a3b8, ringAlpha);
        g.strokeCircle(p.x, p.y, ringRadius);

        // the countdown arc — 12 o'clock, sweeps clockwise, drains to
        // nothing right as the window shuts. The signature "throw now" cue.
        const arcColor = critical ? 0xef4444 : urgent ? 0xfbbf24 : 0x38bdf8;
        g.lineStyle(thickness + 1, arcColor, critical ? 0.95 : 0.75);
        const start = -Math.PI / 2;
        g.beginPath();
        g.arc(p.x, p.y, ringRadius + 4, start, start + Math.PI * 2 * windowFrac, false);
        g.strokePath();

        // priority-1 tick — a small mark, not a new number/label (the 1-4
        // tags already own "who")
        if (isPrimary) {
          g.fillStyle(0x38bdf8, 0.9);
          g.fillTriangle(
            p.x - 3, p.y - ringRadius - 6,
            p.x + 3, p.y - ringRadius - 6,
            p.x, p.y - ringRadius - 1
          );
        }
      });
    }

    // ---- walks a receiver's remaining route waypoints forward by a fixed
    // distance to predict where he'll actually be — following the real
    // path (including a route break partway through) instead of just the
    // direction of the very next waypoint, which is wrong right at a cut.
    // Once his route's finished, it falls back to the same slow forward
    // drift updateOffenseRoutes gives a receiver as a late checkdown. ----
    getPointAlongRoute(receiver, lookaheadDist) {
      let x = receiver.x, y = receiver.y;
      let remaining = Math.max(0, lookaheadDist);
      let idx = receiver.routeIndex || 0;
      const wps = receiver.routeWaypoints;
      if (wps) {
        while (remaining > 0 && idx < wps.length) {
          const wp = wps[idx];
          const dx = wp.x - x, dy = wp.y - y;
          const segDist = Math.sqrt(dx * dx + dy * dy);
          if (segDist <= remaining) {
            x = wp.x; y = wp.y; remaining -= segDist; idx++;
          } else {
            const t = segDist > 0 ? remaining / segDist : 0;
            x += dx * t; y += dy * t;
            remaining = 0;
          }
        }
      }
      if (remaining > 0) x += remaining * 0.4;
      return { x, y };
    }

    releaseThrow() {
      const THROW_SPEED = 8.2;      // ball's constant 2D speed (px per nominal 60fps tick)
      this.ball.carriedBy = null;
      this.ball.inFlight = true;
      this.ball.pastPeak = false;
      this.ball.x = this.qb.throwHandX;
      this.ball.y = this.qb.throwHandY;
      this.ball.prevX = this.ball.x;
      this.ball.prevY = this.ball.y;
      this.ball.flightMs = 0;
      this.ball.passTarget = null;

      const target = this.pickThrowTarget();
      let vx = OFFENSE_DIR * THROW_SPEED; // a QB never accidentally throws it behind his own line
      let vy = 0;
      let ticks = 10; // fallback hang-time (nominal 60fps ticks) when nobody's a legal target

      if (target) {
        // two-pass lead prediction: estimate flight time to his CURRENT
        // spot, walk him that far along his actual remaining route, then
        // redo the flight-time estimate off THAT predicted point once
        // more (two passes converges fine for an arcade throw — no need
        // for a real interception solver). Using THROW_SPEED as the
        // distance/time constant here isn't an approximation: the final
        // ball velocity below is built to have exactly that magnitude, so
        // the same constant applies on the real throw too.
        let dist = Math.hypot(target.x - this.ball.x, target.y - this.ball.y);
        let t = Phaser.Math.Clamp(dist / THROW_SPEED, 4, 90);
        let lead = this.getPointAlongRoute(target, RECEIVER_SPEED * t * 0.6);
        dist = Math.hypot(lead.x - this.ball.x, lead.y - this.ball.y);
        t = Phaser.Math.Clamp(dist / THROW_SPEED, 4, 90);
        lead = this.getPointAlongRoute(target, RECEIVER_SPEED * t * 0.6);

        let dx = lead.x - this.ball.x, dy = lead.y - this.ball.y;
        // never actually throw backward toward his own end zone — checked
        // against OFFENSE_DIR (the fixed driving direction), NOT
        // qb.facing, which is just whichever way he's currently strafing
        // and flips constantly while scrambling; using facing here was
        // the bug that sent throws the wrong way whenever you were
        // holding left/A (a completely normal thing to do in the pocket)
        // at the moment you released
        if (Math.sign(dx || OFFENSE_DIR) !== OFFENSE_DIR) dx = OFFENSE_DIR * 4;
        const d = Math.hypot(dx, dy) || 1;
        vx = (dx / d) * THROW_SPEED;
        vy = (dy / d) * THROW_SPEED;
        ticks = Phaser.Math.Clamp(d / THROW_SPEED, 4, 90);
        this.ball.passTarget = target;
      }
      this.ball.vx = vx;
      this.ball.vy = vy;

      // ---- resolution is timed off real elapsed flight time now, not the
      // height arc (a mismatched heightVel/gravity pair used to send the
      // ball hundreds of pixels past the target before it ever came back
      // down into a "catchable" height band). minResolveMs keeps the ball
      // from being scooped up a foot from the QB's hand; maxFlightMs is a
      // hard stop so a miss goes incomplete right around where the throw
      // was actually aimed instead of sailing on. The arc below is now
      // purely cosmetic, it doesn't gate anything. ----
      this.ball.minResolveMs = Math.max(110, ticks * 16.667 * 0.8);
      this.ball.maxFlightMs = ticks * 16.667 * 1.35 + 150;
      this.ball.height = 6;
      this.ball.heightVel = Phaser.Math.Clamp(2.4 + ticks * 0.05, 2.4, 4.6);
      this.ball.gravity = 0.05;
      this.phase = 'live-pass-air';
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(500, 0.05); } catch (e) {}
      }
    }

    // ---- resolves a pass in the air once it's had enough flight time.
    // Distance is measured to the SWEPT segment the ball traveled this
    // frame (prevX/prevY -> x/y), not just its current point — a fast
    // throw can cross a whole catch radius between two frames without
    // ever landing a point-check inside it. The intended target (whoever
    // releaseThrow() actually aimed at) gets a little forgiveness so a
    // defender who happens to be a couple pixels closer doesn't snatch an
    // accurate throw away from the guy it was actually thrown to; beyond
    // that his separation from the nearest defender still rolls
    // interception risk using the PDF's own breakpoints. ----
    resolveAirBall() {
      const offAssignments = this.currentOffensePlay.assignments;
      const speed = Math.hypot(this.ball.vx, this.ball.vy);
      const effRadius = CATCH_RADIUS + Math.min(speed * 0.5, 10);
      const TARGET_BONUS = 8; // px of extra forgiveness for the intended receiver

      let nearestOff = null, offDist = Infinity;
      for (const p of this.offenseFormation) {
        const a = offAssignments[p.role];
        if (!a || (a.type !== 'route' && a.type !== 'clear')) continue;
        let dist = distanceToSegment(p.x, p.y, this.ball.prevX, this.ball.prevY, this.ball.x, this.ball.y);
        if (p === this.ball.passTarget) dist -= TARGET_BONUS;
        if (dist < offDist) { offDist = dist; nearestOff = p; }
      }
      let nearestDef = null, defDist = Infinity;
      for (const d of this.defenseFormation) {
        const dist = distanceToSegment(d.x, d.y, this.ball.prevX, this.ball.prevY, this.ball.x, this.ball.y);
        if (dist < defDist) { defDist = dist; nearestDef = d; }
      }
