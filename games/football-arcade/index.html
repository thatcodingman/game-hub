      if (nearestDef && defDist < effRadius && defDist < offDist) {
        this.interceptedBy(nearestDef);
        return;
      }
      if (nearestOff && offDist < effRadius) {
        const sep = this.nearestDefenderSeparation(nearestOff.x, nearestOff.y);
        // ---- three-way outcome, all driven by that same separation
        // number: CATCH / DROP (contested — the ball got there, he just
        // couldn't bring it in) / INTERCEPTION. Before this, anything that
        // wasn't a pick was an automatic catch, so tight coverage only
        // ever showed up as "sometimes he picks it" — nothing made a
        // contested catch actually risky to attempt. Even a wide-open
        // throw isn't a guaranteed catch any more (95%), same as a real
        // route — receivers drop easy ones occasionally. ----
        let catchChance, intRisk;
        if (sep < 15) { catchChance = 0.35; intRisk = 0.35; }
        else if (sep < 25) { catchChance = 0.55; intRisk = 0.20; }
        else if (sep < 40) { catchChance = 0.72; intRisk = 0.10; }
        else if (sep < 60) { catchChance = 0.85; intRisk = 0.03; }
        else { catchChance = 0.95; intRisk = 0; }

        const roll = Math.random();
        if (roll < intRisk) {
          let picker = null, pd = Infinity;
          for (const d of this.defenseFormation) {
            const dx = nearestOff.x - d.x, dy = nearestOff.y - d.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < pd) { pd = dist; picker = d; }
          }
          this.interceptedBy(picker);
        } else if (roll < intRisk + catchChance) {
          this.completePass(nearestOff);
        } else {
          this.incompletePass('DROPPED PASS');
        }
      }
    }

    completePass(receiver) {
      if (this.phase === 'dead-ball') return;
      this.ball.inFlight = false; this.ball.vx = 0; this.ball.vy = 0; this.ball.heightVel = 0; this.ball.height = 0;
      this.ball.carriedBy = receiver.role;
      this.liveCarrier = receiver;
      this.chaseMode = true;
      this.phase = 'live-run';
      this.resetBreakMeter(receiver);
      this.hint.setText('WASD to run · Shift/Q/E to juke/spin/stiff-arm · Space to go down');
      this.followTarget.set(receiver.x, receiver.y);
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(650, 0.05); } catch (e) {}
      }
    }

    interceptedBy(defender) {
      if (this.phase === 'dead-ball') return;
      this.phase = 'dead-ball';
      this.clock.running = false;
      this.ball.inFlight = false; this.ball.vx = 0; this.ball.vy = 0; this.ball.heightVel = 0; this.ball.height = 0;
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(150, 0.08); } catch (e) {}
      }
      this.showPlayMessage('INTERCEPTED!', 'POSSESSION CHANGE', () => this.awayPossession());
    }

    incompletePass(headline) {
      if (this.phase === 'dead-ball') return;
      this.phase = 'dead-ball';
      this.clock.running = false;
      this.ball.inFlight = false; this.ball.vx = 0; this.ball.vy = 0; this.ball.heightVel = 0; this.ball.height = 0;
      this.drive.down += 1;
      let turnover = false, sub = headline === 'DROPPED PASS' ? 'DROPPED' : 'INCOMPLETE';
      if (this.drive.down > 4) { turnover = true; sub += ' — TURNOVER ON DOWNS'; }
      this.driveSpotX = this.drive.losX;
      this.showPlayMessage(headline || 'INCOMPLETE PASS', sub, () => {
        if (turnover) this.awayPossession(); else this.startPresnap(false);
      });
    }

    sackQB() {
      if (this.phase !== 'live-pass') return;
      const spot = Phaser.Math.Clamp(this.qb.x, LEFT_GOAL_X + 2, RIGHT_GOAL_X - 2);
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(120, 0.09); } catch (e) {}
      }
      this.endLivePlayAt(spot, 'SACKED!');
    }

    downCarrier() {
      if (this.phase !== 'live-run' || !this.liveCarrier) return;
      const spot = Phaser.Math.Clamp(this.liveCarrier.x, LEFT_GOAL_X + 2, RIGHT_GOAL_X - 2);
      this.endLivePlayAt(spot, 'DOWN');
    }

    tackleCarrier() {
      if (this.phase !== 'live-run' || !this.liveCarrier) return;
      const spot = Phaser.Math.Clamp(this.liveCarrier.x, LEFT_GOAL_X + 2, RIGHT_GOAL_X - 2);
      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(150, 0.07); } catch (e) {}
      }
      this.endLivePlayAt(spot, 'TACKLED');
    }

    // ---- shared "the down just ended here" resolver for every live-drive
    // outcome (tackle, going down, a sack) — updates down/distance/LOS and
    // either sets up the next down or hands the ball over on downs. ----
    endLivePlayAt(x, headline) {
      if (this.phase === 'dead-ball') return;
      this.phase = 'dead-ball';
      this.clock.running = false;

      const yardsGained = Math.round((x - this.drive.losX) / PX_PER_YARD);
      let sub = (yardsGained >= 0 ? '+' : '') + yardsGained + ' YD' + (Math.abs(yardsGained) === 1 ? '' : 'S');

      this.drive.toGo -= yardsGained;
      this.drive.down += 1;
      let turnover = false;
      if (this.drive.toGo <= 0) {
        this.drive.down = 1;
        this.drive.toGo = 10;
        sub += ' — 1ST DOWN';
      } else if (this.drive.down > 4) {
        turnover = true;
        sub += ' — TURNOVER ON DOWNS';
      }
      this.drive.losX = Phaser.Math.Clamp(x, LEFT_GOAL_X + 5, RIGHT_GOAL_X - 5);
      this.driveSpotX = this.drive.losX;

      this.showPlayMessage(headline, sub, () => {
        if (turnover) this.awayPossession(); else this.startPresnap(false);
      });
    }

    // ---- away's "possession" between your drives — a real (simulated)
    // set of downs for the other team, not just handing you the ball right
    // back. No manual-defense/mirrored-offense engine yet, so it's resolved
    // as a quick AI-vs-AI sequence with its own down/distance and the same
    // no-punts/4th-down-or-bust rule as your drives; it can score (AWAY
    // points go up for real) or turn it over on downs, then a real,
    // player-returnable kickoff brings the ball back to you. ----
    awayPossession() {
      this.phase = 'dead-ball';
      this.clock.running = false;
      let down = 1, toGo = 10, progress = 0;
      const yardsToScore = 75;

      const playOne = () => {
        const gain = Phaser.Math.Between(-2, 12);
        progress += gain;
        if (progress >= yardsToScore) {
          this.score.away += 6;
          this.scoreLabel.setText('HOME ' + this.score.home + ' — AWAY ' + this.score.away);
          this.showPlayMessage('AWAY TOUCHDOWN', 'HOME ' + this.score.home + ' — AWAY ' + this.score.away, () => this.teeUpKickoff());
          return;
        }
        down += 1;
        toGo -= gain;
        let sub = (gain >= 0 ? '+' : '') + gain + ' YDS';
        if (toGo <= 0) {
          down = 1; toGo = 10;
          sub += ' — AWAY 1ST DOWN';
        } else if (down > 4) {
          this.showPlayMessage('AWAY TURNOVER ON DOWNS', 'BALL BACK TO HOME', () => this.teeUpKickoff());
          return;
        }
        this.showPlayMessage('AWAY BALL', sub, playOne);
      };

      this.showPlayMessage('KICKOFF', 'AWAY RECEIVES AND DRIVES', playOne);
    }

    // ---- shared movement/animation for whoever's currently controllable
    // as a runner outside of the QB (the returner, both while positioning
    // under the kick and while running with it) ----
    updateReturnerMovement(dt) {
      let vx = 0, vy = 0;
      if (this.keys.left.isDown || this.keys.leftArrow.isDown) { vx = -1; this.returner.facing = -1; }
      else if (this.keys.right.isDown || this.keys.rightArrow.isDown) { vx = 1; this.returner.facing = 1; }
      if (this.keys.up.isDown || this.keys.upArrow.isDown) vy = -1;
      else if (this.keys.down.isDown || this.keys.downArrow.isDown) vy = 1;
      if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
      const moving = vx !== 0 || vy !== 0;

      this.returner.x = Phaser.Math.Clamp(this.returner.x + vx * PLAYER_SPEED, 20, WORLD_W - 20);
      this.returner.y = Phaser.Math.Clamp(this.returner.y + vy * PLAYER_SPEED, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);

      this.returner.gaitAmp += ((moving ? 1 : 0) - this.returner.gaitAmp) * 0.25;
      if (moving) {
        this.returner.animPhase += dt * 0.012;
        if (this.returner.animPhase > Math.PI * 2) this.returner.animPhase -= Math.PI * 2;
      }

      drawFootballPlayer(this.returner.gfx, this.returner.x, this.returner.y, this.returner.facing, this.returner.body, {
        legPhase: this.returner.animPhase, gaitAmp: this.returner.gaitAmp, spinRot: this.returner.spinRot || 0
      });
      this.followTarget.set(this.returner.x, this.returner.y);

      if (this.phase === 'kickoff-return') this.updateBreakMeterBookkeeping(this.returner, dt);
    }

    // ---- QB movement/throw-windup + redraw, shared by the presnap hold
    // (movement locked, just redrawing so the snap has a hand position to
    // target) and the live pass play (full WASD scramble + SPACE to throw) ----
    updateQBMovement(dt) {
      if (this.ball.snapped && this.phase === 'live-pass') {
        const throwing = !!this.qb.throwState;
        const locked = throwing && this.qb.throwState.t / this.qb.throwState.duration > 0.4;
        let vx = 0, vy = 0;
        if (!locked) {
          if (this.keys.left.isDown || this.keys.leftArrow.isDown) { vx = -1; this.qb.facing = -1; }
          else if (this.keys.right.isDown || this.keys.rightArrow.isDown) { vx = 1; this.qb.facing = 1; }
          if (this.keys.up.isDown || this.keys.upArrow.isDown) vy = -1;
          else if (this.keys.down.isDown || this.keys.downArrow.isDown) vy = 1;
        }
        if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
        const moving = vx !== 0 || vy !== 0;

        this.qb.x = Phaser.Math.Clamp(this.qb.x + vx * PLAYER_SPEED, 20, WORLD_W - 20);
        this.qb.y = Phaser.Math.Clamp(this.qb.y + vy * PLAYER_SPEED, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);

        this.qb.gaitAmp += ((moving ? 1 : 0) - this.qb.gaitAmp) * 0.25;
        if (moving) {
          this.qb.animPhase += dt * 0.012;
          if (this.qb.animPhase > Math.PI * 2) this.qb.animPhase -= Math.PI * 2;
        }

        if (this.qb.throwState) {
          this.qb.throwState.t += dt;
          if (this.qb.throwState.t >= this.qb.throwState.duration) {
            this.releaseThrow();
            this.qb.throwState = null;
          }
        }

        // a scrambling QB can walk it in himself
        if (this.ball.carriedBy === 'qb' && this.qb.x >= RIGHT_GOAL_X) { this.scoreTouchdown(); return; }
      }

      if (this.ball.carriedBy === 'qb') { this.ball.x = this.qb.throwHandX; this.ball.y = this.qb.throwHandY; }
      this.redrawQB();
      if (this.ball.carriedBy === 'qb') { this.ball.x = this.qb.throwHandX; this.ball.y = this.qb.throwHandY; }

      if (this.ball.snapped && this.phase === 'live-pass' && this.ball.carriedBy === 'qb') {
        this.updateBreakMeterBookkeeping(this.qb, dt);
      }
    }

    // ---- generic route runner — any offense player with a 'route' or
    // 'clear' assignment walks their waypoints (computed once at the snap,
    // relative to their own presnap spot) in order, then drifts slowly
    // forward as a late checkdown once the route's finished. ----
    updateOffenseRoutes(dt) {
      const assignments = this.currentOffensePlay.assignments;
      for (const p of this.offenseFormation) {
        const a = assignments[p.role];
        if (!a || (a.type !== 'route' && a.type !== 'clear') || !p.routeWaypoints) continue;

        if (p.routeIndex < p.routeWaypoints.length) {
          const wp = p.routeWaypoints[p.routeIndex];
          const dx = wp.x - p.x, dy = wp.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 4) {
            p.routeIndex++;
          } else {
            const moveX = (dx / dist) * RECEIVER_SPEED, moveY = (dy / dist) * RECEIVER_SPEED;
            p.x += moveX; p.y += moveY;
            if (Math.abs(moveX) > 0.05) p.facing = moveX > 0 ? 1 : -1;
          }
        } else {
          p.x += 0.4; // route's done — drift on as a late checkdown option
        }
        p.x = Phaser.Math.Clamp(p.x, 20, WORLD_W - 20);
        p.y = Phaser.Math.Clamp(p.y, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
        p.gaitAmp = Math.min(1, (p.gaitAmp || 0) + 0.08);
        p.animPhase = (p.animPhase || 0) + dt * 0.014;
        if (p.animPhase > Math.PI * 2) p.animPhase -= Math.PI * 2;
        drawFootballPlayer(p.gfx, p.x, p.y, p.facing, p.body, { legPhase: p.animPhase, gaitAmp: p.gaitAmp });
      }
    }

    // ---- generic blocker — any offense player with a 'runBlock',
    // 'passBlock' or 'block' assignment seeks the nearest unblocked
    // defender and locks them up on contact. Exactly the same engage +
    // lock-timer + cooldown pattern already proven on kickoff blockers, so
    // no single matchup turns into a permanent every-frame re-lock. Pass
    // blockers hold closer to the pocket; run blockers drive further. ----
    updateOffenseBlocking(dt) {
      const assignments = this.currentOffensePlay.assignments;
      for (const p of this.offenseFormation) {
        const a = assignments[p.role];
        if (!a || (a.type !== 'runBlock' && a.type !== 'passBlock' && a.type !== 'block')) continue;

        if (p.cooldown > 0) {
          p.cooldown -= dt;
          // still "in" the block, not just frozen — hands-up punch pose
          // pulsing on strugglePhase, plus a small forward jitter, so a
          // locked-up matchup reads as an active shove, not two players
          // standing still
          p.strugglePhase = (p.strugglePhase || 0) + dt;
          const jitter = Math.sin(p.strugglePhase * 0.02) * 1.6;
          drawFootballPlayer(p.gfx, p.x + jitter, p.y, p.facing, p.body, { legPhase: p.strugglePhase * 0.012, gaitAmp: 0.2, blocking: true });
          continue;
        }

        let target = null, bestDist = Infinity;
        for (const d of this.defenseFormation) {
          if (d.blockTimer > 0) continue;
          const dx = d.x - p.x, dy = d.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) { bestDist = dist; target = d; }
        }

        let closingIn = false;
        if (target && bestDist < OL_ENGAGE_RADIUS) {
          target.blockTimer = OL_BLOCK_DURATION;
          target.strugglePhase = 0;
          p.cooldown = OL_BLOCK_DURATION + 400;
          p.strugglePhase = 0;
          if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
            try { SFX.tone(180, 0.05); } catch (e) {}
          }
        } else if (target) {
          const dx = target.x - p.x, dy = target.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const holdsPocket = a.type === 'passBlock' || a.type === 'block';
          const speed = holdsPocket ? 1.6 : BLOCKER_SPEED;
          let moveX = (dx / dist) * speed, moveY = (dy / dist) * speed;
          if (holdsPocket && Math.abs((p.x + moveX) - p.homeX) > 16) moveX = 0;
          p.x = Phaser.Math.Clamp(p.x + moveX, 20, WORLD_W - 20);
          p.y = Phaser.Math.Clamp(p.y + moveY, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
          if (Math.abs(moveX) > 0.05) p.facing = moveX > 0 ? 1 : -1;
          p.gaitAmp = Math.min(1, (p.gaitAmp || 0) + 0.08);
          // hands come up once he's closing in on his man, not from the snap
          closingIn = dist < OL_ENGAGE_RADIUS * 2.5;
        }

        p.animPhase = (p.animPhase || 0) + dt * 0.014;
        if (p.animPhase > Math.PI * 2) p.animPhase -= Math.PI * 2;
        drawFootballPlayer(p.gfx, p.x, p.y, p.facing, p.body, { legPhase: p.animPhase, gaitAmp: p.gaitAmp, blocking: closingIn });
      }
    }

    // ---- generic defense — rush/man/zone per the called defense, only
    // used before the ball's live with a carrier (chaseMode off). A rusher
    // that gets a clean run at the QB sacks him; man defenders track their
    // assigned player's live position; zone defenders hold their anchor
    // and drift toward whichever route-runner wanders closest. ----
    updateDefenseAssignments(dt) {
      const defAssignments = this.currentDefensePlay.assignments;
      const offAssignments = this.currentOffensePlay.assignments;
      let qbSacked = false;

      for (const d of this.defenseFormation) {
        if (d.blockTimer > 0) {
          d.blockTimer -= dt;
          // being blocked isn't standing still either — push back against
          // the jitter from the other side so the two dots visibly grapple
          d.strugglePhase = (d.strugglePhase || 0) + dt;
          const jitter = Math.sin(d.strugglePhase * 0.02 + Math.PI) * 1.6;
          drawFootballPlayer(d.gfx, d.x + jitter, d.y, d.facing, d.body, { legPhase: d.strugglePhase * 0.012, gaitAmp: 0.2, blocking: true });
          continue;
        }

        const a = defAssignments[d.role];
        let targetX = d.x, targetY = d.y, speed = ZONE_SPEED;

        if (a && a.type === 'man') {
          const tgt = this.offenseFormation.find(o => o.role === a.target);
          if (tgt) {
            // reaction lag — defender tracks a trailing "sensed" point instead
            // of the receiver's exact live position, so a hard cut buys the
            // receiver a beat of real separation instead of getting mirrored
            // instantly. trackX/trackY chase the real target at a limited rate.
            if (d.trackX === undefined) { d.trackX = tgt.x; d.trackY = tgt.y; }
            const lag = 0.08; // lower = slower to react, easier to beat
            d.trackX = Phaser.Math.Linear(d.trackX, tgt.x, lag);
            d.trackY = Phaser.Math.Linear(d.trackY, tgt.y, lag);
            targetX = d.trackX; targetY = d.trackY;
          }
          speed = MAN_COVERAGE_SPEED;
        } else if (a && a.type === 'zone') {
          const z = ZONES[a.zone];
          const anchorX = this.drive.losX + z.depth * PX_PER_YARD;
          const anchorY = this.snapY + z.lateral;
          let nearest = null, bestDist = Infinity;
          for (const o of this.offenseFormation) {
            const oa = offAssignments[o.role];
            if (!oa || (oa.type !== 'route' && oa.type !== 'clear')) continue;
            const dx = o.x - anchorX, dy = o.y - anchorY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 70 && dist < bestDist) { bestDist = dist; nearest = o; }
          }
          targetX = nearest ? Phaser.Math.Linear(anchorX, nearest.x, 0.6) : anchorX;
          targetY = nearest ? Phaser.Math.Linear(anchorY, nearest.y, 0.6) : anchorY;
          speed = ZONE_SPEED;
        } else if (a && a.type === 'rush') {
          targetX = this.qb.x; targetY = this.qb.y;
          speed = RUSHER_SPEED;
          const dx = this.qb.x - d.x, dy = this.qb.y - d.y;
          if (Math.sqrt(dx * dx + dy * dy) < SACK_RADIUS && this.ball.carriedBy === 'qb' && !this.qb.throwState) {
            // same Break Meter payoff as an open-field tackle: an active
            // evasion window or the flat shrug-off chance spins the QB
            // out of the sack instead of ending the play
            if (this.qb.evasionT > 0 || Math.random() < 0.08) {
              d.blockTimer = 420;
              d.strugglePhase = 0;
              this.qb.evasionT = 0;
              this.qb.brokenTackles = (this.qb.brokenTackles || 0) + 1;
              this.showBreakPopup(this.qb, 'BROKEN TACKLE!', '#22c55e');
              if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
                try { SFX.tone(330, 0.06); } catch (e) {}
              }
            } else {
              qbSacked = true;
            }
          }
        }

        const dx = targetX - d.x, dy = targetY - d.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
          const moveX = (dx / dist) * speed, moveY = (dy / dist) * speed;
          d.x = Phaser.Math.Clamp(d.x + moveX, 20, WORLD_W - 20);
          d.y = Phaser.Math.Clamp(d.y + moveY, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
          if (Math.abs(moveX) > 0.05) d.facing = moveX > 0 ? 1 : -1;
          d.gaitAmp = Math.min(1, (d.gaitAmp || 0) + 0.08);
        } else {
          d.gaitAmp = Math.max(0, (d.gaitAmp || 0) - 0.1);
        }
        d.animPhase = (d.animPhase || 0) + dt * 0.014;
        if (d.animPhase > Math.PI * 2) d.animPhase -= Math.PI * 2;
        drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, { legPhase: d.animPhase, gaitAmp: d.gaitAmp });
      }

      if (qbSacked) this.sackQB();
    }

    // ---- once the ball's live with a carrier (handoff, or a caught pass),
    // every defender switches to simple pursuit + tackle — the exact same
    // pattern already proven chasing the kickoff returner, just generalized
    // to chase whoever this.liveCarrier currently is. ----
    updateChasePursuit(dt) {
      const carrier = this.liveCarrier;
      if (!carrier) return;
      for (const d of this.defenseFormation) {
        if (d.blockTimer > 0) {
          d.blockTimer -= dt;
          d.gaitAmp = Math.max(0, (d.gaitAmp || 0) - 0.1);
          d.animPhase = (d.animPhase || 0) + dt * 0.004;
          drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, { legPhase: d.animPhase, gaitAmp: d.gaitAmp });
          continue;
        }

        const dx = carrier.x - d.x, dy = carrier.y - d.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const moveX = (dx / dist) * COVERAGE_SPEED, moveY = (dy / dist) * COVERAGE_SPEED;
        d.x = Phaser.Math.Clamp(d.x + moveX, 20, WORLD_W - 20);
        d.y = Phaser.Math.Clamp(d.y + moveY, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
        if (Math.abs(moveX) > 0.05) d.facing = moveX > 0 ? 1 : -1;
        d.gaitAmp = Math.min(1, (d.gaitAmp || 0) + 0.08);
        d.animPhase = (d.animPhase || 0) + dt * 0.014;
        if (d.animPhase > Math.PI * 2) d.animPhase -= Math.PI * 2;
        drawFootballPlayer(d.gfx, d.x, d.y, d.facing, d.body, { legPhase: d.animPhase, gaitAmp: d.gaitAmp });

        const tdx = carrier.x - d.x, tdy = carrier.y - d.y;
        if (Math.sqrt(tdx * tdx + tdy * tdy) < TACKLE_RADIUS) {
          // Break Meter payoff: an active evasion window (juke/spin) or a
          // flat 8% "shrugged it off" chance breaks the tackle instead of
          // ending the play — the defender stumbles (reuses the same
          // blockTimer stumble/jitter every blocked defender already
          // draws with) and the carrier plays on.
          if (carrier.evasionT > 0 || Math.random() < 0.08) {
            d.blockTimer = 420;
            d.strugglePhase = 0;
            carrier.evasionT = 0;
            carrier.brokenTackles = (carrier.brokenTackles || 0) + 1;
            this.showBreakPopup(carrier, 'BROKEN TACKLE!', '#22c55e');
            if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
              try { SFX.tone(330, 0.06); } catch (e) {}
            }
            continue;
          }
          this.tackleCarrier();
          break;
        }
      }
    }

    // ---- Break Meter — the runner's skill layer. A resource (0-100) that
    // slowly regenerates while he's on his feet and spends on three moves:
    // JUKE (quick lateral dodge), SPIN (360, breaks a tackle attempted
    // head-on), STIFF ARM (shoves the nearest defender in range off his
    // feet). Juke/spin open a brief "evasion window" where a tackle
    // attempt breaks instead of landing; stiff arm doesn't dodge so much
    // as directly stagger whoever's closest. There's also a small flat
    // chance to shrug off a tackle even with no move active — real backs
    // break arm tackles sometimes without doing anything fancy. ----
    resetBreakMeter(carrier) {
      carrier.breakMeter = 100;
      carrier.moveCooldown = 0;
      carrier.evasionT = 0;
      carrier.brokenTackles = 0;
      carrier.spinAnimMs = null;
      carrier.spinRot = 0;
    }

    // ---- whoever currently "has the ball" in a juke-able sense: the RB/
    // receiver on a run or after a catch, the QB any time he's holding it
    // (pocket or scrambling, not mid-throw), or the kickoff returner once
    // he's caught it. One resolver so tryBreakMove/HUD/bookkeeping all
    // agree on the same carrier without re-deriving the phase logic. ----
    activeCarrier() {
      if (this.phase === 'live-run' && this.liveCarrier) return this.liveCarrier;
      if (this.phase === 'live-pass' && this.ball.carriedBy === 'qb' && !this.qb.throwState) return this.qb;
      if (this.phase === 'kickoff-return' && this.returner && this.returner.active) return this.returner;
      return null;
    }

    tryBreakMove(type) {
      const carrier = this.activeCarrier();
      if (!carrier) return;
      if ((carrier.moveCooldown || 0) > 0) return;
      const COSTS = { juke: 22, spin: 32, stiffarm: 28 };
      const cost = COSTS[type];
      if ((carrier.breakMeter == null ? 100 : carrier.breakMeter) < cost) return;

      // the pool of defenders a stiff arm can stagger depends on which
      // phase we're in — kickoff return is covered by this.coverage, an
      // open-field run/catch or a scrambling QB by this.defenseFormation
      const defenders = this.phase === 'kickoff-return' ? this.coverage : this.defenseFormation;

      carrier.breakMeter -= cost;
      carrier.moveCooldown = 520;

      if (type === 'juke') {
        carrier.evasionT = 300;
        // dodge whichever way you're already leaning, so the move reads
        // as a response to your own input rather than a random hop
        let kick = 0;
        if (this.keys.up.isDown || this.keys.upArrow.isDown) kick = -1;
        else if (this.keys.down.isDown || this.keys.downArrow.isDown) kick = 1;
        else kick = Phaser.Math.Between(0, 1) ? 1 : -1;
        carrier.y = Phaser.Math.Clamp(carrier.y + kick * 24, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
        this.showBreakPopup(carrier, 'JUKE!', '#38bdf8');
      } else if (type === 'spin') {
        carrier.evasionT = 380;
        carrier.spinAnimMs = 0;
        carrier.spinAnimDur = 380;
        this.showBreakPopup(carrier, 'SPIN!', '#a78bfa');
      } else if (type === 'stiffarm') {
        carrier.evasionT = 160;
        let target = null, bestDist = Infinity;
        for (const d of defenders) {
          if (d.blockTimer > 0) continue;
          const dx = d.x - carrier.x, dy = d.y - carrier.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 34 && dist < bestDist) { bestDist = dist; target = d; }
        }
        if (target) {
          target.blockTimer = 480;
          target.strugglePhase = 0;
          const dx = target.x - carrier.x, dy = target.y - carrier.y;
          const d2 = Math.sqrt(dx * dx + dy * dy) || 1;
          target.x = Phaser.Math.Clamp(target.x + (dx / d2) * 18, 20, WORLD_W - 20);
          target.y = Phaser.Math.Clamp(target.y + (dy / d2) * 18, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);
        }
        this.showBreakPopup(carrier, 'STIFF ARM!', '#fb923c');
      }

      if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
        try { SFX.tone(type === 'spin' ? 420 : type === 'stiffarm' ? 240 : 560, 0.05); } catch (e) {}
      }
    }

    showBreakPopup(carrier, text, color) {
      this.breakPopupText.setText(text);
      this.breakPopupText.setColor(color || '#fbbf24');
      this.breakPopupText.setPosition(carrier.x, carrier.y - carrier.body.torsoH - 26);
      this.breakPopupText.setVisible(true);
      this.breakPopupTimer = 650;
    }

    // ---- shared Break Meter upkeep (regen, cooldown/evasion countdown,
    // HUD bar + ring + popup timer) — called from whichever movement
    // function currently owns the active carrier (RB/receiver, QB, or the
    // kickoff returner) so the bar/ring track the right guy either way. ----
    updateBreakMeterBookkeeping(carrier, dt) {
      carrier.moveCooldown = Math.max(0, (carrier.moveCooldown || 0) - dt);
      carrier.evasionT = Math.max(0, (carrier.evasionT || 0) - dt);
      carrier.breakMeter = Math.min(100, (carrier.breakMeter == null ? 100 : carrier.breakMeter) + dt * 0.015);

      // ---- spin move's actual 360 — advances a rotation timer that the
      // draw call turns into a real Graphics rotation, not a fake lean ----
      if (carrier.spinAnimMs != null) {
        carrier.spinAnimMs += dt;
        if (carrier.spinAnimMs >= carrier.spinAnimDur) {
          carrier.spinAnimMs = null;
          carrier.spinRot = 0;
        } else {
          carrier.spinRot = (carrier.spinAnimMs / carrier.spinAnimDur) * Math.PI * 2;
        }
      }

      this.breakMeterLabel.setVisible(true);
      this.breakMeterBg.setVisible(true);
      this.breakMeterFill.setVisible(true);
      const pct = Phaser.Math.Clamp(carrier.breakMeter / 100, 0, 1);
      this.breakMeterFill.setSize(Math.max(2, 146 * pct), 6);
      this.breakMeterFill.setFillStyle(pct > 0.55 ? 0x22c55e : pct > 0.25 ? 0xfbbf24 : 0xef4444, 1);

      this.breakRing.clear();
      if (carrier.evasionT > 0) {
        this.breakRing.lineStyle(2.5, 0x38bdf8, 0.85);
        this.breakRing.strokeCircle(carrier.x, carrier.y, 17);
      }

      if (this.breakPopupTimer > 0) {
        this.breakPopupTimer -= dt;
        this.breakPopupText.setPosition(carrier.x, carrier.y - carrier.body.torsoH - 26);
        if (this.breakPopupTimer <= 0) this.breakPopupText.setVisible(false);
      }
    }

    // ---- generic WASD ball-carrier mover — parameterized by whichever
    // formation player object is currently live (the RB on a run play, or
    // a receiver after the catch), rather than hardcoded to one role. ----
    updateLiveCarrierMovement(carrier, dt) {
      if (!carrier) return;
      let vx = 0, vy = 0;
      if (this.keys.left.isDown || this.keys.leftArrow.isDown) { vx = -1; carrier.facing = -1; }
      else if (this.keys.right.isDown || this.keys.rightArrow.isDown) { vx = 1; carrier.facing = 1; }
      if (this.keys.up.isDown || this.keys.upArrow.isDown) vy = -1;
      else if (this.keys.down.isDown || this.keys.downArrow.isDown) vy = 1;
      if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
      const moving = vx !== 0 || vy !== 0;

      carrier.x = Phaser.Math.Clamp(carrier.x + vx * PLAYER_SPEED, 20, WORLD_W - 20);
      carrier.y = Phaser.Math.Clamp(carrier.y + vy * PLAYER_SPEED, FIELD_TOP + 24, FIELD_TOP + FIELD_H - 24);

      carrier.gaitAmp = (carrier.gaitAmp || 0) + ((moving ? 1 : 0) - (carrier.gaitAmp || 0)) * 0.25;
      if (moving) {
        carrier.animPhase = (carrier.animPhase || 0) + dt * 0.012;
        if (carrier.animPhase > Math.PI * 2) carrier.animPhase -= Math.PI * 2;
      }

      drawFootballPlayer(carrier.gfx, carrier.x, carrier.y, carrier.facing, carrier.body, {
        legPhase: carrier.animPhase || 0, gaitAmp: carrier.gaitAmp || 0, spinRot: carrier.spinRot || 0
      });
      this.followTarget.set(carrier.x, carrier.y);
      this.ball.x = carrier.x + carrier.facing * 10;
      this.ball.y = carrier.y;
      if (carrier.x >= RIGHT_GOAL_X) this.scoreTouchdown();

      this.updateBreakMeterBookkeeping(carrier, dt);
    }

    ordinal(n) {
      const suf = ['th', 'st', 'nd', 'rd'], v = n % 100;
      return n + (suf[(v - 20) % 10] || suf[v] || suf[0]);
    }

    downDistanceLabel() {
      if (!this.drive) return '';
      const toGo = Math.max(1, Math.round(this.drive.toGo));
      return this.ordinal(this.drive.down) + ' & ' + toGo + ' · ' + this.yardLineLabel(this.drive.losX);
    }

    drawStadium() {
      // Fills the two margin bands (above/below the field, inside the same
      // world space) with a dark stand, jittered crowd-dot rows and a
      // handful of light towers along the top edge — pure Graphics, no
      // assets, drawn once behind the field.
      const g = this.add.graphics().setDepth(-1);
      const bands = [
        { y0: 0, y1: FIELD_TOP },
        { y0: FIELD_TOP + FIELD_H, y1: WORLD_H }
      ];
      const grays = [0x3a4150, 0x4b5468, 0x2c3240, 0x565f74];
      bands.forEach(b => {
        const bandH = b.y1 - b.y0;
        g.fillStyle(0x14181f, 1);
        g.fillRect(0, b.y0, WORLD_W, bandH);
        for (let r = 0; r < 4; r++) {
          const rowY = b.y0 + bandH * (0.22 + r * 0.2);
          for (let x = 8; x < WORLD_W; x += 9) {
            if (Math.random() < 0.15) continue; // gaps in the crowd
            const shade = grays[Phaser.Math.Between(0, grays.length - 1)];
            g.fillStyle(shade, 0.9);
            g.fillCircle(x + Phaser.Math.Between(-3, 3), rowY + Phaser.Math.Between(-2, 2), 2.3);
          }
        }
      });
      const towerCount = 6;
      for (let i = 0; i < towerCount; i++) {
        const tx = (WORLD_W / (towerCount + 1)) * (i + 1);
        g.fillStyle(0x6b7280, 1);
        g.fillRect(tx - 2, 2, 4, FIELD_TOP - 14);
        g.fillStyle(0xfde68a, 0.9);
        g.fillRect(tx - 10, 0, 20, 6);
      }
    }

    drawField() {
      const g = this.add.graphics().setDepth(0);

      for (let y = 0; y < TOTAL_YARDS; y += 5) {
        const x = y * PX_PER_YARD;
        const w = 5 * PX_PER_YARD;
        const isEnd = x < LEFT_GOAL_X || x >= RIGHT_GOAL_X;
        if (isEnd) continue;
        const stripe = (Math.floor(y / 5) % 2 === 0) ? COLOR.field : COLOR.fieldAlt;
        g.fillStyle(stripe, 1);
        g.fillRect(x, FIELD_TOP, w, FIELD_H);
      }

      g.fillStyle(COLOR.ezHome, 1);
      g.fillRect(LEFT_EZ_X, FIELD_TOP, LEFT_GOAL_X - LEFT_EZ_X, FIELD_H);
      g.fillStyle(COLOR.ezAway, 1);
      g.fillRect(RIGHT_GOAL_X, FIELD_TOP, RIGHT_EZ_X - RIGHT_GOAL_X, FIELD_H);

      g.fillStyle(COLOR.sideline, 1);
      g.fillRect(0, FIELD_TOP, WORLD_W, 4);
      g.fillRect(0, FIELD_TOP + FIELD_H - 4, WORLD_W, 4);

      for (let y = 0; y <= FIELD_YARDS; y += 5) {
        const x = LEFT_GOAL_X + y * PX_PER_YARD;
        const thick = (y % 10 === 0);
        g.fillStyle(COLOR.line, thick ? 0.95 : 0.5);
        g.fillRect(x - (thick ? 1.5 : 1), FIELD_TOP, thick ? 3 : 2, FIELD_H);
      }

      const hashTop = FIELD_TOP + FIELD_H * 0.38;
      const hashBot = FIELD_TOP + FIELD_H * 0.62;
      g.fillStyle(COLOR.line, 0.7);
      for (let y = 1; y < FIELD_YARDS; y++) {
        const x = LEFT_GOAL_X + y * PX_PER_YARD;
        g.fillRect(x - 1, hashTop - 6, 2, 12);
        g.fillRect(x - 1, hashBot - 6, 2, 12);
      }

      for (let y = 10; y <= FIELD_YARDS - 10; y += 10) {
        const num = y <= 50 ? y : 100 - y;
        const x = LEFT_GOAL_X + y * PX_PER_YARD;
        this.add.text(x, FIELD_TOP + 22, String(num), {
          fontFamily: 'system-ui, sans-serif', fontSize: '20px', color: '#F2F4F7', fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(1).setAlpha(0.85);
        this.add.text(x, FIELD_TOP + FIELD_H - 22, String(num), {
          fontFamily: 'system-ui, sans-serif', fontSize: '20px', color: '#F2F4F7', fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(1).setAlpha(0.85);
      }

      this.add.text(LEFT_GOAL_X / 2, FIELD_TOP + FIELD_H / 2, 'HOME\nEND ZONE', {
        fontFamily: 'system-ui, sans-serif', fontSize: '18px', color: '#F2F4F7', fontStyle: 'bold', align: 'center'
      }).setOrigin(0.5).setDepth(1).setAlpha(0.8).setAngle(-90);
      this.add.text(RIGHT_GOAL_X + (RIGHT_EZ_X - RIGHT_GOAL_X) / 2, FIELD_TOP + FIELD_H / 2, 'AWAY\nEND ZONE', {
        fontFamily: 'system-ui, sans-serif', fontSize: '18px', color: '#F2F4F7', fontStyle: 'bold', align: 'center'
      }).setOrigin(0.5).setDepth(1).setAlpha(0.8).setAngle(90);

      g.fillStyle(0xF2F4F7, 1);
      g.fillRect(LEFT_GOAL_X - 2, FIELD_TOP, 4, FIELD_H);
      g.fillRect(RIGHT_GOAL_X - 2, FIELD_TOP, 4, FIELD_H);
    }

    buildHUD() {
      this.hudObjects = [];
      this.hudObjects.push(this.add.rectangle(W / 2, HUD_H / 2, W, HUD_H, COLOR.hud, 1).setScrollFactor(0).setDepth(50));
      this.hudObjects.push(this.add.rectangle(W / 2, HUD_H, W, 2, 0x2a3140, 1).setScrollFactor(0).setDepth(51));
      this.title = this.add.text(16, 10, 'PHASE B — PLAY CALLING', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold'
      }).setScrollFactor(0).setDepth(51);
      this.hudObjects.push(this.title);
      this.yardLabel = this.add.text(16, 30, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '20px', color: '#F2F4F7', fontStyle: 'bold'
      }).setScrollFactor(0).setDepth(51);
      this.hudObjects.push(this.yardLabel);
      this.clockLabel = this.add.text(W / 2, 12, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '18px', color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(51);
      this.hudObjects.push(this.clockLabel);
      this.scoreLabel = this.add.text(W / 2, 30, 'HOME 0 — AWAY 0', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(51);
      this.hudObjects.push(this.scoreLabel);
      this.hint = this.add.text(W - 16, 24, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8'
      }).setOrigin(1, 0.5).setScrollFactor(0).setDepth(51);
      this.hudObjects.push(this.hint);

      // ---- Break Meter bar — only shown while you're carrying the ball
      // in the open field (updatePlayCallTimer/etc. never touch it; it's
      // toggled from updateLiveCarrierMovement) ----
      this.breakMeterLabel = this.add.text(W / 2 - 92, 78, 'BREAK', {
        fontFamily: 'system-ui, sans-serif', fontSize: '10px', color: '#94a3b8', fontStyle: 'bold'
      }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(51).setVisible(false);
      this.hudObjects.push(this.breakMeterLabel);
      this.breakMeterBg = this.add.rectangle(W / 2 + 4, 78, 150, 10, 0x1c2430, 1)
        .setStrokeStyle(2, 0x2a3140).setScrollFactor(0).setDepth(51).setVisible(false);
      this.hudObjects.push(this.breakMeterBg);
      this.breakMeterFill = this.add.rectangle(W / 2 - 71, 78, 146, 6, 0x22c55e, 1)
        .setOrigin(0, 0.5).setScrollFactor(0).setDepth(51.5).setVisible(false);
      this.hudObjects.push(this.breakMeterFill);
    }

    // ---- an always-visible MENU button (top-right corner) that opens a
    // pause overlay — Resume or Restart Game. Pausing just sets a flag
    // update() bails out on immediately, so the clock, every AI update and
    // the ball's flight physics all genuinely freeze, not just the visuals.
    // Esc or M do the same thing from the keyboard. ----
    buildPauseMenu() {
      this.menuBtnBg = this.add.rectangle(W - 34, 15, 48, 20, 0x1c2430, 1)
        .setStrokeStyle(2, 0x2a3140).setScrollFactor(0).setDepth(52)
        .setInteractive({ useHandCursor: true });
      this.hudObjects.push(this.menuBtnBg);
      this.menuBtnTxt = this.add.text(W - 34, 15, '☰ MENU', {
        fontFamily: 'system-ui, sans-serif', fontSize: '10px', color: '#94a3b8', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(53);
      this.hudObjects.push(this.menuBtnTxt);
      this.menuBtnBg.on('pointerdown', () => this.togglePauseMenu());
      this.menuBtnBg.on('pointerover', () => this.menuBtnBg.setFillStyle(0x27313f, 1));
      this.menuBtnBg.on('pointerout', () => this.menuBtnBg.setFillStyle(0x1c2430, 1));

      this.pauseBackdrop = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.72)
        .setScrollFactor(0).setDepth(60).setVisible(false);
      this.hudObjects.push(this.pauseBackdrop);

      this.pauseTitle = this.add.text(W / 2, H / 2 - 64, 'PAUSED', {
        fontFamily: 'system-ui, sans-serif', fontSize: '26px', color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(61).setVisible(false);
      this.hudObjects.push(this.pauseTitle);

      const btnDefs = [
        { label: 'RESUME', action: () => this.togglePauseMenu() },
        { label: 'RESTART GAME', action: () => this.restartGame() }
      ];
      this.pauseButtons = btnDefs.map((def, i) => {
        const by = H / 2 - 6 + i * 52;
        const bg = this.add.rectangle(W / 2, by, 220, 42, 0x141a24, 1)
          .setStrokeStyle(3, 0x2a3140).setScrollFactor(0).setDepth(61).setVisible(false)
          .setInteractive({ useHandCursor: true });
        const txt = this.add.text(W / 2, by, def.label, {
          fontFamily: 'system-ui, sans-serif', fontSize: '16px', color: '#F2F4F7', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(62).setVisible(false);
        bg.on('pointerdown', def.action);
        bg.on('pointerover', () => bg.setStrokeStyle(3, 0xfbbf24));
        bg.on('pointerout', () => bg.setStrokeStyle(3, 0x2a3140));
        this.hudObjects.push(bg, txt);
        return { bg, txt };
      });

      this.pauseHint = this.add.text(W / 2, H / 2 + 84, 'Esc or M also opens/closes this menu', {
        fontFamily: 'system-ui, sans-serif', fontSize: '11px', color: '#64748b'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(61).setVisible(false);
      this.hudObjects.push(this.pauseHint);
    }

    togglePauseMenu() {
      if (!this.paused) {
        this.prePausePhase = this.phase;
        this.prePauseClockRunning = this.clock.running;
        this.paused = true;
        this.phase = 'paused';
        this.clock.running = false;
        this.pauseBackdrop.setVisible(true);
        this.pauseTitle.setVisible(true);
        this.pauseHint.setVisible(true);
        this.pauseButtons.forEach(b => { b.bg.setVisible(true); b.txt.setVisible(true); });
      } else {
        this.paused = false;
        this.phase = this.prePausePhase;
        this.clock.running = this.prePauseClockRunning;
        this.pauseBackdrop.setVisible(false);
        this.pauseTitle.setVisible(false);
        this.pauseHint.setVisible(false);
        this.pauseButtons.forEach(b => { b.bg.setVisible(false); b.txt.setVisible(false); });
      }
    }

    // ---- full reset — re-runs create() from scratch via Phaser's own
    // scene lifecycle, so score/clock/downs/every player all come back
    // exactly like a fresh load rather than hand-resetting each field. ----
    restartGame() {
      this.scene.restart();
    }

    buildKickUI() {
      this.kickPrompt = this.add.text(W / 2, 24, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(51).setVisible(false);
      this.hudObjects.push(this.kickPrompt);

      // ---- three lane chips (LEFT / MID / RIGHT) — the selected one lights
      // up, so aiming reads at a glance instead of parsing a text label ----
      const labels = ['◀ LEFT', 'MID', 'RIGHT ▶'];
      const chipW = 74, chipH = 22, gap = 8;
      const totalW = chipW * 3 + gap * 2;
      const startX = W / 2 - totalW / 2 + chipW / 2;
      this.kickChips = labels.map((label, i) => {
        const cx = startX + i * (chipW + gap);
        const bg = this.add.rectangle(cx, 48, chipW, chipH, 0x1c2430, 1)
          .setStrokeStyle(2, 0x2a3140).setScrollFactor(0).setDepth(51).setVisible(false);
        const txt = this.add.text(cx, 48, label, {
          fontFamily: 'system-ui, sans-serif', fontSize: '12px', color: '#64748b', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(52).setVisible(false);
        this.hudObjects.push(bg, txt);
        return { bg, txt };
      });

      // ---- power meter — same slot as the chips (never shown together),
      // with a highlighted sweet-spot zone near max power ----
      this.kickMeterBg = this.add.rectangle(W / 2, 48, 220, 16, 0x1c2430, 1)
        .setStrokeStyle(2, 0x2a3140).setScrollFactor(0).setDepth(51).setVisible(false);
      this.hudObjects.push(this.kickMeterBg);

      this.kickMeterSweet = this.add.rectangle(W / 2 + 108, 48, 30, 16, 0x22c55e, 0.35)
        .setOrigin(1, 0.5).setScrollFactor(0).setDepth(51.5).setVisible(false);
      this.hudObjects.push(this.kickMeterSweet);

      this.kickMeterFill = this.add.rectangle(W / 2 - 108, 48, 2, 14, 0xfbbf24, 1)
        .setOrigin(0, 0.5).setScrollFactor(0).setDepth(52).setVisible(false);
      this.hudObjects.push(this.kickMeterFill);
    }

    refreshKickChips() {
      this.kickChips.forEach((chip, i) => {
        const selected = i === this.kickDirIndex;
        chip.bg.setFillStyle(selected ? 0x24b7ff : 0x1c2430, 1);
        chip.bg.setStrokeStyle(2, selected ? 0xfbbf24 : 0x2a3140);
        chip.txt.setColor(selected ? '#0b1220' : '#64748b');
      });
    }

    // ---- play-call screen — big square cards (not thin HUD chips) with a
    // real mini play-diagram drawn from the play's own assignment data, so
    // adding a play later automatically gets a diagram for free. A dark
    // backdrop dims the field behind it while you're choosing. ----
    buildPlayCallUI() {
      const MAX_CARDS = 4;
      const boxSize = 138, gap = 16;
      const totalW = boxSize * MAX_CARDS + gap * (MAX_CARDS - 1);
      const startX = W / 2 - totalW / 2 + boxSize / 2;
      const cardY = H / 2 + 46;

      this.playCallBackdrop = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.6)
        .setScrollFactor(0).setDepth(53).setVisible(false);
      this.hudObjects.push(this.playCallBackdrop);

      // ---- tab bar — SUGGESTIONS / PLAYBOOK / RECENT, switched with 1/2/3 ----
      const tabY = cardY - boxSize / 2 - 78;
      const tabDefs = [
        { key: 'suggestions', label: '1 · SUGGESTIONS' },
        { key: 'playbook', label: '2 · PLAYBOOK' },
        { key: 'recent', label: '3 · RECENT' }
      ];
      const tabGap = 190;
      const tabStartX = W / 2 - tabGap;
      this.playCallTabs = tabDefs.map((def, i) => {
        const txt = this.add.text(tabStartX + i * tabGap, tabY, def.label, {
          fontFamily: 'system-ui, sans-serif', fontSize: '14px', color: '#64748b', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(55).setVisible(false);
        this.hudObjects.push(txt);
        return { key: def.key, txt };
      });

      this.playCallSubHeader = this.add.text(W / 2, tabY + 26, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(55).setVisible(false);
      this.hudObjects.push(this.playCallSubHeader);

      this.playCallPrompt = this.add.text(W / 2, cardY - boxSize / 2 - 24, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(55).setVisible(false);
      this.hudObjects.push(this.playCallPrompt);

      this.playCallEmptyMsg = this.add.text(W / 2, cardY, '', {
        fontFamily: 'system-ui, sans-serif', fontSize: '14px', color: '#64748b', fontStyle: 'italic'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(55).setVisible(false);
      this.hudObjects.push(this.playCallEmptyMsg);

      this.playCallChips = [];
      for (let i = 0; i < MAX_CARDS; i++) {
        const cx = startX + i * (boxSize + gap);
        const bg = this.add.rectangle(cx, cardY, boxSize, boxSize, 0x141a24, 1)
          .setStrokeStyle(3, 0x2a3140).setScrollFactor(0).setDepth(54).setVisible(false);
        const diagram = this.add.graphics().setScrollFactor(0).setDepth(55).setVisible(false);
        const txt = this.add.text(cx, cardY + boxSize / 2 - 18, '', {
          fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(56).setVisible(false);
        this.hudObjects.push(bg, diagram, txt);
        this.playCallChips.push({ bg, diagram, txt, cx, cy: cardY, size: boxSize, key: null });
      }
    }

    updatePlayCallTimer(dt) {
      this.playCallTimeLeft -= dt;
      const secLeft = Math.max(0, Math.ceil(this.playCallTimeLeft / 1000));
      const list = this.getPlayCallList();
      const navHint = this.playCallTab === 'playbook' ? 'A/D pick · W/S formation · 1-3 tabs' : 'A/D pick · 1-3 tabs';
      this.playCallPrompt.setText((list.length ? navHint : 'No plays here — try another tab') + ' · SPACE to lock in — ' + secLeft + 's');
      this.followTarget.set(this.qb.x, this.qb.y);
      if (this.playCallTimeLeft <= 0) this.confirmPlayCall();
    }

    yardLineLabel(worldX) {
      const yardsFromLeftGoal = (worldX - LEFT_GOAL_X) / PX_PER_YARD;
      if (yardsFromLeftGoal < 0) return 'HOME END ZONE';
      if (yardsFromLeftGoal > FIELD_YARDS) return 'AWAY END ZONE';
      if (Math.abs(yardsFromLeftGoal - 50) < 0.5) return "50";
      if (yardsFromLeftGoal < 50) return 'OWN ' + Math.round(yardsFromLeftGoal);
      return 'OPP ' + Math.round(100 - yardsFromLeftGoal);
    }

    formatClock() {
      if (this.clock.over) return 'FINAL';
      const secs = Math.max(0, Math.ceil(this.clock.secondsLeft));
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return 'Q' + this.clock.quarter + ' • ' + m + ':' + String(s).padStart(2, '0');
    }

    advanceQuarter() {
      if (this.clock.quarter < 4) {
        this.clock.quarter += 1;
        this.clock.secondsLeft = QUARTER_SECONDS;
      } else {
        this.clock.running = false;
        this.clock.secondsLeft = 0;
        this.clock.over = true;
      }
    }

    redrawQB() {
      const anim = {
        legPhase: this.qb.animPhase,
        gaitAmp: this.qb.gaitAmp,
        throwT: this.qb.throwState ? this.qb.throwState.t / this.qb.throwState.duration : undefined,
        spinRot: this.qb.spinRot || 0
      };
      drawFootballPlayer(this.qb.gfx, this.qb.x, this.qb.y, this.qb.facing, this.qb.body, anim);
      // world-space hand position for the ball to snap to / release from
      this.qb.throwHandX = anim.throwHand.x;
      this.qb.throwHandY = anim.throwHand.y;
    }

    drawBall() {
      const g = this.ball.gfx;
      g.clear();
      const drawX = this.ball.x;
      const drawY = this.ball.y - this.ball.height;

      // shadow reacts to height — smaller/tighter the higher the ball is,
      // same idea as the player shadow
      const shadowScale = Phaser.Math.Clamp(1 - this.ball.height / 60, 0.35, 1);
      g.fillStyle(0x000000, 0.3 * shadowScale);
      g.fillEllipse(this.ball.x, this.ball.y, 14 * shadowScale, 6 * shadowScale);

      g.fillStyle(COLOR.ball, 1);
      g.fillEllipse(drawX, drawY, 15, 10);
      g.lineStyle(1.5, 0xF2F4F7, 0.9);
      g.lineBetween(drawX - 4.5, drawY, drawX + 4.5, drawY);
    }

    update(time, dt) {
      if (this.paused) return;

      // ---- game clock — only ticks once the ball is live in a QB's hands ----
      if (this.clock.running && !this.clock.over) {
        this.clock.secondsLeft -= dt / 1000;
        if (this.clock.secondsLeft <= 0) this.advanceQuarter();
      }
      this.clockLabel.setText(this.formatClock());

      // ---- kickoff run-up: kicker jogs from the tee-up spot to the ball,
      // camera stays on the kicker until aim/power resolve ----
      if (this.phase === 'kickoff-setup') {
        this.kickoffT += dt;
        const p = Phaser.Math.Clamp(this.kickoffT / 900, 0, 1);
        this.kicker.x = Phaser.Math.Linear(this.kickerStartX, this.kickerPlantX, p);
        this.kicker.gaitAmp = Math.min(1, this.kickoffT / 300);
        this.kicker.animPhase += dt * 0.018;
        if (this.kicker.animPhase > Math.PI * 2) this.kicker.animPhase -= Math.PI * 2;
        drawFootballPlayer(this.kicker.gfx, this.kicker.x, this.kicker.y, this.kicker.facing, this.kicker.body, {
          legPhase: this.kicker.animPhase, gaitAmp: this.kicker.gaitAmp
        });
        this.followTarget.set(this.kicker.x, this.kicker.y);
      } else if (this.phase === 'kickoff-aim') {
        this.followTarget.set(this.kicker.x, this.kicker.y);
      } else if (this.phase === 'kickoff-power') {
        this.kickMeterT += dt;
        this.kickPower = (Math.sin(this.kickMeterT * 0.006) + 1) / 2; // oscillates 0..1
        this.kickMeterFill.setSize(Math.max(2, 216 * this.kickPower), 14);
        this.followTarget.set(this.kicker.x, this.kicker.y);
      } else if (this.phase === 'kickoff-flight' || this.phase === 'kickoff-return') {
        this.updateReturnerMovement(dt);
        if (this.coverageActive) this.updateCoverage(dt);
        if (this.blockersActive) this.updateBlockers(dt);
        if (this.phase === 'kickoff-return') {
          this.ball.x = this.returner.x + this.returner.facing * 10;
          this.ball.y = this.returner.y;
          if (this.returner.x >= RIGHT_GOAL_X) this.scoreTouchdown();
        }
      } else if (this.phase === 'playcall') {
        this.updatePlayCallTimer(dt);
        this.yardLabel.setText(this.downDistanceLabel());
      } else if (this.phase === 'presnap') {
        if (this.snapAnim) {
          this.snapAnim.t += dt;
          const p = Phaser.Math.Clamp(this.snapAnim.t / this.snapAnim.duration, 0, 1);
          this.ball.x = Phaser.Math.Linear(this.snapAnim.fromX, this.qb.throwHandX, p);
          this.ball.y = Phaser.Math.Linear(this.snapAnim.fromY, this.qb.throwHandY, p);
          if (p >= 1) {
            this.snapAnim = null;
            this.beginLivePlay();
          }
        }
        this.updateQBMovement(dt);
        this.followTarget.set(this.qb.x, this.qb.y);
        this.yardLabel.setText(this.downDistanceLabel());
      } else if (this.phase === 'live-pass') {
        this.livePlayElapsedMs = (this.livePlayElapsedMs || 0) + dt;
        this.updateQBMovement(dt);
        this.updateOffenseRoutes(dt);
        this.updateOffenseBlocking(dt);
        this.updateDefenseAssignments(dt);
        this.followTarget.set(this.qb.x, this.qb.y);
        this.yardLabel.setText(this.downDistanceLabel());
      } else if (this.phase === 'live-pass-air') {
        this.updateOffenseRoutes(dt);
        this.updateDefenseAssignments(dt);
        this.followTarget.set(this.ball.x, this.ball.y);
        this.yardLabel.setText(this.downDistanceLabel());
      } else if (this.phase === 'live-run') {
        this.updateLiveCarrierMovement(this.liveCarrier, dt);
        this.updateOffenseBlocking(dt);
        this.updateChasePursuit(dt);
        this.yardLabel.setText(this.downDistanceLabel());
      }

      this.updateTargetIndicators();
      this.updateReadReactCues();

      // ---- ball flight physics (shared by kickoffs and throws) ----
      if (this.ball.inFlight) {
        // remember where the ball was before it moves this frame — a fast
        // throw can cross a whole catch radius between two frames without
        // its END position ever landing inside it, so resolveAirBall()
        // checks the swept segment (prev -> current), not just a point
        this.ball.prevX = this.ball.x;
        this.ball.prevY = this.ball.y;
        this.ball.x += this.ball.vx * (dt / 16.667);
        this.ball.y += this.ball.vy * (dt / 16.667);
        this.ball.height += this.ball.heightVel * (dt / 16.667);
        this.ball.heightVel -= this.ball.gravity * (dt / 16.667);
        if (this.ball.heightVel <= 0) this.ball.pastPeak = true;
        if (this.phase === 'live-pass-air') this.ball.flightMs = (this.ball.flightMs || 0) + dt;

        // a returner close enough under a low ball hauls it in
        if (this.phase === 'kickoff-flight' && this.ball.height > 0 && this.ball.height < CATCH_MAX_HEIGHT) {
          const dx = this.ball.x - this.returner.x, dy = this.ball.y - this.returner.y;
          if (Math.sqrt(dx * dx + dy * dy) < CATCH_RADIUS) this.catchBall();
        }
        // a thrown ball resolves once it's had enough real flight time to
        // actually reach the target (not gated on the cosmetic height arc
        // any more — see releaseThrow()), so it can't be scooped up right
        // at the QB's hand but also can't sail forever past the receiver
        if (this.phase === 'live-pass-air' && this.ball.flightMs >= (this.ball.minResolveMs || 110)) {
          this.resolveAirBall();
        }
        // hard stop — if nobody's within range by well past the throw's
        // own expected arrival time, it's incomplete right there, instead
        // of physically flying on until the arc happens to bring it to
        // the ground somewhere way downfield
        if (this.phase === 'live-pass-air' && this.ball.flightMs >= (this.ball.maxFlightMs || 900)) {
          this.incompletePass();
        }

        if (this.ball.inFlight && this.ball.height <= 0) {
          this.ball.height = 0;
          this.ball.inFlight = false;
          this.ball.vx = 0; this.ball.vy = 0; this.ball.heightVel = 0;
          if (this.phase === 'kickoff-flight') this.onKickLanded();
          else if (this.phase === 'live-pass-air') this.incompletePass();
        }
      }

      if (this.phase === 'kickoff-return') {
        this.yardLabel.setText(this.yardLineLabel(this.returner.x));
      } else if (this.phase !== 'presnap' && this.phase !== 'live-pass' && this.phase !== 'live-pass-air' && this.phase !== 'live-run' && this.phase !== 'playcall') {
        this.yardLabel.setText('');
      }

      this.drawBall();
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: W,
    height: H,
    parent: 'game-root',
    backgroundColor: '#0b0f14',
    scene: [FieldScene]
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
