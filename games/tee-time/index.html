<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tee Time — Hole 1</title>
<style>
  :root{
    --cream:#f4ecd8;
    --panel:rgba(14,22,16,0.72);
    --panel-border:rgba(201,162,75,0.4);
    --gold:#c9a24b;
    --gold-soft:#e4c87a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0c1410; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color:var(--cream); -webkit-user-select:none; user-select:none;
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%; cursor:crosshair;}
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:3; box-shadow: inset 0 0 180px rgba(0,0,0,0.5); }

  .hud{ position:fixed; z-index:5; pointer-events:none; }
  #topbar{ top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:16px 22px; }
  .badge{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:9px 16px; backdrop-filter:blur(6px); box-shadow:0 4px 16px rgba(0,0,0,0.35); }
  .badge .label{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-soft); opacity:0.85; margin-bottom:2px; }
  .badge .value{ font-size:19px; font-weight:600; }
  #course-title{ text-align:center; }
  #minimap-wrap{ position:fixed; z-index:5; left:22px; top:92px; pointer-events:none; background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:8px 8px 6px; backdrop-filter:blur(6px); box-shadow:0 4px 16px rgba(0,0,0,0.35); }
  #minimap-wrap .cap{ font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-soft); opacity:0.85; text-align:center; margin-top:4px; }
  #minimap{ width:140px !important; height:330px !important; cursor:default; border-radius:6px; }
  #pinMarker{ position:fixed; z-index:4; left:0; top:0; pointer-events:none; transform:translate(-50%,-100%); text-align:center; color:#fff6d6; text-shadow:0 1px 6px rgba(0,0,0,0.7); transition:opacity .2s; }
  #pinMarker .pill{ display:inline-block; background:rgba(12,20,16,0.72); border:1px solid rgba(228,200,122,0.7); border-radius:999px; padding:3px 11px; font-size:12px; letter-spacing:0.08em; white-space:nowrap; }
  #pinMarker .tick{ width:2px; height:14px; margin:0 auto; background:linear-gradient(#e4c87a,rgba(228,200,122,0)); }
  #pinMarker .arrow{ display:none; font-size:18px; line-height:1; color:#e4c87a; }
  #pinMarker.off .tick{ display:none; } #pinMarker.off .arrow{ display:block; }
  @media (max-height:700px){ #minimap{ width:104px !important; height:245px !important; } }
  #course-title .name{ font-size:24px; letter-spacing:0.07em; color:var(--gold-soft); text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  #course-title .sub{ font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream); opacity:0.6; margin-top:2px; }

  #club-wrap{ position:fixed; z-index:6; top:72px; right:22px; pointer-events:all; }
  #club-btn{ font-family:inherit; background:var(--panel); border:1px solid var(--panel-border); color:var(--cream); border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; }
  #club-btn .tag{ color:var(--gold-soft); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; display:block; margin-bottom:1px; }
  #club-list{ position:absolute; top:calc(100% + 6px); right:0; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; overflow:hidden; display:none; min-width:170px; backdrop-filter:blur(6px); }
  #club-list.show{ display:block; }
  #club-list button{ display:block; width:100%; text-align:left; font-family:inherit; background:none; border:none; color:var(--cream); padding:9px 14px; font-size:13px; cursor:pointer; }
  #club-list button:hover, #club-list button.selected{ background:rgba(201,162,75,0.2); }
  #club-list button .carry{ float:right; color:#9fb3a3; font-size:11px; }

  #hint{ position:fixed; left:50%; bottom:168px; transform:translateX(-50%); font-size:13px; opacity:0.55; z-index:5; letter-spacing:0.02em; transition:opacity 0.3s; }

  #swing-wrap{ position:fixed; z-index:5; left:50%; bottom:40px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; opacity:0; transition:opacity 0.2s; }
  #swing-wrap.show{ opacity:1; }
  #power-track{ position:relative; width:280px; height:16px; border-radius:8px; background:rgba(14,22,16,0.8); border:1px solid var(--panel-border); overflow:hidden; }
  #power-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#6fae63,var(--gold-soft) 72%,#e3684f 96%); }
  #power-lock{ position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; opacity:0; }
  #accuracy-track{ position:relative; width:280px; height:16px; border-radius:8px; background:rgba(14,22,16,0.8); border:1px solid var(--panel-border); overflow:hidden; display:none; }
  #accuracy-track.show{ display:block; }
  #accuracy-center{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.4); }
  #accuracy-marker{ position:absolute; top:-3px; bottom:-3px; width:4px; background:var(--gold-soft); border-radius:2px; left:50%; }
  #swing-label{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-soft); opacity:0.85; }

  #sink-panel{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(8,14,10,0.55); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity 0.4s; }
  #sink-panel.show{ opacity:1; pointer-events:all; }
  #sink-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:34px 46px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.5); transform:translateY(14px); transition:transform 0.4s; }
  #sink-panel.show #sink-card{ transform:translateY(0); }
  #sink-card .result{ font-size:28px; color:var(--gold-soft); letter-spacing:0.05em; margin-bottom:6px; }
  #sink-card .strokes{ font-size:14px; opacity:0.8; margin-bottom:20px; }
  #sink-card button{ font-family:inherit; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; background:var(--gold); color:#1c2b22; border:none; border-radius:8px; padding:11px 24px; cursor:pointer; pointer-events:all; font-weight:700; }
  #sink-card button:hover{ background:var(--gold-soft); }

  #toast{ position:fixed; z-index:7; left:50%; top:90px; transform:translateX(-50%) translateY(-8px); background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:8px 18px; font-size:13px; opacity:0; transition:all 0.35s; pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="canvas-wrap"></div>
<div id="vignette"></div>

<div class="hud" id="topbar">
  <div class="badge"><div class="label">Hole 1 · Par 5</div><div class="value" id="strokeVal">0 strokes</div></div>
  <div id="course-title"><div class="name">Tee Time</div><div class="sub">Front Nine · Hole 1 of 9</div></div>
  <div class="badge"><div class="label">To Pin</div><div class="value" id="distVal">380 yd</div></div>
</div>

<div id="minimap-wrap"><canvas id="minimap" width="280" height="660"></canvas><div class="cap">Hole 1 · 540 yd</div></div>
<div id="pinMarker"><div class="pill" id="pinLabel">&#9873; Pin</div><div class="tick"></div><div class="arrow" id="pinArrow">&#9650;</div></div>

<div id="club-wrap">
  <button id="club-btn"><span class="tag">Club</span><span id="club-name">Driver</span></button>
  <div id="club-list"></div>
</div>

<div class="hud" id="hint">move mouse to aim · click to start swing, click to set power, click to set accuracy</div>

<div id="swing-wrap">
  <div id="swing-label">power</div>
  <div id="power-track"><div id="power-fill"></div><div id="power-lock"></div></div>
  <div id="accuracy-track"><div id="accuracy-center"></div><div id="accuracy-marker"></div></div>
</div>

<div id="toast"></div>

<div id="sink-panel">
  <div id="sink-card">
    <div class="result" id="sinkResult">Birdie!</div>
    <div class="strokes" id="sinkStrokes">Holed in 4</div>
    <button id="replayBtn">Replay Hole</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- audio ---------- */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function sfxCtx(){ if(!actx) actx = new AudioCtx(); return actx; }
  function sfxSwing(power){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(340 + power*260, ctx.currentTime+0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18+power*0.12, ctx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.18);
  }
  function sfxPutt(power){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(170+power*80, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+0.1);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18+power*0.14, ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.18);
  }
  function sfxBounce(strength){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(280, ctx.currentTime);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.05*Math.min(1,strength), ctx.currentTime+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.08);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.09);
  }
  function sfxSplash(){
    const ctx = sfxCtx();
    const bufferSize = ctx.sampleRate*0.3;
    const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=900;
    const g = ctx.createGain(); g.gain.value=0.25;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }
  function sfxSand(){
    const ctx = sfxCtx();
    const bufferSize = ctx.sampleRate*0.18;
    const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 3);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=1400;
    const g = ctx.createGain(); g.gain.value=0.2;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }
  function sfxSink(){
    const ctx = sfxCtx();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = ctx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.16,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.45);
    });
  }

  /* ---------- renderer / scene ---------- */
  const wrap = document.getElementById("canvas-wrap");
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.14;
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  const skyGeo = new THREE.SphereGeometry(900, 32, 20);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x2b78c8)}, mid:{value:new THREE.Color(0x86bfe9)}, bottom:{value:new THREE.Color(0xd4e8f2)}, t:{value:0}, sunDir:{value:new THREE.Vector3(0.5,0.75,-0.35).normalize()} },
    vertexShader:`varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec3 vPos; uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; uniform float t; uniform vec3 sunDir;
      float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
      float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(3.1,1.7); a*=0.5; } return s; }
      void main(){
        vec3 d = normalize(vPos); float h = d.y;
        vec3 col = h>0.0 ? mix(bottom, mid, smoothstep(0.0,0.22,h)) : bottom;
        col = mix(col, top, smoothstep(0.2,0.85,h));
        // sun glow
        float sd = max(dot(d,sunDir),0.0); col += vec3(1.0,0.95,0.8)*(pow(sd,900.0)*1.5 + pow(sd,12.0)*0.12);
        // cumulus
        if(h>0.015){
          vec2 uv = d.xz/(h+0.28)*1.6 + vec2(t*0.012, t*0.004);
          float n = fbm(uv*1.3); float c = smoothstep(0.52,0.78,n);
          float lit = clamp(0.62 + 0.55*(fbm(uv*1.3+sunDir.xz*0.25)-n)*3.0, 0.0, 1.0);
          vec3 cc = mix(vec3(0.62,0.70,0.80), vec3(1.0,0.99,0.96), lit);
          col = mix(col, cc, c*smoothstep(0.015,0.2,h)*0.92);
        }
        gl_FragColor = vec4(col,1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  scene.fog = new THREE.Fog(0xcde3ee, 130, 560); scene.background = new THREE.Color(0xcde3ee);

  const sun = new THREE.DirectionalLight(0xfff3dc, 2.5);
  sun.position.set(55, 85, -35);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-70; sun.shadow.camera.right=70; sun.shadow.camera.top=70; sun.shadow.camera.bottom=-70;
  sun.shadow.camera.near=1; sun.shadow.camera.far=260;
  sun.shadow.bias = -0.0012;
  scene.add(sun); scene.add(sun.target);
  scene.add(new THREE.AmbientLight(0xcfe2f0, 0.62));
  scene.add(new THREE.HemisphereLight(0xbfdcff, 0x6d7a45, 0.7));
  const camFill = new THREE.DirectionalLight(0xfff6ea, 0.5);
  camFill.position.set(-6, 9, -12);
  scene.add(camFill);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1100);

  /* ---------- textures ---------- */
  function stripeTex(c1,c2,flecks,size,stripeH){
    const c = document.createElement("canvas"); c.width=size; c.height=size;
    const ctx = c.getContext("2d");
    for(let y=0;y<size;y+=stripeH) { ctx.fillStyle=(Math.floor(y/stripeH)%2===0)?c1:c2; ctx.fillRect(0,y,size,stripeH); }
    ctx.globalAlpha=0.09;
    for(let i=0;i<flecks;i++){ ctx.fillStyle=Math.random()<0.5?c1:c2; ctx.fillRect(Math.random()*size,Math.random()*size,1.3,1.3); }
    ctx.globalAlpha=1;
    const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.colorSpace=THREE.SRGBColorSpace;
    return tex;
  }
  function solidTex(base, flecks, fleckColors, size){
    const c = document.createElement("canvas"); c.width=size; c.height=size;
    const ctx = c.getContext("2d");
    ctx.fillStyle = base; ctx.fillRect(0,0,size,size);
    ctx.globalAlpha = 0.3;
    for(let i=0;i<flecks;i++){ ctx.fillStyle = fleckColors[Math.random()<0.5?0:1]; ctx.fillRect(Math.random()*size,Math.random()*size,2,2); }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.colorSpace=THREE.SRGBColorSpace;
    return tex;
  }
  function grassTexMake(o){
    const S=1024, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
    x.fillStyle=o.base; x.fillRect(0,0,S,S);
    // soft low-frequency colour drift (wrapped so the tile repeats cleanly)
    for(let i=0;i<o.blots;i++){
      const r=50+Math.random()*190, px=Math.random()*S, py=Math.random()*S, light=Math.random()<0.5;
      for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){
        const X=px+ox*S, Y=py+oy*S; if(X<-r||X>S+r||Y<-r||Y>S+r) continue;
        const g=x.createRadialGradient(X,Y,0,X,Y,r);
        g.addColorStop(0, light?o.light:o.dark); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=g; x.fillRect(X-r,Y-r,r*2,r*2);
      }
    }
    // mowing bands that run along the fairway (soft edged, low contrast)
    if(o.bands){ const n=o.bands, w=S/n;
      for(let i=0;i<n;i++){ const g=x.createLinearGradient(i*w,0,(i+1)*w,0), a=(i%2?o.bandA:o.bandB), e=0.12;
        g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(e,a); g.addColorStop(1-e,a); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=g; x.fillRect(i*w,0,w,S); } }
    // blade strokes, all leaning along the mow direction with some scatter
    x.lineCap="round";
    for(let i=0;i<o.strokes;i++){
      const px=Math.random()*S, py=Math.random()*S, a=Math.PI/2+(Math.random()-0.5)*1.1, L=o.len*(0.5+Math.random());
      x.strokeStyle=o.cols[Math.floor(Math.random()*o.cols.length)]; x.lineWidth=o.lw*(0.6+Math.random()*0.8);
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L); x.stroke();
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
  }
  function grainTexMake(){
    const S=256, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
    x.fillStyle="#808080"; x.fillRect(0,0,S,S);
    for(let i=0;i<9000;i++){ const px=Math.random()*S, py=Math.random()*S, L=2+Math.random()*5, v=90+Math.random()*80|0;
      x.strokeStyle="rgb("+v+","+v+","+v+")"; x.lineWidth=1; x.beginPath(); x.moveTo(px,py); x.lineTo(px+(Math.random()-0.5)*2,py+L); x.stroke(); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t;
  }
  const fairwayTex = grassTexMake({ base:"#55a944", blots:60, light:"rgba(160,220,90,0.18)", dark:"rgba(40,120,40,0.14)",
    bands:4, bandA:"rgba(225,255,150,0.13)", bandB:"rgba(0,70,10,0.10)", strokes:36000, len:9, lw:1.3,
    cols:["rgba(50,130,45,0.22)","rgba(140,205,85,0.30)","rgba(190,235,120,0.26)","rgba(35,105,40,0.16)"] });
  fairwayTex.repeat.set(5,50);
  const fairwayGrain = grainTexMake(); fairwayGrain.repeat.set(70,520);
  function roughTexMake(){
    const S=512, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
    x.fillStyle="#d9d9cc"; x.fillRect(0,0,S,S);
    for(let i=0;i<70;i++){ const r=18+Math.random()*50, px=Math.random()*S, py=Math.random()*S; const g=x.createRadialGradient(px,py,0,px,py,r);
      const l=Math.random()<0.5; g.addColorStop(0,l?"rgba(255,255,235,0.09)":"rgba(120,120,90,0.09)"); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=g; x.fillRect(px-r,py-r,r*2,r*2); }

    let nz = ball.position.z + vel.y*dt;
    const nsurf = surfaceAt(nx,nz);

  function finishRoll(){

  /* ---------- near-field grass: real blades around the ball ---------- */
  function makeBladeGeo(h, w){

    const n=new Float32Array(pos.length); for(let i=0;i<n.length;i+=3){ n[i]=0; n[i+1]=1; n[i+2]=0; }

    for(let z=0; z<PIN_Z; z+=24){ c.fillStyle=(z/24)%2?"rgba(255,255,200,0.07)":"rgba(0,40,0,0.07)"; c.fillRect(0,mapY(z+24),MW,24*M_S+1); } c.restore();
    // trees: soft shadow then canopy, sized by height
    TREE_PTS.forEach(function(t){ if(t[3]==="shrub") return; const r=Math.max(2.2,t[2]*0.34*M_S), px=mapX(t[0]), py=mapY(t[1]);
      c.beginPath(); c.arc(px+1.5,py+1.5,r,0,6.283); c.fillStyle="rgba(0,0,0,0.25)"; c.fill();
      c.beginPath(); c.arc(px,py,r,0,6.283); c.fillStyle=t[3]==="pine"||t[3]==="cypress"?"#2f5a2c":t[3]==="willow"?"#7da04a":"#3f7a35"; c.fill();
      c.beginPath(); c.arc(px-r*0.25,py-r*0.25,r*0.55,0,6.283); c.fillStyle="rgba(190,230,120,0.28)"; c.fill(); });
    // yardage markers from the tee
    c.font="bold 17px sans-serif"; c.textAlign="left"; c.textBaseline="middle";
    [100,200,300,400,500].forEach(function(y){ const z=y*(PIN_Z/540), x=cx(z)+fairwayHalfWidth(z), py=mapY(z);
      c.strokeStyle="rgba(255,255,255,0.55)"; c.lineWidth=1.5; c.beginPath(); c.moveTo(mapX(cx(z)+fairwayHalfWidth(z)),py); c.lineTo(mapX(cx(z)-fairwayHalfWidth(z)),py); c.stroke();
      c.fillStyle="rgba(10,20,10,0.55)"; c.fillRect(MW-52,py-11,48,22); c.fillStyle="#f4ecc8"; c.textAlign="center"; c.fillText(String(y),MW-28,py); });
    c.fillStyle="#fdf8ec"; c.fillRect(mapX(0)-14,mapY(2)-3,28,6);       // tee box
    // compass + wind-free north arrow (hole plays "up")
    c.fillStyle="rgba(255,255,255,0.8)"; c.beginPath(); c.moveTo(22,14); c.lineTo(15,34); c.lineTo(22,29); c.lineTo(29,34); c.closePath(); c.fill(); c.font="bold 13px sans-serif"; c.textAlign="center"; c.fillText("N",22,48);
    // vignette edge
    const vg=c.createLinearGradient(0,0,0,MH); vg.addColorStop(0,"rgba(0,0,0,0.18)"); vg.addColorStop(0.12,"rgba(0,0,0,0)"); vg.addColorStop(0.9,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.22)"); c.fillStyle=vg; c.fillRect(0,0,MW,MH);
  }
  const shotTrail=[];
  function drawMinimap(){
    mctx.clearRect(0,0,MW,MH); mctx.drawImage(mmStatic,0,0);
    const bx=mapX(ball.position.x), by=mapY(ball.position.z);
    { const lt=shotTrail[shotTrail.length-1]; if(!lt || Math.hypot(lt[0]-ball.position.x,lt[1]-ball.position.z)>3) shotTrail.push([ball.position.x,ball.position.z]); if(shotTrail.length>400) shotTrail.shift(); }
    if(shotTrail.length>1){ mctx.beginPath(); shotTrail.forEach(function(p,i){ mctx[i?"lineTo":"moveTo"](mapX(p[0]),mapY(p[1])); }); mctx.strokeStyle="rgba(255,255,255,0.55)"; mctx.lineWidth=2; mctx.stroke(); }
    // aim line
    const len = 230*M_S;
    mctx.beginPath(); mctx.moveTo(bx,by); mctx.lineTo(bx - Math.sin(aimAngle)*len, by - Math.cos(aimAngle)*len);
    mctx.setLineDash([5,5]); mctx.strokeStyle="rgba(255,255,255,0.9)"; mctx.lineWidth=2; mctx.stroke(); mctx.setLineDash([]);
    // pin flag
    const px=mapX(PIN_X), py=mapY(PIN_Z);
    mctx.strokeStyle="#fff"; mctx.lineWidth=2; mctx.beginPath(); mctx.moveTo(px,py); mctx.lineTo(px,py-18); mctx.stroke();
    mctx.fillStyle="#d8453a"; mctx.beginPath(); mctx.moveTo(px,py-18); mctx.lineTo(px+13,py-13); mctx.lineTo(px,py-8); mctx.fill();
    // ball
    mctx.beginPath(); mctx.arc(bx,by,7,0,Math.PI*2); mctx.fillStyle="#fff"; mctx.fill(); mctx.lineWidth=2.5; mctx.strokeStyle="#c9473b"; mctx.stroke();
  }
  const pinMarker = document.getElementById("pinMarker"), pinLabel = document.getElementById("pinLabel"), pinArrow = document.getElementById("pinArrow");
  const pinTopV = new THREE.Vector3();
  function updatePinMarker(){
    const d = currentDistance();
    pinTopV.set(PIN_X, heightAt(PIN_X,PIN_Z)+3.2, PIN_Z).project(camera);
    let x = (pinTopV.x*0.5+0.5)*window.innerWidth, y = (-pinTopV.y*0.5+0.5)*window.innerHeight;
    const behind = pinTopV.z > 1;
    if(behind){ x = window.innerWidth - x; y = window.innerHeight; }
    const mx = 70, my = 120;
    const off = behind || x<mx || x>window.innerWidth-mx || y<my || y>window.innerHeight-90;
    x = Math.max(mx, Math.min(window.innerWidth-mx, x)); y = Math.max(my, Math.min(window.innerHeight-90, y));
    pinMarker.classList.toggle("off", off);
    pinMarker.style.transform = "translate(-50%,-100%)";
    pinMarker.style.left = x+"px"; pinMarker.style.top = y+"px";
    pinLabel.innerHTML = "&#9873; " + Math.round(d) + " yd" + (off ? (x<=mx+1 ? " &larr;" : (x>=window.innerWidth-mx-1 ? " &rarr;" : "")) : "");
    pinMarker.style.opacity = (holeDone || d<25) ? 0 : 1;
  }
  // light beam on the flag so the green can be found from anywhere on the course
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,90,10,1,true), new THREE.MeshBasicMaterial({ color:0xffe48a, transparent:true, opacity:0.4, depthWrite:false, side:THREE.DoubleSide, fog:false }));
  beam.position.set(PIN_X, heightAt(PIN_X,PIN_Z)+45, PIN_Z); scene.add(beam);
  const beamGlow = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,90,12,1,true), new THREE.MeshBasicMaterial({ color:0xffd666, transparent:true, opacity:0.12, depthWrite:false, side:THREE.DoubleSide, fog:false }));
  beamGlow.position.copy(beam.position); scene.add(beamGlow);

  updateNearGrass(true);

  /* ---------- loop ---------- */
  let last = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.033,(now-last)/1000); last = now;

    if(swingState==="aim"){
      aimAngle = THREE.MathUtils.lerp(aimAngle, aimAngleTarget, Math.min(1, dt*14));
    }
    stepPhysics(dt);
    updateAimIndicator();

    if(swingState==="flight") flightCamera();
    else if(swingState!=="sunk") aimCamera(false);

    ballShadow.position.set(ball.position.x, heightAt(ball.position.x,ball.position.z)+0.015, ball.position.z);

    const posAttr = flag.geometry.attributes.position;
    for(let i=0;i<posAttr.count;i++){
      const bx = flagBasePos[i*3];
      posAttr.setZ(i, Math.sin(now*0.004+bx*7)*0.02*(bx+0.21)/0.42);
    }
    posAttr.needsUpdate = true;

    // golfer: track the aim line, breathe at address, swing club + arms as one rig, drift cigar smoke
    if(swingState==="aim" || swingState==="power" || swingState==="accuracy"){
      const sa = Math.sin(aimAngle), ca = Math.cos(aimAngle);
      golfer.position.x = ball.position.x + ca*1.0 - sa*0.19;
      golfer.position.z = ball.position.z - sa*1.0 - ca*0.19;
      golfer.rotation.y = aimAngle - Math.PI/2;
    }
    const gd = golfer.userData;
    const swingT = now/1000 - golferSwingT0;
    let psi = 0, coil = 0;
    if(swingT >= 0){
      const A = golferAmp;
      if(swingT < SW_BACK){ psi = -2.2*A*sstep(swingT/SW_BACK); }
      else if(swingT < SW_IMPACT){ const p=(swingT-SW_BACK)/(SW_IMPACT-SW_BACK); psi = THREE.MathUtils.lerp(-2.2*A, 0.12, p*p); }
      else { const p=Math.min(1,(swingT-SW_IMPACT)/(SW_END-SW_IMPACT)); psi = THREE.MathUtils.lerp(0.12, 2.0*A, 1-(1-p)*(1-p)); }
      coil = THREE.MathUtils.clamp(-psi/2.2, -0.9, 1);
      if(swingState==="swing" && pendingShot && swingT >= SW_IMPACT){
        const ps = pendingShot; pendingShot = null; launchShot(ps.power, ps.acc);
      }
    }
    gd.rig.rotation.z = THREE.MathUtils.lerp(gd.rig.rotation.z, psi, swingT>=0 ? 1 : 0.2);
    gd.torso.rotation.y = THREE.MathUtils.lerp(gd.torso.rotation.y, -coil*0.7, 0.35);
    gd.hips.rotation.y = THREE.MathUtils.lerp(gd.hips.rotation.y, -coil*0.3, 0.35);
    gd.torso.rotation.x = gd.LEAN + Math.sin(now*0.0016)*0.012;   // slow breathing at address
    gd.ember.getWorldPosition(_tmpV);
    const st = (now/1000*0.45) % 1;
    smoke.position.set(_tmpV.x, _tmpV.y + 0.05 + st*0.5, _tmpV.z);
    smoke.material.opacity = 0.35*(1-st);
    smoke.scale.setScalar(1 + st*2.2);
    smoke.quaternion.copy(camera.quaternion);

    if(swingState==="power"){
      document.getElementById("power-fill").style.width = (currentPower()*100).toFixed(0)+"%";
    }
    if(swingState==="accuracy"){
      document.getElementById("accuracy-marker").style.left = (50+currentAccuracy()*50)+"%";
    }

    { const tt = performance.now()/1000; skyMat.uniforms.t.value = tt; oceanMat.uniforms.t.value = tt; windU.value = tt;
      sun.position.set(golfer.position.x+55, 85, golfer.position.z-35); sun.target.position.copy(golfer.position); sun.target.updateMatrixWorld(); }
    { const dPin = currentDistance(); const bo = dPin>50 && !holeDone ? 1 : 0; beam.visible = beamGlow.visible = bo>0; const pulse = 0.85+0.15*Math.sin(performance.now()/500); beam.material.opacity = 0.4*pulse; }
    seeThru.cam.value.copy(camera.position); if(swingState==='flight'||swingState==='sunk') seeThru.foc.value.copy(ball.position); else seeThru.foc.value.set(golfer.position.x,golfer.position.y+1.2,golfer.position.z);
    updateNearGrass(false); drawMinimap(); updatePinMarker();
    renderer.render(scene,camera);
  }
  animate();

})();
</script>
</body>
