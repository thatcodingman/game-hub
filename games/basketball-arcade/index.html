<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball Arcade</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #090A10;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #game-container { line-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
(function () {

// ---------------------------------------------------------------------
// Career storage (same shape as Sumo Push's STATS_KEY pattern)
// ---------------------------------------------------------------------
const CAREER_KEY = 'basketballArcade_career_v1';

function loadCareer() {
  try {
    const raw = localStorage.getItem(CAREER_KEY);
    if (!raw) return defaultCareer();
    return Object.assign(defaultCareer(), JSON.parse(raw));
  } catch (e) { return defaultCareer(); }
}
function saveCareer(c) {
  try { localStorage.setItem(CAREER_KEY, JSON.stringify(c)); } catch (e) {}
}
function defaultCareer() {
  return { milestonesComplete: 0, stars: 0, unlockedCharacters: ['jett', 'brick', 'arc', 'tank'], unlockedCourts: ['street'] };
}
const career = loadCareer(); // wired for later phases

// ---------------------------------------------------------------------
// Palette
// ---------------------------------------------------------------------
const COLOR = {
  bg: 0x090A10, court: 0x12603A, courtDark: 0x0d4a2c, lines: 0x3D8B61,
  p1: 0x24B7FF, p2: 0xFF6B6B, ball: 0xFF7A18, white: 0xF2F4F7, gold: 0xfbbf24
};

// ---------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------
const W = 960, H = 540;
const GROUND_Y = H - 90;
const HOOP_Y = 190;
const HOOP_R_X = 860;   // right hoop — player's target
const HOOP_L_X = 100;   // left hoop — AI's target
const WIN_SCORE = 5;
const PLAYER_SPEED = 4.2;
const JUMP_VY = -11;
const BASE_GRAB_RADIUS = 42;
const BASE_SHOOT_VX = 8;
const BASE_SHOOT_VY = -13;
const TACKLE_RANGE = 46;
const SHOVE_RANGE = 50;
const TACKLE_SUCCESS = 0.3;
const TACKLE_COOLDOWN = 700;
const SHOVE_COOLDOWN = 350;
const TACKLE_DOWN_DURATION = 700;  // a landed tackle: both players go down, then get up together
const WHIFF_STUMBLE_DURATION = 220; // a failed tackle briefly overextends the tackler (stays standing)

// ---------------------------------------------------------------------
// Round modifiers — Basket-Random-style chaos between rounds.
// Each returns a delta applied against BASE values; only one active
// at a time, reset to baseline before the next is rolled.
// ---------------------------------------------------------------------
const MODIFIERS = [
  { id: 'none',      name: 'STREETBALL',   desc: 'No modifier.' },
  { id: 'tinyBall',  name: 'TINY BALL',    desc: 'The ball shrinks.' },
  { id: 'heavyBall', name: 'HEAVY BALL',   desc: 'The ball gets heavy.' },
  { id: 'moonGrav',  name: 'MOON COURT',   desc: 'Low gravity.' },
  { id: 'bouncy',    name: 'SUPER BOUNCE', desc: 'Everything bounces.' },
  { id: 'longArms',  name: 'LONG ARMS',    desc: 'Reach extended.' },
  { id: 'giants',    name: 'GIANTS',       desc: 'Players grow.' },
  { id: 'tinyHoop',  name: 'TINY HOOP',    desc: 'The rim shrinks.' },
  { id: 'doublePts', name: 'DOUBLE POINTS',desc: 'Next basket counts double.' }
];

// ---------------------------------------------------------------------
// Physics archetypes — real per-actor stat multipliers (speed, jump,
// steal/grab reach, shot power, and Matter body mass) so Jett and Brick
// genuinely move and collide differently, not just look different.
// ---------------------------------------------------------------------
const ARCHETYPES = {
  jett:  { id: 'jett',  name: 'JETT',  color: 0x24B7FF, speed: 1.15, jump: 1.20, steal: 1.05, shot: 0.90, mass: 0.85,
           tag: 'Fast & slippery' },
  brick: { id: 'brick', name: 'BRICK', color: 0xFF6B6B, speed: 0.80, jump: 0.80, steal: 0.90, shot: 1.10, mass: 1.35,
           tag: 'Heavy & powerful' },
  arc:   { id: 'arc',   name: 'ARC',   color: 0xa78bfa, speed: 1.00, jump: 1.05, steal: 0.85, shot: 1.25, mass: 0.75,
           tag: 'Sharpshooter, fragile' },
  tank:  { id: 'tank',  name: 'TANK',  color: 0xf59e0b, speed: 0.70, jump: 0.75, steal: 1.15, shot: 0.95, mass: 1.50,
           tag: 'Slow, nearly unmovable' },
  zip:   { id: 'zip',   name: 'ZIP',   color: 0x4ade80, speed: 1.25, jump: 1.35, steal: 1.00, shot: 0.95, mass: 0.65,
           tag: 'Hyperactive aerial freak' },
  bull:  { id: 'bull',  name: 'BULL',  color: 0xec4899, speed: 1.10, jump: 0.70, steal: 1.20, shot: 1.05, mass: 1.20,
           tag: 'Reckless charger' },
  flick: { id: 'flick', name: 'FLICK', color: 0x22d3ee, speed: 1.00, jump: 0.95, steal: 0.75, shot: 1.30, mass: 0.70,
           tag: 'Trick-shot artist' },
  grit:  { id: 'grit',  name: 'GRIT',  color: 0x78716c, speed: 0.75, jump: 0.85, steal: 1.25, shot: 0.80, mass: 1.25,
           tag: 'Relentless defensive pest' }
};
const ARCHETYPE_KEYS = Object.keys(ARCHETYPES);

// ---------------------------------------------------------------------
// Career mode: a fixed streak ladder. Beat the current opponent to face
// a harder one; each rung tightens the AI's decision timers and speed.
// Progress (rung reached) saves to CAREER_KEY via career.milestonesComplete.
// ---------------------------------------------------------------------
// "The Run" — an unofficial streetball circuit. No refs, no contracts,
// just a chain of courts and whoever survives the ladder gets a shot at
// The Champion. Bull and Flick sit outside the fixed ladder for now (pool
// characters — future rematch/branch material) but are playable everywhere else.
const CAREER_LADDER = [
  { name: 'Rookie Run',      opponent: 'zip',   speedMult: 0.90, decisionMs: 380, shotWindupMs: 520,
    intro: ['ZIP: "Wait... you\'re the rookie?"', 'ZIP: "Okay. This might actually be fun."'],
    winLine: 'ZIP: "RUN IT BACK!"', loseLine: 'ZIP: "Aw, that\'s it? Come back when you\'re ready!"' },
  { name: 'Corner Hustler',  opponent: 'jett',  speedMult: 1.00, decisionMs: 320, shotWindupMs: 460,
    intro: ['JETT: "Three wins? Not bad."', 'JETT: "But everybody looks fast before they meet me."'],
    winLine: 'JETT: "Okay... I officially don\'t like you anymore."', loseLine: 'JETT: "Told you. Nobody outruns me."' },
  { name: 'Backboard Bully', opponent: 'brick', speedMult: 1.00, decisionMs: 260, shotWindupMs: 420,
    intro: ['BRICK: "You\'ve been playing basketball."', 'BRICK: "Now you\'re playing me."'],
    winLine: 'BRICK: "Enjoy it."', loseLine: 'BRICK: "That\'s what I thought."' },
  { name: 'Dead-Eye',        opponent: 'arc',   speedMult: 1.05, decisionMs: 220, shotWindupMs: 380,
    intro: ['ARC: "I heard you\'ve been causing problems."', 'ARC: "Good."'],
    winLine: 'ARC: "Nice shot."', loseLine: 'ARC: "Maybe next time."' },
  { name: 'Two-Way Threat',  opponent: 'grit',  speedMult: 1.10, decisionMs: 180, shotWindupMs: 340,
    intro: ['GRIT: "You came this far."', 'GRIT: "Don\'t waste it."'],
    winLine: 'GRIT: "You earned that."', loseLine: 'GRIT: "You\'ll get there."' },
  { name: 'The Champion',    opponent: 'tank',  speedMult: 1.15, decisionMs: 140, shotWindupMs: 300,
    intro: ['TANK: "You\'ve beaten everyone else."', 'TANK: "Show me."'],
    winLine: 'TANK just nods. Once.', loseLine: 'TANK says nothing. He doesn\'t need to.' }
];

class MainScene extends Phaser.Scene {
  constructor() { super('main'); }
  preload() {}

  create() {
    this.matter.world.setBounds(0, 0, W, H, 32, true, true, true, true);
    this.matter.world.engine.world.gravity.y = 1;
    this.cameras.main.setBackgroundColor(COLOR.bg);

    this.drawCourt();
    this.matter.add.rectangle(W / 2, GROUND_Y + 30, W, 60, { isStatic: true, friction: 0.8, label: 'ground' });

    this.rimScale = 1;
    this.hoops = [
      { x: HOOP_R_X, mirror: 1, side: 'right' },
      { x: HOOP_L_X, mirror: -1, side: 'left' }
    ];
    this.hoops.forEach((h) => {
      h.rimBounce = 0;
      h.netStretch = 0;
      this.matter.add.rectangle(h.x + h.mirror * 34, HOOP_Y - 32, 10, 92, {
        isStatic: true, friction: 0.1, restitution: 0.6, label: 'backboard'
      });
      h.rimBody = this.matter.add.circle(h.x, HOOP_Y, 7, {
        isStatic: true, restitution: 0.35, friction: 0.1, label: 'rim',
        onCollideCallback: () => { this.playSfx('rim'); h.rimBounce = 1; }
      });
      h.sensor = this.matter.add.rectangle(h.x - h.mirror * 6, HOOP_Y + 18, 30, 10, {
        isStatic: true, isSensor: true, label: 'hoopSensor'
      });
      this.drawHoop(h);
    });

    // ---- Ball ----
    this.ballCarrier = null;
    this.ballScoredCooldown = false;
    this.ballSquash = 1;
    this.ballTrail = [];
    this.ballRadius = 15;

    const ballBody = this.matter.add.circle(0, 0, this.ballRadius, {
      friction: 0.01, frictionAir: 0.002, restitution: 0.75, label: 'ball'
    });
    this.matter.body.setMass(ballBody, 0.35);
    this.ball = ballBody;
    this.ballGfx = this.add.graphics().setDepth(6);
    this.trailGfx = this.add.graphics().setDepth(5);

    // ---- FX layers ----
    this.dustGfx = this.add.graphics().setDepth(3);
    this.dustParticles = [];
    this.flashGfx = this.add.graphics().setDepth(7);
    this.flashes = [];

    // ---- Actors ----
    this.player = this.makeActor(200, GROUND_Y - 25, COLOR.p1, 'player');
    this.ai = this.makeActor(650, GROUND_Y - 25, COLOR.p2, 'ai');
    this.ai.state = 'SEEK';
    this.ai.reactionTimer = 0;
    this.ai.shootWindupTimer = 0;

    // ---- Round / modifier state ----
    this.round = 1;
    this.shoveStreak = 0;
    this.grabRadius = BASE_GRAB_RADIUS;
    this.shootVx = BASE_SHOOT_VX;
    this.shootVy = BASE_SHOOT_VY;
    this.pointsThisRound = 2;
    this.playerScale = 1;
    this.gravityScale = 1;
    this.activeModifier = MODIFIERS[0];

    // Arrow keys are the default; WASD/Space work too, both bound at once
    // so either scheme just works with no menu to configure.
    // P1 = WASD + F/E/Space. P2 (local 2-player only) = arrows + /  .  , —
    // clustered near the arrow keys so both schemes stay comfortable.
    // In vs-AI mode the arrow keys fall back to controlling P1 (see update()).
    this.keys = this.input.keyboard.addKeys({
      left: 'A', right: 'D', jump: 'W', action: 'F', shove: 'E',
      leftArrow: 'LEFT', rightArrow: 'RIGHT', upArrow: 'UP', space: 'SPACE',
      p2Shoot: 'FORWARD_SLASH', p2Tackle: 'PERIOD', p2Shove: 'COMMA'
    });
    const doShoot = () => { if (this.ballCarrier === 'player') this.shootBall(this.player); };
    const doTackle = () => this.tryTackle(this.player, this.ai);
    const doShove = () => this.tryShove(this.player, this.ai);
    const doJumpP1 = () => this.tryJump(this.player);
    const doJumpArrow = () => this.tryJump(this.twoPlayerMode ? this.ai : this.player);
    this.keys.space.on('down', doShoot);
    this.keys.action.on('down', doTackle);
    this.keys.shove.on('down', doShove);
    this.keys.jump.on('down', doJumpP1);
    this.keys.upArrow.on('down', doJumpArrow);

    this.keys.p2Shoot.on('down', () => { if (this.twoPlayerMode && this.ballCarrier === 'ai') this.shootBall(this.ai); });
    this.keys.p2Tackle.on('down', () => { if (this.twoPlayerMode) this.tryTackle(this.ai, this.player); });
    this.keys.p2Shove.on('down', () => { if (this.twoPlayerMode) this.tryShove(this.ai, this.player); });

    this.matter.world.on('collisionstart', (event) => {
      for (const pair of event.pairs) {
        const labels = [pair.bodyA.label, pair.bodyB.label].sort().join('|');
        if (labels === 'ai|player') {
          this.playSfx('collision');
          this.shakeCamera(3);
          this.spawnFlash((this.player.body.position.x + this.ai.body.position.x) / 2,
                           (this.player.body.position.y + this.ai.body.position.y) / 2, COLOR.white);
          // physical, unpredictable: a jarring contact can jolt the ball loose
          if (this.ballCarrier) this.dropBall(true);
        }
        if (labels === 'ball|ground') this.playSfx('bounce');
      }
    });

    // ---- Mode select, then archetype select, gate the actual match ----
    this.selecting = true;
    this.matchOver = true; // keep game logic idle until startMatch()
    this.twoPlayerMode = false;
    this.careerActive = false;
    this.careerRung = 0;

    // Persistent back-to-menu button — always on screen (select screens,
    // mid-match, cutscenes) and just restarts the scene, which drops back
    // to mode select the same way the champion/lose screens' buttons do.
    this.menuBtn = this.add.text(16, 16, '☰ MENU', {
      fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold',
      backgroundColor: '#11161f', padding: { x: 10, y: 6 }
    }).setDepth(100).setInteractive({ useHandCursor: true });
    this.menuBtn.on('pointerover', () => this.menuBtn.setColor('#F2F4F7'));
    this.menuBtn.on('pointerout', () => this.menuBtn.setColor('#94a3b8'));
    this.menuBtn.on('pointerdown', () => this.scene.restart());

    this.buildModeSelect();
  }

  // ------------------------------------------------------------
  // Mode select — vs AI or local 2-player, shown before archetypes
  // ------------------------------------------------------------
  buildModeSelect() {
    const items = [];
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.6).setDepth(40);
    items.push(dim);

    const title = this.add.text(W / 2, H / 2 - 168, 'SELECT MODE', {
      fontFamily: 'system-ui, sans-serif', fontSize: '26px', color: '#F2F4F7', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.9);
    items.push(title);
    this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 350, ease: 'Back.Out' });

    const rung = Math.min(career.milestonesComplete, CAREER_LADDER.length - 1);
    const careerSub = career.milestonesComplete >= CAREER_LADDER.length
      ? `Champion — ladder cleared (${CAREER_LADDER.length}/${CAREER_LADDER.length})`
      : `Streak ladder — rung ${rung + 1} of ${CAREER_LADDER.length}`;

    const modes = [
      { id: 'ai', label: 'VS AI', sub: 'Play against the computer', color: COLOR.p1 },
      { id: '2p', label: 'VS PLAYER 2', sub: 'Pass the keyboard — local co-op controls', color: COLOR.p2 },
      { id: 'career', label: 'CAREER', sub: careerSub, color: COLOR.gold }
    ];
    const btnW = 280, btnH = 76;

    modes.forEach((m, idx) => {
      const x = W / 2;
      const baseY = H / 2 - 94 + idx * 88;
      const container = this.add.container(x, baseY).setDepth(41).setAlpha(0).setScale(0.9);
      items.push(container);

      const glow = this.add.rectangle(0, 0, btnW + 14, btnH + 14, m.color, 0).setStrokeStyle(3, m.color, 0);
      const btn = this.add.rectangle(0, 0, btnW, btnH, 0x11161f, 0.96).setStrokeStyle(3, m.color, 0.9);
      const label = this.add.text(0, -12, m.label, {
        fontFamily: 'system-ui, sans-serif', fontSize: '19px', color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5);
      const sub = this.add.text(0, 14, m.sub, {
        fontFamily: 'system-ui, sans-serif', fontSize: '11px', color: '#94a3b8'
      }).setOrigin(0.5);

      container.add([glow, btn, label, sub]);
      btn.setInteractive({ useHandCursor: true });

      const pick = () => {
        if (!this.selecting) return;
        this.selecting = false;
        items.forEach(o => o.destroy());
        this.twoPlayerMode = (m.id === '2p');
        this.careerActive = (m.id === 'career');
        if (this.careerActive) {
          this.careerRung = Math.min(career.milestonesComplete, CAREER_LADDER.length - 1);
        }
        this.selecting = true;
        this.buildSelectScreen();
      };

      btn.on('pointerover', () => {
        this.tweens.add({ targets: container, scaleX: 1.04, scaleY: 1.04, duration: 140, ease: 'Cubic.Out' });
        glow.setStrokeStyle(3, m.color, 0.55);
        btn.setFillStyle(0x1a2230, 1);
      });
      btn.on('pointerout', () => {
        this.tweens.add({ targets: container, scaleX: 1, scaleY: 1, duration: 140, ease: 'Cubic.Out' });
        glow.setStrokeStyle(3, m.color, 0);
        btn.setFillStyle(0x11161f, 0.96);
      });
      btn.on('pointerdown', () => {
        this.tweens.add({ targets: container, scaleX: 0.95, scaleY: 0.95, duration: 70, yoyo: true, onComplete: pick });
      });

      this.tweens.add({ targets: container, alpha: 1, scaleX: 1, scaleY: 1, duration: 380, delay: 150 + idx * 100, ease: 'Back.Out' });
    });
  }

  // ------------------------------------------------------------
  // Archetype select — Player 1 picks from the full roster; in vs-AI
  // mode the AI is randomly assigned one of the remaining archetypes,
  // in 2-player mode Player 2 then gets their own pick screen.
  // ------------------------------------------------------------
  buildSelectScreen() {
    this.buildArchetypeGrid(
      this.twoPlayerMode ? 'PLAYER 1 — CHOOSE YOUR PLAYER' : 'CHOOSE YOUR PLAYER',
      this.twoPlayerMode ? 'Player 1 picks first' : 'Click a card to pick your player',
      (key) => {
        this.player.arch = ARCHETYPES[key];
        this.player.color = ARCHETYPES[key].color;
        this.refreshActorStats(this.player);
        if (this.twoPlayerMode) {
          this.selecting = true;
          this.buildSelectScreenP2();
        } else if (this.careerActive) {
          const rungData = CAREER_LADDER[this.careerRung];
          this.ai.arch = ARCHETYPES[rungData.opponent];
          this.ai.color = ARCHETYPES[rungData.opponent].color;
          this.refreshActorStats(this.ai);
          this.applyCareerDifficulty();
          this.showCareerIntro(rungData, () => this.startMatch());
        } else {
          const remaining = ARCHETYPE_KEYS.filter(k => k !== key);
          const aiKey = remaining[Math.floor(Math.random() * remaining.length)];
          this.ai.arch = ARCHETYPES[aiKey];
          this.ai.color = ARCHETYPES[aiKey].color;
          this.refreshActorStats(this.ai);
          this.startMatch();
        }
      }
    );
  }

  buildSelectScreenP2() {
    this.buildArchetypeGrid('PLAYER 2 — CHOOSE YOUR PLAYER', 'Player 2 picks now', (key) => {
      this.ai.arch = ARCHETYPES[key];
      this.ai.color = ARCHETYPES[key].color;
      this.refreshActorStats(this.ai);
      this.startMatch();
    });
  }

  // Shared grid builder — a row of cards, one per ARCHETYPE_KEYS entry,
  // with entrance/hover/press animation. Calls onPick(key) once and tears
  // itself down.
  buildArchetypeGrid(titleText, hintText, onPick) {
    const items = [];

    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.6).setDepth(40);
    items.push(dim);
    const vignette = this.add.graphics().setDepth(40);
    vignette.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0, 0, 0.35, 0.35);
    vignette.fillCircle(W / 2, H / 2, 360);
    items.push(vignette);

    const n = ARCHETYPE_KEYS.length;
    const cols = Math.min(n, 4);
    const rows = Math.ceil(n / cols);
    const titleY = rows > 1 ? H / 2 - 200 : H / 2 - 152;

    const titleGlow = this.add.text(W / 2, titleY, titleText, {
      fontFamily: 'system-ui, sans-serif', fontSize: '26px', color: '#fbbf24', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(40).setAlpha(0.35).setScale(1.08);
    items.push(titleGlow);
    const title = this.add.text(W / 2, titleY, titleText, {
      fontFamily: 'system-ui, sans-serif', fontSize: '26px', color: '#F2F4F7', fontStyle: 'bold', letterSpacing: 1
    }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.9);
    items.push(title);
    this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 380, ease: 'Back.Out' });
    this.tweens.add({
      targets: titleGlow, alpha: { from: 0.15, to: 0.4 }, scale: { from: 1.05, to: 1.12 },
      duration: 1100, yoyo: true, repeat: -1, ease: 'Sine.InOut'
    });

    const cardW = rows > 1 ? 150 : (n > 2 ? 188 : 250);
    const cardH = rows > 1 ? 158 : (n > 2 ? 236 : 270);
    const gapX = 14, gapY = 14;
    const avatarR = rows > 1 ? 20 : (n > 2 ? 30 : 36);
    const gridH = rows * cardH + (rows - 1) * gapY;
    const gridCenterY = rows > 1 ? (H / 2 + 8) : (H / 2 + 18);
    const rowTopCenterY = gridCenterY - gridH / 2 + cardH / 2;
    const bottomRowCenterY = rowTopCenterY + (rows - 1) * (cardH + gapY);

    const positions = ARCHETYPE_KEYS.map((key, idx) => {
      const row = Math.floor(idx / cols), col = idx % cols;
      return {
        key,
        x: W / 2 - ((cols - 1) / 2) * (cardW + gapX) + col * (cardW + gapX),
        y: rowTopCenterY + row * (cardH + gapY)
      };
    });

    positions.forEach(({ key, x, y }, idx) => {
      const arch = ARCHETYPES[key];
      const baseY = y;
      const container = this.add.container(x, baseY).setDepth(41).setAlpha(0).setScale(0.82);
      items.push(container);

      const glow = this.add.rectangle(0, 0, cardW + 14, cardH + 14, arch.color, 0).setStrokeStyle(3, arch.color, 0);
      const card = this.add.rectangle(0, 0, cardW, cardH, 0x11161f, 0.96).setStrokeStyle(3, arch.color, 0.9);

      const compact = rows > 1;
      const wide = n > 2 && !compact;

      const avatarG = this.add.graphics();
      const avatarY = compact ? -cardH * 0.29 : -cardH * 0.29;
      this.drawAvatarFace(avatarG, 0, avatarY, avatarR, key);

      const name = this.add.text(0, avatarY + avatarR + (compact ? 16 : 22), arch.name, {
        fontFamily: 'system-ui, sans-serif', fontSize: compact ? '14px' : (wide ? '19px' : '25px'), color: '#F2F4F7', fontStyle: 'bold'
      }).setOrigin(0.5);

      const tag = this.add.text(0, avatarY + avatarR + (compact ? 32 : 44), arch.tag, {
        fontFamily: 'system-ui, sans-serif', fontSize: compact ? '8.5px' : (wide ? '10.5px' : '13px'), color: '#94a3b8', align: 'center',
        wordWrap: { width: cardW - (compact ? 14 : 24) }
      }).setOrigin(0.5);

      const statBars = this.add.graphics();
      const statRows = [['SPD', arch.speed], ['SHOT', arch.shot], ['JMP', arch.jump]];
      const barTop = avatarY + avatarR + (compact ? 50 : 64);
      const trackW = cardW - (compact ? 66 : (wide ? 80 : 130));
      const labelX = -cardW / 2 + (compact ? 12 : (wide ? 16 : 22));
      const barX = labelX + (compact ? 24 : (wide ? 30 : 40));
      statRows.forEach(([label, val], i) => {
        const ry = barTop + i * (compact ? 14 : (wide ? 18 : 22));
        const t = this.add.text(labelX, ry, label, { fontFamily: 'system-ui, sans-serif', fontSize: compact ? '8px' : (wide ? '10px' : '11px'), color: '#94a3b8' }).setOrigin(0, 0.5);
        container.add(t);
        statBars.fillStyle(0x1f2937, 1);
        statBars.fillRoundedRect(barX, ry - (compact ? 3.5 : 4.5), trackW, compact ? 7 : 9, 4);
        const pct = Phaser.Math.Clamp(val / 1.5, 0.15, 1);
        statBars.fillStyle(arch.color, 1);
        statBars.fillRoundedRect(barX, ry - (compact ? 3.5 : 4.5), trackW * pct, compact ? 7 : 9, 4);
      });

      const hint2 = this.add.text(0, cardH / 2 - (compact ? 11 : 16), 'CLICK TO PICK', {
        fontFamily: 'system-ui, sans-serif', fontSize: compact ? '8px' : (wide ? '9.5px' : '11px'), color: '#64748b', fontStyle: 'bold'
      }).setOrigin(0.5).setAlpha(0.7);

      container.add([glow, card, avatarG, name, tag, statBars, hint2]);
      card.setInteractive({ useHandCursor: true });

      const pick = () => {
        if (!this.selecting) return;
        this.selecting = false;
        items.forEach(o => o.destroy());
        onPick(key);
      };

      card.on('pointerover', () => {
        this.tweens.add({ targets: container, scaleX: 1.05, scaleY: 1.05, y: baseY - 8, duration: 150, ease: 'Cubic.Out' });
        glow.setStrokeStyle(3, arch.color, 0.55);
        card.setFillStyle(0x1a2230, 1);
      });
      card.on('pointerout', () => {
        this.tweens.add({ targets: container, scaleX: 1, scaleY: 1, y: baseY, duration: 150, ease: 'Cubic.Out' });
        glow.setStrokeStyle(3, arch.color, 0);
        card.setFillStyle(0x11161f, 0.96);
      });
      card.on('pointerdown', () => {
        this.tweens.add({ targets: container, scaleX: 0.95, scaleY: 0.95, duration: 70, yoyo: true, onComplete: pick });
      });

      this.tweens.add({
        targets: container, alpha: 1, scaleX: 1, scaleY: 1,
        duration: 420, delay: 150 + idx * 100, ease: 'Back.Out'
      });
    });

    const hintY = rows > 1 ? (bottomRowCenterY + cardH / 2 + 22) : (H / 2 + (n > 2 ? 168 : 178));
    const hint = this.add.text(W / 2, hintY, hintText, {
      fontFamily: 'system-ui, sans-serif', fontSize: '14px', color: '#64748b'
    }).setOrigin(0.5).setDepth(41).setAlpha(0);
    items.push(hint);
    this.tweens.add({ targets: hint, alpha: 0.8, duration: 400, delay: 500 });
    this.tweens.add({ targets: hint, y: { from: hint.y, to: hint.y + 6 }, duration: 700, delay: 500, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
  }

  // Drawn "face" avatar for the select screen — sphere-shaded circle with
  // archetype-specific expression, since the game draws everything (no
  // external character art), matching the same silhouette style as drawActor.
  drawAvatarFace(g, x, y, r, key) {
    const arch = ARCHETYPES[key];
    const c = arch.color;
    const dark = Phaser.Display.Color.ValueToColor(c).darken(35).color;
    const light = Phaser.Display.Color.ValueToColor(c).lighten(22).color;

    g.fillStyle(c, 1);
    g.fillCircle(x, y, r);
    g.fillStyle(light, 0.35);
    g.fillEllipse(x - r * 0.32, y - r * 0.38, r * 0.9, r * 0.6);
    g.lineStyle(3, dark, 0.6);
    g.strokeCircle(x, y, r);

    const eyeY = y - r * 0.05;
    const eyeSpacing = r * 0.38;

    if (key === 'jett') {
      // confident: raked eyebrows, sly grin
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - eyeSpacing - 7, eyeY - 12, x - eyeSpacing + 6, eyeY - 16);
      g.lineBetween(x + eyeSpacing - 6, eyeY - 15, x + eyeSpacing + 7, eyeY - 10);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 6);
      g.fillCircle(x + eyeSpacing, eyeY, 6);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing + 2, eyeY, 3);
      g.fillCircle(x + eyeSpacing + 2, eyeY, 3);
      g.lineStyle(3, dark, 1);
      g.beginPath();
      g.arc(x, y + r * 0.32, r * 0.32, Phaser.Math.DegToRad(15), Phaser.Math.DegToRad(150), false);
      g.strokePath();
    } else if (key === 'brick') {
      // brick: furrowed brows, gritted-teeth determination
      g.lineStyle(4, dark, 1);
      g.lineBetween(x - eyeSpacing - 9, eyeY - 7, x - eyeSpacing + 4, eyeY - 15);
      g.lineBetween(x + eyeSpacing + 9, eyeY - 7, x + eyeSpacing - 4, eyeY - 15);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 2, 5.5);
      g.fillCircle(x + eyeSpacing, eyeY + 2, 5.5);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 2, 2.6);
      g.fillCircle(x + eyeSpacing, eyeY + 2, 2.6);
      g.fillStyle(COLOR.white, 1);
      g.fillRoundedRect(x - r * 0.34, y + r * 0.26, r * 0.68, r * 0.2, 2);
      g.lineStyle(1.5, dark, 0.85);
      for (let i = -2; i <= 2; i++) {
        const lx = x + i * (r * 0.13);
        g.lineBetween(lx, y + r * 0.26, lx, y + r * 0.26 + r * 0.2);
      }
    } else if (key === 'arc') {
      // arc: calm, level-browed focus — a sharpshooter's steady aim,
      // plus a little sparkle for "precision"
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - eyeSpacing - 6, eyeY - 13, x - eyeSpacing + 6, eyeY - 13);
      g.lineBetween(x + eyeSpacing - 6, eyeY - 13, x + eyeSpacing + 6, eyeY - 13);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 6);
      g.fillCircle(x + eyeSpacing, eyeY, 6);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 3);
      g.fillCircle(x + eyeSpacing, eyeY, 3);
      g.lineStyle(3, dark, 1);
      g.beginPath();
      g.arc(x, y + r * 0.3, r * 0.22, Phaser.Math.DegToRad(20), Phaser.Math.DegToRad(160), false);
      g.strokePath();
      g.fillStyle(COLOR.gold, 0.9);
      const spx = x + r * 0.58, spy = y - r * 0.62;
      g.fillRect(spx - 1, spy - 4, 2, 8);
      g.fillRect(spx - 4, spy - 1, 8, 2);
    } else if (key === 'tank') {
      // tank: thick flat brows, small stern eyes, flat mouth, heavy jaw shadow
      g.fillStyle(dark, 0.22);
      g.fillEllipse(x, y + r * 0.55, r * 0.95, r * 0.4);
      g.lineStyle(5, dark, 1);
      g.lineBetween(x - eyeSpacing - 8, eyeY - 10, x - eyeSpacing + 8, eyeY - 10);
      g.lineBetween(x + eyeSpacing - 8, eyeY - 10, x + eyeSpacing + 8, eyeY - 10);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 2, 4.5);
      g.fillCircle(x + eyeSpacing, eyeY + 2, 4.5);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 2, 2.2);
      g.fillCircle(x + eyeSpacing, eyeY + 2, 2.2);
      g.lineStyle(3.5, dark, 1);
      g.lineBetween(x - r * 0.22, y + r * 0.36, x + r * 0.22, y + r * 0.36);
    } else if (key === 'zip') {
      // zip: huge grin, energetic raised brows — permanently mid-highlight-reel
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - eyeSpacing - 7, eyeY - 15, x - eyeSpacing + 5, eyeY - 9);
      g.lineBetween(x + eyeSpacing - 5, eyeY - 9, x + eyeSpacing + 7, eyeY - 15);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 6.5);
      g.fillCircle(x + eyeSpacing, eyeY, 6.5);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 3.2);
      g.fillCircle(x + eyeSpacing, eyeY, 3.2);
      g.fillStyle(dark, 1);
      g.fillEllipse(x, y + r * 0.34, r * 0.4, r * 0.22);
      g.fillStyle(COLOR.white, 1);
      g.fillEllipse(x, y + r * 0.3, r * 0.32, r * 0.12);
    } else if (key === 'bull') {
      // bull: lowered head, angry eyes, steam-ahead energy
      g.fillStyle(dark, 0.2);
      g.fillEllipse(x, y + r * 0.05, r * 1.05, r * 0.95);
      g.lineStyle(4, dark, 1);
      g.lineBetween(x - eyeSpacing - 8, eyeY - 4, x - eyeSpacing + 6, eyeY - 12);
      g.lineBetween(x + eyeSpacing + 8, eyeY - 4, x + eyeSpacing - 6, eyeY - 12);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 3, 5);
      g.fillCircle(x + eyeSpacing, eyeY + 3, 5);
      g.fillStyle(0x7f1d1d, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 3, 2.6);
      g.fillCircle(x + eyeSpacing, eyeY + 3, 2.6);
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - r * 0.2, y + r * 0.38, x + r * 0.2, y + r * 0.38);
    } else if (key === 'flick') {
      // flick: relaxed, one eyebrow raised — a trick shot they've already called
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - eyeSpacing - 6, eyeY - 11, x - eyeSpacing + 6, eyeY - 11);
      g.lineBetween(x + eyeSpacing - 7, eyeY - 17, x + eyeSpacing + 5, eyeY - 10);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 5.5);
      g.fillCircle(x + eyeSpacing, eyeY, 5.5);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY, 2.6);
      g.fillCircle(x + eyeSpacing, eyeY, 2.6);
      g.lineStyle(3, dark, 1);
      g.beginPath();
      g.arc(x, y + r * 0.3, r * 0.26, Phaser.Math.DegToRad(10), Phaser.Math.DegToRad(120), false);
      g.strokePath();
    } else if (key === 'grit') {
      // grit: flat, unbothered expression — nothing moves this one
      g.lineStyle(3.5, dark, 1);
      g.lineBetween(x - eyeSpacing - 6, eyeY - 11, x - eyeSpacing + 6, eyeY - 11);
      g.lineBetween(x + eyeSpacing - 6, eyeY - 11, x + eyeSpacing + 6, eyeY - 11);
      g.fillStyle(COLOR.white, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 1, 5);
      g.fillCircle(x + eyeSpacing, eyeY + 1, 5);
      g.fillStyle(0x0f172a, 1);
      g.fillCircle(x - eyeSpacing, eyeY + 1, 2.4);
      g.fillCircle(x + eyeSpacing, eyeY + 1, 2.4);
      g.lineStyle(3, dark, 1);
      g.lineBetween(x - r * 0.18, y + r * 0.36, x + r * 0.18, y + r * 0.36);
    }
  }

  // Real per-actor stat derivation from the chosen archetype, layered on
  // top of the current (possibly modifier-scaled) baseline values.
  refreshActorStats(actor) {
    const arch = actor.arch;
    if (!arch) return;
    actor.speed = PLAYER_SPEED * arch.speed * (actor.careerSpeedMult || 1);
    actor.jumpVy = JUMP_VY * arch.jump;
    actor.grabRadius = this.grabRadius * arch.steal;
    actor.shotMult = arch.shot;
    if (actor.baseMass) {
      this.matter.body.setMass(actor.body, actor.baseMass * arch.mass);
    }
  }

  startMatch() {
    this.resetPositions();

    // ---- HUD ----
    this.score = { player: 0, ai: 0 };
    this.matchOver = false;
    this.buildHUD();
    this.showRoundBanner(true);

    const hintText = this.twoPlayerMode
      ? 'P1: WASD move · Space shoot · F tackle · E shove     P2: ←→↑ move · / shoot · . tackle · , shove'
      : '← / →  move     ↑ / W  jump     Space  shoot     F  tackle     E  shove';
    this.controlsHint = this.add.text(W / 2, H - 16, hintText, {
      fontFamily: 'system-ui, sans-serif', fontSize: this.twoPlayerMode ? '12px' : '13px', color: '#94a3b8'
    }).setOrigin(0.5, 1).setDepth(20).setAlpha(0.85);
    this.tweens.add({ targets: this.controlsHint, alpha: 0, delay: 4000, duration: 900 });
  }

  // ------------------------------------------------------------
  // Career mode — streak ladder. Win → advance to the next rung
  // automatically; lose → the run ends (progress already saved stays).
  // ------------------------------------------------------------
  applyCareerDifficulty() {
    const rung = CAREER_LADDER[this.careerRung];
    this.ai.careerSpeedMult = rung.speedMult;
    this.ai.decisionMs = rung.decisionMs;
    this.ai.shotWindupMs = rung.shotWindupMs;
    this.refreshActorStats(this.ai); // re-derive speed with the career multiplier folded in
  }

  // A tiny 2-beat "cutscene": a title card (rung + opponent), then the
  // opponent's intro lines one at a time — a little pre-match dialogue
  // rather than a single flavor sentence.
  showCareerIntro(rung, onDone) {
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(39);
    this.tweens.add({ targets: dim, alpha: 0.68, duration: 300 });

    const oppArch = ARCHETYPES[rung.opponent];
    const oppHex = '#' + oppArch.color.toString(16).padStart(6, '0');

    // Two lightweight "pseudo-actors" reusing the real drawActor() rig —
    // same silhouette, same arm-swing/shadow code as in-match — so the
    // walk-in reads as part of the same game, not a bolted-on clip.
    const standY = GROUND_Y - 25;
    const p1 = {
      body: { position: { x: -50, y: standY } }, gfx: this.add.graphics().setDepth(40),
      color: this.player.color, facing: 1, scale: 1, armSwing: 0, stumbleTimer: 0, tackleDownTimer: 0
    };
    const p2 = {
      body: { position: { x: W + 50, y: standY } }, gfx: this.add.graphics().setDepth(40),
      color: oppArch.color, facing: -1, scale: 1, armSwing: 0, stumbleTimer: 0, tackleDownTimer: 0
    };
    this.drawActor(p1);
    this.drawActor(p2);

    const p1X = W / 2 - 110, p2X = W / 2 + 110;
    this.tweens.add({
      targets: p1.body.position, x: p1X, duration: 620, ease: 'Cubic.Out',
      onUpdate: () => this.drawActor(p1)
    });
    this.tweens.add({
      targets: p2.body.position, x: p2X, duration: 620, delay: 60, ease: 'Cubic.Out',
      onUpdate: () => this.drawActor(p2)
    });
    // a little arm-pump while they close the distance, reusing the same
    // swing property the in-match reach/swat animation already drives
    this.tweens.add({ targets: p1, armSwing: 1, duration: 150, yoyo: true, repeat: 2, ease: 'Sine.InOut', onUpdate: () => this.drawActor(p1) });
    this.tweens.add({ targets: p2, armSwing: 1, duration: 150, delay: 60, yoyo: true, repeat: 2, ease: 'Sine.InOut', onUpdate: () => this.drawActor(p2) });

    // face-off impact beat once they've closed in, using the same juice
    // helpers a real collision uses (flash/shake/dust/sfx)
    this.time.delayedCall(700, () => {
      this.spawnFlash((p1X + p2X) / 2, standY - 20, COLOR.gold);
      this.shakeCamera(3);
      this.playSfx('collision');
      this.spawnDust((p1X + p2X) / 2, GROUND_Y - 2);
      this.tweens.add({ targets: [p1, p2], armSwing: 0.6, duration: 90, yoyo: true, onUpdate: () => { this.drawActor(p1); this.drawActor(p2); } });
    });

    const tag = this.add.text(W / 2, H / 2 - 30, `RUNG ${this.careerRung + 1} / ${CAREER_LADDER.length}`, {
      fontFamily: 'system-ui, sans-serif', fontSize: '15px', color: '#fbbf24', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41).setAlpha(0);

    const name = this.add.text(W / 2, H / 2 + 12, rung.name.toUpperCase(), {
      fontFamily: 'system-ui, sans-serif', fontSize: '34px', color: '#F2F4F7', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.85);

    const vs = this.add.text(W / 2, H / 2 + 50, `VS ${oppArch.name}`, {
      fontFamily: 'system-ui, sans-serif', fontSize: '15px', color: oppHex, fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41).setAlpha(0);

    const titleItems = [tag, name, vs];
    this.time.delayedCall(850, () => {
      this.tweens.add({ targets: [tag, vs], alpha: 0.9, duration: 300 });
      this.tweens.add({ targets: name, alpha: 1, scale: 1, duration: 420, ease: 'Back.Out' });
    });

    const lines = rung.intro && rung.intro.length ? rung.intro : [`${oppArch.name}: "Let's play."`];

    const showLine = (idx) => {
      const text = this.add.text(W / 2, H / 2 - 78, lines[idx], {
        fontFamily: 'system-ui, sans-serif', fontSize: '18px', color: oppHex, fontStyle: 'bold', align: 'center',
        wordWrap: { width: 560 }
      }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.94);
      this.tweens.add({ targets: text, alpha: 1, scale: 1, duration: 260, ease: 'Cubic.Out' });
      this.time.delayedCall(1250, () => {
        this.tweens.add({
          targets: text, alpha: 0, duration: 220,
          onComplete: () => {
            text.destroy();
            if (idx + 1 < lines.length) showLine(idx + 1);
            else finish();
          }
        });
      });
    };

    const finish = () => {
      this.tweens.add({
        targets: [dim, p1.gfx, p2.gfx], alpha: 0, duration: 300,
        onComplete: () => { dim.destroy(); p1.gfx.destroy(); p2.gfx.destroy(); onDone(); }
      });
    };

    this.time.delayedCall(1950, () => {
      this.tweens.add({
        targets: titleItems, alpha: 0, duration: 220,
        onComplete: () => { titleItems.forEach(o => o.destroy()); showLine(0); }
      });
    });
  }

  continueCareerMatch() {
    this.resetPositions();
    this.score = { player: 0, ai: 0 };
    this.hudPlayerScore.setText('0');
    this.hudAiScore.setText('0');
    this.hudAiLabel.setText(this.ai.arch.name + ' (AI)');
    this.hudAiLabel.setColor('#' + this.ai.color.toString(16).padStart(6, '0'));
    this.msgText.setText('');
    this.round = 1;
    this.rollModifier();
    this.showRoundBanner(true);
    this.matchOver = false;
  }

  // Called from onScore() instead of the normal endless-play reset when
  // this.careerActive is true.
  // A one-line reaction popup — used for a beaten opponent's parting shot
  // before the next rung's intro plays.
  showQuickLine(text, colorHex, onDone) {
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(40);
    const t = this.add.text(W / 2, H / 2, text, {
      fontFamily: 'system-ui, sans-serif', fontSize: '20px', color: colorHex, fontStyle: 'bold', align: 'center',
      wordWrap: { width: 560 }
    }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.92);
    this.tweens.add({ targets: dim, alpha: 0.55, duration: 250 });
    this.tweens.add({ targets: t, alpha: 1, scale: 1, duration: 280, ease: 'Cubic.Out' });
    this.time.delayedCall(1300, () => {
      this.tweens.add({
        targets: [dim, t], alpha: 0, duration: 260,
        onComplete: () => { dim.destroy(); t.destroy(); onDone(); }
      });
    });
  }

  handleCareerMatchEnd(scorer) {
    if (scorer === 'player') {
      const beatenRung = CAREER_LADDER[this.careerRung];
      if (this.careerRung >= career.milestonesComplete) {
        career.milestonesComplete = this.careerRung + 1;
        career.stars = (career.stars || 0) + 1;
        saveCareer(career);
      }
      const advance = () => {
        if (this.careerRung + 1 >= CAREER_LADDER.length) {
          this.showCareerEnd(true);
        } else {
          this.careerRung += 1;
          const rungData = CAREER_LADDER[this.careerRung];
          this.ai.arch = ARCHETYPES[rungData.opponent];
          this.ai.color = ARCHETYPES[rungData.opponent].color;
          this.refreshActorStats(this.ai);
          this.applyCareerDifficulty();
          this.showCareerIntro(rungData, () => this.continueCareerMatch());
        }
      };
      if (beatenRung.winLine) {
        const oppHex = '#' + ARCHETYPES[beatenRung.opponent].color.toString(16).padStart(6, '0');
        this.showQuickLine(beatenRung.winLine, oppHex, advance);
      } else {
        advance();
      }
    } else {
      this.showCareerEnd(false);
    }
  }

  showCareerEnd(won) {
    const items = [];
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.7).setDepth(40);
    items.push(dim);

    const rung = CAREER_LADDER[this.careerRung];
    const oppArch = ARCHETYPES[rung.opponent];
    const quote = won ? rung.winLine : rung.loseLine;

    const titleText = won ? 'CHAMPION!' : 'RUN OVER';
    const titleColor = won ? '#fbbf24' : '#FF6B6B';
    const subText = won
      ? `You cleared all ${CAREER_LADDER.length} rungs of the ladder.`
      : `You reached rung ${this.careerRung + 1} of ${CAREER_LADDER.length}. Your progress is saved.`;

    const title = this.add.text(W / 2, H / 2 - 56, titleText, {
      fontFamily: 'system-ui, sans-serif', fontSize: '36px', color: titleColor, fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41).setAlpha(0).setScale(0.85);
    items.push(title);
    this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 420, ease: 'Back.Out' });

    const sub = this.add.text(W / 2, H / 2 - 20, subText, {
      fontFamily: 'system-ui, sans-serif', fontSize: '14px', color: '#94a3b8', align: 'center',
      wordWrap: { width: 520 }
    }).setOrigin(0.5).setDepth(41).setAlpha(0);
    items.push(sub);
    this.tweens.add({ targets: sub, alpha: 0.9, duration: 300, delay: 150 });

    if (quote) {
      const oppHex = '#' + oppArch.color.toString(16).padStart(6, '0');
      const quoteText = this.add.text(W / 2, H / 2 + 10, quote, {
        fontFamily: 'system-ui, sans-serif', fontSize: '15px', color: oppHex, fontStyle: 'bold', align: 'center',
        wordWrap: { width: 520 }
      }).setOrigin(0.5).setDepth(41).setAlpha(0);
      items.push(quoteText);
      this.tweens.add({ targets: quoteText, alpha: 0.95, duration: 300, delay: 300 });
    }

    const btnW = 220, btnH = 60, btnColor = won ? COLOR.gold : COLOR.p1;
    const container = this.add.container(W / 2, H / 2 + 75).setDepth(41).setAlpha(0).setScale(0.9);
    items.push(container);
    const glow = this.add.rectangle(0, 0, btnW + 14, btnH + 14, btnColor, 0).setStrokeStyle(3, btnColor, 0);
    const btn = this.add.rectangle(0, 0, btnW, btnH, 0x11161f, 0.96).setStrokeStyle(3, btnColor, 0.9);
    const label = this.add.text(0, 0, won ? 'PLAY AGAIN' : 'TRY AGAIN', {
      fontFamily: 'system-ui, sans-serif', fontSize: '17px', color: '#F2F4F7', fontStyle: 'bold'
    }).setOrigin(0.5);
    container.add([glow, btn, label]);
    btn.setInteractive({ useHandCursor: true });

    const restart = () => { this.scene.restart(); };
    btn.on('pointerover', () => {
      this.tweens.add({ targets: container, scaleX: 1.05, scaleY: 1.05, duration: 140, ease: 'Cubic.Out' });
      glow.setStrokeStyle(3, btnColor, 0.55);
      btn.setFillStyle(0x1a2230, 1);
    });
    btn.on('pointerout', () => {
      this.tweens.add({ targets: container, scaleX: 1, scaleY: 1, duration: 140, ease: 'Cubic.Out' });
      glow.setStrokeStyle(3, btnColor, 0);
      btn.setFillStyle(0x11161f, 0.96);
    });
    btn.on('pointerdown', () => {
      this.tweens.add({ targets: container, scaleX: 0.95, scaleY: 0.95, duration: 70, yoyo: true, onComplete: restart });
    });
    this.tweens.add({ targets: container, alpha: 1, scaleX: 1, scaleY: 1, duration: 380, delay: 300, ease: 'Back.Out' });
  }

  // ------------------------------------------------------------
  // Drawing: court, hoop, stadium atmosphere
  // ------------------------------------------------------------
  drawCourt() {
    const g = this.add.graphics().setDepth(-10);
    const skylineTop = 0, courtTop = 118;

    // sky/arena backdrop instead of dead black space
    g.fillGradientStyle(0x151a24, 0x151a24, 0x090A10, 0x090A10, 1, 1, 1, 1);
    g.fillRect(0, skylineTop, W, courtTop);

    // simple stadium lights glow
    for (const lx of [140, W / 2, W - 140]) {
      g.fillStyle(0xfff4d6, 0.06);
      g.fillCircle(lx, 20, 70);
      g.fillStyle(0xfff4d6, 0.5);
      g.fillCircle(lx, 20, 6);
    }

    // crowd — two small arcade-style sections, one flanking each basket,
    // built from the same mini-figure language as the actual roster
    // (round head, blocky torso, colorful) rather than a full stadium band
    const rosterColors = [0x24B7FF, 0xFF6B6B, 0xa78bfa, 0xf59e0b, 0x4ade80, 0xfbbf24, 0x3b82f6, 0xf1f5f9];
    let seed = 11;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

    const drawCrowdSection = (centerX, sectionW) => {
      const rows = 2, rowH = 22, spacing = 15;
      const bandTop = courtTop - rows * rowH - 2;
      const left = centerX - sectionW / 2;

      // low riser/platform under the section
      g.fillStyle(0x11161f, 1);
      g.fillRect(left - 6, bandTop - 4, sectionW + 12, rows * rowH + 8);

      for (let row = 0; row < rows; row++) {
        const rowY = bandTop + row * rowH + rowH * 0.68;
        const s = row === 0 ? 0.8 : 1; // back row a touch smaller
        const offset = (row % 2) * (spacing / 2);
        for (let bx = left + offset; bx < left + sectionW; bx += spacing) {
          const c = rosterColors[Math.floor(rand() * rosterColors.length)];
          const dark = Phaser.Display.Color.ValueToColor(c).darken(35).color;
          const cheering = rand() < 0.25;

          // legs
          g.fillStyle(dark, 1);
          g.fillRect(bx - 3 * s, rowY + 7 * s, 2.5 * s, 5 * s);
          g.fillRect(bx + 0.5 * s, rowY + 7 * s, 2.5 * s, 5 * s);

          // torso — small rounded block, matching the players' silhouette style
          g.fillStyle(c, 1);
          g.fillRoundedRect(bx - 5 * s, rowY - 1 * s, 10 * s, 9 * s, 2.5);

          // arms — up if cheering
          g.lineStyle(2 * s, dark, 1);
          if (cheering) {
            g.lineBetween(bx - 5 * s, rowY, bx - 8 * s, rowY - 7 * s);
            g.lineBetween(bx + 5 * s, rowY, bx + 8 * s, rowY - 7 * s);
          } else {
            g.lineBetween(bx - 5 * s, rowY, bx - 6.5 * s, rowY + 6 * s);
            g.lineBetween(bx + 5 * s, rowY, bx + 6.5 * s, rowY + 6 * s);
          }

          // head
          g.fillStyle(c, 1);
          g.fillCircle(bx, rowY - 4.5 * s, 4 * s);
        }
      }
    };

    drawCrowdSection(HOOP_L_X + 30, 210);
    drawCrowdSection(HOOP_R_X - 30, 210);

    // railing separating stands from the court
    g.fillStyle(0x1a2230, 1);
    g.fillRect(0, courtTop - 4, W, 4);
    g.lineStyle(1, 0x3D8B61, 0.4);
    g.lineBetween(0, courtTop - 4, W, courtTop - 4);

    // court body
    g.fillStyle(COLOR.court, 1);
    g.fillRect(0, courtTop, W, GROUND_Y - courtTop);
    g.fillGradientStyle(0x000000, 0x000000, COLOR.court, COLOR.court, 0.25, 0.25, 0, 0);
    g.fillRect(0, courtTop, W, 60);

    // floor / baseline zone
    g.fillStyle(COLOR.courtDark, 1);
    g.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    g.lineStyle(3, COLOR.lines, 0.85);
    g.lineBetween(0, GROUND_Y, W, GROUND_Y);

    // court border
    g.lineStyle(3, COLOR.lines, 0.7);
    g.strokeRect(20, courtTop + 4, W - 40, GROUND_Y - courtTop - 4);

    // center line + center circle
    g.lineStyle(2, COLOR.lines, 0.6);
    g.lineBetween(W / 2, courtTop + 4, W / 2, GROUND_Y);
    g.strokeCircle(W / 2, (GROUND_Y + courtTop) / 2, 44);

    // key / lane + free-throw circle, hugging each hoop
    const laneW = 130, laneH = 150;
    g.lineStyle(2.5, COLOR.lines, 0.75);
    // right lane
    const laneXR = HOOP_R_X + 40 - laneW;
    g.strokeRect(laneXR, HOOP_Y + 20, laneW, laneH);
    g.strokeCircle(laneXR, HOOP_Y + 20 + laneH, 40);
    // left lane (mirrored)
    const laneXL = HOOP_L_X - 40;
    g.strokeRect(laneXL, HOOP_Y + 20, laneW, laneH);
    g.strokeCircle(laneXL + laneW, HOOP_Y + 20 + laneH, 40);

    // 3-point arcs — flattened ellipses, not true circles, so the math
    // guarantees they stay below the court border (a true-radius circle
    // was tall enough to poke up into the crowd — that was the bug)
    const drawFlatArc = (cx, cy, rx, ry, startDeg, endDeg) => {
      g.lineStyle(2.5, COLOR.lines, 0.7);
      g.beginPath();
      const segs = 40;
      for (let i = 0; i <= segs; i++) {
        const deg = startDeg + (endDeg - startDeg) * (i / segs);
        const t = Phaser.Math.DegToRad(deg);
        const px = cx + rx * Math.cos(t);
        const py = cy + ry * Math.sin(t);
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.strokePath();
    };
    const arcRx = 170, arcRy = 66; // ry kept well under the ~90px of headroom to courtTop
    drawFlatArc(HOOP_R_X - 4, HOOP_Y + 24, arcRx, arcRy, 100, 260);
    drawFlatArc(HOOP_L_X + 4, HOOP_Y + 24, arcRx, arcRy, 280, 440);

    this.courtGfx = g;
  }

  drawHoop(h) {
    const g = this.add.graphics().setDepth(1);
    const m = h.mirror;
    const backTop = HOOP_Y - 78, backH = 92, backX = h.x + m * 34;

    // support pole (behind backboard)
    g.lineStyle(7, 0x1c1917, 1);
    g.lineBetween(backX + m * 4, backTop + backH * 0.55, backX + m * 4, GROUND_Y);
    g.lineStyle(5, 0x2a2523, 1);
    g.lineBetween(backX + m * 4, backTop + backH * 0.55, h.x + m * 6, HOOP_Y - 4);

    // backboard — real rectangle, not a stray line
    g.fillStyle(0x0d1117, 0.4);
    g.fillRect(backX - 4 + m * 6, backTop + 4, 10, backH); // drop shadow
    g.fillStyle(COLOR.white, 1);
    g.fillRoundedRect(backX - 6 + m * 1, backTop, 10, backH, 2);
    g.lineStyle(2, COLOR.ball, 0.9);
    g.strokeRoundedRect(backX - 6 + m * 1, backTop, 10, backH, 2);
    // shooter's square on the board
    g.lineStyle(1.5, COLOR.ball, 0.7);
    g.strokeRect(backX - 6 + m * 1, HOOP_Y - 22, 10, 24);

    h.gfx = g;
    // rim + net are drawn dynamically in update() so they can react to hits/scores
  }

  drawNet(h) {
    const g = h.gfx;
    const rimW = 34 * this.rimScale, rimH = 11 * this.rimScale;

    // rim shadow/give on hit
    const give = h.rimBounce || 0;
    g.lineStyle(5, COLOR.ball, 1);
    g.strokeEllipse(h.x, HOOP_Y + give * 2, rimW, rimH);
    g.lineStyle(2, 0xc2410c, 1);
    g.strokeEllipse(h.x, HOOP_Y + give * 2, rimW * 0.94, rimH * 0.8);

    // net — denser strand set, stretches on a make
    const stretch = h.netStretch;
    const netTop = HOOP_Y + 3, netBottom = HOOP_Y + 32 + stretch * 20;
    g.lineStyle(1.5, COLOR.white, 0.75);
    for (let i = -4; i <= 4; i++) {
      const xTop = h.x + i * (rimW / 9);
      const xBot = h.x + i * (2.2 - stretch * 0.6);
      g.lineBetween(xTop, netTop, xBot, netBottom);
    }
    g.lineStyle(1, COLOR.white, 0.5);
    g.strokeEllipse(h.x, netTop + 10, rimW * 0.75, 5);
    g.strokeEllipse(h.x, netTop + 20 + stretch * 8, rimW * 0.5, 4);
  }

  // ------------------------------------------------------------
  // Actors — simple frame with a swinging arm for reach/swat feel
  // ------------------------------------------------------------
  makeActor(x, y, color, label) {
    const body = this.matter.add.rectangle(x, y, 30, 54, {
      friction: 0.05, frictionAir: 0.015, restitution: 0.1, label, inertia: Infinity
    });
    const gfx = this.add.graphics().setDepth(4);
    return {
      body, gfx, color, facing: label === 'player' ? 1 : -1, wasGrounded: true, armSwing: 0, grounded: true,
      baseMass: body.mass, tackleCooldown: 0, shoveCooldown: 0, stumbleTimer: 0, tackleDownTimer: 0, defendActionTimer: 0
    };
  }

  drawActor(actor) {
    if (actor.tackleDownTimer > 0) { this.drawActorDown(actor); return; }
    const stumbling = actor.stumbleTimer > 0;
    const jitter = stumbling ? (Math.random() - 0.5) * 5 : 0;
    const x = actor.body.position.x + jitter;
    const y = actor.body.position.y;
    const g = actor.gfx;
    g.clear();
    g.setAlpha(stumbling ? 0.6 : 1);
    const scale = actor.scale || 1;
    const c = actor.color;
    const dark = Phaser.Display.Color.ValueToColor(c).darken(30).color;

    // contact shadow — grounds the character regardless of jump height
    const airHeight = Math.max(0, (GROUND_Y - 25) - y);
    const shadowScale = Phaser.Math.Clamp(1 - airHeight / 140, 0.35, 1);
    g.fillStyle(0x000000, 0.35 * shadowScale);
    g.fillEllipse(x, GROUND_Y - 1, 30 * scale * shadowScale, 8 * scale * shadowScale);

    g.fillStyle(dark, 1);
    g.fillRoundedRect(x - 10 * scale, y + 6 * scale, 8 * scale, 16 * scale, 3);
    g.fillRoundedRect(x + 2 * scale, y + 6 * scale, 8 * scale, 16 * scale, 3);
    g.fillStyle(COLOR.white, 1);
    g.fillRoundedRect(x - 12 * scale, y + 20 * scale, 11 * scale, 5 * scale, 2);
    g.fillRoundedRect(x + 1 * scale, y + 20 * scale, 11 * scale, 5 * scale, 2);

    g.fillStyle(c, 1);
    g.fillRoundedRect(x - 14 * scale, y - 22 * scale, 28 * scale, 30 * scale, 8);

    // back arm — static
    g.fillStyle(dark, 1);
    g.fillRoundedRect(x - actor.facing * 18 * scale, y - 16 * scale, 6 * scale, 20 * scale, 3);

    // front arm — swings out on action press (reach/swat), decays back to rest
    const swing = actor.armSwing;
    const armLen = (20 + swing * 16) * scale;
    const armAngle = -0.3 + swing * -1.1; // sweeps up/forward
    const ax = x + actor.facing * (12 * scale + Math.cos(armAngle) * armLen * 0.5);
    const ay = y - 10 * scale + Math.sin(armAngle) * armLen * 0.5;
    g.lineStyle(6 * scale, dark, 1);
    g.beginPath();
    g.moveTo(x + actor.facing * 12 * scale, y - 10 * scale);
    g.lineTo(ax, ay);
    g.strokePath();
    g.fillStyle(dark, 1);
    g.fillCircle(ax, ay, 4 * scale); // hand

    // head + face — eyes give the silhouette a front, not just a facing dot
    g.fillStyle(c, 1);
    g.fillCircle(x, y - 30 * scale, 11 * scale);
    const eyeX = x + actor.facing * 3.5 * scale;
    g.fillStyle(COLOR.white, 1);
    g.fillCircle(eyeX + actor.facing * 3 * scale, y - 31 * scale, 3 * scale);
    g.fillStyle(0x0f172a, 1);
    g.fillCircle(eyeX + actor.facing * 4 * scale, y - 31 * scale, 1.4 * scale);
  }

  // Lying-down pose used while tackleDownTimer is active — a flattened
  // silhouette on the ground with a little dizzy-stars spin above the head,
  // so a landed tackle actually reads as "both players down for a beat"
  // instead of just freezing the standing sprite.
  drawActorDown(actor) {
    const x = actor.body.position.x;
    const groundY = GROUND_Y - 4;
    const g = actor.gfx;
    g.clear();
    const c = actor.color;
    const dark = Phaser.Display.Color.ValueToColor(c).darken(30).color;
    const dir = actor.facing || 1;

    g.fillStyle(0x000000, 0.35);
    g.fillEllipse(x, groundY + 5, 48, 10);

    // legs
    g.lineStyle(7, dark, 1);
    g.lineBetween(x - dir * 16, groundY - 2, x - dir * 30, groundY + 6);
    g.lineBetween(x - dir * 10, groundY - 2, x - dir * 22, groundY - 8);

    // torso, lying flat
    g.fillStyle(c, 1);
    g.fillRoundedRect(x - 18, groundY - 10, 36, 15, 6);

    // arm
    g.lineStyle(5, dark, 1);
    g.lineBetween(x + dir * 6, groundY - 4, x + dir * 18, groundY + 6);

    // head
    g.fillStyle(c, 1);
    g.fillCircle(x + dir * 24, groundY - 4, 10);
    g.fillStyle(COLOR.white, 1);
    g.fillCircle(x + dir * 27, groundY - 6, 2.6);
    g.fillStyle(0x0f172a, 1);
    g.fillCircle(x + dir * 28, groundY - 6, 1.3);

    // dizzy stars circling above the head
    const spin = (this.time.now / 140) % (Math.PI * 2);
    for (let i = 0; i < 3; i++) {
      const a = spin + i * (Math.PI * 2 / 3);
      const sx = x + dir * 24 + Math.cos(a) * 13;
      const sy = groundY - 20 + Math.sin(a) * 4;
      g.fillStyle(COLOR.gold, 0.9);
      g.fillCircle(sx, sy, 2.2);
    }
  }

  // ------------------------------------------------------------
  // Ball drawing
  // ------------------------------------------------------------
  drawBall() {
    const b = this.ball;
    const g = this.ballGfx;
    g.clear();
    const r = this.ballRadius;

    // contact shadow
    const airHeight = Math.max(0, (GROUND_Y - 15) - b.position.y);
    const shadowScale = Phaser.Math.Clamp(1 - airHeight / 200, 0.25, 1);
    g.fillStyle(0x000000, 0.3 * shadowScale);
    g.fillEllipse(b.position.x, GROUND_Y - 1, r * 1.8 * shadowScale, r * 0.5 * shadowScale);

    const speed = Math.min(Math.hypot(b.velocity.x, b.velocity.y), 14);
    const stretch = 1 + speed * 0.012;
    const squashTarget = this.ballCarrier ? 0.92 : 1;
    this.ballSquash += (squashTarget - this.ballSquash) * 0.2;

    const rx = r * this.ballSquash;
    const ry = r * (2 - this.ballSquash) * 0.5 + r * 0.5;

    g.fillStyle(COLOR.ball, 1);
    g.fillEllipse(b.position.x, b.position.y, rx * 2 * (this.ballCarrier ? 1 : stretch * 0.5 + 0.5), ry * 2);
    g.lineStyle(2, 0x7c2d12, 1);
    g.strokeEllipse(b.position.x, b.position.y, rx * 2 * (this.ballCarrier ? 1 : stretch * 0.5 + 0.5), ry * 2);
    g.lineStyle(1, 0x7c2d12, 0.7);
    g.lineBetween(b.position.x - r * 0.55, b.position.y, b.position.x + r * 0.55, b.position.y);
    g.lineBetween(b.position.x, b.position.y - r * 0.55, b.position.x, b.position.y + r * 0.55);

    this.trailGfx.clear();
    if (!this.ballCarrier && speed > 3) {
      this.ballTrail.push({ x: b.position.x, y: b.position.y });
      if (this.ballTrail.length > 6) this.ballTrail.shift();
      for (let i = 0; i < this.ballTrail.length; i++) {
        const p = this.ballTrail[i];
        const a = (i / this.ballTrail.length) * 0.25;
        this.trailGfx.fillStyle(COLOR.ball, a);
        this.trailGfx.fillCircle(p.x, p.y, (r * 0.55) * (i / this.ballTrail.length));
      }
    } else this.ballTrail.length = 0;
  }

  spawnDust(x, y) {
    for (let i = 0; i < 5; i++) {
      this.dustParticles.push({ x: x + (Math.random() - 0.5) * 14, y, vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 1.2, life: 1 });
    }
  }
  spawnFlash(x, y, color) { this.flashes.push({ x, y, life: 1, color }); }
  shakeCamera(px) { this.cameras.main.shake(120, px * 0.0015); }

  // ------------------------------------------------------------
  // HUD
  // ------------------------------------------------------------
  buildHUD() {
    const midX = W / 2;
    const pHex = '#' + this.player.color.toString(16).padStart(6, '0');
    const aHex = '#' + this.ai.color.toString(16).padStart(6, '0');
    const pName = (this.player.arch ? this.player.arch.name : 'YOU') + ' (P1)';
    const aName = (this.ai.arch ? this.ai.arch.name : 'AI') + (this.twoPlayerMode ? ' (P2)' : ' (AI)');
    this.hudPlayerLabel = this.add.text(midX - 170, 18, pName, { fontFamily: 'system-ui, sans-serif', fontSize: '16px', color: pHex, fontStyle: 'bold' }).setOrigin(0.5, 0).setDepth(20);
    this.hudPlayerScore = this.add.text(midX - 170, 34, '0', { fontFamily: 'system-ui, sans-serif', fontSize: '46px', color: pHex, fontStyle: 'bold' }).setOrigin(0.5, 0).setDepth(20);
    this.hudDot = this.add.text(midX, 44, '•', { fontFamily: 'system-ui, sans-serif', fontSize: '28px', color: '#475569' }).setOrigin(0.5, 0).setDepth(20);
    this.hudAiLabel = this.add.text(midX + 170, 18, aName, { fontFamily: 'system-ui, sans-serif', fontSize: '16px', color: aHex, fontStyle: 'bold' }).setOrigin(0.5, 0).setDepth(20);
    this.hudAiScore = this.add.text(midX + 170, 34, '0', { fontFamily: 'system-ui, sans-serif', fontSize: '46px', color: aHex, fontStyle: 'bold' }).setOrigin(0.5, 0).setDepth(20);
    this.msgText = this.add.text(W / 2, H / 2 - 40, '', { fontFamily: 'system-ui, sans-serif', fontSize: '40px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0.5).setDepth(30);
    this.roundText = this.add.text(W / 2, 90, '', { fontFamily: 'system-ui, sans-serif', fontSize: '22px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0.5).setDepth(30).setAlpha(0);
  }

  popScore(scorer, points) {
    const x = scorer === 'player' ? W / 2 - 170 : W / 2 + 170;
    const colorNum = scorer === 'player' ? this.player.color : this.ai.color;
    const color = '#' + colorNum.toString(16).padStart(6, '0');
    const pop = this.add.text(x + 38, 38, '+' + points, { fontFamily: 'system-ui, sans-serif', fontSize: '20px', color, fontStyle: 'bold' }).setOrigin(0, 0.5).setDepth(21);
    this.tweens.add({ targets: pop, y: pop.y - 20, alpha: 0, duration: 700, onComplete: () => pop.destroy() });
    const scoreLabel = scorer === 'player' ? this.hudPlayerScore : this.hudAiScore;
    this.tweens.add({ targets: scoreLabel, scale: 1.3, duration: 110, yoyo: true });
  }

  showRoundBanner(first) {
    const mod = this.activeModifier;
    const label = first ? ('ROUND ' + this.round) : ('ROUND ' + this.round + '\n' + mod.name);
    this.roundText.setText(label).setAlpha(0).setScale(0.8);
    this.tweens.add({ targets: this.roundText, alpha: 1, scale: 1, duration: 200, yoyo: false,
      onComplete: () => this.tweens.add({ targets: this.roundText, alpha: 0, delay: 700, duration: 300 }) });
  }

  // ------------------------------------------------------------
  // Round modifiers
  // ------------------------------------------------------------
  applyModifier(mod) {
    // reset to baseline first
    this.grabRadius = BASE_GRAB_RADIUS;
    this.shootVx = BASE_SHOOT_VX;
    this.shootVy = BASE_SHOOT_VY;
    this.pointsThisRound = 2;
    this.rimScale = 1;
    this.matter.world.engine.world.gravity.y = 1;
    this.matter.body.setMass(this.ball, 0.35);
    this.matter.body.scale(this.ball, 1 / (this.ballScaleFactor || 1), 1 / (this.ballScaleFactor || 1));
    this.ballScaleFactor = 1;
    this.ballRadius = 15;
    this.ball.restitution = 0.75;
    [this.player, this.ai].forEach(a => { a.scale = 1; this.matter.body.scale(a.body, 1 / (a.bodyScaleFactor || 1), 1 / (a.bodyScaleFactor || 1)); a.bodyScaleFactor = 1; });

    switch (mod.id) {
      case 'tinyBall':
        this.matter.body.scale(this.ball, 0.7, 0.7);
        this.ballScaleFactor = 0.7; this.ballRadius = 15 * 0.7;
        break;
      case 'heavyBall':
        this.matter.body.setMass(this.ball, 0.35 * 1.6);
        break;
      case 'moonGrav':
        this.matter.world.engine.world.gravity.y = 0.6;
        break;
      case 'bouncy':
        this.ball.restitution = Math.min(1.15, 0.75 + 0.5);
        break;
      case 'longArms':
        this.grabRadius = BASE_GRAB_RADIUS * 1.35;
        break;
      case 'giants':
        [this.player, this.ai].forEach(a => { this.matter.body.scale(a.body, 1.25, 1.25); a.bodyScaleFactor = 1.25; a.scale = 1.25; });
        break;
      case 'tinyHoop':
        this.rimScale = 0.75;
        break;
      case 'doublePts':
        this.pointsThisRound = 4;
        break;
      default: break;
    }

    // re-derive per-actor grab radius etc. now that the baseline moved
    if (this.player && this.player.arch) this.refreshActorStats(this.player);
    if (this.ai && this.ai.arch) this.refreshActorStats(this.ai);
  }

  rollModifier() {
    const pool = MODIFIERS.filter(m => m.id !== 'none');
    this.activeModifier = pool[Math.floor(Math.random() * pool.length)];
    this.applyModifier(this.activeModifier);
  }

  // ------------------------------------------------------------
  // Game logic
  // ------------------------------------------------------------
  resetPositions() {
    this.matter.body.setPosition(this.player.body, { x: 200, y: GROUND_Y - 25 });
    this.matter.body.setVelocity(this.player.body, { x: 0, y: 0 });
    this.matter.body.setPosition(this.ai.body, { x: 650, y: GROUND_Y - 25 });
    this.matter.body.setVelocity(this.ai.body, { x: 0, y: 0 });
    this.matter.body.setPosition(this.ball, { x: W / 2, y: GROUND_Y - 60 });
    this.matter.body.setVelocity(this.ball, { x: 0, y: 0 });
    this.ballCarrier = null;
    this.shoveStreak = 0;
    this.ballScoredCooldown = false; // was only ever cleared inside shootBall() — after the
    // FIRST score of a match this stayed true forever, permanently disabling auto-catch
    // (for BOTH players) for the rest of the match. Every fresh kickoff must clear it.
    this.ai.state = 'SEEK';
    [this.player, this.ai].forEach(a => {
      a.tackleCooldown = 0; a.shoveCooldown = 0; a.stumbleTimer = 0; a.tackleDownTimer = 0; a.defendActionTimer = 0;
    });
  }

  playSfx(name) {
    if (typeof SFX !== 'undefined' && SFX && typeof SFX.tone === 'function') {
      try {
        const map = { bounce: [180, 0.05], rim: [420, 0.08], score: [660, 0.15], collision: [90, 0.06], grab: [520, 0.04], whiff: [140, 0.05] };
        const [freq, dur] = map[name] || [300, 0.05];
        SFX.tone(freq, dur);
      } catch (e) {}
    }
  }

  tryJump(actor) {
    if (this.matchOver || this.selecting || actor.stumbleTimer > 0) return;
    // BUG: checking velocity.y alone for "grounded" is also true for one frame
    // at the very PEAK of any jump (vertical velocity crosses ~0 there too).
    // The AI's SEEK jump condition re-evaluates every single frame, so it could
    // catch that apex frame and re-jump right as it crossed zero — stacking a
    // fresh jump impulse on top of the previous one, over and over, launching
    // it higher every time with nothing to stop it (there was also no ceiling —
    // fixed separately). Require it to actually be down near the ground too.
    const nearGround = actor.body.position.y > GROUND_Y - 40;
    if (nearGround && Math.abs(actor.body.velocity.y) < 0.3) {
      const jumpVy = actor.jumpVy || JUMP_VY;
      this.matter.body.setVelocity(actor.body, { x: actor.body.velocity.x, y: jumpVy });
      this.spawnDust(actor.body.position.x, GROUND_Y - 2);
    }
  }

  // Ball possession is now automatic — this just checks proximity each frame
  // and hands the ball to whichever actor's body is actually touching it.
  updateAutoCatch() {
    if (this.ballCarrier || this.ballScoredCooldown || this.matchOver || this.selecting) return;
    const b = this.ball;
    for (const actor of [this.player, this.ai]) {
      if (actor.stumbleTimer > 0) continue; // can't scoop it up while knocked down
      const catchRadius = (actor.grabRadius || this.grabRadius) * 0.75;
      const d = Phaser.Math.Distance.Between(actor.body.position.x, actor.body.position.y, b.position.x, b.position.y);
      if (d < catchRadius) {
        this.ballCarrier = actor.body.label;
        this.shoveStreak = 0; // fresh possession — shove streak resets
        this.playSfx('grab');
        this.spawnFlash(b.position.x, b.position.y, actor.color);
        return;
      }
    }
  }

  // Tackle: higher risk, bigger payoff — only ~30% chance to actually land
  // (that's the point: it's not guaranteed). On a hit, BOTH players go down
  // together for a beat and get back up around the same time; it also
  // guarantees a knockdown and strips the ball if the target was carrying.
  // A miss just briefly overextends the tackler — nobody falls.
  tryTackle(actor, opponent) {
    if (this.matchOver || this.selecting) return;
    if (actor.tackleCooldown > 0 || actor.stumbleTimer > 0) return;
    const d = Phaser.Math.Distance.Between(actor.body.position.x, actor.body.position.y, opponent.body.position.x, opponent.body.position.y);
    if (d > TACKLE_RANGE) return;

    actor.tackleCooldown = TACKLE_COOLDOWN;

    if (Math.random() < TACKLE_SUCCESS) {
      // both go down together
      actor.tackleDownTimer = TACKLE_DOWN_DURATION;
      actor.stumbleTimer = TACKLE_DOWN_DURATION;
      opponent.tackleDownTimer = TACKLE_DOWN_DURATION;
      opponent.stumbleTimer = TACKLE_DOWN_DURATION;
      this.matter.body.setVelocity(actor.body, { x: 0, y: actor.body.velocity.y });
      this.matter.body.setVelocity(opponent.body, { x: 0, y: opponent.body.velocity.y });
      this.shakeCamera(5);
      this.spawnFlash((actor.body.position.x + opponent.body.position.x) / 2, (actor.body.position.y + opponent.body.position.y) / 2, COLOR.white);
      this.spawnDust(opponent.body.position.x, GROUND_Y - 2);
      this.spawnDust(actor.body.position.x, GROUND_Y - 2);
      this.playSfx('collision');
      if (this.ballCarrier === opponent.body.label || this.ballCarrier === actor.body.label) this.dropBall(true);
    } else {
      actor.armSwing = 1;
      this.tweens.add({ targets: actor, armSwing: 0, duration: 260, ease: 'Cubic.Out' });
      actor.stumbleTimer = WHIFF_STUMBLE_DURATION;
      this.playSfx('whiff');
    }
  }

  // Shove: reliable and always connects in range, but it's just a knockback —
  // no guaranteed knockdown. The strip chance escalates the more times in a
  // row you land a shove on the SAME carrier (25% / 55% / 85%+, capped at
  // 90%), so shoving repeatedly is always eventually worth it instead of
  // being a flat coinflip that could in theory never land.
  tryShove(actor, opponent) {
    if (this.matchOver || this.selecting) return;
    if (actor.shoveCooldown > 0 || actor.stumbleTimer > 0) return;
    const d = Phaser.Math.Distance.Between(actor.body.position.x, actor.body.position.y, opponent.body.position.x, opponent.body.position.y);
    if (d > SHOVE_RANGE) return;

    actor.shoveCooldown = SHOVE_COOLDOWN;
    actor.armSwing = 1;
    this.tweens.add({ targets: actor, armSwing: 0, duration: 220, ease: 'Cubic.Out' });

    const dir = opponent.body.position.x >= actor.body.position.x ? 1 : -1;
    this.matter.body.setVelocity(opponent.body, { x: dir * 6, y: -1.5 });
    this.spawnDust(opponent.body.position.x, GROUND_Y - 2);
    this.playSfx('bounce');
    if (this.ballCarrier === opponent.body.label) {
      this.shoveStreak = (this.shoveStreak || 0) + 1;
      const dropChance = Math.min(0.9, 0.25 + (this.shoveStreak - 1) * 0.3);
      if (Math.random() < dropChance) {
        this.shoveStreak = 0;
        this.dropBall(true);
      }
    }
  }

  shootBall(actor) {
    // shot isn't perfectly controllable — a bit of spread per the "not easy
    // to line up perfectly" direction
    const shotMult = actor.shotMult || 1;
    const spread = (Math.random() - 0.5) * 1.6;
    const vx = actor.facing * this.shootVx * shotMult + actor.body.velocity.x * 0.3 + spread;
    const vy = this.shootVy * shotMult + (Math.random() - 0.5) * 1.2;
    this.matter.body.setVelocity(this.ball, { x: vx, y: vy });
    this.ballCarrier = null;
    this.shoveStreak = 0;
    this.ballScoredCooldown = false;
    this.ballTrail.length = 0;
  }

  dropBall(pop) {
    this.ballCarrier = null;
    this.shoveStreak = 0;
    this.matter.body.setVelocity(this.ball, { x: (Math.random() - 0.5) * (pop ? 5 : 3), y: pop ? -3 : -2 });
  }

  updateAI(dt) {
    const ai = this.ai;
    const ball = this.ball;

    if (ai.stumbleTimer > 0) {
      this.matter.body.setVelocity(ai.body, { x: 0, y: ai.body.velocity.y });
      return;
    }

    if (this.ballCarrier === 'ai') ai.state = 'ATTACK';
    else if (this.ballCarrier === 'player') ai.state = 'DEFEND';
    else ai.state = 'SEEK';

    let targetX = ai.body.position.x;
    let wantsJump = false;

    if (ai.state === 'SEEK') {
      // Was chasing the ball's CURRENT x every frame — always a step behind
      // a fast/bouncing ball, so it would rarely actually close the last
      // few pixels needed to trigger a catch. Now it leads the ball using
      // its horizontal velocity, like aiming where a moving target will be.
      targetX = ball.position.x + (ball.velocity.x || 0) * 7;
      // Only jump once it's actually lined up under the ball — jumping the
      // instant the ball is merely "above" it (regardless of x-distance)
      // meant it was almost always airborne at the wrong moment, missing
      // the catch window entirely.
      const alignedX = Math.abs(ball.position.x - ai.body.position.x) < 55;
      if (alignedX && ball.position.y < ai.body.position.y - 20) wantsJump = true;
    } else if (ai.state === 'DEFEND') {
      // Was shadowing the player from 90px away — outside the steal-attempt
      // range (TACKLE_RANGE+20 = 66px) — so it could never actually close in
      // and try a tackle/shove, and would just defend forever without ever
      // getting the ball. Now it presses in to steal range instead of parking.
      // BUG: this used to clamp the chase target's lower bound to x=400, so
      // any time the player was left of midcourt (very common — that's the
      // AI's own defensive half) the AI's target got yanked back up to 400
      // regardless of where the player actually was. It would just stand
      // there like a statue until the player wandered rightward into its
      // clamped zone. It should track the player anywhere on the court.
      const dPlayer = Phaser.Math.Distance.Between(ai.body.position.x, ai.body.position.y, this.player.body.position.x, this.player.body.position.y);
      const stealRange = TACKLE_RANGE + 20;
      if (dPlayer > stealRange - 8) {
        targetX = Phaser.Math.Clamp(this.player.body.position.x, 140, HOOP_R_X - 40);
      } else {
        targetX = ai.body.position.x; // already in range — hold and look for a window
      }
      if (dPlayer < stealRange) {
        ai.defendActionTimer += dt;
        if (ai.defendActionTimer > (ai.decisionMs || 260)) {
          ai.defendActionTimer = 0;
          if (Math.random() < 0.5) this.tryTackle(ai, this.player);
          else this.tryShove(ai, this.player);
        }
      } else {
        ai.defendActionTimer = 0;
      }
    } else if (ai.state === 'ATTACK') {
      const distToHoop = ai.body.position.x - HOOP_L_X;
      // Was a hard reset to 0 every single frame it drifted outside the
      // 60–260 band, so any small jitter (a bump, a defender nudging it)
      // wiped all progress and the windup could never complete — the AI
      // would dribble in place near the hoop forever and never actually
      // release a shot. A wider hysteresis band + decay-instead-of-reset
      // makes the windup far more robust to that jitter.
      if (distToHoop < 280 && distToHoop > 45) {
        ai.shootWindupTimer += dt;
        targetX = HOOP_L_X + 150; // keep drifting toward good shooting range instead of freezing
        if (ai.shootWindupTimer > (ai.shotWindupMs || 420)) {
          ai.armSwing = 1;
          this.tweens.add({ targets: ai, armSwing: 0, duration: 260 });
          this.shootBall(ai);
          ai.shootWindupTimer = 0;
        }
      } else {
        targetX = HOOP_L_X + 150;
        ai.shootWindupTimer = Math.max(0, ai.shootWindupTimer - dt); // decay, don't wipe
      }
    }

    if (wantsJump) this.tryJump(ai);

    const dx = targetX - ai.body.position.x;
    if (Math.abs(dx) > 4) {
      ai.facing = dx > 0 ? 1 : -1;
      // SEEK (racing for a loose ball) now runs at full speed — the old
      // flat 0.85 handicap on every state was stacking with the AI's
      // built-in decision-delay disadvantage against a human's reflexes,
      // so it was consistently beaten to every 50/50 ball. DEFEND/ATTACK
      // keep a slight discount so it doesn't feel robotic.
      const aiSpeed = ai.speed || PLAYER_SPEED;
      const speedMult = ai.state === 'SEEK' ? 1 : 0.85;
      this.matter.body.setVelocity(ai.body, { x: ai.facing * aiSpeed * speedMult, y: ai.body.velocity.y });
    } else {
      this.matter.body.setVelocity(ai.body, { x: 0, y: ai.body.velocity.y });
    }
  }

  checkScore() {
    if (this.ballCarrier || this.ballScoredCooldown || this.matchOver) return;
    const b = this.ball;
    const hoopHalf = 15 * this.rimScale;
    for (const h of this.hoops) {
      const dx = Math.abs(b.position.x - (h.x - h.mirror * 6));
      const dy = Math.abs(b.position.y - (HOOP_Y + 18));
      if (dx < hoopHalf && dy < 9 && b.velocity.y > 0) {
        this.ballScoredCooldown = true;
        const scorer = (this.lastToTouch === 'ai') ? 'ai' : 'player';
        const points = this.pointsThisRound;
        this.score[scorer] += points;
        this.hudPlayerScore.setText(String(this.score.player));
        this.hudAiScore.setText(String(this.score.ai));
        this.popScore(scorer, points);
        this.playSfx('score');
        h.netStretch = 1;
        this.shakeCamera(2);
        this.onScore(scorer);
        return;
      }
    }
  }

  onScore(scorer) {
    this.matchOver = true;
    if (this.score[scorer] >= WIN_SCORE) {
      this.msgText.setText(scorer === 'player' ? 'YOU WIN' : 'AI WINS');
    } else {
      this.msgText.setText(scorer === 'player' ? 'YOU SCORE' : 'AI SCORES');
    }
    this.time.delayedCall(1000, () => {
      if (this.score.player >= WIN_SCORE || this.score.ai >= WIN_SCORE) {
        if (this.careerActive) {
          this.time.delayedCall(900, () => this.handleCareerMatchEnd(scorer));
          return;
        }
        this.time.delayedCall(1200, () => {
          this.score = { player: 0, ai: 0 };
          this.hudPlayerScore.setText('0');
          this.hudAiScore.setText('0');
          this.msgText.setText('');
          this.round = 1;
          this.rollModifier();
          this.resetPositions();
          this.showRoundBanner(false);
          this.matchOver = false;
        });
      } else {
        this.msgText.setText('');
        this.round += 1;
        this.rollModifier();
        this.resetPositions();
        this.showRoundBanner(false);
        this.matchOver = false;
      }
    });
  }

  update(time, dt) {
    if (this.selecting) {
      this.drawActor(this.player);
      this.drawActor(this.ai);
      this.drawBall();
      this.hoops.forEach(h => this.drawNet(h));
      return;
    }

    if (!this.matchOver) {
      [this.player, this.ai].forEach(a => {
        a.tackleCooldown = Math.max(0, (a.tackleCooldown || 0) - dt);
        a.shoveCooldown = Math.max(0, (a.shoveCooldown || 0) - dt);
        a.stumbleTimer = Math.max(0, (a.stumbleTimer || 0) - dt);
        a.tackleDownTimer = Math.max(0, (a.tackleDownTimer || 0) - dt);
      });

      const playerSpeed = this.player.speed || PLAYER_SPEED;
      let vx = 0;
      if (this.player.stumbleTimer <= 0) {
        if (this.keys.left.isDown || (!this.twoPlayerMode && this.keys.leftArrow.isDown)) { vx = -playerSpeed; this.player.facing = -1; }
        else if (this.keys.right.isDown || (!this.twoPlayerMode && this.keys.rightArrow.isDown)) { vx = playerSpeed; this.player.facing = 1; }
      }
      this.matter.body.setVelocity(this.player.body, { x: vx, y: this.player.body.velocity.y });

      if (this.twoPlayerMode) {
        const p2Speed = this.ai.speed || PLAYER_SPEED;
        let vx2 = 0;
        if (this.ai.stumbleTimer <= 0) {
          if (this.keys.leftArrow.isDown) { vx2 = -p2Speed; this.ai.facing = -1; }
          else if (this.keys.rightArrow.isDown) { vx2 = p2Speed; this.ai.facing = 1; }
        }
        this.matter.body.setVelocity(this.ai.body, { x: vx2, y: this.ai.body.velocity.y });
      } else {
        this.updateAI(dt);
      }
      this.updateAutoCatch();

      if (this.ballCarrier) this.lastToTouch = this.ballCarrier;

      if (this.ballCarrier === 'player') {
        const p = this.player.body.position;
        this.matter.body.setPosition(this.ball, { x: p.x + this.player.facing * 20, y: p.y - 5 });
        this.matter.body.setVelocity(this.ball, { x: 0, y: 0 });
      } else if (this.ballCarrier === 'ai') {
        const a = this.ai.body.position;
        this.matter.body.setPosition(this.ball, { x: a.x + this.ai.facing * 20, y: a.y - 5 });
        this.matter.body.setVelocity(this.ball, { x: 0, y: 0 });
      }

      this.checkScore();

      // Was only checking for falling through the bottom, 100px past the edge
      // before resetting — anything that got launched off the TOP, or off
      // either SIDE, just kept going and took a long time (or forever) to
      // come back. Now it's a tighter, all-directions bounds check.
      const bx = this.ball.position.x, by = this.ball.position.y;
      if (by > H + 40 || by < -40 || bx < -40 || bx > W + 40) {
        this.matter.body.setPosition(this.ball, { x: W / 2, y: GROUND_Y - 60 });
        this.matter.body.setVelocity(this.ball, { x: 0, y: 0 });
        this.ballCarrier = null;
      }
    }

    [this.player, this.ai].forEach((actor) => {
      const grounded = Math.abs(actor.body.velocity.y) < 0.3;
      if (grounded && !actor.wasGrounded) this.spawnDust(actor.body.position.x, GROUND_Y - 2);
      actor.wasGrounded = grounded;
    });

    this.drawActor(this.player);
    this.drawActor(this.ai);
    this.drawBall();
    this.hoops.forEach(h => this.drawNet(h));

    this.dustGfx.clear();
    this.dustParticles = this.dustParticles.filter(p => p.life > 0);
    this.dustParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.04;
      this.dustGfx.fillStyle(0xd6d3c9, Math.max(p.life, 0) * 0.5);
      this.dustGfx.fillCircle(p.x, p.y, 3 * p.life);
    });

    this.flashGfx.clear();
    this.flashes = this.flashes.filter(f => f.life > 0);
    this.flashes.forEach(f => {
      f.life -= 0.08;
      this.flashGfx.fillStyle(f.color, Math.max(f.life, 0) * 0.6);
      this.flashGfx.fillCircle(f.x, f.y, 18 * (1 - f.life) + 4);
    });

    this.hoops.forEach(h => {
      if (h.netStretch > 0) h.netStretch = Math.max(0, h.netStretch - 0.06);
      if (h.rimBounce > 0) h.rimBounce = Math.max(0, h.rimBounce - 0.1);
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game-container',
  backgroundColor: '#090A10',
  physics: { default: 'matter', matter: { gravity: { y: 1 }, debug: false } },
  scene: [MainScene]
};

new Phaser.Game(config);

})();
</script>
</body>
</html>
