MatchScene.prototype.beginServeSequence = function(){
  var m = this.match;
  this.ball = makeBall();
  var serverIsHuman = m.server === 'human';
  this.rec = []; this.curRally = 0; m.serveCount++;
  this.ruleHint = null;
  if (this.isMatch && m.serveCount > 4 && !this.save.hintsSeen){ this.save.hintsSeen = true; Save.save(this.save); }
  if (this.isMatch && !this.save.hintsSeen && m.serveCount <= 4){
    var tapw = this.touchUi ? 'Tap SWING' : 'Press Space', aimw = this.touchUi ? 'the AIM buttons' : 'keys 1-6';
    this.ruleHint = serverIsHuman
      ? ['Serving: ' + tapw + ' at the top of the toss. The ball must bounce on YOUR side first, then clear the net.',
         'Serves swap every 2 points. First to 11 (win by 2) takes the game.',
         'Aim your serve with ' + aimw + ', or leave it and it goes deep to the open side.',
         this.touchUi ? 'Tip: lower balls get a safe push, higher balls get attacked.' : 'Spin: W/S for top/back spin, Q/E for side spin.'][m.serveCount-1]
      : ['Receiving: the ball bounces on their side, then yours. Swing when the prompt says SWING NOW.',
         'Move with ' + (this.touchUi ? 'your thumb (drag)' : 'A/D (or drag)') + ' so the paddle is under the ball.',
         'Green PERFECT timing hits harder and straighter.',
         'Low balls get pushed short with backspin; high balls get attacked.'][m.serveCount-1];
  }
  this.ball.x = TABLE.width/2;
  this.ball.y = serverIsHuman ? STRIKE_Y_HUMAN : STRIKE_Y_AI;
  this.ball.h = 0.30;
  this.ball.alive = false;
  this.ball.servePhase = true;
  this.ball.serveBounceSeq = [];
  this.serveToss = { active:true, t:0, window: serverIsHuman?2.2:0.001 };
  m.state = 'serveToss';
  if (!serverIsHuman){
    this.aiServeTimer = randRange(0.5,0.9);
  }
};

/* A legal serve has to bounce on the SERVER'S OWN side before crossing to the
   receiver -- one paddle hit can't physically produce two separately-aimed
   bounces from a single solveShot call (that solver aims one flight at one
   landing point). So a serve is executed as two legs: an initial, lightly-aimed
   toss-hit that lands on the server's own side (this is the only part resolved
   here), then onBallBounce redirects the ball toward the real chosen target the
   instant that first bounce happens -- see the servePhase handling there. */
MatchScene.prototype.executeServe = function(side, quality){
  var m = this.match;
  var ball = this.ball;
  ball.alive = true;
  var towardAi = side === 'human';
  var laneIndex, depthIndex, spinTop, spinSide, offset, timingError, paddleStats;
  if (side === 'human'){
    laneIndex = this.human.laneIndex; depthIndex = this.human.depthIndex;
    spinTop = this.human.spinTop; spinSide = this.human.spinSide;
    paddleStats = this.paddleStats;
    offset = 0; timingError = (1-quality)*TIMING_WINDOW*0.6;
  } else {
    var plan = this.planAiServe();
    laneIndex = plan.laneIndex; depthIndex = plan.depthIndex; spinTop = plan.spinTop; spinSide = plan.spinSide;
    paddleStats = PADDLES.starter;
    offset = plan.offsetNoise; timingError = plan.timingNoise;
  }
  var realTarget = targetCoords(laneIndex, depthIndex, towardAi);
  ball.pendingServe = { targetX: realTarget.x, targetY: realTarget.y, offset: offset, timingError: timingError,
    paddleStats: paddleStats, spinTop: spinTop, spinSide: spinSide };

  var ownY = side === 'human' ? SERVE_OWN_Y_HUMAN : SERVE_OWN_Y_AI;
  var ownX = LANE_FRACS[laneIndex] * TABLE.width;
  var shot = solveShot(ball, ownX, ownY, 0.30);
  ball.vx = shot.vx; ball.vy = shot.vy; ball.vh = shot.vh;
  ball.topSpin = 0; ball.sideSpin = 0;
  ball.lastHitBy = side;
  ball.servePhase = true;
  ball.serveBounceSeq = [];
  SFX.paddleHit(0.4);
  this.curRally = 1;
  if (this.mode === 'target') this.target.started = true;
  m.state = 'rally';
};

MatchScene.prototype.planAiServe = function(){
  var tier = this.aiTier;
  var laneIndex = Math.floor(randRange(0,3));
  var depthIndex = Math.random() < 0.5 ? 0 : 1;
  var useSpin = Math.random() < tier.spinUse;
  var spinTop = useSpin ? (Math.random()<0.5?1:-1) : 0;
  var spinSide = (useSpin && Math.random()<0.5) ? (Math.random()<0.5?-1:1) : 0;
  return { laneIndex:laneIndex, depthIndex:depthIndex, spinTop:spinTop, spinSide:spinSide,
    offsetNoise: randRange(-tier.aimErr,tier.aimErr), timingNoise: randRange(-tier.timeErr,tier.timeErr) };
};

/* ============================================================
   UPDATE
   ============================================================ */
MatchScene.prototype.update = function(t, dtMs){
  var dt = Math.min(dtMs/1000, 0.05);
  var m = this.match;

  this.handleContinuousInput(dt);

  if (this.mode === 'target' && this.target.started && m.state !== 'rallyOver'){
    this.target.timeLeft -= dt;
    if (this.target.timeLeft <= 0){ this.target.timeLeft = 0; this.endTarget(); }
  }

  if (m.state === 'rallyOver'){
    this.updateRallyOver(dt);
  } else if (m.state === 'intro'){
    this.updateIntro(dt);
  } else if (m.state === 'serveToss'){
    this.updateServeToss(dt);
  } else if (m.state === 'rally'){
    this.updateRally(dt);
  } else if (m.state === 'pointPause'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()){
      this.advanceAfterPoint();
    }
  } else if (m.state === 'gameOver'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()) this.startNextGame();
  } else if (m.state === 'matchOver'){
    m.overT += dt;
    var pe = this.pressedEnter(), ps = this.pressedSpace();
    if (m.overT > 0.6 && (pe || ps)) this.leaveMatch();
  }

  this.render();
};

MatchScene.prototype.inTouchBtn = function(x, y){
  var b = this.touchBtn, dx = x - b.x, dy = y - b.y;
  return dx*dx + dy*dy <= (b.r+10)*(b.r+10);
};
// a touch tap counts once, and only if it is fresh (so a tap during a pause can't fire a later serve)
MatchScene.prototype.takeTouchTap = function(){
  if (!this.touchUi) return false;
  if (this.time.now - this.touchBtnAt < 160){ this.touchBtnAt = -9999; return true; }
  return false;
};
MatchScene.prototype.pressedSpace = function(){
  var now = this.keys.space.isDown;
  var edge = now && !this.prevSpace;
  this.prevSpace = now;
  var st = this.match.state;
  if (st === 'serveToss' || st === 'rally' || st === 'matchOver' || st === 'intro' || st === 'rallyOver') edge = this.takeTouchTap() || edge;
  return edge;
};
MatchScene.prototype.pressedEnter = function(){
  var now = this.keys.enter.isDown;
  var edge = now && !this.prevEnter;
  this.prevEnter = now;
  var st = this.match.state;
  if (st === 'pointPause' || st === 'gameOver') edge = this.takeTouchTap() || edge;
  return edge;
};

MatchScene.prototype.handleContinuousInput = function(dt){
  var h = this.human;
  var speed = 1.9;
  if (this.keys.left.isDown || this.keys.a.isDown) h.x -= speed*dt;
  if (this.keys.right.isDown || this.keys.d.isDown) h.x += speed*dt;
  if (this.pointerDown && this.pointerX != null){
    var ty = STRIKE_Y_HUMAN;
    var tx = this.screenXToTableX(this.pointerX, ty);
    h.x += clamp(tx - h.x, -speed*dt, speed*dt);
  }
  h.x = clamp(h.x, PADDLE_X_MIN, PADDLE_X_MAX);

  var nowMs = this.time.now;
  if (this.keys.one.isDown || this.keys.two.isDown || this.keys.three.isDown ||
      this.keys.four.isDown || this.keys.five.isDown || this.keys.six.isDown) this.manualZoneAt = nowMs;
  if (this.keys.w.isDown || this.keys.s.isDown || this.keys.q.isDown || this.keys.e.isDown || this.mobileSpinLock) this.manualSpinAt = nowMs;
  if (this.keys.one.isDown){ h.laneIndex=0; h.depthIndex=0; }
  else if (this.keys.two.isDown){ h.laneIndex=1; h.depthIndex=0; }
  else if (this.keys.three.isDown){ h.laneIndex=2; h.depthIndex=0; }
  else if (this.keys.four.isDown){ h.laneIndex=0; h.depthIndex=1; }
  else if (this.keys.five.isDown){ h.laneIndex=1; h.depthIndex=1; }
  else if (this.keys.six.isDown){ h.laneIndex=2; h.depthIndex=1; }

  if (this.keys.w.isDown) h.spinTop = 1;
  else if (this.keys.s.isDown) h.spinTop = -1;
  else if (!this.mobileSpinLock) h.spinTop = 0;

  if (this.keys.q.isDown && !this.keys.e.isDown) h.spinSide = -1;
  else if (this.keys.e.isDown && !this.keys.q.isDown) h.spinSide = 1;
  else if (!this.mobileSpinLock) h.spinSide = 0;
};

/* AIM strip: six small buttons in the top-left, clear of both players. Index i: 0-2 short L/C/R, 3-5 deep L/C/R. */
var ZONE_STRIP = { x:16, y:50, w:50, h:30, gap:2 };
function applyTouchStrip(){ ZONE_STRIP.w = 54; ZONE_STRIP.h = 40; ZONE_STRIP.gap = 2; }
MatchScene.prototype.handleZoneTap = function(sx,sy){
  var z = ZONE_STRIP;
  if (sy < z.y - 4 || sy > z.y + z.h + 4) return false;
  for (var i=0;i<6;i++){
    var x0 = z.x + i*(z.w+z.gap);
    if (sx >= x0 && sx <= x0 + z.w){
      this.human.laneIndex = i%3;
      this.human.depthIndex = i<3?0:1;
      this.manualZoneAt = this.time.now;
      return true;
    }
  }
  return false;
};

MatchScene.prototype.applyAutoServeAim = function(){
  var now = this.time.now, h = this.human, m = this.match;
  var aiFrac = this.ai.x / TABLE.width;
  var lane;
  if (aiFrac < 0.40) lane = 2;
  else if (aiFrac > 0.60) lane = 0;
  else lane = (m.score.human + m.score.ai) % 3; // AI centered: rotate serve placement
  this.autoShot = { label: 'SERVE DEEP '+LANE_NAMES[lane] };
  if ((now - (this.manualZoneAt||-9999)) >= 1500){ h.laneIndex = lane; h.depthIndex = 1; }
  if ((now - (this.manualSpinAt||-9999)) >= 1500){ h.spinTop = 0; h.spinSide = 0; }
};

/* ---------- serve toss timing ---------- */
MatchScene.prototype.updateServeToss = function(dt){
  var m = this.match;
  var serverIsHuman = m.server === 'human';
  this.serveToss.t += dt;
  var tossT = this.serveToss.t;
  var peak = 0.9;
  this.ball.h = 0.30 + Math.max(0, (peak - Math.abs(tossT-peak))) * 0.9;

  if (serverIsHuman){
    this.applyAutoServeAim();
    if (this.pressedSpace()){
      var quality = 1 - clamp(Math.abs(tossT-peak)/peak, 0, 1);
      this.human.swingUntil = this.time.now + 180;
      SFX.swing();
      SFX.serveTone();
      this.executeServe('human', quality);
      return;
    }
    if (tossT > this.serveToss.window){
      // double fault on serve timeout
      this.awardPoint('ai', 'Serve fault');
    }
  } else {
    this.aiServeTimer -= dt;
    if (this.aiServeTimer <= 0){
      SFX.serveTone();
      this.executeServe('ai', 0.85);
    }
  }
};

/* ---------- rally ---------- */
MatchScene.prototype.updateRally = function(dt){
  var self = this;
  var ball = this.ball;
  var steps = Math.max(1, Math.round(dt/DT));
  var subDt = dt/steps;
  for (var i=0;i<steps;i++){
    if (!ball.alive) break;
    stepBall(ball, subDt,
      function(b, side){ self.onBallBounce(b, side); },
      function(b){ SFX.netClip(); self.spawnNetFx(b); b.netTouchedThisFlight = true; },
      function(b){ self.onBallOut(b); }
    );
  }
  this.recPush();
  if (!ball.alive) return;

  this.updateAiPaddle(dt);
  if (ball.lastHitBy !== 'human' && !ball.servePhase) this.applyAutoAim();
  this.checkHumanSwing();
  this.checkAiAutoHit();
};

MatchScene.prototype.recPush = function(){
  var b = this.ball, rec = this.rec, now = this.time.now;
  rec.push({ t:now, x:b.x, y:b.y, h:b.h });
  while (rec.length > 2 && rec[rec.length-1].t - rec[0].t > 1400) rec.shift();
};
MatchScene.prototype.drawReplay = function(g){
  var rec = this.rec;
  if (!rec || rec.length < 3) return;
  var dur = rec[rec.length-1].t - rec[0].t;
  if (dur < 100) return;
  var el = ((this.time.now - this.replayStart) * 0.5) % (dur + 500);
  var tt = rec[0].t + Math.min(el, dur);
  var i = 0; while (i < rec.length-1 && rec[i+1].t <= tt) i++;
  var a = rec[i], b = rec[Math.min(i+1, rec.length-1)];
  var k = b.t > a.t ? clamp((tt-a.t)/(b.t-a.t), 0, 1) : 0;
  var cx = lerp(a.x,b.x,k), cy = lerp(a.y,b.y,k), ch = lerp(a.h,b.h,k);
  for (var j = Math.max(0,i-14); j < i; j++){
    var p0 = this.project(rec[j].x, rec[j].y, rec[j].h), p1 = this.project(rec[j+1].x, rec[j+1].y, rec[j+1].h);
    g.lineStyle(2.5, 0xFCDE5A, 0.15 + 0.5*(j-Math.max(0,i-14))/14);
    g.lineBetween(p0.x, p0.y, p1.x, p1.y);
  }
  var sh = this.project(cx, cy, 0), bp = this.project(cx, cy, ch);
  g.fillStyle(COLORS.shadow, 0.35); g.fillEllipse(sh.x, sh.y+2, 12, 4);
  g.fillStyle(0xFCDE5A, 0.35); g.fillCircle(bp.x, bp.y, 11);
  g.fillStyle(COLORS.ball, 1); g.fillCircle(bp.x, bp.y, 6);
};

/* ---------- hit / bounce / net effects (screen-space rings and sparks) ---------- */
MatchScene.prototype.addRing = function(x, y, r0, r1, life, color, alpha, flat){
  this.fxList.push({ kind:'ring', x:x, y:y, r0:r0, r1:r1, life:life, color:color, alpha:alpha, flat:flat||1, born:this.time.now });
};
MatchScene.prototype.addSparks = function(x, y, n, dirX, dirY, spread, speed, life, color, size){
  var base = Math.atan2(dirY, dirX);
  for (var i=0;i<n;i++){
    var a = base + (Math.random()-0.5)*spread;
    var v = speed*(0.5+Math.random()*0.7);
    this.fxList.push({ kind:'spark', x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:life*(0.7+Math.random()*0.5),
      color:color, size:size*(0.7+Math.random()*0.6), born:this.time.now });
  }
};
MatchScene.prototype.spawnHitFx = function(info){
  var bp = this.project(info.x, info.y, info.h);
  var human = info.by === 'human';
  var q = info.timingQ;
  var col = !human ? 0xE8EEF5 : (q > 0.8 ? 0xFCDE5A : (q > 0.5 ? 0xFFFFFF : 0xC9C3DA));
  var big = human ? (0.7 + 0.5*q) : 0.7;
  this.addRing(bp.x, bp.y, 4, 30*big, 340, col, 0.95);
  if (human && q > 0.8) this.addRing(bp.x, bp.y, 2, 46, 440, 0xFCDE5A, 0.7);
  // sparks fly the way the ball is going (+y is up the screen)
  var b = this.ball, dx = b.vx*0.6, dy = -b.vy;
  var len = Math.max(0.001, Math.sqrt(dx*dx+dy*dy)); dx/=len; dy/=len;
  this.addSparks(bp.x, bp.y, Math.round(5 + 9*info.power), dx, dy, 1.5, 150 + 160*info.power, 520, col, 2.6);
  var spinCol = null;
  if (b.topSpin > 0.15) spinCol = COLORS.topSpin; else if (b.topSpin < -0.15) spinCol = COLORS.backSpin; else if (Math.abs(b.sideSpin) > 0.15) spinCol = COLORS.sideSpin;
  if (spinCol !== null) this.addSparks(bp.x, bp.y, 6, dx, dy, 2.6, 110, 580, spinCol, 2.4);
};
MatchScene.prototype.spawnBounceFx = function(ball){
  var p = this.project(ball.x, ball.y, 0);
  var sc = lerp(1, 0.7, clamp(ball.y/TABLE.length, 0, 1));
  this.addRing(p.x, p.y, 3*sc, 20*sc, 320, 0xFFFFFF, 0.6, 0.32); // flat ring skimming the table
  this.addSparks(p.x, p.y, 3, 0, -1, 1.2, 70*sc, 260, 0xFFFFFF, 1.6);
};
MatchScene.prototype.spawnNetFx = function(ball){
  var p = this.project(ball.x, ball.y, Math.max(0.02, Math.min(ball.h, TABLE.netHeight)));
  this.addSparks(p.x, p.y, 7, 0, 1, 3.4, 80, 380, 0xE8EEF5, 1.8);
};
MatchScene.prototype.drawFx = function(fx){
  var now = this.time.now, keep = [];
  for (var i=0;i<this.fxList.length;i++){
    var e = this.fxList[i], age = now - e.born;
    if (age >= e.life) continue;
    var k = age / e.life;
    if (e.kind === 'ring'){
      var r = lerp(e.r0, e.r1, 1-(1-k)*(1-k));
      fx.lineStyle(2.5*(1-k)+0.5, e.color, e.alpha*(1-k));
      fx.strokeEllipse(e.x, e.y, r*2, r*2*e.flat);
    } else {
      var t = age/1000;
      var px = e.x + e.vx*t, py = e.y + e.vy*t + 260*t*t; // small gravity pull
      fx.fillStyle(e.color, 1-k);
      fx.fillCircle(px, py, e.size*(1-0.5*k));
    }
    keep.push(e);
  }
  this.fxList = keep;
};

MatchScene.prototype.onBallBounce = function(ball, side){
  SFX.tableBounce();
  this.spawnBounceFx(ball);
  if (ball.servePhase){
    var expected = ball.lastHitBy === 'human' ? 'human' : 'ai';
    if (side !== expected){
      // didn't bounce on the server's own side first -- a genuine serve fault
      this.awardPoint(ball.lastHitBy==='human'?'ai':'human', 'Serve fault');
      ball.alive = false;
      return;
    }
    // legal first bounce on the server's own side -- redirect toward the real
    // chosen target now, same as any other paddle contact. This is what actually
    // sends the ball over the net; servePhase is cleared inside resolveHit.
    var p = ball.pendingServe;
    if (p){
      resolveHit(ball, ball.lastHitBy, {
        targetX: p.targetX, targetY: p.targetY, offset: p.offset, timingError: p.timingError,
        paddleStats: p.paddleStats, spinTop: p.spinTop, spinSide: p.spinSide
      });
      ball.pendingServe = null;
      ball.fxPending = null; // the serve's redirect off the table is not a paddle contact
    } else {
      ball.servePhase = false;
    }
    return;
  }

  if (this.mode === 'target' && ball.lastHitBy === 'human' && side === 'ai' && ball.lastBounceSideSameHit !== 'ai') this.targetLanded(ball);
  if (ball.lastBounceSideSameHit === side){
    // double bounce on the same side without a return in between -- fault
    var faultSide = side === 'human' ? 'human' : 'ai';
    this.awardPoint(faultSide === 'human' ? 'ai' : 'human', 'No return');
    ball.alive = false;
    return;
  }
  ball.lastBounceSideSameHit = side;
};

MatchScene.prototype.onBallOut = function(ball){
  if (!ball.alive) return;
  ball.alive = false;
  var hitter = ball.lastHitBy;
  if (!hitter){ this.awardPoint('human', 'Out'); return; }
  var receiver = hitter === 'human' ? 'ai' : 'human';
  // If the shot legally bounced on the receiver's side first and the receiver simply
  // didn't get to it, that is a winner for the hitter. Only a ball that left without
  // ever landing on the receiver's side is the hitter's fault.
  var landedLegally = ball.lastBounceSideSameHit === receiver;
  if (landedLegally) this.awardPoint(hitter, 'Winner');
  else this.awardPoint(receiver, 'Out');
};

/* ---------- automatic shot selection ----------
   The player only has to time Space. Target lane/depth and spin are chosen from the
   incoming ball:
     lane  : aim away from the AI (AI on the left half -> right lane, and vice versa);
             if the AI is near center, go cross-court from where the ball is arriving
             (ball on the left -> right lane), or center for a ball right down the middle.
     height: HIGH ball (>=0.30m)  -> ATTACK: deep + topspin
             MID ball  (0.17-0.30) -> DRIVE : deep, flat
             LOW ball  (<0.17m)    -> PUSH  : short + backspin (keeps it safe and low)
   Holding a zone key (1-6), tapping a zone button, or holding a spin key (W/S/Q/E)
   still overrides that part manually for ~1.5s. */
var LANE_NAMES = ['LEFT','CENTER','RIGHT'];
function pickAutoShot(ball, humanX, aiX){
  var aiFrac = aiX / TABLE.width;
  var ballFrac = ball.x / TABLE.width;
  var lane;
  if (aiFrac < 0.40) lane = 2;
  else if (aiFrac > 0.60) lane = 0;
  else if (Math.abs(ballFrac-0.5) < 0.12) lane = 1;
  else lane = ballFrac < 0.5 ? 2 : 0;
  var depth, spinTop, kind;
  if (ball.h >= 0.30){ depth = 1; spinTop = 1; kind = 'ATTACK'; }
  else if (ball.h >= 0.17){ depth = 1; spinTop = 0; kind = 'DRIVE'; }
  else { depth = 0; spinTop = -1; kind = 'PUSH'; }
  return { laneIndex:lane, depthIndex:depth, spinTop:spinTop, spinSide:0,
           label: kind+' '+(depth?'DEEP':'SHORT')+' '+LANE_NAMES[lane] };
}
MatchScene.prototype.applyAutoAim = function(){
  var now = this.time.now;
  var h = this.human;
  if (this.mode === 'target'){
    // target practice: YOU choose where the ball lands (keys 1-6 or the AIM buttons); no automatic shot, no spin
    h.spinTop = 0; h.spinSide = 0;
    this.autoShot = { label: 'AIM ' + zoneName(h.depthIndex*3 + h.laneIndex) };
    return;
  }
  var a = pickAutoShot(this.ball, h.x, this.ai.x);
  this.autoShot = a;
  var manualZone = (now - (this.manualZoneAt||-9999)) < 1500;
  var manualSpin = (now - (this.manualSpinAt||-9999)) < 1500;
  if (!manualZone){ h.laneIndex = a.laneIndex; h.depthIndex = a.depthIndex; }
  if (!manualSpin){ h.spinTop = a.spinTop; h.spinSide = a.spinSide; }
};

MatchScene.prototype.checkHumanSwing = function(){
  var spacePressed = this.pressedSpace();
  var ball = this.ball;
  this.swingPromptActive = false;
  if (!ball.alive) return;
  if (ball.lastHitBy === 'human') return; // already heading to opponent
  if (ball.servePhase) return; // can't return a serve before it legally bounces on the server's own side
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return;
  if (ball.vy >= 0) return; // ball must be approaching the human side (moving toward y=0)
  var timeToPlane = (STRIKE_Y_HUMAN - ball.y) / ball.vy;
  if (Math.abs(timeToPlane) > TIMING_WINDOW*2.2*this.winScale) return; // not close enough to even attempt
  var offset = (ball.x - this.human.x) / PADDLE_HALF_W;
  if (Math.abs(offset) > this.reach) return; // nowhere near the paddle

  this.swingPromptActive = true; // ball is in range right now -- show the on-screen prompt
  if (!spacePressed) return;
  this.human.swingUntil = this.time.now + 180;
  SFX.swing();

  var target = targetCoords(this.human.laneIndex, this.human.depthIndex, true);
  var te = Math.abs(timeToPlane) / this.winScale;
  var fb = te < 0.05 ? ['PERFECT!', '#FCDE5A'] : te < 0.12 ? ['GOOD', '#9FE1CB'] : [timeToPlane > 0 ? 'EARLY' : 'LATE', '#F09595'];
  this.hitFeedback = { text: fb[0], color: fb[1], at: this.time.now };
  resolveHit(ball, 'human', {
    targetX: target.x, targetY: target.y,
    offset: offset, timingError: timeToPlane / this.winScale,
    paddleStats: this.paddleStats, spinTop: this.human.spinTop, spinSide: this.isFeed ? 0 : this.human.spinSide
  });
  this.curRally++;
  if (this.isMatch){ this.match.stats.swings++; if (te < 0.05) this.match.stats.perfect++; }
  if (this.mode === 'rally') this.countRallyReturn();
};

MatchScene.prototype.updateAiPaddle = function(dt){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (ball.lastHitBy !== 'human' && ball.lastHitBy !== null){
    // ball is heading away from AI or already handled; still track toward center softly
  }
  if (ai.reactTimer > 0){
    ai.reactTimer -= dt*1000;
  } else if (ball.vy > 0 && ball.lastHitBy !== 'ai'){
    // predict landing x at AI's strike plane
    if (Math.abs(ball.vy) > 0.01){
      var tArrive = (STRIKE_Y_AI - ball.y)/ball.vy;
      if (tArrive > 0){
        ai.targetX = clamp(ball.x + ball.vx*tArrive, PADDLE_X_MIN, PADDLE_X_MAX);
      }
    }
  }
  if (this.mode === 'rally' && ball.vy > 0) ai.targetX = clamp(ball.x + ball.vx*0.1, PADDLE_X_MIN, PADDLE_X_MAX);
  var maxStep = tier.paddleSpeed*dt;
  ai.x += clamp(ai.targetX-ai.x, -maxStep, maxStep);
  ai.x = clamp(ai.x, PADDLE_X_MIN, PADDLE_X_MAX);
};

MatchScene.prototype.checkAiAutoHit = function(){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (this.mode === 'target') return; // the ball machine only feeds
  if (ball.lastHitBy === 'ai') return;
  if (ball.servePhase) return; // can't return a serve before it legally bounces on the server's own side
  if (ball.vy <= 0) return; // only hit balls approaching the AI side
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return;
  // hit as soon as the ball reaches the strike plane. (A narrow +/- window made the AI miss whenever a frame
  // advanced the ball further than the window -- i.e. on slow or phone-class frame rates.)
  if (ball.y < STRIKE_Y_AI - 0.02 || ball.y > STRIKE_Y_AI + 0.35) return;
  if (Math.abs(ball.x - ai.x) > (this.mode === 'rally' ? PADDLE_HALF_W*4 : PADDLE_HALF_W*1.3)) return;

  // reset reaction gate for the next incoming ball once this one resolves
  this.ai.reactTimer = tier.reactMs;

  var plan = this.planAiShot();
  var target = targetCoords(plan.laneIndex, plan.depthIndex, false);
  resolveHit(ball, 'ai', {
    targetX: target.x, targetY: target.y,
    offset: randRange(-tier.aimErr,tier.aimErr)/PADDLE_HALF_W,
    timingError: randRange(-tier.timeErr,tier.timeErr),
    paddleStats: PADDLES.starter, spinTop: plan.spinTop, spinSide: plan.spinSide,
    speedMul: this.mode === 'rally' ? Math.max(0.62, 1 - 0.012*this.rally.count) : 1
  });
  this.curRally++;
};

MatchScene.prototype.planAiShot = function(){
  var tier = this.aiTier;
  if (this.mode === 'rally'){
    var n = this.rally.count;
    return { laneIndex: n < 4 ? 1 : Math.floor(Math.random()*3), depthIndex: (n < 3 || Math.random() < 0.65) ? 1 : 0, spinTop:0, spinSide:0 };
  }
  var laneIndex = 1;
  if (Math.random() < tier.aggressive){
    // aim away from the human paddle's current lateral position
    var humanFrac = clamp((this.human.x/TABLE.width - 0) , 0, 1);
    laneIndex = humanFrac < 0.5 ? 2 : 0;
  }
  var depthIndex = Math.random() < (0.4 + tier.aggressive*0.3) ? 1 : 0;
  var useSpin = Math.random() < tier.spinUse;
  var spinTop = useSpin ? (Math.random()<0.6?1:-1) : 0;
  var spinSide = (useSpin && Math.random()<0.5) ? (Math.random()<0.5?-1:1) : 0;
  return { laneIndex:laneIndex, depthIndex:depthIndex, spinTop:spinTop, spinSide:spinSide };
};

/* ============================================================
   SCORING
   ============================================================ */
MatchScene.prototype.awardPoint = function(winner, reason){
  if (this.mode === 'rally'){ this.rallyPoint(winner, reason); return; }
  if (this.mode === 'target'){ this.targetPoint(winner, reason); return; }
  var m = this.match;
  m.score[winner]++;
  // stats + crowd
  var stt = m.stats, loser = this.other(winner);
  stt.points[winner]++; stt.longest = Math.max(stt.longest, this.curRally);
  if (reason === 'Winner' || reason === 'No return') stt.winners[winner]++; else stt.errors[loser]++;
  this.crowdAt = this.time.now; this.crowdWho = winner; SFX.crowd(winner === 'human');
  // streak tracking + a message that says what actually happened
  if (m.streak && m.streak.side === winner) m.streak.n++; else m.streak = { side: winner, n: 1 };
  var nm = this.opponent.name;
  var heads = {
    human: { 'Winner':'Winner!', 'Out':nm+' hit it out', 'No return':nm+' couldn\'t return it', 'Serve fault':nm+' faulted the serve' },
    ai:    { 'Winner':nm+' wins the point', 'Out':'Out! Your shot missed the table', 'No return':'You didn\'t get it back', 'Serve fault':'Your serve was a fault' }
  };
  var head = (heads[winner] && heads[winner][reason]) || (winner==='human' ? 'You score' : nm+' scores');
  m.pointMsg = head + '\n' + m.score.human + ' – ' + m.score.ai + (m.streak.n >= 3 ? '   ·   ' + m.streak.n + ' in a row' : '');
  m.pointWinner = winner;
  m.msgPopAt = this.time.now;

  var hs = m.score.human, as = m.score.ai;
  var gameOver = (hs>=11 || as>=11) && Math.abs(hs-as)>=2;
  if (!gameOver){ if (winner === 'human') SFX.pointPlayer(); else SFX.pointAI(); }
  if (gameOver){
    var gw = hs>as ? 'human' : 'ai';
    m.gameWins[gw]++;
    if (m.gameWins[gw] >= 2){ if (gw==='human') SFX.matchWin(); else SFX.matchLose(); }
    else { if (gw==='human') SFX.gameWin(); else SFX.gameLose(); }
    m.pointMsg = (gw==='human'?'You win the game!':this.opponent.name+' wins the game') + '\n' + hs + ' – ' + as +
      '   ·   Games ' + m.gameWins.human + ' – ' + m.gameWins.ai;
    if (m.gameWins[gw] >= 2){
      m.matchOver = true; m.matchWinner = gw;
      // record the result right away, so leaving early (Esc / closing the tab) can't lose the win
      if (gw === 'human'){
        this.save.wins++; this.save.highestOpponent = Math.min(OPPONENTS.length-1, Math.max(this.save.highestOpponent, this.oppIndex+1));
        if (this.mode === 'tourney'){
          this.save.tourneyBestRound = Math.max(this.save.tourneyBestRound||0, this.oppIndex+1);
          if (this.oppIndex === OPPONENTS.length-1) this.save.tourneyTrophies = (this.save.tourneyTrophies||0) + 1;
        }
      }
      else { this.save.losses++; }
      Save.save(this.save);
      m.state = 'gameOver';
      m.pointTimer = 3.0; this.replayStart = this.time.now;
    } else {
      m.state = 'gameOver';
      m.pointTimer = 3.0; this.replayStart = this.time.now;
    }
  } else {
    // serve rotation: switch server every 2 points, every 1 point once both reach 10
    var total = hs+as;
    if (hs>=10 && as>=10){
      m.server = (total % 2 === 0) ? m.lastDeuceServer : this.other(m.lastDeuceServer);
      if (total === 20) m.lastDeuceServer = m.server; // lock baseline at the deuce transition
    } else {
      m.server = (Math.floor(total/2) % 2 === 0) ? m.firstServer : this.other(m.firstServer);
    }
    m.state = 'pointPause';
    m.pointTimer = 1.1;
  }
};
MatchScene.prototype.other = function(side){ return side==='human' ? 'ai' : 'human'; };

MatchScene.prototype.advanceAfterPoint = function(){
  this.match.state = 'serveToss';
  this.beginServeSequence();
};

MatchScene.prototype.startNextGame = function(){
  var m = this.match;
  if (m.matchOver){
    m.state = 'matchOver'; m.overT = 0;
    return;
  }
  m.score = {human:0, ai:0};
  m.gameNum++;
  m.firstServer = this.other(m.firstServer);
  m.server = m.firstServer;
  m.lastDeuceServer = m.firstServer;
  m.state = 'serveToss';
  this.beginServeSequence();
};

/* ============================================================
   RENDER
   ============================================================ */
MatchScene.prototype.render = function(){
  var W = this.scale.width, H = this.scale.height;
  var self = this;

  this.skyG.clear();
  var horizonY = 330;

  // back wall -- gymnasium-style, light and even
  this.skyG.fillStyle(0xd8d3c4, 1);
  this.skyG.fillRect(0, 0, W, horizonY);
  this.skyG.fillStyle(0xc7c1ae, 1);
  this.skyG.fillRect(0, horizonY-14, W, 14); // wall/floor trim

  // arena dressing: bunting along the top, sponsor boards, and a crowd that reacts to points
  var now0 = this.time.now;
  var cAge = now0 - this.crowdAt, cAmp = Math.max(0, 1 - cAge/1100);
  var cols = [0xE65B4F, 0xF2A34C, 0x4677D1, 0x5B3A7A, 0x2f8f6b, 0xd8d3c4];
  for (var bf=0; bf<=32; bf++){
    var bx = bf*(W/32), by = 10 + Math.sin(bf/32*Math.PI)*14;
    this.skyG.fillStyle(cols[bf%cols.length], 0.85);
    this.skyG.fillTriangle(bx-9, by, bx+9, by, bx, by+17);
  }
  this.skyG.lineStyle(1.5, 0x6b6552, 0.6);
  this.skyG.beginPath(); this.skyG.moveTo(0, 10);
  for (var bl=1; bl<=32; bl++) this.skyG.lineTo(bl*(W/32), 10 + Math.sin(bl/32*Math.PI)*14);
  this.skyG.strokePath();
  var skins = [0xf1c9a5, 0xd9a47c, 0xa9714b, 0x7a4b2d, 0xe8b88f];
  var hairs = [0x2b1b12, 0x5a3a1f, 0x111111, 0xb5651d, 0x8a8a8a];
  for (var row=0; row<2; row++){
    var ry = row === 0 ? 268 : 298, rr = row === 0 ? 8 : 10, step = row === 0 ? 34 : 41;
    for (var ci=0, cxp=(row?18:2); cxp < W+10; ci++, cxp += step){
      var hsh = (ci*37 + row*91 + 13) % 97;
      var jump = (cAmp > 0 && hsh % 3 !== 0) ? Math.abs(Math.sin(cAge/95 + hsh)) * 7 * cAmp * (this.crowdWho === 'human' ? 1 : 0.5) : 0;
      var yy = ry - jump + (row ? 3 : 0);
      this.skyG.fillStyle(cols[hsh % cols.length], 0.92);
      this.skyG.fillRoundedRect(cxp - rr*1.15, yy + rr*0.7, rr*2.3, rr*2.4, {tl:rr*0.9, tr:rr*0.9, bl:0, br:0});
      this.skyG.fillStyle(skins[hsh % skins.length], 1);
      this.skyG.fillCircle(cxp, yy, rr*0.78);
      this.skyG.fillStyle(hairs[(hsh >> 1) % hairs.length], 1);
      this.skyG.fillRoundedRect(cxp - rr*0.8, yy - rr*0.85, rr*1.6, rr*0.8, {tl:rr*0.8, tr:rr*0.8, bl:0, br:0});
    }
  }
  // low sponsor boards in front of the crowd
  var bw = W/8;
  for (var sb=0; sb<8; sb++){
    this.skyG.fillStyle(sb%2 ? 0x2b3a5a : 0x5B3A7A, 1);
    this.skyG.fillRect(sb*bw, horizonY-34, bw-3, 22);
    this.skyG.fillStyle(0xF2A34C, 0.9);
    this.skyG.fillRect(sb*bw+10, horizonY-26, bw*0.45, 4);
    this.skyG.fillStyle(0xEAF3E7, 0.6);
    this.skyG.fillRect(sb*bw+10, horizonY-19, bw*0.28, 3);
  }

  // ceiling light glow strips
  this.skyG.fillStyle(0xfffaee, 0.18);
  this.skyG.fillRect(0, 0, W, 26);

  // polished wood floor, filling the hall beyond the playing surface
  this.skyG.fillStyle(0x8a6a44, 1);
  this.skyG.fillRect(0, horizonY, W, H-horizonY);
  this.skyG.fillGradientStyle(0xa3824f, 0xa3824f, 0x6e5234, 0x6e5234, 1);
  this.skyG.fillRect(0, horizonY, W, H-horizonY);
  // converging floor planks toward the back-wall vanishing point for depth
  this.skyG.lineStyle(1, 0x5c4428, 0.4);
  for (var fx=-2; fx<=2; fx++){
    this.skyG.lineBetween(W/2 + fx*70, H, W/2 + fx*14, horizonY);
  }
  this.skyG.lineStyle(1, 0x5c4428, 0.25);
  for (var fy=horizonY+26; fy<H; fy+=34){
    this.skyG.lineBetween(0, fy, W, fy);
  }
  // soft shadow where floor meets wall
  this.skyG.fillStyle(0x000000, 0.12);
  this.skyG.fillRect(0, horizonY, W, 18);

  this.tableG.clear();
  var nearW=465, farW=375, nearY=645, farY=225;
  var cx = W/2;

  // dark wood/laminate apron beneath the playing surface, with simple legs for depth
  this.tableG.fillStyle(0x241a12, 1);
  this.tableG.fillTriangle(cx-nearW/2-20, nearY+26, cx+nearW/2+20, nearY+26, cx+farW/2+10, farY-10);
  this.tableG.fillTriangle(cx-nearW/2-20, nearY+26, cx+farW/2+10, farY-10, cx-farW/2-10, farY-10);
  this.tableG.fillStyle(0x1a120c, 1);
  this.tableG.fillRect(cx-nearW/2+30, nearY+10, 16, 46);
  this.tableG.fillRect(cx+nearW/2-46, nearY+10, 16, 46);

  // playing surface: a subtle gradient (brighter toward the near edge, catching more
  // light) instead of one flat fill, plus a painted edge trim just inside the apron
  this.tableG.fillStyle(COLORS.tableEdge,1);
  this.tableG.fillTriangle(cx-nearW/2-10, nearY+10, cx+nearW/2+10, nearY+10, cx+farW/2+6, farY-6);
  this.tableG.fillTriangle(cx-nearW/2-10, nearY+10, cx+farW/2+6, farY-6, cx-farW/2-6, farY-6);
  this.tableG.fillGradientStyle(shadeColor(COLORS.tableTop,0.10), shadeColor(COLORS.tableTop,0.10), shadeColor(COLORS.tableTop,-0.10), shadeColor(COLORS.tableTop,-0.10), 1);
  this.tableG.fillTriangle(cx-nearW/2, nearY, cx+nearW/2, nearY, cx+farW/2, farY);
  this.tableG.fillTriangle(cx-nearW/2, nearY, cx+farW/2, farY, cx-farW/2, farY);
  // soft sheen highlight down the middle, like light glancing off a glossy top
  this.tableG.fillStyle(0xffffff, 0.05);
  this.tableG.fillTriangle(cx-40, nearY, cx+40, nearY, cx+farW*0.08, farY);

  // boundary + center lines (proportioned like a real table's painted lines)
  this.tableG.lineStyle(3, COLORS.lines, 0.9);
  this.tableG.lineBetween(cx-nearW/2, nearY, cx+nearW/2, nearY);
  this.tableG.lineBetween(cx-farW/2, farY, cx+farW/2, farY);
  this.tableG.lineBetween(cx-nearW/2, nearY, cx-farW/2, farY);
  this.tableG.lineBetween(cx+nearW/2, nearY, cx+farW/2, farY);
  this.tableG.lineStyle(1.5, COLORS.lines, 0.55);
  this.tableG.lineBetween(cx, nearY, cx, farY);

  if (this.mode === 'target'){
    var tz = this.target, zp = 0.5 + 0.5*Math.sin(this.time.now/170);
    var selZ = this.human.depthIndex*3 + this.human.laneIndex;
    for (var zi=0; zi<6; zi++){
      var pts = this.zonePoints(zi);
      if (zi === tz.lit){
        this.tableG.fillStyle(0xFCDE5A, 0.22 + 0.22*zp);
        this.tableG.fillPoints(pts, true);
        this.tableG.lineStyle(3, 0xFCDE5A, 0.65 + 0.35*zp);
        this.tableG.strokePoints(pts, true);
        var zc = this.project((ZONE_LANE_EDGES[zi%3]+ZONE_LANE_EDGES[zi%3+1])/2*TABLE.width, (ZONE_DEPTH_EDGES[zi<3?0:1]+ZONE_DEPTH_EDGES[zi<3?1:2])/2, 0);
        this.tableG.lineStyle(2, 0xFCDE5A, 0.9);
        this.tableG.strokeEllipse(zc.x, zc.y, 26, 9);
        this.tableG.strokeEllipse(zc.x, zc.y, 10, 4);
      } else {
        this.tableG.lineStyle(1, 0xffffff, 0.14);
        this.tableG.strokePoints(pts, true);
      }
      if (zi === selZ){
        this.tableG.lineStyle(2, 0x4FD1B8, 0.85);
        this.tableG.strokePoints(pts, true);
      }
    }
  }

  // net assembly ("the gate"): sagging mesh between two clamp posts that sit just
  // outside the table edge, white top tape, thin bottom tape, and a soft shadow on the table
  var NET_X0 = -0.04, NET_X1 = TABLE.width + 0.04, NH = TABLE.netHeight, SAG = 0.007;
  var NSEG = 40;
  function netTopH(nx){ return NH - SAG*4*nx*(1-nx); } // nx 0..1 across the net, dips in the middle
  var tg = this.tableG;
  // shadow the net casts on the table surface
  var sh0 = this.project(0, TABLE.netY, 0), sh1 = this.project(TABLE.width, TABLE.netY, 0);
  var sh2 = this.project(TABLE.width, TABLE.netY+0.07, 0), sh3 = this.project(0, TABLE.netY+0.07, 0);
  tg.fillStyle(0x000000, 0.16);
  tg.fillPoints([{x:sh0.x,y:sh0.y},{x:sh1.x,y:sh1.y},{x:sh2.x,y:sh2.y},{x:sh3.x,y:sh3.y}], true);
  var postNear = this.project(NET_X0, TABLE.netY, 0), postFar = this.project(NET_X1, TABLE.netY, 0);
  tg.fillStyle(0x050505, 0.4);
  tg.fillEllipse(postNear.x, postNear.y+3, 14, 5);
  tg.fillEllipse(postFar.x, postFar.y+3, 14, 5);

  // translucent dark body of the net so the far court shows through
  var topPts = [], botPts = [];
  for (var s0=0; s0<=NSEG; s0++){
    var u = s0/NSEG, wx = NET_X0 + u*(NET_X1-NET_X0);
    var tpP = this.project(wx, TABLE.netY, netTopH(u));
    topPts.push({x:tpP.x, y:tpP.y});
  }
  for (var s1=NSEG; s1>=0; s1--){
    var u2 = s1/NSEG, wx2 = NET_X0 + u2*(NET_X1-NET_X0);
    var bP = this.project(wx2, TABLE.netY, 0);
    botPts.push({x:bP.x, y:bP.y});
  }
  tg.fillStyle(0x0d0d0d, 0.38);
  tg.fillPoints(topPts.concat(botPts), true);
  // mesh: fine vertical threads + horizontal threads that follow the sag
  tg.lineStyle(1, 0xd8dde0, 0.22);
  for (var vx=0; vx<=1.0001; vx+=0.0225){
    var wxv = NET_X0 + vx*(NET_X1-NET_X0);
    var bv = this.project(wxv, TABLE.netY, 0), tv = this.project(wxv, TABLE.netY, netTopH(vx));
    tg.lineBetween(bv.x, bv.y, tv.x, tv.y);
  }
  for (var hr=0.12; hr<=0.9; hr+=0.1){
    tg.beginPath();
    for (var hs=0; hs<=NSEG; hs++){
      var uh = hs/NSEG, wxh = NET_X0 + uh*(NET_X1-NET_X0);
      var hp = this.project(wxh, TABLE.netY, netTopH(uh)*hr);
      if (hs===0) tg.moveTo(hp.x, hp.y); else tg.lineTo(hp.x, hp.y);
    }
    tg.strokePath();
  }
  // bottom tape (thin, dark) and white top tape that follows the sag
  tg.lineStyle(2, 0x1a1a1a, 0.85);
  tg.lineBetween(postNear.x, postNear.y, postFar.x, postFar.y);
  tg.lineStyle(5, 0xf4f4f4, 1);
  tg.beginPath();
  tg.moveTo(topPts[0].x, topPts[0].y);
  for (var tp2=1; tp2<topPts.length; tp2++) tg.lineTo(topPts[tp2].x, topPts[tp2].y);
  tg.strokePath();
  tg.lineStyle(1, 0xb9bec2, 0.9); // tape edge shading
  tg.beginPath();
  tg.moveTo(topPts[0].x, topPts[0].y+3);
  for (var tp3=1; tp3<topPts.length; tp3++) tg.lineTo(topPts[tp3].x, topPts[tp3].y+3);
  tg.strokePath();

  // clamp posts: metal upright, clamp block under the table edge, round knob on top
  var postTopNear = this.project(NET_X0, TABLE.netY, NH+0.022);
  var postTopFar = this.project(NET_X1, TABLE.netY, NH+0.022);
  var posts = [[postNear, postTopNear], [postFar, postTopFar]];
  for (var pi=0; pi<2; pi++){
    var pb = posts[pi][0], pt2 = posts[pi][1];
    tg.fillStyle(0x2b2e32, 1);
    tg.fillRoundedRect(pb.x-6, pb.y-5, 12, 9, 2);           // clamp block
    tg.fillStyle(0x4a4f55, 1);
    tg.fillRect(pb.x-6, pb.y-5, 12, 2);                      // clamp highlight
    tg.lineStyle(5, 0x3a3e44, 1);
    tg.lineBetween(pb.x, pb.y-4, pt2.x, pt2.y);              // upright
    tg.lineStyle(1.5, 0x8a9096, 0.7);
    tg.lineBetween(pb.x-1.2, pb.y-4, pt2.x-1.2, pt2.y);      // metallic glint
    tg.fillStyle(0x23262a, 1);
    tg.fillCircle(pt2.x, pt2.y, 4.5);
    tg.fillStyle(0x6a7076, 1);
    tg.fillCircle(pt2.x-1.2, pt2.y-1.2, 1.6);
  }

  var g = this.sceneG; g.clear();
  var fx = this.fxG; fx.clear();

  // players + paddles (one anchored draw each, so body/paddle/head never drift
  // apart the way they did when paddle and body used two different projected depths)
  var swingP = clamp(1 - (this.human.swingUntil - this.time.now)/180, 0, 1);
  if (this.human.swingUntil < this.time.now) swingP = 0;
  this.drawPlayerWithPaddle(g, this.human.x, false, this.save.look, COLORS.paddleRed, swingP);
  this.drawPlayerWithPaddle(g, this.ai.x, true, this.opponent.look, COLORS.paddleBlue);

  if (this.match.state === 'gameOver' && this.isMatch) this.drawReplay(g);

  // ball trail
  var ball = this.ball;
  if (ball.alive && ball.trail.length>1){
    for (var i=0;i<ball.trail.length-1;i++){
      var tp0 = ball.trail[i], tp1 = ball.trail[i+1];
      var a0 = this.project(tp0.x,tp0.y,tp0.h), a1 = this.project(tp1.x,tp1.y,tp1.h);
      var alpha = (i/ball.trail.length) * 0.35;
      var spinCol = ball.topSpin>0.15?COLORS.topSpin:(ball.topSpin<-0.15?COLORS.backSpin:(Math.abs(ball.sideSpin)>0.15?COLORS.sideSpin:COLORS.ball));
      g.lineStyle(2, spinCol, alpha);
      g.lineBetween(a0.x,a0.y,a1.x,a1.y);
    }
  }

  // ball + shadow (shadow stays on the table, shrinking and fading as the ball rises)
  var nowT = this.time.now, dtR = Math.min(0.05, Math.max(0, (nowT - this.lastRenderT)/1000)); this.lastRenderT = nowT;
  if (ball.fxPending){ this.spawnHitFx(ball.fxPending); ball.fxPending = null; }
  if (ball.alive || this.match.state==='serveToss'){
    var shadowP = this.project(ball.x, ball.y, 0);
    var r = lerp(8,5, clamp(ball.y/TABLE.length,0,1));
    var lift = clamp(ball.h/0.6, 0, 1);
    g.fillStyle(COLORS.shadow, 0.42 - 0.22*lift);
    g.fillEllipse(shadowP.x, shadowP.y+2, r*(1.9 - 0.5*lift), r*(0.62 - 0.2*lift));
    var bp = this.project(ball.x, ball.y, ball.h);
    var spinRing = ball.alive && (Math.abs(ball.topSpin)>0.15 || Math.abs(ball.sideSpin)>0.15);
    if (spinRing){
      var ringCol = Math.abs(ball.topSpin) >= Math.abs(ball.sideSpin) ? (ball.topSpin>0?COLORS.topSpin:COLORS.backSpin) : COLORS.sideSpin;
      g.lineStyle(2, ringCol, 0.8);
      g.strokeCircle(bp.x, bp.y, r+2);
    }
    g.fillStyle(COLORS.ball,1);
    g.fillCircle(bp.x, bp.y, r);
    // visible spin: a seam line that turns at a rate set by the spin (topspin and sidespin spin it differently)
    if (ball.alive){
      var omega = (ball.topSpin*(ball.vy>=0 ? -1 : 1) + ball.sideSpin*0.8) * 26; // rad/s
      this.ballAngle += omega*dtR;
      var ca = Math.cos(this.ballAngle), sa = Math.sin(this.ballAngle);
      g.lineStyle(Math.max(1.2, r*0.28), 0x8a7a55, Math.abs(omega) > 1 ? 0.75 : 0.25);
      g.lineBetween(bp.x - ca*r*0.9, bp.y - sa*r*0.9, bp.x + ca*r*0.9, bp.y + sa*r*0.9);
    }
    g.fillStyle(0xffffff, 0.5);
    g.fillCircle(bp.x-r*0.3, bp.y-r*0.3, r*0.35);
  }
  this.drawFx(fx);

  this.renderHud();
};

/* Anchors a figure to the table: lateral x from the real projection at their own
   baseline, vertical anchor a fixed screen offset from the table edge. */
MatchScene.prototype.drawPlayerWithPaddle = function(g, tableX, isAi, look, paddleColor, swing){
  var farY = 225, nearY = 645;
  var p = this.project(tableX, isAi ? TABLE.length : 0, 0);
  var anchorY = isAi ? farY - 46 : nearY + 46;
  drawFigure(g, p.x, anchorY, 1.7, look, paddleColor, isAi ? -1 : 1, swing, isAi);
};

MatchScene.prototype.renderHud = function(){
  var W = this.scale.width, H = this.scale.height;
  var m = this.match;
  this.scoreText.setText(this.mode === 'rally' ? 'RALLY  ' + this.rally.count : this.mode === 'target' ? 'SCORE  ' + this.target.score : m.score.human + '  —  ' + m.score.ai);
  var hsc = m.score.human, asc = m.score.ai, pointTag = '';
  if (m.state !== 'gameOver' && m.state !== 'matchOver'){
    var sideAtPoint = (hsc>=10 && hsc-asc>=1) ? 'human' : (asc>=10 && asc-hsc>=1) ? 'ai' : null;
    if (sideAtPoint) pointTag = (m.gameWins[sideAtPoint] >= 1 ? '   ·   MATCH POINT' : '   ·   GAME POINT') + (sideAtPoint==='human' ? ' (you)' : ' ('+this.opponent.name+')');
  }
  this.gameText.setText('Game '+m.gameNum+'   You '+m.gameWins.human+' – '+m.gameWins.ai+' '+this.opponent.name+
    '   Serve: '+(m.server==='human'?'You':this.opponent.name) + pointTag);
  if (this.mode === 'tourney') this.gameText.setText(ROUND_NAMES[this.oppIndex] + '   ·   ' + this.gameText.text);
  if (this.mode === 'target'){
    var tl = Math.ceil(this.target.timeLeft), tgt = this.target;
    this.gameText.setText('Target Practice   ·   ' + (this.target.started ? Math.floor(tl/60) + ':' + ('0'+(tl%60)).slice(-2) : '1:00') +
      '   ·   Best: ' + Math.max(this.save.targetBest||0, tgt.score) + (tgt.combo > 1 ? '   ·   Combo x' + tgt.combo : ''));
  } else if (this.mode === 'rally'){
    var spdTag = this.rally.count >= 8 ? '   ·   Speed +' + Math.round(Math.min(38, this.rally.count*1.2)) + '%' : '';
    this.gameText.setText('Rally Challenge   ·   Best: ' + (this.save.rallyBest||0) + spdTag);
  }

  this.hudG.clear();
  // dark backing so the HUD text reads on the light wall
  this.hudG.fillStyle(0x101923, 0.82);
  this.hudG.fillRoundedRect(W/2-280, 8, 560, 56, 12);
  this.hudG.fillRoundedRect(8, 10, 300, 26, 8);
  // AIM strip (top-left, clear of both players)
  var Z = ZONE_STRIP;
  var labels = ['Short-L','Short-C','Short-R','Deep-L','Deep-C','Deep-R'];
  this.hudG.fillStyle(0x000000, 0.18);
  this.hudG.fillRoundedRect(Z.x-4, Z.y-4, 6*(Z.w+Z.gap)+2, Z.h+8, 8);
  for (var i=0;i<6;i++){
    var zx = Z.x + i*(Z.w+Z.gap);
    var selected = (this.human.laneIndex===i%3) && (this.human.depthIndex === (i<3?0:1));
    this.hudG.fillStyle(selected?0x4FD1B8:0x1c2d28, selected?0.95:0.7);
    this.hudG.fillRoundedRect(zx, Z.y, Z.w, Z.h, 5);
    this.hudG.lineStyle(1, selected?0xBFF5EA:0x2d3f3a, 0.9);
    this.hudG.strokeRoundedRect(zx, Z.y, Z.w, Z.h, 5);
  }
  if (!this.zoneLabels){
    this.zoneLabels = [];
    for (var j=0;j<6;j++){
      this.zoneLabels.push(this.add.text(0,0,'',{fontFamily:'Arial', fontSize:'10px', color:'#EAF3E7'}).setOrigin(0.5).setDepth(5));
    }
    this.aimCaption = this.add.text(Z.x, Z.y+Z.h+6, this.touchUi ? 'AIM  (tap to pick your shot)' : 'AIM  (keys 1-6)', {fontFamily:'Arial', fontSize:'9px', color:'#7d8c85'}).setDepth(5);
  }
  for (var k=0;k<6;k++){
    var selK = (this.human.laneIndex===k%3) && (this.human.depthIndex === (k<3?0:1));
    this.zoneLabels[k].setPosition(Z.x + k*(Z.w+Z.gap) + Z.w/2, Z.y + Z.h/2);
    this.zoneLabels[k].setText(labels[k]).setColor(selK ? '#06241d' : '#EAF3E7');
  }

  // spin indicator
  var spinLabel = '';
  if (this.human.spinTop>0) spinLabel += 'TOP ';
  if (this.human.spinTop<0) spinLabel += 'BACK ';
  if (this.human.spinSide<0) spinLabel += 'LEFT ';
  if (this.human.spinSide>0) spinLabel += 'RIGHT ';
  if (!spinLabel) spinLabel = 'FLAT';
  var rh = this.ruleHint && (m.state === 'serveToss' || (m.state === 'rally' && this.ball.lastHitBy !== 'human' && !this.ball.servePhase)) ? this.ruleHint : null;
  if (rh){ this.ruleText.setText(rh).setAlpha(1); } else { this.ruleText.setAlpha(0); }
  if (this.mode === 'target') this.hintText.setText(this.touchUi ? 'Drag to move   ·   Tap AIM buttons to pick the zone   ·   Tap SWING to hit' : 'A/D or drag to move   ·   1-6 or AIM buttons pick the zone   ·   Space swings   ·   Hit the glowing zone');
  else this.hintText.setText(this.touchUi ? 'Drag to move   ·   Tap SWING to serve / hit' : 'Spin: '+spinLabel.trim()+'   [Space] Serve/Swing   [Enter] Continue after point   [Esc] Menu');

  // big, hard-to-miss prompt telling the player exactly what to do right now
  var pulse = Math.sin(this.time.now/140) > 0;
  if (m.state === 'serveToss' && m.server === 'human'){
    this.actionText.setAlpha(1);
    this.actionText.setColor(pulse ? '#F2A34C' : '#FCDE5A');
    this.actionText.setText((this.touchUi ? 'TAP SWING TO SERVE' : 'PRESS SPACE TO SERVE') + (this.autoShot ? '  ·  '+this.autoShot.label : ''));
  } else if (m.state === 'rally' && this.swingPromptActive){
    this.actionText.setAlpha(1);
    this.actionText.setColor(pulse ? '#1D9E75' : '#9FE1CB');
    this.actionText.setText((this.touchUi ? 'SWING NOW! (TAP)' : 'SWING NOW! (SPACE)') + (this.autoShot ? '  ·  '+this.autoShot.label : ''));
  } else if (m.state === 'rally' && this.ball.alive && this.ball.lastHitBy !== 'human' && !this.ball.servePhase){
    this.actionText.setAlpha(0.55);
    this.actionText.setColor('#6c7a74');
    this.actionText.setText('Get ready -- ball is on the way');
  } else {
    this.actionText.setAlpha(0);
  }

  var fbAge = this.hitFeedback ? (this.time.now - this.hitFeedback.at) : 99999;
  if (this.hitFeedback && fbAge < 700){
    var hp = this.project(this.human.x, 0, 0);
    this.feedbackText.setText(this.hitFeedback.text).setColor(this.hitFeedback.color);
    this.feedbackText.setPosition(hp.x, 548 - fbAge*0.02);
    this.feedbackText.setAlpha(fbAge < 400 ? 1 : 1 - (fbAge-400)/300);
  } else {
    this.feedbackText.setAlpha(0);
  }

  if (this.keys.esc.isDown){ this.scene.start('Menu'); }

  // point / game / match messages
  if (m.state !== 'matchOver'){ if (this.statUi && this.statShown) this.setStatVisible(false); this.msgText.setY(300); }
  var showMsg = (m.state==='pointPause' || m.state==='gameOver' || m.state==='matchOver' || (m.state==='serveToss' && m.pointMsg));
  if (m.state==='matchOver'){
    var won = m.matchWinner === 'human', last = this.oppIndex === OPPONENTS.length-1;
    var head = won ? 'YOU WIN THE MATCH' : this.opponent.name.toUpperCase() + ' WINS', sub = '';
    if (this.mode === 'tourney'){
      if (won && last){ head = 'TOURNAMENT CHAMPION!'; sub = 'All five opponents beaten'; }
      else if (won){ head = ROUND_NAMES[this.oppIndex].toUpperCase() + ' CLEARED'; sub = 'Next: ' + OPPONENTS[this.oppIndex+1].name + ' (' + ROUND_NAMES[this.oppIndex+1] + ')'; }
      else { head = 'ELIMINATED'; sub = 'Knocked out in the ' + ROUND_NAMES[this.oppIndex] + ' by ' + this.opponent.name; }
    }
    this.msgText.setAlpha(1).setY(sub ? 150 : 165).setScale(1);
    this.msgText.setColor(won ? '#FCDE5A' : '#F09595');
    this.msgText.setText(head + (sub ? '\n' + sub : ''));
    this.renderStats();
  } else if (m.state==='gameOver' || m.state==='pointPause'){
    this.msgText.setAlpha(1);
    this.msgText.setText(m.pointMsg);
    this.msgText.setColor(m.pointWinner === 'human' ? '#9FE1CB' : '#F09595');
    var popAge = this.time.now - (m.msgPopAt || 0);
    this.msgText.setScale(1 + 0.22*Math.max(0, 1 - popAge/220));
  } else if (this.mode === 'rally' && this.time.now - this.rally.milestoneAt < 1300){
    var ma = this.time.now - this.rally.milestoneAt;
    this.msgText.setAlpha(ma < 900 ? 1 : 1 - (ma-900)/400);
    this.msgText.setText(this.rally.milestoneText).setColor('#FCDE5A');
    this.msgText.setScale(1 + 0.22*Math.max(0, 1 - ma/220));
  } else {
    this.msgText.setAlpha(0);
    this.msgText.setScale(1);
  }

  // replay badge
  if (m.state === 'gameOver' && this.isMatch){
    this.hudG.fillStyle(0x000000, 0.45); this.hudG.fillRoundedRect(W-170, 20, 150, 30, 15);
    this.hudG.fillStyle(0xE65B4F, 1); this.hudG.fillCircle(W-150, 35, 5);
    if (!this.replayLabel) this.replayLabel = this.add.text(W-95, 35, 'REPLAY  0.5x', {fontFamily:'Arial', fontSize:'13px', color:'#EAF3E7', fontStyle:'bold'}).setOrigin(0.5).setDepth(60);
    this.replayLabel.setVisible(true);
  } else if (this.replayLabel) this.replayLabel.setVisible(false);

  // target practice: floating score text
  if (this.mode === 'target' && this.targetFloat){
    var tf = this.target.float, tfa = tf ? this.time.now - tf.at : 99999;
    if (tf && tfa < 900){
      this.targetFloat.setText(tf.text).setColor(tf.color).setPosition(tf.x, tf.y - tfa*0.05).setAlpha(tfa < 600 ? 1 : 1 - (tfa-600)/300).setScale(1 + 0.25*Math.max(0, 1 - tfa/200));
    } else this.targetFloat.setAlpha(0);
  }

  // on-screen swing button (touch devices only)
  if (this.touchUi){
    var tb = this.touchBtn, pressed = this.time.now < tb.downUntil;
    var hot = (m.state==='serveToss' && m.server==='human') || (m.state==='rally' && this.swingPromptActive);
    var rr = tb.r * (pressed ? 0.92 : 1);
    this.hudG.fillStyle(0x000000, 0.25);
    this.hudG.fillCircle(tb.x, tb.y+5, rr+2);
    this.hudG.fillStyle(hot ? 0xF2A34C : 0x3c3489, pressed ? 1 : 0.92);
    this.hudG.fillCircle(tb.x, tb.y, rr);
    this.hudG.lineStyle(4, hot ? 0xFCDE5A : 0x6b5fc4, 1);
    this.hudG.strokeCircle(tb.x, tb.y, rr);
    if (hot){
      this.hudG.lineStyle(3, 0xFCDE5A, 0.35 + 0.35*Math.sin(this.time.now/120));
      this.hudG.strokeCircle(tb.x, tb.y, rr + 8);
    }
    if (!this.touchBtnText){
      this.touchBtnText = this.add.text(tb.x, tb.y, 'SWING', {fontFamily:'Arial', fontSize:'22px', color:'#ffffff', fontStyle:'bold'}).setOrigin(0.5).setDepth(50);
    }
    var lbl = m.state==='serveToss' ? 'SERVE' : (m.state==='pointPause' || m.state==='gameOver') ? 'NEXT' : m.state==='matchOver' ? 'MENU' : 'SWING';
    this.touchBtnText.setText(lbl).setColor(hot ? '#2c1a05' : '#ffffff').setScale(pressed ? 0.92 : 1);
  }
};

/* ============================================================
   BOOTSTRAP
   ============================================================ */
var config = {
  type: Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#101923',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1280, height: 720 },
  physics: { default: 'none' },
  scene: [BootScene, MenuScene, CustomizeScene, MatchScene]
};
window.addEventListener('load', function(){
  window.game = new Phaser.Game(config);
});
})();
</script>
