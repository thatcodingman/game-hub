<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spin Rally</title>
<style>
  html,body{margin:0;padding:0;background:#101923;overflow:hidden;height:100%;}
  #game{width:100vw;height:100vh;}
  canvas{display:block;}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
(function(){
'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function shadeColor(hex, amt){
  var r=(hex>>16&0xff), g=(hex>>8&0xff), b=(hex&0xff);
  r=clamp(Math.round(r+amt*255),0,255); g=clamp(Math.round(g+amt*255),0,255); b=clamp(Math.round(b+amt*255),0,255);
  return (r<<16)|(g<<8)|b;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function deg2rad(d){ return d*Math.PI/180; }
function randRange(a,b){ return a+Math.random()*(b-a); }

/* ============================================================
   CONSTANTS  (table-tennis coordinates, meters)
   ============================================================ */
var TABLE = { width:1.525, length:2.740, netY:1.370, netHeight:0.1525 };
var BALL_RADIUS = 0.020;
var GRAVITY = 9.81;
var DT = 1/240;

var LANE_FRACS = [0.22,0.50,0.78];
var DEPTH_SHORT = 2.02, DEPTH_LONG = 2.52; // distances from the y=0 (human) end -- used as targets into the +y half
var STRIKE_Y_HUMAN = 0.55;
var STRIKE_Y_AI = TABLE.length - 0.55;
var SERVE_OWN_Y_HUMAN = 0.95;             // first-bounce target on the server's own side
var SERVE_OWN_Y_AI = TABLE.length - 0.95;
var PADDLE_X_MIN = 0.12, PADDLE_X_MAX = 1.405;
var PADDLE_HALF_W = 0.095;
var STRIKE_H_MIN = 0.08, STRIKE_H_MAX = 0.45;
var TIMING_WINDOW = 0.15;

var PADDLES = {
  starter:{ key:'starter', name:'Starter', power:1.00, control:1.00, spin:1.00, unlock:0 },
  speed:  { key:'speed',   name:'Speed',   power:1.10, control:0.90, spin:0.95, unlock:3 },
  control:{ key:'control', name:'Control', power:0.92, control:1.12, spin:0.95, unlock:6 },
  spin:   { key:'spin',    name:'Spin',    power:0.95, control:0.95, spin:1.12, unlock:9 }
};
var PADDLE_ORDER = ['starter','speed','control','spin'];

var OPPONENTS = [
  { name:'Rookie Rae',   tier:'easy' },
  { name:'Steady Sam',   tier:'easy' },
  { name:'Lena Loop',    tier:'medium' },
  { name:'Marcus Spin',  tier:'medium' },
  { name:'The Wall',     tier:'hard' }
];

var AI_TIERS = {
  easy:   { reactMs:240, aimErr:0.22, timeErr:0.090, spinUse:0.10, paddleSpeed:2.2, aggressive:0.15 },
  medium: { reactMs:150, aimErr:0.13, timeErr:0.050, spinUse:0.35, paddleSpeed:3.0, aggressive:0.40 },
  hard:   { reactMs:80,  aimErr:0.06, timeErr:0.022, spinUse:0.65, paddleSpeed:3.8, aggressive:0.55 }
};

var COLORS = {
  background:0x101923, tableTop:0x5B3A7A, tableEdge:0x2E1D40, lines:0xEAF3E7,
  net:0xD6E0DC, ball:0xF4F0D7, paddleRed:0xE65B4F, paddleBlue:0x4677D1, shadow:0x07100F,
  topSpin:0xF2A34C, backSpin:0x6FD8E0, sideSpin:0xB07CE0
};

/* ============================================================
   SAVE
   ============================================================ */
var SAVE_KEY = 'spinRally.v1';
var Save = {
  defaults:function(){
    return { version:1, wins:0, losses:0, unlockedPaddles:['starter'], selectedPaddle:'starter', highestOpponent:0, soundEnabled:true };
  },
  load:function(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return this.defaults();
      var s = JSON.parse(raw);
      var d = this.defaults();
      for (var k in d){ if (!(k in s)) s[k]=d[k]; }
      return s;
    } catch(e){ return this.defaults(); }
  },
  save:function(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch(e){} }
};

/* ============================================================
   SFX  -- small synthesized sound set (WebAudio), no sample files
   ============================================================ */
var SFX = (function(){
  var ctx=null, enabled=true, ambientNodes=null;
  function ensureCtx(){ if (!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function env(node, t0, a, d, sustain, r, dur){
    node.gain.setValueAtTime(0, t0);
    node.gain.linearRampToValueAtTime(1, t0+a);
    node.gain.linearRampToValueAtTime(sustain, t0+a+d);
    node.gain.setValueAtTime(sustain, t0+dur-r);
    node.gain.linearRampToValueAtTime(0, t0+dur);
  }
  function tone(freq, dur, type, vol, pitchSlide){
    if (!enabled) return;
    var c = ensureCtx(); if (!c) return;
    var t0 = c.currentTime;
    var osc = c.createOscillator(); osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (pitchSlide) osc.frequency.linearRampToValueAtTime(freq*pitchSlide, t0+dur);
    var g = c.createGain();
    env(g, t0, 0.005, dur*0.3, (vol||0.5)*0.7, dur*0.4, dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, vol, filterFreq){
    if (!enabled) return;
    var c = ensureCtx(); if (!c) return;
    var t0 = c.currentTime;
    var bufferSize = Math.floor(c.sampleRate*dur);
    var buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    var src = c.createBufferSource(); src.buffer = buffer;
    var filt = c.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value = filterFreq||1200;
    var g = c.createGain(); g.gain.setValueAtTime((vol||0.4), t0); g.gain.linearRampToValueAtTime(0, t0+dur);
    src.connect(filt); filt.connect(g); g.connect(c.destination);
    src.start(t0);
  }
  return {
    setEnabled:function(v){ enabled=!!v; },
    paddleHit:function(speedNorm){
      var s = clamp(speedNorm,0,1);
      tone(520+s*260, 0.07, 'triangle', 0.35+0.25*s);
    },
    tableBounce:function(){ tone(260, 0.06, 'sine', 0.3); },
    netClip:function(){ noiseBurst(0.12, 0.35, 900); },
    pointPlayer:function(){ tone(660,0.09,'square',0.3); setTimeout(function(){ tone(880,0.12,'square',0.3); }, 90); },
    pointAI:function(){ tone(420,0.1,'square',0.28); setTimeout(function(){ tone(300,0.14,'square',0.28); }, 90); },
    serveTone:function(){ tone(900,0.05,'sine',0.2); }
  };
})();

/* ============================================================
   BALL PHYSICS
   ============================================================ */
function makeBall(){
  return { x:TABLE.width/2, y:0.55, h:0.35, vx:0, vy:0, vh:0,
    topSpin:0, sideSpin:0, alive:false, lastHitBy:null,
    lastBounceSideSameHit:null, bouncesSinceHit:0, servePhase:false,
    serveBounceSeq:[], pendingServe:null, trail:[] };
}

function stepBall(ball, dt, onBounce, onNet, onOut){
  if (!ball.alive) return;
  var prevY = ball.y, prevH = ball.h;
  var speed = Math.hypot(ball.vx, ball.vy);
  var ax = clamp(0.18*ball.sideSpin*speed, -3, 3);
  var ah = clamp(-0.08*ball.topSpin*speed, -1.5, 1.5);
  ball.vx += ax*dt;
  ball.vh += (ah - GRAVITY)*dt;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;
  ball.h += ball.vh*dt;

  // net crossing
  if (!ball.alive) return;
  if ((prevY - TABLE.netY) * (ball.y - TABLE.netY) < 0){
    if (ball.h < TABLE.netHeight + BALL_RADIUS){
      ball.vy = -ball.vy*0.15;
      ball.vx *= 0.8;
      if (onNet) onNet(ball);
    }
  }

  // table bounce
  if (ball.h <= 0 && ball.vh < 0 && ball.x >= -0.05 && ball.x <= TABLE.width+0.05 && ball.y >= -0.05 && ball.y <= TABLE.length+0.05){
    ball.h = 0;
    ball.vy *= (1 + 0.10*ball.topSpin);
    ball.vh = -ball.vh * (0.87 - 0.08*ball.topSpin);
    ball.vx += 0.06*ball.sideSpin*Math.abs(ball.vy);
    ball.vx *= 0.99; ball.vy *= 0.99;
    ball.topSpin *= 0.72; ball.sideSpin *= 0.72;
    var side = ball.y < TABLE.netY ? 'human' : 'ai';
    if (onBounce) onBounce(ball, side);
  }

  // out of play volume
  if (ball.y < -0.5 || ball.y > TABLE.length+0.5 || ball.x < -0.6 || ball.x > TABLE.width+0.6 || ball.h < -1.0){
    if (onOut) onOut(ball);
  }

  ball.trail.push({x:ball.x,y:ball.y,h:ball.h,t:0});
  if (ball.trail.length > 10) ball.trail.shift();
  for (var i=0;i<ball.trail.length;i++) ball.trail[i].t += dt;
}

/* Solve a launch velocity that lands the ball at (targetX,targetY,0) over time T,
   stepping T upward until the flight clears the net by the required margin
   (or falls back to a slow high arc rather than firing it through the net). */
function solveShot(ball, targetX, targetY, baseT){
  var g = GRAVITY;
  var T = clamp(baseT||0.34, 0.22, 0.58);
  var vx, vy, vh, cleared=false;
  var guard = 0;
  while (T <= 0.60+1e-6 && guard < 20){
    vx = (targetX - ball.x)/T;
    vy = (targetY - ball.y)/T;
    vh = (0 - ball.h + 0.5*g*T*T)/T;
    var tn = (TABLE.netY - ball.y)/vy;
    if (tn > 0 && tn < T){
      var hAtNet = ball.h + vh*tn - 0.5*g*tn*tn;
      if (hAtNet > TABLE.netHeight + 0.04){ cleared = true; break; }
    } else {
      cleared = true; break;
    }
    T += 0.02; guard++;
  }
  if (!cleared){
    T = 0.72;
    vx = (targetX - ball.x)/T;
    vy = (targetY - ball.y)/T;
    vh = (0 - ball.h + 0.5*g*T*T)/T * 1.18;
  }
  return { vx:vx, vy:vy, vh:vh, T:T };
}

/* Resolve a paddle contact: computes power/control quality from timing + offset,
   applies paddle stats + spin selection, and launches the ball toward the chosen
   lane/depth target with aim error inversely proportional to control quality. */
function resolveHit(ball, hitterSide, opts){
  var timingQ = clamp(1 - Math.abs(opts.timingError)/TIMING_WINDOW, 0, 1);
  var centerQ = clamp(1 - Math.abs(opts.offset), 0, 1);
  var power = 0.55 + 0.45*timingQ;
  var control = 0.55 + 0.45*centerQ;
  var aimErrorM = (1-control) * 0.18;
  var finalTargetX = clamp(opts.targetX + randRange(-aimErrorM, aimErrorM), BALL_RADIUS, TABLE.width - BALL_RADIUS);

  var baseT = lerp(0.50, 0.30, power) / Math.max(0.5, opts.paddleStats.power);
  var shot = solveShot(ball, finalTargetX, opts.targetY, baseT);

  ball.vx = shot.vx; ball.vy = shot.vy; ball.vh = shot.vh;
  ball.topSpin = opts.spinTop * opts.paddleStats.spin * (0.5+0.5*timingQ);
  ball.sideSpin = opts.spinSide * opts.paddleStats.spin * (0.5+0.5*timingQ);
  ball.lastHitBy = hitterSide;
  ball.lastBounceSideSameHit = null;
  ball.bouncesSinceHit = 0;
  // Any hit ends serve-phase bookkeeping -- the serve's own bounce sequence is only
  // relevant up until it is first legally returned (executeServe re-arms it right
  // after this call for the serve itself). Leaving it set after a return hit was
  // the bug that let a later, unrelated bounce get misread as part of the original
  // serve's legality check and award a contradictory point.
  ball.servePhase = false;

  SFX.paddleHit(power);
  return { power:power, control:control, timingQ:timingQ, centerQ:centerQ };
}

function targetCoords(laneIndex, depthIndex, towardAi){
  var x = LANE_FRACS[laneIndex] * TABLE.width;
  var yHuman = depthIndex===0 ? DEPTH_SHORT : DEPTH_LONG; // distance measured from y=0 end
  var y = towardAi ? yHuman : (TABLE.length - yHuman);
  return { x:x, y:y };
}

/* ============================================================
   BOOT
   ============================================================ */
function BootScene(){ Phaser.Scene.call(this, {key:'Boot'}); }
BootScene.prototype = Object.create(Phaser.Scene.prototype);
BootScene.prototype.create = function(){ this.scene.start('Menu'); };

/* ============================================================
   MENU
   ============================================================ */
function MenuScene(){ Phaser.Scene.call(this, {key:'Menu'}); }
MenuScene.prototype = Object.create(Phaser.Scene.prototype);
MenuScene.prototype.create = function(){
  this.save = Save.load();
  SFX.setEnabled(this.save.soundEnabled);
  this.buildUI();
};
MenuScene.prototype.buildUI = function(){
  this.children.removeAll();
  var self = this;
  var W = this.scale.width, H = this.scale.height;
  var g = this.add.graphics();
  g.fillGradientStyle(0x1c1430,0x1c1430,0x0b0a14,0x0b0a14,1);
  g.fillRect(0,0,W,H);
  // soft amber glow behind the title, tying the menu back to the game's accent color
  g.fillStyle(0xF2A34C, 0.07);
  g.fillEllipse(W/2, 60, 420, 140);

  this.add.text(W/2, 56, 'SPIN RALLY', {fontFamily:'Georgia,serif', fontSize:'44px', color:'#EAF3E7'}).setOrigin(0.5);
  this.add.text(W/2, 96, 'Time your swing. Place your shot. Read the spin.', {fontFamily:'Arial', fontSize:'15px', color:'#b8aee0'}).setOrigin(0.5);
  g.lineStyle(1, 0xF2A34C, 0.4);
  g.lineBetween(W/2-140, 116, W/2+140, 116);

  // shared hover/press feedback: scales the whole card and fades in a light
  // overlay so buttons feel alive, not just static rectangles
  function wireButtonFeedback(scene, container, w, h, hit, onActivate){
    var overlay = scene.add.graphics();
    overlay.fillStyle(0xffffff, 1);
    overlay.fillRoundedRect(-w/2, -h/2, w, h, 8);
    overlay.setAlpha(0);
    container.add(overlay);
    hit.on('pointerover', function(){
      scene.tweens.add({targets:container, scale:1.05, duration:110, ease:'Quad.Out'});
      scene.tweens.add({targets:overlay, alpha:0.10, duration:110});
    });
    hit.on('pointerout', function(){
      scene.tweens.add({targets:container, scale:1, duration:110, ease:'Quad.Out'});
      scene.tweens.add({targets:overlay, alpha:0, duration:110});
    });
    hit.on('pointerdown', function(){
      scene.tweens.add({targets:container, scale:0.95, duration:70, ease:'Quad.Out'});
    });
    hit.on('pointerup', function(){
      scene.tweens.add({targets:container, scale:1.05, duration:90, ease:'Quad.Out'});
      onActivate();
    });
  }

  // paddle selection
  this.add.text(W/2, 142, 'Paddle', {fontFamily:'Georgia,serif', fontSize:'18px', color:'#EAF3E7'}).setOrigin(0.5);
  var pW = 150, startPX = W/2 - (pW*PADDLE_ORDER.length)/2 + pW/2;
  PADDLE_ORDER.forEach(function(key, i){
    var p = PADDLES[key];
    var unlocked = self.save.unlockedPaddles.indexOf(key) >= 0;
    var cx = startPX + i*pW, cy = 190;
    var selected = self.save.selectedPaddle === key;
    var container = self.add.container(cx, cy);
    var card = self.add.graphics();
    card.fillStyle(unlocked ? (selected?0x3c3489:0x241a3a) : 0x18121f, 1);
    card.fillRoundedRect(-66, -34, 132, 68, 8);
    card.lineStyle(2, selected?0xF2A34C:0x4a3d6b, 1);
    card.strokeRoundedRect(-66, -34, 132, 68, 8);
    var nameTxt = self.add.text(0, -14, p.name, {fontFamily:'Arial', fontSize:'14px', color: unlocked?'#EAF3E7':'#5c5968'}).setOrigin(0.5);
    var statTxt = self.add.text(0, 8, unlocked ? ('P'+p.power.toFixed(2)+' C'+p.control.toFixed(2)+' S'+p.spin.toFixed(2)) : ('Win '+p.unlock+' matches'),
      {fontFamily:'Arial', fontSize:'10px', color: unlocked?'#b8aee0':'#504a5c'}).setOrigin(0.5);
    container.add([card, nameTxt, statTxt]);
    if (unlocked){
      var hit = self.add.rectangle(0, 0, 132, 68, 0xffffff, 0.001).setInteractive({useHandCursor:true});
      container.add(hit);
      wireButtonFeedback(self, container, 132, 68, hit, function(){
        self.save.selectedPaddle = key; Save.save(self.save); self.buildUI();
      });
    }
  });

  // opponent ladder
  this.add.text(W/2, 282, 'Opponent', {fontFamily:'Georgia,serif', fontSize:'18px', color:'#EAF3E7'}).setOrigin(0.5);
  var oW = Math.min(170, (W-60)/OPPONENTS.length);
  var startOX = W/2 - (oW*OPPONENTS.length)/2 + oW/2;
  OPPONENTS.forEach(function(o,i){
    var unlocked = i <= self.save.highestOpponent;
    var cx = startOX + i*oW, cy = 332;
    var container = self.add.container(cx, cy);
    var card = self.add.graphics();
    card.fillStyle(unlocked ? 0x241a3a : 0x18121f, 1);
    card.fillRoundedRect(-oW*0.44, -28, oW*0.88, 58, 8);
    card.lineStyle(2, unlocked?0x4a3d6b:0x241f2b, 1);
    card.strokeRoundedRect(-oW*0.44, -28, oW*0.88, 58, 8);
    var nameTxt = self.add.text(0, -10, unlocked?o.name:'???', {fontFamily:'Arial', fontSize:'12px', color: unlocked?'#EAF3E7':'#5c5968'}).setOrigin(0.5);
    var tierTxt = self.add.text(0, 10, unlocked?o.tier.toUpperCase():'Locked', {fontFamily:'Arial', fontSize:'10px', color: unlocked?'#b8aee0':'#504a5c'}).setOrigin(0.5);
    container.add([card, nameTxt, tierTxt]);
    if (unlocked){
      var hit = self.add.rectangle(0, 0, oW*0.88, 58, 0xffffff, 0.001).setInteractive({useHandCursor:true});
      container.add(hit);
      wireButtonFeedback(self, container, oW*0.88, 58, hit, function(){ self.startMatch(i); });
    }
  });

  // small decorative table-and-ball motif, filling what was dead space and tying
  // the menu visually back to the match itself
  var motifCy = 460;
  g.fillStyle(0x060810, 0.3);
  g.fillEllipse(W/2, motifCy+54, 150, 14);
  g.fillStyle(0x2E1D40, 1);
  g.fillTriangle(W/2-100, motifCy+40, W/2+100, motifCy+40, W/2+66, motifCy-22);
  g.fillTriangle(W/2-100, motifCy+40, W/2+66, motifCy-22, W/2-66, motifCy-22);
  g.fillGradientStyle(shadeColor(0x5B3A7A,0.1), shadeColor(0x5B3A7A,0.1), shadeColor(0x5B3A7A,-0.1), shadeColor(0x5B3A7A,-0.1), 1);
  g.fillTriangle(W/2-92, motifCy+34, W/2+92, motifCy+34, W/2+60, motifCy-16);
  g.fillTriangle(W/2-92, motifCy+34, W/2+60, motifCy-16, W/2-60, motifCy-16);
  g.fillStyle(0xffffff, 0.9);
  g.fillRect(W/2-2, motifCy-16, 4, 50);
  g.fillStyle(0xF4F0D7, 1);
  g.fillCircle(W/2+34, motifCy+8, 7);

  this.add.text(W/2, H*0.78, 'Wins: '+this.save.wins+'   Losses: '+this.save.losses, {fontFamily:'Arial', fontSize:'14px', color:'#b8aee0'}).setOrigin(0.5);

  var playContainer = this.add.container(W/2, H*0.86);
  var startBtn = this.add.graphics();
  startBtn.fillStyle(0xF2A34C, 1);
  startBtn.fillRoundedRect(-110, -23, 220, 46, 10);
  var playTxt = this.add.text(0, 0, 'PLAY', {fontFamily:'Arial', fontSize:'16px', color:'#2c1a05', fontStyle:'bold'}).setOrigin(0.5);
  playContainer.add([startBtn, playTxt]);
  var startHit = this.add.rectangle(0, 0, 220, 46, 0xffffff, 0.001).setInteractive({useHandCursor:true});
  playContainer.add(startHit);
  wireButtonFeedback(this, playContainer, 220, 46, startHit, function(){ self.startMatch(self.save.highestOpponent); });

  var soundLabel = this.save.soundEnabled ? 'Sound: On' : 'Sound: Off';
  var soundContainer = this.add.container(W-60, 22);
  var sPill = this.add.graphics();
  sPill.fillStyle(0x241a3a, 0.8);
  sPill.fillRoundedRect(-48, -12, 96, 24, 12);
  var sTxt = this.add.text(0, 0, soundLabel, {fontFamily:'Arial', fontSize:'13px', color:'#b8aee0'}).setOrigin(0.5);
  soundContainer.add([sPill, sTxt]);
  var sbtn = this.add.rectangle(0, 0, 96, 24, 0xffffff, 0.001).setInteractive({useHandCursor:true});
  soundContainer.add(sbtn);
  wireButtonFeedback(this, soundContainer, 96, 24, sbtn, function(){
    self.save.soundEnabled = !self.save.soundEnabled; Save.save(self.save); SFX.setEnabled(self.save.soundEnabled); self.buildUI();
  });

  this.add.text(W/2, H*0.93, 'A/D or drag to move · 1-6 target zones · W/S top/back spin · Q/E side spin · Space swing · Enter serve',
    {fontFamily:'Arial', fontSize:'12px', color:'#6c7a74'}).setOrigin(0.5);
};
MenuScene.prototype.startMatch = function(opponentIndex){
  this.scene.start('Match', { opponentIndex: opponentIndex });
};

/* ============================================================
   MATCH SCENE
   ============================================================ */
function MatchScene(){ Phaser.Scene.call(this, {key:'Match'}); }
MatchScene.prototype = Object.create(Phaser.Scene.prototype);

MatchScene.prototype.init = function(data){ this.cfg = data || {}; };

MatchScene.prototype.create = function(){
  var self = this;
  this.save = Save.load();
  this.paddleStats = PADDLES[this.save.selectedPaddle] || PADDLES.starter;
  this.opponent = OPPONENTS[clamp(this.cfg.opponentIndex||0, 0, OPPONENTS.length-1)];
  this.aiTier = AI_TIERS[this.opponent.tier];

  this.match = {
    gameWins: {human:0, ai:0},
    score: {human:0, ai:0},
    firstServer: 'human',
    server: 'human',
    gameNum: 1,
    state: 'awaitingServe', // awaitingServe -> serveToss -> rally -> pointPause -> gameOver -> matchOver
    pointMsg: '', pointTimer: 0,
    matchOver:false, matchWinner:null
  };

  this.ball = makeBall();
  this.human = { x: TABLE.width/2, laneIndex:1, depthIndex:1, spinTop:0, spinSide:0, swingUntil:-1, lastSwingAt:-999 };
  this.ai = { x: TABLE.width/2, targetX: TABLE.width/2, reactTimer:0, planned:null };

  this.serveToss = { active:false, t:0, window:2.2 };

  this.keys = this.input.keyboard.addKeys({
    left:'LEFT', right:'RIGHT', a:'A', d:'D',
    one:'ONE', two:'TWO', three:'THREE', four:'FOUR', five:'FIVE', six:'SIX',
    w:'W', s:'S', q:'Q', e:'E', space:'SPACE', enter:'ENTER', esc:'ESC'
  });
  this.prevSpace = false; this.prevEnter = false;

  this.pointerDown = false; this.pointerX = null;
  this.input.on('pointerdown', function(p){ self.pointerDown = true; self.pointerX = p.x; self.handleZoneTap(p.x,p.y); });
  this.input.on('pointermove', function(p){ if (self.pointerDown) self.pointerX = p.x; });
  this.input.on('pointerup', function(){ self.pointerDown = false; });

  this.skyG = this.add.graphics();
  this.tableG = this.add.graphics();
  this.sceneG = this.add.graphics();
  this.fxG = this.add.graphics();
  this.hudG = this.add.graphics();
  this.hudText = this.add.text(0,0,'',{fontFamily:'Arial'});
  this.buildHudTexts();

  this.beginServeSequence();

  this.scale.on('resize', function(){ /* fixed design resolution via Scale.FIT, nothing to rebuild */ });

  this.events.on('shutdown', function(){ SFX.setEnabled(self.save.soundEnabled); });
};

MatchScene.prototype.buildHudTexts = function(){
  var W = this.scale.width;
  this.scoreText = this.add.text(W/2, 16, '', {fontFamily:'Georgia,serif', fontSize:'22px', color:'#EAF3E7'}).setOrigin(0.5,0);
  this.gameText = this.add.text(W/2, 44, '', {fontFamily:'Arial', fontSize:'13px', color:'#9fb0a8'}).setOrigin(0.5,0);
  this.msgText = this.add.text(W/2, 300, '', {fontFamily:'Georgia,serif', fontSize:'30px', color:'#EAF3E7'}).setOrigin(0.5).setAlpha(0);
  this.opponentText = this.add.text(16,16, this.opponent.name+' ('+this.opponent.tier+')', {fontFamily:'Arial', fontSize:'13px', color:'#9fb0a8'});
  this.hintText = this.add.text(16, this.scale.height-24, '', {fontFamily:'Arial', fontSize:'12px', color:'#6c7a74'});
  this.actionText = this.add.text(W/2, 78, '', {fontFamily:'Georgia,serif', fontSize:'26px', color:'#F2A34C', fontStyle:'bold'}).setOrigin(0.5).setAlpha(0);
};

/* ---------- projection (fixed 1280x720 design resolution via Phaser Scale.FIT) ---------- */
MatchScene.prototype.project = function(x,y,h){
  var W = this.scale.width;
  var t = clamp(y/TABLE.length, 0, 1);
  var tableWidthPx = lerp(520,380,t);
  var centerX = W/2;
  var leftPx = centerX - tableWidthPx/2;
  var screenX = leftPx + (x/TABLE.width)*tableWidthPx;
  var groundY = lerp(630,250,t);
  var screenY = groundY - h*lerp(150,85,t);
  return { x:screenX, y:screenY, groundY:groundY, scale:tableWidthPx/TABLE.width };
};
MatchScene.prototype.screenXToTableX = function(sx, y){
  var W = this.scale.width;
  var t = clamp(y/TABLE.length, 0, 1);
  var tableWidthPx = lerp(520,380,t);
  var centerX = W/2;
  var leftPx = centerX - tableWidthPx/2;
  return clamp((sx-leftPx)/tableWidthPx * TABLE.width, 0, TABLE.width);
};

/* ============================================================
   SERVE SEQUENCE
   ============================================================ */
MatchScene.prototype.beginServeSequence = function(){
  var m = this.match;
  this.ball = makeBall();
  var serverIsHuman = m.server === 'human';
  this.ball.x = TABLE.width/2;
  this.ball.y = serverIsHuman ? STRIKE_Y_HUMAN : STRIKE_Y_AI;
  this.ball.h = 0.30;
  this.ball.alive = false;
  this.ball.servePhase = true;
  this.ball.serveBounceSeq = [];
  this.serveToss = { active:true, t:0, window: serverIsHuman?2.2:0.001 };
  m.state = 'serveToss';
  if (!serverIsHuman){
    this.aiServeTimer = randRange(0.5,0.9);
  }
};

/* A legal serve has to bounce on the SERVER'S OWN side before crossing to the
   receiver -- one paddle hit can't physically produce two separately-aimed
   bounces from a single solveShot call (that solver aims one flight at one
   landing point). So a serve is executed as two legs: an initial, lightly-aimed
   toss-hit that lands on the server's own side (this is the only part resolved
   here), then onBallBounce redirects the ball toward the real chosen target the
   instant that first bounce happens -- see the servePhase handling there. */
MatchScene.prototype.executeServe = function(side, quality){
  var m = this.match;
  var ball = this.ball;
  ball.alive = true;
  var towardAi = side === 'human';
  var laneIndex, depthIndex, spinTop, spinSide, offset, timingError, paddleStats;
  if (side === 'human'){
    laneIndex = this.human.laneIndex; depthIndex = this.human.depthIndex;
    spinTop = this.human.spinTop; spinSide = this.human.spinSide;
    paddleStats = this.paddleStats;
    offset = 0; timingError = (1-quality)*TIMING_WINDOW*0.6;
  } else {
    var plan = this.planAiServe();
    laneIndex = plan.laneIndex; depthIndex = plan.depthIndex; spinTop = plan.spinTop; spinSide = plan.spinSide;
    paddleStats = PADDLES.starter;
    offset = plan.offsetNoise; timingError = plan.timingNoise;
  }
  var realTarget = targetCoords(laneIndex, depthIndex, towardAi);
  ball.pendingServe = { targetX: realTarget.x, targetY: realTarget.y, offset: offset, timingError: timingError,
    paddleStats: paddleStats, spinTop: spinTop, spinSide: spinSide };

  var ownY = side === 'human' ? SERVE_OWN_Y_HUMAN : SERVE_OWN_Y_AI;
  var ownX = LANE_FRACS[laneIndex] * TABLE.width;
  var shot = solveShot(ball, ownX, ownY, 0.30);
  ball.vx = shot.vx; ball.vy = shot.vy; ball.vh = shot.vh;
  ball.topSpin = 0; ball.sideSpin = 0;
  ball.lastHitBy = side;
  ball.servePhase = true;
  ball.serveBounceSeq = [];
  SFX.paddleHit(0.4);
  m.state = 'rally';
};

MatchScene.prototype.planAiServe = function(){
  var tier = this.aiTier;
  var laneIndex = Math.floor(randRange(0,3));
  var depthIndex = Math.random() < 0.5 ? 0 : 1;
  var useSpin = Math.random() < tier.spinUse;
  var spinTop = useSpin ? (Math.random()<0.5?1:-1) : 0;
  var spinSide = (useSpin && Math.random()<0.5) ? (Math.random()<0.5?-1:1) : 0;
  return { laneIndex:laneIndex, depthIndex:depthIndex, spinTop:spinTop, spinSide:spinSide,
    offsetNoise: randRange(-tier.aimErr,tier.aimErr), timingNoise: randRange(-tier.timeErr,tier.timeErr) };
};

/* ============================================================
   UPDATE
   ============================================================ */
MatchScene.prototype.update = function(t, dtMs){
  var dt = Math.min(dtMs/1000, 0.05);
  var m = this.match;

  this.handleContinuousInput(dt);

  if (m.state === 'serveToss'){
    this.updateServeToss(dt);
  } else if (m.state === 'rally'){
    this.updateRally(dt);
  } else if (m.state === 'pointPause'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()){
      this.advanceAfterPoint();
    }
  } else if (m.state === 'gameOver'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()) this.startNextGame();
  } else if (m.state === 'matchOver'){
    if (this.pressedEnter() || this.pressedSpace()) this.scene.start('Menu');
  }

  this.render();
};

MatchScene.prototype.pressedSpace = function(){
  var now = this.keys.space.isDown;
  var edge = now && !this.prevSpace;
  this.prevSpace = now;
  return edge;
};
MatchScene.prototype.pressedEnter = function(){
  var now = this.keys.enter.isDown;
  var edge = now && !this.prevEnter;
  this.prevEnter = now;
  return edge;
};

MatchScene.prototype.handleContinuousInput = function(dt){
  var h = this.human;
  var speed = 2.0;
  if (this.keys.left.isDown || this.keys.a.isDown) h.x -= speed*dt;
  if (this.keys.right.isDown || this.keys.d.isDown) h.x += speed*dt;
  if (this.pointerDown && this.pointerX != null){
    var ty = STRIKE_Y_HUMAN;
    var tx = this.screenXToTableX(this.pointerX, ty);
    h.x += clamp(tx - h.x, -speed*dt, speed*dt);
  }
  h.x = clamp(h.x, PADDLE_X_MIN, PADDLE_X_MAX);

  if (this.keys.one.isDown){ h.laneIndex=0; h.depthIndex=0; }
  else if (this.keys.two.isDown){ h.laneIndex=1; h.depthIndex=0; }
  else if (this.keys.three.isDown){ h.laneIndex=2; h.depthIndex=0; }
  else if (this.keys.four.isDown){ h.laneIndex=0; h.depthIndex=1; }
  else if (this.keys.five.isDown){ h.laneIndex=1; h.depthIndex=1; }
  else if (this.keys.six.isDown){ h.laneIndex=2; h.depthIndex=1; }

  if (this.keys.w.isDown) h.spinTop = 1;
  else if (this.keys.s.isDown) h.spinTop = -1;
  else if (!this.mobileSpinLock) h.spinTop = 0;

  if (this.keys.q.isDown && !this.keys.e.isDown) h.spinSide = -1;
  else if (this.keys.e.isDown && !this.keys.q.isDown) h.spinSide = 1;
  else if (!this.mobileSpinLock) h.spinSide = 0;
};

MatchScene.prototype.handleZoneTap = function(sx,sy){
  // six target zone buttons across the bottom
  var W = this.scale.width, H = this.scale.height;
  var zoneY = H-70;
  if (sy < zoneY-26 || sy > zoneY+26) return;
  var zoneW = 70, startX = W/2 - zoneW*3;
  for (var i=0;i<6;i++){
    var cx = startX + zoneW*i + zoneW/2;
    if (Math.abs(sx-cx) < zoneW/2){
      this.human.laneIndex = i%3;
      this.human.depthIndex = i<3?0:1;
      return;
    }
  }
};

/* ---------- serve toss timing ---------- */
MatchScene.prototype.updateServeToss = function(dt){
  var m = this.match;
  var serverIsHuman = m.server === 'human';
  this.serveToss.t += dt;
  var tossT = this.serveToss.t;
  var peak = 0.9;
  this.ball.h = 0.30 + Math.max(0, (peak - Math.abs(tossT-peak))) * 0.9;

  if (serverIsHuman){
    if (this.pressedSpace() || this.pressedEnter()){
      var quality = 1 - clamp(Math.abs(tossT-peak)/peak, 0, 1);
      SFX.serveTone();
      this.executeServe('human', quality);
      return;
    }
    if (tossT > this.serveToss.window){
      // double fault on serve timeout
      this.awardPoint('ai', 'Serve fault');
    }
  } else {
    this.aiServeTimer -= dt;
    if (this.aiServeTimer <= 0){
      SFX.serveTone();
      this.executeServe('ai', 0.85);
    }
  }
};

/* ---------- rally ---------- */
MatchScene.prototype.updateRally = function(dt){
  var self = this;
  var ball = this.ball;
  var steps = Math.max(1, Math.round(dt/DT));
  var subDt = dt/steps;
  for (var i=0;i<steps;i++){
    if (!ball.alive) break;
    stepBall(ball, subDt,
      function(b, side){ self.onBallBounce(b, side); },
      function(b){ SFX.netClip(); b.netTouchedThisFlight = true; },
      function(b){ self.onBallOut(b); }
    );
  }
  if (!ball.alive) return;

  this.updateAiPaddle(dt);
  this.checkHumanSwing();
  this.checkAiAutoHit();
};

MatchScene.prototype.onBallBounce = function(ball, side){
  SFX.tableBounce();
  if (ball.servePhase){
    var expected = ball.lastHitBy === 'human' ? 'human' : 'ai';
    if (side !== expected){
      // didn't bounce on the server's own side first -- a genuine serve fault
      this.awardPoint(ball.lastHitBy==='human'?'ai':'human', 'Serve fault');
      ball.alive = false;
      return;
    }
    // legal first bounce on the server's own side -- redirect toward the real
    // chosen target now, same as any other paddle contact. This is what actually
    // sends the ball over the net; servePhase is cleared inside resolveHit.
    var p = ball.pendingServe;
    if (p){
      resolveHit(ball, ball.lastHitBy, {
        targetX: p.targetX, targetY: p.targetY, offset: p.offset, timingError: p.timingError,
        paddleStats: p.paddleStats, spinTop: p.spinTop, spinSide: p.spinSide
      });
      ball.pendingServe = null;
    } else {
      ball.servePhase = false;
    }
    return;
  }

  if (ball.lastBounceSideSameHit === side){
    // double bounce on the same side without a return in between -- fault
    var faultSide = side === 'human' ? 'human' : 'ai';
    this.awardPoint(faultSide === 'human' ? 'ai' : 'human', 'No return');
    ball.alive = false;
    return;
  }
  ball.lastBounceSideSameHit = side;
};

MatchScene.prototype.onBallOut = function(ball){
  if (!ball.alive) return;
  ball.alive = false;
  var winner = ball.lastHitBy === 'human' ? 'ai' : 'human';
  // if the ball simply flew out without ever bouncing on the intended side, it's the hitter's fault
  this.awardPoint(ball.lastHitBy ? winner : 'human', 'Out');
};

MatchScene.prototype.checkHumanSwing = function(){
  var spacePressed = this.pressedSpace();
  var ball = this.ball;
  this.swingPromptActive = false;
  if (!ball.alive) return;
  if (ball.lastHitBy === 'human') return; // already heading to opponent
  if (ball.servePhase) return; // can't return a serve before it legally bounces on the server's own side
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return;
  if (ball.vy >= 0) return; // ball must be approaching the human side (moving toward y=0)
  var timeToPlane = (STRIKE_Y_HUMAN - ball.y) / ball.vy;
  if (Math.abs(timeToPlane) > TIMING_WINDOW*1.6) return; // not close enough to even attempt
  var offset = (ball.x - this.human.x) / PADDLE_HALF_W;
  if (Math.abs(offset) > 1.6) return; // nowhere near the paddle

  this.swingPromptActive = true; // ball is in range right now -- show the on-screen prompt
  if (!spacePressed) return;

  var target = targetCoords(this.human.laneIndex, this.human.depthIndex, true);
  resolveHit(ball, 'human', {
    targetX: target.x, targetY: target.y,
    offset: offset, timingError: timeToPlane,
    paddleStats: this.paddleStats, spinTop: this.human.spinTop, spinSide: this.human.spinSide
  });
};

MatchScene.prototype.updateAiPaddle = function(dt){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (ball.lastHitBy !== 'human' && ball.lastHitBy !== null){
    // ball is heading away from AI or already handled; still track toward center softly
  }
  if (ai.reactTimer > 0){
    ai.reactTimer -= dt*1000;
  } else if (ball.vy > 0 && ball.lastHitBy !== 'ai'){
    // predict landing x at AI's strike plane
    if (Math.abs(ball.vy) > 0.01){
      var tArrive = (STRIKE_Y_AI - ball.y)/ball.vy;
      if (tArrive > 0){
        ai.targetX = clamp(ball.x + ball.vx*tArrive, PADDLE_X_MIN, PADDLE_X_MAX);
      }
    }
  }
  var maxStep = tier.paddleSpeed*dt;
  ai.x += clamp(ai.targetX-ai.x, -maxStep, maxStep);
  ai.x = clamp(ai.x, PADDLE_X_MIN, PADDLE_X_MAX);
};

MatchScene.prototype.checkAiAutoHit = function(){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (ball.lastHitBy === 'ai') return;
  if (ball.servePhase) return; // can't return a serve before it legally bounces on the server's own side
  if (ball.vy <= 0) return; // only hit balls approaching the AI side
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return;
  if (Math.abs(ball.y - STRIKE_Y_AI) > Math.max(0.05, Math.abs(ball.vy)*DT*6)) return;
  if (Math.abs(ball.x - ai.x) > PADDLE_HALF_W*1.3) return;

  // reset reaction gate for the next incoming ball once this one resolves
  this.ai.reactTimer = tier.reactMs;

  var plan = this.planAiShot();
  var target = targetCoords(plan.laneIndex, plan.depthIndex, false);
  resolveHit(ball, 'ai', {
    targetX: target.x, targetY: target.y,
    offset: randRange(-tier.aimErr,tier.aimErr)/PADDLE_HALF_W,
    timingError: randRange(-tier.timeErr,tier.timeErr),
    paddleStats: PADDLES.starter, spinTop: plan.spinTop, spinSide: plan.spinSide
  });
};

MatchScene.prototype.planAiShot = function(){
  var tier = this.aiTier;
  var laneIndex = 1;
  if (Math.random() < tier.aggressive){
    // aim away from the human paddle's current lateral position
    var humanFrac = clamp((this.human.x/TABLE.width - 0) , 0, 1);
    laneIndex = humanFrac < 0.5 ? 2 : 0;
  }
  var depthIndex = Math.random() < (0.4 + tier.aggressive*0.3) ? 1 : 0;
  var useSpin = Math.random() < tier.spinUse;
  var spinTop = useSpin ? (Math.random()<0.6?1:-1) : 0;
  var spinSide = (useSpin && Math.random()<0.5) ? (Math.random()<0.5?-1:1) : 0;
  return { laneIndex:laneIndex, depthIndex:depthIndex, spinTop:spinTop, spinSide:spinSide };
};

/* ============================================================
   SCORING
   ============================================================ */
MatchScene.prototype.awardPoint = function(winner, reason){
  var m = this.match;
  m.score[winner]++;
  if (winner === 'human') SFX.pointPlayer(); else SFX.pointAI();
  m.pointMsg = (winner==='human' ? 'You score' : this.opponent.name+' scores') + ' — ' + reason;

  var hs = m.score.human, as = m.score.ai;
  var gameOver = (hs>=11 || as>=11) && Math.abs(hs-as)>=2;
  if (gameOver){
    var gw = hs>as ? 'human' : 'ai';
    m.gameWins[gw]++;
    m.pointMsg = (gw==='human'?'You win the game':this.opponent.name+' wins the game') + '  ('+hs+'-'+as+')';
    if (m.gameWins[gw] >= 2){
      m.matchOver = true; m.matchWinner = gw;
      m.state = 'gameOver';
      m.pointTimer = 2.2;
    } else {
      m.state = 'gameOver';
      m.pointTimer = 2.2;
    }
  } else {
    // serve rotation: switch server every 2 points, every 1 point once both reach 10
    var total = hs+as;
    if (hs>=10 && as>=10){
      m.server = (total % 2 === 0) ? m.lastDeuceServer : this.other(m.lastDeuceServer);
      if (total === 20) m.lastDeuceServer = m.server; // lock baseline at the deuce transition
    } else {
      m.server = (Math.floor(total/2) % 2 === 0) ? m.firstServer : this.other(m.firstServer);
    }
    m.state = 'pointPause';
    m.pointTimer = 1.1;
  }
};
MatchScene.prototype.other = function(side){ return side==='human' ? 'ai' : 'human'; };

MatchScene.prototype.advanceAfterPoint = function(){
  this.match.state = 'serveToss';
  this.beginServeSequence();
};

MatchScene.prototype.startNextGame = function(){
  var m = this.match;
  if (m.matchOver){
    var won = m.matchWinner === 'human';
    if (won){ this.save.wins++; this.save.highestOpponent = Math.min(OPPONENTS.length-1, Math.max(this.save.highestOpponent, this.cfg.opponentIndex+1)); }
    else { this.save.losses++; }
    Save.save(this.save);
    m.state = 'matchOver';
    return;
  }
  m.score = {human:0, ai:0};
  m.gameNum++;
  m.firstServer = this.other(m.firstServer);
  m.server = m.firstServer;
  m.lastDeuceServer = m.firstServer;
  m.state = 'serveToss';
  this.beginServeSequence();
};

/* ============================================================
   RENDER
   ============================================================ */
MatchScene.prototype.render = function(){
  var W = this.scale.width, H = this.scale.height;
  var self = this;

  this.skyG.clear();
  var horizonY = 330;

  // back wall -- gymnasium-style, light and even
  this.skyG.fillStyle(0xd8d3c4, 1);
  this.skyG.fillRect(0, 0, W, horizonY);
  this.skyG.fillStyle(0xc7c1ae, 1);
  this.skyG.fillRect(0, horizonY-14, W, 14); // wall/floor trim

  // blank wall for now -- no windows, no banners

  // ceiling light glow strips
  this.skyG.fillStyle(0xfffaee, 0.18);
  this.skyG.fillRect(0, 0, W, 26);

  // polished wood floor, filling the hall beyond the playing surface
  this.skyG.fillStyle(0x8a6a44, 1);
  this.skyG.fillRect(0, horizonY, W, H-horizonY);
  this.skyG.fillGradientStyle(0xa3824f, 0xa3824f, 0x6e5234, 0x6e5234, 1);
  this.skyG.fillRect(0, horizonY, W, H-horizonY);
  // converging floor planks toward the back-wall vanishing point for depth
  this.skyG.lineStyle(1, 0x5c4428, 0.4);
  for (var fx=-2; fx<=2; fx++){
    this.skyG.lineBetween(W/2 + fx*70, H, W/2 + fx*14, horizonY);
  }
  this.skyG.lineStyle(1, 0x5c4428, 0.25);
  for (var fy=horizonY+26; fy<H; fy+=34){
    this.skyG.lineBetween(0, fy, W, fy);
  }
  // soft shadow where floor meets wall
  this.skyG.fillStyle(0x000000, 0.12);
  this.skyG.fillRect(0, horizonY, W, 18);

  this.tableG.clear();
  var nearW=520, farW=380, nearY=630, farY=250;
  var cx = W/2;

  // dark wood/laminate apron beneath the playing surface, with simple legs for depth
  this.tableG.fillStyle(0x241a12, 1);
  this.tableG.fillTriangle(cx-nearW/2-20, nearY+26, cx+nearW/2+20, nearY+26, cx+farW/2+10, farY-10);
  this.tableG.fillTriangle(cx-nearW/2-20, nearY+26, cx+farW/2+10, farY-10, cx-farW/2-10, farY-10);
  this.tableG.fillStyle(0x1a120c, 1);
  this.tableG.fillRect(cx-nearW/2+30, nearY+10, 16, 46);
  this.tableG.fillRect(cx+nearW/2-46, nearY+10, 16, 46);

  // playing surface: a subtle gradient (brighter toward the near edge, catching more
  // light) instead of one flat fill, plus a painted edge trim just inside the apron
  this.tableG.fillStyle(COLORS.tableEdge,1);
  this.tableG.fillTriangle(cx-nearW/2-10, nearY+10, cx+nearW/2+10, nearY+10, cx+farW/2+6, farY-6);
  this.tableG.fillTriangle(cx-nearW/2-10, nearY+10, cx+farW/2+6, farY-6, cx-farW/2-6, farY-6);
  this.tableG.fillGradientStyle(shadeColor(COLORS.tableTop,0.10), shadeColor(COLORS.tableTop,0.10), shadeColor(COLORS.tableTop,-0.10), shadeColor(COLORS.tableTop,-0.10), 1);
  this.tableG.fillTriangle(cx-nearW/2, nearY, cx+nearW/2, nearY, cx+farW/2, farY);
  this.tableG.fillTriangle(cx-nearW/2, nearY, cx+farW/2, farY, cx-farW/2, farY);
  // soft sheen highlight down the middle, like light glancing off a glossy top
  this.tableG.fillStyle(0xffffff, 0.05);
  this.tableG.fillTriangle(cx-40, nearY, cx+40, nearY, cx+farW*0.08, farY);

  // boundary + center lines (proportioned like a real table's painted lines)
  this.tableG.lineStyle(3, COLORS.lines, 0.9);
  this.tableG.lineBetween(cx-nearW/2, nearY, cx+nearW/2, nearY);
  this.tableG.lineBetween(cx-farW/2, farY, cx+farW/2, farY);
  this.tableG.lineBetween(cx-nearW/2, nearY, cx-farW/2, farY);
  this.tableG.lineBetween(cx+nearW/2, nearY, cx+farW/2, farY);
  this.tableG.lineStyle(1.5, COLORS.lines, 0.55);
  this.tableG.lineBetween(cx, nearY, cx, farY);

  // net assembly ("the gate"): clamp posts at both edges, taut mesh, and a white
  // top tape -- not just a flat translucent band
  var postNear = this.project(0, TABLE.netY, 0), postFar = this.project(TABLE.width, TABLE.netY, 0);
  var postNearTop = this.project(0, TABLE.netY, TABLE.netHeight), postFarTop = this.project(TABLE.width, TABLE.netY, TABLE.netHeight);
  this.tableG.fillStyle(0x050505, 0.4);
  this.tableG.fillEllipse(postNear.x, postNear.y+3, 12, 4);
  this.tableG.fillEllipse(postFar.x, postFar.y+3, 12, 4);

  this.tableG.fillStyle(COLORS.net, 0.5);
  this.tableG.fillPoints([
    {x:postNear.x,y:postNear.y},{x:postFar.x,y:postFar.y},{x:postFarTop.x,y:postFarTop.y},{x:postNearTop.x,y:postNearTop.y}
  ], true);
  // mesh grid (vertical + horizontal threads), finer than before
  for (var nx=0; nx<=1.0001; nx+=0.07){
    var b = this.project(nx*TABLE.width, TABLE.netY, 0), tp = this.project(nx*TABLE.width, TABLE.netY, TABLE.netHeight);
    this.tableG.lineStyle(1, COLORS.net, 0.3);
    this.tableG.lineBetween(b.x,b.y,tp.x,tp.y);
  }
  for (var nh=0.15; nh<=0.86; nh+=0.22){
    var lp = this.project(0, TABLE.netY, nh*TABLE.netHeight), rp = this.project(TABLE.width, TABLE.netY, nh*TABLE.netHeight);
    this.tableG.lineStyle(1, COLORS.net, 0.3);
    this.tableG.lineBetween(lp.x,lp.y,rp.x,rp.y);
  }
  // white top tape, drawn slightly thick so it reads as fabric, not a wire
  this.tableG.lineStyle(4, 0xffffff, 0.95);
  this.tableG.lineBetween(postNearTop.x, postNearTop.y, postFarTop.x, postFarTop.y);
  // clamp posts at each end, standing a touch taller than the tape
  var postTopNear = this.project(0, TABLE.netY, TABLE.netHeight+0.018);
  var postTopFar = this.project(TABLE.width, TABLE.netY, TABLE.netHeight+0.018);
  this.tableG.lineStyle(4, 0x2a2a2a, 1);
  this.tableG.lineBetween(postNear.x, postNear.y, postTopNear.x, postTopNear.y);
  this.tableG.lineBetween(postFar.x, postFar.y, postTopFar.x, postTopFar.y);
  this.tableG.fillStyle(0x1f1f1f, 1);
  this.tableG.fillCircle(postTopNear.x, postTopNear.y, 4);
  this.tableG.fillCircle(postTopFar.x, postTopFar.y, 4);

  var g = this.sceneG; g.clear();
  var fx = this.fxG; fx.clear();

  // players + paddles (one anchored draw each, so body/paddle/head never drift
  // apart the way they did when paddle and body used two different projected depths)
  this.drawPlayerWithPaddle(g, this.human.x, false, 0x4a3a2f, COLORS.paddleRed);
  this.drawPlayerWithPaddle(g, this.ai.x, true, 0x3a4a55, COLORS.paddleBlue);

  // ball trail
  var ball = this.ball;
  if (ball.alive && ball.trail.length>1){
    for (var i=0;i<ball.trail.length-1;i++){
      var tp0 = ball.trail[i], tp1 = ball.trail[i+1];
      var a0 = this.project(tp0.x,tp0.y,tp0.h), a1 = this.project(tp1.x,tp1.y,tp1.h);
      var alpha = (i/ball.trail.length) * 0.35;
      var spinCol = ball.topSpin>0.15?COLORS.topSpin:(ball.topSpin<-0.15?COLORS.backSpin:(Math.abs(ball.sideSpin)>0.15?COLORS.sideSpin:COLORS.ball));
      g.lineStyle(2, spinCol, alpha);
      g.lineBetween(a0.x,a0.y,a1.x,a1.y);
    }
  }

  // ball + shadow
  if (ball.alive || this.match.state==='serveToss'){
    var shadowP = this.project(ball.x, ball.y, 0);
    var r = lerp(8,5, clamp(ball.y/TABLE.length,0,1));
    g.fillStyle(COLORS.shadow, 0.35);
    g.fillEllipse(shadowP.x, shadowP.y+2, r*1.6, r*0.5);
    var bp = this.project(ball.x, ball.y, ball.h);
    var spinRing = ball.alive && (Math.abs(ball.topSpin)>0.15 || Math.abs(ball.sideSpin)>0.15);
    if (spinRing){
      var ringCol = Math.abs(ball.topSpin) >= Math.abs(ball.sideSpin) ? (ball.topSpin>0?COLORS.topSpin:COLORS.backSpin) : COLORS.sideSpin;
      g.lineStyle(2, ringCol, 0.8);
      g.strokeCircle(bp.x, bp.y, r+2);
    }
    g.fillStyle(COLORS.ball,1);
    g.fillCircle(bp.x, bp.y, r);
    g.fillStyle(0xffffff, 0.5);
    g.fillCircle(bp.x-r*0.3, bp.y-r*0.3, r*0.35);
  }

  this.renderHud();
};

/* Draws body + paddle from a single anchor point so they never drift apart --
   the player's lateral (x) position is taken from the real table projection at
   their own baseline, but their vertical anchor is a fixed screen offset from
   that table edge rather than a second, mismatched depth projection. */
MatchScene.prototype.drawPlayerWithPaddle = function(g, tableX, isAi, bodyColor, paddleColor){
  var farY = 250, nearY = 630;
  var edgeY = isAi ? TABLE.length : 0;
  var p = this.project(tableX, edgeY, 0);
  var anchorY = isAi ? farY - 46 : nearY + 46;
  var s = 1.7;
  var side = isAi ? -1 : 1; // which way the paddle arm reaches

  var hipY = anchorY - 14*s;
  var shoulderY = anchorY - 34*s;
  var headCy = shoulderY - 9*s;
  var feetY = anchorY;
  var skin = 0xd8b896;
  var shorts = 0x2c2f33;

  g.fillStyle(0x060b09, 0.32);
  g.fillEllipse(p.x, feetY + 6*s, 26*s, 6*s); // ground shadow at the feet

  // back leg + front leg, slightly splayed for a ready stance
  g.fillStyle(0x1c1e21, 1);
  g.fillRect(p.x - 7*s, hipY, 5*s, feetY-hipY);
  g.fillRect(p.x + 2*s, hipY, 5*s, feetY-hipY);
  g.fillStyle(0x111214, 1);
  g.fillEllipse(p.x - 4.5*s, feetY, 7*s, 3.5*s); // shoes
  g.fillEllipse(p.x + 4.5*s, feetY, 7*s, 3.5*s);

  // shorts
  g.fillStyle(shorts, 1);
  g.fillRoundedRect(p.x-9*s, hipY-7*s, 18*s, 9*s, 3*s);

  // torso (jersey)
  g.fillStyle(bodyColor, 1);
  g.fillRoundedRect(p.x-9*s, shoulderY, 18*s, hipY-shoulderY+2*s, 4*s);

  // far-side arm (hangs by the body)
  g.fillStyle(bodyColor, 1);
  g.fillRoundedRect(p.x - side*11*s - 2*s, shoulderY+2*s, 4*s, 16*s, 2*s);
  g.fillStyle(skin, 1);
  g.fillCircle(p.x - side*11*s, shoulderY+19*s, 2.6*s);

  // paddle arm, reaching toward the ball side, bent at the elbow
  var elbowX = p.x + side*9*s, elbowY = shoulderY+10*s;
  var handX = p.x + side*15*s, handY = shoulderY+4*s;
  g.lineStyle(4*s, bodyColor, 1);
  g.lineBetween(p.x+side*3*s, shoulderY+2*s, elbowX, elbowY);
  g.lineBetween(elbowX, elbowY, handX, handY);
  g.fillStyle(skin, 1);
  g.fillCircle(handX, handY, 2.8*s);

  // head + simple hair cap
  g.fillStyle(skin, 1);
  g.fillCircle(p.x, headCy, 8.5*s);
  g.fillStyle(0x3a2a1e, 1);
  g.beginPath();
  g.arc(p.x, headCy, 8.6*s, Math.PI, 0, false);
  g.fillPath();

  // paddle: handle + blade, held at the hand
  g.fillStyle(0x6b4a30, 1);
  g.fillRect(handX - 1.6*s, handY - 2*s, 3.2*s, 8*s);
  g.fillStyle(paddleColor, 1);
  g.fillEllipse(handX, handY - 8*s, 11*s, 14*s);
};

MatchScene.prototype.renderHud = function(){
  var W = this.scale.width, H = this.scale.height;
  var m = this.match;
  this.scoreText.setText(m.score.human + '  —  ' + m.score.ai);
  this.gameText.setText('Game '+m.gameNum+'   You '+m.gameWins.human+' – '+m.gameWins.ai+' '+this.opponent.name+
    '   Serve: '+(m.server==='human'?'You':this.opponent.name));

  this.hudG.clear();
  // target zone buttons
  var zoneY = H-70, zoneW=70, startX = W/2 - zoneW*3;
  var labels = ['1 Short-L','2 Short-C','3 Short-R','4 Deep-L','5 Deep-C','6 Deep-R'];
  for (var i=0;i<6;i++){
    var cx = startX + zoneW*i + zoneW/2;
    var selected = (this.human.laneIndex===i%3) && (this.human.depthIndex === (i<3?0:1));
    this.hudG.fillStyle(selected?0x4FD1B8:0x1c2d28, selected?0.9:0.6);
    this.hudG.fillRoundedRect(cx-zoneW/2+4, zoneY-22, zoneW-8, 44, 6);
    this.hudG.lineStyle(1, 0x2d3f3a, 0.8);
    this.hudG.strokeRoundedRect(cx-zoneW/2+4, zoneY-22, zoneW-8, 44, 6);
  }
  if (!this.zoneLabels){
    this.zoneLabels = [];
    for (var j=0;j<6;j++){
      this.zoneLabels.push(this.add.text(0,0,'',{fontFamily:'Arial', fontSize:'10px', color:'#EAF3E7'}).setOrigin(0.5));
    }
  }
  for (var k=0;k<6;k++){
    var cxk = startX + zoneW*k + zoneW/2;
    this.zoneLabels[k].setPosition(cxk, zoneY);
    this.zoneLabels[k].setText(labels[k].replace(/^\d /,''));
  }

  // spin indicator
  var spinLabel = '';
  if (this.human.spinTop>0) spinLabel += 'TOP ';
  if (this.human.spinTop<0) spinLabel += 'BACK ';
  if (this.human.spinSide<0) spinLabel += 'LEFT ';
  if (this.human.spinSide>0) spinLabel += 'RIGHT ';
  if (!spinLabel) spinLabel = 'FLAT';
  this.hintText.setText('Spin: '+spinLabel.trim()+'   [Space] Swing   [Enter] Serve/Continue   [Esc] Menu');

  // big, hard-to-miss prompt telling the player exactly what to do right now
  var pulse = Math.sin(this.time.now/140) > 0;
  if (m.state === 'serveToss' && m.server === 'human'){
    this.actionText.setAlpha(1);
    this.actionText.setColor(pulse ? '#F2A34C' : '#FCDE5A');
    this.actionText.setText('PRESS SPACE OR ENTER TO SERVE');
  } else if (m.state === 'rally' && this.swingPromptActive){
    this.actionText.setAlpha(1);
    this.actionText.setColor(pulse ? '#1D9E75' : '#9FE1CB');
    this.actionText.setText('SWING NOW! (SPACE)');
  } else if (m.state === 'rally'){
    this.actionText.setAlpha(0.55);
    this.actionText.setColor('#6c7a74');
    this.actionText.setText('Get ready -- ball is on the way');
  } else {
    this.actionText.setAlpha(0);
  }

  if (this.keys.esc.isDown){ this.scene.start('Menu'); }

  // point / game / match messages
  var showMsg = (m.state==='pointPause' || m.state==='gameOver' || m.state==='matchOver' || (m.state==='serveToss' && m.pointMsg));
  if (m.state==='matchOver'){
    this.msgText.setAlpha(1);
    this.msgText.setText((m.matchWinner==='human'?'YOU WIN THE MATCH':this.opponent.name.toUpperCase()+' WINS') + '\n\nPress Enter for Menu');
  } else if (m.state==='gameOver'){
    this.msgText.setAlpha(1);
    this.msgText.setText(m.pointMsg);
  } else if (m.state==='pointPause'){
    this.msgText.setAlpha(1);
    this.msgText.setText(m.pointMsg);
  } else {
    this.msgText.setAlpha(0);
  }
};

var config = {
  type: Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#101923',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1280, height: 720 },
  physics: { default: 'none' },
  scene: [BootScene, MenuScene, MatchScene]
};
window.addEventListener('load', function(){
  window.game = new Phaser.Game(config);
});
})();
</script>
