<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Duel — The Arcade</title>
<style>
  html, body { margin:0; padding:0; background:#0e0e0e; overflow:hidden; height:100%; }
  #game-container { width:100vw; height:100vh; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   TANK DUEL — v1
   Top-down 1v1 tank arena vs AI. Core hook: every shell that hits terrain
   carves a permanent crater — the arena you started in is not the arena
   you finish in. One shell in flight at a time (reload between shots), one
   hit destroys a tank and wins the round. Best of 3 rounds wins the match.
   Bounce/Breaker shell types and a shrinking late-round zone are deferred
   to v2, per the design brief's own advice to prototype the core hook first.
   ========================================================================= */

const W = 960, H = 540;
const CELL = 30;
const COLS = W / CELL, ROWS = H / CELL;
const TANK_R = 14;
const SHELL_R = 5;
const SHELL_SPEED = 480;
const RELOAD_MS = 1300;
const CARVE_RADIUS = 58;
const ROUNDS_TO_WIN = 2;
const ROUND_TIME = 40;

const DIFFICULTIES = {
  easy:   { label: 'EASY',   aimJitter: 0.22, fireMin: 1.7, fireMax: 2.9, retarget: [1.9, 3.3], moveSpeed: 95,  lead: 0 },
  normal: { label: 'NORMAL', aimJitter: 0.06, fireMin: 0.9, fireMax: 1.8, retarget: [1.4, 2.6], moveSpeed: 120, lead: 0 },
  hard:   { label: 'HARD',   aimJitter: 0.02, fireMin: 0.5, fireMax: 1.0, retarget: [1.0, 1.8], moveSpeed: 148, lead: 0.16 },
};

function cellIndex(px, py) { return { c: Math.floor(px / CELL), r: Math.floor(py / CELL) }; }

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#12100e');
    this.state = 'ready';
    this.grid = [];
    this.shells = [];
    this.g = this.add.graphics();
    this.fxGraphics = this.add.graphics();

    this.playerWins = 0;
    this.aiWins = 0;
    this.difficulty = 'normal';

    this.buildHUD();
    this.setupInput();
    this.buildDifficultyMenu();
    this.showMenu();
    this.centerText.setText('TANK DUEL').setVisible(true);
    this.subText.setText('WASD to move \u00b7 mouse to aim \u00b7 click to fire \u00b7 choose a difficulty').setVisible(true);
  }

  buildDifficultyMenu() {
    this.diffButtons = [];
    const keys = ['easy', 'normal', 'hard'];
    keys.forEach((key, i) => {
      const x = W/2 + (i - 1) * 170;
      const y = H/2 + 40;
      const btn = this.add.text(x, y, DIFFICULTIES[key].label, {
        fontFamily: 'Arial Black, Arial', fontSize: '18px', color: '#e8ecf1'
      }).setOrigin(0.5).setPadding(18, 12, 18, 12).setBackgroundColor('#1c2128')
        .setInteractive({ useHandCursor: true });
      btn.on('pointerover', () => btn.setBackgroundColor('#262c34'));
      btn.on('pointerout', () => btn.setBackgroundColor('#1c2128'));
      btn.on('pointerdown', () => {
        if (this.state !== 'ready') return;
        this.difficulty = key;
        if (window.SFX) SFX.select();
        this.hideMenu();
        this.state = 'transitioning'; // blocks the scene-wide fire handler for this same click event
        this.time.delayedCall(0, () => this.startMatch());
      });
      this.diffButtons.push(btn);
    });
  }

  showMenu() {
    this.state = 'ready';
    this.diffButtons.forEach(b => b.setVisible(true));
  }

  hideMenu() {
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.diffButtons.forEach(b => b.setVisible(false));
  }

  // ---------------------------------------------------------------------
  buildHUD() {
    this.roundText = this.add.text(W/2, 14, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1'
    }).setOrigin(0.5, 0);

    this.timerText = this.add.text(W/2, 36, '', {
      fontFamily: 'Arial', fontSize: '13px', color: '#7f8a9a'
    }).setOrigin(0.5, 0);

    this.reloadBarBg = this.add.rectangle(70, 20, 100, 10, 0x2a2118).setStrokeStyle(1, 0x000000);
    this.reloadBar = this.add.rectangle(70 - 49, 20, 98, 8, 0x5be37b).setOrigin(0, 0.5);
    this.reloadLabel = this.add.text(20, 8, 'YOU', { fontFamily: 'Arial Black, Arial', fontSize: '11px', color: '#7f8a9a' });

    this.aiReloadBarBg = this.add.rectangle(W - 70, 20, 100, 10, 0x2a2118).setStrokeStyle(1, 0x000000);
    this.aiReloadBar = this.add.rectangle(W - 70 - 49, 20, 98, 8, 0xff5a5a).setOrigin(0, 0.5);
    this.aiReloadLabel = this.add.text(W - 60, 8, 'AI', { fontFamily: 'Arial Black, Arial', fontSize: '11px', color: '#7f8a9a' });

    this.toastText = this.add.text(W/2, H/2 - 80, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '26px', color: '#ffd23f'
    }).setOrigin(0.5).setAlpha(0);

    this.centerText = this.add.text(W/2, H/2, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '34px', color: '#f0e6d2', align: 'center'
    }).setOrigin(0.5).setShadow(0, 2, '#000', 6, true, true).setVisible(false);
    this.subText = this.add.text(W/2, H/2 + 50, '', {
      fontFamily: 'Arial', fontSize: '14px', color: '#a08860', align: 'center', wordWrap: { width: 520 }
    }).setOrigin(0.5).setVisible(false);
  }

  toast(msg, color) {
    this.toastText.setText(msg).setColor(color).setAlpha(1).setScale(0.85);
    this.tweens.add({ targets: this.toastText, alpha: 0, scale: 1.1, duration: 900, delay: 500 });
  }

  // ---------------------------------------------------------------------
  setupInput() {
    this.keys = this.input.keyboard.addKeys({ w: 'W', a: 'A', s: 'S', d: 'D' });
    this.pointerWorld = { x: W * 0.75, y: H / 2 };

    // aim tracking — skip while a touch pointer is actively driving the
    // left-side movement joystick, so it doesn't yank the aim around too.
    // Mouse input always aims/fires regardless of which half of the screen
    // it's on, since desktop movement is WASD, not a joystick.
    this.input.on('pointermove', p => {
      if (p.wasTouch && this.joystick && this.joystick.active && p.id === this.joystick.id) return;
      this.pointerWorld.x = p.x; this.pointerWorld.y = p.y;
    });

    this.input.on('pointerdown', p => {
      if (this.state !== 'playing') return;
      if (p.wasTouch && p.x < W / 2) {
        this.joystick = { active: true, originX: p.x, originY: p.y, dx: 0, dy: 0, id: p.id };
      } else {
        this.pointerWorld.x = p.x; this.pointerWorld.y = p.y;
        this.tryPlayerFire();
      }
    });
    this.input.on('pointermove', p => {
      if (this.joystick && this.joystick.active && p.id === this.joystick.id) {
        this.joystick.dx = Phaser.Math.Clamp(p.x - this.joystick.originX, -40, 40);
        this.joystick.dy = Phaser.Math.Clamp(p.y - this.joystick.originY, -40, 40);
      }
    });
    this.input.on('pointerup', p => {
      if (this.joystick && p.id === this.joystick.id) this.joystick.active = false;
    });
  }

  // ---------------------------------------------------------------------
  startMatch() {
    this.playerWins = 0;
    this.aiWins = 0;
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.startRound();
  }

  startRound() {
    this.state = 'playing';
    this.buildArena();
    this.player = { x: CELL * 3.5, y: H / 2, angle: 0, alive: true, reload: 0, vx: 0, vy: 0 };
    this.ai = { x: W - CELL * 3.5, y: H / 2, angle: Math.PI, alive: true, reload: 0,
      target: { x: W - CELL * 3.5, y: H / 2 }, retargetIn: 0, fireGate: Phaser.Math.FloatBetween(0.3, 1.2) };
    this.shells = [];
    this.roundTime = ROUND_TIME;
    this.roundText.setText(`${DIFFICULTIES[this.difficulty].label}  \u00b7  YOU ${this.playerWins}  \u2014  AI ${this.aiWins}`);
    this.drawArena();
  }

  // ---------------------------------------------------------------------
  buildArena() {
    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        row.push(r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1);
      }
      grid.push(row);
    }
    // symmetric central wall, mirrored so neither side starts with an advantage
    const midRow = Math.floor(ROWS / 2);
    for (let c = 10; c <= 21; c++) grid[midRow][c] = true;
    // a couple of small symmetric cover blocks
    [[6, 4], [6, 5], [ROWS - 8, COLS - 6], [ROWS - 8, COLS - 5]].forEach(([r, c]) => { grid[r][c] = true; });
    [[ROWS - 7, 4], [ROWS - 7, 5], [7, COLS - 6], [7, COLS - 5]].forEach(([r, c]) => { grid[r][c] = true; });
    this.grid = grid;
  }

  isSolid(c, r) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
    return this.grid[r][c];
  }

  drawArena() {
    const g = this.g;
    g.clear();
    g.fillStyle(0x1c1814, 1);
    g.fillRect(0, 0, W, H);
    g.fillStyle(0x4a3a2a, 1);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.grid[r][c]) g.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
    g.lineStyle(1, 0x2a2118, 0.5);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.grid[r][c]) g.strokeRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
  }

  // ---------------------------------------------------------------------
  tryPlayerFire() {
    if (this.state !== 'playing' || !this.player.alive || this.player.reload > 0) return;
    const angle = Math.atan2(this.pointerWorld.y - this.player.y, this.pointerWorld.x - this.player.x);
    this.fireShell(this.player, angle, 'player');
  }

  fireShell(owner, angle, side) {
    owner.reload = RELOAD_MS;
    const spawnDist = TANK_R + 8;
    this.shells.push({
      x: owner.x + Math.cos(angle) * spawnDist,
      y: owner.y + Math.sin(angle) * spawnDist,
      vx: Math.cos(angle) * SHELL_SPEED,
      vy: Math.sin(angle) * SHELL_SPEED,
      side
    });
    if (window.SFX) SFX.shoot();
  }

  // ---------------------------------------------------------------------
  hasLineOfSight(x0, y0, x1, y1) {
    const dist = Phaser.Math.Distance.Between(x0, y0, x1, y1);
    const steps = Math.ceil(dist / (CELL * 0.6));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const { c, r } = cellIndex(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
      if (this.isSolid(c, r)) return false;
    }
    return true;
  }

  updateAI(dt) {
    const ai = this.ai;
    if (!ai.alive) return;
    const diff = DIFFICULTIES[this.difficulty];

    // movement — wander toward open waypoints, occasionally biasing toward/away from the player
    ai.retargetIn -= dt;
    if (ai.retargetIn <= 0) {
      ai.retargetIn = Phaser.Math.FloatBetween(diff.retarget[0], diff.retarget[1]);
      let tries = 0, c, r;
      do {
        c = Phaser.Math.Between(2, COLS - 3);
        r = Phaser.Math.Between(2, ROWS - 3);
        tries++;
      } while (this.isSolid(c, r) && tries < 20);
      ai.target = { x: c * CELL + CELL / 2, y: r * CELL + CELL / 2 };
    }
    const dx = ai.target.x - ai.x, dy = ai.target.y - ai.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 6) {
      const mv = diff.moveSpeed * dt;
      this.moveTank(ai, (dx / dist) * mv, (dy / dist) * mv);
    }

    // aim — lead the player based on their current velocity (Hard only), with
    // human-ish inaccuracy that shrinks as difficulty rises
    if (this.player.alive) {
      const aimX = this.player.x + (this.player.vx || 0) * diff.lead;
      const aimY = this.player.y + (this.player.vy || 0) * diff.lead;
      const targetAngle = Math.atan2(aimY - ai.y, aimX - ai.x);
      ai.angle = targetAngle + Phaser.Math.FloatBetween(-diff.aimJitter * 0.5, diff.aimJitter * 0.5);

      ai.fireGate -= dt;
      if (ai.reload <= 0 && ai.fireGate <= 0) {
        if (this.hasLineOfSight(ai.x, ai.y, this.player.x, this.player.y)) {
          this.fireShell(ai, ai.angle + Phaser.Math.FloatBetween(-diff.aimJitter, diff.aimJitter), 'ai');
          ai.fireGate = Phaser.Math.FloatBetween(diff.fireMin, diff.fireMax);
        } else {
          ai.fireGate = 0.3;
        }
      }
    }
  }

  moveTank(tank, dx, dy) {
    // axis-separated so sliding along a wall still works
    const tryMove = (nx, ny) => {
      const corners = [
        [nx - TANK_R, ny - TANK_R], [nx + TANK_R, ny - TANK_R],
        [nx - TANK_R, ny + TANK_R], [nx + TANK_R, ny + TANK_R]
      ];
      return !corners.some(([px, py]) => { const { c, r } = cellIndex(px, py); return this.isSolid(c, r); });
    };
    if (tryMove(tank.x + dx, tank.y)) tank.x += dx;
    if (tryMove(tank.x, tank.y + dy)) tank.y += dy;
  }

  // ---------------------------------------------------------------------
  carveTerrain(px, py) {
    const { c: cc, r: cr } = cellIndex(px, py);
    const span = Math.ceil(CARVE_RADIUS / CELL) + 1;
    for (let r = cr - span; r <= cr + span; r++) {
      for (let c = cc - span; c <= cc + span; c++) {
        if (r <= 0 || r >= ROWS - 1 || c <= 0 || c >= COLS - 1) continue; // keep the border sealed
        const dx = (c * CELL + CELL / 2) - px, dy = (r * CELL + CELL / 2) - py;
        if (Math.sqrt(dx * dx + dy * dy) <= CARVE_RADIUS) this.grid[r][c] = false;
      }
    }
    this.drawArena();
  }

  explode(x, y, big) {
    const flashR = big ? 26 : 14;
    const flash = this.add.circle(x, y, flashR, 0xfff2c9, 0.95);
    this.tweens.add({ targets: flash, alpha: 0, scale: 1.6, duration: 140, onComplete: () => flash.destroy() });

    const ring = this.add.circle(x, y, 6, 0xffd23f, 0.5).setStrokeStyle(2, 0xff8a3d);
    this.tweens.add({
      targets: ring, radius: big ? CARVE_RADIUS * 1.2 : CARVE_RADIUS, alpha: 0, duration: big ? 380 : 260,
      onUpdate: () => ring.setStrokeStyle(2, 0xff8a3d, ring.alpha), onComplete: () => ring.destroy()
    });

    // debris — a handful of small chunks flung outward and settling
    const debrisCount = big ? 10 : 6;
    for (let i = 0; i < debrisCount; i++) {
      const a = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const dist = Phaser.Math.FloatBetween(20, big ? 55 : 36);
      const chunk = this.add.rectangle(x, y, Phaser.Math.Between(3, 6), Phaser.Math.Between(3, 6), 0x8a6a4a);
      this.tweens.add({
        targets: chunk, x: x + Math.cos(a) * dist, y: y + Math.sin(a) * dist,
        rotation: Phaser.Math.FloatBetween(-3, 3), alpha: 0, duration: Phaser.Math.Between(300, 500),
        ease: 'Cubic.Out', onComplete: () => chunk.destroy()
      });
    }

    this.cameras.main.shake(big ? 220 : 110, big ? 0.012 : 0.006);
    if (window.SFX) SFX.explosion();
  }

  updateShells(dt) {
    for (let i = this.shells.length - 1; i >= 0; i--) {
      const s = this.shells[i];
      s.x += s.vx * dt; s.y += s.vy * dt;

      if (s.x < 0 || s.x > W || s.y < 0 || s.y > H) { this.shells.splice(i, 1); continue; }

      const { c, r } = cellIndex(s.x, s.y);
      if (this.isSolid(c, r)) {
        this.explode(s.x, s.y);
        this.carveTerrain(s.x, s.y);
        this.shells.splice(i, 1);
        continue;
      }

      const target = s.side === 'player' ? this.ai : this.player;
      if (target.alive) {
        const d = Phaser.Math.Distance.Between(s.x, s.y, target.x, target.y);
        if (d < TANK_R + SHELL_R) {
          this.explode(s.x, s.y, true);
          this.carveTerrain(s.x, s.y);
          this.shells.splice(i, 1);
          this.killTank(target, s.side);
        }
      }
    }
  }

  killTank(tank, killerSide) {
    tank.alive = false;
    if (killerSide === 'player') {
      this.playerWins++;
      this.toast('ROUND WIN!', '#5be37b');
      if (window.SFX) SFX.success();
    } else {
      this.aiWins++;
      this.toast('AI WINS THE ROUND', '#ff5a5a');
      if (window.SFX) SFX.fail();
    }
    this.roundText.setText(`${DIFFICULTIES[this.difficulty].label}  \u00b7  YOU ${this.playerWins}  \u2014  AI ${this.aiWins}`);

    if (this.playerWins >= ROUNDS_TO_WIN || this.aiWins >= ROUNDS_TO_WIN) {
      this.state = 'matchEnd';
      this.time.delayedCall(1300, () => this.endMatch());
    } else {
      this.state = 'roundEnd';
      this.time.delayedCall(1300, () => this.startRound());
    }
  }

  endMatch() {
    const won = this.playerWins > this.aiWins;
    this.showMenu();
    this.centerText.setText((won ? 'MATCH WON!' : 'MATCH LOST') + '\n\nTANK DUEL').setVisible(true);
    this.subText.setText(
      `Final (${DIFFICULTIES[this.difficulty].label}): You ${this.playerWins} \u2014 AI ${this.aiWins}  \u00b7  choose a difficulty to play again`
    ).setVisible(true);
  }

  // ---------------------------------------------------------------------
  update(time, delta) {
    if (this.state !== 'playing') { this.draw(); return; }
    const dt = delta / 1000;

    if (this.player.reload > 0) this.player.reload -= delta;
    if (this.ai.reload > 0) this.ai.reload -= delta;
    this.reloadBar.width = 98 * (1 - Phaser.Math.Clamp(this.player.reload / RELOAD_MS, 0, 1));
    this.aiReloadBar.width = 98 * (1 - Phaser.Math.Clamp(this.ai.reload / RELOAD_MS, 0, 1));

    // player movement
    let mx = 0, my = 0;
    if (this.joystick && this.joystick.active) {
      mx = this.joystick.dx / 40; my = this.joystick.dy / 40;
    } else {
      if (this.keys.a.isDown) mx -= 1;
      if (this.keys.d.isDown) mx += 1;
      if (this.keys.w.isDown) my -= 1;
      if (this.keys.s.isDown) my += 1;
    }
    const mag = Math.sqrt(mx * mx + my * my);
    if (mag > 0.05) {
      const speed = 160 * dt;
      const beforeX = this.player.x, beforeY = this.player.y;
      this.moveTank(this.player, (mx / Math.max(mag, 1)) * speed, (my / Math.max(mag, 1)) * speed);
      this.player.vx = (this.player.x - beforeX) / dt;
      this.player.vy = (this.player.y - beforeY) / dt;
    } else {
      this.player.vx = 0; this.player.vy = 0;
    }
    this.player.angle = Math.atan2(this.pointerWorld.y - this.player.y, this.pointerWorld.x - this.player.x);

    this.updateAI(dt);
    this.updateShells(dt);

    this.roundTime -= dt;
    if (this.roundTime <= 0) {
      this.roundTime = 0;
      this.state = 'roundEnd';
      this.toast('TIME UP \u2014 DRAW', '#7f8a9a');
      this.time.delayedCall(1000, () => this.startRound());
    }
    this.timerText.setText(Math.ceil(this.roundTime) + 's');

    this.draw();
  }

  drawTank(g, t, bodyCol, trackCol) {
    if (!t || !t.alive) return;
    const cos = Math.cos(t.angle), sin = Math.sin(t.angle);
    // body oriented along the aim direction, with tracks on either flank
    const hw = TANK_R + 4, hh = TANK_R - 3;
    const corner = (lx, ly) => ({ x: t.x + lx * cos - ly * sin, y: t.y + lx * sin + ly * cos });
    const bodyPts = [corner(-hw, -hh), corner(hw, -hh), corner(hw, hh), corner(-hw, hh)];
    g.fillStyle(bodyCol, 1);
    g.beginPath();
    g.moveTo(bodyPts[0].x, bodyPts[0].y);
    bodyPts.slice(1).forEach(p => g.lineTo(p.x, p.y));
    g.closePath();
    g.fillPath();
    g.lineStyle(2, 0x111111, 0.7);
    g.strokePath();

    // tracks — two dark bars along the sides, perpendicular to the aim direction
    [-1, 1].forEach(side => {
      const p1 = corner(-hw, (hh + 5) * side);
      const p2 = corner(hw, (hh + 5) * side);
      g.lineStyle(5, trackCol, 1);
      g.lineBetween(p1.x, p1.y, p2.x, p2.y);
    });

    // turret + barrel
    g.fillStyle(bodyCol, 1);
    g.fillCircle(t.x, t.y, TANK_R * 0.62);
    g.lineStyle(2, 0x111111, 0.7);
    g.strokeCircle(t.x, t.y, TANK_R * 0.62);
    g.lineStyle(5, 0x2a2a2a, 1);
    g.lineBetween(t.x, t.y, t.x + cos * (TANK_R + 14), t.y + sin * (TANK_R + 14));
  }

  draw() {
    const g = this.fxGraphics;
    g.clear();

    this.drawTank(g, this.player, 0x5be37b, 0x2f5a3a);
    this.drawTank(g, this.ai, 0xff5a5a, 0x7a2f2f);

    // shell trails, then the shell itself on top
    (this.shells || []).forEach(s => {
      if (!s.trail) s.trail = [];
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 8) s.trail.shift();
      s.trail.forEach((p, i) => {
        g.fillStyle(0xffb15a, (i / s.trail.length) * 0.5);
        g.fillCircle(p.x, p.y, SHELL_R * (i / s.trail.length));
      });
      g.fillStyle(0xffe08a, 1);
      g.fillCircle(s.x, s.y, SHELL_R);
    });
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#12100e',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  input: { activePointers: 2 },

new Phaser.Game(config);
