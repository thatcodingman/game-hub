  setRoundOverVisible(visible) {
    this.roundOverButtons.forEach(o => o.setVisible(visible));
  }

  // called after any damage lands — checks the fighter that was JUST hit;
  // winner is whoever's still standing
  checkKO(defender, attacker) {
    if (this.state !== 'playing') return;
    if (defender.health <= 0) {
      defender.health = 0;
      this.state = 'roundOver';

      // "games played" counts completed matches, not abandoned ones — and
      // incrementing here (not at match start) means we can tell whether
      // THIS match's completion is exactly what crossed a new threshold
      this.gamesPlayed++;
      saveGamesPlayed(this.gamesPlayed);
      const newlyUnlocked = CHARACTER_ORDER.find(k => CHARACTER_DEFS[k].unlockAt === this.gamesPlayed);

      const isP1Winner = attacker === this.p1;
      const winnerLabel = this.mode === 'ai'
        ? (isP1Winner ? 'YOU WIN' : 'AI WINS')
        : (isP1Winner ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS');
      this.centerText.setText('KO!').setVisible(true);
      let sub = `${winnerLabel}\n${attacker.character.name} (${attacker.character.archetype})`;
      if (newlyUnlocked) {
        sub += `\n\n${CHARACTER_DEFS[newlyUnlocked].name.toUpperCase()} UNLOCKED!`;
      }
      this.subText.setText(sub).setVisible(true);
      this.setRoundOverVisible(true);
      if (window.SFX) SFX.success();
      if (newlyUnlocked) { if (window.SFX) SFX.powerup(); vibrate([20, 40, 20, 40, 30]); }
    }
  }

  beginSelect(mode) {
    this.mode = mode;
    this.rosterBrowseOnly = false;
    this.menuButtons.forEach(o => o.setVisible(false));
    if (mode === 'ai') {
      this.beginDifficultySelect();
    } else {
      this.enterCharacterSelect();
    }
  }

  beginDifficultySelect() {
    this.state = 'difficulty';
    this.centerText.setText('SELECT DIFFICULTY').setVisible(true);
    this.subText.setText('how tough should the AI play?').setVisible(true);
    this.setDifficultyVisible(true);
  }

  onDifficultyPicked(key) {
    this.difficulty = key;
    saveDifficulty(key);
    this.setDifficultyVisible(false);
    this.enterCharacterSelect();
  }

  enterCharacterSelect() {
    this.state = 'select';
    this.selectingFor = 'p1';
    this.centerText.setText('CHOOSE YOUR FIGHTER').setVisible(true);
    this.subText.setText('PLAYER 1 \u2014 pick a fighter').setVisible(true);
    this.refreshCharacterButtons();
    this.setSelectVisible(true);
  }

  // standalone "view the roster" — reachable from the main menu without
  // starting a match, so checking unlock progress doesn't require
  // committing to VS AI / VS PLAYER 2 first
  beginRoster() {
    this.state = 'roster';
    this.rosterBrowseOnly = true;
    this.menuButtons.forEach(o => o.setVisible(false));
    this.centerText.setText('FIGHTERS').setVisible(true);
    this.subText.setText(`${this.gamesPlayed} game${this.gamesPlayed === 1 ? '' : 's'} played \u2014 win matches to unlock more`).setVisible(true);
    this.refreshCharacterButtons();
    this.setSelectVisible(true);
  }

  onCharacterPicked(key) {
    if (this.rosterBrowseOnly) return; // just browsing — clicking a card doesn't do anything
    if (!isUnlocked(key, this.gamesPlayed)) {
      this.cameras.main.shake(60, 0.004); // a small "nope" instead of silently doing nothing
      return;
    }
    if (this.selectingFor === 'p1') {
      this.p1CharacterKey = key;
      if (this.mode === '2p') {
        this.selectingFor = 'p2';
        this.subText.setText('PLAYER 2 \u2014 pick a fighter');
        this.refreshCharacterButtons();
        return;
      }
      // VS AI — the AI picks from whoever's left, so it's never a mirror match
      const remaining = CHARACTER_ORDER.filter(k => k !== key);
      this.p2CharacterKey = remaining[Math.floor(Math.random() * remaining.length)];
    } else {
      this.p2CharacterKey = key;
    }
    this.setSelectVisible(false);
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.startMatch(this.mode);
  }

  buildControls() {
    this.touchState = {};
    // P1 — bottom-left: dpad on the outside edge with DODGE nested in its
    // empty center (no jump button — double-tap up jumps instead), punch/
    // kick/block/grapple toward center
    this.p1Controls = this.buildControlCluster({ dpadX: 100, punchX: 192, kickX: 250, blockX: 308, grappleX: 366, hint: '\u2190\u2191\u2192\u2193 + 1 punch + 2 kick + 3 block\nQ dodge + W grapple + dbl-tap \u2191 jump', key: 'p1' });
    // P2 — bottom-right, mirrored
    this.p2Controls = this.buildControlCluster({ dpadX: W - 100, punchX: W - 192, kickX: W - 250, blockX: W - 308, grappleX: W - 366, hint: '\u2190\u2191\u2192\u2193 + . punch + , kick + ; block\n\' dodge + ENTER grapple + dbl-tap \u2191 jump', key: 'p2' });
  }

  buildControlCluster({ dpadX, punchX, kickX, blockX, grappleX, hint, key }) {
    const dpadY = H - 74, btn = 32, gap = 4;
    this.touchState[key] = { up: false, down: false, left: false, right: false, punchPressed: false, kickPressed: false, blockHeld: false, dodgePressed: false, grapplePressed: false };

    const mkBtn = (x, y, label, size, strokeColor) => {
      const bg = this.add.rectangle(x, y, size, size, 0x14161c, 0.9).setStrokeStyle(2, strokeColor || 0x4fd1ff, 0.6);
      const t = this.add.text(x, y, label, { fontFamily: 'Arial Black, Arial', fontSize: size > 44 ? '12px' : '13px', color: '#e8ecf1' }).setOrigin(0.5);
      return { bg, t };
    };
    const up = mkBtn(dpadX, dpadY - btn - gap, '\u25b2', btn);
    const down = mkBtn(dpadX, dpadY + btn + gap, '\u25bc', btn);
    const left = mkBtn(dpadX - btn - gap, dpadY, '\u25c0', btn);
    const right = mkBtn(dpadX + btn + gap, dpadY, '\u25b6', btn);
    // DODGE nested in the dpad's own empty center — no extra horizontal
    // space needed, and it's exactly where a thumb already rests
    const dodge = mkBtn(dpadX, dpadY, 'DASH', 38, 0xffd23f);
    const punch = mkBtn(punchX, dpadY, 'PUNCH', 42, 0xff8a3d);
    const kick = mkBtn(kickX, dpadY, 'KICK', 42, 0x5be37b);
    const block = mkBtn(blockX, dpadY, 'BLOCK', 42, 0xb0b8c4);
    const grapple = mkBtn(grappleX, dpadY, 'GRAB', 42, 0xba7dff);
    const hintText = this.add.text((dpadX + grappleX) / 2, dpadY - btn * 2 - gap * 2 - 26, hint, {
      fontFamily: 'Arial', fontSize: '10px', color: '#555a66', align: 'center'
    }).setOrigin(0.5);

    const bindHold = (obj, field) => {
      obj.bg.setInteractive({ useHandCursor: true });
      obj.bg.on('pointerdown', () => { this.touchState[key][field] = true; obj.bg.setFillStyle(0x22262f, 0.95); });
      obj.bg.on('pointerup', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
      obj.bg.on('pointerout', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
    };
    bindHold(up, 'up');
    bindHold(down, 'down');
    bindHold(left, 'left');
    bindHold(right, 'right');
    bindHold(block, 'blockHeld'); // block is held, not single-press, same as the dpad — matches "hands go up while held" rather than a one-shot action
    dodge.bg.setInteractive({ useHandCursor: true });
    dodge.bg.on('pointerdown', () => {
      this.touchState[key].dodgePressed = true;
      dodge.bg.setFillStyle(0x4a3c14, 0.95);
      this.time.delayedCall(90, () => dodge.bg.setFillStyle(0x14161c, 0.9));
    });
    punch.bg.setInteractive({ useHandCursor: true });
    punch.bg.on('pointerdown', () => {
      this.touchState[key].punchPressed = true;
      punch.bg.setFillStyle(0x3a2416, 0.95);
      this.time.delayedCall(90, () => punch.bg.setFillStyle(0x14161c, 0.9));
    });
    kick.bg.setInteractive({ useHandCursor: true });
    kick.bg.on('pointerdown', () => {
      this.touchState[key].kickPressed = true;
      kick.bg.setFillStyle(0x1f3a28, 0.95);
      this.time.delayedCall(90, () => kick.bg.setFillStyle(0x14161c, 0.9));
    });
    grapple.bg.setInteractive({ useHandCursor: true });
    grapple.bg.on('pointerdown', () => {
      this.touchState[key].grapplePressed = true;
      grapple.bg.setFillStyle(0x352a4a, 0.95);
      this.time.delayedCall(90, () => grapple.bg.setFillStyle(0x14161c, 0.9));
    });

    return { objects: [up.bg, up.t, down.bg, down.t, left.bg, left.t, right.bg, right.t, dodge.bg, dodge.t, punch.bg, punch.t, kick.bg, kick.t, block.bg, block.t, grapple.bg, grapple.t, hintText], hintText };
  }

  setControlsVisible(cluster, visible) {
    cluster.objects.forEach(o => o.setVisible(visible));
  }

  startMatch(mode) {
    this.mode = mode;
    this.state = 'playing';
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.menuButtons.forEach(o => o.setVisible(false));
    this.setSelectVisible(false);
    this.setDifficultyVisible(false);
    this.setRoundOverVisible(false);

    this.modeText.setVisible(true).setText(mode === 'ai' ? '1P VS AI' : '2P LOCAL');
    this.p1Controls.hintText.setText(mode === 'ai'
      ? '\u2190\u2191\u2192\u2193 + 1 punch + 2 kick + 3 block\nQ dodge + W grapple + dbl-tap \u2191 jump'
      : 'WASD + F punch + G kick + E block\nR dodge + T grapple + dbl-tap W jump');
    this.menuBtn.setVisible(true);

    this.setControlsVisible(this.p1Controls, true);
    this.setControlsVisible(this.p2Controls, mode === '2p');

    this.p1 = makeFighter(-90, 20, this.p1CharacterKey, 1);
    this.p2 = makeFighter(90, -20, this.p2CharacterKey, -1);
    this.aiJumpCooldown = Phaser.Math.FloatBetween(1, 2.5);
    this.aiCircleTimer = 0;
    this.aiWillBlock = false;
    this.aiPrevP1AttackState = 'idle';
    this.clinchActive = false;
    this.clinchTimer = 0;
    this.groundActive = false;
    this.groundTimer = 0;
    this.groundStrikeCooldown = 0;
    this.groundBottomStrikeCooldown = 0;
    this.groundEscapeProgress = 0;

    this.p1NameText.setText(this.p1.character.name.toUpperCase()).setVisible(true);
    this.p2NameText.setText(this.p2.character.name.toUpperCase()).setVisible(true);
    this.p1HealthBg.setVisible(true);
    this.p1HealthFill.setVisible(true).width = 220;
    this.p2HealthBg.setVisible(true);
    this.p2HealthFill.setVisible(true).width = 220;

    if (window.SFX) SFX.select();
  }

  updateHealthBar(fill, f) {
    const pct = Phaser.Math.Clamp(f.health / f.maxHealth, 0, 1);
    fill.width = 220 * pct;
    fill.setFillStyle(pct > 0.5 ? 0x5be37b : pct > 0.25 ? 0xffd23f : 0xff5a5a);
  }

  returnToMenu() {
    this.state = 'menu';
    this.mode = null;
    this.rosterBrowseOnly = false;
    this.modeText.setVisible(false);
    this.menuBtn.setVisible(false);
    this.setControlsVisible(this.p1Controls, false);
    this.setControlsVisible(this.p2Controls, false);
    this.setSelectVisible(false);
    this.setDifficultyVisible(false);
    this.setRoundOverVisible(false);
    this.p1NameText.setVisible(false);
    this.p2NameText.setVisible(false);
    this.p1HealthBg.setVisible(false);
    this.p1HealthFill.setVisible(false);
    this.p2HealthBg.setVisible(false);
    this.p2HealthFill.setVisible(false);
    this.centerText.setText('LAST FIST').setVisible(true);
    this.subText.setText('Pick a fighter \u2014 punch, kick, jump attack, block, dodge, grapple\nclose the distance and make something happen.').setVisible(true);
    this.menuButtons.forEach(o => o.setVisible(true));
  }

  // shared kinematics for both fighters and the AI — same rules for everyone.
  // mx/mz is a movement vector with magnitude <= 1 (already normalized by
  // axisMoveVector for the player, or directly by aiInput for the AI).
  stepFighter(f, mx, mz, jumpPressed, dt) {
    const grounded = f.grounded;
    const speedMult = f.character.speedMult;
    const accel = (grounded ? MOVE_ACCEL : MOVE_ACCEL * AIR_CONTROL_MULT) * speedMult;
    const friction = (grounded ? GROUND_FRICTION : GROUND_FRICTION * AIR_CONTROL_MULT) * dt * speedMult;
    const maxSpeed = MOVE_MAX_SPEED * speedMult;

    if (mx !== 0 || mz !== 0) {
      f.vax += mx * accel * dt;
      f.vaz += mz * accel * dt;
    } else {
      f.vax = approachZero(f.vax, friction);
      f.vaz = approachZero(f.vaz, friction);
    }

    const speed = Math.hypot(f.vax, f.vaz);
    if (speed > maxSpeed) { const s = maxSpeed / speed; f.vax *= s; f.vaz *= s; }

    f.ax += f.vax * dt;
    f.az += f.vaz * dt;
    const clamped = clampToArena(f.ax, f.az);
    f.ax = clamped.ax; f.az = clamped.az;

    if (jumpPressed && f.grounded) {
      f.vJump = JUMP_VELOCITY * f.character.jumpVelocityMult;
      f.grounded = false;
      if (window.SFX) SFX.jump();
    }
    f.vJump += GRAVITY * dt;
    f.jumpZ += f.vJump * dt;
    if (f.jumpZ >= 0) {
      const wasAirborne = !f.grounded;
      f.jumpZ = 0;
      f.vJump = 0;
      f.grounded = true;
      if (wasAirborne) { f.squash = 1; vibrate(6); }
    }

    if (f.grounded && speed > 20) f.walkBob += dt * 14;
    f.squash = Math.max(0, f.squash - dt * 4);
    f.dodgeCooldown = Math.max(0, f.dodgeCooldown - dt * 1000);
    f.hitFlash = Math.max(0, f.hitFlash - dt * 5);
  }

  // approach if too far, back off if too close, and — in the comfortable
  // band — circle around the player using the perpendicular direction, so
  // the AI actually orbits rather than just beelining. This is the whole
  // point of the 2D arena: it gives the AI somewhere to go that "left/right
  // only" never could.
  aiInput(dt) {
    const diff = DIFFICULTY_DEFS[this.difficulty];
    const dx = this.p1.ax - this.p2.ax, dz = this.p1.az - this.p2.az;
    const dist = Math.hypot(dx, dz) || 0.001;
    let moveX = 0, moveZ = 0, jump = false, punch = false, kick = false;

    this.aiCircleTimer -= dt;
    if (this.aiCircleTimer <= 0) {
      this.aiCircleDir = Math.random() < 0.5 ? 1 : -1;
      this.aiCircleTimer = Phaser.Math.FloatBetween(1.5, 3);
    }

    if (dist > diff.approachMax) {
      moveX = dx / dist; moveZ = dz / dist;
    } else if (dist < diff.approachMin) {
      moveX = -dx / dist; moveZ = -dz / dist;
    } else {
      const perpX = -dz / dist, perpZ = dx / dist;
      moveX = perpX * this.aiCircleDir;
      moveZ = perpZ * this.aiCircleDir;
    }

    // keep the AI from getting stuck fighting the arena boundary clamp —
    // if it's drifted past 80% of the arena radius (which can happen even
    // with a sane approach band, if the player themselves is near a wall),
    // blend its movement toward the center instead of whatever
    // approach/retreat/circle decided, ramping smoothly rather than
    // snapping so it doesn't look like a sudden change of mind
    const edgeFactor = Math.hypot(this.p2.ax / ARENA_RX, this.p2.az / ARENA_RZ);
    if (edgeFactor > 0.8) {
      const centerDist = Math.hypot(this.p2.ax, this.p2.az) || 0.001;
      const towardCenterX = -this.p2.ax / centerDist, towardCenterZ = -this.p2.az / centerDist;
      const pull = Phaser.Math.Clamp((edgeFactor - 0.8) / 0.2, 0, 1);
      moveX = Phaser.Math.Linear(moveX, towardCenterX, pull);
      moveZ = Phaser.Math.Linear(moveZ, towardCenterZ, pull);
    }

    this.aiJumpCooldown -= dt;
    if (this.p2.grounded && this.aiJumpCooldown <= 0 && Math.random() < diff.jumpChance * dt) {
      jump = true;
      this.aiJumpCooldown = Phaser.Math.FloatBetween(1.5, 3.5);
    }

    // punch when close (favored — faster, safer), kick when a bit farther
    // out (its longer reach is the whole point) — simple on purpose, this
    // stage is about proving both moves work, not making a smart fighter
    if (this.p2.attackState === 'idle') {
      if (dist <= PUNCH_RANGE && Math.random() < diff.punchChance * dt) {
        punch = true;
      } else if (dist <= KICK_RANGE && Math.random() < diff.kickChance * dt) {
        kick = true;
      }
    }

    // block reaction — decided ONCE per incoming attack (the instant it
    // enters windup), not re-rolled every frame, or it'd flicker on/off
    // instead of reading as a real decision
    if (this.p1.attackState === 'windup' && this.aiPrevP1AttackState !== 'windup') {
      this.aiWillBlock = Math.random() < diff.blockChance;
    }
    if (this.p1.attackState === 'idle') this.aiWillBlock = false;
    this.aiPrevP1AttackState = this.p1.attackState;
    const withinBlockRange = dist <= Math.max(PUNCH_RANGE, KICK_RANGE) + 30;
    const block = this.aiWillBlock && withinBlockRange && (this.p1.attackState === 'windup' || this.p1.attackState === 'active');

    let grapple = false;
    if (!this.clinchActive && this.p2.attackState === 'idle' && !block && dist <= GRAPPLE_RANGE * this.p2.character.grappleRangeMult && Math.random() < diff.grappleChance * dt) {
      grapple = true;
    }

    return { moveX, moveZ, jump, punch, kick, block, grapple };
  }

  separate() {
    const dx = this.p2.ax - this.p1.ax, dz = this.p2.az - this.p1.az;
    const dist = Math.hypot(dx, dz);
    if (dist < SEPARATION_MIN_DIST && dist > 0.001) {
      const push = (SEPARATION_MIN_DIST - dist) / 2;
      const ux = dx / dist, uz = dz / dist;
      this.p1.ax -= ux * push; this.p1.az -= uz * push;
      this.p2.ax += ux * push; this.p2.az += uz * push;
      Object.assign(this.p1, clampToArena(this.p1.ax, this.p1.az));
      Object.assign(this.p2, clampToArena(this.p2.ax, this.p2.az));
    }
  }

  // simple shapes only support a left/right flip, not true rotation, so
  // facing is still just "which side is the opponent on" — that reads fine
  // even with depth in the mix
  updateFacing() {
    const dx = this.p2.ax - this.p1.ax;
    if (Math.abs(dx) > 4) {
      this.p1.facing = dx > 0 ? 1 : -1;
      this.p2.facing = dx > 0 ? -1 : 1;
    }
  }

  // guard is a held stance, not a burst move like punch/kick — grounded and
  // not mid-attack to enter it, eases in/out over GUARD_TRANSITION_MS so
  // "hands go up" is an actual animation, not an instant pose swap
  updateGuard(f, blockHeld, dt) {
    const canGuard = blockHeld && f.grounded && f.attackState === 'idle';
    f.guarding = canGuard;
    const target = canGuard ? 1 : 0;
    const rate = 1000 / GUARD_TRANSITION_MS; // per-second rate to cross 0..1 in GUARD_TRANSITION_MS
    if (f.guardAmount < target) f.guardAmount = Math.min(target, f.guardAmount + rate * dt);
    else if (f.guardAmount > target) f.guardAmount = Math.max(target, f.guardAmount - rate * dt);
  }

  // eases each fighter toward a squashed "on the ground" pose while the
  // ground exchange is active, and back to standing when it ends — without
  // this, a takedown just locks two fully-standing figures together, which
  // reads as nothing happening
  updateGroundPose(f, dt) {
    const target = this.groundActive ? 1 : 0;
    const rate = 1000 / GROUND_POSE_TRANSITION_MS;
    if (f.groundPoseAmount < target) f.groundPoseAmount = Math.min(target, f.groundPoseAmount + rate * dt);
    else if (f.groundPoseAmount > target) f.groundPoseAmount = Math.max(target, f.groundPoseAmount - rate * dt);
  }

  // dashes in whatever direction is currently held, or straight back away
  // from the opponent if nothing's held. Position-driven (see stepDodge)
  // rather than a velocity impulse — a velocity burst would just get
  // clamped back down to normal speed the instant stepFighter ran, so the
  // burst is driven directly instead, bypassing that clamp entirely.
  tryStartDodge(f, opponent, dodgePressed, moveMx, moveMz) {
    if (!dodgePressed || f.dodgeCooldown > 0) return;
    if (!f.grounded || f.attackState !== 'idle' || f.guarding) return;

    let dirX = moveMx, dirZ = moveMz;
    const mag = Math.hypot(dirX, dirZ);
    if (mag < 0.1) {
      const dx = f.ax - opponent.ax, dz = f.az - opponent.az;
      const d = Math.hypot(dx, dz) || 0.001;
      dirX = dx / d; dirZ = dz / d;
    } else {
      dirX /= mag; dirZ /= mag;
    }

    f.dodging = true;
    f.dodgeTimer = 0;
    f.dodgeStartAx = f.ax;
    f.dodgeStartAz = f.az;
    f.dodgeDirX = dirX;
    f.dodgeDirZ = dirZ;
    f.dodgeCooldown = DODGE_COOLDOWN_MS;
    f.vax = 0; f.vaz = 0; // clear residual velocity so normal physics doesn't fight the burst once it ends
    if (window.SFX) SFX.swoosh();
    vibrate(15);
  }

  stepDodge(f, dt) {
    f.dodgeTimer += dt * 1000;
    const p = Phaser.Math.Clamp(f.dodgeTimer / DODGE_DURATION_MS, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3); // ease-out — fast start, settles at the end
    const dist = DODGE_DISTANCE * eased;
    const newAx = f.dodgeStartAx + f.dodgeDirX * dist;
    const newAz = f.dodgeStartAz + f.dodgeDirZ * dist;
    const clamped = clampToArena(newAx, newAz);
    f.ax = clamped.ax; f.az = clamped.az;
    if (p >= 1) f.dodging = false;
  }

  // GRAPPLE — gated, not automatic. Every one of these has to hold for the
  // clinch to actually start; otherwise the button press is a no-op, same
  // as trying to punch out of range.
  tryStartGrapple(attacker, defender, grapplePressed) {
    if (!grapplePressed || this.clinchActive) return;
    if (!attacker.grounded || attacker.attackState !== 'idle' || attacker.guarding || attacker.dodging) return;
    if (!defender.grounded || defender.guarding) return; // a guarding opponent resists the clinch

    const dist = Math.hypot(defender.ax - attacker.ax, defender.az - attacker.az);
    if (dist > GRAPPLE_RANGE * attacker.character.grappleRangeMult) return;

    this.clinchActive = true;
    this.clinchTimer = 0;

    const midX = (attacker.ax + defender.ax) / 2, midZ = (attacker.az + defender.az) / 2;
    const d = dist || 0.001;
    const ux = (defender.ax - attacker.ax) / d, uz = (defender.az - attacker.az) / d;
    const a1 = clampToArena(midX - ux * CLINCH_DISTANCE / 2, midZ - uz * CLINCH_DISTANCE / 2);
    const a2 = clampToArena(midX + ux * CLINCH_DISTANCE / 2, midZ + uz * CLINCH_DISTANCE / 2);
    attacker.ax = a1.ax; attacker.az = a1.az;
    defender.ax = a2.ax; defender.az = a2.az;
    attacker.vax = 0; attacker.vaz = 0;
    defender.vax = 0; defender.vaz = 0;

    if (window.SFX) SFX.click();
    vibrate(25);
    this.showClinchText(midX, midZ, 'CLINCH!', '#ba7dff');
  }

  // ticks the hold and releases it after CLINCH_DURATION_MS — the actual
  // ground-game decisions (break free early, take it to the ground, strike
  // from the clinch) are exactly the future-scope piece; this is just the
  // hold itself
  updateClinch(dt) {
    if (!this.clinchActive) return;
    this.clinchTimer += dt * 1000;
    if (this.clinchTimer >= CLINCH_DURATION_MS) {
      const midX = (this.p1.ax + this.p2.ax) / 2, midZ = (this.p1.az + this.p2.az) / 2;
      const dist = Math.hypot(this.p2.ax - this.p1.ax, this.p2.az - this.p1.az) || 0.001;
      const ux = (this.p2.ax - this.p1.ax) / dist, uz = (this.p2.az - this.p1.az) / dist;
      const a1 = clampToArena(midX - ux * CLINCH_BREAK_PUSH / 2, midZ - uz * CLINCH_BREAK_PUSH / 2);
      const a2 = clampToArena(midX + ux * CLINCH_BREAK_PUSH / 2, midZ + uz * CLINCH_BREAK_PUSH / 2);
      this.p1.ax = a1.ax; this.p1.az = a1.az;
      this.p2.ax = a2.ax; this.p2.az = a2.az;
      this.clinchActive = false;
      this.showClinchText(midX, midZ, 'BROKE FREE', '#7f8a9a');
    }
  }

  showClinchText(ax, az, msg, color) {
    const proj = project(ax, az);
    const scale = depthScale(az);
    const t = this.add.text(proj.sx, proj.sy - 100 * scale, msg, {
      fontFamily: 'Arial Black, Arial', fontSize: `${Math.round(18 * scale)}px`, color
    }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: t.y - 26, alpha: 0, duration: 500, onComplete: () => t.destroy() });
  }

  // TAKEDOWN — pressing GRAPPLE again while already clinched. First to
  // press wins it and becomes top position. Not a real wrestling exchange,
  // deliberately: "first to commit" is instantly understandable, which
  // matters more here than realism.
  tryTakedown(fighter, grapplePressed) {
    if (!this.clinchActive || this.groundActive || !grapplePressed) return;
    this.clinchActive = false;
    this.groundActive = true;
    this.groundTimer = 0;
    this.groundStrikeCooldown = 0;
    this.groundBottomStrikeCooldown = 0;
    this.groundEscapeProgress = 0;
    this.groundTopIsP1 = (fighter === this.p1);
    const midX = (this.p1.ax + this.p2.ax) / 2, midZ = (this.p1.az + this.p2.az) / 2;
    // a body actually hitting the ground should feel like an impact, not
    // just a state flag flipping — same shake/squash weight punch and
    // landing already get
    this.p1.squash = 1;
    this.p2.squash = 1;
    this.cameras.main.shake(140, 0.009);
    if (window.SFX) SFX.powerup();
    vibrate(30);
    this.showTakedownImpact(midX, midZ);
    this.showClinchText(midX, midZ, 'TAKEDOWN!', '#ffd23f');
  }

  // a one-shot expanding, fading ring right where the takedown lands — a
  // "hit the ground" cue distinct from the ongoing clinch/ground indicators,
  // which are persistent UI, not an impact moment
  showTakedownImpact(ax, az) {
    const proj = project(ax, az);
    const scale = depthScale(az);
    const ring = this.add.graphics();
    const state = { p: 0 };
    this.tweens.add({
      targets: state, p: 1, duration: 420, ease: 'Cubic.easeOut',
      onUpdate: () => {
        ring.clear();
        const alpha = (1 - state.p) * 0.7;
        const r = (8 + state.p * 40) * scale;
        ring.lineStyle(3, 0xffd23f, alpha);
        ring.strokeEllipse(proj.sx, proj.sy, r * 2, r * 0.6);
      },
      onComplete: () => ring.destroy()
    });
  }

  // top strikes (on cooldown so it can't be spammed into a one-frame KO).
  // bottom has real choices, not just cover-and-pray: strike back (weaker,
  // own cooldown, blocked out if they're also covering up — can't punch
  // and cover your face at once), cover up (reduces damage, doesn't stop
  // it), or mash free. Same shape as the clinch: resolves early via a real
  // action, or times out back to standing if nobody does anything.
  updateGround(dt, topPunchPressed, bottomStrikePressed, bottomEscapePressed, bottomBlockHeld) {
    if (!this.groundActive) return;
    this.groundTimer += dt * 1000;
    if (this.groundStrikeCooldown > 0) this.groundStrikeCooldown -= dt * 1000;
    if (this.groundBottomStrikeCooldown > 0) this.groundBottomStrikeCooldown -= dt * 1000;

    const top = this.groundTopIsP1 ? this.p1 : this.p2;
    const bottom = this.groundTopIsP1 ? this.p2 : this.p1;

    if (topPunchPressed && this.groundStrikeCooldown <= 0) {
      this.groundStrikeCooldown = GROUND_STRIKE_COOLDOWN_MS;
      let dmg = GROUND_STRIKE_DAMAGE * top.character.damageMult * top.character.groundDamageMult;
      if (bottomBlockHeld) dmg *= GROUND_BLOCK_REDUCTION;
      bottom.health -= dmg;
      bottom.hitFlash = bottomBlockHeld ? 0.5 : 1;
      bottom.squash = bottomBlockHeld ? 0.5 : 1;
      if (window.SFX) SFX.hit();
      vibrate(bottomBlockHeld ? 10 : 20);
      this.showHitText(bottom);
      this.checkKO(bottom, top);
      if (this.state !== 'playing') return; // KO'd — round's over, stop resolving ground state
    }

    if (bottomStrikePressed && !bottomBlockHeld && this.groundBottomStrikeCooldown <= 0) {
      this.groundBottomStrikeCooldown = GROUND_BOTTOM_STRIKE_COOLDOWN_MS;
      const dmg = GROUND_BOTTOM_STRIKE_DAMAGE * bottom.character.damageMult * bottom.character.groundDamageMult;
      top.health -= dmg;
      top.hitFlash = 1;
      top.squash = 1;
      if (window.SFX) SFX.hit();
      vibrate(15);
      this.showHitText(top);
      this.checkKO(top, bottom);
      if (this.state !== 'playing') return; // KO'd — round's over, stop resolving ground state
    }

    if (bottomEscapePressed) {
      this.groundEscapeProgress++;
      bottom.squash = 0.6; // a small jolt per press — mashing should feel like it's physically doing something
      vibrate(8);
      if (this.groundEscapeProgress >= GROUND_ESCAPE_PRESSES_NEEDED) {
        this.endGround('ESCAPED!');
        return;
      }
    }

    if (this.groundTimer >= GROUND_DURATION_MS) this.endGround('BROKE FREE');
  }

  endGround(msg) {
    const midX = (this.p1.ax + this.p2.ax) / 2, midZ = (this.p1.az + this.p2.az) / 2;
    this.groundActive = false;
    const dist = Math.hypot(this.p2.ax - this.p1.ax, this.p2.az - this.p1.az) || 0.001;
    const ux = (this.p2.ax - this.p1.ax) / dist, uz = (this.p2.az - this.p1.az) / dist;
    const a1 = clampToArena(midX - ux * CLINCH_BREAK_PUSH / 2, midZ - uz * CLINCH_BREAK_PUSH / 2);
    const a2 = clampToArena(midX + ux * CLINCH_BREAK_PUSH / 2, midZ + uz * CLINCH_BREAK_PUSH / 2);
    this.p1.ax = a1.ax; this.p1.az = a1.az;
    this.p2.ax = a2.ax; this.p2.az = a2.az;
    this.showClinchText(midX, midZ, msg, '#7f8a9a');
  }

  // windup (committed, no hit yet) -> active (the window it can connect in)
  // -> recovery (can't attack again yet). Facing is already auto-locked
  // onto the opponent, so range alone decides a hit — no angle check needed.
  // Works for punch, kick, or jumpAttack — f.attackType picks which
  // ATTACK_DEFS entry governs the timing/range/knockback. Jump Attack uses
  // the same two buttons as punch/kick — it's the airborne state that
  // decides which move actually fires, not a separate input.
  updateAttack(f, opponent, punchPressed, kickPressed, dt) {
    if (f.attackState === 'idle') {
      if (f.guarding) return; // hands are up — can't throw a punch/kick from guard
      if (f.grounded) {
        if (punchPressed) this.startAttack(f, 'punch');
        else if (kickPressed) this.startAttack(f, 'kick');
      } else if (punchPressed || kickPressed) {
        this.startAttack(f, 'jumpAttack');
      }
      return;
    }

    const def = getEffectiveDef(f, f.attackType);
    f.attackTimer -= dt * 1000;

    if (f.attackState === 'windup') {
      if (f.attackTimer <= 0) { f.attackState = 'active'; f.attackTimer = def.active; }
    } else if (f.attackState === 'active') {
      if (!f.attackHasHit) {
        const dist = Math.hypot(opponent.ax - f.ax, opponent.az - f.az);
        if (dist <= def.range) {
          f.attackHasHit = true;
          const jumpAttackBonus = f.attackType === 'jumpAttack' ? f.character.jumpAttackMult : 1;
          const damage = def.damage * f.character.damageMult * jumpAttackBonus;
          const knockback = def.knockback * jumpAttackBonus;
          if (opponent.guarding) this.resolveBlock(f, opponent, knockback, damage);
          else this.resolveHit(f, opponent, knockback, damage);
        }
      }
      if (f.attackTimer <= 0) { f.attackState = 'recovery'; f.attackTimer = def.recovery; }
    } else if (f.attackState === 'recovery') {
      if (f.attackTimer <= 0) { f.attackState = 'idle'; f.attackType = null; }
    }
  }

  startAttack(f, type) {
    f.attackType = type;
    f.attackState = 'windup';
    f.attackTimer = getEffectiveDef(f, type).windup;
    f.attackHasHit = false;
    if (window.SFX) SFX.swoosh();
  }

  resolveHit(attacker, defender, knockback, damage) {
    const dx = defender.ax - attacker.ax, dz = defender.az - attacker.az;
    const dist = Math.hypot(dx, dz) || 0.001;
    const ux = dx / dist, uz = dz / dist;
    defender.vax += ux * knockback;
    defender.vaz += uz * knockback;
    defender.hitFlash = 1;
    defender.health -= damage;

    // scaled off knockback so a kick or jump attack lands with visibly
    // more weight than a jab, without hardcoding per-move-type cases here
    const impactScale = Phaser.Math.Clamp(knockback / PUNCH_KNOCKBACK, 1, 2);
    this.cameras.main.shake(70 * impactScale, 0.005 * impactScale);
    vibrate(Math.round(20 * impactScale));
    if (window.SFX) SFX.hit();
    this.showHitText(defender);
    this.checkKO(defender, attacker);
  }

  // a blocked hit — much lighter push, lighter flash, small chip damage
  // (not zero — now that health exists, guard needs a real cost or it's
  // strictly better than eating a hit), and a distinct sound/label
  resolveBlock(attacker, defender, knockback, damage) {
    const dx = defender.ax - attacker.ax, dz = defender.az - attacker.az;
    const dist = Math.hypot(dx, dz) || 0.001;
    const ux = dx / dist, uz = dz / dist;
    defender.vax += ux * knockback * 0.15;
    defender.vaz += uz * knockback * 0.15;
    defender.hitFlash = 0.5;
    defender.health -= CHIP_DAMAGE * attacker.character.damageMult;

    this.cameras.main.shake(30, 0.002);
    vibrate(10);
    if (window.SFX) SFX.click();
    this.showBlockText(defender);
    this.checkKO(defender, attacker);
  }

  showHitText(defender) {
    const proj = project(defender.ax, defender.az);
    const scale = depthScale(defender.az);
    const t = this.add.text(proj.sx, proj.sy - 90 * scale, 'HIT!', {
      fontFamily: 'Arial Black, Arial', fontSize: `${Math.round(20 * scale)}px`, color: '#ffd23f'
    }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: t.y - 30, alpha: 0, duration: 500, onComplete: () => t.destroy() });
  }

  showBlockText(defender) {
    const proj = project(defender.ax, defender.az);
    const scale = depthScale(defender.az);
    const t = this.add.text(proj.sx, proj.sy - 90 * scale, 'BLOCKED', {
      fontFamily: 'Arial Black, Arial', fontSize: `${Math.round(16 * scale)}px`, color: '#b0b8c4'
    }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: t.y - 20, alpha: 0, duration: 400, onComplete: () => t.destroy() });
  }

  update(time, delta) {
    const dt = Math.min(delta / 1000, 0.05);

    if (this.state !== 'playing') { this.draw(); return; }

    const t = this.touchState;
    const aiMode = this.mode === 'ai';
    // VS AI and local-2P use completely separate key sets for P1 now — not
    // one layered on top of the other. Touch controls work in both, since
    // mobile doesn't care which keyboard scheme is "active."
    const p1Up = (aiMode ? this.keys.p1UpAlt.isDown : this.keys.p1Up.isDown) || t.p1.up;
    const p1Down = (aiMode ? this.keys.p1DownAlt.isDown : this.keys.p1Down.isDown) || t.p1.down;
    const p1Left = (aiMode ? this.keys.p1LeftAlt.isDown : this.keys.p1Left.isDown) || t.p1.left;
    const p1Right = (aiMode ? this.keys.p1RightAlt.isDown : this.keys.p1Right.isDown) || t.p1.right;
    const p1Punch = (aiMode ? Phaser.Input.Keyboard.JustDown(this.keys.p1PunchAlt) : Phaser.Input.Keyboard.JustDown(this.keys.p1Punch)) || t.p1.punchPressed;
    const p1Kick = (aiMode ? Phaser.Input.Keyboard.JustDown(this.keys.p1KickAlt) : Phaser.Input.Keyboard.JustDown(this.keys.p1Kick)) || t.p1.kickPressed;
    const p1Block = (aiMode ? this.keys.p1BlockAlt.isDown : this.keys.p1Block.isDown) || t.p1.blockHeld;
    const p1Dodge = (aiMode ? Phaser.Input.Keyboard.JustDown(this.keys.p1DodgeAlt) : Phaser.Input.Keyboard.JustDown(this.keys.p1Dodge)) || t.p1.dodgePressed;
    const p1Grapple = (aiMode ? Phaser.Input.Keyboard.JustDown(this.keys.p1GrappleAlt) : Phaser.Input.Keyboard.JustDown(this.keys.p1Grapple)) || t.p1.grapplePressed;
    // double-tap "up" jumps in both modes. Space is a direct jump key too,
    // but only in local 2P — VS AI is arrows+123QW only, no WASD leftovers.
    const p1UpJustPressed = aiMode ? Phaser.Input.Keyboard.JustDown(this.keys.p1UpAlt) : Phaser.Input.Keyboard.JustDown(this.keys.p1Up);
    const p1TouchUpJustPressed = t.p1.up && !this.prevTouchUp.p1;
    this.prevTouchUp.p1 = t.p1.up;
    let p1Jump = aiMode ? false : Phaser.Input.Keyboard.JustDown(this.keys.p1Jump);
    if (p1UpJustPressed || p1TouchUpJustPressed) {
      if (time - this.p1.lastUpTapAt <= DOUBLE_TAP_WINDOW_MS) { p1Jump = true; this.p1.lastUpTapAt = -9999; }
      else this.p1.lastUpTapAt = time;
    }
    t.p1.punchPressed = false;
    t.p1.kickPressed = false;
    t.p1.dodgePressed = false;
    t.p1.grapplePressed = false;
    // "up" = away from camera, "left" = screen-left — always, regardless of facing
    const p1Move = axisMoveVector(p1Up, p1Down, p1Left, p1Right);
    if (this.clinchActive) this.tryTakedown(this.p1, p1Grapple);
    else if (!this.groundActive) { this.tryStartDodge(this.p1, this.p2, p1Dodge, p1Move.mx, p1Move.mz); this.tryStartGrapple(this.p1, this.p2, p1Grapple); }
    // committed to the attack, a dash, a clinch, or a ground exchange — can't strafe out of it
    const p1Locked = this.p1.attackState === 'windup' || this.p1.attackState === 'active' || this.p1.dodging || this.clinchActive || this.groundActive;
    this.stepFighter(this.p1, p1Locked ? 0 : p1Move.mx, p1Locked ? 0 : p1Move.mz, p1Jump, dt);
    if (this.p1.dodging) this.stepDodge(this.p1, dt);
    this.updateGuard(this.p1, p1Block, dt);

    let groundP2Punch = false, groundP2Dodge = false, groundP2Block = false;
    let groundAiTopPunch = false, groundAiBottomEscape = false, groundAiBottomStrike = false;

    if (this.mode === '2p') {
      const p2Up = this.keys.p2Up.isDown || t.p2.up;
      const p2Down = this.keys.p2Down.isDown || t.p2.down;
      const p2Left = this.keys.p2Left.isDown || t.p2.left;
      const p2Right = this.keys.p2Right.isDown || t.p2.right;
      const p2Punch = Phaser.Input.Keyboard.JustDown(this.keys.p2Punch) || t.p2.punchPressed;
      const p2Kick = Phaser.Input.Keyboard.JustDown(this.keys.p2Kick) || t.p2.kickPressed;
      const p2Block = this.keys.p2Block.isDown || t.p2.blockHeld;
      const p2Dodge = Phaser.Input.Keyboard.JustDown(this.keys.p2Dodge) || t.p2.dodgePressed;
      const p2Grapple = Phaser.Input.Keyboard.JustDown(this.keys.p2Grapple) || t.p2.grapplePressed;
      groundP2Punch = p2Punch; groundP2Dodge = p2Dodge; groundP2Block = p2Block;
      const p2UpJustPressed = Phaser.Input.Keyboard.JustDown(this.keys.p2Up);
      const p2TouchUpJustPressed = t.p2.up && !this.prevTouchUp.p2;
      this.prevTouchUp.p2 = t.p2.up;
      let p2Jump = Phaser.Input.Keyboard.JustDown(this.keys.p2Jump);
      if (p2UpJustPressed || p2TouchUpJustPressed) {
        if (time - this.p2.lastUpTapAt <= DOUBLE_TAP_WINDOW_MS) { p2Jump = true; this.p2.lastUpTapAt = -9999; }
        else this.p2.lastUpTapAt = time;
      }
      t.p2.punchPressed = false;
      t.p2.kickPressed = false;
      t.p2.dodgePressed = false;
      t.p2.grapplePressed = false;
      const p2Move = axisMoveVector(p2Up, p2Down, p2Left, p2Right);
      if (this.clinchActive) this.tryTakedown(this.p2, p2Grapple);
      else if (!this.groundActive) { this.tryStartDodge(this.p2, this.p1, p2Dodge, p2Move.mx, p2Move.mz); this.tryStartGrapple(this.p2, this.p1, p2Grapple); }
      const p2Locked = this.p2.attackState === 'windup' || this.p2.attackState === 'active' || this.p2.dodging || this.clinchActive || this.groundActive;
      this.stepFighter(this.p2, p2Locked ? 0 : p2Move.mx, p2Locked ? 0 : p2Move.mz, p2Jump, dt);
      if (this.p2.dodging) this.stepDodge(this.p2, dt);
      this.updateGuard(this.p2, p2Block, dt);
      if (!this.clinchActive && !this.groundActive) {
        this.updateAttack(this.p1, this.p2, p1Punch, p1Kick, dt);
        this.updateAttack(this.p2, this.p1, p2Punch, p2Kick, dt);
      }
    } else {
      const ai = this.aiInput(dt);
      if (this.clinchActive) this.tryTakedown(this.p2, ai.grapple);
      else if (!this.groundActive) this.tryStartGrapple(this.p2, this.p1, ai.grapple);
      // ground state gives the AI its own simple auto-behavior, independent
      // of aiInput's normal decision structure — top auto-strikes, bottom
      // auto-struggles, both as a per-second chance rather than a single roll
      groundAiTopPunch = this.groundActive && !this.groundTopIsP1 && Math.random() < DIFFICULTY_DEFS[this.difficulty].groundStrikeChance * dt;
      groundAiBottomEscape = this.groundActive && this.groundTopIsP1 && Math.random() < DIFFICULTY_DEFS[this.difficulty].groundEscapeChance * dt;
      groundAiBottomStrike = this.groundActive && this.groundTopIsP1 && Math.random() < DIFFICULTY_DEFS[this.difficulty].groundBottomStrikeChance * dt;
      const aiLocked = this.p2.attackState === 'windup' || this.p2.attackState === 'active' || this.clinchActive || this.groundActive;
      this.stepFighter(this.p2, aiLocked ? 0 : ai.moveX, aiLocked ? 0 : ai.moveZ, ai.jump, dt);
      this.updateGuard(this.p2, ai.block, dt);
      if (!this.clinchActive && !this.groundActive) {
        this.updateAttack(this.p1, this.p2, p1Punch, p1Kick, dt);
        this.updateAttack(this.p2, this.p1, ai.punch, ai.kick, dt);
      }
    }

    if (this.groundActive) {
      const topPunchPressed = this.groundTopIsP1 ? p1Punch : (this.mode === '2p' ? groundP2Punch : groundAiTopPunch);
      const bottomStrikePressed = this.groundTopIsP1 ? (this.mode === '2p' ? groundP2Punch : groundAiBottomStrike) : p1Punch;
      const bottomEscapePressed = this.groundTopIsP1 ? (this.mode === '2p' ? groundP2Dodge : groundAiBottomEscape) : p1Dodge;
      const bottomBlockHeld = this.groundTopIsP1 ? (this.mode === '2p' ? groundP2Block : false) : p1Block;
      this.updateGround(dt, topPunchPressed, bottomStrikePressed, bottomEscapePressed, bottomBlockHeld);
    }

    this.updateClinch(dt);
    if (!this.clinchActive && !this.groundActive) this.separate(); // clinch/ground hold a tighter distance than normal separation would allow
    this.updateFacing();
    this.updateGroundPose(this.p1, dt);
    this.updateGroundPose(this.p2, dt);
    this.updateHealthBar(this.p1HealthFill, this.p1);
    this.updateHealthBar(this.p2HealthFill, this.p2);
    this.draw();
  }

  drawShadow(f) {
    const proj = project(f.ax, f.az);
    const scale = depthScale(f.az);
    const airLift = Phaser.Math.Clamp(1 + f.jumpZ / 160, 0.35, 1); // shadow shrinks as fighter jumps higher
    this.g.fillStyle(0x000000, 0.35);
    this.g.fillEllipse(proj.sx, proj.sy, 40 * scale * airLift, 14 * scale * airLift);
  }

  drawFighter(f) {
    const g = this.g;
    const proj = project(f.ax, f.az);
    const scale = depthScale(f.az);
    const bobY = f.grounded ? Math.sin(f.walkBob) * 3 * scale : 0;
    const squashY = 1 - f.squash * 0.18;
    const squashX = 1 + f.squash * 0.12;

    // GROUND POSE — top and bottom get genuinely different poses now, not
    // a shared flatten. Top stays mostly upright (leaning over, mounting),
    // bottom flattens hard and its head slides sideways along its facing
    // direction — a squashed-but-still-upright torso with a head straight
    // on top reads as "short person," not "person lying on the ground";
    // shifting the head to the side is what actually sells prone.
    const groundT = f.groundPoseAmount;
    const isTopFighter = f === (this.groundTopIsP1 ? this.p1 : this.p2);
    const squashTarget = isTopFighter ? 0.68 : 0.32;
    const groundSquash = Phaser.Math.Linear(1, squashTarget, groundT);
    const groundYShift = Phaser.Math.Linear(0, isTopFighter ? -24 : 14, groundT) * scale;
    const groundXLean = isTopFighter ? Phaser.Math.Linear(0, f.facing * 7, groundT) * scale : 0;
    const groundHeadShiftX = isTopFighter ? 0 : Phaser.Math.Linear(0, f.facing * 16, groundT) * scale;
    // ongoing struggle wobble while actually grounded — this is the piece
    // that stops the hold itself from reading as frozen for its full
    // duration; top and bottom wobble out of phase so it reads as push-pull
    // rather than both fighters twitching in sync
    const struggleActive = this.groundActive ? 1 : 0;
    const wobblePhase = isTopFighter ? 0 : Math.PI;
    const wobbleX = Math.sin(this.time.now * 0.006 + wobblePhase) * 2.2 * scale * struggleActive;
    const wobbleSquash = 1 + Math.sin(this.time.now * 0.009 + wobblePhase) * 0.05 * struggleActive;

    // ATTACK — one continuous pull-back/thrust/retract motion; see
    // attackOffset for why it's built this way. Body lean reuses this
    // same curve at a fraction of the magnitude, so the whole fighter
    // rocks back on the windup and surges into the thrust — and since it's
    // the same already-continuous curve, leaning can't introduce a new snap.
    const attackDef = f.attackType ? getEffectiveDef(f, f.attackType) : null;
    const rawOffset = attackDef ? attackOffset(f.attackState, f.attackTimer, attackDef) : null;
    const leanRaw = rawOffset === null ? 0 : rawOffset * 0.18;

    const baseX = proj.sx + leanRaw * scale * f.facing + wobbleX + groundXLean;
    const baseY = proj.sy + f.jumpZ * scale - bobY + groundYShift;
    const headX = baseX + groundHeadShiftX;
    const bodyScale = f.character.bodyScale;
    const earScale = f.character.earScale;
    const widthScale = f.character.widthScale;
    const w = 42 * scale * squashX * bodyScale * widthScale, hgt = 56 * scale * squashY * groundSquash * wobbleSquash * bodyScale;

    // Which static limb (if any) needs to stand down and hand off to the
    // animated one — the facing-side arm during a punch, the facing-side
    // leg during a kick. Without this, the static block and the animated
    // limb are two unrelated shapes on screen at once, which is exactly
    // what read as "a random arm appearing" instead of "my arm reaching out."
    const isPunchActive = rawOffset !== null && (f.attackType === 'punch' || f.attackType === 'jumpAttack');
    const isKickActive = rawOffset !== null && f.attackType === 'kick';
    const frontIsRight = f.facing === 1;
    const leftIsFront = !frontIsRight;

    // FIGHTING STANCE — front (lead) limb toward the opponent, rear limb
    // tucked back, not a flat-footed symmetric stand. Lead hand rides low
    // and forward (jab-ready), rear hand stays up near the chin even at
    // rest — that's what makes the idle pose already read as "fighter,"
    // not just "person standing here." Both hands still converge to the
    // same symmetric raised position as guardAmount rises toward a full
    // block; legs stay asymmetric throughout since stance doesn't change
    // when you block, only hand position does.
    const leadArmOffX = w * 0.44, leadArmY = baseY - hgt + 3 * scale;
    const rearArmOffX = w * 0.30, rearArmY = baseY - hgt - 7 * scale;
    const guardOffX = w * 0.19, guardY = baseY - hgt - 9 * scale;
    const leadOffX = Phaser.Math.Linear(leadArmOffX, guardOffX, f.guardAmount);
    const leadY = Phaser.Math.Linear(leadArmY, guardY, f.guardAmount);
    const rearOffX = Phaser.Math.Linear(rearArmOffX, guardOffX, f.guardAmount);
    const rearY = Phaser.Math.Linear(rearArmY, guardY, f.guardAmount);
    let leftArmOffX = leftIsFront ? leadOffX : rearOffX;
    let leftArmY = leftIsFront ? leadY : rearY;
    let rightArmOffX = frontIsRight ? leadOffX : rearOffX;
    let rightArmY = frontIsRight ? leadY : rearY;

    // HANDS UP OUT OF THE TAKEDOWN — the bottom fighter's arms pull off the
    // normal standing stance and raise into a tight guard reaching toward
    // the opponent, instead of collapsing to their sides. This is what
    // actually sells "still fighting," not just "lying there" — they can
    // land the ground strike-back from this position, so the pose should
    // look like it, not contradict it.
    if (!isTopFighter && groundT > 0) {
      const handsUpOffX = w * 0.24;
      const handsUpY = baseY - hgt - 20 * scale;
      leftArmOffX = Phaser.Math.Linear(leftArmOffX, handsUpOffX, groundT);
      leftArmY = Phaser.Math.Linear(leftArmY, handsUpY, groundT);
      rightArmOffX = Phaser.Math.Linear(rightArmOffX, handsUpOffX, groundT);
      rightArmY = Phaser.Math.Linear(rightArmY, handsUpY, groundT);
    }

    const legW = w * 0.24;
    const frontLegGap = w * 0.11, frontLegH = hgt * 0.38;
    const rearLegGap = w * 0.02, rearLegH = hgt * 0.28;
    const leftLegGap = leftIsFront ? frontLegGap : rearLegGap;
    const leftLegH = leftIsFront ? frontLegH : rearLegH;
    const rightLegGap = frontIsRight ? frontLegGap : rearLegGap;
    const rightLegH = frontIsRight ? frontLegH : rearLegH;

    const c = f.character;
    if (c.bodyStyle === 'panda') {
      g.fillStyle(c.bodyColor, 1);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      // legs — always visible except the facing-side one mid-kick (that one
      // becomes the animated kicking leg instead), so their length gives a
      // visual sense of how far a kick can actually reach
      g.fillStyle(c.darkColor, 1);
      if (!(isKickActive && !frontIsRight)) g.fillRoundedRect(baseX - leftLegGap - legW, baseY - leftLegH, legW, leftLegH, 3 * scale);
      if (!(isKickActive && frontIsRight)) g.fillRoundedRect(baseX + rightLegGap, baseY - rightLegH, legW, rightLegH, 3 * scale);
      g.fillStyle(c.gloveColor, 1);
      if (!(isPunchActive && !frontIsRight)) g.fillRoundedRect(baseX - leftArmOffX - 4 * scale, leftArmY, 9 * scale, 22 * scale, 4 * scale);
      if (!(isPunchActive && frontIsRight)) g.fillRoundedRect(baseX + rightArmOffX - 5 * scale, rightArmY, 9 * scale, 22 * scale, 4 * scale);
      g.fillStyle(c.bodyColor, 1);
      g.fillCircle(headX, baseY - hgt - 16 * scale, 17 * scale);
      // neck shadow — drawn on top of both body and head, right at the seam
      // between them, so the head reads as its own shape instead of
      // merging into the torso (this was the main reason the panda's face
      // was hard to see)
      g.fillStyle(0x0a0a0d, 0.3);
      g.fillEllipse(headX, baseY - hgt, w * 0.5, 5 * scale);
      g.fillStyle(c.darkColor, 1);
      g.fillCircle(headX - 13 * scale * earScale, baseY - hgt - 30 * scale, 7 * scale * earScale);
      g.fillCircle(headX + 13 * scale * earScale, baseY - hgt - 30 * scale, 7 * scale * earScale);
      g.fillEllipse(headX - 7 * f.facing * scale, baseY - hgt - 17 * scale, 11 * scale, 13 * scale);
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(headX + f.facing * 10 * scale, baseY - hgt - 14 * scale, 4.5 * scale);
    } else {
      // 'bear' bodyStyle — also used by Tiger, with its own palette; the
      // archetype comes from stats, not from needing new geometry per animal
      g.fillStyle(c.bodyColor, 1);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      g.fillStyle(c.darkColor, 1);
      if (!(isKickActive && !frontIsRight)) g.fillRoundedRect(baseX - leftLegGap - legW, baseY - leftLegH, legW, leftLegH, 3 * scale);
      if (!(isKickActive && frontIsRight)) g.fillRoundedRect(baseX + rightLegGap, baseY - rightLegH, legW, rightLegH, 3 * scale);
      g.fillStyle(c.gloveColor, 1);
      if (!(isPunchActive && !frontIsRight)) g.fillRoundedRect(baseX - leftArmOffX - 4 * scale, leftArmY, 9 * scale, 22 * scale, 4 * scale);
      if (!(isPunchActive && frontIsRight)) g.fillRoundedRect(baseX + rightArmOffX - 5 * scale, rightArmY, 9 * scale, 22 * scale, 4 * scale);
      g.fillStyle(c.bodyColor, 1);
      g.fillCircle(headX, baseY - hgt - 16 * scale, 18 * scale);
      g.fillStyle(0x0a0a0d, 0.3);
      g.fillEllipse(headX, baseY - hgt, w * 0.5, 5 * scale);
      g.fillStyle(c.darkColor, 1);
      g.fillCircle(headX - 14 * scale * earScale, baseY - hgt - 30 * scale, 7 * scale * earScale);
      g.fillCircle(headX + 14 * scale * earScale, baseY - hgt - 30 * scale, 7 * scale * earScale);
      g.fillStyle(c.muzzleColor, 1);
      g.fillEllipse(headX + f.facing * 6 * scale, baseY - hgt - 12 * scale, 16 * scale, 12 * scale);
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(headX + f.facing * 10 * scale, baseY - hgt - 12 * scale, 3.5 * scale);
      // HORN — Rhino-only. Without this, "bear body + gray palette" reads
      // as a gray bear, not a rhino — bulk and color alone weren't enough.
      if (c.hasHorn) {
        g.fillStyle(0xe8e4d8, 1);
        g.fillTriangle(
          headX + f.facing * 8 * scale, baseY - hgt - 16 * scale,
          headX + f.facing * 8 * scale, baseY - hgt - 24 * scale,
          headX + f.facing * 24 * scale, baseY - hgt - 20 * scale
        );
      }
    }

    // shield outline — fades in with guardAmount, extra readability on top
    // of the raised arms alone
    if (f.guardAmount > 0.05) {
      g.lineStyle(2 * scale, 0xb0b8c4, f.guardAmount * 0.6);
      g.strokeRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
    }

    if (rawOffset !== null) {
      const isKick = f.attackType === 'kick';
      const isJumpAttack = f.attackType === 'jumpAttack';
      const limbColor = isJumpAttack ? 0xffd23f : f.character.gloveColor;
      const offset = rawOffset * scale;
      // anchored at exactly where the now-hidden static arm/leg block was,
      // so this reads as that limb extending, not a new shape appearing.
      // Punch swings from shoulder height (matching the arm patch); kick
      // swings from hip height (matching the leg block's top) — that
      // height difference alone is most of what makes the two moves read
      // as different limbs.
      const tipY = isKick ? (baseY - hgt * 0.34) : (baseY - hgt + 17 * scale);
      const limbBaseDist = isKick ? w * 0.16 : w/2; // same base anchorX uses — tip/trail must agree with it or the static block reappears in a different spot than the tip just vacated
      const anchorX = baseX + f.facing * limbBaseDist;
      const tipX = baseX + f.facing * (limbBaseDist + offset);
      const limbWidth = (isKick ? 9 : 5) * scale;
      const tipRadius = (isKick ? 8 : 7) * scale;
      const tipRadiusActive = (isKick ? 15 : 11) * scale;
      const tipRadiusActiveMinor = (isKick ? 9 : 7) * scale;

      // limb — connects the tip to the anchor so it reads as an arm/leg
      // extending, not a disembodied shape
      g.lineStyle(limbWidth, limbColor, 1);
      g.lineBetween(anchorX, tipY, tipX, tipY);

      // motion trail — a couple of fading ghost positions behind the tip,
      // only during the actual thrust, to sell speed
      if (f.attackState === 'active') {
        g.fillStyle(limbColor, 0.25);
        g.fillCircle(baseX + f.facing * (limbBaseDist + offset * 0.55), tipY, tipRadius * 0.85);
        g.fillStyle(limbColor, 0.12);
        g.fillCircle(baseX + f.facing * (limbBaseDist + offset * 0.25), tipY, tipRadius * 0.7);
      }

      g.fillStyle(limbColor, 1);
      if (f.attackState === 'active') {
        // elongated along the thrust axis during the active window — a
        // "streak" shape rather than a circle the whole way through
        g.fillEllipse(tipX, tipY, tipRadiusActive, tipRadiusActiveMinor);
      } else {
        g.fillCircle(tipX, tipY, tipRadius);
      }
    }

    // HIT FLASH — a brief white overlay on whoever just got hit
    if (f.hitFlash > 0) {
      g.fillStyle(0xffffff, f.hitFlash * 0.6);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      g.fillCircle(headX, baseY - hgt - 16 * scale, 17 * scale);
    }
  }

  drawArena() {
    const g = this.g;
    g.fillStyle(0x111318, 1);
    g.fillEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 2, ARENA_RZ * 2 * DEPTH_COMPRESS);
    g.lineStyle(2, 0x1c2128, 1);
    g.strokeEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 2, ARENA_RZ * 2 * DEPTH_COMPRESS);
    // a couple of inner rings purely for depth legibility, nothing functional
    g.lineStyle(1, 0x181b21, 0.8);
    g.strokeEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 1.3, ARENA_RZ * 1.3 * DEPTH_COMPRESS);
  }

  draw() {
    const g = this.g;
    g.clear();
    if (this.state !== 'playing' && this.state !== 'roundOver') return;
    if (!this.p1 || !this.p2) return;

    this.drawArena();

    // painter's algorithm — draw the fighter farther from camera first so
    // the nearer one correctly overlaps them when they're close together
    const order = [this.p1, this.p2].sort((a, b) => project(a.ax, a.az).sy - project(b.ax, b.az).sy);
    order.forEach(f => { this.drawShadow(f); this.drawFighter(f); });

    // CLINCH — a simple grip connector between the two while locked
    // together, plus a shrinking ring showing how much hold time is left.
    if (this.clinchActive) {
      const p1 = project(this.p1.ax, this.p1.az), p2 = project(this.p2.ax, this.p2.az);
      g.lineStyle(4, 0xba7dff, 0.5);
      g.lineBetween(p1.sx, p1.sy - 30, p2.sx, p2.sy - 30);
      const midX = (p1.sx + p2.sx) / 2, midY = (p1.sy + p2.sy) / 2 - 30;
      const remain = 1 - Phaser.Math.Clamp(this.clinchTimer / CLINCH_DURATION_MS, 0, 1);
      g.lineStyle(3, 0xba7dff, 0.8);
      g.beginPath();
      g.arc(midX, midY, 14, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + 360 * remain), false);
      g.strokePath();
    }

    // GROUND — same shape as the clinch visual (connector + timer ring) but
    // in the ground-struggle color, plus dots showing the bottom fighter's
    // escape progress so mashing DODGE actually reads as working
    if (this.groundActive) {
      const p1 = project(this.p1.ax, this.p1.az), p2 = project(this.p2.ax, this.p2.az);
      g.lineStyle(4, 0xff8a3d, 0.5);
      g.lineBetween(p1.sx, p1.sy - 20, p2.sx, p2.sy - 20);
      const midX = (p1.sx + p2.sx) / 2, midY = (p1.sy + p2.sy) / 2 - 20;
      const remain = 1 - Phaser.Math.Clamp(this.groundTimer / GROUND_DURATION_MS, 0, 1);
      g.lineStyle(3, 0xff8a3d, 0.8);
      g.beginPath();
      g.arc(midX, midY, 14, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + 360 * remain), false);
      g.strokePath();

      for (let i = 0; i < GROUND_ESCAPE_PRESSES_NEEDED; i++) {
        const dotX = midX - (GROUND_ESCAPE_PRESSES_NEEDED - 1) * 7 + i * 14;
        const filled = i < this.groundEscapeProgress;
        g.fillStyle(0x5be37b, filled ? 1 : 0.15);
        g.fillCircle(dotX, midY + 22, 4);
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#0a0a0d',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
