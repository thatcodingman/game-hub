<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Last Fist — The Arcade</title>
<style>
  html, body {
    margin:0; padding:0; background:#0a0a0d; overflow:hidden; height:100%;
    overscroll-behavior: none;
  }
  #game-container { width:100vw; height:100vh; }
  canvas {
    display:block; touch-action:none;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   LAST FIST — MOVEMENT PHASE
   Panda vs Bear.

   This is deliberately NOT a combat build yet. No punches, no kicks, no
   health, no win condition. It's the foundation the pitch itself called
   for first: real walk/jump/gravity/facing/collision, working against
   either a live AI or a second local player, proven solid before a single
   attack gets layered on top. Combat is the next phase, on purpose.
   ========================================================================= */

const W = 960, H = 540;
const GROUND_Y = H - 90;
const ARENA_LEFT = 90;
const ARENA_RIGHT = W - 90;
const FIGHTER_HALF_WIDTH = 26;
const SEPARATION_MIN_DIST = 58; // fighters push apart rather than overlap

const GRAVITY = 1700;
const MOVE_ACCEL = 1800;
const MOVE_MAX_SPEED = 230;
const GROUND_FRICTION = 2200;
const AIR_CONTROL_MULT = 0.6; // reduced accel/friction while airborne — can't cut movement on a dime mid-jump
const JUMP_VELOCITY = -560;

const AI_APPROACH_MIN = 70;  // AI backs off if closer than this
const AI_APPROACH_MAX = 150; // AI closes in if farther than this
const AI_JUMP_CHANCE_PER_SEC = 0.35; // rough odds baked into a per-frame roll below

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (err) { /* non-fatal */ }
}

function makeFighter(x, kind) {
  return {
    x, y: GROUND_Y, vx: 0, vy: 0, grounded: true, facing: kind === 'panda' ? 1 : -1,
    kind, walkBob: 0, squash: 0
  };
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0a0d');
    this.g = this.add.graphics();

    this.mode = null; // 'ai' | '2p' — set on mode select
    this.state = 'menu';
    this.aiJumpCooldown = 1.5;

    this.buildBackground();
    this.buildHUD();
    this.buildMenu();
    this.buildControls();

    this.keys = this.input.keyboard.addKeys({
      p1Left: Phaser.Input.Keyboard.KeyCodes.A,
      p1Right: Phaser.Input.Keyboard.KeyCodes.D,
      p1Jump: Phaser.Input.Keyboard.KeyCodes.W,
      p2Left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      p2Right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      p2Jump: Phaser.Input.Keyboard.KeyCodes.UP
    });
  }

  buildBackground() {
    this.bg = this.add.graphics();
    this.bg.fillStyle(0x0a0a0d, 1);
    this.bg.fillRect(0, 0, W, H);
    this.bg.fillStyle(0x111318, 1);
    this.bg.fillRect(0, GROUND_Y + 30, W, H - (GROUND_Y + 30));
    this.bg.lineStyle(2, 0x1c2128, 1);
    this.bg.lineBetween(0, GROUND_Y + 30, W, GROUND_Y + 30);
  }

  buildHUD() {
    this.modeText = this.add.text(W/2, 16, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '14px', color: '#7f8a9a'
    }).setOrigin(0.5, 0).setVisible(false);

    this.menuBtn = this.add.text(W - 16, 16, 'MENU', {
      fontFamily: 'Arial Black, Arial', fontSize: '13px', color: '#7f8a9a'
    }).setOrigin(1, 0).setInteractive({ useHandCursor: true }).setVisible(false);
    this.menuBtn.on('pointerdown', () => this.returnToMenu());

    this.centerText = this.add.text(W/2, H/2 - 70, 'LAST FIST', {
      fontFamily: 'Arial Black, Arial', fontSize: '36px', color: '#e8ecf1', align: 'center'
    }).setOrigin(0.5).setShadow(0, 2, '#000', 6, true, true);
    this.subText = this.add.text(W/2, H/2 - 20,
      'Panda vs Bear \u2014 movement phase\nwalk, jump, and square up. Punches and kicks come next.', {
      fontFamily: 'Arial', fontSize: '14px', color: '#7f8a9a', align: 'center', wordWrap: { width: 560 }
    }).setOrigin(0.5);
  }

  buildMenu() {
    const btnY = H/2 + 50, btnW = 220, btnH = 64, gap = 20;
    this.menuButtons = [];
    const defs = [
      { label: 'VS AI', x: W/2 - btnW/2 - gap/2, mode: 'ai' },
      { label: 'VS PLAYER 2', x: W/2 + btnW/2 + gap/2, mode: '2p' }
    ];
    defs.forEach(def => {
      const bg = this.add.rectangle(def.x, btnY, btnW, btnH, 0x14161c, 0.9).setStrokeStyle(2, 0x4fd1ff, 0.7);
      const label = this.add.text(def.x, btnY, def.label, {
        fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1'
      }).setOrigin(0.5);
      bg.setInteractive({ useHandCursor: true });
      bg.on('pointerdown', () => this.startMatch(def.mode));
      this.menuButtons.push(bg, label);
    });
  }

  buildControls() {
    // P1 cluster — bottom-left, always available
    this.p1Controls = this.buildControlCluster(190, 'A/D \u00b7 W', false);
    // P2 cluster — bottom-right, only shown/used in 2P mode
    this.p2Controls = this.buildControlCluster(W - 190, '\u2190/\u2192 \u00b7 \u2191', true);
    this.setTouchState('p1', { left: false, right: false });
    this.setTouchState('p2', { left: false, right: false });
  }

  buildControlCluster(centerX, hint, isP2) {
    const btnY = H - 56, btnSize = 56, gap = 10;
    const leftX = centerX - btnSize - gap;
    const rightX = centerX;
    const jumpX = centerX + btnSize + gap;

    const mk = (x, label) => {
      const bg = this.add.rectangle(x, btnY, btnSize, btnSize, 0x14161c, 0.9).setStrokeStyle(2, 0x4fd1ff, 0.6);
      const t = this.add.text(x, btnY, label, { fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1' }).setOrigin(0.5);
      return { bg, t };
    };
    const left = mk(leftX, '\u25c0');
    const right = mk(rightX, '\u25b6');
    const jump = mk(jumpX, '\u25b2');
    const hintText = this.add.text(centerX, btnY - 46, hint, { fontFamily: 'Arial', fontSize: '11px', color: '#555a66' }).setOrigin(0.5);

    const key = isP2 ? 'p2' : 'p1';
    const bindHold = (obj, field) => {
      obj.bg.setInteractive({ useHandCursor: true });
      obj.bg.on('pointerdown', () => { this.touchState[key][field] = true; obj.bg.setFillStyle(0x22262f, 0.95); });
      obj.bg.on('pointerup', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
      obj.bg.on('pointerout', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
    };
    if (!this.touchState) this.touchState = {};
    this.touchState[key] = { left: false, right: false };
    bindHold(left, 'left');
    bindHold(right, 'right');
    jump.bg.setInteractive({ useHandCursor: true });
    jump.bg.on('pointerdown', () => { this.touchState[key].jumpPressed = true; jump.bg.setFillStyle(0x22262f, 0.95); this.time.delayedCall(90, () => jump.bg.setFillStyle(0x14161c, 0.9)); });

    return { left, right, jump, hintText, objects: [left.bg, left.t, right.bg, right.t, jump.bg, jump.t, hintText] };
  }

  setTouchState(key, val) {
    Object.assign(this.touchState[key], val);
  }

  setControlsVisible(cluster, visible) {
    cluster.objects.forEach(o => o.setVisible(visible));
  }

  startMatch(mode) {
    this.mode = mode;
    this.state = 'playing';
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.menuButtons.forEach(o => o.setVisible(false));

    this.modeText.setVisible(true).setText(mode === 'ai' ? '1P VS AI' : '2P LOCAL');
    this.menuBtn.setVisible(true);

    this.setControlsVisible(this.p1Controls, true);
    this.setControlsVisible(this.p2Controls, mode === '2p');

    this.p1 = makeFighter(W/2 - 120, 'panda');
    this.p2 = makeFighter(W/2 + 120, 'bear');
    this.p1.facing = 1;
    this.p2.facing = -1;
    this.aiJumpCooldown = Phaser.Math.FloatBetween(1, 2.5);

    if (window.SFX) SFX.select();
  }

  returnToMenu() {
    this.state = 'menu';
    this.mode = null;
    this.modeText.setVisible(false);
    this.menuBtn.setVisible(false);
    this.setControlsVisible(this.p1Controls, false);
    this.setControlsVisible(this.p2Controls, false);
    this.centerText.setText('LAST FIST').setVisible(true);
    this.subText.setVisible(true);
    this.menuButtons.forEach(o => o.setVisible(true));
  }

  // shared kinematics for both fighters and the AI — same rules for everyone
  stepFighter(f, left, right, jumpPressed, dt) {
    const grounded = f.grounded;
    const accel = grounded ? MOVE_ACCEL : MOVE_ACCEL * AIR_CONTROL_MULT;
    const friction = (grounded ? GROUND_FRICTION : GROUND_FRICTION * AIR_CONTROL_MULT) * dt;

    if (left && !right) f.vx -= accel * dt;
    else if (right && !left) f.vx += accel * dt;
    else {
      if (f.vx > 0) f.vx = Math.max(0, f.vx - friction);
      else if (f.vx < 0) f.vx = Math.min(0, f.vx + friction);
    }
    f.vx = Phaser.Math.Clamp(f.vx, -MOVE_MAX_SPEED, MOVE_MAX_SPEED);
    f.x += f.vx * dt;
    f.x = Phaser.Math.Clamp(f.x, ARENA_LEFT, ARENA_RIGHT);

    if (jumpPressed && f.grounded) {
      f.vy = JUMP_VELOCITY;
      f.grounded = false;
      if (window.SFX) SFX.jump();
    }
    f.vy += GRAVITY * dt;
    f.y += f.vy * dt;
    if (f.y >= GROUND_Y) {
      const wasAirborne = !f.grounded;
      f.y = GROUND_Y;
      f.vy = 0;
      f.grounded = true;
      if (wasAirborne) { f.squash = 1; vibrate(6); }
    }

    // walk-bob purely cosmetic — only while grounded and actually moving
    if (f.grounded && Math.abs(f.vx) > 20) f.walkBob += dt * 14;
    f.squash = Math.max(0, f.squash - dt * 4);
  }

  aiInput(dt) {
    const dx = this.p1.x - this.p2.x;
    const dist = Math.abs(dx);
    let left = false, right = false, jump = false;

    if (dist > AI_APPROACH_MAX) { if (dx > 0) right = true; else left = true; }
    else if (dist < AI_APPROACH_MIN) { if (dx > 0) left = true; else right = true; }

    this.aiJumpCooldown -= dt;
    if (this.p2.grounded && this.aiJumpCooldown <= 0 && Math.random() < AI_JUMP_CHANCE_PER_SEC * dt) {
      jump = true;
      this.aiJumpCooldown = Phaser.Math.FloatBetween(1.5, 3.5);
    }
    return { left, right, jump };
  }

  separate() {
    const dx = this.p2.x - this.p1.x;
    const dist = Math.abs(dx);
    if (dist < SEPARATION_MIN_DIST && dist > 0.001) {
      const push = (SEPARATION_MIN_DIST - dist) / 2;
      const dir = dx > 0 ? 1 : -1;
      this.p1.x = Phaser.Math.Clamp(this.p1.x - push * dir, ARENA_LEFT, ARENA_RIGHT);
      this.p2.x = Phaser.Math.Clamp(this.p2.x + push * dir, ARENA_LEFT, ARENA_RIGHT);
    }
  }

  updateFacing() {
    const dx = this.p2.x - this.p1.x;
    if (Math.abs(dx) > 4) {
      this.p1.facing = dx > 0 ? 1 : -1;
      this.p2.facing = dx > 0 ? -1 : 1;
    }
  }

  update(time, delta) {
    const dt = Math.min(delta / 1000, 0.05);

    if (this.state !== 'playing') { this.draw(); return; }

    const p1Left = this.keys.p1Left.isDown || this.touchState.p1.left;
    const p1Right = this.keys.p1Right.isDown || this.touchState.p1.right;
    const p1Jump = Phaser.Input.Keyboard.JustDown(this.keys.p1Jump) || this.touchState.p1.jumpPressed;
    this.touchState.p1.jumpPressed = false;
    this.stepFighter(this.p1, p1Left, p1Right, p1Jump, dt);

    if (this.mode === '2p') {
      const p2Left = this.keys.p2Left.isDown || this.touchState.p2.left;
      const p2Right = this.keys.p2Right.isDown || this.touchState.p2.right;
      const p2Jump = Phaser.Input.Keyboard.JustDown(this.keys.p2Jump) || this.touchState.p2.jumpPressed;
      this.touchState.p2.jumpPressed = false;
      this.stepFighter(this.p2, p2Left, p2Right, p2Jump, dt);
    } else {
      const ai = this.aiInput(dt);
      this.stepFighter(this.p2, ai.left, ai.right, ai.jump, dt);
    }

    this.separate();
    this.updateFacing();
    this.draw();
  }

  drawFighter(f) {
    const g = this.g;
    const bobY = f.grounded ? Math.sin(f.walkBob) * 3 : 0;
    const squashY = 1 - f.squash * 0.18;
    const squashX = 1 + f.squash * 0.12;
    const baseY = f.y - bobY;
    const w = 42 * squashX, hgt = 56 * squashY;

    if (f.kind === 'panda') {
      // body
      g.fillStyle(0xf4f4f4, 1);
      g.fillRoundedRect(f.x - w/2, baseY - hgt, w, hgt, 10);
      // arms/legs patches
      g.fillStyle(0x18181b, 1);
      g.fillRoundedRect(f.x - w/2 - 4, baseY - hgt + 6, 9, 22, 4);
      g.fillRoundedRect(f.x + w/2 - 5, baseY - hgt + 6, 9, 22, 4);
      // head
      g.fillStyle(0xf4f4f4, 1);
      g.fillCircle(f.x, baseY - hgt - 16, 17);
      // ears
      g.fillStyle(0x18181b, 1);
      g.fillCircle(f.x - 13, baseY - hgt - 30, 7);
      g.fillCircle(f.x + 13, baseY - hgt - 30, 7);
      // eye patches
      g.fillEllipse(f.x - 7 * f.facing, baseY - hgt - 17, 8, 10);
      // facing nose
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(f.x + f.facing * 10, baseY - hgt - 14, 3);
    } else {
      // bear
      g.fillStyle(0x8b5a2b, 1);
      g.fillRoundedRect(f.x - w/2, baseY - hgt, w, hgt, 10);
      g.fillStyle(0x6b431f, 1);
      g.fillRoundedRect(f.x - w/2 - 4, baseY - hgt + 6, 9, 22, 4);
      g.fillRoundedRect(f.x + w/2 - 5, baseY - hgt + 6, 9, 22, 4);
      g.fillStyle(0x8b5a2b, 1);
      g.fillCircle(f.x, baseY - hgt - 16, 18);
      g.fillStyle(0x6b431f, 1);
      g.fillCircle(f.x - 14, baseY - hgt - 30, 7);
      g.fillCircle(f.x + 14, baseY - hgt - 30, 7);
      // muzzle, offset toward facing
      g.fillStyle(0xd8b98c, 1);
      g.fillEllipse(f.x + f.facing * 6, baseY - hgt - 12, 14, 10);
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(f.x + f.facing * 10, baseY - hgt - 12, 2.5);
    }
  }

  draw() {
    const g = this.g;
    g.clear();

    if (this.state !== 'playing') return;

    // arena bounds markers
    g.lineStyle(1, 0x1c2128, 0.6);
    g.lineBetween(ARENA_LEFT, GROUND_Y + 30, ARENA_LEFT, GROUND_Y - 200);
    g.lineBetween(ARENA_RIGHT, GROUND_Y + 30, ARENA_RIGHT, GROUND_Y - 200);

    this.drawFighter(this.p1);
    this.drawFighter(this.p2);
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#0a0a0d',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
