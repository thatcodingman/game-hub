<script>
/* =========================================================================
   LAST FIST
   Pick a fighter — close the distance, make
   something happen.

   Full move set: Punch, Kick, Block (held, chip damage now that health
   exists), Dodge (position-driven burst), Grapple (gated clinch entry —
   the start of the ground game, not the ground game itself yet). Health
   and a real KO/win condition are in. Characters are data-driven
   (CHARACTER_DEFS) — archetype comes from stat multipliers (health/
   damage/speed/recovery), not from needing bespoke art per animal; Tiger
   reuses Bear's body silhouette with its own palette as proof of that.

   The arena is a small 2.5D space: (ax, az) is the fighter's actual
   position on the ground plane (ax = left/right, az = forward/back —
   "forward" meaning deeper into the arena, away from camera). Jump is a
   THIRD, independent axis (height off the ground), layered on top of
   whatever (ax, az) position the fighter is standing at when they jump.
   Screen position is a projection of (ax, az) with a depth-based scale so
   fighters nearer the camera read as bigger/lower, farther as
   smaller/higher — enough of a perspective cue to sell "walking around"
   without needing real 3D.
   ========================================================================= */

const W = 960, H = 540;

// ARENA — an elliptical ground plane in arena-space units. ax is left/right,
// az is depth (negative = away from camera/"north", positive = toward
// camera/"south"). Deliberately a smaller range on the depth axis than the
// width axis — that asymmetry is what sells the camera angle.
const ARENA_CENTER_X = W / 2;
const ARENA_CENTER_Y = 300; // screen Y for az=0 (the "front-center" of the ring)
const ARENA_RX = 290;
const ARENA_RZ = 150;
const DEPTH_COMPRESS = 0.55; // vertical screen spread of the depth axis

const SEPARATION_MIN_DIST = 62; // fighters push apart rather than overlap, in arena units

const GRAVITY = 2100;
const MOVE_ACCEL = 1800;
const MOVE_MAX_SPEED = 230;
const GROUND_FRICTION = 2200;
const AIR_CONTROL_MULT = 0.6;
const JUMP_VELOCITY = -620; // paired with the higher gravity above: similar peak height to before, noticeably shorter hangtime — a snappier arc

// AI DIFFICULTY — every AI behavior knob lives here instead of as flat
// constants, so difficulty is genuinely "how the AI plays" (spacing
// discipline, attack frequency, block reliability) rather than a stat
// cheat layered on top of the same character system the player uses.
// approachMax deliberately sits just past KICK_RANGE (95) for all three —
// it used to be much wider (Easy was 190), which meant the AI settled
// into circling well before it was ever close enough to actually attack.
// That wasn't "easy," it was broken: it barely attacked at all, and spent
// most of its time orbiting near the arena walls instead of near the
// player. Difficulty should come from attack/block chance, not from the
// AI failing to reach attack range in the first place.
const DIFFICULTY_DEFS = {
  easy: {
    name: 'Easy',
    approachMin: 55, approachMax: 105,
    jumpChance: 0.22,
    punchChance: 0.65, kickChance: 0.42,
    blockChance: 0.15, // rarely reacts in time
    grappleChance: 0.15,
    groundStrikeChance: 0.5, groundEscapeChance: 0.7, groundBottomStrikeChance: 0.45
  },
  normal: {
    name: 'Normal',
    approachMin: 68, approachMax: 118,
    jumpChance: 0.35,
    punchChance: 0.9, kickChance: 0.6,
    blockChance: 0.5,
    grappleChance: 0.3,
    groundStrikeChance: 0.8, groundEscapeChance: 1.2, groundBottomStrikeChance: 0.9
  },
  hard: {
    name: 'Hard',
    approachMin: 72, approachMax: 112, // tighter spacing — harder to bait or kite
    jumpChance: 0.42,
    punchChance: 1.3, kickChance: 0.95,
    blockChance: 0.85, // reacts to incoming attacks reliably
    grappleChance: 0.48,
    groundStrikeChance: 1.15, groundEscapeChance: 1.6, groundBottomStrikeChance: 1.3
  }
};
const DIFFICULTY_ORDER = ['easy', 'normal', 'hard'];
const DIFFICULTY_KEY = 'lastFist_difficulty';

const GUARD_TRANSITION_MS = 100; // how long the raise/lower animation takes — quick, not an instant snap

// DODGE — a position-driven burst (not velocity-based) so it can't fight
// the normal movement speed clamp. Distance-covered eases out (fast start,
// settles at the end) over DODGE_DURATION_MS. No explicit invulnerability
// flag — a fast enough dash naturally moves you out of an attack's range,
// which is checked fresh every frame anyway.
const DODGE_DISTANCE = 110;
const DODGE_DURATION_MS = 160;
const DODGE_COOLDOWN_MS = 450;

const DOUBLE_TAP_WINDOW_MS = 300; // max gap between two "up" taps to count as a jump

// GRAPPLE — the entry point to the ground game, not the ground game itself.
// Deliberately gated, not automatic: pressing the button only does
// something if the real-world conditions are met (very close range,
// grounded, free to act, and the opponent isn't guarding against it).
// Outside that window it's a no-op — proximity alone never triggers it.
// What happens once clinched (takedowns, ground position, strikes from
// top) is future scope; for now the clinch is just a timed hold that
// locks both fighters together, then releases.
const GRAPPLE_RANGE = 68; // tighter than punch range — you have to actually close all the way in
const CLINCH_DISTANCE = 46; // locked separation once clinched
const CLINCH_DURATION_MS = 1800;
const CLINCH_BREAK_PUSH = 90; // distance pushed apart on release, so it doesn't immediately re-trigger

// GROUND — pressing GRAPPLE again while already clinched is the takedown
// attempt. Whoever presses first wins it and becomes top position; simple
// on purpose — "first to commit" is instantly understandable even though
// it's not a real wrestling exchange. Top can strike (PUNCH). Bottom has
// real agency, not just cover-and-pray: strike back (PUNCH, weaker, own
// cooldown, can't do it while blocking), cover up (BLOCK, reduces damage),
// or mash free (DODGE, repeated presses). Auto-returns to standing if
// nobody resolves it in time.
const GROUND_STRIKE_DAMAGE = 6;
const GROUND_STRIKE_COOLDOWN_MS = 400; // top can't spam-strike faster than this
const GROUND_BOTTOM_STRIKE_DAMAGE = 4; // weaker than top's — an awkward compromised-position strike
const GROUND_BOTTOM_STRIKE_COOLDOWN_MS = 550; // slower to recover than top's strike
const GROUND_BLOCK_REDUCTION = 0.35; // bottom's damage taken while covering up, as a fraction of normal
const GROUND_DURATION_MS = 2400; // auto-returns to standing if nobody resolves it — was 4000, way too long against ~400ms strike cooldowns
const GROUND_ESCAPE_PRESSES_NEEDED = 4; // bottom mashes DODGE this many times to escape early
const GROUND_POSE_TRANSITION_MS = 150; // how fast the squash-to-the-ground visual eases in/out

// PUNCH — the first Stage 2 move. windup (committed, no hit yet) -> active
// (the single frame window it can actually connect) -> recovery (can't act
// again yet). Movement is locked during windup+active only; recovery still
// lets you drift, since being rooted THAT long felt bad in testing... well,
// it hasn't been tested yet, that's exactly the point of shipping this alone.
const PUNCH_RANGE = 78; // arena units — a bit past SEPARATION_MIN_DIST, so closing distance actually matters
const PUNCH_WINDUP_MS = 95;
const PUNCH_ACTIVE_MS = 70;
const PUNCH_RECOVERY_MS = 250;
const PUNCH_PULLBACK = 8;   // how far the fist draws back during windup, unscaled
const PUNCH_EXTEND = 26;    // full thrust distance at the peak of active, unscaled
const PUNCH_RETRACT_MS = 120; // portion of recovery spent visually easing the fist back in
const PUNCH_KNOCKBACK = 150; // velocity impulse on the defender; friction bleeds it off naturally

// KICK — longer reach, slower windup, bigger recovery, harder knockback.
// Deliberately the opposite trade-off from punch (quick/short vs
// slow/long) so the two moves already feel distinct with zero new rules,
// just different numbers through the same system.
const KICK_RANGE = 95;
const KICK_WINDUP_MS = 145;
const KICK_ACTIVE_MS = 85;
const KICK_RECOVERY_MS = 330;
const KICK_PULLBACK = 10;
const KICK_EXTEND = 34;
const KICK_RETRACT_MS = 145;
const KICK_KNOCKBACK = 220;

// JUMP ATTACK — triggered by PUNCH or KICK while airborne instead of
// grounded (same buttons, updateAttack routes on f.grounded). Fast windup
// since jumping is already the commitment; biggest knockback and damage of
// the three strikes, since you can't dodge or reposition out of a bad jump
// the way you can on the ground — the risk should have a real payoff.
const JUMP_ATTACK_RANGE = 88;
const JUMP_ATTACK_WINDUP_MS = 60;
const JUMP_ATTACK_ACTIVE_MS = 90;
const JUMP_ATTACK_RECOVERY_MS = 380;
const JUMP_ATTACK_PULLBACK = 6;
const JUMP_ATTACK_EXTEND = 30;
const JUMP_ATTACK_RETRACT_MS = 130;
const JUMP_ATTACK_KNOCKBACK = 260;

// Damage is separate from knockback — knockback is physical push, damage is
// what actually threatens a KO. Values are the BASE; each character's
// damageMult scales them (see CHARACTER_DEFS).
const PUNCH_DAMAGE = 8;
const KICK_DAMAGE = 13;
const JUMP_ATTACK_DAMAGE = 14;
const CHIP_DAMAGE = 2.5; // guard isn't free anymore now that health exists — small cost even on a clean block
const HEALTH_BASE = 100; // scaled per-character by healthMult

const ATTACK_DEFS = {
  punch: { range: PUNCH_RANGE, windup: PUNCH_WINDUP_MS, active: PUNCH_ACTIVE_MS, recovery: PUNCH_RECOVERY_MS, knockback: PUNCH_KNOCKBACK, pullback: PUNCH_PULLBACK, extend: PUNCH_EXTEND, retract: PUNCH_RETRACT_MS, damage: PUNCH_DAMAGE },
  kick:  { range: KICK_RANGE,  windup: KICK_WINDUP_MS,  active: KICK_ACTIVE_MS,  recovery: KICK_RECOVERY_MS,  knockback: KICK_KNOCKBACK,  pullback: KICK_PULLBACK,  extend: KICK_EXTEND,  retract: KICK_RETRACT_MS,  damage: KICK_DAMAGE },
  jumpAttack: { range: JUMP_ATTACK_RANGE, windup: JUMP_ATTACK_WINDUP_MS, active: JUMP_ATTACK_ACTIVE_MS, recovery: JUMP_ATTACK_RECOVERY_MS, knockback: JUMP_ATTACK_KNOCKBACK, pullback: JUMP_ATTACK_PULLBACK, extend: JUMP_ATTACK_EXTEND, retract: JUMP_ATTACK_RETRACT_MS, damage: JUMP_ATTACK_DAMAGE }
};

// CHARACTER ROSTER — data-driven so adding a fighter later is a new entry
// here, not new engineering. bodyStyle picks which shape template to draw
// (see drawFighter) — several animals share one template with a different
// palette AND different bodyScale/earScale (proportion multipliers), so a
// leaner/bigger-eared monkey and a stockier/small-eared crocodile can both
// come from the same two skeletons without needing bespoke geometry per
// animal. grappleRangeMult/groundDamageMult default to 1 for everyone
// except the Grappler archetype, which is the one place the stat system
// reaches into the grapple/ground-game mechanics specifically — before
// this, every character grappled identically. jumpVelocityMult/
// jumpAttackMult are the same idea for the Aerial archetype (Kangaroo) —
// before this, Jump Attack had zero character identity either. unlockAt is
// the games-played count required to play as them — persisted across sessions.
const CHARACTER_DEFS = {
  panda: {
    name: 'Panda', archetype: 'Defender', bodyStyle: 'panda',
    healthMult: 1.15, damageMult: 0.9, speedMult: 0.95, recoveryMult: 1.05,

  },
  bear: {

    unlockAt: 3
  },
  tiger: {

    bodyColor: 0xe8862c, gloveColor: 0x1a1a1a, darkColor: 0x1a1a1a, muzzleColor: 0xf4f4f4,
    bodyScale: 1, earScale: 1, grappleRangeMult: 1, groundDamageMult: 1, jumpVelocityMult: 1, jumpAttackMult: 1, widthScale: 1, hasHorn: false,
    unlockAt: 8
  },
  monkey: {
    name: 'Monkey', archetype: 'Quick', bodyStyle: 'panda',
    healthMult: 0.75, damageMult: 0.85, speedMult: 1.25, recoveryMult: 0.75,
    bodyColor: 0x8b6b4a, gloveColor: 0xffd23f, darkColor: 0x3d2b1a,
    bodyScale: 0.88, earScale: 1.35, grappleRangeMult: 1, groundDamageMult: 1, jumpVelocityMult: 1, jumpAttackMult: 1, widthScale: 1, hasHorn: false, // leaner, bigger round ears
    unlockAt: 15
  },
  crocodile: {

    healthMult: 1.1, damageMult: 1.0, speedMult: 0.85, recoveryMult: 1.0,
    bodyColor: 0x4a7a3d, gloveColor: 0xd8d840, darkColor: 0x2f4a26, muzzleColor: 0x6b9a52,
    bodyScale: 1.05, earScale: 0.6, // stockier, small reptilian ears
    grappleRangeMult: 1.35, groundDamageMult: 1.25, jumpVelocityMult: 1, jumpAttackMult: 1, widthScale: 1, hasHorn: false, // the actual point of this archetype — closes distance to grapple and hits harder once there
    unlockAt: 25
  },
  wolf: {
    name: 'Wolf', archetype: 'Striker', bodyStyle: 'bear',
    healthMult: 0.9, damageMult: 1.15, speedMult: 1.15, recoveryMult: 0.8, // hit-and-run variant of Tiger — faster in and out, less raw damage
    bodyColor: 0x8a8f99, gloveColor: 0xe8ecf1, darkColor: 0x3a3f4a, muzzleColor: 0xd8dce0,
    bodyScale: 1, earScale: 1.1, grappleRangeMult: 1, groundDamageMult: 1, jumpVelocityMult: 1, jumpAttackMult: 1, widthScale: 1, hasHorn: false,

  },
  rhino: {

    bodyColor: 0x9a9a95, gloveColor: 0x6b6b66, darkColor: 0x5a5a55, muzzleColor: 0xb5b5b0,
    bodyScale: 1.05, earScale: 0.7,

  },

    bodyColor: 0xd97b3f, gloveColor: 0xf4f4f4, darkColor: 0x8a4a1f,

    unlockAt: 55
  },

    bodyColor: 0x2b2b2e, gloveColor: 0x4a4a50, darkColor: 0x1a1a1c, muzzleColor: 0x4a3a35,
    bodyScale: 1.2, earScale: 0.65, // biggest body in the roster
    grappleRangeMult: 1.2, groundDamageMult: 1.15, jumpVelocityMult: 1, jumpAttackMult: 1, widthScale: 1, hasHorn: false,
    unlockAt: 65
  },
  kangaroo: {
    name: 'Kangaroo', archetype: 'Aerial', bodyStyle: 'panda',
    healthMult: 0.95, damageMult: 1.0, speedMult: 1.1, recoveryMult: 0.95,
    bodyColor: 0xc9975f, gloveColor: 0xf4f4f4, darkColor: 0x7a5a3a,
    bodyScale: 1.05, earScale: 1.4,
    grappleRangeMult: 1, groundDamageMult: 1,
    jumpVelocityMult: 1.2, jumpAttackMult: 1.5, widthScale: 1, hasHorn: false, // higher jumps, and Jump Attack hits noticeably harder — the actual point of this archetype
    unlockAt: 80
  }
};
const CHARACTER_ORDER = ['panda', 'bear', 'tiger', 'monkey', 'crocodile', 'wolf', 'rhino', 'fox', 'gorilla', 'kangaroo'];
const GAMES_PLAYED_KEY = 'lastFist_gamesPlayed';

// scales an ATTACK_DEFS entry by a character's recoveryMult — windup/
// active/recovery/retract get faster or slower per-character; range,
// knockback and damage don't (those already get their own multiplier
// elsewhere, or are archetype-neutral by design)
function getEffectiveDef(f, type) {
  const base = ATTACK_DEFS[type];
  const rm = f.character.recoveryMult;
  return {
    range: base.range, knockback: base.knockback, pullback: base.pullback, extend: base.extend, damage: base.damage,
    windup: base.windup * rm, active: base.active * rm, recovery: base.recovery * rm, retract: base.retract * rm
  };
}

function loadGamesPlayed() {
  try { return parseInt(localStorage.getItem(GAMES_PLAYED_KEY), 10) || 0; }
  catch (err) { return 0; }
}

function saveGamesPlayed(n) {
  try { localStorage.setItem(GAMES_PLAYED_KEY, String(n)); }
  catch (err) { /* non-fatal — unlocks just won't persist this session */ }
}

function isUnlocked(key, gamesPlayed) {
  return gamesPlayed >= CHARACTER_DEFS[key].unlockAt;
}

function loadDifficulty() {
  try {
    const v = localStorage.getItem(DIFFICULTY_KEY);
    return DIFFICULTY_DEFS[v] ? v : 'normal';
  } catch (err) { return 'normal'; }
}

function saveDifficulty(key) {
  try { localStorage.setItem(DIFFICULTY_KEY, key); }
  catch (err) { /* non-fatal — just won't be remembered next time */ }
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (err) { /* non-fatal */ }
}

function approachZero(v, delta) {
  if (v > 0) return Math.max(0, v - delta);
  if (v < 0) return Math.min(0, v + delta);
  return 0;
}

// clamps an (ax, az) point to inside the arena ellipse, preserving direction
function clampToArena(ax, az) {
  const nx = ax / ARENA_RX, nz = az / ARENA_RZ;
  const d = Math.hypot(nx, nz);
  if (d > 1) return { ax: ax / d, az: az / d };
  return { ax, az };
}

function project(ax, az) {
  return { sx: ARENA_CENTER_X + ax, sy: ARENA_CENTER_Y + az * DEPTH_COMPRESS };
}

// nearer the camera (larger az) reads bigger; farther back reads smaller
function depthScale(az) {
  const t = (az + ARENA_RZ) / (ARENA_RZ * 2); // 0..1
  return 0.95 + t * 0.5; // bumped up from 0.8-1.2 — fighters were reading too small against the arena
}

// One continuous limb-offset curve across all three attack phases — pulls
// back during windup, thrusts out (ease-in, for a snappy feel) during
// active, eases back in during the start of recovery. Each phase's formula
// is built to land on exactly the same value the next phase starts from,
// so there's no positional snap at the handoffs. Works for punch or kick —
// def is one of ATTACK_DEFS's entries, so it's just different numbers
// through the same curve.
function attackOffset(attackState, attackTimer, def) {
  if (attackState === 'windup') {
    const p = 1 - attackTimer / def.windup;
    return -def.pullback * p;
  }
  if (attackState === 'active') {
    const p = 1 - attackTimer / def.active;
    const eased = p * p; // ease-in — starts slow (still near the pulled-back pose), snaps at the end
    return -def.pullback + (def.extend + def.pullback) * eased;
  }
  if (attackState === 'recovery') {
    const retractDur = Math.min(def.retract, def.recovery);
    const elapsed = def.recovery - attackTimer;
    if (elapsed >= retractDur) return null; // fully retracted — normal idle pose takes over
    const p = Phaser.Math.Clamp(elapsed / retractDur, 0, 1);
    return def.extend * (1 - p);
  }
  return null;
}

function makeFighter(ax, az, characterKey, facing) {
  const character = CHARACTER_DEFS[characterKey];
  const maxHealth = HEALTH_BASE * character.healthMult;
  return {
    ax, az, vax: 0, vaz: 0,
    jumpZ: 0, vJump: 0, grounded: true,
    facing,
    characterKey, character, walkBob: 0, squash: 0,
    maxHealth, health: maxHealth,
    attackType: null, attackState: 'idle', attackTimer: 0, attackHasHit: false, hitFlash: 0,
    guarding: false, guardAmount: 0,
    groundPoseAmount: 0,
    dodging: false, dodgeTimer: 0, dodgeStartAx: ax, dodgeStartAz: az, dodgeDirX: 0, dodgeDirZ: 0, dodgeCooldown: 0,
    lastUpTapAt: -9999
  };
}

// SCREEN-RELATIVE INPUT — left/right/up/down always mean the same physical
// direction on screen, regardless of which way the fighter happens to be
// facing. A facing-relative version (forward = toward opponent, strafe =
// perpendicular) was tried here, but it made the dpad unpredictable: "left"
// could visibly push you toward the right side of the screen whenever your
// facing wasn't screen-aligned, which reads as broken controls, not smart
// ones. Auto-facing the opponent (see updateFacing) is still purely visual
// and is unaffected by this.
function axisMoveVector(upPressed, downPressed, leftPressed, rightPressed) {
  let mx = (rightPressed ? 1 : 0) - (leftPressed ? 1 : 0);
  let mz = (downPressed ? 1 : 0) - (upPressed ? 1 : 0);
  if (mx !== 0 && mz !== 0) { mx *= Math.SQRT1_2; mz *= Math.SQRT1_2; }
  return { mx, mz };
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0a0d');
    this.g = this.add.graphics();

    this.mode = null; // 'ai' | '2p'
    this.state = 'menu';
    this.aiJumpCooldown = 1.5;
    this.aiCircleTimer = 0;
    this.aiCircleDir = 1;
    this.aiWillBlock = false;
    this.aiPrevP1AttackState = 'idle';
    this.prevTouchUp = { p1: false, p2: false }; // rising-edge tracking for the touch dpad's up button, used by double-tap-jump
    this.clinchActive = false;
    this.clinchTimer = 0;
    this.groundActive = false;
    this.groundTimer = 0;
    this.groundTopIsP1 = true;
    this.groundStrikeCooldown = 0;
    this.groundBottomStrikeCooldown = 0;
    this.groundEscapeProgress = 0;
    this.gamesPlayed = loadGamesPlayed();
    this.difficulty = loadDifficulty();
    this.rosterBrowseOnly = false;

    this.buildHUD();
    this.buildMenu();
    this.buildCharacterSelect();
    this.buildDifficultySelect();
    this.buildRoundOverUI();
    this.buildControls();

    this.keys = this.input.keyboard.addKeys({
      p1Up: Phaser.Input.Keyboard.KeyCodes.W,
      p1Down: Phaser.Input.Keyboard.KeyCodes.S,
      p1Left: Phaser.Input.Keyboard.KeyCodes.A,
      p1Right: Phaser.Input.Keyboard.KeyCodes.D,
      p1Jump: Phaser.Input.Keyboard.KeyCodes.SPACE,
      p1Punch: Phaser.Input.Keyboard.KeyCodes.F,
      p1Kick: Phaser.Input.Keyboard.KeyCodes.G,
      p1Block: Phaser.Input.Keyboard.KeyCodes.E,
      p1Dodge: Phaser.Input.Keyboard.KeyCodes.R,
      p1Grapple: Phaser.Input.Keyboard.KeyCodes.T,
      // Single-player (VS AI) uses an entirely separate scheme — arrows +
      // 1/2/3/Q/W — not WASD+FGERT with arrows layered on top like before.
      // Only read in VS AI mode (see update()); local 2P still uses WASD
      // (above) vs Arrows (below) as two genuinely separate players.
      p1UpAlt: Phaser.Input.Keyboard.KeyCodes.UP,
      p1DownAlt: Phaser.Input.Keyboard.KeyCodes.DOWN,
      p1LeftAlt: Phaser.Input.Keyboard.KeyCodes.LEFT,
      p1RightAlt: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      p1PunchAlt: Phaser.Input.Keyboard.KeyCodes.ONE,
      p1KickAlt: Phaser.Input.Keyboard.KeyCodes.TWO,
      p1BlockAlt: Phaser.Input.Keyboard.KeyCodes.THREE,
      p1DodgeAlt: Phaser.Input.Keyboard.KeyCodes.Q,
      p1GrappleAlt: Phaser.Input.Keyboard.KeyCodes.W,
      p2Up: Phaser.Input.Keyboard.KeyCodes.UP,
      p2Down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      p2Left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      p2Right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      p2Jump: Phaser.Input.Keyboard.KeyCodes.FORWARD_SLASH,

  buildMenu() {
    const btnY = 240, btnW = 220, btnH = 64, gap = 20;
    this.menuButtons = [];

      { label: 'VS AI', x: W/2 - btnW/2 - gap/2, mode: 'ai' },

      }).setOrigin(0.5);

  buildCharacterSelect() {
    const perRow = 5, btnW = 160, btnH = 76, gapX = 16, gapY = 22;
    const row1Y = 214, row2Y = row1Y + btnH + gapY;
    const totalW = btnW * perRow + gapX * (perRow - 1);
    const startX = W/2 - totalW/2 + btnW/2;
    this.selectButtons = [];
    this.selectCharObjs = [];
    CHARACTER_ORDER.forEach((key, i) => {
      const c = CHARACTER_DEFS[key];
      const col = i % perRow, row = Math.floor(i / perRow);
      const x = startX + col * (btnW + gapX);
      const y = row === 0 ? row1Y : row2Y;
      const bg = this.add.rectangle(x, y, btnW, btnH, 0x14161c, 0.9).setStrokeStyle(2, c.gloveColor, 0.8).setVisible(false);
      // a real color swatch, not just the thin border — the border alone
      // uses gloveColor, which is near-black for some characters (Tiger)
      // and nearly invisible against the dark background, making it easy
      // to misclick in a cramped 10-card grid without a clearer cue
      const swatch = this.add.circle(x - btnW/2 + 16, y, 8, c.bodyColor).setStrokeStyle(1, 0x000000, 0.4).setVisible(false);
      const nameLabel = this.add.text(x, y - 14, c.name.toUpperCase(), {
        fontFamily: 'Arial Black, Arial', fontSize: '14px', color: '#e8ecf1'
      }).setOrigin(0.5).setVisible(false);
      const archLabel = this.add.text(x, y + 13, c.archetype, {
        fontFamily: 'Arial', fontSize: '11px', color: '#7f8a9a', align: 'center', wordWrap: { width: btnW - 16 }
      }).setOrigin(0.5).setVisible(false);
      bg.setInteractive({ useHandCursor: true });
      bg.on('pointerdown', () => this.onCharacterPicked(key));
      this.selectButtons.push(bg, swatch, nameLabel, archLabel);
      this.selectCharObjs.push({ key, bg, swatch, nameLabel, archLabel });
    });

    // BACK — shown during both the pick-a-fighter flow and the standalone
    // roster browse, since neither had any way out except finishing them
    this.selectBackBtn = this.add.text(20, 16, '\u2190 BACK', {
      fontFamily: 'Arial Black, Arial', fontSize: '13px', color: '#7f8a9a'
    }).setInteractive({ useHandCursor: true }).setVisible(false);
    this.selectBackBtn.on('pointerdown', () => this.returnToMenu());

    // dev/testing only — bypasses the lock check by setting gamesPlayed
    // high, doesn't touch unlockAt thresholds at all, so real player
    // progression is completely unaffected once this isn't needed anymore
    this.unlockAllBtn = this.add.text(W - 20, 16, 'UNLOCK ALL (TEST)', {
      fontFamily: 'Arial Black, Arial', fontSize: '11px', color: '#5be37b'
    }).setOrigin(1, 0).setInteractive({ useHandCursor: true }).setVisible(false);
    this.unlockAllBtn.on('pointerdown', () => {
      this.gamesPlayed = 999;
      saveGamesPlayed(999);
      this.refreshCharacterButtons();
      if (this.state === 'roster') {
        this.subText.setText(`${this.gamesPlayed} games played \u2014 win matches to unlock more`);
      }
    });
  }

  // re-applies lock/unlock appearance — called every time the select or
  // roster screen is shown, since gamesPlayed can have changed since these
  // buttons were built once at load time
  refreshCharacterButtons() {
    this.selectCharObjs.forEach(obj => {
      const c = CHARACTER_DEFS[obj.key];
      const unlocked = isUnlocked(obj.key, this.gamesPlayed);
      if (unlocked) {
        obj.bg.setStrokeStyle(2, c.gloveColor, 0.8).setFillStyle(0x14161c, 0.9);
        obj.swatch.setFillStyle(c.bodyColor).setAlpha(1);
        obj.nameLabel.setText(c.name.toUpperCase()).setColor('#e8ecf1');
        obj.archLabel.setText(c.archetype).setColor('#7f8a9a');
      } else {
        const remaining = c.unlockAt - this.gamesPlayed;
        obj.bg.setStrokeStyle(2, 0x3a3f4a, 0.6).setFillStyle(0x0e0f12, 0.9);
        obj.swatch.setFillStyle(0x3a3f4a).setAlpha(0.5);
        obj.nameLabel.setText('LOCKED').setColor('#555a66');
        obj.archLabel.setText(`${remaining} game${remaining === 1 ? '' : 's'} to unlock`).setColor('#555a66');
      }
    });
  }

  setSelectVisible(visible) {
    this.selectButtons.forEach(o => o.setVisible(visible));
    this.selectBackBtn.setVisible(visible);
    this.unlockAllBtn.setVisible(visible);
  }

    const startX = W/2 - totalW/2 + btnW/2;

      }).setOrigin(0.5).setVisible(false);

  setDifficultyVisible(visible) {

    this.selectBackBtn.setVisible(visible);

  buildRoundOverUI() {
    const btnY = 260, btnW = 180, btnH = 56, gap = 20;
    const rematchBg = this.add.rectangle(W/2 - btnW/2 - gap/2, btnY, btnW, btnH, 0x14161c, 0.9).setStrokeStyle(2, 0x5be37b, 0.8).setVisible(false);
    const rematchLabel = this.add.text(W/2 - btnW/2 - gap/2, btnY, 'REMATCH', { fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1' }).setOrigin(0.5).setVisible(false);
    const menuBg2 = this.add.rectangle(W/2 + btnW/2 + gap/2, btnY, btnW, btnH, 0x14161c, 0.9).setStrokeStyle(2, 0x7f8a9a, 0.8).setVisible(false);
    const menuLabel2 = this.add.text(W/2 + btnW/2 + gap/2, btnY, 'MAIN MENU', { fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1' }).setOrigin(0.5).setVisible(false);
    rematchBg.setInteractive({ useHandCursor: true });
    rematchBg.on('pointerdown', () => { this.setRoundOverVisible(false); this.startMatch(this.mode); });
    menuBg2.setInteractive({ useHandCursor: true });
    menuBg2.on('pointerdown', () => { this.setRoundOverVisible(false); this.returnToMenu(); });
    this.roundOverButtons = [rematchBg, rematchLabel, menuBg2, menuLabel2];
