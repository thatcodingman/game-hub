<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Last Fist — The Arcade</title>
<style>
  html, body {
    margin:0; padding:0; background:#0a0a0d; overflow:hidden; height:100%;
    overscroll-behavior: none;
  }
  #game-container { width:100vw; height:100vh; }
  canvas {
    display:block; touch-action:none;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   LAST FIST — STAGE 1: MOVEMENT ONLY
   Panda vs Bear.

   No punches, no kicks, no blocking, no health, no archetypes yet — those
   are Stages 2-4. This stage is purely: can you actually move your animal
   around an opponent in a real 2D arena (strafe AND depth, not just a
   left-right line), jump, and have it feel responsive on mobile.

   The arena is a small 2.5D space: (ax, az) is the fighter's actual
   position on the ground plane (ax = left/right, az = forward/back —
   "forward" meaning deeper into the arena, away from camera). Jump is a
   THIRD, independent axis (height off the ground), layered on top of
   whatever (ax, az) position the fighter is standing at when they jump.
   Screen position is a projection of (ax, az) with a depth-based scale so
   fighters nearer the camera read as bigger/lower, farther as
   smaller/higher — enough of a perspective cue to sell "walking around"
   without needing real 3D.
   ========================================================================= */

const W = 960, H = 540;

// ARENA — an elliptical ground plane in arena-space units. ax is left/right,
// az is depth (negative = away from camera/"north", positive = toward
// camera/"south"). Deliberately a smaller range on the depth axis than the
// width axis — that asymmetry is what sells the camera angle.
const ARENA_CENTER_X = W / 2;
const ARENA_CENTER_Y = 300; // screen Y for az=0 (the "front-center" of the ring)
const ARENA_RX = 290;
const ARENA_RZ = 150;
const DEPTH_COMPRESS = 0.55; // vertical screen spread of the depth axis

const SEPARATION_MIN_DIST = 62; // fighters push apart rather than overlap, in arena units

const GRAVITY = 2100;
const MOVE_ACCEL = 1800;
const MOVE_MAX_SPEED = 230;
const GROUND_FRICTION = 2200;
const AIR_CONTROL_MULT = 0.6;
const JUMP_VELOCITY = -620; // paired with the higher gravity above: similar peak height to before, noticeably shorter hangtime — a snappier arc

const AI_APPROACH_MIN = 75;   // AI backs off if closer than this
const AI_APPROACH_MAX = 160;  // AI closes in if farther than this
const AI_JUMP_CHANCE_PER_SEC = 0.35;
const AI_PUNCH_CHANCE_PER_SEC = 0.9; // fairly eager to punch once in range — the point is proving hit detection
const AI_KICK_CHANCE_PER_SEC = 0.6; // slightly less eager than punch — kick is the bigger commitment

// PUNCH — the first Stage 2 move. windup (committed, no hit yet) -> active
// (the single frame window it can actually connect) -> recovery (can't act
// again yet). Movement is locked during windup+active only; recovery still
// lets you drift, since being rooted THAT long felt bad in testing... well,
// it hasn't been tested yet, that's exactly the point of shipping this alone.
const PUNCH_RANGE = 78; // arena units — a bit past SEPARATION_MIN_DIST, so closing distance actually matters
const PUNCH_WINDUP_MS = 120;
const PUNCH_ACTIVE_MS = 90;
const PUNCH_RECOVERY_MS = 320;
const PUNCH_PULLBACK = 8;   // how far the fist draws back during windup, unscaled
const PUNCH_EXTEND = 26;    // full thrust distance at the peak of active, unscaled
const PUNCH_RETRACT_MS = 150; // portion of recovery spent visually easing the fist back in
const PUNCH_KNOCKBACK = 150; // velocity impulse on the defender; friction bleeds it off naturally

// KICK — longer reach, slower windup, bigger recovery, harder knockback.
// Deliberately the opposite trade-off from punch (quick/short vs
// slow/long) so the two moves already feel distinct with zero new rules,
// just different numbers through the same system.
const KICK_RANGE = 95;
const KICK_WINDUP_MS = 180;
const KICK_ACTIVE_MS = 110;
const KICK_RECOVERY_MS = 420;
const KICK_PULLBACK = 10;
const KICK_EXTEND = 34;
const KICK_RETRACT_MS = 180;
const KICK_KNOCKBACK = 220;

const ATTACK_DEFS = {
  punch: { range: PUNCH_RANGE, windup: PUNCH_WINDUP_MS, active: PUNCH_ACTIVE_MS, recovery: PUNCH_RECOVERY_MS, knockback: PUNCH_KNOCKBACK, pullback: PUNCH_PULLBACK, extend: PUNCH_EXTEND, retract: PUNCH_RETRACT_MS },
  kick:  { range: KICK_RANGE,  windup: KICK_WINDUP_MS,  active: KICK_ACTIVE_MS,  recovery: KICK_RECOVERY_MS,  knockback: KICK_KNOCKBACK,  pullback: KICK_PULLBACK,  extend: KICK_EXTEND,  retract: KICK_RETRACT_MS }
};

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (err) { /* non-fatal */ }
}

function approachZero(v, delta) {
  if (v > 0) return Math.max(0, v - delta);
  if (v < 0) return Math.min(0, v + delta);
  return 0;
}

// clamps an (ax, az) point to inside the arena ellipse, preserving direction
function clampToArena(ax, az) {
  const nx = ax / ARENA_RX, nz = az / ARENA_RZ;
  const d = Math.hypot(nx, nz);
  if (d > 1) return { ax: ax / d, az: az / d };
  return { ax, az };
}

function project(ax, az) {
  return { sx: ARENA_CENTER_X + ax, sy: ARENA_CENTER_Y + az * DEPTH_COMPRESS };
}

// nearer the camera (larger az) reads bigger; farther back reads smaller
function depthScale(az) {
  const t = (az + ARENA_RZ) / (ARENA_RZ * 2); // 0..1
  return 0.95 + t * 0.5; // bumped up from 0.8-1.2 — fighters were reading too small against the arena
}

// One continuous limb-offset curve across all three attack phases — pulls
// back during windup, thrusts out (ease-in, for a snappy feel) during
// active, eases back in during the start of recovery. Each phase's formula
// is built to land on exactly the same value the next phase starts from,
// so there's no positional snap at the handoffs. Works for punch or kick —
// def is one of ATTACK_DEFS's entries, so it's just different numbers
// through the same curve.
function attackOffset(attackState, attackTimer, def) {
  if (attackState === 'windup') {
    const p = 1 - attackTimer / def.windup;
    return -def.pullback * p;
  }
  if (attackState === 'active') {
    const p = 1 - attackTimer / def.active;
    const eased = p * p; // ease-in — starts slow (still near the pulled-back pose), snaps at the end
    return -def.pullback + (def.extend + def.pullback) * eased;
  }
  if (attackState === 'recovery') {
    const retractDur = Math.min(def.retract, def.recovery);
    const elapsed = def.recovery - attackTimer;
    if (elapsed >= retractDur) return null; // fully retracted — normal idle pose takes over
    const p = Phaser.Math.Clamp(elapsed / retractDur, 0, 1);
    return def.extend * (1 - p);
  }
  return null;
}

function makeFighter(ax, az, kind) {
  return {
    ax, az, vax: 0, vaz: 0,
    jumpZ: 0, vJump: 0, grounded: true,
    facing: kind === 'panda' ? 1 : -1,
    kind, walkBob: 0, squash: 0,
    attackType: null, attackState: 'idle', attackTimer: 0, attackHasHit: false, hitFlash: 0
  };
}

// SCREEN-RELATIVE INPUT — left/right/up/down always mean the same physical
// direction on screen, regardless of which way the fighter happens to be
// facing. A facing-relative version (forward = toward opponent, strafe =
// perpendicular) was tried here, but it made the dpad unpredictable: "left"
// could visibly push you toward the right side of the screen whenever your
// facing wasn't screen-aligned, which reads as broken controls, not smart
// ones. Auto-facing the opponent (see updateFacing) is still purely visual
// and is unaffected by this.
function axisMoveVector(upPressed, downPressed, leftPressed, rightPressed) {
  let mx = (rightPressed ? 1 : 0) - (leftPressed ? 1 : 0);
  let mz = (downPressed ? 1 : 0) - (upPressed ? 1 : 0);
  if (mx !== 0 && mz !== 0) { mx *= Math.SQRT1_2; mz *= Math.SQRT1_2; }
  return { mx, mz };
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0a0d');
    this.g = this.add.graphics();

    this.mode = null; // 'ai' | '2p'
    this.state = 'menu';
    this.aiJumpCooldown = 1.5;
    this.aiCircleTimer = 0;
    this.aiCircleDir = 1;

    this.buildHUD();
    this.buildMenu();
    this.buildControls();

    this.keys = this.input.keyboard.addKeys({
      p1Up: Phaser.Input.Keyboard.KeyCodes.W,
      p1Down: Phaser.Input.Keyboard.KeyCodes.S,
      p1Left: Phaser.Input.Keyboard.KeyCodes.A,
      p1Right: Phaser.Input.Keyboard.KeyCodes.D,
      p1Jump: Phaser.Input.Keyboard.KeyCodes.SPACE,
      p1Punch: Phaser.Input.Keyboard.KeyCodes.F,
      p1Kick: Phaser.Input.Keyboard.KeyCodes.G,
      // P1 also gets a second, arrow-key binding — only actually read in
      // VS AI mode (see update()), where there's no P2 to conflict with.
      // Without this, "arrows don't move me" is exactly what happens the
      // moment someone tries arrows out of habit while solo vs AI.
      p1UpAlt: Phaser.Input.Keyboard.KeyCodes.UP,
      p1DownAlt: Phaser.Input.Keyboard.KeyCodes.DOWN,
      p1LeftAlt: Phaser.Input.Keyboard.KeyCodes.LEFT,
      p1RightAlt: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      p1PunchAlt: Phaser.Input.Keyboard.KeyCodes.PERIOD,
      p1KickAlt: Phaser.Input.Keyboard.KeyCodes.COMMA,
      p2Up: Phaser.Input.Keyboard.KeyCodes.UP,
      p2Down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      p2Left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      p2Right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      p2Jump: Phaser.Input.Keyboard.KeyCodes.FORWARD_SLASH,
      p2Punch: Phaser.Input.Keyboard.KeyCodes.PERIOD,
      p2Kick: Phaser.Input.Keyboard.KeyCodes.COMMA
    });
  }

  buildHUD() {
    this.modeText = this.add.text(W/2, 16, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '14px', color: '#7f8a9a'
    }).setOrigin(0.5, 0).setVisible(false);

    this.menuBtn = this.add.text(W - 16, 16, 'MENU', {
      fontFamily: 'Arial Black, Arial', fontSize: '13px', color: '#7f8a9a'
    }).setOrigin(1, 0).setInteractive({ useHandCursor: true }).setVisible(false);
    this.menuBtn.on('pointerdown', () => this.returnToMenu());

    this.centerText = this.add.text(W/2, 120, 'LAST FIST', {
      fontFamily: 'Arial Black, Arial', fontSize: '36px', color: '#e8ecf1', align: 'center'
    }).setOrigin(0.5).setShadow(0, 2, '#000', 6, true, true);
    this.subText = this.add.text(W/2, 168,
      'Panda vs Bear \u2014 punch and kick are in\ncircle, close distance, and land one. Blocks and dodges come next.', {
      fontFamily: 'Arial', fontSize: '14px', color: '#7f8a9a', align: 'center', wordWrap: { width: 560 }
    }).setOrigin(0.5);
  }

  buildMenu() {
    const btnY = 240, btnW = 220, btnH = 64, gap = 20;
    this.menuButtons = [];
    const defs = [
      { label: 'VS AI', x: W/2 - btnW/2 - gap/2, mode: 'ai' },
      { label: 'VS PLAYER 2', x: W/2 + btnW/2 + gap/2, mode: '2p' }
    ];
    defs.forEach(def => {
      const bg = this.add.rectangle(def.x, btnY, btnW, btnH, 0x14161c, 0.9).setStrokeStyle(2, 0x4fd1ff, 0.7);
      const label = this.add.text(def.x, btnY, def.label, {
        fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#e8ecf1'
      }).setOrigin(0.5);
      bg.setInteractive({ useHandCursor: true });
      bg.on('pointerdown', () => this.startMatch(def.mode));
      this.menuButtons.push(bg, label);
    });
  }

  buildControls() {
    this.touchState = {};
    // P1 — bottom-left: dpad on the outside edge, jump/punch/kick toward center
    this.p1Controls = this.buildControlCluster({ dpadX: 100, jumpX: 190, punchX: 258, kickX: 326, hint: 'WASD + SPACE jump + F punch + G kick', key: 'p1' });
    // P2 — bottom-right, mirrored
    this.p2Controls = this.buildControlCluster({ dpadX: W - 100, jumpX: W - 190, punchX: W - 258, kickX: W - 326, hint: '\u2190\u2191\u2192\u2193 + / jump + . punch + , kick', key: 'p2' });
  }

  buildControlCluster({ dpadX, jumpX, punchX, kickX, hint, key }) {
    const dpadY = H - 74, btn = 34, gap = 4;
    this.touchState[key] = { up: false, down: false, left: false, right: false, jumpPressed: false, punchPressed: false, kickPressed: false };

    const mkBtn = (x, y, label, size, strokeColor) => {
      const bg = this.add.rectangle(x, y, size, size, 0x14161c, 0.9).setStrokeStyle(2, strokeColor || 0x4fd1ff, 0.6);
      const t = this.add.text(x, y, label, { fontFamily: 'Arial Black, Arial', fontSize: size > 44 ? '15px' : '14px', color: '#e8ecf1' }).setOrigin(0.5);
      return { bg, t };
    };
    const up = mkBtn(dpadX, dpadY - btn - gap, '\u25b2', btn);
    const down = mkBtn(dpadX, dpadY + btn + gap, '\u25bc', btn);
    const left = mkBtn(dpadX - btn - gap, dpadY, '\u25c0', btn);
    const right = mkBtn(dpadX + btn + gap, dpadY, '\u25b6', btn);
    const jump = mkBtn(jumpX, dpadY, 'JUMP', 48);
    const punch = mkBtn(punchX, dpadY, 'PUNCH', 48, 0xff8a3d);
    const kick = mkBtn(kickX, dpadY, 'KICK', 48, 0x5be37b);
    const hintText = this.add.text((dpadX + kickX) / 2, dpadY - btn * 2 - gap * 2 - 10, hint, {
      fontFamily: 'Arial', fontSize: '10px', color: '#555a66'
    }).setOrigin(0.5);

    const bindHold = (obj, field) => {
      obj.bg.setInteractive({ useHandCursor: true });
      obj.bg.on('pointerdown', () => { this.touchState[key][field] = true; obj.bg.setFillStyle(0x22262f, 0.95); });
      obj.bg.on('pointerup', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
      obj.bg.on('pointerout', () => { this.touchState[key][field] = false; obj.bg.setFillStyle(0x14161c, 0.9); });
    };
    bindHold(up, 'up');
    bindHold(down, 'down');
    bindHold(left, 'left');
    bindHold(right, 'right');
    jump.bg.setInteractive({ useHandCursor: true });
    jump.bg.on('pointerdown', () => {
      this.touchState[key].jumpPressed = true;
      jump.bg.setFillStyle(0x22262f, 0.95);
      this.time.delayedCall(90, () => jump.bg.setFillStyle(0x14161c, 0.9));
    });
    punch.bg.setInteractive({ useHandCursor: true });
    punch.bg.on('pointerdown', () => {
      this.touchState[key].punchPressed = true;
      punch.bg.setFillStyle(0x3a2416, 0.95);
      this.time.delayedCall(90, () => punch.bg.setFillStyle(0x14161c, 0.9));
    });
    kick.bg.setInteractive({ useHandCursor: true });
    kick.bg.on('pointerdown', () => {
      this.touchState[key].kickPressed = true;
      kick.bg.setFillStyle(0x1f3a28, 0.95);
      this.time.delayedCall(90, () => kick.bg.setFillStyle(0x14161c, 0.9));
    });

    return { objects: [up.bg, up.t, down.bg, down.t, left.bg, left.t, right.bg, right.t, jump.bg, jump.t, punch.bg, punch.t, kick.bg, kick.t, hintText] };
  }

  setControlsVisible(cluster, visible) {
    cluster.objects.forEach(o => o.setVisible(visible));
  }

  startMatch(mode) {
    this.mode = mode;
    this.state = 'playing';
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.menuButtons.forEach(o => o.setVisible(false));

    this.modeText.setVisible(true).setText(mode === 'ai' ? '1P VS AI' : '2P LOCAL');
    this.menuBtn.setVisible(true);

    this.setControlsVisible(this.p1Controls, true);
    this.setControlsVisible(this.p2Controls, mode === '2p');

    this.p1 = makeFighter(-90, 20, 'panda');
    this.p2 = makeFighter(90, -20, 'bear');
    this.aiJumpCooldown = Phaser.Math.FloatBetween(1, 2.5);
    this.aiCircleTimer = 0;

    if (window.SFX) SFX.select();
  }

  returnToMenu() {
    this.state = 'menu';
    this.mode = null;
    this.modeText.setVisible(false);
    this.menuBtn.setVisible(false);
    this.setControlsVisible(this.p1Controls, false);
    this.setControlsVisible(this.p2Controls, false);
    this.centerText.setText('LAST FIST').setVisible(true);
    this.subText.setVisible(true);
    this.menuButtons.forEach(o => o.setVisible(true));
  }

  // shared kinematics for both fighters and the AI — same rules for everyone.
  // mx/mz is a movement vector with magnitude <= 1 (already normalized by
  // axisMoveVector for the player, or directly by aiInput for the AI).
  stepFighter(f, mx, mz, jumpPressed, dt) {
    const grounded = f.grounded;
    const accel = grounded ? MOVE_ACCEL : MOVE_ACCEL * AIR_CONTROL_MULT;
    const friction = (grounded ? GROUND_FRICTION : GROUND_FRICTION * AIR_CONTROL_MULT) * dt;

    if (mx !== 0 || mz !== 0) {
      f.vax += mx * accel * dt;
      f.vaz += mz * accel * dt;
    } else {
      f.vax = approachZero(f.vax, friction);
      f.vaz = approachZero(f.vaz, friction);
    }

    const speed = Math.hypot(f.vax, f.vaz);
    if (speed > MOVE_MAX_SPEED) { const s = MOVE_MAX_SPEED / speed; f.vax *= s; f.vaz *= s; }

    f.ax += f.vax * dt;
    f.az += f.vaz * dt;
    const clamped = clampToArena(f.ax, f.az);
    f.ax = clamped.ax; f.az = clamped.az;

    if (jumpPressed && f.grounded) {
      f.vJump = JUMP_VELOCITY;
      f.grounded = false;
      if (window.SFX) SFX.jump();
    }
    f.vJump += GRAVITY * dt;
    f.jumpZ += f.vJump * dt;
    if (f.jumpZ >= 0) {
      const wasAirborne = !f.grounded;
      f.jumpZ = 0;
      f.vJump = 0;
      f.grounded = true;
      if (wasAirborne) { f.squash = 1; vibrate(6); }
    }

    if (f.grounded && speed > 20) f.walkBob += dt * 14;
    f.squash = Math.max(0, f.squash - dt * 4);
    f.hitFlash = Math.max(0, f.hitFlash - dt * 5);
  }

  // approach if too far, back off if too close, and — in the comfortable
  // band — circle around the player using the perpendicular direction, so
  // the AI actually orbits rather than just beelining. This is the whole
  // point of the 2D arena: it gives the AI somewhere to go that "left/right
  // only" never could.
  aiInput(dt) {
    const dx = this.p1.ax - this.p2.ax, dz = this.p1.az - this.p2.az;
    const dist = Math.hypot(dx, dz) || 0.001;
    let moveX = 0, moveZ = 0, jump = false, punch = false, kick = false;

    this.aiCircleTimer -= dt;
    if (this.aiCircleTimer <= 0) {
      this.aiCircleDir = Math.random() < 0.5 ? 1 : -1;
      this.aiCircleTimer = Phaser.Math.FloatBetween(1.5, 3);
    }

    if (dist > AI_APPROACH_MAX) {
      moveX = dx / dist; moveZ = dz / dist;
    } else if (dist < AI_APPROACH_MIN) {
      moveX = -dx / dist; moveZ = -dz / dist;
    } else {
      const perpX = -dz / dist, perpZ = dx / dist;
      moveX = perpX * this.aiCircleDir;
      moveZ = perpZ * this.aiCircleDir;
    }

    this.aiJumpCooldown -= dt;
    if (this.p2.grounded && this.aiJumpCooldown <= 0 && Math.random() < AI_JUMP_CHANCE_PER_SEC * dt) {
      jump = true;
      this.aiJumpCooldown = Phaser.Math.FloatBetween(1.5, 3.5);
    }

    // punch when close (favored — faster, safer), kick when a bit farther
    // out (its longer reach is the whole point) — simple on purpose, this
    // stage is about proving both moves work, not making a smart fighter
    if (this.p2.attackState === 'idle') {
      if (dist <= PUNCH_RANGE && Math.random() < AI_PUNCH_CHANCE_PER_SEC * dt) {
        punch = true;
      } else if (dist <= KICK_RANGE && Math.random() < AI_KICK_CHANCE_PER_SEC * dt) {
        kick = true;
      }
    }
    return { moveX, moveZ, jump, punch, kick };
  }

  separate() {
    const dx = this.p2.ax - this.p1.ax, dz = this.p2.az - this.p1.az;
    const dist = Math.hypot(dx, dz);
    if (dist < SEPARATION_MIN_DIST && dist > 0.001) {
      const push = (SEPARATION_MIN_DIST - dist) / 2;
      const ux = dx / dist, uz = dz / dist;
      this.p1.ax -= ux * push; this.p1.az -= uz * push;
      this.p2.ax += ux * push; this.p2.az += uz * push;
      Object.assign(this.p1, clampToArena(this.p1.ax, this.p1.az));
      Object.assign(this.p2, clampToArena(this.p2.ax, this.p2.az));
    }
  }

  // simple shapes only support a left/right flip, not true rotation, so
  // facing is still just "which side is the opponent on" — that reads fine
  // even with depth in the mix
  updateFacing() {
    const dx = this.p2.ax - this.p1.ax;
    if (Math.abs(dx) > 4) {
      this.p1.facing = dx > 0 ? 1 : -1;
      this.p2.facing = dx > 0 ? -1 : 1;
    }
  }

  // windup (committed, no hit yet) -> active (the window it can connect in)
  // -> recovery (can't attack again yet). Facing is already auto-locked
  // onto the opponent, so range alone decides a hit — no angle check needed.
  // Works for punch or kick — f.attackType picks which ATTACK_DEFS entry
  // governs the timing/range/knockback.
  updateAttack(f, opponent, punchPressed, kickPressed, dt) {
    if (f.attackState === 'idle') {
      if (punchPressed && f.grounded) this.startAttack(f, 'punch');
      else if (kickPressed && f.grounded) this.startAttack(f, 'kick');
      return;
    }

    const def = ATTACK_DEFS[f.attackType];
    f.attackTimer -= dt * 1000;

    if (f.attackState === 'windup') {
      if (f.attackTimer <= 0) { f.attackState = 'active'; f.attackTimer = def.active; }
    } else if (f.attackState === 'active') {
      if (!f.attackHasHit) {
        const dist = Math.hypot(opponent.ax - f.ax, opponent.az - f.az);
        if (dist <= def.range) {
          f.attackHasHit = true;
          this.resolveHit(f, opponent, def.knockback);
        }
      }
      if (f.attackTimer <= 0) { f.attackState = 'recovery'; f.attackTimer = def.recovery; }
    } else if (f.attackState === 'recovery') {
      if (f.attackTimer <= 0) { f.attackState = 'idle'; f.attackType = null; }
    }
  }

  startAttack(f, type) {
    f.attackType = type;
    f.attackState = 'windup';
    f.attackTimer = ATTACK_DEFS[type].windup;
    f.attackHasHit = false;
    if (window.SFX) SFX.swoosh();
  }

  resolveHit(attacker, defender, knockback) {
    const dx = defender.ax - attacker.ax, dz = defender.az - attacker.az;
    const dist = Math.hypot(dx, dz) || 0.001;
    const ux = dx / dist, uz = dz / dist;
    defender.vax += ux * knockback;
    defender.vaz += uz * knockback;
    defender.hitFlash = 1;

    this.cameras.main.shake(70, 0.005);
    vibrate(20);
    if (window.SFX) SFX.hit();
    this.showHitText(defender);
  }

  showHitText(defender) {
    const proj = project(defender.ax, defender.az);
    const scale = depthScale(defender.az);
    const t = this.add.text(proj.sx, proj.sy - 90 * scale, 'HIT!', {
      fontFamily: 'Arial Black, Arial', fontSize: `${Math.round(20 * scale)}px`, color: '#ffd23f'
    }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: t.y - 30, alpha: 0, duration: 500, onComplete: () => t.destroy() });
  }

  update(time, delta) {
    const dt = Math.min(delta / 1000, 0.05);

    if (this.state !== 'playing') { this.draw(); return; }

    const t = this.touchState;
    const aiMode = this.mode === 'ai';
    const p1Up = this.keys.p1Up.isDown || (aiMode && this.keys.p1UpAlt.isDown) || t.p1.up;
    const p1Down = this.keys.p1Down.isDown || (aiMode && this.keys.p1DownAlt.isDown) || t.p1.down;
    const p1Left = this.keys.p1Left.isDown || (aiMode && this.keys.p1LeftAlt.isDown) || t.p1.left;
    const p1Right = this.keys.p1Right.isDown || (aiMode && this.keys.p1RightAlt.isDown) || t.p1.right;
    const p1Jump = Phaser.Input.Keyboard.JustDown(this.keys.p1Jump) || t.p1.jumpPressed;
    const p1Punch = Phaser.Input.Keyboard.JustDown(this.keys.p1Punch) || (aiMode && Phaser.Input.Keyboard.JustDown(this.keys.p1PunchAlt)) || t.p1.punchPressed;
    const p1Kick = Phaser.Input.Keyboard.JustDown(this.keys.p1Kick) || (aiMode && Phaser.Input.Keyboard.JustDown(this.keys.p1KickAlt)) || t.p1.kickPressed;
    t.p1.jumpPressed = false;
    t.p1.punchPressed = false;
    t.p1.kickPressed = false;
    // "up" = away from camera, "left" = screen-left — always, regardless of facing
    const p1Move = axisMoveVector(p1Up, p1Down, p1Left, p1Right);
    // committed to the attack during windup/active — can't strafe out of it
    const p1Locked = this.p1.attackState === 'windup' || this.p1.attackState === 'active';
    this.stepFighter(this.p1, p1Locked ? 0 : p1Move.mx, p1Locked ? 0 : p1Move.mz, p1Jump, dt);

    if (this.mode === '2p') {
      const p2Up = this.keys.p2Up.isDown || t.p2.up;
      const p2Down = this.keys.p2Down.isDown || t.p2.down;
      const p2Left = this.keys.p2Left.isDown || t.p2.left;
      const p2Right = this.keys.p2Right.isDown || t.p2.right;
      const p2Jump = Phaser.Input.Keyboard.JustDown(this.keys.p2Jump) || t.p2.jumpPressed;
      const p2Punch = Phaser.Input.Keyboard.JustDown(this.keys.p2Punch) || t.p2.punchPressed;
      const p2Kick = Phaser.Input.Keyboard.JustDown(this.keys.p2Kick) || t.p2.kickPressed;
      t.p2.jumpPressed = false;
      t.p2.punchPressed = false;
      t.p2.kickPressed = false;
      const p2Move = axisMoveVector(p2Up, p2Down, p2Left, p2Right);
      const p2Locked = this.p2.attackState === 'windup' || this.p2.attackState === 'active';
      this.stepFighter(this.p2, p2Locked ? 0 : p2Move.mx, p2Locked ? 0 : p2Move.mz, p2Jump, dt);
      this.updateAttack(this.p1, this.p2, p1Punch, p1Kick, dt);
      this.updateAttack(this.p2, this.p1, p2Punch, p2Kick, dt);
    } else {
      const ai = this.aiInput(dt);
      const aiLocked = this.p2.attackState === 'windup' || this.p2.attackState === 'active';
      this.stepFighter(this.p2, aiLocked ? 0 : ai.moveX, aiLocked ? 0 : ai.moveZ, ai.jump, dt);
      this.updateAttack(this.p1, this.p2, p1Punch, p1Kick, dt);
      this.updateAttack(this.p2, this.p1, ai.punch, ai.kick, dt);
    }

    this.separate();
    this.updateFacing();
    this.draw();
  }

  drawShadow(f) {
    const proj = project(f.ax, f.az);
    const scale = depthScale(f.az);
    const airLift = Phaser.Math.Clamp(1 + f.jumpZ / 160, 0.35, 1); // shadow shrinks as fighter jumps higher
    this.g.fillStyle(0x000000, 0.35);
    this.g.fillEllipse(proj.sx, proj.sy, 40 * scale * airLift, 14 * scale * airLift);
  }

  drawFighter(f) {
    const g = this.g;
    const proj = project(f.ax, f.az);
    const scale = depthScale(f.az);
    const bobY = f.grounded ? Math.sin(f.walkBob) * 3 * scale : 0;
    const squashY = 1 - f.squash * 0.18;
    const squashX = 1 + f.squash * 0.12;

    // ATTACK — one continuous pull-back/thrust/retract motion; see
    // attackOffset for why it's built this way. Body lean reuses this
    // same curve at a fraction of the magnitude, so the whole fighter
    // rocks back on the windup and surges into the thrust — and since it's
    // the same already-continuous curve, leaning can't introduce a new snap.
    const attackDef = f.attackType ? ATTACK_DEFS[f.attackType] : null;
    const rawOffset = attackDef ? attackOffset(f.attackState, f.attackTimer, attackDef) : null;
    const leanRaw = rawOffset === null ? 0 : rawOffset * 0.18;

    const baseX = proj.sx + leanRaw * scale * f.facing;
    const baseY = proj.sy + f.jumpZ * scale - bobY;
    const w = 42 * scale * squashX, hgt = 56 * scale * squashY;

    if (f.kind === 'panda') {
      g.fillStyle(0xf4f4f4, 1);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      // legs — always visible, not just during a kick, so their length
      // gives a visual sense of how far a kick can actually reach
      g.fillStyle(0x18181b, 1);
      g.fillRoundedRect(baseX - w * 0.04 - w * 0.24, baseY - hgt * 0.34, w * 0.24, hgt * 0.34, 3 * scale);
      g.fillRoundedRect(baseX + w * 0.04, baseY - hgt * 0.34, w * 0.24, hgt * 0.34, 3 * scale);
      g.fillStyle(0xdc2626, 1);
      g.fillRoundedRect(baseX - w/2 - 4 * scale, baseY - hgt + 6 * scale, 9 * scale, 22 * scale, 4 * scale);
      g.fillRoundedRect(baseX + w/2 - 5 * scale, baseY - hgt + 6 * scale, 9 * scale, 22 * scale, 4 * scale);
      g.fillStyle(0xf4f4f4, 1);
      g.fillCircle(baseX, baseY - hgt - 16 * scale, 17 * scale);
      // neck shadow — drawn on top of both body and head, right at the seam
      // between them, so the head reads as its own shape instead of
      // merging into the torso (this was the main reason the panda's face
      // was hard to see)
      g.fillStyle(0x0a0a0d, 0.3);
      g.fillEllipse(baseX, baseY - hgt, w * 0.5, 5 * scale);
      g.fillStyle(0x18181b, 1);
      g.fillCircle(baseX - 13 * scale, baseY - hgt - 30 * scale, 7 * scale);
      g.fillCircle(baseX + 13 * scale, baseY - hgt - 30 * scale, 7 * scale);
      g.fillEllipse(baseX - 7 * f.facing * scale, baseY - hgt - 17 * scale, 11 * scale, 13 * scale);
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(baseX + f.facing * 10 * scale, baseY - hgt - 14 * scale, 4.5 * scale);
    } else {
      g.fillStyle(0x8b5a2b, 1);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      g.fillStyle(0x6b431f, 1);
      g.fillRoundedRect(baseX - w * 0.04 - w * 0.24, baseY - hgt * 0.34, w * 0.24, hgt * 0.34, 3 * scale);
      g.fillRoundedRect(baseX + w * 0.04, baseY - hgt * 0.34, w * 0.24, hgt * 0.34, 3 * scale);
      g.fillStyle(0xf5a623, 1);
      g.fillRoundedRect(baseX - w/2 - 4 * scale, baseY - hgt + 6 * scale, 9 * scale, 22 * scale, 4 * scale);
      g.fillRoundedRect(baseX + w/2 - 5 * scale, baseY - hgt + 6 * scale, 9 * scale, 22 * scale, 4 * scale);
      g.fillStyle(0x8b5a2b, 1);
      g.fillCircle(baseX, baseY - hgt - 16 * scale, 18 * scale);
      g.fillStyle(0x0a0a0d, 0.3);
      g.fillEllipse(baseX, baseY - hgt, w * 0.5, 5 * scale);
      g.fillStyle(0x6b431f, 1);
      g.fillCircle(baseX - 14 * scale, baseY - hgt - 30 * scale, 7 * scale);
      g.fillCircle(baseX + 14 * scale, baseY - hgt - 30 * scale, 7 * scale);
      g.fillStyle(0xd8b98c, 1);
      g.fillEllipse(baseX + f.facing * 6 * scale, baseY - hgt - 12 * scale, 16 * scale, 12 * scale);
      g.fillStyle(0x0a0a0d, 1);
      g.fillCircle(baseX + f.facing * 10 * scale, baseY - hgt - 12 * scale, 3.5 * scale);
    }

    if (rawOffset !== null) {
      const isKick = f.attackType === 'kick';
      const limbColor = f.kind === 'panda' ? 0xdc2626 : 0xf5a623;
      const offset = rawOffset * scale;
      // punch swings from mid-torso (shoulder height); kick swings from
      // low on the body (hip height) — that height difference alone is
      // most of what makes the two moves visually distinct
      const tipY = isKick ? (baseY - 8 * scale) : (baseY - hgt + 18 * scale);
      const anchorX = baseX + f.facing * (w/2 * (isKick ? 0.3 : 0.5));
      const tipX = baseX + f.facing * (w/2 + offset);
      const limbWidth = (isKick ? 7 : 5) * scale;
      const tipRadius = (isKick ? 8 : 7) * scale;
      const tipRadiusActive = (isKick ? 15 : 11) * scale;
      const tipRadiusActiveMinor = (isKick ? 9 : 7) * scale;

      // limb — connects the tip to the body so it reads as an arm/leg
      // extending, not a disembodied shape
      g.lineStyle(limbWidth, limbColor, 1);
      g.lineBetween(anchorX, tipY, tipX, tipY);

      // motion trail — a couple of fading ghost positions behind the tip,
      // only during the actual thrust, to sell speed
      if (f.attackState === 'active') {
        g.fillStyle(limbColor, 0.25);
        g.fillCircle(baseX + f.facing * (w/2 + offset * 0.55), tipY, tipRadius * 0.85);
        g.fillStyle(limbColor, 0.12);
        g.fillCircle(baseX + f.facing * (w/2 + offset * 0.25), tipY, tipRadius * 0.7);
      }

      g.fillStyle(limbColor, 1);
      if (f.attackState === 'active') {
        // elongated along the thrust axis during the active window — a
        // "streak" shape rather than a circle the whole way through
        g.fillEllipse(tipX, tipY, tipRadiusActive, tipRadiusActiveMinor);
      } else {
        g.fillCircle(tipX, tipY, tipRadius);
      }
    }

    // HIT FLASH — a brief white overlay on whoever just got hit
    if (f.hitFlash > 0) {
      g.fillStyle(0xffffff, f.hitFlash * 0.6);
      g.fillRoundedRect(baseX - w/2, baseY - hgt, w, hgt, 10 * scale);
      g.fillCircle(baseX, baseY - hgt - 16 * scale, 17 * scale);
    }
  }

  drawArena() {
    const g = this.g;
    g.fillStyle(0x111318, 1);
    g.fillEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 2, ARENA_RZ * 2 * DEPTH_COMPRESS);
    g.lineStyle(2, 0x1c2128, 1);
    g.strokeEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 2, ARENA_RZ * 2 * DEPTH_COMPRESS);
    // a couple of inner rings purely for depth legibility, nothing functional
    g.lineStyle(1, 0x181b21, 0.8);
    g.strokeEllipse(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RX * 1.3, ARENA_RZ * 1.3 * DEPTH_COMPRESS);
  }

  draw() {
    const g = this.g;
    g.clear();
    if (this.state !== 'playing') return;

    this.drawArena();

    // painter's algorithm — draw the fighter farther from camera first so
    // the nearer one correctly overlaps them when they're close together
    const order = [this.p1, this.p2].sort((a, b) => project(a.ax, a.az).sy - project(b.ax, b.az).sy);
    order.forEach(f => { this.drawShadow(f); this.drawFighter(f); });
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#0a0a0d',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
