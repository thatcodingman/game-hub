<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trick or Die — The Arcade</title>
<style>
  html, body { margin:0; padding:0; background:#0d1117; overflow:hidden; height:100%; }
  #game-container { width:100vw; height:100vh; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   TRICK OR DIE v3 — Moto X3M-style side-scroller
   Real 2-wheel Matter.js vehicle physics (via Phaser's built-in Matter),
   hand-shaped terrain, hold-to-accelerate + lean controls, checkpoints,
   crash-on-bad-landing, best-time tracking (localStorage).
   ========================================================================= */

const GROUND_Y = 480;
const SEG_H = 26;           // terrain segment thickness
const CRASH_ANGLE = 1.15;   // ~66 degrees — chassis-vs-ground hit beyond this = crash
const FALL_Y = GROUND_Y + 900; // fall-into-gap death threshold
const MAX_WHEEL_SPIN = 1.6;
const MAX_LEAN = 0.16;

// ---------------------------------------------------------------------
// Terrain builder — turns a readable list of "features" into a smooth
// point path, then into static Matter rectangle segments (with gaps
// simply omitted so the bike can fall through).
// ---------------------------------------------------------------------
function buildTerrain(features, startX, startY) {
  const points = [{ x: startX, y: startY, gap: false }];
  let x = startX, y = startY;

  features.forEach(f => {
    if (f.type === 'flat') {
      const steps = Math.max(1, Math.round(f.length / 60));
      for (let i = 1; i <= steps; i++) {
        x += f.length / steps;
        points.push({ x, y, gap: false });
      }
    } else if (f.type === 'ramp') {
      // f.length horizontal run, f.rise vertical change (negative = up)
      const steps = Math.max(3, Math.round(f.length / 40));
      const x0 = x, y0 = y;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const eased = 1 - Math.pow(1 - t, 2); // ease-out curve, feels like a ramp
        x = x0 + f.length * t;
        y = y0 + f.rise * eased;
        points.push({ x, y, gap: false });
      }
    } else if (f.type === 'bump') {
      // gentle sine hill, good for rolling terrain
      const steps = Math.max(4, Math.round(f.length / 40));
      const x0 = x, y0 = y;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        x = x0 + f.length * t;
        y = y0 - Math.sin(t * Math.PI) * f.height;
        points.push({ x, y, gap: false });
      }
      y = y0;
      x = x0 + f.length;
      points[points.length - 1].y = y0;
    } else if (f.type === 'gap') {
      const steps = Math.max(2, Math.round(f.length / 50));
      for (let i = 1; i <= steps; i++) {
        x += f.length / steps;
        points.push({ x, y, gap: true });
      }
    }
  });

  return points;
}

// Feature-based level design (hand-authored sequences, not random)
const LEVELS = [
  {
    name: 'Backroad',
    gravity: 1.15,
    features: [
      { type: 'flat', length: 500 },
      { type: 'bump', length: 300, height: 40 },
      { type: 'bump', length: 300, height: 60 },
      { type: 'flat', length: 200 },
      { type: 'ramp', length: 220, rise: -140 },
      { type: 'gap', length: 260 },
      { type: 'ramp', length: 220, rise: 140 },
      { type: 'flat', length: 300 },
      { type: 'bump', length: 400, height: 90 },
      { type: 'flat', length: 250 },
      { type: 'ramp', length: 260, rise: -180 },
      { type: 'gap', length: 340 },
      { type: 'ramp', length: 240, rise: 180 },
      { type: 'flat', length: 400 },
      { type: 'ramp', length: 200, rise: -100 },
      { type: 'flat', length: 300 },
    ],
    checkpoints: [1400, 3200, 5200],
  },
  {
    name: 'Canyon Run',
    gravity: 1.2,
    features: [
      { type: 'flat', length: 400 },
      { type: 'ramp', length: 200, rise: -160 },
      { type: 'gap', length: 300 },
      { type: 'ramp', length: 200, rise: 100 },
      { type: 'bump', length: 250, height: 70 },
      { type: 'ramp', length: 260, rise: -220 },
      { type: 'gap', length: 400 },
      { type: 'ramp', length: 220, rise: 220 },
      { type: 'flat', length: 200 },
      { type: 'bump', length: 300, height: 100 },
      { type: 'bump', length: 300, height: 110 },
      { type: 'ramp', length: 240, rise: -180 },
      { type: 'gap', length: 340 },
      { type: 'ramp', length: 220, rise: 100 },
      { type: 'flat', length: 250 },
      { type: 'ramp', length: 300, rise: -260 },
      { type: 'gap', length: 380 },
      { type: 'ramp', length: 260, rise: 260 },
      { type: 'flat', length: 400 },
    ],
    checkpoints: [1300, 3000, 4600, 6400],
  },
];

// ---------------------------------------------------------------------
// Menu Scene
// ---------------------------------------------------------------------
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  create() {
    const w = this.scale.width, h = this.scale.height;
    this.cameras.main.setBackgroundColor('#0d1117');

    this.add.text(w/2, h*0.22, 'TRICK OR DIE', {
      fontFamily: 'Arial Black, Arial', fontSize: '54px', color: '#ff5a2b'
    }).setOrigin(0.5).setShadow(0, 4, '#000', 8, true, true);

    this.add.text(w/2, h*0.22 + 54, 'a Moto X3M-style physics run', {
      fontFamily: 'Arial', fontSize: '18px', color: '#9fa6ad'
    }).setOrigin(0.5);

    LEVELS.forEach((lvl, i) => {
      const y = h*0.45 + i*90;
      const best = localStorage.getItem('trickOrDie_best_' + i);
      const btn = this.add.rectangle(w/2, y, 340, 68, 0x1c2128, 1)
        .setStrokeStyle(2, 0xff5a2b).setInteractive({ useHandCursor: true });
      this.add.text(w/2, y - 12, lvl.name, {
        fontFamily: 'Arial Black, Arial', fontSize: '24px', color: '#f0f3f6'
      }).setOrigin(0.5);
      this.add.text(w/2, y + 16, best ? `Best: ${parseFloat(best).toFixed(2)}s` : 'Not completed', {
        fontFamily: 'Arial', fontSize: '14px', color: '#6a7178'
      }).setOrigin(0.5);
      btn.on('pointerover', () => btn.setFillStyle(0x262c34));
      btn.on('pointerout', () => btn.setFillStyle(0x1c2128));
      btn.on('pointerdown', () => {
        if (window.SFX) SFX.select();
        this.scene.start('Play', { levelIndex: i });
      });
    });

    this.add.text(w/2, h - 40,
      'Hold RIGHT to accelerate  ·  LEFT to brake/reverse  ·  UP/DOWN to lean  ·  R to restart',
      { fontFamily: 'Arial', fontSize: '13px', color: '#6a7178' }).setOrigin(0.5);
  }
}

// ---------------------------------------------------------------------
// Play Scene
// ---------------------------------------------------------------------
class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  init(data) {
    this.levelIndex = data.levelIndex || 0;
    this.level = LEVELS[this.levelIndex];
  }

  create() {
    const level = this.level;
    this.matter.world.setGravity(0, level.gravity);
    this.cameras.main.setBackgroundColor('#87b9e0');

    // ---- background parallax hills ----
    this.bg = this.add.graphics().setScrollFactor(0.25);
    this.drawParallaxHills(this.bg, 0x6fa8d8, 60, 4000);
    this.bg2 = this.add.graphics().setScrollFactor(0.5);
    this.drawParallaxHills(this.bg2, 0x5a94c4, 40, 4000, 300);

    // ---- terrain ----
    this.terrainPoints = buildTerrain(level.features, 0, GROUND_Y);
    this.levelEndX = this.terrainPoints[this.terrainPoints.length - 1].x;
    this.terrainGraphics = this.add.graphics();
    this.terrainBodies = [];
    this.buildTerrainBodies();

    // ---- checkpoints ----
    this.checkpointX = 0;
    this.checkpointSensors = [];
    (level.checkpoints || []).forEach((cx, idx) => {
      const gy = this.groundYAt(cx);
      const sensor = this.matter.add.rectangle(cx, gy - 80, 12, 160, {
        isStatic: true, isSensor: true, label: 'checkpoint-' + idx
      });
      const pole = this.add.rectangle(cx, gy - 80, 6, 160, 0xffd23f);
      const flag = this.add.triangle(cx + 14, gy - 140, 0, 0, 28, 8, 0, 16, 0xffd23f);
      this.checkpointSensors.push({ sensor, cx, pole, flag, hit: false, label: 'checkpoint-' + idx });
    });

    // ---- finish flag ----
    const fgy = this.groundYAt(this.levelEndX - 60);
    this.finishSensor = this.matter.add.rectangle(this.levelEndX - 60, fgy - 90, 14, 180, {
      isStatic: true, isSensor: true, label: 'finish'
    });
    this.add.rectangle(this.levelEndX - 60, fgy - 90, 6, 180, 0x2ecc71);
    for (let i = 0; i < 6; i++) {
      this.add.rectangle(this.levelEndX - 60 - 12 + (i%2)*16, fgy - 170 + i*8, 16, 8,
        (i % 2 === 0) ? 0x111111 : 0xffffff);
    }

    // ---- bike ----
    this.spawnAt(80, GROUND_Y - 100);

    // ---- input ----
    this.keys = this.input.keyboard.addKeys({
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      up: Phaser.Input.Keyboard.KeyCodes.UP,
      down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      d: Phaser.Input.Keyboard.KeyCodes.D,
      a: Phaser.Input.Keyboard.KeyCodes.A,
      w: Phaser.Input.Keyboard.KeyCodes.W,
      s: Phaser.Input.Keyboard.KeyCodes.S,
      r: Phaser.Input.Keyboard.KeyCodes.R,
    });
    this.touch = { gas: false, brake: false, leanF: false, leanB: false };
    this.buildTouchControls();

    // ---- camera ----
    this.cameras.main.setBounds(0, -2000, this.levelEndX + 400, 4000 + GROUND_Y);

    // ---- HUD ----
    this.buildHUD();

    // ---- state ----
    this.finished = false;
    this.crashed = false;
    this.deaths = 0;
    this.startTime = this.time.now;
    this.grounded = { f: false, r: false };

    // ---- collisions ----
    this.matter.world.on('collisionstart', (event) => {
      event.pairs.forEach(pair => this.onCollision(pair, true));
    });
    this.matter.world.on('collisionend', (event) => {
      event.pairs.forEach(pair => this.onCollision(pair, false));
    });
  }

  drawParallaxHills(g, color, height, spacing, seedOffset = 0) {
    g.fillStyle(color, 1);
    g.beginPath();
    g.moveTo(0, GROUND_Y + 60);
    for (let x = 0; x <= 8000; x += 40) {
      const y = GROUND_Y - 40 + Math.sin((x + seedOffset) / spacing * Math.PI * 2) * height;
      g.lineTo(x, y);
    }
    g.lineTo(8000, GROUND_Y + 400);
    g.lineTo(0, GROUND_Y + 400);
    g.closePath();
    g.fillPath();
  }

  groundYAt(x) {
    const pts = this.terrainPoints;
    for (let i = 0; i < pts.length - 1; i++) {
      if (x >= pts[i].x && x <= pts[i+1].x) {
        const t = (x - pts[i].x) / (pts[i+1].x - pts[i].x || 1);
        return pts[i].y + (pts[i+1].y - pts[i].y) * t;
      }
    }
    return GROUND_Y;
  }

  buildTerrainBodies() {
    const pts = this.terrainPoints;
    this.terrainGraphics.clear();
    this.terrainGraphics.fillStyle(0x3d2b1f, 1);
    this.terrainGraphics.lineStyle(4, 0x6b8f3e, 1);

    for (let i = 0; i < pts.length - 1; i++) {
      const p1 = pts[i], p2 = pts[i+1];
      if (p1.gap || p2.gap) continue;

      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy) + 2;
      const angle = Math.atan2(dy, dx);
      const midx = (p1.x + p2.x) / 2, midy = (p1.y + p2.y) / 2;

      const body = this.matter.add.rectangle(midx, midy + SEG_H/2, len, SEG_H, {
        isStatic: true, friction: 0.95, frictionStatic: 1, label: 'terrain', angle
      });
      this.terrainBodies.push(body);

      // visual: filled quad down to a deep baseline
      this.terrainGraphics.beginPath();
      this.terrainGraphics.moveTo(p1.x, p1.y);
      this.terrainGraphics.lineTo(p2.x, p2.y);
      this.terrainGraphics.lineTo(p2.x, p2.y + 500);
      this.terrainGraphics.lineTo(p1.x, p1.y + 500);
      this.terrainGraphics.closePath();
      this.terrainGraphics.fillPath();
      this.terrainGraphics.beginPath();
      this.terrainGraphics.moveTo(p1.x, p1.y);
      this.terrainGraphics.lineTo(p2.x, p2.y);
      this.terrainGraphics.strokePath();
    }
  }

  spawnAt(x, y) {
    // clean up old bike if respawning
    if (this.chassisGO) {
      [this.chassisGO, this.wheelF, this.wheelR].forEach(b => b && b.destroy());
      [this.axleF, this.axleR].forEach(c => c && this.matter.world.removeConstraint(c));
    }

    this.chassisGO = this.matter.add.gameObject(
      this.add.rectangle(x, y, 62, 16, 0xff5a2b).setStrokeStyle(2, 0x8a2f10),
      { density: 0.018, friction: 0.05, frictionAir: 0.018, restitution: 0.05,
        label: 'chassis', chamfer: { radius: 4 } }
    );
    this.wheelF = this.matter.add.gameObject(
      this.add.circle(x + 26, y + 14, 15, 0x1a1a1a).setStrokeStyle(3, 0x555555),
      { density: 0.045, friction: 0.95, frictionStatic: 1, frictionAir: 0.012,
        restitution: 0.1, label: 'wheelF' }
    );
    this.wheelR = this.matter.add.gameObject(
      this.add.circle(x - 26, y + 14, 15, 0x1a1a1a).setStrokeStyle(3, 0x555555),
      { density: 0.045, friction: 0.95, frictionStatic: 1, frictionAir: 0.012,
        restitution: 0.1, label: 'wheelR' }
    );

    this.axleF = this.matter.add.constraint(this.chassisGO.body, this.wheelF.body, 0, 0.5, {
      pointA: { x: 26, y: 8 }, pointB: { x: 0, y: 0 }, damping: 0.2
    });
    this.axleR = this.matter.add.constraint(this.chassisGO.body, this.wheelR.body, 0, 0.5, {
      pointA: { x: -26, y: 8 }, pointB: { x: 0, y: 0 }, damping: 0.2
    });

    this.cameras.main.startFollow(this.chassisGO, true, 0.08, 0.08, -80, 0);

    this.grounded = { f: false, r: false };
    this.crashed = false;
  }

  buildTouchControls() {
    const h = this.scale.height, w = this.scale.width;
    const mkBtn = (x, y, r, label, onDown, onUp) => {
      const c = this.add.circle(x, y, r, 0x1c2128, 0.55).setScrollFactor(0)
        .setStrokeStyle(2, 0xffffff, 0.5).setInteractive();
      const t = this.add.text(x, y, label, { fontFamily: 'Arial', fontSize: '13px', color: '#fff' })
        .setOrigin(0.5).setScrollFactor(0);
      c.on('pointerdown', onDown); c.on('pointerup', onUp); c.on('pointerout', onUp);
      return c;
    };
    mkBtn(w - 90, h - 90, 55, 'GAS', () => this.touch.gas = true, () => this.touch.gas = false);
    mkBtn(w - 190, h - 90, 40, 'BRK', () => this.touch.brake = true, () => this.touch.brake = false);
    mkBtn(90, h - 140, 36, '▲', () => this.touch.leanB = true, () => this.touch.leanB = false);
    mkBtn(90, h - 60, 36, '▼', () => this.touch.leanF = true, () => this.touch.leanF = false);
  }

  buildHUD() {
    this.timeText = this.add.text(20, 16, '0.00s', {
      fontFamily: 'Arial Black, Arial', fontSize: '26px', color: '#ffffff'
    }).setScrollFactor(0).setShadow(0,2,'#000',4,true,true);
    this.deathText = this.add.text(20, 50, 'Deaths: 0', {
      fontFamily: 'Arial', fontSize: '16px', color: '#ffd23f'
    }).setScrollFactor(0).setShadow(0,2,'#000',3,true,true);
    this.toastText = this.add.text(this.scale.width/2, 90, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '20px', color: '#2ecc71'
    }).setOrigin(0.5).setScrollFactor(0).setAlpha(0);
  }

  toast(msg, color = '#2ecc71') {
    this.toastText.setText(msg).setColor(color).setAlpha(1);
    this.tweens.add({ targets: this.toastText, alpha: 0, delay: 900, duration: 500 });
  }

  onCollision(pair, active) {
    const labels = [pair.bodyA.label, pair.bodyB.label];
    const other = (a, b) => (labels.includes(a) && labels.includes(b));

    if (other('wheelF', 'terrain')) this.grounded.f = active;
    if (other('wheelR', 'terrain')) this.grounded.r = active;

    if (active && other('chassis', 'terrain') && !this.crashed && !this.finished) {
      const ang = Phaser.Math.Angle.Wrap(this.chassisGO.body.angle);
      if (Math.abs(ang) > CRASH_ANGLE) this.crash();
    }

    if (active && !this.finished) {
      this.checkpointSensors.forEach((cp, idx) => {
        if (!cp.hit && labels.includes(cp.sensor.label) && (labels.includes('chassis') || labels.includes('wheelF') || labels.includes('wheelR'))) {
          cp.hit = true;
          this.checkpointX = cp.cx;
          if (window.SFX) SFX.pickup();
          this.toast('CHECKPOINT');
        }
      });
      if (labels.includes('finish') && (labels.includes('chassis') || labels.includes('wheelF') || labels.includes('wheelR'))) {
        this.finish();
      }
    }
  }

  crash() {
    if (this.crashed || this.finished) return;
    this.crashed = true;
    this.deaths++;
    this.deathText.setText('Deaths: ' + this.deaths);
    if (window.SFX) SFX.hit();
    this.cameras.main.shake(200, 0.01);
    this.toast('CRASHED', '#ff5a5a');
    this.time.delayedCall(500, () => {
      this.spawnAt(this.checkpointX + 40, this.groundYAt(this.checkpointX + 40) - 100);
    });
  }

  finish() {
    this.finished = true;
    const elapsed = (this.time.now - this.startTime) / 1000;
    if (window.SFX) SFX.success();
    const key = 'trickOrDie_best_' + this.levelIndex;
    const prevBest = parseFloat(localStorage.getItem(key));
    const isBest = isNaN(prevBest) || elapsed < prevBest;
    if (isBest) localStorage.setItem(key, elapsed.toFixed(2));

    const w = this.scale.width, h = this.scale.height;
    const panel = this.add.rectangle(w/2, h/2, 380, 220, 0x0d1117, 0.92)
      .setScrollFactor(0).setStrokeStyle(2, 0x2ecc71);
    this.add.text(w/2, h/2 - 70, 'FINISHED!', {
      fontFamily: 'Arial Black, Arial', fontSize: '30px', color: '#2ecc71'
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(w/2, h/2 - 20, `Time: ${elapsed.toFixed(2)}s`, {
      fontFamily: 'Arial', fontSize: '20px', color: '#fff'
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(w/2, h/2 + 12, isBest ? 'New best time!' : `Best: ${prevBest.toFixed(2)}s`, {
      fontFamily: 'Arial', fontSize: '15px', color: '#ffd23f'
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(w/2, h/2 + 50, `Deaths: ${this.deaths}`, {
      fontFamily: 'Arial', fontSize: '14px', color: '#9fa6ad'
    }).setOrigin(0.5).setScrollFactor(0);

    const retryBtn = this.add.text(w/2 - 70, h/2 + 85, '[ RETRY ]', {
      fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#fff'
    }).setOrigin(0.5).setScrollFactor(0).setInteractive({ useHandCursor: true });
    const menuBtn = this.add.text(w/2 + 70, h/2 + 85, '[ MENU ]', {
      fontFamily: 'Arial Black, Arial', fontSize: '16px', color: '#fff'
    }).setOrigin(0.5).setScrollFactor(0).setInteractive({ useHandCursor: true });
    retryBtn.on('pointerdown', () => this.scene.restart({ levelIndex: this.levelIndex }));
    menuBtn.on('pointerdown', () => this.scene.start('Menu'));
  }

  update(time, delta) {
    if (window.SFX && SFX.ctx && SFX.ctx.state === 'suspended') { /* unlocked on first input elsewhere */ }
    if (this.crashed || this.finished) return;

    const accel = this.keys.right.isDown || this.keys.d.isDown || this.touch.gas;
    const brake = this.keys.left.isDown || this.keys.a.isDown || this.touch.brake;
    const leanBack = this.keys.up.isDown || this.keys.w.isDown || this.touch.leanB;
    const leanFwd = this.keys.down.isDown || this.keys.s.isDown || this.touch.leanF;

    if (Phaser.Input.Keyboard.JustDown(this.keys.r)) {
      this.spawnAt(this.checkpointX + 40, this.groundYAt(this.checkpointX + 40) - 100);
      return;
    }

    // wheel motor
    let avF = this.wheelF.body.angularVelocity;
    let avR = this.wheelR.body.angularVelocity;
    if (accel) {
      avF = Math.min(avF + 0.12, MAX_WHEEL_SPIN);
      avR = Math.min(avR + 0.12, MAX_WHEEL_SPIN);
    } else if (brake) {
      avF = Math.max(avF - 0.12, -MAX_WHEEL_SPIN * 0.5);
      avR = Math.max(avR - 0.12, -MAX_WHEEL_SPIN * 0.5);
    }
    this.matter.body.setAngularVelocity(this.wheelF.body, avF);
    this.matter.body.setAngularVelocity(this.wheelR.body, avR);

    // lean (chassis torque)
    if (leanBack || leanFwd) {
      let av = this.chassisGO.body.angularVelocity;
      const inc = 0.012;
      if (leanBack) av = Math.max(av - inc, -MAX_LEAN);
      if (leanFwd) av = Math.min(av + inc, MAX_LEAN);
      this.matter.body.setAngularVelocity(this.chassisGO.body, av);
    }

    // engine sound feedback (cheap, throttled)
    if (accel && window.SFX && !this._engineTick) {
      this._engineTick = true;
      this.time.delayedCall(220, () => this._engineTick = false);
    }

    // fell into a gap
    if (this.chassisGO.body.position.y > FALL_Y) this.crash();

    // HUD
    this.timeText.setText(((time - this.startTime) / 1000).toFixed(2) + 's');
  }

}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: 960,
  height: 540,
  backgroundColor: '#87b9e0',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: {
    default: 'matter',
    matter: { gravity: { y: 1.15 }, debug: false }
  },
  scene: [MenuScene, PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
