<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Shrink</title>
<style>
  html, body { margin:0; padding:0; background:#111; overflow:hidden; height:100%; }
  #game-container { display:flex; justify-content:center; align-items:center; height:100%; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
const LANES = 3;
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;
const LANE_WIDTH = GAME_WIDTH / LANES;
const SWIPE_THRESHOLD = 14;
const LANE_TWEEN_MS = 65;
const LANE_TWEEN_MS_LATE = 45;       // even snappier past the late-game threshold
const LANE_TWEEN_LATE_DISTANCE = 1000;

const COLOR_RED = 0xef4444;
const COLOR_SAFE = 0x4ade80;
const COLOR_PLAYER = 0xf8fafc;
const COLOR_ALIEN = 0xa78bfa;
const COLOR_LIFECELL = 0xfacc15;
const COLOR_PROJECTILE = 0x38bdf8;
const COLOR_SIZEUP = 0x22d3ee;

const MOVE_SWAP_OFFSET = 380;
const MAX_CHARGES = 3;
const FIRE_INTERVAL = 450;
const PROJECTILE_SPEED = 600;
const ENEMY_SPEED = 170;
const PLAYER_Y_RAISE = 90;
const HIT_RADIUS = 22; // widened from 18 — paired with the crossing-check below to stop tunneling

const SHRINK_THRESHOLDS = [3, 4, 5, 6];
const SHRINK_MULTIPLIER = 0.85;
const SHRINK_FLOOR = 0.10;
const SIZE_UP_AMOUNT = 0.12; // fraction of full size restored per Size Up, capped at 100%

// Scripted opening: guarantees real events in the first ~3.5s (roughly 0-50m at
// current speed) instead of leaving it to random timers, which could otherwise
// leave the first 60-70m almost completely empty.
const OPENING_ALIEN_DELAYS = [600, 1800, 3200]; // ms since scene start
const OPENING_GATE_DELAYS = [1400, 3600];        // ms since scene start
const EARLY_TEST_GATE_DISTANCE = 380; // guarantees one real Double Gate test before 500m

// Obstacle type now carries real timing pressure, not just fewer safe lanes —
// Double/Moving gates rush in faster than Single gates, so the type itself
// feels distinct rather than only differing in lane count.
const OBSTACLE_SPEED_MULT = { SINGLE: 1.0, DOUBLE: 1.18, MOVE: 1.22 };

function getPhase(distance) {
  if (distance < 100)  return { spacing: 2600, speed: 340, weights: { SINGLE: 1,   DOUBLE: 0,   MOVE: 0 } };
  if (distance < 200)  return { spacing: 2800, speed: 360, weights: { SINGLE: 1,   DOUBLE: 0,   MOVE: 0 } };
  if (distance < 300)  return { spacing: 2600, speed: 380, weights: { SINGLE: 1,   DOUBLE: 0,   MOVE: 0 } };
  if (distance < 400)  return { spacing: 2400, speed: 400, weights: { SINGLE: 0.8, DOUBLE: 0.2, MOVE: 0 } };
  if (distance < 600)  return { spacing: 2200, speed: 420, weights: { SINGLE: 0.3, DOUBLE: 0.5, MOVE: 0.2 } };
  if (distance < 750)  return { spacing: 2000, speed: 440, weights: { SINGLE: 0.2, DOUBLE: 0.4, MOVE: 0.4 } };
  if (distance < 1500) return { spacing: 1700, speed: 460, weights: { SINGLE: 0.1, DOUBLE: 0.4, MOVE: 0.5 } };
  return { spacing: 1700, speed: 460, weights: { SINGLE: 0.1, DOUBLE: 0.4, MOVE: 0.5 } };
}

// dropWeights shift over distance: early game teaches basic Life Cell collection,
// mid game introduces Double Life Cells, late game leans into Size Up drops —
// exactly when the player is small enough that recovering size actually matters.
function getAlienPhase(distance) {
  if (distance < 100)  return { minS: 4.0, maxS: 5.0,  dropChance: 0.35, laneChance: 0.8,  dropWeights: { normal: 1.0,  double: 0,    sizeUp: 0 } };
  if (distance < 200)  return { minS: 4.0, maxS: 5.0,  dropChance: 0.25, laneChance: 0.55, dropWeights: { normal: 0.85, double: 0.05, sizeUp: 0.10 } };
  if (distance < 400)  return { minS: 5.0, maxS: 7.0,  dropChance: 0.19, laneChance: 0.35, dropWeights: { normal: 0.65, double: 0.10, sizeUp: 0.25 } };
  if (distance < 750)  return { minS: 6.0, maxS: 8.0,  dropChance: 0.13, laneChance: 0.25, dropWeights: { normal: 0.45, double: 0.20, sizeUp: 0.35 } };
  return { minS: 7.0, maxS: 10.0, dropChance: 0.10, laneChance: 0.2, dropWeights: { normal: 0.30, double: 0.30, sizeUp: 0.40 } };
}

function pickWeighted(weights) {
  const entries = Object.entries(weights).filter(([, w]) => w > 0);
  const total = entries.reduce((sum, [, w]) => sum + w, 0);
  let r = Math.random() * total;
  for (const [type, w] of entries) {
    if (r < w) return type;
    r -= w;
  }
  return entries[entries.length - 1][0];
}

class MainScene extends Phaser.Scene {
  constructor() { super('MainScene'); }

  create() {
    this.currentLane = 1;
    this.playerSize = 30;
    this.scrollSpeed = 340;
    this.spawnTimer = 0;
    this.spawnInterval = 5000;
    this.fireTimer = 0;
    this.obstacles = [];
    this.aliens = [];
    this.lifeCells = [];
    this.sizeUps = [];
    this.projectiles = [];
    this.charges = 0;
    this.gameOver = false;
    this.distance = 0;

    this.sizeScale = 1.0;
    this.smallestSize = 1.0;
    this.streak = 0;
    this.shrinkStage = 0;
    this.dodgeCount = 0;

    this.elapsed = 0;
    this.openingAlienIndex = 0;
    this.openingGateIndex = 0;
    this.earlyTestGateSpawned = false;

    this.laneGraphics = this.add.graphics();
    this.drawLanes();

    this.playerY = GAME_HEIGHT - 100 - PLAYER_Y_RAISE;
    this.player = this.add.rectangle(this.laneX(this.currentLane), this.playerY, this.playerSize, this.playerSize, COLOR_PLAYER);

    this.scoreText = this.add.text(10, 10, 'Distance: 0m', { fontFamily: 'monospace', fontSize: '18px', color: '#ffffff' });
    this.chargeText = this.add.text(10, 34, 'Charges: ○○○', { fontFamily: 'monospace', fontSize: '16px', color: '#facc15' });
    this.sizeText = this.add.text(10, 58, 'Size: 100%', { fontFamily: 'monospace', fontSize: '16px', color: '#4ade80' });

    this.gameOverText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2, '', {
      fontFamily: 'monospace', fontSize: '22px', color: '#ffffff', align: 'center'
    }).setOrigin(0.5);

    this.alienTimer = 0;
    this.nextAlienDelay = this.randomAlienDelay();

    this.swipeStartX = null;
    this.swipeStartY = null;
    this.swipeHandled = false;

    this.input.on('pointerdown', (pointer) => {
      this.swipeStartX = pointer.x;
      this.swipeStartY = pointer.y;
      this.swipeHandled = false;
      if (this.gameOver) this.scene.restart();
    });

    this.input.on('pointermove', (pointer) => {
      if (this.gameOver || this.swipeHandled || this.swipeStartX === null || !pointer.isDown) return;
      const dx = pointer.x - this.swipeStartX;
      const dy = pointer.y - this.swipeStartY;
      if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        this.swipeHandled = true;
        this.moveLane(dx > 0 ? 1 : -1);
      }
    });

    this.input.on('pointerup', () => {
      this.swipeStartX = null;
      this.swipeStartY = null;
    });

    this.input.keyboard.on('keydown-LEFT', () => { if (!this.gameOver) this.moveLane(-1); else this.scene.restart(); });
    this.input.keyboard.on('keydown-RIGHT', () => { if (!this.gameOver) this.moveLane(1); else this.scene.restart(); });
    this.input.keyboard.on('keydown-SPACE', () => { if (this.gameOver) this.scene.restart(); });
  }

  drawLanes() {
    this.laneGraphics.lineStyle(2, 0x333333, 1);
    for (let i = 1; i < LANES; i++) {
      const x = i * LANE_WIDTH;
      this.laneGraphics.lineBetween(x, 0, x, GAME_HEIGHT);
    }
  }

  laneX(lane) {
    return lane * LANE_WIDTH + LANE_WIDTH / 2;
  }

  randomAlienDelay() {
    const p = getAlienPhase(this.distance);
    return Phaser.Math.FloatBetween(p.minS, p.maxS) * 1000;
  }

  moveLane(direction) {
    const newLane = Phaser.Math.Clamp(this.currentLane + direction, 0, LANES - 1);
    this.currentLane = newLane;
    this.tweens.killTweensOf(this.player, ['x']);
    const tweenMs = this.distance >= LANE_TWEEN_LATE_DISTANCE ? LANE_TWEEN_MS_LATE : LANE_TWEEN_MS;
    this.tweens.add({
      targets: this.player,
      x: this.laneX(this.currentLane),
      duration: tweenMs,
      ease: 'Quad.easeOut'
    });
  }

  pulseSafeLane(rect) {
    this.tweens.add({ targets: rect, alpha: 0.55, duration: 500, yoyo: true, repeat: -1 });
  }

  updateChargeText() {
    this.chargeText.setText('Charges: ' + '●'.repeat(this.charges) + '○'.repeat(MAX_CHARGES - this.charges));
  }

  flashPlayerHit() {
    this.player.setFillStyle(COLOR_RED);
    this.time.delayedCall(150, () => { if (!this.gameOver) this.player.setFillStyle(COLOR_PLAYER); });
  }

  triggerShrink() {
    SFX.combo(this.shrinkStage);
    this.sizeScale = Math.max(SHRINK_FLOOR, this.sizeScale * SHRINK_MULTIPLIER);
    this.smallestSize = Math.min(this.smallestSize, this.sizeScale);
    this.sizeText.setText('Size: ' + Math.round(this.sizeScale * 100) + '%');

    this.tweens.killTweensOf(this.player, ['scaleX', 'scaleY']);
    this.player.setScale(this.sizeScale * 1.25);
    this.tweens.add({
      targets: this.player,
      scaleX: this.sizeScale,
      scaleY: this.sizeScale,
      duration: 160,
      ease: 'Back.easeOut'
    });
  }

  registerDodge() {
    this.dodgeCount++;
    this.streak++;
    const idx = Math.min(this.shrinkStage, SHRINK_THRESHOLDS.length - 1);
    if (this.streak >= SHRINK_THRESHOLDS[idx]) {
      this.streak = 0;
      this.shrinkStage++;
      this.triggerShrink();
    }
  }

  registerMistake() {
    this.streak = 0;
  }

  spawnObstacle(forceType) {
    const phase = getPhase(this.distance);
    const type = forceType || pickWeighted(phase.weights);

    const group = this.add.container(0, -40);
    const laneRects = [];
    let blockedLanes, openLane;

    if (type === 'SINGLE') {
      const blocked = Phaser.Math.Between(0, LANES - 1);
      blockedLanes = [blocked];
    } else {
      openLane = Phaser.Math.Between(0, LANES - 1);
      blockedLanes = [0, 1, 2].filter(l => l !== openLane);
    }

    for (let lane = 0; lane < LANES; lane++) {
      const isBlocked = blockedLanes.includes(lane);
      const rect = this.add.rectangle(this.laneX(lane), 0, LANE_WIDTH - 10, 20, isBlocked ? COLOR_RED : COLOR_SAFE);
      if (!isBlocked) this.pulseSafeLane(rect);
      laneRects.push(rect);
      group.add(rect);
    }

    const obstacle = {
      container: group,
      laneRects,
      safeLanes: [0, 1, 2].filter(l => !blockedLanes.includes(l)),
      passed: false,
      type,
      speedMult: OBSTACLE_SPEED_MULT[type] || 1.0,
      moveSwapped: false
    };

    if (type === 'MOVE') {
      obstacle.oldOpenLane = openLane;
      obstacle.newOpenLane = this.pickMoveTargetLane(openLane);
    }

    this.obstacles.push(obstacle);
  }

  pickMoveTargetLane(oldOpenLane) {
    const others = [0, 1, 2].filter(l => l !== oldOpenLane);
    if (others.includes(1)) {
      // One option is the middle lane — deliberately weight toward the far side
      // instead, so the swap more often demands a real side-to-side reach rather
      // than landing on the cheap, easy-to-camp middle outcome.
      const sideLane = others.find(l => l !== 1);
      return Math.random() < 0.7 ? sideLane : 1;
    }
    // oldOpenLane was already the middle — both options are side lanes, already
    // the hardest case, no bias needed.
    return Phaser.Utils.Array.GetRandom(others);
  }

  swapMovingGate(obs) {
    obs.moveSwapped = true;
    const oldRect = obs.laneRects[obs.oldOpenLane];
    const newRect = obs.laneRects[obs.newOpenLane];

    this.tweens.killTweensOf(oldRect);
    oldRect.alpha = 1;
    oldRect.fillColor = COLOR_RED;

    this.tweens.killTweensOf(newRect);
    newRect.alpha = 1;
    newRect.fillColor = COLOR_SAFE;
    this.pulseSafeLane(newRect);

    obs.safeLanes = [obs.newOpenLane];
  }

  spawnAlien(options) {
    options = options || {};
    const alienPhase = getAlienPhase(this.distance);
    let lane = options.lane !== undefined
      ? options.lane
      : ((Math.random() < alienPhase.laneChance) ? this.currentLane : Phaser.Math.Between(0, LANES - 1));

    if (options.lane === undefined) {
      const soonObstacle = this.obstacles.find(o => !o.passed && o.container.y > -100 && o.container.y < this.playerY - 50);
      if (soonObstacle && !soonObstacle.safeLanes.includes(lane) && soonObstacle.safeLanes.length > 0) {
        lane = Phaser.Utils.Array.GetRandom(soonObstacle.safeLanes);
      }
    }

    const sprite = this.createAlienSprite(this.laneX(lane), GAME_HEIGHT + 40);
    this.aliens.push({ sprite, lane, destroyed: false, forcedDrop: !!options.forcedDrop });
  }

  fireProjectile() {
    SFX.shoot();
    const rect = this.add.rectangle(this.laneX(this.currentLane), this.playerY + 25, 6, 16, COLOR_PROJECTILE);
    this.projectiles.push({ sprite: rect, lane: this.currentLane });
  }

  createAlienSprite(x, y) {
    // A simple but recognizable alien: oval body, two eyes, two curved antennae.
    const container = this.add.container(x, y);
    const body = this.add.ellipse(0, 0, 26, 22, COLOR_ALIEN);
    const eyeL = this.add.ellipse(-6, -2, 6, 8, 0x1a1a2e);
    const eyeR = this.add.ellipse(6, -2, 6, 8, 0x1a1a2e);
    const antennaL = this.add.line(0, 0, -8, -10, -13, -19, 0xe9d5ff).setLineWidth(2);
    const antennaR = this.add.line(0, 0, 8, -10, 13, -19, 0xe9d5ff).setLineWidth(2);
    const tipL = this.add.circle(-13, -19, 2.5, COLOR_ALIEN);
    const tipR = this.add.circle(13, -19, 2.5, COLOR_ALIEN);
    container.add([body, antennaL, antennaR, tipL, tipR, eyeL, eyeR]);
    // subtle idle bob on the body only — never on the container, which drives
    // real movement/collision math and must stay predictable
    this.tweens.add({ targets: body, scaleY: 0.9, duration: 400, yoyo: true, repeat: -1 });
    return container;
  }

  spawnSizeUp(lane, y) {
    // Distinct up-arrow icon so it reads instantly as "grow" vs the round Life Cells.
    const container = this.add.container(this.laneX(lane), y);
    const stem = this.add.rectangle(0, 6, 6, 10, COLOR_SIZEUP);
    const head = this.add.triangle(0, -6, -11, 9, 11, 9, 0, -10, COLOR_SIZEUP);
    container.add([stem, head]);
    this.tweens.add({ targets: container, scale: 1.15, duration: 450, yoyo: true, repeat: -1 });
    this.sizeUps.push({ sprite: container, lane, collected: false });
  }

  triggerGrow(amount) {
    amount = amount || SIZE_UP_AMOUNT;
    this.sizeScale = Math.min(1.0, this.sizeScale + amount);
    this.sizeText.setText('Size: ' + Math.round(this.sizeScale * 100) + '%');
    this.tweens.killTweensOf(this.player, ['scaleX', 'scaleY']);
    this.player.setScale(this.sizeScale * 0.85);
    this.tweens.add({
      targets: this.player,
      scaleX: this.sizeScale,
      scaleY: this.sizeScale,
      duration: 180,
      ease: 'Back.easeOut'
    });
  }

  spawnLifeCell(lane, y, isDouble) {
    const radius = isDouble ? 11 : 8;
    const sprite = this.add.circle(this.laneX(lane), y, radius, COLOR_LIFECELL);
    if (isDouble) sprite.setStrokeStyle(3, 0xffffff, 1);
    this.lifeCells.push({ sprite, lane, collected: false, value: isDouble ? 2 : 1 });
  }

  update(time, delta) {
    if (this.gameOver) return;

    const dt = delta / 1000;
    const phase = getPhase(this.distance);
    this.scrollSpeed = phase.speed;
    this.spawnInterval = phase.spacing;

    this.distance += this.scrollSpeed * dt * 0.05;
    this.scoreText.setText('Distance: ' + Math.floor(this.distance) + 'm');

    this.elapsed += delta;

    // Scripted opening events — fire regardless of the normal random timers.
    while (this.openingAlienIndex < OPENING_ALIEN_DELAYS.length && this.elapsed >= OPENING_ALIEN_DELAYS[this.openingAlienIndex]) {
      const lane = this.openingAlienIndex === 0 ? this.currentLane : Phaser.Math.Between(0, LANES - 1);
      // Only the very first alien guarantees a drop, to teach the mechanic once —
      // forcing all three was maxing charges out within the first ~45m.
      this.spawnAlien({ lane, forcedDrop: this.openingAlienIndex === 0 });
      this.openingAlienIndex++;
    }
    while (this.openingGateIndex < OPENING_GATE_DELAYS.length && this.elapsed >= OPENING_GATE_DELAYS[this.openingGateIndex]) {
      this.spawnObstacle('SINGLE');
      this.openingGateIndex++;
    }

    // One guaranteed real test before 500m — the Discover/Harvest/Choice bands are
    // almost entirely Single Gates (2 of 3 lanes safe), so a casual player could
    // otherwise reach 500m without ever facing a genuine one-lane decision.
    if (!this.earlyTestGateSpawned && this.distance >= EARLY_TEST_GATE_DISTANCE) {
      this.earlyTestGateSpawned = true;
      this.spawnObstacle('DOUBLE');
      this.spawnTimer = 0;
    }

    // Normal random-window spawning only starts once the scripted opening is
    // done, so the two systems never overlap or double up near the start.
    if (this.openingGateIndex >= OPENING_GATE_DELAYS.length) {
      this.spawnTimer += delta;
      if (this.spawnTimer >= this.spawnInterval) {
        this.spawnTimer = 0;
        this.spawnObstacle();
      }
    }

    if (this.openingAlienIndex >= OPENING_ALIEN_DELAYS.length) {
      this.alienTimer += delta;
      if (this.alienTimer >= this.nextAlienDelay) {
        this.alienTimer = 0;
        this.spawnAlien();
        this.nextAlienDelay = this.randomAlienDelay();
      }
    }

    this.fireTimer += delta;
    if (this.fireTimer >= FIRE_INTERVAL) {
      this.fireTimer = 0;
      this.fireProjectile();
    }

    const alienPhase = getAlienPhase(this.distance);
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      const prevPY = p.sprite.y;
      p.sprite.y += PROJECTILE_SPEED * dt;
      let hit = false;
      for (let j = this.aliens.length - 1; j >= 0; j--) {
        const a = this.aliens[j];
        if (a.destroyed || a.lane !== p.lane) continue;
        // Close-range check catches slow crossings; the sign-flip check catches
        // fast ones where the projectile's per-frame jump would otherwise skip
        // straight past the alien without ever landing inside HIT_RADIUS.
        const closeNow = Math.abs(a.sprite.y - p.sprite.y) < HIT_RADIUS;
        const crossed = (prevPY - a.sprite.y) * (p.sprite.y - a.sprite.y) <= 0;
        if (closeNow || crossed) {
          a.destroyed = true;
          SFX.explosion();
          const ay = a.sprite.y, alane = a.lane, forcedDrop = a.forcedDrop;
          a.sprite.destroy();
          this.aliens.splice(j, 1);
          if (forcedDrop) {
            this.spawnLifeCell(alane, ay, false);
          } else if (Math.random() < alienPhase.dropChance) {
            const dropType = pickWeighted(alienPhase.dropWeights);
            if (dropType === 'sizeUp') this.spawnSizeUp(alane, ay);
            else this.spawnLifeCell(alane, ay, dropType === 'double');
          }
          hit = true;
          break;
        }
      }
      if (hit || p.sprite.y > GAME_HEIGHT + 20) {
        p.sprite.destroy();
        this.projectiles.splice(i, 1);
      }
    }

    for (let i = this.aliens.length - 1; i >= 0; i--) {
      const a = this.aliens[i];
      a.sprite.y -= ENEMY_SPEED * dt;
      if (a.sprite.y < -40) {
        a.sprite.destroy();
        this.aliens.splice(i, 1);
      }
    }

    for (let i = this.lifeCells.length - 1; i >= 0; i--) {
      const lc = this.lifeCells[i];
      const prevLY = lc.sprite.y;
      lc.sprite.y -= ENEMY_SPEED * dt;
      const crossedRow = prevLY >= this.playerY - 18 && lc.sprite.y <= this.playerY + 18;
      if (!lc.collected && crossedRow && lc.lane === this.currentLane) {
        lc.collected = true;
        if (lc.value === 2) SFX.coin(); else SFX.pickup();
        const rawTotal = this.charges + lc.value;
        this.charges = Math.min(rawTotal, MAX_CHARGES);
        this.updateChargeText();
        const overflow = rawTotal - this.charges;
        if (overflow > 0) this.triggerGrow(overflow * 0.05); // no kill is ever wasted at max charges
        lc.sprite.destroy();
        this.lifeCells.splice(i, 1);
        continue;
      }
      if (lc.sprite.y < -20) {
        lc.sprite.destroy();
        this.lifeCells.splice(i, 1);
      }
    }

    for (let i = this.sizeUps.length - 1; i >= 0; i--) {
      const su = this.sizeUps[i];
      const prevSY = su.sprite.y;
      su.sprite.y -= ENEMY_SPEED * dt;
      const crossedRow = prevSY >= this.playerY - 18 && su.sprite.y <= this.playerY + 18;
      if (!su.collected && crossedRow && su.lane === this.currentLane) {
        su.collected = true;
        SFX.powerup();
        this.triggerGrow();
        su.sprite.destroy();
        this.sizeUps.splice(i, 1);
        continue;
      }
      if (su.sprite.y < -20) {
        su.sprite.destroy();
        this.sizeUps.splice(i, 1);
      }
    }

    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const obs = this.obstacles[i];
      const prevOY = obs.container.y;
      obs.container.y += this.scrollSpeed * obs.speedMult * dt;

      if (obs.type === 'MOVE' && !obs.moveSwapped && obs.container.y >= this.playerY - MOVE_SWAP_OFFSET) {
        this.swapMovingGate(obs);
      }

      // Crossing check (not just "is it in the window this frame") — a fast gate
      // on a slow/laggy frame could otherwise jump clean past the 30px detection
      // band without ever being sampled inside it, silently skipping the hit.
      const crossedRow = prevOY <= this.playerY + 15 && obs.container.y >= this.playerY - 15;
      if (!obs.passed && crossedRow) {
        if (!obs.safeLanes.includes(this.currentLane)) {
          if (this.charges > 0) {
            SFX.hit();
            this.charges--;
            this.updateChargeText();
            this.flashPlayerHit();
            this.registerMistake();
            obs.passed = true;
          } else {
            this.triggerGameOver();
            return;
          }
        } else {
          obs.passed = true;
          this.registerDodge();
        }
      }

      if (obs.container.y > GAME_HEIGHT + 40) {
        obs.container.destroy();
        this.obstacles.splice(i, 1);
      }
    }
  }

  triggerGameOver() {
    SFX.fail();
    this.gameOver = true;
    this.player.setFillStyle(COLOR_RED);
    this.gameOverText.setText(
      'GAME OVER\n' +
      'Distance: ' + Math.floor(this.distance) + 'm\n' +
      'Size: ' + Math.round(this.sizeScale * 100) + '%\n' +
      'Smallest: ' + Math.round(this.smallestSize * 100) + '%\n' +
      'Dodges: ' + this.dodgeCount + '\n\n' +
      'Tap to retry'
    );
  }
}

const config = {
  type: Phaser.AUTO, audio: { noAudio: true },
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  parent: 'game-container',
  backgroundColor: '#111111',
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
