<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fireteam Zero — Atrium</title>
<style>
  :root {
    --panel-bg: linear-gradient(135deg, rgba(10,12,18,0.82), rgba(10,12,18,0.6));
    --panel-edge: #3a3f52; --eyebrow: #6d7488;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.9);
    pointer-events: none; z-index: 13; box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #crosshair.hit { width: 14px; height: 14px; background: #ff4d4d; }
  #hud {
    position: fixed; bottom: 16px; left: 16px; color: #c3c7d6; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; background: var(--panel-bg); padding: 6px 10px 7px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    border-top: 2px solid var(--panel-edge);
    line-height: 1.5; z-index: 10; pointer-events: none; max-width: calc(100vw - 250px); transition: opacity 0.6s;
  }
  #hud.dim { opacity: 0; }   /* fully fades once you've had time to read it — it would otherwise sit on top of the killstreak panel in TDM */
  #callout {
    position: fixed; top: 46px; left: 50%; transform: translateX(-50%);
    color: #ffd24d; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    background: var(--panel-bg); padding: 4px 14px 5px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    border-bottom: 2px solid var(--panel-edge);
    z-index: 10; pointer-events: none;
  }
  #blocker {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; font-family: monospace; text-align: center;
    z-index: 20; cursor: pointer; padding: 20px;
  }
  #blocker h1 { margin-bottom: 8px; }
  #blocker p { color: #aaa; max-width: 520px; line-height: 1.6; }
  #beam-prompt {
    position: fixed; top: 60%; left: 50%; transform: translate(-50%, -50%);
    color: #ff9a5a; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    background: var(--panel-bg); padding: 6px 14px; border-left: 2px solid #ff9a5a;
    z-index: 10; pointer-events: none; display: none;
  }
  #slide-status {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    color: #4dd2ff; font-family: monospace; font-size: 16px; font-weight: bold;
    letter-spacing: 0.1em; text-shadow: 0 0 6px rgba(77,210,255,0.8);
    z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.1s;
  }
  /* live map diagram (press M to resize / hide) */
  #map {
    position: fixed; top: 84px; left: 16px; z-index: 12;
    border: 1px solid rgba(255,255,255,0.18); border-top: 2px solid var(--panel-edge);
    pointer-events: none;
  }
  /* ---- team deathmatch HUD ---- */
  .ui { font-family: ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
  #scorebar {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 11;
    display: none; align-items: center; gap: 12px; color: #e8eaf0; font-weight: 700; font-size: 13px;
    background: var(--panel-bg); padding: 4px 16px 5px;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    border-bottom: 2px solid var(--panel-edge);
  }
  #scorebar .a { color: #6fa0ff; } #scorebar .b { color: #ff6b6b; }
  #scorebar b { font-size: 17px; } #clock { color: #9aa0b8; min-width: 40px; text-align: center; font-size: 12px; }
  #killfeed { position: fixed; top: 10px; right: 14px; z-index: 11; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  #killfeed div {
    background: var(--panel-bg); color: #c3c7d6; font-size: 11px; padding: 3px 10px 3px 8px;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%); border-right: 2px solid var(--panel-edge);
    transition: opacity 0.4s;
  }
  #killfeed .ka { color: #7fa9ff; font-weight: bold; } #killfeed .kb { color: #ff7a7a; font-weight: bold; }
  #killfeed .me { outline: 1px solid rgba(255,255,255,0.6); }
  #vitals {
    position: fixed; right: 16px; bottom: 16px; z-index: 10; display: none; text-align: right;
    background: var(--panel-bg); padding: 7px 11px 9px; color: #e8eaf0; min-width: 150px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 9px 100%, 0 calc(100% - 9px));
    border-top: 2px solid var(--panel-edge);
  }
  #hpnum { font-size: 22px; font-weight: 700; } #hpnum small { font-size: 10px; color: var(--eyebrow); }
  #hpbar { height: 4px; background: rgba(255,255,255,0.12); margin: 4px 0 7px; overflow: hidden; }
  #hpbar i { display: block; height: 100%; width: 100%; background: #6fe08a; }
  #ammo { font-size: 17px; font-weight: 700; } #ammo small { font-size: 11px; color: var(--eyebrow); }
  #reload { color: #ffd24d; font-size: 10px; height: 12px; letter-spacing: 0.04em; }
  #streakbar {
    position: fixed; left: 16px; bottom: 16px; z-index: 10; display: none; color: #e8eaf0; min-width: 190px;
    background: linear-gradient(135deg, rgba(10,12,18,0.82), rgba(10,12,18,0.6));
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
    padding: 7px 11px 9px; border-top: 2px solid #3a3f52;
  }
  #streaklabel { font-size: 10px; letter-spacing: 0.12em; color: #6d7488; display: flex; justify-content: space-between; }
  #streaklabel b { color: #fff; font-size: 15px; letter-spacing: 0; font-weight: 700; }
  #streakpips { display: flex; gap: 2px; margin: 5px 0 4px; }
  #streakpips i {
    display: block; flex: 1; height: 4px; background: #2a2d38; clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
  }
  #streakpips i.done { background: #ffd24d; }
  #streaknext { font-size: 10px; color: #6d7488; letter-spacing: 0.03em; min-height: 12px; }
  #streaknext b { color: #7fa9ff; font-weight: 700; }
  #streakactive { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; min-height: 0; }
  #streakactive span {
    font-size: 10px; letter-spacing: 0.04em; padding: 2px 6px 2px 5px; background: rgba(255,255,255,0.06);
    border-left: 2px solid var(--c, #8fe3a8); color: #d6d9e4;
  }
  #ksbanner {
    position: fixed; top: 16px; left: 50%; z-index: 15; opacity: 0; color: #fff;
    transform: translateX(-50%) translateY(-8px); transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    background: linear-gradient(90deg, rgba(8,9,14,0.95), rgba(8,9,14,0.75));
    clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    padding: 8px 22px 8px 14px; border-left: 3px solid var(--c, #ff9a5a); box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  #ksbanner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #ksbanner .eyebrow { font-size: 9px; letter-spacing: 0.22em; color: #6d7488; }
  #ksbanner b { display: block; font-size: 19px; letter-spacing: 0.1em; color: var(--c, #ff9a5a); line-height: 1.3; }
  #ksbanner span { color: #9aa0b8; font-size: 11px; letter-spacing: 0.02em; }
  #hitmark { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); z-index: 14; opacity: 0; color: #fff; }
  #hitmark::before, #hitmark::after {
    content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; background: currentColor;
    -webkit-mask: linear-gradient(#000 0 36%, transparent 36% 64%, #000 64%); mask: linear-gradient(#000 0 36%, transparent 36% 64%, #000 64%);
  }
  #hitmark::before { transform: rotate(45deg); } #hitmark::after { transform: rotate(-45deg); }
  #vignette { position: fixed; inset: 0; z-index: 9; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(220,0,0,0.6) 100%); }
  #dmgdir { position: fixed; top: 50%; left: 50%; width: 0; height: 0; z-index: 14; opacity: 0; }
  #dmgdir i { position: absolute; left: -70px; top: -120px; width: 140px; height: 140px; border-radius: 50%; border-top: 7px solid rgba(255,50,50,0.95); }
  #death {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); z-index: 15; display: none;
    text-align: center; color: #e8eaf0; background: var(--panel-bg); padding: 10px 22px 12px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    border-top: 2px solid var(--panel-edge);
  }
  #death b { color: #ff6b6b; font-size: 19px; letter-spacing: 0.04em; } #death div { color: var(--eyebrow); margin-top: 5px; font-size: 12px; }
  #protect { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 10; color: #8fd0ff; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; display: none; }
  #tabboard {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 16; display: none;
    background: linear-gradient(135deg, rgba(8,10,16,0.95), rgba(8,10,16,0.88)); padding: 14px 18px;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    border-top: 2px solid var(--panel-edge);
  }
  .boards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .boards table { border-collapse: collapse; min-width: 220px; font-size: 14px; color: #ddd; }
  .boards th { text-align: left; padding: 4px 10px; border-bottom: 2px solid; }
  .boards td { padding: 4px 10px; } .boards td + td, .boards th + th { text-align: right; }
  .boards .ta th { color: #7fa9ff; border-color: #3d7bff; } .boards .tb th { color: #ff7a7a; border-color: #ff4545; }
  .boards tr.me td { color: #ffd24d; font-weight: bold; } .boards tr.dead td { opacity: 0.5; }
  #menu { display: flex; flex-direction: column; gap: 12px; align-items: center; margin: 6px 0 10px; }
  #menu .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; color: #aaa; }
  #menu button {
    font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06); color: #fff; padding: 10px 18px; font-size: 15px; font-weight: bold;
  }
  #menu button:hover { background: rgba(255,255,255,0.14); }
  #menu button small { display: block; font-weight: normal; font-size: 11px; color: #aaa; margin-top: 3px; }
  #menu button.sel { border-color: #ffd24d; color: #ffd24d; }
  #menu .diff button { padding: 6px 12px; font-size: 12px; }
  #sensrow { font-size: 12px; color: #aaa; }
  #sensrow span { font-weight: bold; }
  #sensrow input[type=range] { width: 140px; accent-color: #ffd24d; }
  #sensVal { min-width: 44px; color: #ffd24d; font-weight: bold; }
  #invertBtn { padding: 6px 12px; font-size: 11px; }
  #invertBtn.sel { border-color: #ffd24d; color: #ffd24d; }
  #menu-settings { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; }
  #keybinds {
    display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 6px 18px;
    max-width: 460px; margin: 4px auto 0;
  }
  .bindrow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12px; color: #aaa;
  }
  .bindrow button {
    font-family: inherit; cursor: pointer; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06); color: #fff; padding: 5px 10px; font-size: 12px; font-weight: bold;
    min-width: 78px;
  }
  .bindrow button:hover { background: rgba(255,255,255,0.14); }
  .bindrow button.capturing { border-color: #ffd24d; color: #ffd24d; animation: bindpulse 0.9s ease-in-out infinite; }
  .bindrow button.unbound { color: #777; font-weight: normal; font-style: italic; }
  @keyframes bindpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  #board { margin-top: 10px; }
  #blocker { overflow-y: auto; justify-content: safe center; }
  #crosshair.ads { width: 5px; height: 5px; background: #ff3b3b; box-shadow: 0 0 4px #ff3b3b; }
  /* Holo sight: a wider ring+dot reticle instead of the red-dot's single point — easier to pick up
     moving targets up close, the trade a holo makes against a plain red dot's cleaner sight picture. */
  #crosshair.holo {
    width: 16px; height: 16px; background: transparent; border-radius: 50%;
    border: 1.5px solid #5be0ff; box-shadow: 0 0 5px rgba(91,224,255,0.9), inset 0 0 4px rgba(91,224,255,0.5);
  }
  #crosshair.holo::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 2.5px; height: 2.5px; border-radius: 50%;
    background: #5be0ff; box-shadow: 0 0 4px #5be0ff; transform: translate(-50%, -50%);
  }
  /* Scope tubes: ACOG (4x, wider window, green-tinted glass) vs Sniper Scope (8x, tight tunnel, red glass). */
  #scope { position: fixed; inset: 0; z-index: 8; display: none;
    background: radial-gradient(circle at center, transparent 0, transparent 33vmin, rgba(0,0,0,0.6) 33.3vmin, #000 34vmin); }
  #scope::before, #scope::after { content: ''; position: absolute; left: 50%; top: 50%; background: rgba(0,0,0,0.85); transform: translate(-50%, -50%); }
  #scope::before { width: 66vmin; height: 1px; } #scope::after { width: 1px; height: 66vmin; }
  #scope.acog { background: radial-gradient(circle at center, rgba(70,255,150,0.05) 0, rgba(70,255,150,0.05) 39.6vmin, rgba(0,0,0,0.55) 40vmin, #000 41vmin); }
  #scope.acog::before, #scope.acog::after { background: rgba(40,30,10,0.85); }
  #scope.acog::before { box-shadow: 0 -6vmin 0 -0.4px rgba(40,30,10,0.85), 0 6vmin 0 -0.4px rgba(40,30,10,0.85); }   /* two faint hash ticks up/down the vertical post, ACOG-style rangefinder */
  #scope.sniper8x { background: radial-gradient(circle at center, rgba(255,60,60,0.04) 0, rgba(255,60,60,0.04) 23.6vmin, rgba(0,0,0,0.7) 24vmin, #000 25vmin); }
  #scope.sniper8x::before, #scope.sniper8x::after { background: rgba(20,0,0,0.9); }
  #wname { font-size: 12px; color: #9fb4ff; letter-spacing: 0.08em; margin-bottom: 2px; }
  #xppops { position: fixed; top: calc(50% + 26px); left: 50%; transform: translateX(-50%); z-index: 14; display: flex; flex-direction: column; align-items: center; }
  #xppops div { color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px #000; animation: xpup 1.4s ease-out forwards; }
  #xppops div.gold { color: #ffd24d; }
  @keyframes xpup { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  #banner { position: fixed; top: 21%; left: 50%; transform: translateX(-50%); z-index: 15; opacity: 0; transition: opacity 0.4s;
    text-align: center; color: #fff; background: rgba(0,0,0,0.6); padding: 12px 28px; border-radius: 10px; border: 1px solid rgba(255,210,77,0.5); }
  #banner b { display: block; font-size: 26px; color: #ffd24d; letter-spacing: 0.08em; } #banner span { color: #ccc; font-size: 13px; }
  #banner i { display: block; font-style: normal; color: #8fe3a8; font-size: 13px; margin-top: 4px; }
  .phase { display: inline-block; padding: 1px 7px; margin-right: 6px; border-radius: 4px; font-size: 11px; font-weight: bold;
    color: #000; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .pcard { text-align: center; color: #ddd; min-width: 300px; } .pcard b { color: #fff; font-size: 16px; } .pcard .rank { color: #aaa; font-size: 13px; }
  .pcard small { color: #9aa0b8; font-size: 12px; }
  .xpbar { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; margin: 6px auto 4px; max-width: 320px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd24d, #ff9a1f); }
  #menu #loadout button { padding: 7px 10px; font-size: 12px; min-width: 104px; }
  #menu #loadout button.locked { opacity: 0.45; } #menu #loadout button.locked.token { opacity: 0.85; border-style: dashed; }
  #menu #camos { gap: 6px; } #menu #camos button { width: 22px; height: 22px; padding: 0; border-radius: 5px; }
  #menu #camos button.locked { opacity: 0.18; cursor: default; }
  #menu .phasebtn { border-color: #ffd24d; color: #ffd24d; margin-top: 6px; }
  .xpsum { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 10px; }
  .xptot { color: #ffd24d; font-weight: bold; font-size: 18px; }
  .xpsum table { font-size: 12px; color: #bbb; } .xpsum td { padding: 1px 8px; } .xpsum td + td { text-align: right; color: #fff; }
  .lv { color: #9aa0b8; font-size: 11px; margin-left: 6px; }
</style>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   FIRETEAM ZERO — ATRIUM (geometry blockout)

   The whole map is solid boxes plus ONE big "ground" block with the
   tunnel / ramps / scaffold bays carved out of it. Everything walkable
   is physically connected and everything else is solid, so there are no
   floating floor islands to fall between and no open edges to walk off.

   Top-down (X = west/east, Z = north/south; team A left, team B right):

     z=+15  spawnA | A-stairs lane > A-STAIRS ^ MEZZANINE (y=5) ^ B-STAIRS < lane | spawnB
                     (solid mass)          MID room, open to the sky
     z=  0  spawnA = A-LONG = A-CHOKE ======== MID ======== B-CHOKE = B-LONG = spawnB
                     (solid mass)     scaffold bays (jump-climb up from the tunnel)
     z=-15  ramp v ======= LOWER HALL tunnel (y=-5, runs under everything) ======= v ramp
   ============================================================ */

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201f2a);
scene.fog = new THREE.Fog(0x2a2632, 40, 130);

// Sky dome: a vertical gradient (low/mid/top colors), built fresh per map by applySkyAndWeather()
// below so each map can have its own atmosphere (Atrium's warm glass-roof glow vs. Monsoon's storm).
function makeSkyDome(top, mid, low) {
  const geo = new THREE.SphereGeometry(300, 16, 12);
  const pos = geo.attributes.position, colors = [];
  const topC = new THREE.Color(top), midC = new THREE.Color(mid), lowC = new THREE.Color(low);
  const c = new THREE.Color();

// for a ~120m one with a dozen actors, so colliders are bucketed into an XZ grid. Each collider is

function applyHorizontal(b, w, speed, dt) {

// ======================================================
// MAP DIAGRAM — live top-down plan + side-view height strip. M cycles large -> small -> off.
// Drawn from the same colliders the physics uses, so it is exactly what's there
// (a collapsed Mezzanine half disappears from the map too).
// ======================================================
const mapCanvas = document.getElementById('map');
const mctx = mapCanvas.getContext('2d');
const staticMap = document.createElement('canvas');
const WB = { x0: -55, x1: 55, z0: -16, z1: 16 };          // world rectangle shown — mutated in place by loadMap()
let Y_TOP = 7, Y_BOT = -6;                                // side-view height range — set by loadMap()
const MAP_ORDER = [1, 2, 0];                              // 1 = large, 2 = small, 0 = hidden
let mapMode = START_MODE === 'roam' ? 1 : 2, mapDirty = true, ML = null;   // free roam opens with the big map; TDM with the small one

function layoutMap() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const big = mapMode === 1;
  const fit = Math.floor((0.5 * window.innerHeight - 154) / 0.362);          // keep the large map above the crosshair on short screens
  const W = Math.min(window.innerWidth - 32, big ? Math.max(340, Math.min(820, fit)) : 340);
  const s = W / (WB.x1 - WB.x0);                          // px per world unit (plan)
  const sy = s * 0.6;                                     // vertical scale of the side view
  const head = 22, planH = Math.round((WB.z1 - WB.z0) * s);
  const sideH = big ? Math.round((Y_TOP - Y_BOT) * sy) : 0;
  const sideTop = head + planH + 20;
  const H = big ? sideTop + sideH + 8 : head + planH + 6;
  ML = { dpr, big, W, H, s, sy, head, planH, sideTop, sideH };
  for (const c of [mapCanvas, staticMap]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  mapCanvas.style.width = W + 'px'; mapCanvas.style.height = H + 'px';
  mapDirty = true;
}
const mx = (x) => (x - WB.x0) * ML.s;
const mz = (z) => ML.head + (WB.z1 - z) * ML.s;           // +Z is up on the map
const my = (y) => ML.sideTop + (Y_TOP - y) * ML.sy;

function cycleMap() {
  mapMode = MAP_ORDER[(MAP_ORDER.indexOf(mapMode) + 1) % MAP_ORDER.length];
  mapCanvas.style.display = mapMode === 0 ? 'none' : 'block';
  if (mapMode) layoutMap();
}

function drawStaticMap() {
  const g = staticMap.getContext('2d');
  const { dpr, big, W, H, s, head, planH, sideTop, sideH } = ML;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(10,12,18,0.86)'; g.fillRect(0, 0, W, H);                  // panel background (slightly see-through)
  const R = (x0, z0, x1, z1) => [mx(x0), mz(z1), (x1 - x0) * s, (z1 - z0) * s];
  const font = (px) => `bold ${px}px ui-monospace, Menlo, Consolas, monospace`;
  const label = (txt, x, z, px = big ? 10 : 7, color = '#fff') => {
    g.font = font(px); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 3; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,0.8)'; g.strokeText(txt, mx(x), mz(z));
    g.fillStyle = color; g.fillText(txt, mx(x), mz(z));
  };
  const by = (tag, fn) => { for (const c of colliders) if (c.tag === tag) fn(c, R(c.x0, c.z0, c.x1, c.z1)); };
  const mm = currentMap.minimap;

  // header: title + legend (the legend vocabulary — wall/cover/stairs/etc — is shared across every
  // map since they all build geometry with the same addSolid() tag conventions)
  g.fillStyle = '#e8eaf5'; g.font = font(big ? 12 : 9); g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(`${mm.title} · LIVE MAP`, 8, head / 2);
  if (big && W >= 700) {
    let lx = 168;
    for (const [name, fill, stroke] of (mm.legend || DEFAULT_LEGEND)) {
      g.fillStyle = fill; g.fillRect(lx, head / 2 - 5, 10, 10);
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.strokeRect(lx + 0.5, head / 2 - 4.5, 9, 9); }
      g.font = font(10); g.textAlign = 'left'; g.fillStyle = '#b9bdd0'; g.fillText(name, lx + 14, head / 2);
      lx += 14 + g.measureText(name).width + 14;
    }
  }

  // plan: floor, spawn pads, stairs/escalator, cover, mezzanine, walls, then anything shown through the floor —
  // all of this (besides the spawn pads and the optional lower-hall overlay) is driven straight off the
  // live `colliders` tags, so it works unmodified for any map built with the same addSolid() tag vocabulary.
  g.fillStyle = '#12141b'; g.fillRect(0, head, W, planH);
  g.fillStyle = '#4a4d5e'; g.fillRect(...R(WB.x0 + 1, WB.z0 + 1, WB.x1 - 1, WB.z1 - 1));
  if (mm.spawnBox) {
    g.fillStyle = 'rgba(70,110,230,0.55)'; g.fillRect(...R(...mm.spawnBox.A));
    g.fillStyle = 'rgba(230,70,70,0.55)'; g.fillRect(...R(...mm.spawnBox.B));
  }
  by('stairs', (c, r) => { g.fillStyle = `hsl(228,45%,${28 + c.y1 * 7}%)`; g.fillRect(...r); });
  by('escalator', (c, r) => { g.fillStyle = `hsl(220,12%,${34 + c.y1 * 6}%)`; g.fillRect(...r); });
  by('spiral', (c, r) => { g.fillStyle = `hsl(${215 + c.y1 * 3},55%,${32 + c.y1 * 1.8}%)`; g.fillRect(...r); });
  by('cover', (c, r) => { g.fillStyle = c.y1 > 3 ? '#86c086' : '#5f8a5f'; g.fillRect(...r); });
  for (const c of colliders) {
    if (c.tag !== 'mezzW' && c.tag !== 'mezzE') continue;
    const r = R(c.x0, c.z0, c.x1, c.z1);
    if (c.y1 < 5.5) { g.fillStyle = 'rgba(106,120,255,0.45)'; g.fillRect(...r); g.strokeStyle = '#9aa6ff'; g.lineWidth = 1.5; g.strokeRect(...r); }
    else { g.fillStyle = '#c9d0ff'; g.fillRect(...r); }                       // broken railing
  }
  if (currentMap.hasBeams) {
    for (const side of collapsedSides) {
      g.setLineDash([4, 3]); g.strokeStyle = '#ff5a3c'; g.lineWidth = 1.5;
      g.strokeRect(...(side === 'W' ? R(-15, 9, 0, 15) : R(0, 9, 15, 15))); g.setLineDash([]);
      label('COLLAPSED', side === 'W' ? -7.5 : 7.5, 12, big ? 9 : 6, '#ff8a70');
    }
  }
  by('wall', (c, r) => { g.fillStyle = '#0d0e13'; g.fillRect(...r); g.strokeStyle = '#a7adc8'; g.lineWidth = 1; g.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1); });
  by('choke', (c, r) => { g.fillStyle = '#8a6a48'; g.fillRect(...r); g.strokeStyle = '#d9b184'; g.lineWidth = 1; g.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1); });
  if (mm.lowerHall) {
    const lh = [mm.lowerHall.x0, mm.lowerHall.z0, mm.lowerHall.x1, mm.lowerHall.z1];
    g.fillStyle = 'rgba(47,209,200,0.18)'; g.fillRect(...R(...lh));     // shown through the floor
    by('ramp', (c, r) => { g.fillStyle = `rgba(47,209,200,${0.25 + 0.5 * (1 + c.y1 / 5)})`; g.fillRect(...r); });   // ramps: bright = shallow, dark = deep
    by('scaffold', (c, r) => { g.fillStyle = `rgba(255,150,60,${0.3 + 0.6 * (c.y1 + 5) / 5})`; g.fillRect(...r); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; g.strokeRect(...r); });
    g.setLineDash([5, 4]); g.strokeStyle = '#2fd1c8'; g.lineWidth = 1.5; g.strokeRect(...R(...lh)); g.setLineDash([]);
  } else {
    by('ramp', (c, r) => { g.fillStyle = `rgba(47,209,200,${0.25 + 0.5 * (1 + c.y1 / 5)})`; g.fillRect(...r); });
    by('scaffold', (c, r) => { g.fillStyle = `rgba(255,150,60,${0.3 + 0.6 * (c.y1 + 5) / 5})`; g.fillRect(...r); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; g.strokeRect(...r); });
  }
  for (const c of colliders) {
    if (!c.tag || !c.tag.startsWith('beam')) continue;
    const r = R(c.x0, c.z0, c.x1, c.z1);
    g.fillStyle = '#ff5a3c'; g.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
    g.strokeStyle = '#fff'; g.lineWidth = 1; g.strokeRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
  }

  // plan labels — purely per-map data (room/lane names and where to put them)
  const small = big ? 8 : 6;
  for (const l of mm.labels) {
    const txt = (l.textBig && big) ? l.textBig : l.text;
    label(txt, l.x, l.z, l.compact ? small : undefined, l.color);
  }

  // side view: an automatic silhouette (every collider, colored by its tag, projected onto x/height) —
  // works for any map's geometry with no per-map art needed, large map only
  if (big) {
    g.fillStyle = '#e8eaf5'; g.font = font(11); g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('SIDE VIEW · height at each x', 8, sideTop - 10);
    g.fillStyle = '#12141b'; g.fillRect(0, sideTop, W, sideH);
    for (const c of colliders) {
      const fill = SIDE_TAG_COLOR[c.tag] || SIDE_TAG_COLOR.default;
      const x0 = mx(c.x0), x1 = mx(c.x1), y0 = my(c.y1), y1 = my(c.y0);
      g.fillStyle = fill; g.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
    }
    g.font = font(9); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#9aa0b8';
    for (const [y, t] of (mm.sideLabels || [[0, 'y 0  main floor']])) g.fillText(t, 6, my(y) - 4);
  }
}
const DEFAULT_LEGEND = [['wall', '#0d0e13', '#a7adc8'], ['cover', '#5f8a5f'], ['stairs', '#4a5db0'],
  ['upper level', 'rgba(106,120,255,0.55)', '#9aa6ff'], ['lower level', 'rgba(47,209,200,0.55)', '#2fd1c8'],
  ['climb', '#ff963c'], ['shoot', '#ff5a3c']];
const SIDE_TAG_COLOR = {
  wall: 'rgba(13,14,19,0.9)', choke: 'rgba(138,106,72,0.85)', cover: 'rgba(95,138,95,0.8)',
  stairs: 'rgba(74,93,176,0.75)', escalator: 'rgba(119,119,136,0.7)', scaffold: 'rgba(255,150,60,0.55)',
  ramp: 'rgba(47,209,200,0.45)', spiral: 'rgba(111,134,214,0.8)', rail: 'rgba(159,198,232,0.35)', floor: 'rgba(58,61,76,0.9)', mezzW: 'rgba(106,120,255,0.55)', mezzE: 'rgba(106,120,255,0.55)',
  beamW: 'rgba(255,90,60,0.9)', beamE: 'rgba(255,90,60,0.9)', default: 'rgba(120,120,140,0.3)',
};

function drawMap() {
  if (!mapMode) return;
  if (mapDirty) { drawStaticMap(); mapDirty = false; }
  const { dpr, big, s } = ML;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
  mctx.drawImage(staticMap, 0, 0);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // teammates always; enemies only while someone on your team can see them (radar-style) — or during Intel Ping / Blackout
  if (match.started && match.mode === 'tdm') {
    const rr = big ? 4 : 3, reconActive = gameTime < reconUntil;
    for (const b of bots) {
      const ally = b.team === player.team;
      if (!ally && (b.dead || (gameTime - b.spottedT > 1.2 && !reconActive))) continue;
      const bx = mx(b.pos.x), bz = mz(b.pos.z);
      if (b.dead) {
        mctx.strokeStyle = '#7fa9ff'; mctx.lineWidth = 2; mctx.beginPath();
        mctx.moveTo(bx - rr, bz - rr); mctx.lineTo(bx + rr, bz + rr); mctx.moveTo(bx + rr, bz - rr); mctx.lineTo(bx - rr, bz + rr); mctx.stroke();
        continue;
      }
      mctx.fillStyle = ally ? '#5b8cff' : '#ff4545'; mctx.strokeStyle = b.pos.y > 4 ? '#c9d0ff' : b.pos.y < -2 ? '#2fd1c8' : '#000'; mctx.lineWidth = 1.5;
      mctx.beginPath(); mctx.arc(bx, bz, rr, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
      if (big) { mctx.beginPath(); mctx.arc(bx, my(b.pos.y + 0.9), 3, 0, Math.PI * 2); mctx.fill(); }
    }
  }

  if (fmArmed) {                                                     // Fire Mission: pending strike marker, ticking down to impact
    const fx = mx(fmX), fz = mz(fmZ), pulse = 3 + 3 * Math.abs(Math.sin(gameTime * 10));
    mctx.strokeStyle = '#ff7a2f'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(fx, fz, (big ? 7 : 5) + pulse, 0, Math.PI * 2); mctx.stroke();
    mctx.fillStyle = '#ff7a2f'; mctx.beginPath(); mctx.arc(fx, fz, big ? 3 : 2.2, 0, Math.PI * 2); mctx.fill();
  }
  if (turret) {                                                      // Sentry Turret marker
    const tx = mx(turret.pos.x), tz = mz(turret.pos.z);
    mctx.fillStyle = turret.team === player.team ? '#5b8cff' : '#ff4545'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
    mctx.beginPath(); mctx.moveTo(tx, tz - 4); mctx.lineTo(tx + 4, tz + 3); mctx.lineTo(tx - 4, tz + 3); mctx.closePath(); mctx.fill(); mctx.stroke();
  }
  for (const d of dogs) {                                            // Attack Dog markers
    const dx = mx(d.pos.x), dz = mz(d.pos.z);
    mctx.fillStyle = '#c9a36a'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1; mctx.beginPath(); mctx.arc(dx, dz, 2.5, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
  }
  if (heli) {                                                        // Gunship marker
    const hx = mx(heli.mesh.position.x), hz = mz(heli.mesh.position.z);
    mctx.strokeStyle = '#6fd1ff'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(hx, hz, big ? 5 : 3.5, 0, Math.PI * 2); mctx.stroke();
  }
  const y = player.pos.y;
  const lvl = y < -2 ? ['LOWER HALL', '47,209,200'] : y > 4 ? ['MEZZANINE', '143,155,255'] : ['MAIN FLOOR', '255,210,77'];
  const col = `rgb(${lvl[1]})`;
  const px = mx(player.pos.x), pz = mz(player.pos.z);
  const ax = -Math.sin(player.yaw), ay = Math.cos(player.yaw);                 // facing, in map space (+Z is up)
  const half = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect), ang = Math.atan2(ay, ax);
  mctx.beginPath(); mctx.moveTo(px, pz); mctx.arc(px, pz, 15 * s, ang - half, ang + half); mctx.closePath();
  mctx.fillStyle = `rgba(${lvl[1]},0.22)`; mctx.fill();                       // what you can currently see
  const r = big ? 5 : 4;
  mctx.strokeStyle = col; mctx.lineWidth = 2; mctx.beginPath(); mctx.moveTo(px, pz); mctx.lineTo(px + ax * r * 3, pz + ay * r * 3); mctx.stroke();
  mctx.fillStyle = col; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.arc(px, pz, r, 0, Math.PI * 2); mctx.fill(); mctx.stroke();

  mctx.font = `bold ${big ? 11 : 8}px ui-monospace, Menlo, Consolas, monospace`; mctx.textAlign = 'right'; mctx.textBaseline = 'middle';
  const t = `${lvl[0]} · y ${y.toFixed(1)}`;
  mctx.lineWidth = 3; mctx.lineJoin = 'round'; mctx.strokeStyle = 'rgba(0,0,0,0.8)'; mctx.strokeText(t, ML.W - 8, ML.head + 11);
  mctx.fillStyle = col; mctx.fillText(t, ML.W - 8, ML.head + 11);
  if (big) {
    mctx.fillStyle = col; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
    mctx.beginPath(); mctx.arc(px, my(y + 0.9), 4, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
  }
}

// ======================================================
// FRAME UPDATE
// ======================================================
const MANTLE_HEIGHT = 2.2;    // ledges/short walls up to this tall can be climbed with one jump
// Mantle / auto-climb: jumping toward a ledge too tall to just walk up (but short enough to vault)
// automatically spends your air-boost to finish the climb, same trick the bots already use to get
// up the scaffold. So a scaffold-style stair run is one jump instead of a jump per tread, and
// jumping at any short wall or crate now actually gets you over it.
function updateMantle(b) {
  const f = forwardVec();
  const ax = b.pos.x + f.x * 0.55, az = b.pos.z + f.z * 0.55;
  if (b.onGround) {
    b.mantleReady = blockedAt(ax, az, b.pos.y) && groundAt(ax, az, b.pos.y + MANTLE_HEIGHT) > b.pos.y + STEP;
  } else if (b.mantleReady && b.vel.y < 1 && b.airBoosts > 0 && blockedAt(ax, az, b.pos.y)) {
    b.airBoosts--; b.vel.y = Math.max(b.vel.y, BOOST); b.mantleReady = false;
  }
}

function updatePlayer(dt) {
  if (player.dead) { player.vel.set(0, 0, 0); return; }
  if (blockedAt(player.pos.x, player.pos.z, player.pos.y)) unstick(player);
  // Slide-cancel: jumping out of a slide keeps the slide's speed and launches it into the
  // air-strafe system above, instead of snapping back down to walk speed.
  let slideJumpCancel = false;
  if (player.isSliding && isDown('jump') && player.onGround) {
    slideJumpCancel = true; player.isSliding = false; player.slideCooldown = SLIDE_COOLDOWN;
  }
  // Horizontal velocity: normal walking, a committed slide burst, or (mid-air) strafing
  if (!slideJumpCancel) applyHorizontal(player, wishDir(), SPEED * curW.speed * (1 - 0.25 * adsT) * (gameTime < adrenUntil ? 1.15 : 1), dt);
  updateMantle(player);
  updateWallRun(dt);                 // may override vel.x/z to hug a wall, or kick off it on Space
  integrate(player, dt, isDown('jump') && !player.wallRunning);
  player.lean += ((isDown('leanLeft') ? -1 : isDown('leanRight') ? 1 : 0) - player.lean) * Math.min(1, dt * 8);
  // Footsteps: tick off distance traveled while grounded (not sliding) rather than a flat timer, so
  // sprinting steps faster than a slow walk, with a brighter sound on stairs/scaffold than floor.
  if (player.onGround && !player.isSliding) {
    player.stepDist += Math.hypot(player.vel.x, player.vel.z) * dt;
    if (player.stepDist >= 2.0) {
      player.stepDist = 0;
      playFootstep(surfaceTagAt(player.pos.x, player.pos.z, player.pos.y));
    }
  } else player.stepDist = Math.min(player.stepDist, 1.0);   // airborne: don't let distance bank up into an instant step on landing
  if (player.pos.y < -9) respawn(player.team);       // can't happen on a sealed map, but never leave anyone falling forever
}

let deathYaw = 0;
function updateCamera() {
  if (player.dead) {                                  // death cam: on the floor, turned toward whoever got you
    camera.position.set(player.pos.x, player.pos.y + 0.55, player.pos.z);
    camera.rotation.set(0.05, deathYaw, 0.35);
    return;
  }
  const r = rightVec();
  camera.position.set(
    player.pos.x + r.x * player.lean * 0.4,
    player.pos.y + (player.isSliding ? 0.95 : EYE),
    player.pos.z + r.z * player.lean * 0.4
  );
  camera.rotation.set(
    Math.min(PITCH_MAX, player.pitch + recoilPitch + (player.scopeSwayP || 0)),
    player.yaw + recoilYaw + (player.scopeSwayY || 0),
    -player.lean * 0.12 + player.wallTilt
  );
}

// The HUD "zone" callout is per-map (room names/thresholds are specific to each layout) —

function zoneName(x, y, z) { return currentMap.zoneName(x, y, z); }

const posEl = document.getElementById('pos'), calloutEl = document.getElementById('callout');

};
const BOT_EYE = 1.55;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = ([a, b]) => Math.floor(rand(a, b + 1));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.max(-2.5, Math.min(2.5, Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v))); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const yawTo = (dx, dz) => Math.atan2(-dx, -dz);       // same convention as the camera: forward = (-sin yaw, -cos yaw)

// ---------- ray tests (fast slab tests, no three.js objects) ----------
function rayBox(ox, oy, oz, dx, dy, dz, x0, y0, z0, x1, y1, z1) {
  let tmin = 0, tmax = Infinity;
  for (const [o, d, a, b] of [[ox, dx, x0, x1], [oy, dy, y0, y1], [oz, dz, z0, z1]]) {
    if (Math.abs(d) < 1e-9) { if (o < a || o > b) return Infinity; continue; }
    let t1 = (a - o) / d, t2 = (b - o) / d;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    if (t1 > tmin) tmin = t1;
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
let rayHitC = null;
function rayWorld(o, d, maxT, glassSolid = false) {   // glass is see-through for line-of-sight checks; pass glassSolid for actual bullets
  ensureGrid();
  rayHitC = null;
  let best = maxT;
  if (!grid.nx) return best;
  const stamp = ++queryStamp, CELL = GRID_CELL;
  // Walk the ray's XZ footprint cell by cell (Amanatides-Woo DDA), clipped to the grid's bounds.
  const sx = d.x * maxT, sz = d.z * maxT;
  const gx0 = grid.x0, gz0 = grid.z0, gx1 = gx0 + grid.nx * CELL, gz1 = gz0 + grid.nz * CELL;
  let f0 = 0, f1 = 1;
  for (const [s, o0, lo, hi] of [[sx, o.x, gx0, gx1], [sz, o.z, gz0, gz1]]) {
    if (Math.abs(s) < 1e-9) { if (o0 < lo || o0 >= hi) return best; continue; }
    let a = (lo - o0) / s, b = (hi - o0) / s;
    if (a > b) { const t = a; a = b; b = t; }
    if (a > f0) f0 = a;
    if (b < f1) f1 = b;
    if (f0 > f1) return best;
  }
  const clampI = (v, n) => Math.max(0, Math.min(n - 1, v));
  let i = clampI(Math.floor((o.x + sx * f0 - gx0) / CELL), grid.nx), j = clampI(Math.floor((o.z + sz * f0 - gz0) / CELL), grid.nz);
  const ie = clampI(Math.floor((o.x + sx * f1 - gx0) / CELL), grid.nx), je = clampI(Math.floor((o.z + sz * f1 - gz0) / CELL), grid.nz);
  const stepI = sx > 0 ? 1 : -1, stepJ = sz > 0 ? 1 : -1;
  let tMaxX = Math.abs(sx) < 1e-9 ? Infinity : (gx0 + (sx > 0 ? i + 1 : i) * CELL - o.x) / sx;
  let tMaxZ = Math.abs(sz) < 1e-9 ? Infinity : (gz0 + (sz > 0 ? j + 1 : j) * CELL - o.z) / sz;
  const tDx = Math.abs(sx) < 1e-9 ? Infinity : CELL / Math.abs(sx), tDz = Math.abs(sz) < 1e-9 ? Infinity : CELL / Math.abs(sz);
  if (!(i >= 0 && j >= 0 && i < grid.nx && j < grid.nz)) return best;     // NaN-safe
  for (let guard = grid.nx + grid.nz + 4; guard > 0; guard--) {
    for (const c of grid.cells[j * grid.nx + i]) {
      if (c._q === stamp) continue;
      c._q = stamp;
      if (c.glass && !glassSolid) continue;
      const t = rayBox(o.x, o.y, o.z, d.x, d.y, d.z, c.x0, c.y0, c.z0, c.x1, c.y1, c.z1);
      if (t < best) { best = t; rayHitC = c; }
    }
    if (i === ie && j === je) break;
    const tNext = Math.min(tMaxX, tMaxZ) * maxT;
    if (best <= tNext) break;                       // anything in later cells is farther than the hit we already have
    if (tMaxX < tMaxZ) { i += stepI; tMaxX += tDx; } else { j += stepJ; tMaxZ += tDz; }
    if (i < 0 || j < 0 || i >= grid.nx || j >= grid.nz) break;
  }
  return best;
}
// Hit boxes: head / body / legs (lower while sliding)
function hitboxes(a) {
  const x = a.pos.x, y = a.pos.y, z = a.pos.z, k = a.isSliding ? 0.58 : 1;
  return [
    ['head', x - 0.16, y + 1.47 * k, z - 0.16, x + 0.16, y + 1.79 * k, z + 0.16],
    ['body', x - 0.3, y + 0.78 * k, z - 0.3, x + 0.3, y + 1.47 * k, z + 0.3],
    ['leg', x - 0.24, y, z - 0.24, x + 0.24, y + 0.78 * k, z + 0.24],
  ];
}
function actorHit(shooter, o, d, maxT) {
  let best = null;
  for (const a of activeActors()) {
    // Spawn-protected actors can't take damage (see applyDamage), so they must not block the ray either —
    // otherwise a protected teammate standing in front acts as a free bullet shield for whoever's behind them.
    if (a === shooter || a.dead || a.ghost || a.team === shooter.team || a.spawnProt > 0) continue;
    for (const [part, ...b] of hitboxes(a)) {
      const t = rayBox(o.x, o.y, o.z, d.x, d.y, d.z, ...b);
      if (t < maxT && (!best || t < best.t)) best = { actor: a, part, t };
    }
  }
  return best;
}
const eyeOf = (a) => new THREE.Vector3(a.pos.x, a.pos.y + (a.isPlayer ? (a.isSliding ? 0.95 : EYE) : BOT_EYE), a.pos.z);
function canSee(from, a) {
  const o = eyeOf(from);
  for (const h of [a.isSliding ? 0.85 : 1.6, a.isSliding ? 0.5 : 1.1]) {
    const d = new THREE.Vector3(a.pos.x - o.x, a.pos.y + h - o.y, a.pos.z - o.z), len = d.length();
    d.divideScalar(len);
    if (rayWorld(o, d, len) >= len - 0.05) return true;
  }
  return false;
}

// ---------- waypoint graph ----------
// NAV/NAVI/N()/L() are the generic graph engine, shared by every map. The actual node/edge layout
// is per-map (buildAtriumNav() below, called from loadMap()) since it describes one map's geometry.
const NAV = [], NAVI = {};
function N(id, x, y, z, o = {}) { NAVI[id] = NAV.length; NAV.push({ id, x, y, z, links: [], req: o.req || null, w: o.w || 0, hold: !!o.hold }); }
function L(a, b, o = {}) {
  NAV[NAVI[a]].links.push({ to: NAVI[b], cond: o.cond, climb: o.climb });
  if (!o.oneWay) NAV[NAVI[b]].links.push({ to: NAVI[a], cond: o.cond, climb: o.climb });
}

// "The Cistern": a cross-shaped tower, deliberately NOT a mirror of Atrium's square-ring topology.
// The south and north halves of the vertical arm have no ground-level link between them at all —
// the flood pit sits in the way — so the only path across is up onto the roof deck and back down,
// via two offset ladders rather than one shared stair. Mostly a path, not a loop: that's the point.
// Twin Spires topology: each tower is a spawn lobby with a serpentine stair (lobby -> deck 1 -> deck 2 -> roof);
// at y 6 / 12 / 18 a bridge runs from each tower to the central Mast, so the middle is three stacked crossings.
// The Drain (y -3) runs between the lobbies under the Mast; streets north (Bazaar, walkable roof) and south

  LL('nlW*', 'nw26*'); LL('nw26*', 'bsB*'); LL('bsB*', 'bsT*', { climb: true });

  const f = forwardVec();
  const tpos = new THREE.Vector3(player.pos.x + f.x * 1.2, player.pos.y + 0.9, player.pos.z + f.z * 1.2);
  const teamColor = player.team === 'A' ? 0x5b8cff : 0xff4545;
  const mesh = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.16, 10), new THREE.MeshStandardMaterial({ color: 0x2a2d35, metalness: 0.6, roughness: 0.4 }));
  const body = new THREE.Mesh(boxGeo(0.22, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: teamColor, emissive: teamColor, emissiveIntensity: 0.35, metalness: 0.5, roughness: 0.4 }));
  body.position.y = 0.2;
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0x15161b, metalness: 0.7, roughness: 0.3 }));
  barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.2, -0.35);
  mesh.add(base, body, barrel);
  mesh.position.copy(tpos); mesh.rotation.y = player.yaw;
  scene.add(mesh);
  turret = { pos: tpos, team: player.team, name: 'SENTRY', kills: 0, deaths: 0, mesh, barrel, fireCd: 0, until: gameTime + 20 };
}
function removeTurret() {
  if (turret) { scene.remove(turret.mesh); turret = null; }
}
const TURRET_RANGE = 16, TURRET_DMG = 14, TURRET_INTERVAL = 0.45;
function updateTurret(dt) {
  if (!turret) return;
  if (gameTime >= turret.until) { removeTurret(); return; }
  turret.fireCd -= dt;
  let best = null, bestD = TURRET_RANGE;
  for (const e of activeActors()) {
    if (e.team === turret.team || e.dead) continue;
    const d = Math.hypot(e.pos.x - turret.pos.x, e.pos.z - turret.pos.z, e.pos.y - turret.pos.y);
    if (d > bestD) continue;
    const o = turret.pos, dir = new THREE.Vector3(e.pos.x - o.x, e.pos.y + 1 - o.y, e.pos.z - o.z).normalize();
    if (rayWorld(o, dir, d) < d - 0.05) continue;    // wall in the way
    best = e; bestD = d;
  }
  if (best) {
    turret.mesh.lookAt(best.pos.x, turret.pos.y, best.pos.z);
    if (turret.fireCd <= 0) {
      turret.fireCd = TURRET_INTERVAL;
      const from = turret.pos.clone(), to = new THREE.Vector3(best.pos.x, best.pos.y + 1, best.pos.z);
      addTracer(from, to); addSpark(to, 0xff3b3b);
      applyDamage(best, TURRET_DMG, turret, 'body');
    }
  }
}

// ---- Attack Dogs (18 kills): 2 weak, fast mobile units. They just pick the nearest visible enemy and
// nip at it — low damage, short bite range, no pathfinding (deliberately a minor, easy-to-dodge nuisance,
// not a real threat) — and expire on their own timer. ----
let dogs = [];
const DOG_SPEED = SPEED * 1.3, DOG_DMG = 5, DOG_BITE_RANGE = 1.6, DOG_BITE_INTERVAL = 0.8, DOG_LIFE = 15;
function spawnDogs() {
  removeDogs();
  const f = forwardVec(), r = rightVec();
  for (const side of [-1, 1]) {
    const pos = new THREE.Vector3(player.pos.x + f.x * 1.5 + r.x * side * 0.8, 0.3, player.pos.z + f.z * 1.5 + r.z * side * 0.8);
    const mesh = new THREE.Group();
    const body = new THREE.Mesh(boxGeo(0.5, 0.28, 0.22), new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.8 }));
    const head = new THREE.Mesh(boxGeo(0.18, 0.16, 0.16), new THREE.MeshStandardMaterial({ color: 0x3a2d20, roughness: 0.8 }));
    head.position.set(0, 0.04, -0.3);
    const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 5), new THREE.MeshBasicMaterial({ color: 0xff3b3b }));
    eye1.position.set(0.06, 0.05, -0.37);
    const eye2 = eye1.clone(); eye2.position.x = -0.06;
    mesh.add(body, head, eye1, eye2);
    mesh.position.copy(pos);
    scene.add(mesh);
    dogs.push({ team: player.team, name: 'ATTACK DOG', kills: 0, deaths: 0, pos, mesh, biteCd: 0, until: gameTime + DOG_LIFE });
  }
}
function removeDogs() { for (const d of dogs) scene.remove(d.mesh); dogs = []; }
function updateDogs(dt) {
  if (!dogs.length) return;
  dogs = dogs.filter(d => gameTime < d.until);
  for (const d of dogs) {
    d.biteCd -= dt;
    let best = null, bestD = 22;
    for (const e of activeActors()) {
      if (e.team === d.team || e.dead) continue;
      const dist = Math.hypot(e.pos.x - d.pos.x, e.pos.z - d.pos.z);
      if (dist < bestD) { best = e; bestD = dist; }
    }
    if (best) {
      const dx = best.pos.x - d.pos.x, dz = best.pos.z - d.pos.z, len = Math.hypot(dx, dz) || 1;
      if (bestD > DOG_BITE_RANGE) {
        d.pos.x += dx / len * DOG_SPEED * dt; d.pos.z += dz / len * DOG_SPEED * dt;
      } else if (d.biteCd <= 0) {
        d.biteCd = DOG_BITE_INTERVAL;
        applyDamage(best, DOG_DMG, d, 'body');
        playTone(220, 0.06, 0.08, 'square', 140);
      }
      d.mesh.rotation.y = Math.atan2(dx, dz);
    }
    d.mesh.position.copy(d.pos);
  }
  if (!dogs.length) removeDogs();
}

// ---- Gunship (22 kills): circles above Mid, occasionally strafes an exposed enemy for modest damage.
// Can only see actors above the Lower Hall (y > -2) — it's in the sky, not underground. Weak, infrequent. ----
let heli = null;
const HELI_SPEED = 0.6, HELI_DMG = 10, HELI_INTERVAL = 3;   // radius/height are per-map (currentMap.heli)
function spawnHeli() {
  removeHeli();
  const mesh = new THREE.Group();
  const body = new THREE.Mesh(boxGeo(1.1, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x2a2d35, metalness: 0.5, roughness: 0.4 }));
  const tail = new THREE.Mesh(boxGeo(0.9, 0.15, 0.15), new THREE.MeshStandardMaterial({ color: 0x2a2d35, metalness: 0.5, roughness: 0.4 }));
  tail.position.set(-0.95, 0.1, 0);
  const rotor = new THREE.Mesh(boxGeo(2.6, 0.03, 0.12), new THREE.MeshStandardMaterial({ color: 0x15161b }));
  rotor.position.y = 0.25;
  mesh.add(body, tail, rotor);
  scene.add(mesh);
  heli = {
    team: player.team, name: 'GUNSHIP', kills: 0, deaths: 0, mesh, rotor, ang: Math.random() * Math.PI * 2, fireCd: 1.5, until: gameTime + 20,
    get pos() { return this.mesh.position; },   // so applyDamage's att.pos.clone() (used when the victim can't see its attacker) works
  };
}
function removeHeli() { if (heli) { scene.remove(heli.mesh); heli = null; } }
function updateHeli(dt) {
  if (!heli) return;
  if (gameTime >= heli.until) { removeHeli(); return; }
  heli.ang += HELI_SPEED * dt;
  const { radius: heliR, height: heliH } = currentMap.heli;
  heli.mesh.position.set(Math.cos(heli.ang) * heliR, heliH, Math.sin(heli.ang) * heliR);
  heli.mesh.rotation.y = heli.ang + Math.PI / 2;
  heli.rotor.rotation.y += dt * 40;
  heli.fireCd -= dt;
  if (heli.fireCd <= 0) {
    heli.fireCd = HELI_INTERVAL;
    // "Exposed" per its own description means actually visible from the sky, not just above the Lower
    // Hall cutoff — without a real line-of-sight check (same as the Sentry Turret below) it could strafe
    // someone standing fully indoors under a roof.
    const o = heli.mesh.position;
    const targets = activeActors().filter(e => {
      if (e.team === player.team || e.dead || e.pos.y <= -2) return false;
      const dir = new THREE.Vector3(e.pos.x - o.x, e.pos.y + 1 - o.y, e.pos.z - o.z), d = dir.length();
      dir.divideScalar(d);
      return rayWorld(o, dir, d) >= d - 0.05;
    });
    if (targets.length) {
      const t = targets[Math.floor(Math.random() * targets.length)];
      const from = heli.mesh.position.clone(), to = new THREE.Vector3(t.pos.x, t.pos.y + 1, t.pos.z);
      addTracer(from, to); addSpark(to, 0xff9a5a);
      applyDamage(t, HELI_DMG, heli, 'body');
      playTone(140, 0.2, 0.1, 'sawtooth', 90);
    }
  }
}
function showXpPop(text, gold) {
  const d = document.createElement('div'); d.textContent = text; if (gold) d.className = 'gold';
  xppopsEl.appendChild(d); setTimeout(() => d.remove(), 1400);
}
function grantXP(n, label, pop = true) {
  if (match.mode !== 'tdm' || !n) return;
  matchXP += n; matchLog[label] = (matchLog[label] || 0) + n;
  if (pop) showXpPop(`+${n} ${label}`, label !== 'KILL');
  if (profile.level >= MAX_LEVEL && !zeroMaster()) { saveProfile(); return; }      // maxed: time to enter a Phase
  profile.xp += n;
  while (profile.xp >= xpToNext(profile.level) && (profile.level < MAX_LEVEL || zeroMaster())) {
    profile.xp -= xpToNext(profile.level); profile.level++; levelsGained++;
    onLevelUp();
  }
  if (profile.level >= MAX_LEVEL && !zeroMaster()) profile.xp = 0;
  saveProfile();
}
function onLevelUp() {
  const L = profile.level, news = [];
  for (const k of [...PRIMARIES, 'pistol']) if (WEAPONS[k].unlock === L && !profile.perm.includes(k) && !zeroMaster()) news.push('NEW WEAPON: ' + WEAPONS[k].name);
  const c = LEVEL_CAMOS[L];
  if (c && !profile.camos.includes(c)) { profile.camos.push(c); news.push('NEW CAMO: ' + CAMOS[c].name); }
  if (L === MAX_LEVEL && !zeroMaster()) news.push(`MAX LEVEL — enter PHASE ${ROMAN[profile.phase + 1]} from the menu`);
  showBanner(`<b>LEVEL ${L}</b><span>${rankOf(Math.min(L, 50))}</span>${news.map(n => `<i>${n}</i>`).join('')}`, news.length ? 3.5 : 2.4);
  playTone(660, 0.12, 0.12, 'triangle', 990); setTimeout(() => playTone(990, 0.2, 0.12, 'triangle', 1320), 120);
}
function enterPhase() {
  if (profile.level < MAX_LEVEL || profile.phase >= MAX_PHASE) return false;
  profile.phase++; profile.level = 1; profile.xp = 0; profile.tokens++;
  const pc = 'p' + profile.phase;
  if (!profile.camos.includes(pc)) profile.camos.push(pc);
  profile.camo = pc;
  if (!isUnlocked(profile.primary)) profile.primary = 'ar';
  saveProfile(); applyProfileLoadout();
  return true;
}
function applyProfileLoadout() {
  loadout.primary = isUnlocked(profile.primary) ? profile.primary : 'ar';
  camo = profile.camos.includes(profile.camo) ? profile.camo : 'none';
  resetWeapons();
}
// kill / assist / streak XP (called from killActor)
function awardKillXP(v, att, head) {
  if (att === player) {
    streak++;
    grantXP(XP.kill + (head ? XP.headshot : 0), head ? 'HEADSHOT KILL' : 'KILL');
    if (streak === 3) grantXP(XP.streak3, '3 STREAK'); else if (streak === 5) grantXP(XP.streak5, '5 STREAK'); else if (streak >= 7) grantXP(XP.streak7, streak + ' STREAK');
    profile.kills++;
    awardKillstreakTier();
  } else if (v.dmgBy && v.dmgBy.has(player) && gameTime - v.dmgBy.get(player) < 6) grantXP(XP.assist, 'ASSIST');
  if (v === player) { streak = 0; resetKillstreaks(); }
}
function finishMatchXP() {
  if (match.mode !== 'tdm') return;
  profile.matches++;
  grantXP(XP.complete, 'MATCH COMPLETE', false);
  if (match.score.A > match.score.B) { profile.wins++; grantXP(XP.win, 'VICTORY', false); }
  saveProfile();
}
// NOTE: the initial applyProfileLoadout() / menuReady+renderMenu() calls used to be right here —
// moved into the consolidated boot sequence near the end of the file, same reason as above.
function xpSummaryHTML() {
  const rows = Object.entries(matchLog).map(([k, v]) => `<tr><td>${k}</td><td>+${v}</td></tr>`).join('');
  const need = xpToNext(profile.level), maxed = profile.level >= MAX_LEVEL && !zeroMaster();
  return `<div class="xpsum"><div class="xptot">+${matchXP} XP${levelsGained ? ` · ${levelsGained} LEVEL${levelsGained > 1 ? 'S' : ''} UP` : ''}</div>
    <table>${rows}</table>${profileCardHTML()}</div>`;
}
function profileCardHTML() {
  const need = xpToNext(profile.level), maxed = profile.level >= MAX_LEVEL && !zeroMaster();
  const pct = maxed ? 100 : Math.round(100 * profile.xp / need);
  return `<div class="pcard">${phaseTag()}<b>LEVEL ${profile.level}</b> <span class="rank">${rankOf(Math.min(profile.level, 50))}</span>
    <div class="xpbar"><i style="width:${pct}%"></i></div>
    <small>${maxed ? 'MAX LEVEL — enter the next Phase' : `${profile.xp.toLocaleString()} / ${need.toLocaleString()} XP`}${profile.tokens ? ` · ◆ ${profile.tokens} unlock token${profile.tokens > 1 ? 's' : ''}` : ''}</small></div>`;
}

// ---------- damage / kills / match ----------
const killfeedEl = document.getElementById('killfeed');
function addKillfeed(killer, victim, head) {
  const div = document.createElement('div');
  const nm = (a) => `<span class="${a.team === 'A' ? 'ka' : 'kb'}">${a.name}</span>`;
  div.innerHTML = `${nm(killer)} ${head ? '⌖ HEADSHOT' : '▸'} ${nm(victim)}`;
  if (killer === player || victim === player) div.classList.add('me');
  div.dataset.t = gameTime;
  killfeedEl.prepend(div);
  while (killfeedEl.children.length > 5) killfeedEl.lastChild.remove();
}
function applyDamage(v, amount, att, part) {
  if (v.dead || v.spawnProt > 0 || match.over || v.team === att.team) return null;
  if (v === player && gameTime < resistUntil) amount *= (1 - resistAmt);   // Flak Vest / Juggernaut / Blackout
  v.hp -= amount; v.lastHurt = gameTime; v.lastAttacker = att;
  if (v.dmgBy) v.dmgBy.set(att, gameTime);
  if (v === player) hurtFeedback(att);
  else if (!v.targetVisible) { v.huntPos = att.pos.clone(); v.huntT = gameTime; v.huntGoal = false; }
  if (v.hp <= 0) { killActor(v, att, part === 'head'); return 'kill'; }
  return 'hit';
}
function killActor(v, att, head) {
  v.dead = true; v.hp = 0; v.deaths++; v.respawnT = RESPAWN_TIME; v.isSliding = false; v.fall = 0;
  att.kills++; match.score[att.team]++;
  addKillfeed(att, v, head);
  awardKillXP(v, att, head);
  if (v === player) {
    deathYaw = yawTo(att.pos.x - player.pos.x, att.pos.z - player.pos.z);
    mouseHeld = false; reloadT = 0;
    deathEl.innerHTML = `<b>KILLED BY ${att.name.toUpperCase()}</b>${head ? ' · headshot' : ''}<div id="death-t"></div>`;
    playTone(160, 0.5, 0.25, 'sawtooth', 60);
  }
  if (att === player) playTone(880, 0.18, 0.12, 'sine', 1320);
  if (match.score[att.team] >= SCORE_LIMIT) endMatch();
}
function endMatch() {
  if (match.over) return;
  match.over = true; mouseHeld = false; adsHeld = false; removeTurret(); removeDogs(); removeHeli();
  showTab(false);
  finishMatchXP();
  lockWasHeld = false;
  if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
  showPaused();                                         // results screen
}
// Per-map team size (default 4v4): bots past the limit are benched — permanently dead and hidden.
// The player fills one slot on team A, so A fields one fewer bot than B.
function applyTeamSize() {
  const size = currentMap.teamSize || 4, seen = { A: 0, B: 0 };
  for (const b of bots) {
    const limit = b.team === 'A' ? size - 1 : size;
    b.benched = seen[b.team]++ >= limit;
  }
}
function startMatch(mode) {
  if (mapKey !== currentMapKey) loadMap(mapKey);     // only rebuild the world when the player actually picked a different map
  match.mode = mode; match.started = true; match.over = false;
  match.score.A = match.score.B = 0; match.timeLeft = MATCH_TIME;
  restoreMezz(); restoreGlass(true);
  killfeedEl.innerHTML = '';
  for (const a of allActors) { a.kills = 0; a.deaths = 0; }
  applyTeamSize();
  streak = 0; matchXP = 0; matchLog = {}; levelsGained = 0; resetKillstreaks();
  applyProfileLoadout();
  for (const b of bots) {
    if (mode === 'tdm' && !b.benched) spawnActor(b);
    else { b.dead = true; b.respawnT = 1e9; b.mesh.visible = false; }
  }
  if (mode === 'tdm') spawnActor(player); else { respawn('A'); player.spawnProt = 0; resetWeapons(); }
  teamIntel.A.t = teamIntel.B.t = -1e9;
  const tdm = mode === 'tdm';
  document.getElementById('pos').style.display = tdm ? 'none' : '';
  document.getElementById('scorebar').style.display = tdm ? 'flex' : 'none';
  document.getElementById('vitals').style.display = tdm ? 'block' : 'none';
  document.getElementById('streakbar').style.display = tdm ? 'block' : 'none';
  if (tdm && mapMode === 1) cycleMap();                // fighting: start with the compact map
  if (!tdm && mapMode !== 1) { while (mapMode !== 1) cycleMap(); }
}
// Someone fired: nearby enemies who aren't already fighting hear it and come looking
function heardShot(shooter) {
  for (const b of bots) {
    if (b.dead || b.team === shooter.team || b.targetVisible) continue;
    const d = b.pos.distanceTo(shooter.pos);
    if (d < 32 && gameTime - b.huntT > 1) { b.huntPos = shooter.pos.clone(); b.huntT = gameTime; b.huntGoal = false; }
  }
}

      _w.set(rx * b.strafeDir, 0, rz * b.strafeDir);
      const close = b.wk === 'shotgun' || b.wk === 'smg', push = ROLE_PUSH[b.role] ?? 1;
      if (hd > w.range * 1.3) { _w.x += dx / hd * (close ? 1 : 0.8) * push; _w.z += dz / hd * (close ? 1 : 0.8) * push; }   // push in
      else if (hd < w.range * 0.45 && (b.wk === 'sniper' || b.wk === 'dmr' || b.role === 'defensive')) { _w.x -= dx / hd * 0.6; _w.z -= dz / hd * 0.6; }   // back off
      if (_w.lengthSq() > 1) _w.normalize();
      // slide into a fresh fight (sideways, or straight at them with a shotgun / SMG)
      if (b.freshFight) {
        b.freshFight = false;
        if (b.onGround && hd < 16 && b.slideCooldown <= 0 && Math.random() < D.slide * (ROLE_SLIDE[b.role] ?? 1)) {
          const sd = close && hd > 4 ? _d.set(dx / hd, 0, dz / hd) : _d.set(rx * (b.strafeDir || 1), 0, rz * (b.strafeDir || 1));
          if (!blockedAt(b.pos.x + sd.x, b.pos.z + sd.z, b.pos.y)) { b.isSliding = true; b.slideTimer = SLIDE_TIME; b.slideDir.copy(sd); }
        }
      }
      // don't strafe into walls or off ledges (no falling off the Mezzanine mid-fight)
      if (_w.lengthSq() > 0) {
        const px = b.pos.x + _w.x * 0.9, pz = b.pos.z + _w.z * 0.9;
        if (blockedAt(px, pz, b.pos.y) || groundAt(px, pz, b.pos.y + STEP) < b.pos.y - 1) { b.strafeDir = -b.strafeDir; _w.set(0, 0, 0); }
      }
      speed *= 0.7;
      if (diffKey === 'hard' && b.burstLeft > 0 && !close) _w.set(0, 0, 0);    // hard bots stop to shoot (no moving inaccuracy)
      // hurt and losing the duel: break line of sight, reload, heal — defensive bots bail earlier,
      // aggressive bots push through longer
      if (b.hp < (ROLE_RETREAT_HP[b.role] ?? 40) && tgt.hp >= b.hp && Math.random() < dt * 2) {
        const c = coverNode(b, tgt);
        if (c >= 0) {
          const path = findPath(nearestNode(b.pos), c);
          if (path) { b.path = path; b.pi = 0; b.goal = c; b.retreatUntil = gameTime + 3.5; b.huntPos = null; }
        }
      }
      // a long-range standoff going nowhere: break it off and rotate through a flank
      if (b.engageT > 6 && hd > 22 && b.wk !== 'sniper' && Math.random() < dt * 0.5) {
        b.ignoreUntil = gameTime + 5; b.targetVisible = false; b.huntPos = null; b.burstLeft = 0;
        planTo(b, pickGoal(b, true));
      }
    }
    // ---- trigger ----
    const yawErr = Math.abs(angDiff(b.yaw, lookYaw));
    const ready = b.engageT > b.react && yawErr < (b.wk === 'sniper' ? 0.06 : 0.14) && b.fireCd <= 0 && b.reloadT <= 0;
    if (ready) {
      if (w.auto) {
        if (b.burstLeft <= 0) { b.burstLeft = randi(D.burst); b.fireCd = b.sprayN ? rand(...D.pause) : 0; b.sprayN = 0; b.aimHead = Math.random() < D.head; }
        else { botShoot(b, tgt, D, Math.hypot(hd, dy), pitch); b.burstLeft--; b.fireCd = w.interval; b.sprayN++; }
      } else if (b.wk !== 'sniper' || b.aimMul < 1.15) {                     // snipers wait for the crosshair to settle
        botShoot(b, tgt, D, Math.hypot(hd, dy), pitch);
        b.fireCd = w.interval * rand(1.1, 1.7); b.sprayN++; b.aimHead = Math.random() < D.head;
      }
    }
  } else {
    // ---- moving around the map ----
    b.sprayN = 0; b.burstLeft = 0; b.aimMul = 2.2;
    if (b.ammo < w.mag * 0.5 && b.reloadT <= 0) b.reloadT = w.reload;
    const hunting = b.huntPos && gameTime - b.huntT < 6;
    if (hunting && !b.huntGoal) { planTo(b, nearestNode(b.huntPos, false)); b.huntGoal = true; b.holdT = 0; }
    if (!b.path) planTo(b, b.goal >= 0 && navValid(b.goal) && Math.random() < 0.5 ? b.goal : pickGoal(b));
    if (b.pi >= b.path.length) {
      if (b.holdT > 0) { b.holdT -= dt; lookYaw = b.holdYaw + Math.sin(gameTime * 1.3 + b.walk) * 0.25; }   // checking the angle
      else {
        if (hunting) { b.huntPos = null; }
        planTo(b, pickGoal(b));
      }
    }
    const ly = followPath(b, dt, hunting);
    if (ly !== null) {
      pathing = true; lookYaw = ly;
      if (hunting && b.huntPos) {                         // pre-aim where the enemy was last heard / seen
        const hx = b.huntPos.x - b.pos.x, hz = b.huntPos.z - b.pos.z;
        if (Math.hypot(hx, hz) < 25) lookYaw = yawTo(hx, hz);
      }
    }
  }
  // turn toward where we want to look (bots can't snap instantly)
  const dYaw = angDiff(b.yaw, lookYaw), maxTurn = D.turn * dt * (tgt ? 1 : 1.6);
  b.yaw += Math.max(-maxTurn, Math.min(maxTurn, dYaw));
  b.pitch += (pitch - b.pitch) * Math.min(1, dt * 10);

  // accelerate instead of snapping to full speed (reads as a person, not a robot)
  if (b.isSliding) applyHorizontal(b, _w, speed, dt);
  else {
    b.slideCooldown = Math.max(0, b.slideCooldown - dt);
    const a = Math.min(1, dt * (b.onGround ? 12 : 3));
    if (!(b.launched && !b.onGround)) { b.vel.x += (_w.x * speed - b.vel.x) * a; b.vel.z += (_w.z * speed - b.vel.z) * a; }
  }
  let jump = false;
  if (_w.lengthSq() > 0.01) {                                // hop up anything too tall to step onto (scaffold treads)
    const ax = b.pos.x + _w.x * 0.45, az = b.pos.z + _w.z * 0.45;
    const tooTall = blockedAt(ax, az, b.pos.y) && !blockedAt(ax, az, b.pos.y + 1.0);
    if (b.onGround && tooTall) { jump = true; b.climbJump = true; }
    else if (!b.onGround && b.climbJump && b.vel.y < 1 && b.airBoosts > 0 && blockedAt(ax, az, b.pos.y)) { b.airBoosts--; b.vel.y = BOOST; }   // air-boost to finish the climb
  }
  if (b.onGround && !jump) b.climbJump = false;
  integrate(b, dt, jump);

  // stuck detection: hop, then re-plan, then pick somewhere else
  if (pathing) {
    b.stuckClock += dt;
    if (b.stuckClock > 0.8) {
      if (b.pos.distanceTo(b.stuckPos) < 0.5) {
        b.stuckN++;
        if (b.onGround) { b.vel.y = JUMP; b.onGround = false; }
        if (b.stuckN === 3) b.path = null;
        if (b.stuckN >= 6) { b.path = null; b.goal = pickGoal(b); b.stuckN = 0; }
      } else b.stuckN = 0;
      b.stuckPos.copy(b.pos); b.stuckClock = 0;
    }
  } else { b.stuckClock = 0; b.stuckPos.copy(b.pos); }
  if (b.pos.y < -9) spawnActor(b);
}

// body animation: walk cycle, aim pitch, slide pose
function syncBotMesh(b, dt) {
  if (b.dead && !b.mesh.visible) return;
  b.mesh.position.copy(b.pos);
  b.mesh.rotation.y = b.yaw;
  if (b.dead) return;
  const P = b.parts, sp = Math.hypot(b.vel.x, b.vel.z), k = Math.min(1, sp / 6);
  b.walk += sp * dt * 1.9;
  // which way are the legs actually moving relative to the body (forward / backward / sideways)
  const fwd = -(b.vel.x * Math.sin(b.yaw) + b.vel.z * Math.cos(b.yaw)) / (sp || 1);
  const swing = Math.sin(b.walk) * 0.75 * k * (fwd < -0.3 ? -1 : 1);
  if (b.isSliding) {
    P.legs[0].rotation.x = 1.25; P.legs[1].rotation.x = 1.0;
    b.inner.rotation.x = 0.45; b.inner.position.y = -0.38;
    P.torso.rotation.x = -0.25;
  } else {
    b.inner.rotation.x = 0; b.inner.position.y = 0;
    if (!b.onGround) { P.legs[0].rotation.x = 0.5; P.legs[1].rotation.x = -0.2; }
    else { P.legs[0].rotation.x = swing; P.legs[1].rotation.x = -swing; }
    P.legs[0].rotation.z = P.legs[1].rotation.z = 0;
    P.torso.position.y = 0.8 + Math.abs(Math.cos(b.walk)) * 0.035 * k;
    P.torso.rotation.x = -0.1 * k * Math.max(0, fwd);
  }
  P.aim.rotation.x = b.pitch;
  P.head.rotation.x = b.pitch * 0.6;
  if (b.rig && b.gunInfo && b.reloadT > 0) {                      // real reload: tip the gun, swap the mag by hand, rack it
    const o = reloadPose(b.gunInfo, _c01(1 - b.reloadT / b.w.reload));
    applyReloadPose(b.gunInfo, b.rig, o, 0.8);
    P.aim.rotation.z = o.roll * 0.8; P.aim.rotation.x = b.pitch + o.pitch * 0.6; P.aim.position.y = 0.56 + o.dy;
    P.head.rotation.x = b.pitch * 0.6 + 0.35 * o.tilt; P.torso.rotation.x += 0.1 * o.tilt;
    b.rlActive = true;
  } else {
    P.aim.rotation.z = 0; P.aim.position.y = 0.56;
    if (b.rlActive && b.rig) { applyReloadPose(b.gunInfo, b.rig, reloadPose(b.gunInfo, 0), 0.8); b.rlActive = false; }
  }
}

let spotClock = 0;
function updateMatch(dt) {
  gameTime += dt;
  match.timeLeft = Math.max(0, match.timeLeft - dt);
  if (match.timeLeft <= 0) { endMatch(); return; }
  // player: respawn, spawn protection, health regen after 5s without damage
  if (player.dead) {
    player.respawnT -= dt;
    const el = document.getElementById('death-t');
    if (el) el.textContent = `respawning in ${Math.max(0, player.respawnT).toFixed(1)}`;
    if (player.respawnT <= 0) spawnActor(player);
  } else {
    player.spawnProt = Math.max(0, player.spawnProt - dt);
    if (player.hp > MAX_HP) {
      // Juggernaut's 200hp overheal is meant to be temporary (tied to its 12s resist window), not
      // permanent for the rest of the life — it used to just sit there forever once the buff ended
      // since the old regen branch below only fired while hp was BELOW MAX_HP.
      if (gameTime >= resistUntil) player.hp = Math.max(MAX_HP, player.hp - 40 * dt);
    } else if (player.hp < MAX_HP && gameTime - player.lastHurt > 5) player.hp = Math.min(MAX_HP, player.hp + 20 * dt);
    player.ghost = gameTime < ghostUntil;
  }
  for (const b of bots) {
    updateBot(b, dt);
    if (!b.dead && gameTime - b.lastHurt > 5) b.hp = Math.min(MAX_HP, b.hp + 20 * dt);
  }
  updateTurret(dt); updateDogs(dt); updateHeli(dt);
  if (fmArmed && gameTime >= fmAt) {
    fmArmed = false;
    const R = 6.5;
    for (const e of activeActors()) {
      if (e.team === player.team || e.dead) continue;
      const d = Math.hypot(e.pos.x - fmX, e.pos.y - fmY, e.pos.z - fmZ);
      if (d > R) continue;
      applyDamage(e, Math.round(130 * (1 - d / R)), player, 'body');
    }
    addSpark(new THREE.Vector3(fmX, fmY, fmZ), 0xff7a2f);
  }
  // soft push-apart so nobody stands inside anybody else
  const live = allActors.filter(a => !a.dead);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], c = live[j], dx = c.pos.x - a.pos.x, dz = c.pos.z - a.pos.z, d = Math.hypot(dx, dz);
    if (d > 0.001 && d < 0.7 && Math.abs(c.pos.y - a.pos.y) < 1.5) {
      const p = (0.7 - d) / 2, ux = dx / d * p, uz = dz / d * p;
      if (!blockedAt(a.pos.x - ux, a.pos.z - uz, a.pos.y)) { a.pos.x -= ux; a.pos.z -= uz; }
      if (!blockedAt(c.pos.x + ux, c.pos.z + uz, c.pos.y)) { c.pos.x += ux; c.pos.z += uz; }
    }
  }
  // what the player can see shows up on the radar for the team
  spotClock -= dt;
  if (spotClock <= 0 && !player.dead) {
    spotClock = 0.15;
    const half = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    for (const b of bots) {
      if (b.team === player.team || b.dead) continue;
      if (Math.abs(angDiff(player.yaw, yawTo(b.pos.x - player.pos.x, b.pos.z - player.pos.z))) < half && canSee(player, b)) {
        b.spottedT = gameTime; teamIntel[player.team].pos = b.pos.clone(); teamIntel[player.team].t = gameTime;
      }
    }
  }
  for (const d of killfeedEl.children) d.style.opacity = gameTime - d.dataset.t > 6 ? '0' : '1';
}

const sa = document.getElementById('sa'), sb = document.getElementById('sb'), clockEl = document.getElementById('clock');
const hpnumEl = document.getElementById('hpnum'), hpbarEl = document.querySelector('#hpbar i'), ammoEl = document.getElementById('ammo'), reloadEl = document.getElementById('reload');
const wnameEl = document.getElementById('wname');
const streaknumEl = document.getElementById('streaknum'), streaknextEl = document.getElementById('streaknext'), streakactiveEl = document.getElementById('streakactive');
function updateMatchHud(dt) {
  bannerT -= dt; if (bannerT <= 0) bannerEl.style.opacity = '0';
  ksBannerT -= dt; if (ksBannerT <= 0) ksBannerEl.classList.remove('show');
  wnameEl.textContent = curW.name + (slot ? '' : ` · ${curW.cls}`);
  hitmarkT = Math.max(0, hitmarkT - dt); hitmarkEl.style.opacity = hitmarkT > 0 ? '1' : '0';
  hurtT = Math.max(0, hurtT - dt); dmgDirT = Math.max(0, dmgDirT - dt);
  const tdm = match.started && match.mode === 'tdm';
  document.getElementById('hud').classList.toggle('dim', tdm && match.timeLeft < MATCH_TIME - 10 && !blockerVisible());
  if (!tdm) { vignetteEl.style.opacity = '0'; dmgdirEl.style.opacity = '0'; deathEl.style.display = 'none'; protectEl.style.display = 'none'; return; }
  sa.textContent = match.score.A; sb.textContent = match.score.B;
  const s = Math.ceil(match.timeLeft); clockEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const hp = Math.max(0, Math.ceil(player.hp));
  hpnumEl.innerHTML = `${hp} <small>HP</small>`;
  hpbarEl.style.width = Math.min(100, hp) + '%'; hpbarEl.style.background = hp > 150 ? '#8fe3ff' : hp > 60 ? '#6fe08a' : hp > 30 ? '#ffd24d' : '#ff5a5a';
  ammoEl.innerHTML = `${ammo} <small>/ ∞</small>`;
  reloadEl.textContent = reloadT > 0 ? 'RELOADING…' : ammo <= 5 ? 'R to reload' : '';
  vignetteEl.style.opacity = String(Math.max(hurtT / 0.35 * 0.8, player.dead ? 0.5 : hp < 35 ? 0.35 : 0));
  if (dmgDirT > 0 && dmgFrom && !player.dead) {
    const dx = dmgFrom.x - player.pos.x, dz = dmgFrom.z - player.pos.z;
    const f = forwardVec(), r = rightVec();
    dmgdirEl.style.transform = `rotate(${Math.atan2(dx * r.x + dz * r.z, dx * f.x + dz * f.z)}rad)`;
    dmgdirEl.style.opacity = String(Math.min(1, dmgDirT));
  } else dmgdirEl.style.opacity = '0';
  deathEl.style.display = player.dead ? 'block' : 'none';
  protectEl.style.display = player.spawnProt > 0 && !player.dead ? 'block' : 'none';
  if (tabOpen && Math.floor(gameTime * 4) !== Math.floor((gameTime - dt) * 4)) tabEl.innerHTML = boardHTML();
  updateStreakHud();
}
const streakpipsEl = document.getElementById('streakpips');
for (const t of KILLSTREAKS) {   // build once — one pip per tier, filled in as killTier advances
  const i = document.createElement('i'); i.title = `${t.name} @ ${t.n}`; streakpipsEl.appendChild(i);
}
function updateStreakHud() {
  streaknumEl.textContent = streak;
  for (let i = 0; i < streakpipsEl.children.length; i++) streakpipsEl.children[i].classList.toggle('done', i < killTier);
  const next = KILLSTREAKS[killTier];
  streaknextEl.innerHTML = next ? `next: <b>${next.name}</b> @ ${next.n} kills` : 'all streaks claimed this life';
  const active = [];
  if (gameTime < reconUntil) active.push(['RECON', '#4fc3ff']);
  if (gameTime < adrenUntil) active.push(['ADRENALINE', '#6fe08a']);
  if (gameTime < resistUntil) active.push(['ARMORED', '#ff5a5a']);
  if (player.ghost) active.push(['GHOST', '#b388ff']);
  if (turret) active.push(['SENTRY UP', '#ff9a5a']);
  if (dogs.length) active.push(['DOGS OUT', '#c9a36a']);
  if (heli) active.push(['GUNSHIP UP', '#6fd1ff']);
  if (fmArmed) active.push(['FIRE MISSION INBOUND', '#ff7a2f']);
  streakactiveEl.innerHTML = active.map(([label, c]) => `<span style="--c:${c}">${label}</span>`).join('');
}

// ---------- Boot sequence ----------
// Everything below depended on a map being loaded (SPAWNS, NAV, WB, ...) or on code defined further
// down the file (renderMenu, applyInputMode, layoutMap), so it's grouped here at the very end rather
// than scattered at each system's own definition site — see the NOTE comments left at their old
// call sites above.
loadMap('atrium');
respawn('A');
applyInputMode();
layoutMap();
applyProfileLoadout();
menuReady = true; renderMenu();

// Test/debug hook (lets automated checks drive the real game loop)
window.__fz = {
  player, colliders, keys, step: updatePlayer, camStep: updateCamera, blockedAt, groundAt, respawn, collapse, startGame, applyLook,
  fire: fireShot, stats, effects,
  map: { mode: () => mapMode, cycle: cycleMap, draw: drawMap, layout: () => ML, xy: (x, z) => [mx(x), mz(z)] },
  teleport(x, y, z, yaw = 0) { player.pos.set(x, y, z); player.vel.set(0, 0, 0); player.yaw = yaw; player.pitch = 0; player.isSliding = false; player.onGround = false; },
  // bots / TDM
  match, bots, NAV, NAVI, findPath, nearestNode, startMatch, updateBot, updateMatch, rayWorld, canSee, applyDamage, tagLive, DIFFS,
  // maps
  MAPS, loadMap, get mapKey() { return mapKey; }, set mapKey(k) { mapKey = k; renderMenu(); }, get currentMapKey() { return currentMapKey; }, SPAWNS: () => SPAWNS,
  // weather / atmosphere (debug)
  scene, get rainPoints() { return rainPoints; }, get emberPoints() { return emberPoints; }, get weatherMode() { return weatherMode; }, hemi, sun, updateWeather, applySkyAndWeather,
  fx: updateEffects, setDiff: (k) => { diffKey = k; }, weapon: () => ({ ammo, reloadT, spray, key: curKey, slot, adsT, fov: camera.fov }), restoreMezz,
  WEAPONS, profile, grantXP, enterPhase, equip, isUnlocked, xpToNext, renderMenu, syncBotMesh, coverNode, walkableLine,
  setBotWeapon, vm: gun, HIP, vmCam, vmScene, applyProfileLoadout, finishMatchXP, matchXP: () => ({ matchXP, matchLog, streak }), camoSet: (k) => { camo = k; applyCamo(); },
  setPrimary: (k) => { profile.primary = k; applyProfileLoadout(); }, ads: (v) => { adsHeld = v; }, triggerReset: () => { triggerReady = true; },
  settings, saveSettings, DPR_FIX, isMacChromium,
  get pointerLocked() { return pointerLocked; }, relockPointer, get lockWasHeld() { return lockWasHeld; },
  wallSide, updateWallRun,
  // fast headless simulation (no rendering): runs the match for `sec` seconds of game time
  sim(sec, dt = 1 / 30) { for (let t = 0; t < sec && !match.over; t += dt) { updateMatch(dt); updateEffects(dt); } return { ...match.score }; },
  // killstreaks
  killstreaks: {
    tiers: KILLSTREAKS, award: awardKillstreakTier, reset: resetKillstreaks, hud: updateStreakHud,
    state: () => ({
      streak, killTier, resistUntil, resistAmt, adrenUntil, reconUntil, ghostUntil, fmArmed, fmX, fmY, fmZ, fmAt,
      turret: turret ? { pos: { x: turret.pos.x, y: turret.pos.y, z: turret.pos.z }, team: turret.team, until: turret.until } : null,
      dogs: dogs.map(d => ({ pos: { x: d.pos.x, y: d.pos.y, z: d.pos.z }, until: d.until })),
      heli: heli ? { pos: { x: heli.mesh.position.x, y: heli.mesh.position.y, z: heli.mesh.position.z }, until: heli.until } : null,
    }),
    set: (k, v) => {
      if (k === 'streak') streak = v; else if (k === 'killTier') killTier = v;
      else if (k === 'resistUntil') resistUntil = v; else if (k === 'resistAmt') resistAmt = v;
      else if (k === 'adrenUntil') adrenUntil = v; else if (k === 'reconUntil') reconUntil = v;
      else if (k === 'ghostUntil') ghostUntil = v; else if (k === 'fmArmed') fmArmed = v;
      else if (k === 'fmAt') fmAt = v;
    },
    deployTurret, removeTurret, updateTurret, aimPoint,
    spawnDogs, removeDogs, updateDogs, spawnHeli, removeHeli, updateHeli,
  },
};

const clock = new THREE.Clock();
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const running = !blockerVisible();
  // The pause/menu screen (Escape, lost pointer lock, match-over results) is meant to freeze the game —
  // but only updateMatch was ever gated on `running`. The player's own physics (gravity, slide timer,
  // fall death) and viewmodel (ADS, reload countdown) kept ticking underneath the menu, so you could
  // resume mid-air, mid-slide, or with a reload that silently finished while the menu was up.
  if (running && !window.__fzPause) updatePlayer(dt);
  fireCooldown = Math.max(0, fireCooldown - dt);
  if (running && (mouseHeld || isDown('fire'))) tryFire();           // auto-fire while the button is held
  if (running && !window.__fzPause && match.started && match.mode === 'tdm' && !match.over) updateMatch(dt);
  for (const b of bots) syncBotMesh(b, dt);
  updateCamera();
  if (running) updateEffects(dt);
  updateWeather(dt);
  updateHud(frame++);
  updateMatchHud(dt);
  drawMap();
  renderer.clear();
  renderer.render(scene, camera);
  if (gun.visible) { renderer.clearDepth(); renderer.render(vmScene, vmCam); }   // viewmodel on top, never clipping into walls
}
animate();
</script>
