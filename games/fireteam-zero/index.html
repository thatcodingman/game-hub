<style>

  #crosshair {

  }
  #hud {
    position: fixed; bottom: 16px; left: 16px; color: #eee; font-family: monospace;

    line-height: 1.6; z-index: 10; pointer-events: none; max-width: 90vw;
  }

    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);

  /* ---- Touch controls (shown only for touch devices with no mouse) ---- */

    color: #fff; font-family: monospace; font-size: 11px; font-weight: bold;

  #btn-jump { right: 110px; bottom: 150px; }

</div>

<div id="touch-joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>

<div class="touch-btn" id="btn-shoot">SHOOT</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   FIRETEAM ZERO — ATRIUM (geometry blockout)

   The whole map is solid boxes plus ONE big "ground" block with the
   tunnel / ramps / scaffold bays carved out of it. Everything walkable
   is physically connected and everything else is solid, so there are no
   floating floor islands to fall between and no open edges to walk off.

   Top-down (X = west/east, Z = north/south; team A left, team B right):

     z=+15  spawnA | A-stairs lane > A-STAIRS ^ MEZZANINE (y=5) ^ B-STAIRS < lane | spawnB
                     (solid mass)          MID room, open to the sky
     z=  0  spawnA = A-LONG = A-CHOKE ======== MID ======== B-CHOKE = B-LONG = spawnB
                     (solid mass)     scaffold bays (jump-climb up from the tunnel)
     z=-15  ramp v ======= LOWER HALL tunnel (y=-5, runs under everything) ======= v ramp
   ============================================================ */

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
scene.fog = new THREE.Fog(0x1a1a22, 40, 130);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(20, 60, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 40, bottom: -40, far: 200 });
scene.add(sun);

// ---------- Materials (color-coded by function) ----------
const M = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const matFloor = M(0x6a6a7c), matWall = M(0x54545f, 0.95), matChoke = M(0x6e5a48);
const matCover = M(0x4a5a4a), matMezz = M(0x4a4a6a, 0.85), matScaffold = M(0xaa6633, 0.7);
const matEscalator = M(0x777788, 0.6, 0.3), matBeam = M(0xcc4433, 0.6);
const matSpawnA = M(0x3355aa), matSpawnB = M(0xaa3333);

// ---------- Solid world ----------
const colliders = [];       // { x0,y0,z0,x1,y1,z1, mesh, tag }
const WALL_H = 12;          // tall enough that nobody can jump out of the map

function addSolid(x0, y0, z0, x1, y1, z1, mat, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = opts.shadow !== false;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const c = { x0, y0, z0, x1, y1, z1, mesh, tag: opts.tag || null };
  if (opts.collide !== false) colliders.push(c);
  return c;
}

// Pieces of box `a` left over after cutting box `b` out of it.
function subtract(a, b) {
  if (b.x0 >= a.x1 || b.x1 <= a.x0 || b.y0 >= a.y1 || b.y1 <= a.y0 || b.z0 >= a.z1 || b.z1 <= a.z0) return [a];
  const out = [], r = { ...a };
  if (b.x0 > r.x0) { out.push({ ...r, x1: b.x0 }); r.x0 = b.x0; }
  if (b.x1 < r.x1) { out.push({ ...r, x0: b.x1 }); r.x1 = b.x1; }
  if (b.y0 > r.y0) { out.push({ ...r, y1: b.y0 }); r.y0 = b.y0; }
  if (b.y1 < r.y1) { out.push({ ...r, y0: b.y1 }); r.y1 = b.y1; }
  if (b.z0 > r.z0) { out.push({ ...r, z1: b.z0 }); r.z0 = b.z0; }
  if (b.z1 < r.z1) { out.push({ ...r, z0: b.z1 }); r.z1 = b.z1; }
  return out;
}

// ---------- THE GROUND: one solid block, lower areas carved out ----------
let ground = [{ x0: -54, y0: -6, z0: -15, x1: 54, y1: 0, z1: 15 }];
const cuts = [
  { x0: -42, x1: 42, z0: -15, z1: -9, y0: -5, y1: -1 },   // Lower Hall tunnel (4m headroom; main floor is its ceiling)
  { x0: -52, x1: -42, z0: -15, z1: -9, y0: -5, y1: 0 },   // A connector ramp pit (open to the spawn room above)
  { x0: 42, x1: 52, z0: -15, z1: -9, y0: -5, y1: 0 },     // B connector ramp pit
  { x0: -10, x1: -5, z0: -9, z1: -3, y0: -5, y1: 0 },     // west scaffold bay (tunnel -> Mid)
  { x0: 5, x1: 10, z0: -9, z1: -3, y0: -5, y1: 0 },       // east scaffold bay
];
for (const cut of cuts) ground = ground.flatMap(g => subtract(g, cut));
for (const g of ground) addSolid(g.x0, g.y0, g.z0, g.x1, g.y1, g.z1, matFloor);

// ---------- Perimeter: sealed all the way round ----------
addSolid(-55, -6, -16, 55, WALL_H, -15, matWall);   // south
addSolid(-55, -6, 15, 55, WALL_H, 16, matWall);     // north
addSolid(-55, -6, -16, -54, WALL_H, 16, matWall);   // west
addSolid(54, -6, -16, 55, WALL_H, 16, matWall);     // east

// ---------- Connector ramps down into the Lower Hall (0.5m treads = walkable) ----------
for (let i = 0; i < 9; i++) {
  addSolid(-52 + i, -5, -15, -51 + i, -0.5 * (i + 1), -9, matFloor);
  addSolid(51 - i, -5, -15, 52 - i, -0.5 * (i + 1), -9, matFloor);
}

// ---------- Scaffold bays: 6 treads of ~0.83m — you have to JUMP each one ----------
function bay(xa, xb) {
  for (let j = 0; j < 6; j++) addSolid(xa, -5, -9 + j, xb, -5 + (5 / 6) * (j + 1), -8 + j, matScaffold);
}
bay(-10, -5);
bay(5, 10);

// ---------- One team's side, written for A (negative X) and mirrored for B ----------
function buildSide(sgn) {
  const S = (x0, z0, x1, z1, y0, y1, mat, o) => {
    const [a, b] = sgn === -1 ? [x0, x1] : [-x1, -x0];
    return addSolid(a, y0, z0, b, y1, z1, mat, o);
  };
  // Wall between spawn room and the lanes. Doors: Long z[-3,3], Stairs z[9,15]
  S(-42, -15, -41, -3, 0, WALL_H, matWall);
  S(-42, 3, -41, 9, 0, WALL_H, matWall);
  // Solid masses that carve out the lanes
  S(-41, -15, -15, -3, 0, WALL_H, matWall);   // south of Long
  S(-41, 3, -15, 9, 0, WALL_H, matWall);      // between Long and the Stairs lane
  // Choke: 3m doorway at the end of Long
  S(-19, -3, -15, -1.5, 0, WALL_H, matChoke);
  S(-19, 1.5, -15, 3, 0, WALL_H, matChoke);
  // Hard cover just inside Mid, off the main sightline
  S(-12.5, 1.2, -11, 2.8, 0, 1.2, matCover);
  // Stairs up to the Mezzanine: 10 treads, 0.5m rise each (auto step-up)
  for (let i = 0; i < 10; i++) S(-27 + 1.2 * i, 9, -27 + 1.2 * (i + 1), 15, 0, 0.5 * (i + 1), matMezz);
  // Spawn room cover
  S(-50, 8, -48, 10, 0, 1.2, matCover);
  S(-47, -7, -45, -5, 0, 1.2, matCover);
  // Team-colored spawn pad (visual only)
  const [pa, pb] = sgn === -1 ? [-52, -44] : [44, 52];
  addSolid(pa, 0, -4, pb, 0.03, 4, sgn === -1 ? matSpawnA : matSpawnB, { collide: false, shadow: false });
}
buildSide(-1);
buildSide(1);

// Deliberate asymmetry: B-Long gets one extra low crate that A-Long doesn't have
addSolid(30, 0, 1.5, 32, 1.2, 3, matCover);

// ---------- MID ----------
addSolid(-1, 0, 3, 1, 5, 5, matCover);                    // central pillar
addSolid(-8, 0, 1, -5, 1.2, 2, matCover);                 // low covers
addSolid(6, 0, 1, 9, 1.2, 2, matCover);
addSolid(-2, 0, -8, 2, 1.2, -6.8, matCover);
for (let k = 0; k < 10; k++) addSolid(2, 0, -1 + k, 5, 0.5 * (k + 1), k, matEscalator);   // dead escalator -> Mezzanine

// ---------- MEZZANINE (two halves, each held up by a shootable red support beam) ----------
addSolid(-15, 4.4, 9, 0, 5.0, 15, matMezz, { tag: 'mezzW' });
addSolid(0, 4.4, 9, 15, 5.0, 15, matMezz, { tag: 'mezzE' });
addSolid(-8.4, 0, 11.6, -7.6, 4.4, 12.4, matBeam, { tag: 'beamW' });
addSolid(7.6, 0, 11.6, 8.4, 4.4, 12.4, matBeam, { tag: 'beamE' });
for (const [a, b] of [[-15, -9], [-7, -2], [6, 10], [12, 15]]) {      // broken railing: partial cover only
  addSolid(a, 5, 9, b, 5.9, 9.4, matMezz, { tag: a < 0 ? 'mezzW' : 'mezzE' });
}

// ======================================================
// PLAYER + PHYSICS
//   player.pos is the FEET position. Walls block; floors/steps up to
//   STEP high are walked up automatically; anything taller needs a jump.
// ======================================================
const HEIGHT = 1.8, EYE = 1.65, RADIUS = 0.35, STEP = 0.6;
const SPEED = 7, GRAVITY = -24, JUMP = 8.6, BOOST = 7.5;
const SLIDE_SPEED = 13, SLIDE_TIME = 0.55, SLIDE_COOLDOWN = 0.5;
const PITCH_MAX = Math.PI / 2 - 0.05;

const SPAWNS = {
  A: [[-50, 0], [-48, 3], [-50, 6], [-47, -2]],
  B: [[50, 0], [48, 3], [50, 6], [47, -2]],
};

const player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, onGround: false, airBoosts: 1,
  isSliding: false, slideTimer: 0, slideCooldown: 0, slideDir: new THREE.Vector3(0, 0, -1),
  lean: 0,
};

function respawn(team = 'A') {
  const [x, z] = SPAWNS[team][Math.floor(Math.random() * SPAWNS[team].length)];
  player.pos.set(x, 0, z);
  player.vel.set(0, 0, 0);
  // Always spawn facing the Long door (never staring at a wall)
  const doorX = team === 'A' ? -41.5 : 41.5;
  player.yaw = Math.atan2(-(doorX - x), -(0 - z));
  player.pitch = 0;
  player.isSliding = false; player.onGround = true; player.airBoosts = 1;
}
respawn('A');

const forwardVec = () => new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
const rightVec = () => new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

const overlapsXZ = (c, x, z) => x + RADIUS > c.x0 && x - RADIUS < c.x1 && z + RADIUS > c.z0 && z - RADIUS < c.z1;

// Would standing at (x,z) with feet at `feet` put us inside a wall?
function blockedAt(x, z, feet) {
  const lo = feet + STEP, hi = feet + HEIGHT;
  for (const c of colliders) if (c.y1 > lo && c.y0 < hi && overlapsXZ(c, x, z)) return true;
  return false;
}
// Highest surface under (x,z) that is no higher than maxTop.
function groundAt(x, z, maxTop) {
  let best = -Infinity;
  for (const c of colliders) if (c.y1 <= maxTop && c.y1 > best && overlapsXZ(c, x, z)) best = c.y1;
  return best;
}
// Lowest underside between our head and where it's heading.
function ceilingAt(x, z, head, newHead) {
  let best = Infinity;
  for (const c of colliders) if (c.y0 >= head - 0.001 && c.y0 < newHead && c.y0 < best && overlapsXZ(c, x, z)) best = c.y0;
  return best;
}

// Safety net: if we're ever somehow inside geometry, pop out instead of freezing forever.
function unstick() {
  for (let r = 0.25; r <= 3; r += 0.25) {
    for (let a = 0; a < 16; a++) {
      const x = player.pos.x + Math.cos(a / 16 * Math.PI * 2) * r;
      const z = player.pos.z + Math.sin(a / 16 * Math.PI * 2) * r;
      if (!blockedAt(x, z, player.pos.y) && groundAt(x, z, player.pos.y + STEP) > -Infinity) {
        player.pos.x = x; player.pos.z = z; return;
      }
    }
  }
  respawn('A');
}

// ======================================================
// INPUT: device detection, keyboard, mouse/trackpad, touch
// ======================================================
let hasMouse = !!(window.matchMedia && window.matchMedia('(any-pointer: fine)').matches);   // mouse OR laptop trackpad
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let lastTouchTime = -1e9;

const keys = {};
const touchMove = { x: 0, z: 0 };       // stick: x = strafe, z = back(+)/forward(-)
const clearKeys = () => { for (const k in keys) keys[k] = false; touchMove.x = touchMove.z = 0; };

const blockerEl = document.getElementById('blocker');
const blockerVisible = () => blockerEl.style.display !== 'none';
let pointerLocked = false, lockWasHeld = false;

function wishDir() {
  const f = forwardVec(), r = rightVec();
  let fwd = 0, side = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) side += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) side -= 1;
  fwd += -touchMove.z; side += touchMove.x;
  const w = new THREE.Vector3(f.x * fwd + r.x * side, 0, f.z * fwd + r.z * side);
  if (w.length() > 1) w.normalize();
  return w;
}

function tryStartSlide() {
  if (!player.onGround || player.isSliding || player.slideCooldown > 0) return;
  const w = wishDir();
  // Direction is locked in at the moment of the slide; with no input held, slide where you're facing.
  player.slideDir.copy(w.lengthSq() > 0.01 ? w.normalize() : forwardVec());
  player.isSliding = true;
  player.slideTimer = SLIDE_TIME;
}

function airBoost() {            // one extra mid-air kick per jump (resets on landing)
  if (player.onGround || player.airBoosts <= 0) return;
  player.airBoosts--;
  player.vel.y = Math.max(player.vel.y, BOOST);
}

function applyLook(dx, dy) {
  if (!isFinite(dx) || !isFinite(dy)) return;
  dx = Math.max(-300, Math.min(300, dx)); dy = Math.max(-300, Math.min(300, dy));   // swallow browser spike glitches
  player.yaw -= dx * 0.0022;
  player.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, player.pitch - dy * 0.0022));
}

// ---- shooting (the red support beams) ----
const raycaster = new THREE.Raycaster();
const _dir = new THREE.Vector3();
function aimedBeam(maxDist) {
  camera.getWorldDirection(_dir);
  raycaster.set(camera.position, _dir);
  raycaster.far = maxDist;
  const hit = raycaster.intersectObjects(colliders.map(c => c.mesh), false)[0];   // walls block shots too
  if (!hit) return null;
  const c = colliders.find(c => c.mesh === hit.object);
  return c && c.tag && c.tag.startsWith('beam') ? c : null;
}
function collapse(side) {        // 'W' | 'E' — removes that half of the Mezzanine and its beam
  for (let i = colliders.length - 1; i >= 0; i--) {
    const c = colliders[i];
    if (c.tag === 'mezz' + side || c.tag === 'beam' + side) { scene.remove(c.mesh); colliders.splice(i, 1); }
  }
}
function fireShot() {
  if (blockerVisible()) return;
  const b = aimedBeam(40);
  if (b) collapse(b.tag.slice(4));
}

// ---- start / pause overlay ----
function startGame() {
  blockerEl.style.display = 'none';
  clearKeys();
  if (hasMouse) {
    try {
      const p = document.body.requestPointerLock && document.body.requestPointerLock();
      if (p && p.catch) p.catch(() => {});       // Safari returns nothing; Chrome returns a promise
    } catch (e) { /* no pointer lock available — drag-to-look still works */ }
  }
}
function showPaused() {
  clearKeys();
  document.getElementById('blocker-title').textContent = 'PAUSED';
  document.getElementById('blocker-text').textContent = hasMouse ? 'Click (or press Enter) to resume.' : 'Tap or press Enter to resume.';
  blockerEl.style.display = 'flex';
}
blockerEl.addEventListener('click', startGame);
document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
  if (pointerLocked) lockWasHeld = true;
  else if (lockWasHeld) { lockWasHeld = false; showPaused(); }
});

// ---- keyboard ----
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();       // never scroll the page
  if (blockerVisible()) { if (e.code === 'Enter' || e.code === 'Space') startGame(); return; }
  const fresh = !keys[e.code];
  keys[e.code] = true;
  if (!fresh) return;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') tryStartSlide();
  if (e.code === 'KeyC') airBoost();
  if (e.code === 'KeyF' || e.code === 'Enter') fireShot();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', clearKeys);                                   // never leave a key "stuck" down
document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });

// ---- mouse / trackpad ----
let dragLook = false, dragDist = 0, lastX = 0, lastY = 0;
document.addEventListener('mousemove', (e) => {
  if (!hasMouse && performance.now() - lastTouchTime > 800 && (e.movementX || e.movementY)) {
    hasMouse = true; applyInputMode();                 // a real mouse showed up — switch modes live
  }
  if (blockerVisible()) return;
  if (pointerLocked) applyLook(e.movementX || 0, e.movementY || 0);
  else if (dragLook) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    dragDist += Math.abs(dx) + Math.abs(dy);
    applyLook(dx, dy); lastX = e.clientX; lastY = e.clientY;
  }
});
document.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || blockerVisible()) return;
  if (pointerLocked) fireShot();
  else { dragLook = true; dragDist = 0; lastX = e.clientX; lastY = e.clientY; }
});
document.addEventListener('mouseup', () => {
  if (dragLook && dragDist < 4) fireShot();            // a plain click (no drag) shoots when pointer lock isn't available
  dragLook = false;
});

// ---- touch ----
window.addEventListener('touchstart', () => { lastTouchTime = performance.now(); }, { passive: true });
(function setupTouch() {
  const joyZone = document.getElementById('touch-joystick-zone');
  const joyBase = document.getElementById('joystick-base');
  const joyKnob = document.getElementById('joystick-knob');
  const lookZone = document.getElementById('touch-look-zone');
  const R = 55;
  let joyId = null, cx = 0, cy = 0, lookId = null, lx = 0, ly = 0;
  const find = (e, id) => { for (const t of e.changedTouches) if (t.identifier === id) return t; return null; };

  joyZone.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0]; joyId = t.identifier;
    const r = joyBase.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    e.preventDefault();
  }, { passive: false });
  joyZone.addEventListener('touchmove', (e) => {
    const t = find(e, joyId); if (!t) return;
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const d = Math.min(R, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    dx = Math.cos(a) * d; dy = Math.sin(a) * d;
    joyKnob.style.left = (30 + dx) + 'px'; joyKnob.style.top = (30 + dy) + 'px';
    touchMove.x = dx / R; touchMove.z = dy / R;
    e.preventDefault();
  }, { passive: false });
  const endJoy = (e) => {
    joyId = null; touchMove.x = touchMove.z = 0;
    joyKnob.style.left = '30px'; joyKnob.style.top = '30px'; e.preventDefault();
  };
  joyZone.addEventListener('touchend', endJoy, { passive: false });
  joyZone.addEventListener('touchcancel', endJoy, { passive: false });

  lookZone.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; e.preventDefault(); }, { passive: false });
  lookZone.addEventListener('touchmove', (e) => {
    const t = find(e, lookId); if (!t) return;
    applyLook((t.clientX - lx) * 1.6, (t.clientY - ly) * 1.6); lx = t.clientX; ly = t.clientY; e.preventDefault();
  }, { passive: false });
  lookZone.addEventListener('touchend', (e) => { lookId = null; e.preventDefault(); }, { passive: false });

  const press = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { down(); e.preventDefault(); }, { passive: false });
    if (up) { el.addEventListener('touchend', (e) => { up(); e.preventDefault(); }, { passive: false }); el.addEventListener('touchcancel', up); }
  };
  press('btn-jump', () => { keys['Space'] = true; }, () => { keys['Space'] = false; });
  press('btn-slide', tryStartSlide);
  press('btn-boost', airBoost);
  press('btn-shoot', fireShot);
})();

// ---- HUD text + touch UI follow whichever device is actually in use ----
function applyInputMode() {
  const touchUI = !hasMouse && isTouch;
  for (const id of ['touch-joystick-zone', 'touch-look-zone']) document.getElementById(id).style.display = touchUI ? 'block' : 'none';
  for (const id of ['btn-jump', 'btn-slide', 'btn-boost', 'btn-shoot']) document.getElementById(id).style.display = touchUI ? 'flex' : 'none';
  const controls = document.getElementById('controls-line'), look = document.getElementById('look-line'), text = document.getElementById('blocker-text');
  if (hasMouse) {
    controls.textContent = 'WASD or Arrows move · SPACE jump · SHIFT slide · C air-boost · Q/E lean';
    look.textContent = 'Mouse / trackpad to look (click to capture, Esc to release) · Click or F to shoot';
    text.textContent = 'Map: Atrium — geometry blockout for movement/TTK playtesting. Click to start.';
  } else if (touchUI) {
    controls.textContent = 'Left stick: move · JUMP / SLIDE / AIR BOOST / SHOOT buttons';
    look.textContent = 'Drag the right side of the screen to look';
    text.textContent = 'Map: Atrium — geometry blockout for movement/TTK playtesting. Tap to start.';
  } else {
    controls.textContent = 'ARROWS move · SPACE jump · SHIFT slide · C air-boost · Q/E lean';
    look.textContent = 'No mouse detected — LOOK with J / L (turn) and I / K (up / down) · F or Enter to shoot';
    text.textContent = 'Map: Atrium — geometry blockout. No mouse detected: arrows move, J/L/I/K look. Press Enter to start.';
  }
}
applyInputMode();

// ======================================================
// FRAME UPDATE
// ======================================================
function updatePlayer(dt) {
  // Keyboard look (the way to turn when there's no mouse)
  const LOOK = 2.2;
  if (keys['KeyJ']) player.yaw += LOOK * dt;
  if (keys['KeyL']) player.yaw -= LOOK * dt;
  if (keys['KeyI']) player.pitch = Math.min(PITCH_MAX, player.pitch + LOOK * 0.7 * dt);
  if (keys['KeyK']) player.pitch = Math.max(-PITCH_MAX, player.pitch - LOOK * 0.7 * dt);

  if (blockedAt(player.pos.x, player.pos.z, player.pos.y)) unstick();

  // Horizontal velocity: normal walking, or a committed slide burst
  player.slideCooldown = Math.max(0, player.slideCooldown - dt);
  if (player.isSliding) {
    player.slideTimer -= dt;
    const k = Math.max(0, player.slideTimer / SLIDE_TIME);
    const sp = SPEED * 0.9 + (SLIDE_SPEED - SPEED * 0.9) * k;       // burst that eases back down
    player.vel.x = player.slideDir.x * sp;
    player.vel.z = player.slideDir.z * sp;
    if (player.slideTimer <= 0) { player.isSliding = false; player.slideCooldown = SLIDE_COOLDOWN; }
  } else {
    const w = wishDir();
    player.vel.x = w.x * SPEED;
    player.vel.z = w.z * SPEED;
  }

  const wasGround = player.onGround;
  if (keys['Space'] && player.onGround) { player.vel.y = JUMP; player.onGround = false; }

  // Move one axis at a time so walls are slid along instead of stuck to
  const nx = player.pos.x + player.vel.x * dt;
  if (!blockedAt(nx, player.pos.z, player.pos.y)) player.pos.x = nx; else player.vel.x = 0;
  const nz = player.pos.z + player.vel.z * dt;
  if (!blockedAt(player.pos.x, nz, player.pos.y)) player.pos.z = nz; else player.vel.z = 0;

  // Vertical: gravity, landing, stepping up/down small steps, head bumps
  player.vel.y += GRAVITY * dt;
  const newY = player.pos.y + player.vel.y * dt;
  if (player.vel.y <= 0) {
    const g = groundAt(player.pos.x, player.pos.z, player.pos.y + STEP);
    if (g > -Infinity && (newY <= g + 1e-4 || (wasGround && player.pos.y - g <= STEP))) {
      player.pos.y = g; player.vel.y = 0; player.onGround = true; player.airBoosts = 1;
    } else { player.pos.y = newY; player.onGround = false; }
  } else {
    const ceil = ceilingAt(player.pos.x, player.pos.z, player.pos.y + HEIGHT, newY + HEIGHT);
    if (ceil < Infinity) { player.pos.y = ceil - HEIGHT - 0.001; player.vel.y = 0; } else player.pos.y = newY;
    player.onGround = false;
  }

  player.lean += ((keys['KeyQ'] ? -1 : keys['KeyE'] ? 1 : 0) - player.lean) * Math.min(1, dt * 8);
  if (player.pos.y < -9) respawn('A');       // can't happen on a sealed map, but never leave anyone falling forever
}

function updateCamera() {
  const r = rightVec();
  camera.position.set(
    player.pos.x + r.x * player.lean * 0.4,
    player.pos.y + (player.isSliding ? 0.95 : EYE),
    player.pos.z + r.z * player.lean * 0.4
  );
  camera.rotation.set(player.pitch, player.yaw, -player.lean * 0.12);
}

function zoneName(x, y, z) {
  const side = x < 0 ? 'A' : 'B', ax = Math.abs(x);
  if (z < -3 && z > -9 && ax >= 5 && ax <= 10 && y < -0.2) return 'SCAFFOLD';
  if (y < -2) return ax > 42 ? side + '-CONNECTOR' : 'LOWER HALL';
  if (y > 4.2) return ax <= 15 ? 'MEZZANINE' : side + '-STAIRS';
  if (ax >= 42) return 'TEAM ' + side + ' SPAWN';
  if (z > 9 && ax >= 15) return side + '-STAIRS';
  if (ax >= 27) return side + '-LONG';
  if (ax >= 15) return side + '-CHOKE';
  return 'MID';
}

const posEl = document.getElementById('pos'), calloutEl = document.getElementById('callout');
const beamPromptEl = document.getElementById('beam-prompt'), slideEl = document.getElementById('slide-status');
function updateHud(frame) {
  posEl.textContent = `pos: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}`;
  calloutEl.textContent = zoneName(player.pos.x, player.pos.y, player.pos.z);
  slideEl.style.opacity = player.isSliding ? '1' : '0';
  if (frame % 6 === 0) beamPromptEl.style.display = aimedBeam(12) ? 'block' : 'none';
}

// Test/debug hook (lets automated checks drive the real game loop)
window.__fz = {
  player, colliders, keys, step: updatePlayer, camStep: updateCamera, blockedAt, groundAt, respawn, collapse, startGame, applyLook,
  teleport(x, y, z, yaw = 0) { player.pos.set(x, y, z); player.vel.set(0, 0, 0); player.yaw = yaw; player.pitch = 0; player.isSliding = false; player.onGround = false; },
};

const clock = new THREE.Clock();
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if (!window.__fzPause) updatePlayer(dt);
  updateCamera();
  updateHud(frame++);
  renderer.render(scene, camera);
}
animate();
</script>
