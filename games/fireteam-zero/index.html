<script type="module">
import * as THREE from 'three';

/* ============================================================
   FIRETEAM ZERO — ATRIUM (geometry blockout)

   The whole map is solid boxes plus ONE big "ground" block with the
   tunnel / ramps / scaffold bays carved out of it. Everything walkable
   is physically connected and everything else is solid, so there are no
   floating floor islands to fall between and no open edges to walk off.

   Top-down (X = west/east, Z = north/south; team A left, team B right):

     z=+15  spawnA | A-stairs lane > A-STAIRS ^ MEZZANINE (y=5) ^ B-STAIRS < lane | spawnB
                     (solid mass)          MID room, open to the sky
     z=  0  spawnA = A-LONG = A-CHOKE ======== MID ======== B-CHOKE = B-LONG = spawnB
                     (solid mass)     scaffold bays (jump-climb up from the tunnel)
     z=-15  ramp v ======= LOWER HALL tunnel (y=-5, runs under everything) ======= v ramp
   ============================================================ */

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
scene.fog = new THREE.Fog(0x1a1a22, 40, 130);

// Warm skylight glow fading up into blue sky, seen through the open roof over Mid/Mezzanine —
// the "Atrium" the map is named for.
(function makeSkyDome() {
  const geo = new THREE.SphereGeometry(300, 16, 12);
  const pos = geo.attributes.position, colors = [];
  const top = new THREE.Color(0x4f7fb8), mid = new THREE.Color(0xffd9a0), low = new THREE.Color(0x1a1a22);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp((pos.getY(i) / 300 + 1) / 2, 0, 1);
    if (t > 0.42) c.lerpColors(mid, top, (t - 0.42) / 0.58); else c.lerpColors(low, mid, t / 0.42);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const dome = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }));
  dome.renderOrder = -1;
  scene.add(dome);
})();

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);                                   // in the scene so the gun (a camera child) renders

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(20, 60, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 40, bottom: -40, far: 200 });
scene.add(sun);

// ---------- Materials (color-coded by function) ----------
const M = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const matFloor = M(0x6a6a7c), matWall = M(0x54545f, 0.95), matChoke = M(0x6e5a48);
const matCover = M(0x4a5a4a), matMezz = M(0x4a4a6a, 0.85), matScaffold = M(0xaa6633, 0.7);
const matEscalator = M(0x777788, 0.6, 0.3), matBeam = M(0xcc4433, 0.6);
const matSpawnA = M(0x3355aa), matSpawnB = M(0xaa3333);
// Every solid gets a tag from its material so the map diagram can draw the real geometry
const MAT_TAG = new Map([[matWall, 'wall'], [matChoke, 'choke'], [matCover, 'cover'], [matFloor, 'floor'], [matScaffold, 'scaffold'], [matEscalator, 'escalator']]);

// ---------- Solid world ----------
const colliders = [];       // { x0,y0,z0,x1,y1,z1, mesh, tag }
const WALL_H = 12;          // tall enough that nobody can jump out of the map

function addSolid(x0, y0, z0, x1, y1, z1, mat, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = opts.shadow !== false;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const c = { x0, y0, z0, x1, y1, z1, mesh, tag: opts.tag || MAT_TAG.get(mat) || (mat === matMezz ? 'stairs' : null) };
  if (opts.collide !== false) colliders.push(c);
  return c;
}

// Pieces of box `a` left over after cutting box `b` out of it.
function subtract(a, b) {
  if (b.x0 >= a.x1 || b.x1 <= a.x0 || b.y0 >= a.y1 || b.y1 <= a.y0 || b.z0 >= a.z1 || b.z1 <= a.z0) return [a];
  const out = [], r = { ...a };
  if (b.x0 > r.x0) { out.push({ ...r, x1: b.x0 }); r.x0 = b.x0; }
  if (b.x1 < r.x1) { out.push({ ...r, x0: b.x1 }); r.x1 = b.x1; }
  if (b.y0 > r.y0) { out.push({ ...r, y1: b.y0 }); r.y0 = b.y0; }
  if (b.y1 < r.y1) { out.push({ ...r, y0: b.y1 }); r.y1 = b.y1; }
  if (b.z0 > r.z0) { out.push({ ...r, z1: b.z0 }); r.z0 = b.z0; }
  if (b.z1 < r.z1) { out.push({ ...r, z0: b.z1 }); r.z1 = b.z1; }
  return out;
}

// ---------- THE GROUND: one solid block, lower areas carved out ----------
let ground = [{ x0: -54, y0: -6, z0: -15, x1: 54, y1: 0, z1: 15 }];
const cuts = [
  { x0: -42, x1: 42, z0: -15, z1: -9, y0: -5, y1: -1 },   // Lower Hall tunnel (4m headroom; main floor is its ceiling)

function placeAt(a, x, z, team) {

const forwardVec = () => new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
const rightVec = () => new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

const overlapsXZ = (c, x, z) => x + RADIUS > c.x0 && x - RADIUS < c.x1 && z + RADIUS > c.z0 && z - RADIUS < c.z1;

// Would standing at (x,z) with feet at `feet` put us inside a wall?
function blockedAt(x, z, feet) {
  const lo = feet + STEP, hi = feet + HEIGHT;
  for (const c of colliders) if (c.y1 > lo && c.y0 < hi && overlapsXZ(c, x, z)) return true;
  return false;
}
// Highest surface under (x,z) that is no higher than maxTop.
function groundAt(x, z, maxTop) {
  let best = -Infinity;
  for (const c of colliders) if (c.y1 <= maxTop && c.y1 > best && overlapsXZ(c, x, z)) best = c.y1;
  return best;
}
// Lowest underside between our head and where it's heading.
function ceilingAt(x, z, head, newHead) {
  let best = Infinity;
  for (const c of colliders) if (c.y0 >= head - 0.001 && c.y0 < newHead && c.y0 < best && overlapsXZ(c, x, z)) best = c.y0;
  return best;
}

// Safety net: if we're ever somehow inside geometry, pop out instead of freezing forever.
function unstick(b = player) {
  for (let r = 0.25; r <= 3; r += 0.25) {
    for (let a = 0; a < 16; a++) {
      const x = b.pos.x + Math.cos(a / 16 * Math.PI * 2) * r;
      const z = b.pos.z + Math.sin(a / 16 * Math.PI * 2) * r;
      if (!blockedAt(x, z, b.pos.y) && groundAt(x, z, b.pos.y + STEP) > -Infinity) {
        b.pos.x = x; b.pos.z = z; return;
      }
    }
  }
  if (b === player) respawn(player.team); else spawnActor(b);
}

// Shared movement for the player AND the bots (same rules for everyone).
function applyHorizontal(b, w, speed, dt) {
  b.slideCooldown = Math.max(0, b.slideCooldown - dt);
  if (b.isSliding) {
    b.slideTimer -= dt;
    const k = Math.max(0, b.slideTimer / SLIDE_TIME);
    const sp = SPEED * 0.9 + (SLIDE_SPEED - SPEED * 0.9) * k;       // burst that eases back down
    b.vel.x = b.slideDir.x * sp;
    b.vel.z = b.slideDir.z * sp;
    if (b.slideTimer <= 0) { b.isSliding = false; b.slideCooldown = SLIDE_COOLDOWN; }
  } else if (!b.onGround && w.lengthSq() > 0.0001) {
    // Air strafing (player only — bots only reach this fn while sliding): with a direction held,
    // velocity isn't snapped to input, it's *redirected* toward it, so turning the mouse while
    // holding A/D mid-air lets you carry and build speed, CS/Quake-style, instead of just falling
    // in a straight line. Letting go of all movement keys falls back to the instant-stop below, so
    // releasing input mid-air behaves exactly as it always has.
    const cap = speed * AIR_SPEED_MUL;
    const cur = b.vel.x * w.x + b.vel.z * w.z;                    // current speed along wish dir
    const add = Math.min(AIR_ACCEL * dt, Math.max(0, cap - cur));
    b.vel.x += add * w.x; b.vel.z += add * w.z;
    const drag = Math.max(0, 1 - AIR_DRAG * dt);
    b.vel.x *= drag; b.vel.z *= drag;
    const sp = Math.hypot(b.vel.x, b.vel.z);
    if (sp > cap) { const k = cap / sp; b.vel.x *= k; b.vel.z *= k; }   // hard cap so it stays a bonus, not a glitch
  } else {
    b.vel.x = w.x * speed;
    b.vel.z = w.z * speed;
  }
}
function integrate(b, dt, wantJump) {
  const wasGround = b.onGround;
  if (wantJump && b.onGround) { b.vel.y = JUMP; b.onGround = false; }

  // Move one axis at a time so walls are slid along instead of stuck to
  const nx = b.pos.x + b.vel.x * dt;
  if (!blockedAt(nx, b.pos.z, b.pos.y)) b.pos.x = nx; else b.vel.x = 0;
  const nz = b.pos.z + b.vel.z * dt;
  if (!blockedAt(b.pos.x, nz, b.pos.y)) b.pos.z = nz; else b.vel.z = 0;

  // Vertical: gravity, landing, stepping up/down small steps, head bumps
  b.vel.y += GRAVITY * dt;
  const newY = b.pos.y + b.vel.y * dt;
  if (b.vel.y <= 0) {
    const g = groundAt(b.pos.x, b.pos.z, b.pos.y + STEP);
    if (g > -Infinity && (newY <= g + 1e-4 || (wasGround && b.pos.y - g <= STEP))) {
      b.pos.y = g; b.vel.y = 0; b.onGround = true; b.airBoosts = 1;
    } else { b.pos.y = newY; b.onGround = false; }
  } else {
    const ceil = ceilingAt(b.pos.x, b.pos.z, b.pos.y + HEIGHT, newY + HEIGHT);
    if (ceil < Infinity) { b.pos.y = ceil - HEIGHT - 0.001; b.vel.y = 0; } else b.pos.y = newY;
    b.onGround = false;
  }
}

function wishDir() {

  if (keys['KeyW'] || keys['ArrowUp']) fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) side += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) side -= 1;
  const w = new THREE.Vector3(f.x * fwd + r.x * side, 0, f.z * fwd + r.z * side);
  if (w.length() > 1) w.normalize();

}

function tryStartSlide() {
  if (!player.onGround || player.isSliding || player.slideCooldown > 0) return;
  const w = wishDir();
  // Direction is locked in at the moment of the slide; with no input held, slide where you're facing.
  player.slideDir.copy(w.lengthSq() > 0.01 ? w.normalize() : forwardVec());
  player.isSliding = true;
  player.slideTimer = SLIDE_TIME;
}

  if (player.onGround || player.airBoosts <= 0) return;

// reports pointer-lock movementX/Y in *device* pixels instead of CSS pixels, so aiming ends up
// roughly devicePixelRatio-times too fast and twitchy versus the same mouse/trackpad on Windows

function applyLook(dx, dy) {
  if (!isFinite(dx) || !isFinite(dy)) return;
  dx = Math.max(-300, Math.min(300, dx)); dy = Math.max(-300, Math.min(300, dy));   // swallow browser spike glitches
  dx /= DPR_FIX; dy /= DPR_FIX;

  ar: [1800, 1, 140], smg: [2400, 0.8, 170], shotgun: [700, 1.5, 90], dmr: [1300, 1.2, 120], lmg: [1500, 1.1, 120], sniper: [600, 1.7, 70], pistol: [2600, 0.8, 190],

function playShot(vol = 1, pan = 0, kind = 'ar') {
  const [fq, loud, thump] = SHOT_SOUND[kind] || SHOT_SOUND.ar;

    if (!shotBuf) {

      const d = shotBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    const out = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
    if (out.pan) out.pan.value = Math.max(-1, Math.min(1, pan));

    const filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = fq; filt.Q.value = 0.7;
    const gain = audioCtx.createGain(); gain.gain.value = Math.min(0.4, 0.22 * vol);
    src.connect(filt); filt.connect(gain); gain.connect(out); src.start(t);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(thump, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.08);
    og.gain.setValueAtTime(0.3 * vol, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

}

    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();

function playerSpread() {
  const w = curW, hv = Math.hypot(player.vel.x, player.vel.z), a = adsT;
  const base = w.adsSpread !== undefined ? w.base + (w.adsSpread - w.base) * a : w.base * (1 - 0.5 * a);
  return base + Math.min(1, hv / SPEED) * w.move * (1 - 0.4 * a) + (player.onGround ? 0 : 0.035) + (player.isSliding ? 0.01 : 0) + Math.min(spray, 10) * w.sprayK * (1 - 0.3 * a);
}

const _right = new THREE.Vector3(), _up = new THREE.Vector3();
function fireShot() {
  if (blockerVisible() || player.dead || reloadT > 0 || swapT > 0) return;
  if (ammo <= 0) { startReload(); return; }
  ammo--;
  const w = curW, pellets = w.pellets || 1;
  camera.updateMatrixWorld(true);
  _right.setFromMatrixColumn(camera.matrixWorld, 0); _up.setFromMatrixColumn(camera.matrixWorld, 1);
  const sp = playerSpread(), meshes = colliders.map(c => c.mesh);
  _v.set(0.16 * (1 - adsT), -0.12 * (1 - adsT) - 0.04, -0.7).applyMatrix4(camera.matrixWorld);   // where the muzzle is, roughly
  const dmgTo = new Map();
  let beamHit = null;
  for (let p = 0; p < pellets; p++) {
    camera.getWorldDirection(_dir);
    const r = Math.sqrt(Math.random()) * (sp + (w.pelletSpread || 0)), th = Math.random() * Math.PI * 2;
    _dir.addScaledVector(_right, Math.cos(th) * r).addScaledVector(_up, Math.sin(th) * r).normalize();
    raycaster.set(camera.position, _dir);
    raycaster.far = SHOT_RANGE;
    const hit = raycaster.intersectObjects(meshes, false)[0];
    const wallT = hit ? hit.distance : SHOT_RANGE;
    const ah = match.mode === 'tdm' && match.started ? actorHit(player, camera.position, _dir, wallT) : null;
    const end = camera.position.clone().addScaledVector(_dir, ah ? ah.t : wallT);
    addTracer(_v, end);
    if (ah) addSpark(end, 0xff3b3b); else if (hit) addSpark(hit.point);
    if (ah) {

  spray += 1; lastFireReal = realT;

    const res = applyDamage(a, e.dmg, player, e.head ? 'head' : 'body');
    if (res) showHitmark(res === 'kill' ? '#ff4040' : e.head ? '#ffb020' : '#ffffff', res === 'kill');
  }

}
function tryFire() {
  if (fireCooldown > 0 || (!curW.auto && !triggerReady)) return;    // semi-auto / bolt guns need a fresh click per shot
  fireShot(); fireCooldown = curW.interval; triggerReady = false;
}

const HIP = new THREE.Vector3(0.15, -0.16, -0.52), VM_YAW = 0.05;   // hip-fire spot (slightly angled in toward the crosshair)
const scopeEl = document.getElementById('scope');
function updateViewmodel(dt) {
  realT += dt;
  const w = curW;
  const wantAds = (adsHeld || keys['KeyV']) && !player.dead && reloadT <= 0 && swapT <= 0 && !player.isSliding && !blockerVisible();
  adsT = Math.max(0, Math.min(1, adsT + (wantAds ? 1 : -1.5) * dt / w.adsTime));
  const e = adsT * adsT * (3 - 2 * adsT);
  swapT = Math.max(0, swapT - dt);
  gunKick = Math.max(0, gunKick - dt * 9);
  const hv = player.onGround ? Math.hypot(player.vel.x, player.vel.z) : 0;
  bobPhase += hv * dt * 1.5;
  const bob = Math.min(1, hv / SPEED) * (1 - 0.85 * e);
  const hy = HIP.y + (vmInfo.pistol ? 0.035 : 0), hx = HIP.x - (vmInfo.pistol ? 0.03 : 0);
  let x = hx * (1 - e) + Math.sin(bobPhase) * 0.012 * bob;
  let y = hy + (-vmInfo.sightY - hy) * e - Math.abs(Math.cos(bobPhase)) * 0.012 * bob - 0.3 * (swapT / SWAP_TIME);
  let z = HIP.z + (-0.3 - HIP.z) * e + gunKick * (0.05 - 0.03 * e);
  let rx = gunKick * (0.07 - 0.04 * e), rz = 0;
  if (reloadT > 0) { const k = Math.sin(Math.PI * (1 - reloadT / w.reload)); rz = -0.55 * k; y -= 0.07 * k; rx += 0.25 * k; }
  if (player.isSliding) { rz += 0.22; y -= 0.03; }
  if (!player.onGround) y += Math.max(-0.03, Math.min(0.03, -player.vel.y * 0.003)) * (1 - e);
  gun.position.set(x, y, z); gun.rotation.set(rx, VM_YAW * (1 - e), rz);
  flashT = Math.max(0, flashT - dt);
  flashLight.intensity = flashT > 0 ? 3 : 0; vmFlash.intensity = flashT > 0 ? 3 : 0;
  vmFlash.position.set(x, y + 0.04, z + vmInfo.muzzleZ);
  recoilPitch -= recoilPitch * Math.min(1, dt * 4); recoilYaw -= recoilYaw * Math.min(1, dt * 4);
  if (realT - lastFireReal > 0.15 || !mouseHeld) spray = Math.max(0, spray - dt * 12);
  if (reloadT > 0) { reloadT -= dt * (gameTime < adrenUntil ? 1.4 : 1); if (reloadT <= 0) { reloadT = 0; ammo = curW.mag; } }
  const fov = 75 + (w.adsFov - 75) * e;
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const scoped = !!w.scope && adsT > 0.9 && !player.dead;
  scopeEl.style.display = scoped ? 'block' : 'none';
  gun.visible = !scoped && !player.dead;
  crosshairEl.style.opacity = scoped ? '0' : '1';
  crosshairEl.classList.toggle('ads', adsT > 0.6);
  const c = CAMOS[camo];
  if (c && c.anim === 'aurora') { vmBody.color.setHSL((realT * 0.08) % 1, 0.8, 0.55); vmBody.emissive.copy(vmBody.color); }
  if (c && c.anim === 'zero') { const p = 0.5 + 0.5 * Math.sin(realT * 3); vmBody.color.setHSL(0.52, 0.6, 0.75 + 0.2 * p); vmBody.emissive.setHSL(0.52, 1, 0.5); vmBody.emissiveIntensity = 0.3 + 0.5 * p; }
}

// ---- start / pause overlay ----
function startGame() {
  if (!hasMouse) return;                                  // this game needs a mouse / trackpad
  blockerEl.style.display = 'none';
  clearKeys();
  ensureAudio();
  try {
    const p = document.body.requestPointerLock && document.body.requestPointerLock();
    if (p && p.catch) p.catch(() => {});                  // Safari returns nothing; Chrome returns a promise
  } catch (e) { /* no pointer lock available — click-drag look still works */ }
}
function showPaused() {
  clearKeys();

    const { A, B } = match.score;

let menuReady = false, phaseConfirm = false;           // menuReady: the saved profile has been loaded

// ---- keyboard ----
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();       // never scroll the page
  if (e.code === 'KeyM') { if (!e.repeat) cycleMap(); return; }
  if (e.code === 'Tab') { e.preventDefault(); if (!blockerVisible()) showTab(true); return; }
  if (blockerVisible()) {
    if ((e.code === 'Enter' || e.code === 'Space') && hasMouse) { if (!match.started || match.over) startMatch(match.mode); startGame(); }
    return;
  }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'Digit1') equip(0);
  if (e.code === 'Digit2') equip(1);
  const fresh = !keys[e.code];
  keys[e.code] = true;
  if (!fresh) return;
  if (e.code === 'KeyF') triggerReady = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') tryStartSlide();
  if (e.code === 'KeyC') airBoost();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'Tab') showTab(false); if (e.code === 'KeyF') triggerReady = true; });
window.addEventListener('blur', clearKeys);                                   // never leave a key "stuck" down
document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });

// ---- mouse / trackpad ----
let dragLook = false, dragDist = 0, lastX = 0, lastY = 0;
window.addEventListener('touchstart', () => { lastTouchTime = performance.now(); }, { passive: true });
document.addEventListener('mousemove', (e) => {
  if (!hasMouse && performance.now() - lastTouchTime > 800 && (e.movementX || e.movementY)) {
    hasMouse = true; applyInputMode();                 // a real mouse showed up — switch modes live
  }
  if (blockerVisible()) return;
  if (pointerLocked) applyLook(e.movementX || 0, e.movementY || 0);
  else if (dragLook) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    dragDist += Math.abs(dx) + Math.abs(dy);
    applyLook(dx, dy); lastX = e.clientX; lastY = e.clientY;
  }
});
document.addEventListener('mousedown', (e) => {
  if (blockerVisible()) return;
  if (e.button === 2) { adsHeld = true; return; }                          // right-click (two-finger click on a trackpad) = aim
  if (e.button !== 0) return;
  triggerReady = true;
  if (pointerLocked) { mouseHeld = true; tryFire(); }                     // click = shoot, hold = auto-fire
  else { dragLook = true; dragDist = 0; lastX = e.clientX; lastY = e.clientY; }
});
document.addEventListener('mouseup', (e) => {
  if (e.button === 2) { adsHeld = false; return; }
  mouseHeld = false; triggerReady = true;

  dragLook = false;
});

document.addEventListener('wheel', (e) => { if (!blockerVisible() && Math.abs(e.deltaY) > 4) equip(slot ? 0 : 1); }, { passive: true });

// ======================================================
// MAP DIAGRAM — live top-down plan + side-view height strip. M cycles large -> small -> off.
// Drawn from the same colliders the physics uses, so it is exactly what's there
// (a collapsed Mezzanine half disappears from the map too).
// ======================================================
const mapCanvas = document.getElementById('map');
const mctx = mapCanvas.getContext('2d');
const staticMap = document.createElement('canvas');
const WB = { x0: -55, x1: 55, z0: -16, z1: 16 };          // world rectangle shown
const Y_TOP = 7, Y_BOT = -6;                              // side-view height range
const MAP_ORDER = [1, 2, 0];                              // 1 = large, 2 = small, 0 = hidden
let mapMode = START_MODE === 'roam' ? 1 : 2, mapDirty = true, ML = null;   // free roam opens with the big map; TDM with the small one

function layoutMap() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const big = mapMode === 1;
  const fit = Math.floor((0.5 * window.innerHeight - 154) / 0.362);          // keep the large map above the crosshair on short screens
  const W = Math.min(window.innerWidth - 32, big ? Math.max(340, Math.min(820, fit)) : 340);
  const s = W / (WB.x1 - WB.x0);                          // px per world unit (plan)
  const sy = s * 0.6;                                     // vertical scale of the side view
  const head = 22, planH = Math.round((WB.z1 - WB.z0) * s);
  const sideH = big ? Math.round((Y_TOP - Y_BOT) * sy) : 0;
  const sideTop = head + planH + 20;
  const H = big ? sideTop + sideH + 8 : head + planH + 6;
  ML = { dpr, big, W, H, s, sy, head, planH, sideTop, sideH };
  for (const c of [mapCanvas, staticMap]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  mapCanvas.style.width = W + 'px'; mapCanvas.style.height = H + 'px';
  mapDirty = true;
}
const mx = (x) => (x - WB.x0) * ML.s;
const mz = (z) => ML.head + (WB.z1 - z) * ML.s;           // +Z is up on the map
const my = (y) => ML.sideTop + (Y_TOP - y) * ML.sy;

function cycleMap() {
  mapMode = MAP_ORDER[(MAP_ORDER.indexOf(mapMode) + 1) % MAP_ORDER.length];
  mapCanvas.style.display = mapMode === 0 ? 'none' : 'block';
  if (mapMode) layoutMap();
}

function drawStaticMap() {
  const g = staticMap.getContext('2d');
  const { dpr, big, W, H, s, head, planH, sideTop, sideH } = ML;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(10,12,18,0.86)'; g.fillRect(0, 0, W, H);                  // panel background (slightly see-through)
  const R = (x0, z0, x1, z1) => [mx(x0), mz(z1), (x1 - x0) * s, (z1 - z0) * s];
  const font = (px) => `bold ${px}px ui-monospace, Menlo, Consolas, monospace`;
  const label = (txt, x, z, px = big ? 10 : 7, color = '#fff') => {
    g.font = font(px); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 3; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,0.8)'; g.strokeText(txt, mx(x), mz(z));
    g.fillStyle = color; g.fillText(txt, mx(x), mz(z));
  };
  const by = (tag, fn) => { for (const c of colliders) if (c.tag === tag) fn(c, R(c.x0, c.z0, c.x1, c.z1)); };

  // header: title + legend
  g.fillStyle = '#e8eaf5'; g.font = font(big ? 12 : 9); g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('ATRIUM · LIVE MAP', 8, head / 2);
  if (big && W >= 700) {
    let lx = 168;
    for (const [name, fill, stroke] of [['wall', '#0d0e13', '#a7adc8'], ['cover', '#5f8a5f'], ['stairs', '#4a5db0'],
      ['mezzanine', 'rgba(106,120,255,0.55)', '#9aa6ff'], ['lower hall', 'rgba(47,209,200,0.55)', '#2fd1c8'],
      ['climb', '#ff963c'], ['shoot', '#ff5a3c']]) {
      g.fillStyle = fill; g.fillRect(lx, head / 2 - 5, 10, 10);
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.strokeRect(lx + 0.5, head / 2 - 4.5, 9, 9); }
      g.font = font(10); g.textAlign = 'left'; g.fillStyle = '#b9bdd0'; g.fillText(name, lx + 14, head / 2);
      lx += 14 + g.measureText(name).width + 14;
    }
  }

  // plan: floor, spawn pads, stairs/escalator, cover, mezzanine, walls, then the Lower Hall shown through the floor
  g.fillStyle = '#12141b'; g.fillRect(0, head, W, planH);
  g.fillStyle = '#4a4d5e'; g.fillRect(...R(-54, -15, 54, 15));
  g.fillStyle = 'rgba(70,110,230,0.55)'; g.fillRect(...R(-52, -4, -44, 4));
  g.fillStyle = 'rgba(230,70,70,0.55)'; g.fillRect(...R(44, -4, 52, 4));
  by('stairs', (c, r) => { g.fillStyle = `hsl(228,45%,${28 + c.y1 * 7}%)`; g.fillRect(...r); });
  by('escalator', (c, r) => { g.fillStyle = `hsl(220,12%,${34 + c.y1 * 6}%)`; g.fillRect(...r); });
  by('cover', (c, r) => { g.fillStyle = c.y1 > 3 ? '#86c086' : '#5f8a5f'; g.fillRect(...r); });
  for (const c of colliders) {
    if (c.tag !== 'mezzW' && c.tag !== 'mezzE') continue;
    const r = R(c.x0, c.z0, c.x1, c.z1);
    if (c.y1 < 5.5) { g.fillStyle = 'rgba(106,120,255,0.45)'; g.fillRect(...r); g.strokeStyle = '#9aa6ff'; g.lineWidth = 1.5; g.strokeRect(...r); }
    else { g.fillStyle = '#c9d0ff'; g.fillRect(...r); }                       // broken railing
  }
  for (const side of collapsedSides) {
    g.setLineDash([4, 3]); g.strokeStyle = '#ff5a3c'; g.lineWidth = 1.5;
    g.strokeRect(...(side === 'W' ? R(-15, 9, 0, 15) : R(0, 9, 15, 15))); g.setLineDash([]);
    label('COLLAPSED', side === 'W' ? -7.5 : 7.5, 12, big ? 9 : 6, '#ff8a70');
  }
  by('wall', (c, r) => { g.fillStyle = '#0d0e13'; g.fillRect(...r); g.strokeStyle = '#a7adc8'; g.lineWidth = 1; g.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1); });

const MANTLE_HEIGHT = 2.2;    // ledges/short walls up to this tall can be climbed with one jump
// Mantle / auto-climb: jumping toward a ledge too tall to just walk up (but short enough to vault)
// automatically spends your air-boost to finish the climb, same trick the bots already use to get
// up the scaffold. So a scaffold-style stair run is one jump instead of a jump per tread, and
// jumping at any short wall or crate now actually gets you over it.
function updateMantle(b) {
  const f = forwardVec();
  const ax = b.pos.x + f.x * 0.55, az = b.pos.z + f.z * 0.55;
  if (b.onGround) {
    b.mantleReady = blockedAt(ax, az, b.pos.y) && groundAt(ax, az, b.pos.y + MANTLE_HEIGHT) > b.pos.y + STEP;
  } else if (b.mantleReady && b.vel.y < 1 && b.airBoosts > 0 && blockedAt(ax, az, b.pos.y)) {
    b.airBoosts--; b.vel.y = Math.max(b.vel.y, BOOST); b.mantleReady = false;
  }
}

function updatePlayer(dt) {
  if (player.dead) { player.vel.set(0, 0, 0); return; }
  if (blockedAt(player.pos.x, player.pos.z, player.pos.y)) unstick(player);
  // Slide-cancel: jumping out of a slide keeps the slide's speed and launches it into the
  // air-strafe system above, instead of snapping back down to walk speed.
  let slideJumpCancel = false;
  if (player.isSliding && keys['Space'] && player.onGround) {
    slideJumpCancel = true; player.isSliding = false; player.slideCooldown = SLIDE_COOLDOWN;
  }
  // Horizontal velocity: normal walking, a committed slide burst, or (mid-air) strafing
  if (!slideJumpCancel) applyHorizontal(player, wishDir(), SPEED * curW.speed * (1 - 0.25 * adsT) * (gameTime < adrenUntil ? 1.15 : 1), dt);
  updateMantle(player);
  integrate(player, dt, keys['Space']);
  player.lean += ((keys['KeyQ'] ? -1 : keys['KeyE'] ? 1 : 0) - player.lean) * Math.min(1, dt * 8);
  if (player.pos.y < -9) respawn(player.team);       // can't happen on a sealed map, but never leave anyone falling forever
}

  renderer.clear();

  if (gun.visible) { renderer.clearDepth(); renderer.render(vmScene, vmCam); }   // viewmodel on top, never clipping into walls
}
animate();
</script>
