<script type="module">
import * as THREE from 'three';

/* ============================================================
   FIRETEAM ZERO — ATRIUM (geometry blockout)

   The whole map is solid boxes plus ONE big "ground" block with the
   tunnel / ramps / scaffold bays carved out of it. Everything walkable
   is physically connected and everything else is solid, so there are no
   floating floor islands to fall between and no open edges to walk off.

   Top-down (X = west/east, Z = north/south; team A left, team B right):

     z=+15  spawnA | A-stairs lane > A-STAIRS ^ MEZZANINE (y=5) ^ B-STAIRS < lane | spawnB
                     (solid mass)          MID room, open to the sky
     z=  0  spawnA = A-LONG = A-CHOKE ======== MID ======== B-CHOKE = B-LONG = spawnB
                     (solid mass)     scaffold bays (jump-climb up from the tunnel)
     z=-15  ramp v ======= LOWER HALL tunnel (y=-5, runs under everything) ======= v ramp
   ============================================================ */

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
scene.fog = new THREE.Fog(0x1a1a22, 40, 130);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);                                   // in the scene so the gun (a camera child) renders

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(20, 60, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 40, bottom: -40, far: 200 });
scene.add(sun);

// ---------- Materials (color-coded by function) ----------
const M = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const matFloor = M(0x6a6a7c), matWall = M(0x54545f, 0.95), matChoke = M(0x6e5a48);
const matCover = M(0x4a5a4a), matMezz = M(0x4a4a6a, 0.85), matScaffold = M(0xaa6633, 0.7);
const matEscalator = M(0x777788, 0.6, 0.3), matBeam = M(0xcc4433, 0.6);
const matSpawnA = M(0x3355aa), matSpawnB = M(0xaa3333);
// Every solid gets a tag from its material so the map diagram can draw the real geometry
const MAT_TAG = new Map([[matWall, 'wall'], [matChoke, 'choke'], [matCover, 'cover'], [matFloor, 'floor'], [matScaffold, 'scaffold'], [matEscalator, 'escalator']]);

// ---------- Solid world ----------
const colliders = [];       // { x0,y0,z0,x1,y1,z1, mesh, tag }
const WALL_H = 12;          // tall enough that nobody can jump out of the map

function addSolid(x0, y0, z0, x1, y1, z1, mat, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = opts.shadow !== false;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const c = { x0, y0, z0, x1, y1, z1, mesh, tag: opts.tag || MAT_TAG.get(mat) || (mat === matMezz ? 'stairs' : null) };
  if (opts.collide !== false) colliders.push(c);
  return c;
}

// Pieces of box `a` left over after cutting box `b` out of it.
function subtract(a, b) {
  if (b.x0 >= a.x1 || b.x1 <= a.x0 || b.y0 >= a.y1 || b.y1 <= a.y0 || b.z0 >= a.z1 || b.z1 <= a.z0) return [a];
  const out = [], r = { ...a };
  if (b.x0 > r.x0) { out.push({ ...r, x1: b.x0 }); r.x0 = b.x0; }
  if (b.x1 < r.x1) { out.push({ ...r, x0: b.x1 }); r.x1 = b.x1; }
  if (b.y0 > r.y0) { out.push({ ...r, y1: b.y0 }); r.y0 = b.y0; }
  if (b.y1 < r.y1) { out.push({ ...r, y0: b.y1 }); r.y1 = b.y1; }
  if (b.z0 > r.z0) { out.push({ ...r, z1: b.z0 }); r.z0 = b.z0; }
  if (b.z1 < r.z1) { out.push({ ...r, z0: b.z1 }); r.z1 = b.z1; }
  return out;
}

// ---------- THE GROUND: one solid block, lower areas carved out ----------
let ground = [{ x0: -54, y0: -6, z0: -15, x1: 54, y1: 0, z1: 15 }];
const cuts = [
  { x0: -42, x1: 42, z0: -15, z1: -9, y0: -5, y1: -1 },   // Lower Hall tunnel (4m headroom; main floor is its ceiling)
  { x0: -52, x1: -42, z0: -15, z1: -9, y0: -5, y1: 0 },   // A connector ramp pit (open to the spawn room above)
  { x0: 42, x1: 52, z0: -15, z1: -9, y0: -5, y1: 0 },     // B connector ramp pit
  { x0: -10, x1: -5, z0: -9, z1: -3, y0: -5, y1: 0 },     // west scaffold bay (tunnel -> Mid)
  { x0: 5, x1: 10, z0: -9, z1: -3, y0: -5, y1: 0 },       // east scaffold bay
];
for (const cut of cuts) ground = ground.flatMap(g => subtract(g, cut));
for (const g of ground) addSolid(g.x0, g.y0, g.z0, g.x1, g.y1, g.z1, matFloor);

// ---------- Perimeter: sealed all the way round ----------
addSolid(-55, -6, -16, 55, WALL_H, -15, matWall);   // south
addSolid(-55, -6, 15, 55, WALL_H, 16, matWall);     // north
addSolid(-55, -6, -16, -54, WALL_H, 16, matWall);   // west
addSolid(54, -6, -16, 55, WALL_H, 16, matWall);     // east

// ---------- Connector ramps down into the Lower Hall (0.5m treads = walkable) ----------
for (let i = 0; i < 9; i++) {
  addSolid(-52 + i, -5, -15, -51 + i, -0.5 * (i + 1), -9, matFloor, { tag: 'ramp' });
  addSolid(51 - i, -5, -15, 52 - i, -0.5 * (i + 1), -9, matFloor, { tag: 'ramp' });
}

// ---------- Scaffold bays: 6 treads of ~0.83m — you have to JUMP each one ----------
function bay(xa, xb) {
  for (let j = 0; j < 6; j++) addSolid(xa, -5, -9 + j, xb, -5 + (5 / 6) * (j + 1), -8 + j, matScaffold);
}
bay(-10, -5);
bay(5, 10);

// ---------- One team's side, written for A (negative X) and mirrored for B ----------
function buildSide(sgn) {
  const S = (x0, z0, x1, z1, y0, y1, mat, o) => {
    const [a, b] = sgn === -1 ? [x0, x1] : [-x1, -x0];
    return addSolid(a, y0, z0, b, y1, z1, mat, o);
  };
  // Wall between spawn room and the lanes. Doors: Long z[-3,3], Stairs z[9,15]
  S(-42, -15, -41, -3, 0, WALL_H, matWall);
  S(-42, 3, -41, 9, 0, WALL_H, matWall);
  // Solid masses that carve out the lanes
  S(-41, -15, -15, -3, 0, WALL_H, matWall);   // south of Long
  S(-41, 3, -15, 9, 0, WALL_H, matWall);      // between Long and the Stairs lane
  // Choke: 3m doorway at the end of Long
  S(-19, -3, -15, -1.5, 0, WALL_H, matChoke);
  S(-19, 1.5, -15, 3, 0, WALL_H, matChoke);
  // Hard cover just inside Mid, off the main sightline
  S(-12.5, 1.2, -11, 2.8, 0, 1.2, matCover);
  // Stairs up to the Mezzanine: 10 treads, 0.5m rise each (auto step-up)
  for (let i = 0; i < 10; i++) S(-27 + 1.2 * i, 9, -27 + 1.2 * (i + 1), 15, 0, 0.5 * (i + 1), matMezz);
  // Spawn room cover
  S(-50, 8, -48, 10, 0, 1.2, matCover);
  S(-47, -7, -45, -5, 0, 1.2, matCover);
  // Team-colored spawn pad (visual only)
  const [pa, pb] = sgn === -1 ? [-52, -44] : [44, 52];
  addSolid(pa, 0, -4, pb, 0.03, 4, sgn === -1 ? matSpawnA : matSpawnB, { collide: false, shadow: false });
}
buildSide(-1);
buildSide(1);

// Deliberate asymmetry: B-Long gets one extra low crate that A-Long doesn't have
addSolid(30, 0, 1.5, 32, 1.2, 3, matCover);

// ---------- MID ----------
addSolid(-1, 0, 3, 1, 5, 5, matCover);                    // central pillar
addSolid(-8, 0, 1, -5, 1.2, 2, matCover);                 // low covers
addSolid(6, 0, 1, 9, 1.2, 2, matCover);
addSolid(-2, 0, -8, 2, 1.2, -6.8, matCover);
for (let k = 0; k < 10; k++) addSolid(2, 0, -1 + k, 5, 0.5 * (k + 1), k, matEscalator);   // dead escalator -> Mezzanine

// ---------- MEZZANINE (two halves, each held up by a shootable red support beam) ----------
addSolid(-15, 4.4, 9, 0, 5.0, 15, matMezz, { tag: 'mezzW' });
addSolid(0, 4.4, 9, 15, 5.0, 15, matMezz, { tag: 'mezzE' });
addSolid(-8.4, 0, 11.6, -7.6, 4.4, 12.4, matBeam, { tag: 'beamW' });
addSolid(7.6, 0, 11.6, 8.4, 4.4, 12.4, matBeam, { tag: 'beamE' });
for (const [a, b] of [[-15, -9], [-7, -2], [6, 10], [12, 15]]) {      // broken railing: partial cover only
  addSolid(a, 5, 9, b, 5.9, 9.4, matMezz, { tag: a < 0 ? 'mezzW' : 'mezzE' });
}

// ======================================================
// PLAYER + PHYSICS
//   player.pos is the FEET position. Walls block; floors/steps up to
//   STEP high are walked up automatically; anything taller needs a jump.
// ======================================================
const HEIGHT = 1.8, EYE = 1.65, RADIUS = 0.35, STEP = 0.6;
const SPEED = 7, GRAVITY = -24, JUMP = 8.6, BOOST = 7.5;
const SLIDE_SPEED = 13, SLIDE_TIME = 0.55, SLIDE_COOLDOWN = 0.5;
const PITCH_MAX = Math.PI / 2 - 0.05;

// ---- combat tuning (medium TTK: 5 body shots / 3 headshots with the rifle) ----
const MAX_HP = 100, BODY_DMG = 24, HEAD_MULT = 2, LEG_MULT = 0.75, FALLOFF_START = 25;
const MAG = 30, RELOAD_TIME = 2.0, RESPAWN_TIME = 3.5, SPAWN_PROT = 1.5;
const SCORE_LIMIT = 40, MATCH_TIME = 480;
const START_MODE = location.hash.includes('roam') ? 'roam' : 'tdm';
const tagLive = { mezzW: true, mezzE: true };          // which Mezzanine halves are still standing
const match = { mode: START_MODE, started: false, over: false, score: { A: 0, B: 0 }, timeLeft: MATCH_TIME };
let diffKey = 'normal';
let gameTime = 0;                                      // seconds of un-paused match time (the bots' clock)

const SPAWNS = {
  A: [[-50, 0], [-48, 3], [-50, 6], [-47, -2], [-52, -3], [-45, 5], [-51, 3], [-45, -3]],
  B: [[50, 0], [48, 3], [50, 6], [47, -2], [52, -3], [45, 5], [51, 3], [45, -3]],
};

const player = {
  name: 'You', team: 'A', isPlayer: true,
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, onGround: false, airBoosts: 1,
  isSliding: false, slideTimer: 0, slideCooldown: 0, slideDir: new THREE.Vector3(0, 0, -1),
  lean: 0,
  hp: MAX_HP, dead: false, kills: 0, deaths: 0, spawnProt: 0, respawnT: 0, lastHurt: -1e9, lastAttacker: null, lastShotT: -1e9,
};

function placeAt(a, x, z, team) {
  a.pos.set(x, 0, z);
  a.vel.set(0, 0, 0);
  // Always spawn facing the Long door (never staring at a wall)
  const doorX = team === 'A' ? -41.5 : 41.5;
  a.yaw = Math.atan2(-(doorX - x), -(0 - z));
  a.pitch = 0;
  a.isSliding = false; a.onGround = true; a.airBoosts = 1;
  a.hp = MAX_HP; a.dead = false;
}
function respawn(team = 'A') {
  const [x, z] = SPAWNS[team][Math.floor(Math.random() * SPAWNS[team].length)];
  placeAt(player, x, z, team);
}
respawn('A');

const forwardVec = () => new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
const rightVec = () => new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

const overlapsXZ = (c, x, z) => x + RADIUS > c.x0 && x - RADIUS < c.x1 && z + RADIUS > c.z0 && z - RADIUS < c.z1;

// Would standing at (x,z) with feet at `feet` put us inside a wall?
function blockedAt(x, z, feet) {
  const lo = feet + STEP, hi = feet + HEIGHT;
  for (const c of colliders) if (c.y1 > lo && c.y0 < hi && overlapsXZ(c, x, z)) return true;
  return false;
}
// Highest surface under (x,z) that is no higher than maxTop.
function groundAt(x, z, maxTop) {
  let best = -Infinity;

function wishDir() {

// Tiny synthesized gunshot (no audio files needed)
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* no audio — the game still works */ }
}
let shotBuf = null;
function playShot(vol = 1, pan = 0, low = false) {
  if (!audioCtx || vol < 0.02) return;
  try {
    const t = audioCtx.currentTime, len = 0.09;
    if (!shotBuf) {
      shotBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * len), audioCtx.sampleRate);
      const d = shotBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    const out = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
    if (out.pan) out.pan.value = Math.max(-1, Math.min(1, pan));
    out.connect(audioCtx.destination);

    const filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = low ? 900 : 1800; filt.Q.value = 0.7;
    const gain = audioCtx.createGain(); gain.gain.value = 0.22 * vol;

    og.gain.setValueAtTime(0.3 * vol, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(og); og.connect(out); o.start(t); o.stop(t + 0.1);
  } catch (e) { /* ignore */ }
}
function playTone(freq, dur, vol = 0.15, type = 'square', freq2 = null) {   // hit tick / kill ding / hurt thud
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

}

// ---- player weapon: magazine, reload, spread (first shot accurate, moving/jumping/spraying is not), recoil ----
let ammo = MAG, reloadT = 0, spray = 0, recoilPitch = 0, recoilYaw = 0;
function startReload() { if (reloadT <= 0 && ammo < MAG && !player.dead) reloadT = RELOAD_TIME; }
function playerSpread() {
  const hv = Math.hypot(player.vel.x, player.vel.z);
  return 0.0015 + Math.min(1, hv / SPEED) * 0.016 + (player.onGround ? 0 : 0.035) + (player.isSliding ? 0.01 : 0) + Math.min(spray, 10) * 0.0022;
}

function fireShot() {
  if (blockerVisible() || player.dead || reloadT > 0) return;
  if (ammo <= 0) { startReload(); return; }
  ammo--;
  camera.updateMatrixWorld(true);
  camera.getWorldDirection(_dir);
  const sp = playerSpread();
  _dir.x += (Math.random() * 2 - 1) * sp; _dir.y += (Math.random() * 2 - 1) * sp; _dir.z += (Math.random() * 2 - 1) * sp;
  _dir.normalize();

  raycaster.set(camera.position, _dir);
  raycaster.far = SHOT_RANGE;
  const hit = raycaster.intersectObjects(colliders.map(c => c.mesh), false)[0];
  const wallT = hit ? hit.distance : SHOT_RANGE;
  const ah = match.mode === 'tdm' && match.started ? actorHit(player, camera.position, _dir, wallT) : null;
  const end = camera.position.clone().addScaledVector(_dir, ah ? ah.t : wallT);
  muzzle.getWorldPosition(_v);
  addTracer(_v, end);
  if (ah) addSpark(end, 0xff3b3b); else if (hit) addSpark(hit.point);
  stats.shots++;
  gunKick = 1; flashT = 0.05; playShot();

  heardShot(player);
  if (ah) {
    const res = applyDamage(ah.actor, shotDamage(ah.part, ah.t), player, ah.part);
    if (res) showHitmark(res === 'kill' ? '#ff4040' : ah.part === 'head' ? '#ffb020' : '#ffffff', res === 'kill');
  } else if (hit) {
    const c = colliders.find(c => c.mesh === hit.object);
    if (c && c.tag && c.tag.startsWith('beam')) {

    }

}

// MAP DIAGRAM — live top-down plan + side-view height strip. M cycles large -> small -> off.

const mapCanvas = document.getElementById('map');
const mctx = mapCanvas.getContext('2d');

const Y_TOP = 7, Y_BOT = -6;                              // side-view height range

let mapMode = START_MODE === 'roam' ? 1 : 2, mapDirty = true, ML = null;   // free roam opens with the big map; TDM with the small one

function layoutMap() {

  const big = mapMode === 1;

  const sideH = big ? Math.round((Y_TOP - Y_BOT) * sy) : 0;

const mz = (z) => ML.head + (WB.z1 - z) * ML.s;           // +Z is up on the map
const my = (y) => ML.sideTop + (Y_TOP - y) * ML.sy;

  const { dpr, big, W, H, s, head, planH, sideTop, sideH } = ML;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(10,12,18,0.86)'; g.fillRect(0, 0, W, H);                  // panel background (slightly see-through)
  const R = (x0, z0, x1, z1) => [mx(x0), mz(z1), (x1 - x0) * s, (z1 - z0) * s];
  const font = (px) => `bold ${px}px ui-monospace, Menlo, Consolas, monospace`;
  const label = (txt, x, z, px = big ? 10 : 7, color = '#fff') => {
    g.font = font(px); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 3; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,0.8)'; g.strokeText(txt, mx(x), mz(z));
    g.fillStyle = color; g.fillText(txt, mx(x), mz(z));
  };
  const by = (tag, fn) => { for (const c of colliders) if (c.tag === tag) fn(c, R(c.x0, c.z0, c.x1, c.z1)); };

  // header: title + legend
  g.fillStyle = '#e8eaf5'; g.font = font(big ? 12 : 9); g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('ATRIUM · LIVE MAP', 8, head / 2);
  if (big && W >= 700) {
    let lx = 168;
    for (const [name, fill, stroke] of [['wall', '#0d0e13', '#a7adc8'], ['cover', '#5f8a5f'], ['stairs', '#4a5db0'],
      ['mezzanine', 'rgba(106,120,255,0.55)', '#9aa6ff'], ['lower hall', 'rgba(47,209,200,0.55)', '#2fd1c8'],
      ['climb', '#ff963c'], ['shoot', '#ff5a3c']]) {
      g.fillStyle = fill; g.fillRect(lx, head / 2 - 5, 10, 10);
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.strokeRect(lx + 0.5, head / 2 - 4.5, 9, 9); }
      g.font = font(10); g.textAlign = 'left'; g.fillStyle = '#b9bdd0'; g.fillText(name, lx + 14, head / 2);
      lx += 14 + g.measureText(name).width + 14;
    }
  }

  // plan: floor, spawn pads, stairs/escalator, cover, mezzanine, walls, then the Lower Hall shown through the floor
  g.fillStyle = '#12141b'; g.fillRect(0, head, W, planH);
  g.fillStyle = '#4a4d5e'; g.fillRect(...R(-54, -15, 54, 15));
  g.fillStyle = 'rgba(70,110,230,0.55)'; g.fillRect(...R(-52, -4, -44, 4));
  g.fillStyle = 'rgba(230,70,70,0.55)'; g.fillRect(...R(44, -4, 52, 4));
  by('stairs', (c, r) => { g.fillStyle = `hsl(228,45%,${28 + c.y1 * 7}%)`; g.fillRect(...r); });
  by('escalator', (c, r) => { g.fillStyle = `hsl(220,12%,${34 + c.y1 * 6}%)`; g.fillRect(...r); });
  by('cover', (c, r) => { g.fillStyle = c.y1 > 3 ? '#86c086' : '#5f8a5f'; g.fillRect(...r); });
  for (const c of colliders) {
    if (c.tag !== 'mezzW' && c.tag !== 'mezzE') continue;
    const r = R(c.x0, c.z0, c.x1, c.z1);
    if (c.y1 < 5.5) { g.fillStyle = 'rgba(106,120,255,0.45)'; g.fillRect(...r); g.strokeStyle = '#9aa6ff'; g.lineWidth = 1.5; g.strokeRect(...r); }
    else { g.fillStyle = '#c9d0ff'; g.fillRect(...r); }                       // broken railing
  }
  for (const side of collapsedSides) {
    g.setLineDash([4, 3]); g.strokeStyle = '#ff5a3c'; g.lineWidth = 1.5;
    g.strokeRect(...(side === 'W' ? R(-15, 9, 0, 15) : R(0, 9, 15, 15))); g.setLineDash([]);
    label('COLLAPSED', side === 'W' ? -7.5 : 7.5, 12, big ? 9 : 6, '#ff8a70');
  }
  by('wall', (c, r) => { g.fillStyle = '#0d0e13'; g.fillRect(...r); g.strokeStyle = '#a7adc8'; g.lineWidth = 1; g.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1); });
  by('choke', (c, r) => { g.fillStyle = '#8a6a48'; g.fillRect(...r); g.strokeStyle = '#d9b184'; g.lineWidth = 1; g.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1); });
  g.fillStyle = 'rgba(47,209,200,0.18)'; g.fillRect(...R(-52, -15, 52, -9));     // Lower Hall: tunnel + the two ramp pits, under the floor
  by('ramp', (c, r) => { g.fillStyle = `rgba(47,209,200,${0.25 + 0.5 * (1 + c.y1 / 5)})`; g.fillRect(...r); });   // ramps: bright = shallow, dark = deep
  by('scaffold', (c, r) => { g.fillStyle = `rgba(255,150,60,${0.3 + 0.6 * (c.y1 + 5) / 5})`; g.fillRect(...r); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; g.strokeRect(...r); });
  g.setLineDash([5, 4]); g.strokeStyle = '#2fd1c8'; g.lineWidth = 1.5; g.strokeRect(...R(-52, -15, 52, -9)); g.setLineDash([]);
  for (const c of colliders) {
    if (!c.tag || !c.tag.startsWith('beam')) continue;
    const r = R(c.x0, c.z0, c.x1, c.z1);
    g.fillStyle = '#ff5a3c'; g.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
    g.strokeStyle = '#fff'; g.lineWidth = 1; g.strokeRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
  }

  // plan labels
  const small = big ? 8 : 6;
  label('SPAWN A', -48, 0); label('SPAWN B', 48, 0);
  label('A-LONG', -30, 0); label('B-LONG', 30, 0);
  label('CHOKE', -17, 0, small); label('CHOKE', 17, 0, small);
  label('MID', 0, -3);
  label('A-STAIRS ▶', -21, 12, small); label('B-STAIRS ◀', 21, 12, small);
  label('MEZZANINE', 0, 12, big ? 9 : 6);
  label(big ? 'LOWER HALL — tunnel under the floor (y −5)' : 'LOWER HALL', 0, -12);
  label('DOWN ▶', -47, -12, small); label('◀ DOWN', 47, -12, small);
  label('CLIMB', -7.5, -6, small); label('CLIMB', 7.5, -6, small);
  label('ESC ▲', 3.5, 4, small);

  // side view: height at each x (large map only)
  if (big) {
    g.fillStyle = '#e8eaf5'; g.font = font(11); g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('SIDE VIEW · height at each x', 8, sideTop - 10);
    g.fillStyle = '#12141b'; g.fillRect(0, sideTop, W, sideH);
    const poly = (pts, fill, stroke) => {
      g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(mx(x), my(y)) : g.moveTo(mx(x), my(y))); g.closePath();
      if (fill) { g.fillStyle = fill; g.fill(); }
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
    };
    poly([[-54, 0], [54, 0], [54, -6], [-54, -6]], '#3a3d4c');                       // solid ground
    poly([[-42, -1], [42, -1], [42, -5], [-42, -5]], '#0b0c11');                     // lower hall tunnel
    poly([[-52, 0], [-42, 0], [-42, -5], [-43, -5], [-52, -0.5]], '#0b0c11');        // A ramp pit
    poly([[52, 0], [42, 0], [42, -5], [43, -5], [52, -0.5]], '#0b0c11');             // B ramp pit
    for (const bx of [-10, 5]) poly([[bx, 0], [bx + 5, 0], [bx + 5, -5], [bx, -5]], 'rgba(255,150,60,0.25)', '#ff963c');   // climb shafts
    poly([[-27, 0], [-15, 5], [-15, 0]], '#4a5db0'); poly([[27, 0], [15, 5], [15, 0]], '#4a5db0');                       // mezzanine stairs
    poly([[-1, 0], [1, 0], [1, 5], [-1, 5]], '#86c086');                                                                 // mid pillar
    for (const [side, x0, x1, bx] of [['W', -15, 0, -8], ['E', 0, 15, 8]]) {
      if (colliders.some(c => c.tag === 'mezz' + side)) {
        poly([[x0, 4.4], [x1, 4.4], [x1, 5], [x0, 5]], '#6a78ff');
        g.strokeStyle = '#ff5a3c'; g.lineWidth = 2; g.beginPath(); g.moveTo(mx(bx), my(0)); g.lineTo(mx(bx), my(4.4)); g.stroke();   // support beam
      } else {
        g.setLineDash([4, 3]); g.strokeStyle = '#ff5a3c'; g.lineWidth = 1.5; g.strokeRect(mx(x0), my(5), (x1 - x0) * s, 0.6 * ML.sy); g.setLineDash([]);
      }
    }
    g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 1.5;                                                          // main floor line (gaps = ramp pits + climb shafts)
    for (const [a, b] of [[-54, -52], [-42, -10], [-5, 5], [10, 42], [52, 54]]) { g.beginPath(); g.moveTo(mx(a), my(0)); g.lineTo(mx(b), my(0)); g.stroke(); }
    g.font = font(9); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#9aa0b8';
    for (const [y, t] of [[5, 'y 5  mezzanine'], [0, 'y 0  main floor'], [-5, 'y −5  lower hall']]) g.fillText(t, 6, my(y) - 4);
  }
}

function drawMap() {
  if (!mapMode) return;
  if (mapDirty) { drawStaticMap(); mapDirty = false; }
  const { dpr, big, s } = ML;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
  mctx.drawImage(staticMap, 0, 0);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // teammates always; enemies only while someone on your team can see them (radar-style)
  if (match.started && match.mode === 'tdm') {
    const rr = big ? 4 : 3;
    for (const b of bots) {
      const ally = b.team === player.team;
      if (!ally && (b.dead || gameTime - b.spottedT > 1.2)) continue;
      const bx = mx(b.pos.x), bz = mz(b.pos.z);
      if (b.dead) {
        mctx.strokeStyle = '#7fa9ff'; mctx.lineWidth = 2; mctx.beginPath();
        mctx.moveTo(bx - rr, bz - rr); mctx.lineTo(bx + rr, bz + rr); mctx.moveTo(bx + rr, bz - rr); mctx.lineTo(bx - rr, bz + rr); mctx.stroke();
        continue;
      }
      mctx.fillStyle = ally ? '#5b8cff' : '#ff4545'; mctx.strokeStyle = b.pos.y > 4 ? '#c9d0ff' : b.pos.y < -2 ? '#2fd1c8' : '#000'; mctx.lineWidth = 1.5;
      mctx.beginPath(); mctx.arc(bx, bz, rr, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
      if (big) { mctx.beginPath(); mctx.arc(bx, my(b.pos.y + 0.9), 3, 0, Math.PI * 2); mctx.fill(); }
    }
  }

  const y = player.pos.y;
  const lvl = y < -2 ? ['LOWER HALL', '47,209,200'] : y > 4 ? ['MEZZANINE', '143,155,255'] : ['MAIN FLOOR', '255,210,77'];
  const col = `rgb(${lvl[1]})`;
  const px = mx(player.pos.x), pz = mz(player.pos.z);
  const ax = -Math.sin(player.yaw), ay = Math.cos(player.yaw);                 // facing, in map space (+Z is up)
  const half = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect), ang = Math.atan2(ay, ax);
  mctx.beginPath(); mctx.moveTo(px, pz); mctx.arc(px, pz, 15 * s, ang - half, ang + half); mctx.closePath();
  mctx.fillStyle = `rgba(${lvl[1]},0.22)`; mctx.fill();                       // what you can currently see
  const r = big ? 5 : 4;
  mctx.strokeStyle = col; mctx.lineWidth = 2; mctx.beginPath(); mctx.moveTo(px, pz); mctx.lineTo(px + ax * r * 3, pz + ay * r * 3); mctx.stroke();
  mctx.fillStyle = col; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.arc(px, pz, r, 0, Math.PI * 2); mctx.fill(); mctx.stroke();

  mctx.font = `bold ${big ? 11 : 8}px ui-monospace, Menlo, Consolas, monospace`; mctx.textAlign = 'right'; mctx.textBaseline = 'middle';
  const t = `${lvl[0]} · y ${y.toFixed(1)}`;
  mctx.lineWidth = 3; mctx.lineJoin = 'round'; mctx.strokeStyle = 'rgba(0,0,0,0.8)'; mctx.strokeText(t, ML.W - 8, ML.head + 11);
  mctx.fillStyle = col; mctx.fillText(t, ML.W - 8, ML.head + 11);
  if (big) {
    mctx.fillStyle = col; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
    mctx.beginPath(); mctx.arc(px, my(y + 0.9), 4, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
  }
}

// ======================================================
// FRAME UPDATE
// ======================================================
function updatePlayer(dt) {
  if (player.dead) { player.vel.set(0, 0, 0); return; }
  if (blockedAt(player.pos.x, player.pos.z, player.pos.y)) unstick(player);
  // Horizontal velocity: normal walking, or a committed slide burst
  applyHorizontal(player, wishDir(), SPEED, dt);
  integrate(player, dt, keys['Space']);
  player.lean += ((keys['KeyQ'] ? -1 : keys['KeyE'] ? 1 : 0) - player.lean) * Math.min(1, dt * 8);
  if (player.pos.y < -9) respawn(player.team);       // can't happen on a sealed map, but never leave anyone falling forever
}

let deathYaw = 0;
function updateCamera() {
  if (player.dead) {                                  // death cam: on the floor, turned toward whoever got you
    gun.visible = false;
    camera.position.set(player.pos.x, player.pos.y + 0.55, player.pos.z);
    camera.rotation.set(0.05, deathYaw, 0.35);
    return;
  }
  gun.visible = true;
  const r = rightVec();
  camera.position.set(
    player.pos.x + r.x * player.lean * 0.4,
    player.pos.y + (player.isSliding ? 0.95 : EYE),
    player.pos.z + r.z * player.lean * 0.4
  );
  camera.rotation.set(Math.min(PITCH_MAX, player.pitch + recoilPitch), player.yaw + recoilYaw, -player.lean * 0.12);
}

function zoneName(x, y, z) {
  const side = x < 0 ? 'A' : 'B', ax = Math.abs(x);
  if (z < -3 && z > -9 && ax >= 5 && ax <= 10 && y < -0.2) return 'SCAFFOLD';
  if (y < -2) return ax > 42 ? side + '-CONNECTOR' : 'LOWER HALL';
  if (y > 4.2) return ax <= 15 ? 'MEZZANINE' : side + '-STAIRS';
  if (ax >= 42) return 'TEAM ' + side + ' SPAWN';
  if (z > 9 && ax >= 15) return side + '-STAIRS';
  if (ax >= 27) return side + '-LONG';
  if (ax >= 15) return side + '-CHOKE';
  return 'MID';
}

const posEl = document.getElementById('pos'), calloutEl = document.getElementById('callout');
const beamPromptEl = document.getElementById('beam-prompt'), slideEl = document.getElementById('slide-status');
function updateHud(frame) {
  posEl.textContent = `pos: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}`;
  calloutEl.textContent = zoneName(player.pos.x, player.pos.y, player.pos.z);
  slideEl.style.opacity = player.isSliding ? '1' : '0';
  if (frame % 6 === 0) beamPromptEl.style.display = aimedBeam(12) ? 'block' : 'none';
}

//   Bots walk a hand-placed waypoint graph of Atrium, see you only with real line of sight,

// ======================================================
const DIFFS = {
  easy:   { react: 0.6,  err: 0.06,  turn: 3.5, fov: 100, burst: [2, 4], pause: [0.4, 0.75], head: 0.05, speed: 0.75 },
  normal: { react: 0.4,  err: 0.04,  turn: 5.5, fov: 120, burst: [3, 6], pause: [0.25, 0.5], head: 0.15, speed: 0.85 },
  hard:   { react: 0.24, err: 0.028, turn: 8.5, fov: 140, burst: [4, 8], pause: [0.15, 0.35], head: 0.3, speed: 0.95 },
};
const BOT_EYE = 1.55;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = ([a, b]) => Math.floor(rand(a, b + 1));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.max(-2.5, Math.min(2.5, Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v))); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const yawTo = (dx, dz) => Math.atan2(-dx, -dz);       // same convention as the camera: forward = (-sin yaw, -cos yaw)

// ---------- ray tests (fast slab tests, no three.js objects) ----------
function rayBox(ox, oy, oz, dx, dy, dz, x0, y0, z0, x1, y1, z1) {
  let tmin = 0, tmax = Infinity;
  for (const [o, d, a, b] of [[ox, dx, x0, x1], [oy, dy, y0, y1], [oz, dz, z0, z1]]) {
    if (Math.abs(d) < 1e-9) { if (o < a || o > b) return Infinity; continue; }
    let t1 = (a - o) / d, t2 = (b - o) / d;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    if (t1 > tmin) tmin = t1;
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
function rayWorld(o, d, maxT) {
  let best = maxT;
  for (const c of colliders) {
    const t = rayBox(o.x, o.y, o.z, d.x, d.y, d.z, c.x0, c.y0, c.z0, c.x1, c.y1, c.z1);
    if (t < best) best = t;
  }
  return best;
}
// Hit boxes: head / body / legs (lower while sliding)
function hitboxes(a) {
  const x = a.pos.x, y = a.pos.y, z = a.pos.z, k = a.isSliding ? 0.58 : 1;
  return [
    ['head', x - 0.16, y + 1.47 * k, z - 0.16, x + 0.16, y + 1.79 * k, z + 0.16],
    ['body', x - 0.3, y + 0.78 * k, z - 0.3, x + 0.3, y + 1.47 * k, z + 0.3],
    ['leg', x - 0.24, y, z - 0.24, x + 0.24, y + 0.78 * k, z + 0.24],
  ];
}
function actorHit(shooter, o, d, maxT) {
  let best = null;
  for (const a of activeActors()) {
    if (a === shooter || a.dead || a.ghost || a.team === shooter.team) continue;
    for (const [part, ...b] of hitboxes(a)) {
      const t = rayBox(o.x, o.y, o.z, d.x, d.y, d.z, ...b);
      if (t < maxT && (!best || t < best.t)) best = { actor: a, part, t };
    }
  }
  return best;
}
function shotDamage(part, dist) {
  const base = BODY_DMG * (part === 'head' ? HEAD_MULT : part === 'leg' ? LEG_MULT : 1);
  return Math.round(base * (dist > FALLOFF_START ? 0.85 : 1));
}
const eyeOf = (a) => new THREE.Vector3(a.pos.x, a.pos.y + (a.isPlayer ? (a.isSliding ? 0.95 : EYE) : BOT_EYE), a.pos.z);
function canSee(from, a) {
  const o = eyeOf(from);
  for (const h of [a.isSliding ? 0.85 : 1.6, a.isSliding ? 0.5 : 1.1]) {
    const d = new THREE.Vector3(a.pos.x - o.x, a.pos.y + h - o.y, a.pos.z - o.z), len = d.length();
    d.divideScalar(len);
    if (rayWorld(o, d, len) >= len - 0.05) return true;
  }
  return false;
}

// ---------- waypoint graph of Atrium ----------
const NAV = [], NAVI = {};
function N(id, x, y, z, o = {}) { NAVI[id] = NAV.length; NAV.push({ id, x, y, z, links: [], req: o.req || null, w: o.w || 0, hold: !!o.hold }); }
function L(a, b, o = {}) {
  NAV[NAVI[a]].links.push({ to: NAVI[b], cond: o.cond, climb: o.climb });
  if (!o.oneWay) NAV[NAVI[b]].links.push({ to: NAVI[a], cond: o.cond, climb: o.climb });
}

  n('tun', -25, -5, -12, { w: 1, hold: 1 }); n('bayBot', -7.5, -5, -12, { w: 1 }); n('bayTop', -7.5, 0, -2, { w: 1.5, hold: 1 });
  n('spawnN', -46, 0, 12); n('stairsDoor', -41.5, 0, 12); n('stairsBase', -29, 0, 12, { w: 1, hold: 1 });
  n('stairsTop', -15.6, 5, 12, { w: 1, hold: 1 }); n('mezz', -8, 5, 12, { w: 2, req: mezz, hold: 1 });
  const dropX = s === 'A' ? -8 : 11;                   // a gap in that side's broken railing
  N(s + 'mezzEdge', dropX, 5, 10, { req: mezz }); N(s + 'dropLand', dropX, 0, 6.5);
  n('underMezz', -11, 0, 12, { w: 1, hold: 1 });
  n('longDoor', -41.5, 0, 0); n('long', -30, 0, 0, { w: 1, hold: 1 }); n('choke', -17, 0, 0, { w: 1.5, hold: 1 });
  n('midSide', -12, 0, -1, { w: 2 }); n('midN', -8, 0, 6, { w: 1 });
}
N('midC', 0, 0, -2.5, { w: 2.5, hold: 1 }); N('midS', 0, 0, -5, { w: 1 }); N('escBot', 3.5, 0, -2.5, { w: 1 });
N('escTop', 3.5, 5, 10, { w: 1.5, req: 'mezzE', hold: 1 }); N('tunC', 0, -5, -12, { w: 1.5, hold: 1 });
for (const s of ['A', 'B']) {

    const hunting = b.huntPos && gameTime - b.huntT < 6;
    if (hunting && !b.huntGoal) { planTo(b, nearestNode(b.huntPos, false)); b.huntGoal = true; b.holdT = 0; }
    if (!b.path) planTo(b, b.goal >= 0 && navValid(b.goal) && Math.random() < 0.5 ? b.goal : pickGoal(b));
    if (b.pi >= b.path.length) {
      if (b.holdT > 0) { b.holdT -= dt; lookYaw = b.holdYaw; }
      else {
        if (hunting) { b.huntPos = null; }
        planTo(b, pickGoal(b));
      }
    }
    if (b.pi < b.path.length) {
      const n = NAV[b.path[b.pi]];
      const dx = n.x - b.pos.x, dz = n.z - b.pos.z, hd = Math.hypot(dx, dz);
      if (hd < 0.8 && Math.abs(n.y - b.pos.y) < 1.6) {
        b.pi++;
        if (b.pi >= b.path.length) {
          b.holdT = n.hold && !hunting ? rand(0.8, 2.6) : 0;
          // hold the angle the enemy is most likely to come from
          const toward = b.team === 'A' ? 1 : -1;
          let best = null;
          for (const e of n.links) { const m = NAV[e.to]; if (!best || toward * m.x > toward * best.x) best = m; }
          b.holdYaw = best ? yawTo(best.x - n.x, best.z - n.z) : yawTo(toward, 0);
          if (hunting) b.huntPos = null;
        }
      } else {
        _w.set(dx / hd, 0, dz / hd); pathing = true;
        lookYaw = yawTo(dx, dz);
        if (hunting && b.huntPos) {                         // pre-aim where the enemy was last heard / seen
          const hx = b.huntPos.x - b.pos.x, hz = b.huntPos.z - b.pos.z;
          if (Math.hypot(hx, hz) < 25) lookYaw = yawTo(hx, hz);
        }
        // the odd slide on a long straight run
        if (hd > 8 && b.onGround && !b.isSliding && b.slideCooldown <= 0 && Math.random() < dt * 0.25 && Math.abs(n.y - b.pos.y) < 0.5) {
          b.isSliding = true; b.slideTimer = SLIDE_TIME; b.slideDir.set(_w.x, 0, _w.z);
        }
      }
    }
  }
  // turn toward where we want to look (bots can't snap instantly)
  const dYaw = angDiff(b.yaw, lookYaw), maxTurn = D.turn * dt * (tgt ? 1 : 1.6);
  b.yaw += Math.max(-maxTurn, Math.min(maxTurn, dYaw));
  b.pitch = pitch;

  applyHorizontal(b, _w, speed, dt);
  let jump = false;
  if (b.onGround && _w.lengthSq() > 0.01) {                  // hop up anything too tall to step onto (scaffold treads)
    const ax = b.pos.x + _w.x * 0.45, az = b.pos.z + _w.z * 0.45;
    if (blockedAt(ax, az, b.pos.y) && !blockedAt(ax, az, b.pos.y + 1.0)) jump = true;
  }
  integrate(b, dt, jump);

  // stuck detection: hop, then re-plan, then pick somewhere else
  if (pathing) {
    b.stuckClock += dt;
    if (b.stuckClock > 0.8) {
      if (b.pos.distanceTo(b.stuckPos) < 0.5) {
        b.stuckN++;
        if (b.onGround) { b.vel.y = JUMP; b.onGround = false; }
        if (b.stuckN === 3) b.path = null;
        if (b.stuckN >= 6) { b.path = null; b.goal = pickGoal(b); b.stuckN = 0; }
      } else b.stuckN = 0;
      b.stuckPos.copy(b.pos); b.stuckClock = 0;
    }
  } else { b.stuckClock = 0; b.stuckPos.copy(b.pos); }
  if (b.pos.y < -9) spawnActor(b);
}

function syncBotMesh(b) {
  if (b.dead && !b.mesh.visible) return;
  b.mesh.position.copy(b.pos);
  b.mesh.rotation.y = b.yaw;
  if (!b.dead) b.inner.scale.y = b.isSliding ? 0.6 : 1;
}

let spotClock = 0;
function updateMatch(dt) {
  gameTime += dt;
  match.timeLeft = Math.max(0, match.timeLeft - dt);
  if (match.timeLeft <= 0) { endMatch(); return; }
  // player: respawn, spawn protection, health regen after 5s without damage
  if (player.dead) {
    player.respawnT -= dt;
    const el = document.getElementById('death-t');
    if (el) el.textContent = `respawning in ${Math.max(0, player.respawnT).toFixed(1)}`;
    if (player.respawnT <= 0) spawnActor(player);
  } else {
    player.spawnProt = Math.max(0, player.spawnProt - dt);
    if (gameTime - player.lastHurt > 5) player.hp = Math.min(MAX_HP, player.hp + 20 * dt);
  }
  for (const b of bots) {
    updateBot(b, dt);
    if (!b.dead && gameTime - b.lastHurt > 5) b.hp = Math.min(MAX_HP, b.hp + 20 * dt);
  }
  // soft push-apart so nobody stands inside anybody else
  const live = allActors.filter(a => !a.dead);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], c = live[j], dx = c.pos.x - a.pos.x, dz = c.pos.z - a.pos.z, d = Math.hypot(dx, dz);
    if (d > 0.001 && d < 0.7 && Math.abs(c.pos.y - a.pos.y) < 1.5) {
      const p = (0.7 - d) / 2, ux = dx / d * p, uz = dz / d * p;
      if (!blockedAt(a.pos.x - ux, a.pos.z - uz, a.pos.y)) { a.pos.x -= ux; a.pos.z -= uz; }
      if (!blockedAt(c.pos.x + ux, c.pos.z + uz, c.pos.y)) { c.pos.x += ux; c.pos.z += uz; }
    }
  }
  // what the player can see shows up on the radar for the team
  spotClock -= dt;
  if (spotClock <= 0 && !player.dead) {
    spotClock = 0.15;
    const half = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    for (const b of bots) {
      if (b.team === player.team || b.dead) continue;
      if (Math.abs(angDiff(player.yaw, yawTo(b.pos.x - player.pos.x, b.pos.z - player.pos.z))) < half && canSee(player, b)) {
        b.spottedT = gameTime; teamIntel[player.team].pos = b.pos.clone(); teamIntel[player.team].t = gameTime;
      }
    }
  }
  for (const d of killfeedEl.children) d.style.opacity = gameTime - d.dataset.t > 6 ? '0' : '1';
}

const sa = document.getElementById('sa'), sb = document.getElementById('sb'), clockEl = document.getElementById('clock');
const hpnumEl = document.getElementById('hpnum'), hpbarEl = document.querySelector('#hpbar i'), ammoEl = document.getElementById('ammo'), reloadEl = document.getElementById('reload');
function updateMatchHud(dt) {
  hitmarkT = Math.max(0, hitmarkT - dt); hitmarkEl.style.opacity = hitmarkT > 0 ? '1' : '0';
  hurtT = Math.max(0, hurtT - dt); dmgDirT = Math.max(0, dmgDirT - dt);
  const tdm = match.started && match.mode === 'tdm';
  document.getElementById('hud').classList.toggle('dim', tdm && match.timeLeft < MATCH_TIME - 10 && !blockerVisible());
  if (!tdm) { vignetteEl.style.opacity = '0'; dmgdirEl.style.opacity = '0'; deathEl.style.display = 'none'; protectEl.style.display = 'none'; return; }
  sa.textContent = match.score.A; sb.textContent = match.score.B;
  const s = Math.ceil(match.timeLeft); clockEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const hp = Math.max(0, Math.ceil(player.hp));
  hpnumEl.innerHTML = `${hp} <small>HP</small>`;
  hpbarEl.style.width = hp + '%'; hpbarEl.style.background = hp > 60 ? '#6fe08a' : hp > 30 ? '#ffd24d' : '#ff5a5a';
  ammoEl.innerHTML = `${ammo} <small>/ ∞</small>`;
  reloadEl.textContent = reloadT > 0 ? 'RELOADING…' : ammo <= 5 ? 'R to reload' : '';
  vignetteEl.style.opacity = String(Math.max(hurtT / 0.35 * 0.8, player.dead ? 0.5 : hp < 35 ? 0.35 : 0));
  if (dmgDirT > 0 && dmgFrom && !player.dead) {
    const dx = dmgFrom.x - player.pos.x, dz = dmgFrom.z - player.pos.z;
    const f = forwardVec(), r = rightVec();
    dmgdirEl.style.transform = `rotate(${Math.atan2(dx * r.x + dz * r.z, dx * f.x + dz * f.z)}rad)`;
    dmgdirEl.style.opacity = String(Math.min(1, dmgDirT));
  } else dmgdirEl.style.opacity = '0';
  deathEl.style.display = player.dead ? 'block' : 'none';
  protectEl.style.display = player.spawnProt > 0 && !player.dead ? 'block' : 'none';
  if (tabOpen && Math.floor(gameTime * 4) !== Math.floor((gameTime - dt) * 4)) tabEl.innerHTML = boardHTML();
}

// Test/debug hook (lets automated checks drive the real game loop)
window.__fz = {
  player, colliders, keys, step: updatePlayer, camStep: updateCamera, blockedAt, groundAt, respawn, collapse, startGame, applyLook,
  fire: fireShot, stats, effects,
  map: { mode: () => mapMode, cycle: cycleMap, draw: drawMap, layout: () => ML, xy: (x, z) => [mx(x), mz(z)] },
  teleport(x, y, z, yaw = 0) { player.pos.set(x, y, z); player.vel.set(0, 0, 0); player.yaw = yaw; player.pitch = 0; player.isSliding = false; player.onGround = false; },
  // bots / TDM
  match, bots, NAV, NAVI, findPath, nearestNode, startMatch, updateBot, updateMatch, rayWorld, canSee, applyDamage, tagLive, DIFFS,
  fx: updateEffects, setDiff: (k) => { diffKey = k; }, weapon: () => ({ ammo, reloadT, spray }), restoreMezz,
  // fast headless simulation (no rendering): runs the match for `sec` seconds of game time
  sim(sec, dt = 1 / 30) { for (let t = 0; t < sec && !match.over; t += dt) { updateMatch(dt); updateEffects(dt); } return { ...match.score }; },
};

const clock = new THREE.Clock();
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const running = !blockerVisible();
  if (!window.__fzPause) updatePlayer(dt);
  fireCooldown = Math.max(0, fireCooldown - dt);
  if (running && (mouseHeld || keys['KeyF'])) tryFire();           // auto-fire while the button is held
  if (running && !window.__fzPause && match.started && match.mode === 'tdm' && !match.over) updateMatch(dt);
  for (const b of bots) syncBotMesh(b);
  updateCamera();
  updateEffects(dt);
  updateHud(frame++);
  updateMatchHud(dt);
  drawMap();
  renderer.render(scene, camera);
}
animate();
</script>
