<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shuffleboard Club</title>
<style>
html,body{margin:0;height:100%;background:#0b0806;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W = 640, H = 960, S = 1;
function resize(){
  var dpr = window.devicePixelRatio || 1;
  S = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W*S) + 'px'; cv.style.height = (H*S) + 'px';
  cv.width = Math.round(W*S*dpr); cv.height = Math.round(H*S*dpr);
  ctx.setTransform(S*dpr, 0, 0, S*dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- table geometry & physics constants ---------- */
var R = 20, MU = 1100, VMAX = 1500, REST = 0.9;
var BX0 = 160, BX1 = 480, YTOP = 70, YBOT = 880, FOUL = 370, START_Y = 850;
var Z3 = 170, Z2 = 270;                       // zone boundaries (3 | 2 | 1), FOUL ends zone 1
var TARGET = 21, PER_SIDE = 4, PULLMAX = 210, FRAME_CAP = 8;
var COL = { a:'#d9473b', b:'#3b78d9' };

function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
function gauss(){ var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function other(s){ return s === 'a' ? 'b' : 'a'; }

/* ---------- audio (tiny synth) ---------- */
var AC = null, soundOn = true, noiseBuf = null;
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function getNoise(a){
  if (noiseBuf) return noiseBuf;
  noiseBuf = a.createBuffer(1, a.sampleRate*0.7, a.sampleRate);
  var d = noiseBuf.getChannelData(0); for (var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function burst(dur, type, freq, gain){
  var a = ac(); if (!a || !soundOn) return;
  var s = a.createBufferSource(); s.buffer = getNoise(a);
  var f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  var g = a.createGain(); g.gain.setValueAtTime(gain, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(); s.stop(a.currentTime + dur);
}
function tone(freq, to, dur, gain, type){
  var a = ac(); if (!a || !soundOn) return;
  var o = a.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime); o.frequency.exponentialRampToValueAtTime(to, a.currentTime + dur);
  var g = a.createGain(); g.gain.setValueAtTime(gain, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
var SFX = {
  clack: function(v){ var k = clamp(v/900, 0.15, 1); burst(0.06, 'highpass', 2200, 0.22*k); tone(880, 520, 0.07, 0.10*k, 'triangle'); },
  slide: function(p){ burst(0.5, 'lowpass', 500 + 900*p, 0.05 + 0.07*p); },
  fall: function(){ tone(220, 55, 0.35, 0.16, 'sine'); },
  short: function(){ tone(300, 200, 0.18, 0.07, 'square'); },
  score: function(){ tone(523, 523, 0.12, 0.10, 'triangle'); setTimeout(function(){ tone(784, 784, 0.2, 0.10, 'triangle'); }, 110); },
  cheer: function(){ burst(0.7, 'bandpass', 1200, 0.10); },
  win: function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f, f, 0.22, 0.11, 'triangle'); }, i*120); }); },
  lose: function(){ tone(330, 160, 0.6, 0.12, 'sawtooth'); }
};

/* ---------- save ---------- */
var OPPS = [
  { name:'Rookie Rae',   short:'Rae', blurb:'Safe shooter - never goes for knock-offs', top:0.50, ang:0.030, spd:0.060, style:'safe' },
  { name:'Gus the Regular', short:'Gus', blurb:'Blocker - parks guard pucks in your lane', top:0.25, ang:0.018, spd:0.035, style:'blocker' },
  { name:'Hustler Dee',  short:'Dee', blurb:'Hunter - loves knocking your pucks off', top:0.08, ang:0.010, spd:0.020, style:'hunter' },
  { name:'Champion Vic', short:'Vic', blurb:'Reads the score - attacks when behind, safe when ahead', top:0.00, ang:0.005, spd:0.011, style:'reader' }
];
var SAVE_KEY = 'shuffleboardClub.v1';
var save = { rec: OPPS.map(function(){ return [0,0]; }), frames: 0, bestHang: 0, hangs: 0 };
(function(){ try { var j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j){ if (j.rec) for (var i=0;i<OPPS.length;i++) if (j.rec[i]) save.rec[i] = j.rec[i]; save.frames = j.frames||0; save.hangs = j.hangs||0; } } catch(e){} })();
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

/* ---------- physics ---------- */
function stepSim(ps, dt, evs, anim){
  var i, j, p, q, moving = false;
  for (i=0;i<ps.length;i++){
    p = ps[i]; if (!p.alive) continue;
    var sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    if (sp > 0){
      var ns = sp - MU*dt;
      if (ns <= 0){ p.vx = 0; p.vy = 0; } else { p.vx *= ns/sp; p.vy *= ns/sp; }
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.falling){ continue; }
  }
  for (i=0;i<ps.length;i++){
    p = ps[i]; if (!p.alive || p.falling) continue;
    for (j=i+1;j<ps.length;j++){
      q = ps[j]; if (!q.alive || q.falling) continue;
      var dx = p.x - q.x, dy = p.y - q.y, d2 = dx*dx + dy*dy;
      if (d2 < 4*R*R && d2 > 0.0001){
        var d = Math.sqrt(d2), nx = dx/d, ny = dy/d, ov = 2*R - d;
        p.x += nx*ov/2; p.y += ny*ov/2; q.x -= nx*ov/2; q.y -= ny*ov/2;
        var rv = (p.vx - q.vx)*nx + (p.vy - q.vy)*ny;
        if (rv < 0){
          var jm = -(1+REST)*rv/2;
          p.vx += jm*nx; p.vy += jm*ny; q.vx -= jm*nx; q.vy -= jm*ny;
          if (evs) evs.push({ t:'hit', v:-rv });
        }
      }
    }
  }
  for (i=0;i<ps.length;i++){
    p = ps[i]; if (!p.alive || p.falling) continue;
    if (p.y < YTOP || p.y > YBOT + R || p.x < BX0 || p.x > BX1){
      if (anim){ p.falling = true; p.ft = 0; p.kind = 'edge'; if (evs) evs.push({ t:'fall', p:p }); }
      else { p.alive = false; p.fell = true; }
      continue;
    }
    if (p.vx !== 0 || p.vy !== 0) moving = true;
  }
  return moving;
}
function clonePucks(ps){
  var out = [];
  for (var i=0;i<ps.length;i++){ var p = ps[i]; if (p.alive && !p.falling) out.push({ x:p.x, y:p.y, vx:0, vy:0, side:p.side, alive:true }); }
  return out;
}
function simulate(ps, shot, trace){
  var list = clonePucks(ps);
  var sh = { x:shot.x, y:START_Y, vx:shot.vx, vy:shot.vy, side:shot.side, alive:true };
  list.push(sh);
  for (var n=0; n<1100; n++){
    var mv = stepSim(list, 1/120, null, false);
    if (trace && n % 4 === 0 && sh.alive) trace.push({ x:sh.x, y:sh.y });
    if (!mv) break;
  }
  var res = [];
  for (var i=0;i<list.length;i++){ if (list[i].alive && list[i].y < FOUL) res.push(list[i]); }
  return { list: res, shooter: sh, fate: sh.fell ? 'off' : (sh.y >= FOUL ? 'short' : 'in') };
}
function zoneVal(y){ if (y < YTOP + R) return 4; if (y < Z3) return 3; if (y < Z2) return 2; if (y < FOUL) return 1; return 0; }
function frameScore(list){
  var best = { a:1e9, b:1e9 }, i;
  for (i=0;i<list.length;i++){ var p = list[i]; if (p.alive && !p.falling && p.y < FOUL && p.y < best[p.side]) best[p.side] = p.y; }
  if (Math.abs(best.a - best.b) < 0.5) return { side:null, pts:0 };
  var lead = best.a < best.b ? 'a' : 'b', pts = 0, oth = best[other(lead)];
  for (i=0;i<list.length;i++){ var q = list[i]; if (q.alive && !q.falling && q.side === lead && q.y < oth && q.y < FOUL) pts += zoneVal(q.y); }
  return { side:lead, pts:pts };
}

/* ---------- AI ---------- */
function evalList(list, side){
  var fs = frameScore(list), v = fs.side ? (fs.side === side ? fs.pts : -fs.pts) : 0;
  for (var i=0;i<list.length;i++){ var p = list[i]; v += (p.side === side ? 0.25 : -0.25) * zoneVal(p.y); }
  return v;
}
// personality: how much each style values knock-offs, blocking guards, and avoiding risk
function profile(style, lead){
  if (style === 'safe')    return { knock:0,   risk:5, guard:0,   noKnock:true };
  if (style === 'blocker') return { knock:0.4, risk:3, guard:0.9, noKnock:false };
  if (style === 'hunter')  return { knock:2.2, risk:1, guard:0,   noKnock:false };
  return lead < 0 ? { knock:1.6, risk:1.5, guard:0, noKnock:false } : { knock:0.3, risk:4, guard:0.4, noKnock:false };   // reader
}
function bestShot(side, oppIdx){
  var tier = OPPS[oppIdx], ps = G.pucks, cands = [], i, k, xs = [], tx, ty, sx;
  for (i=0;i<5;i++) xs.push(BX0 + R + 8 + i*(BX1-BX0-2*R-16)/4);
  var enemy = [];
  for (i=0;i<ps.length;i++) if (ps[i].alive && !ps[i].falling && ps[i].side !== side && ps[i].y < FOUL) enemy.push(ps[i]);
  var enemyBefore = enemy.length, prof = profile(tier.style, G.score[side] - G.score[other(side)]);
  if (prof.noKnock) enemy = [];
  var tys = [YTOP+R+10, 120, 150, 205, 250, 320];
  for (var a=0;a<xs.length;a++){
    sx = xs[a];
    var tgts = [];
    for (tx = BX0 + R + 10; tx <= BX1 - R - 10 + 1; tx += (BX1-BX0-2*R-20)/5) for (k=0;k<tys.length;k++) tgts.push({ x:tx, y:tys[k], stop:true });
    for (i=0;i<enemy.length;i++) for (k=-1;k<=1;k++){
      var E = enemy[i], dE = Math.max(10, E.y - YTOP + 30), vc = Math.sqrt(2*MU*dE)/0.9;
      tgts.push({ x:E.x + k*R*0.7, y:E.y, stop:false, vc:vc });
      tgts.push({ x:E.x + k*R*0.7, y:E.y, stop:false, vc:vc*0.55 });
    }
    if (!prof.noKnock) for (var pi=0; pi<2; pi++) tgts.push({ x:sx, y:YTOP, stop:false, vc:Math.sqrt(2*MU*30), raw:pi ? 1.0 : 0.82 });
    for (i=0;i<tgts.length;i++){
      var T = tgts[i], dx = T.x - sx, dy = T.y - START_Y, d = Math.sqrt(dx*dx + dy*dy);
      var ang = Math.atan2(dx, -dy); if (Math.abs(ang) > 0.62) continue;
      var v;
      if (T.raw) v = VMAX * T.raw;
      else if (T.stop) v = Math.sqrt(2*MU*d);
      else v = Math.sqrt(2*MU*d + T.vc*T.vc);
      if (v > VMAX) continue;
      var shot = { x:sx, vx:v*Math.sin(ang), vy:-v*Math.cos(ang), side:side, ang:ang, v:v };
      var r = simulate(ps, shot);
      var eAfter = 0, guards = 0;
      for (var li=0; li<r.list.length; li++){ var lp = r.list[li]; if (lp.side !== side) eAfter++; else if (lp.y >= Z3 && lp.y < FOUL) guards++; }
      var val = evalList(r.list, side) + prof.knock*(enemyBefore - eAfter) + prof.guard*guards - (r.fate === 'in' ? 0 : prof.risk) + Math.random()*0.05;
      cands.push({ shot:shot, val:val });
    }
  }
  if (!cands.length){ var fv = Math.sqrt(2*MU*600); return { x:(BX0+BX1)/2, vx:0, vy:-fv, side:side, ang:0, v:fv }; }   // safety net: a plain centre shot
  cands.sort(function(p,q){ return q.val - p.val; });
  var lead = G.score[side] - G.score[other(side)], slack = lead >= 8 ? 0.12 : 0;      // far ahead: ease off a little
  var n = cands.length, pick = Math.floor(Math.pow(Math.random(), 2) * Math.max(1, Math.ceil(n*(tier.top + slack))));
  var s = cands[Math.min(pick, n-1)].shot;
  var ang2 = s.ang + gauss()*tier.ang, v2 = clamp(s.v*(1 + gauss()*tier.spd), 100, VMAX);
  return { x:s.x, vx:v2*Math.sin(ang2), vy:-v2*Math.cos(ang2), side:side, ang:ang2, v:v2 };
}

/* ---------- game state ---------- */
var G = null, screen = 'menu', buttons = [], settings = { guide:0 };      // guide: 0 line, 1 preview, 2 off
var GUIDES = ['Line', 'Preview', 'Off'];
function names(){ return G.mode === 'ai' ? { a:'YOU', b:OPPS[G.opp].short.toUpperCase() } : { a:'RED', b:'BLUE' }; }
function newGame(mode, opp){
  G = { mode:mode, opp:opp||0, score:{a:0,b:0}, frame:1, first:'a', shots:0, pucks:[], state:'next', t:0, toast:null, toastT:0,
        aim:null, kb:{ angle:0, charging:false, t:0, p:0 }, keys:{}, hangsThis:0, frameHist:[] };
  screen = 'game'; startFrame();
}
function startFrame(){ G.pucks = []; G.shots = 0; G.fs = null; nextShot(); }
function shooterSide(){ return (G.shots % 2 === 0) ? G.first : other(G.first); }
function nextShot(){
  G.side = shooterSide();
  G.cur = { x:(BX0+BX1)/2 }; G.aim = null; G.kb.charging = false; G.kb.p = 0; G.kb.angle = 0; G.shooterP = null;
  if (G.mode === 'ai' && G.side === 'b'){ G.state = 'ai'; G.ai = { shot:bestShot('b', G.opp), t:0, x0:G.cur.x }; }
  else G.state = 'aim';
}
function fire(x, vx, vy){
  var p = { x:x, y:START_Y, vx:vx, vy:vy, side:G.side, alive:true, falling:false, shooter:true };
  G.pucks.push(p); G.shooterP = p; G.shots++; G.events = []; G.state = 'roll'; G.acc = 0; G.hitsBefore = 0;
  G.enemyFell = 0; G.aim = null; G.kb.charging = false;
  SFX.slide(Math.sqrt(vx*vx+vy*vy)/VMAX);
}
function aimParams(){
  // returns { ang, p } for the current human aim (pointer or keyboard), or null
  if (G.aim){
    var dx = G.aim.cx - G.aim.ax, dy = G.aim.cy - G.aim.ay, len = Math.sqrt(dx*dx + dy*dy);
    if (dy < 8 || len < 14) return null;
    var ang = clamp(Math.atan2(-dx, dy), -0.62, 0.62);
    return { ang:ang, p:clamp((len-14)/(PULLMAX-14), 0, 1) };
  }
  if (G.kb.charging) return { ang:G.kb.angle, p:G.kb.p };
  return null;
}
function shotFrom(ap){ var v = ap.p*VMAX; return { x:G.cur.x, vx:v*Math.sin(ap.ang), vy:-v*Math.cos(ap.ang), side:G.side }; }

function settle(){
  // pucks that did not clear the foul line are removed
  var sp = G.shooterP, i, msg = null;
  for (i=0;i<G.pucks.length;i++){
    var p = G.pucks[i];
    if (p.alive && !p.falling && p.y >= FOUL){ p.falling = true; p.ft = 0; p.kind = 'short'; if (p === sp) SFX.short(); }
  }
  if (sp){
    if (sp.falling && sp.kind === 'edge') msg = 'Off the table!';
    else if (sp.falling && sp.kind === 'short') msg = 'Too short - removed';
    else if (sp.y < YTOP + R){ msg = 'HANGING! Worth 4'; save.hangs++; SFX.score(); }
    else msg = 'Zone ' + zoneVal(sp.y);
  }
  if (G.enemyFell > 0) msg = (msg ? msg + '  -  ' : '') + 'Knocked ' + G.enemyFell + ' off!';
  G.toast = msg; G.toastT = 1.4; G.state = 'settle'; G.t = 0;
}
function endFrame(){
  var live = G.pucks.filter(function(p){ return p.alive && !p.falling; });
  G.fs = frameScore(live);
  G.fs.capped = G.fs.pts > FRAME_CAP; if (G.fs.capped) G.fs.pts = FRAME_CAP;
  if (G.fs.side){ G.score[G.fs.side] += G.fs.pts; }
  G.frameHist.push(G.fs);
  save.frames++;
  G.state = 'frameEnd'; G.t = 0;
  if (G.fs.side && G.fs.pts > 0){ SFX.cheer(); }
  if (G.score.a >= TARGET || G.score.b >= TARGET){ finishGame(); }
}
function finishGame(){
  var winner = G.score.a >= TARGET ? 'a' : 'b';
  G.winner = winner;
  if (G.mode === 'ai'){ save.rec[G.opp][winner === 'a' ? 0 : 1]++; }
  persist();
  if (G.mode === 'ai'){ if (winner === 'a') SFX.win(); else SFX.lose(); } else SFX.win();
}
function continueFrame(){
  if (G.state !== 'frameEnd') return;
  if (G.winner){ screen = 'over'; return; }
  G.frame++; G.first = G.fs && G.fs.side ? G.fs.side : other(G.first);
  startFrame();
}

/* ---------- update ---------- */
var last = 0;
function update(dt){
  if (screen !== 'game' || !G) return;
  G.t += dt;
  if (G.toastT > 0) G.toastT -= dt;
  var i;
  for (i=G.pucks.length-1;i>=0;i--){
    var p = G.pucks[i];
    if (p.falling){ p.ft += dt; if (p.ft > (p.kind === 'short' ? 0.5 : 0.65)){ p.alive = false; G.pucks.splice(i,1); } }
  }
  if (G.state === 'aim'){
    var k = G.keys;
    if (k['ArrowLeft'] || k['a']) G.cur.x -= 170*dt;
    if (k['ArrowRight'] || k['d']) G.cur.x += 170*dt;
    G.cur.x = clamp(G.cur.x, BX0 + R + 4, BX1 - R - 4);
    if (k['q'] || k['ArrowUp'] && false) G.kb.angle -= 0.9*dt;
    if (k['e']) G.kb.angle += 0.9*dt;
    G.kb.angle = clamp(G.kb.angle, -0.62, 0.62);
    if (G.kb.charging){ G.kb.t += dt; G.kb.p = 1 - Math.abs(((G.kb.t*0.7) % 2) - 1); }
  } else if (G.state === 'ai'){
    var A = G.ai; A.t += dt;
    var s1 = clamp(A.t/0.7, 0, 1); G.cur.x = A.x0 + (A.shot.x - A.x0)*(s1*s1*(3-2*s1));
    if (A.t >= 1.35){ fire(A.shot.x, A.shot.vx, A.shot.vy); }
  } else if (G.state === 'roll'){
    G.acc += dt;
    var moving = true, guard = 0;
    while (G.acc >= 1/120 && guard++ < 20){
      G.acc -= 1/120;
      moving = stepSim(G.pucks, 1/120, G.events, true);
      for (var e=0;e<G.events.length;e++){
        var ev = G.events[e];
        if (ev.t === 'hit') SFX.clack(ev.v);
        else if (ev.t === 'fall'){ SFX.fall(); if (ev.p.side !== G.side) G.enemyFell++; }
      }
      G.events.length = 0;
      if (!moving) break;
    }
    var anyFall = G.pucks.some(function(q){ return q.falling && q.kind === 'edge'; });
    if (!moving && !anyFall) settle();
  } else if (G.state === 'settle'){
    if (G.t > 1.0){
      if (G.shots >= PER_SIDE*2) endFrame(); else nextShot();
    }
  }
}

/* ---------- drawing ---------- */
var grain = [], dots = [];
(function(){ var s = 7; function rnd(){ s = (s*16807) % 2147483647; return s/2147483647; }
  for (var i=0;i<70;i++) grain.push({ x:BX0 + rnd()*(BX1-BX0), w:0.5+rnd()*1.5, a:0.03+rnd()*0.05 });
  for (i=0;i<420;i++) dots.push({ x:BX0 + rnd()*(BX1-BX0), y:YTOP + rnd()*(YBOT-YTOP), r:0.5+rnd()*0.9 });
})();
function txt(s, x, y, size, color, align, weight, font){
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + (font || 'Arial,Helvetica,sans-serif');
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function btn(x,y,w,h,label,cb,o){
  o = o || {};
  buttons.push({ x:x, y:y, w:w, h:h, cb:cb });
  rr(x,y,w,h,o.r || 12); ctx.fillStyle = o.fill || '#3a2a4f'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = o.stroke || '#e0a458'; ctx.stroke();
  txt(label, x+w/2, y+h/2 + (o.dy||0), o.size || 20, o.color || '#fff4dc');
}
function bg(){
  var g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1c130d'); g.addColorStop(1,'#080504');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function drawTable(){
  bg();
  // wooden frame
  rr(BX0-48, YTOP-30, BX1-BX0+96, YBOT-YTOP+60, 14);
  var fg = ctx.createLinearGradient(BX0-48,0,BX1+48,0); fg.addColorStop(0,'#5a3a1f'); fg.addColorStop(0.5,'#734a28'); fg.addColorStop(1,'#4c2f18');
  ctx.fillStyle = fg; ctx.fill();
  // gutters
  ctx.fillStyle = '#150c06'; ctx.fillRect(BX0-24, YTOP-24, BX1-BX0+48, YBOT-YTOP+40);
  // board
  var bgd = ctx.createLinearGradient(BX0,0,BX1,0); bgd.addColorStop(0,'#dcb577'); bgd.addColorStop(0.5,'#f0d6a0'); bgd.addColorStop(1,'#d8ae6e');
  ctx.fillStyle = bgd; ctx.fillRect(BX0, YTOP, BX1-BX0, YBOT-YTOP);
  var i;
  for (i=0;i<grain.length;i++){ ctx.fillStyle = 'rgba(90,50,10,' + grain[i].a + ')'; ctx.fillRect(grain[i].x, YTOP, grain[i].w, YBOT-YTOP); }
  for (i=0;i<dots.length;i++){ ctx.fillStyle = 'rgba(255,248,225,0.22)'; ctx.fillRect(dots[i].x, dots[i].y, dots[i].r, dots[i].r); }
  var sh = ctx.createLinearGradient(0,YTOP,0,YBOT); sh.addColorStop(0,'rgba(255,255,255,0.10)'); sh.addColorStop(0.5,'rgba(255,255,255,0.0)'); sh.addColorStop(1,'rgba(0,0,0,0.16)');
  ctx.fillStyle = sh; ctx.fillRect(BX0, YTOP, BX1-BX0, YBOT-YTOP);
  // hang band
  ctx.fillStyle = 'rgba(214,150,30,0.28)'; ctx.fillRect(BX0, YTOP, BX1-BX0, R);
  // zone lines
  ctx.strokeStyle = 'rgba(110,40,22,0.75)'; ctx.lineWidth = 3;
  [Z3, Z2, FOUL].forEach(function(y){ ctx.beginPath(); ctx.moveTo(BX0, y); ctx.lineTo(BX1, y); ctx.stroke(); });
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(BX0, YTOP + R); ctx.lineTo(BX1, YTOP + R); ctx.stroke();
  txt('4', BX0+18, YTOP+R/2+1, 16, 'rgba(110,40,22,0.8)');  txt('4', BX1-18, YTOP+R/2+1, 16, 'rgba(110,40,22,0.8)');
  [[3,(YTOP+R+Z3)/2],[2,(Z3+Z2)/2],[1,(Z2+FOUL)/2]].forEach(function(z){
    txt(String(z[0]), BX0+22, z[1], 34, 'rgba(110,40,22,0.55)', 'center', 'bold', 'Georgia,serif');
    txt(String(z[0]), BX1-22, z[1], 34, 'rgba(110,40,22,0.55)', 'center', 'bold', 'Georgia,serif');
  });
  txt('FOUL LINE', (BX0+BX1)/2, FOUL+14, 12, 'rgba(110,40,22,0.7)');
  // far edge drop-off
  var eg = ctx.createLinearGradient(0,YTOP-26,0,YTOP); eg.addColorStop(0,'#050302'); eg.addColorStop(1,'#1d120a');
  ctx.fillStyle = eg; ctx.fillRect(BX0-24, YTOP-26, BX1-BX0+48, 26);
  ctx.strokeStyle = 'rgba(255,240,200,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(BX0, YTOP); ctx.lineTo(BX1, YTOP); ctx.stroke();
  // board sides
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(BX0, YTOP); ctx.lineTo(BX0, YBOT); ctx.moveTo(BX1, YTOP); ctx.lineTo(BX1, YBOT); ctx.stroke();
}
function drawPuck(p, a){
  var sc = 1, al = 1;
  if (p.falling){
    var f = p.ft / (p.kind === 'short' ? 0.5 : 0.65);
    if (p.kind === 'short'){ al = 1 - f; }
    else { sc = 1 - 0.55*f; al = 1 - f; }
  }
  var r = R*sc;
  ctx.save(); ctx.globalAlpha = al * (a === undefined ? 1 : a);
  ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.beginPath(); ctx.ellipse(p.x+3, p.y+5, r, r*0.92, 0, 0, 7); ctx.fill();
  var col = COL[p.side];
  var g = ctx.createRadialGradient(p.x-r*0.35, p.y-r*0.4, r*0.1, p.x, p.y, r);
  g.addColorStop(0, '#fff'); g.addColorStop(0.18, col); g.addColorStop(1, shade(col, -0.45));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, r*0.62, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5; ctx.beginPath();          // shape marker: dot (red) vs cross (blue)
  if (p.side === 'a'){ ctx.arc(p.x, p.y, r*0.2, 0, 7); }
  else { ctx.moveTo(p.x-r*0.26, p.y-r*0.26); ctx.lineTo(p.x+r*0.26, p.y+r*0.26); ctx.moveTo(p.x+r*0.26, p.y-r*0.26); ctx.lineTo(p.x-r*0.26, p.y+r*0.26); }
  ctx.stroke();
  ctx.restore();
}
function shade(hex, f){
  var n = parseInt(hex.slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  function c(v){ return Math.round(clamp(v + 255*f*(f<0?v/255:1), 0, 255)); }
  return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
}
function drawGuide(ap, x){
  var len = 50 + ap.p*300, sx = Math.sin(ap.ang), sy = -Math.cos(ap.ang);
  var col = COL[G.side];
  if (settings.guide === 1){
    var tr = [], r = simulate(G.pucks, { x:x, vx:ap.p*VMAX*sx, vy:ap.p*VMAX*sy, side:G.side }, tr);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([2,8]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, START_Y); tr.forEach(function(q){ ctx.lineTo(q.x, q.y); }); ctx.stroke(); ctx.setLineDash([]);
    if (tr.length){ var e = tr[tr.length-1]; ctx.save(); ctx.globalAlpha = 0.55; drawPuck({ x:e.x, y:e.y, side:G.side }); ctx.restore(); }
  } else if (settings.guide === 0){
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([4,9]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, START_Y); ctx.lineTo(x + sx*len, START_Y + sy*len); ctx.stroke(); ctx.setLineDash([]);
  }
  // power ring
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(x, START_Y, R+12, 0, 7); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, START_Y, R+12, -Math.PI/2, -Math.PI/2 + Math.PI*2*ap.p); ctx.stroke();
  txt(Math.round(ap.p*100) + '%', x, START_Y + R + 36, 16, '#fff4dc');
}
function drawHud(){
  var nm = names();
  txt(nm.a, 20, 22, 17, COL.a, 'left'); txt(String(G.score.a), 20, 52, 34, '#fff4dc', 'left', 'bold', 'Georgia,serif');
  txt(nm.b, W-20, 22, 17, COL.b, 'right'); txt(String(G.score.b), W-20, 52, 34, '#fff4dc', 'right', 'bold', 'Georgia,serif');
  txt('FRAME ' + G.frame, W/2, 20, 15, '#e0a458'); txt('first to ' + TARGET, W/2, 38, 13, '#a8977c', 'center', 'normal');
  // pucks left
  var taken = { a:0, b:0 }; for (var i=0;i<G.shots;i++){ taken[(i%2===0)?G.first:other(G.first)]++; }
  for (var s=0;s<2;s++){ var side = s ? 'b' : 'a';
    for (var k=0;k<PER_SIDE;k++){ if (k >= PER_SIDE - taken[side]) continue; var px = s ? W-90-k*20 : 90+k*20; ctx.fillStyle = COL[side]; ctx.beginPath(); ctx.arc(px, 58, 7, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}
function drawGame(){
  drawTable();
  var i;
  // pucks on table (non-shooter first)
  for (i=0;i<G.pucks.length;i++) drawPuck(G.pucks[i]);
  // puck waiting at the start
  if (G.state === 'aim' || G.state === 'ai'){
    drawPuck({ x:G.cur.x, y:START_Y, side:G.side });
    if (G.state === 'aim'){
      var ap = aimParams();
      if (ap) drawGuide(ap, G.cur.x);
      else { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(G.cur.x, START_Y, R+10, 0, 7); ctx.stroke(); }
    } else if (G.ai.t > 0.7){
      var gp = clamp((G.ai.t-0.7)/0.65, 0, 1)*G.ai.shot.v/VMAX;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3; ctx.setLineDash([4,9]);
      ctx.beginPath(); ctx.moveTo(G.cur.x, START_Y); ctx.lineTo(G.cur.x + Math.sin(G.ai.shot.ang)*(50+gp*300), START_Y - Math.cos(G.ai.shot.ang)*(50+gp*300)); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  drawHud();
  // shooter turn banner
  var nm = names();
  if (G.state === 'aim' || G.state === 'ai'){
    var who = G.mode === 'ai' ? (G.side === 'a' ? 'Your shot' : nm.b + ' is lining up...') : nm[G.side] + '\'s shot';
    txt(who, W/2, 58, 16, COL[G.side], 'center', 'bold');
  }
  if (G.toast && G.toastT > 0){
    var w = 360; rr(W/2-w/2, 440, w, 46, 12); ctx.fillStyle = 'rgba(15,10,5,0.82)'; ctx.fill(); txt(G.toast, W/2, 463, 19, '#ffd77a');
  }
  // bottom bar
  btn(14, 908, 86, 40, 'Menu', function(){ screen = 'menu'; }, { size:16, fill:'#2a1d12' });
  btn(520, 908, 106, 40, 'Guide: ' + GUIDES[settings.guide], function(){ settings.guide = (settings.guide + 1) % 3; }, { size:13, fill:'#2a1d12' });
  if (G.state === 'aim'){
    ctx.strokeStyle = 'rgba(255,240,200,0.25)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(BX0+R+4, 928); ctx.lineTo(BX1-R-4, 928); ctx.stroke();
    var hx = G.cur.x; ctx.fillStyle = COL[G.side]; ctx.beginPath(); ctx.arc(hx, 928, 15, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff4dc'; ctx.lineWidth = 2; ctx.stroke();
    txt(G.aim ? 'release to shoot' : 'drag back and release to shoot', W/2, 954, 12, '#a8977c', 'center', 'normal');
  }
  if (G.state === 'frameEnd') drawFrameEnd();
}
function drawFrameEnd(){
  var nm = names(), fs = G.fs;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  var x = 90, y = 300, w = 460, h = 330;
  rr(x,y,w,h,18); ctx.fillStyle = '#241a2e'; ctx.fill(); ctx.strokeStyle = '#e0a458'; ctx.lineWidth = 2; ctx.stroke();
  txt('FRAME ' + G.frame, W/2, y+36, 16, '#e0a458');
  var head = !fs.side ? 'No score' : (G.mode === 'ai' ? (fs.side === 'a' ? 'You score ' : nm.b + ' scores ') : nm[fs.side] + ' scores ') + fs.pts;
  txt(head, W/2, y+92, 34, fs.side ? COL[fs.side] : '#fff4dc', 'center', 'bold', 'Georgia,serif');
  txt(nm.a + '  ' + G.score.a + '   -   ' + G.score.b + '  ' + nm.b, W/2, y+158, 26, '#fff4dc');
  txt(fs.side ? (fs.capped ? 'Frame score is capped at ' + FRAME_CAP + '.' : 'Only the side with the furthest puck scores.') : 'Nothing on the board.', W/2, y+206, 14, '#a8977c', 'center', 'normal');
  txt(G.winner ? '' : 'Tap to play the next frame', W/2, y+h-34, 17, '#cbb8ff', 'center', 'normal');
  if (G.winner) btn(W/2-110, y+h-70, 220, 48, 'See result', function(){ screen = 'over'; }, { size:20, stroke:'#ffd77a' });
}
function drawMenu(){
  bg();
  txt('SHUFFLEBOARD', W/2, 190, 56, '#f0d6a0', 'center', 'bold', 'Georgia,serif');
  txt('CLUB', W/2, 250, 56, '#e0a458', 'center', 'bold', 'Georgia,serif');
  // decorative pucks
  drawPuck({ x:W/2-70, y:330, side:'a' }); drawPuck({ x:W/2+70, y:330, side:'b' }); drawPuck({ x:W/2, y:318, side:'a' });
  txt('Slide it close. Hang it over the edge. Knock theirs off.', W/2, 392, 15, '#a8977c', 'center', 'normal');
  btn(W/2-150, 450, 300, 62, 'Play vs Computer', function(){ screen = 'opp'; }, { size:24 });
  btn(W/2-150, 530, 300, 62, 'Two Players', function(){ newGame('two'); }, { size:24 });
  btn(W/2-150, 610, 300, 54, 'How to Play', function(){ screen = 'how'; }, { size:20, fill:'#2a1d12' });
  btn(W/2-150, 682, 300, 54, 'Sound: ' + (soundOn ? 'On' : 'Off'), function(){ soundOn = !soundOn; }, { size:20, fill:'#2a1d12' });
  var wins = 0; save.rec.forEach(function(r){ wins += r[0]; });
  txt('Wins vs computer: ' + wins + '   ·   Hangs: ' + save.hangs + '   ·   Frames played: ' + save.frames, W/2, 800, 14, '#a8977c', 'center', 'normal');
}
function drawOpp(){
  bg();
  txt('CHOOSE YOUR OPPONENT', W/2, 80, 30, '#f0d6a0', 'center', 'bold', 'Georgia,serif');
  OPPS.forEach(function(o, i){
    var y = 150 + i*150, r = save.rec[i];
    btn(60, y, 520, 126, '', function(){ newGame('ai', i); }, { fill:'#241a2e' });
    drawPuck({ x:120, y:y+63, side:'b' });
    txt(o.name, 160, y+34, 26, '#fff4dc', 'left', 'bold', 'Georgia,serif');
    txt(o.blurb, 160, y+66, 15, '#cbb8ff', 'left', 'normal');
    txt('Record: ' + r[0] + ' W  -  ' + r[1] + ' L', 160, y+98, 14, '#e0a458', 'left', 'normal');
    for (var s=0;s<=i;s++) txt('★', 540 - s*26, y+34, 22, '#ffd77a');
  });
  btn(W/2-80, 772, 160, 48, 'Back', function(){ screen = 'menu'; }, { size:18, fill:'#2a1d12' });
}
function drawHow(){
  bg();
  txt('HOW TO PLAY', W/2, 80, 32, '#f0d6a0', 'center', 'bold', 'Georgia,serif');
  var L = [
    'Each frame, both sides slide 4 pucks down the table.',
    'Drag back from anywhere on the board and release to shoot.',
    'The further you pull, the harder the shot. Use the slider',
    'under the table (or A / D) to place the puck first.',
    '',
    'Only the side with the furthest puck scores that frame:',
    'its pucks that are ahead of the other side\'s best.',
    'Zone 1 = 1, Zone 2 = 2, Zone 3 = 3.',
    'HANG over the end edge without falling = 4.',
    'Fall off the end or the sides and the puck is lost.',
    'A puck that stops short of the foul line is removed.',
    '',
    'Knock their pucks off the end with your shot!',
    'A frame is worth at most ' + FRAME_CAP + ' points.',
    'First to ' + TARGET + ' points wins.',
    '',
    'Keyboard: A/D move, Q/E angle, hold Space to charge,',
    'release Space to shoot.'
  ];
  L.forEach(function(s,i){ txt(s, W/2, 150 + i*30, 17, '#e8dcc2', 'center', 'normal'); });
  btn(W/2-80, 800, 160, 48, 'Back', function(){ screen = 'menu'; }, { size:18 });
}
function drawOver(){
  bg();
  var nm = names(), won = G.winner === 'a', two = G.mode === 'two';
  var title = two ? nm[G.winner] + ' WINS!' : (won ? 'YOU WIN!' : nm.b + ' WINS');
  txt(title, W/2, 200, 52, two ? COL[G.winner] : (won ? '#ffd77a' : '#e8a0a0'), 'center', 'bold', 'Georgia,serif');
  txt(G.score.a + '  -  ' + G.score.b, W/2, 290, 64, '#fff4dc', 'center', 'bold', 'Georgia,serif');
  txt(nm.a + '  vs  ' + (G.mode === 'ai' ? OPPS[G.opp].name : nm.b), W/2, 350, 18, '#a8977c', 'center', 'normal');
  txt(G.frame + ' frames played', W/2, 385, 16, '#a8977c', 'center', 'normal');
  if (G.mode === 'ai'){ var r = save.rec[G.opp]; txt('Your record vs ' + OPPS[G.opp].short + ': ' + r[0] + ' - ' + r[1], W/2, 420, 16, '#e0a458', 'center', 'normal'); }
  btn(W/2-130, 500, 260, 60, 'Rematch', function(){ newGame(G.mode, G.opp); }, { size:22, stroke:'#ffd77a' });
  btn(W/2-130, 580, 260, 56, 'Menu', function(){ screen = 'menu'; }, { size:20, fill:'#2a1d12' });
}
function draw(){
  buttons = [];
  if (screen === 'menu') drawMenu();
  else if (screen === 'opp') drawOpp();
  else if (screen === 'how') drawHow();
  else if (screen === 'over') drawOver();
  else if (screen === 'game') drawGame();
}

/* ---------- input ---------- */
function pos(e){ var r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left)/S, y:(e.clientY - r.top)/S }; }
var sliding = false;
cv.addEventListener('pointerdown', function(e){
  e.preventDefault(); ac();
  var p = pos(e);
  for (var i=buttons.length-1;i>=0;i--){ var b = buttons[i]; if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h){ b.cb(); return; } }
  if (screen !== 'game' || !G) return;
  if (G.state === 'frameEnd'){ continueFrame(); return; }
  if (G.state !== 'aim') return;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  if (p.y >= 896){ sliding = true; G.cur.x = clamp(p.x, BX0+R+4, BX1-R-4); return; }
  if (p.y > YTOP - 10 && p.y < 896){ G.aim = { ax:p.x, ay:p.y, cx:p.x, cy:p.y }; }
});
cv.addEventListener('pointermove', function(e){
  if (!G || screen !== 'game') return;
  var p = pos(e);
  if (sliding && G.state === 'aim'){ G.cur.x = clamp(p.x, BX0+R+4, BX1-R-4); }
  else if (G.aim){ G.aim.cx = p.x; G.aim.cy = p.y; }
});
function release(){
  sliding = false;
  if (!G || screen !== 'game' || !G.aim) return;
  var ap = aimParams(); G.aim = null;
  if (ap && ap.p >= 0.04 && G.state === 'aim'){ var s = shotFrom(ap); fire(s.x, s.vx, s.vy); }
}
cv.addEventListener('pointerup', function(e){ e.preventDefault(); release(); });
cv.addEventListener('pointercancel', function(){ sliding = false; if (G) G.aim = null; });
window.addEventListener('keydown', function(e){
  if (!G || screen !== 'game') return;
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  G.keys[k] = true;
  if (k === ' '){ e.preventDefault(); ac();
    if (G.state === 'aim' && !G.kb.charging){ G.kb.charging = true; G.kb.t = 0; G.kb.p = 0; }
    else if (G.state === 'frameEnd'){ if (G.winner) screen = 'over'; else continueFrame(); }
  }
  if (k === 'Enter' && G.state === 'frameEnd'){ if (G.winner) screen = 'over'; else continueFrame(); }
  if (k === 'Escape') screen = 'menu';
});
window.addEventListener('keyup', function(e){
  if (!G) return;
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  G.keys[k] = false;
  if (k === ' ' && G.kb.charging && G.state === 'aim'){
    var p = G.kb.p; G.kb.charging = false;
    if (p >= 0.08){ var s = shotFrom({ ang:G.kb.angle, p:p }); fire(s.x, s.vx, s.vy); }
  }
});

/* ---------- loop ---------- */
function frame(t){
  var dt = Math.min(0.05, (t - last)/1000 || 0); last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.SB = { newGame:newGame, bestShot:bestShot, fire:fire, update:update, get G(){ return G; }, get screen(){ return screen; }, simulate:simulate, frameScore:frameScore, OPPS:OPPS, continueFrame:continueFrame, setScreen:function(s){ screen = s; }, get save(){ return save; } };
})();
</script>
