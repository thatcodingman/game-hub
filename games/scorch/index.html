<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scorch</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #060608;
    overflow: hidden;
    overscroll-behavior: none;
    height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    color: #f8fafc;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game-container { position: relative; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 14px;
    pointer-events: none;
    z-index: 5;
    font-family: 'Courier New', monospace;
  }
  #hud .box { text-align: left; }
  #hud .box.right { text-align: right; }
  #hud .label { font-size: 10px; letter-spacing: 0.12em; color: #8b93a8; text-transform: uppercase; }
  #hud .value { font-size: 22px; font-weight: 700; color: #f8fafc; line-height: 1.15; }
  #hud .balls { font-size: 16px; letter-spacing: 3px; }
  #heatTier {
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
    transition: color 0.3s;
  }
  #heatBarOuter {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 140px; height: 6px; margin-top: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
    z-index: 5;
  }
  #heatBarInner {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #38bdf8, #fbbf24, #f97316, #ef4444);
    transition: width 0.15s linear;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,6,8,0.92);
    text-align: center;
    z-index: 10;
    padding: 20px;
  }
  #overlay h1 {
    font-size: 2.4rem; letter-spacing: 0.08em; margin: 0 0 6px;
    background: linear-gradient(90deg, #38bdf8, #fbbf24, #f97316, #ef4444);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay p { color: #94a3b8; margin: 4px 0 18px; max-width: 320px; font-size: 0.92rem; line-height: 1.5; }
  #overlay .stat { font-size: 1.1rem; margin: 2px 0; color: #e2e8f0; }
  #overlay .stat b { color: #fbbf24; }
  #overlay button {
    margin-top: 18px;
    padding: 14px 36px;
    font-size: 1rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, #f97316, #ef4444);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(249,115,22,0.4);
  }
  #overlay button:active { transform: scale(0.96); }
  #controls-hint {
    position: absolute; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #4b5563;
    z-index: 5; pointer-events: none;
    letter-spacing: 0.04em;
  }
  #touchzones {
    position: absolute; inset: 0; z-index: 4;
    display: none;
  }
  #touchzones.active { display: block; }
  .tz {
    position: absolute; top: 0; bottom: 0; width: 50%;
  }
  .tz.left { left: 0; }
  .tz.right { right: 0; }
  #plungerZone {
    position: absolute; right: 6px; top: 0; bottom: 0; width: 46px;
    z-index: 6;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 14px;
  }
  #plungerTrack {
    width: 14px; height: 70%;
    background: rgba(255,255,255,0.06);
    border-radius: 7px;
    position: relative;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #plungerKnob {
    position: absolute; left: -7px; bottom: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    box-shadow: 0 0 12px rgba(251,191,36,0.6);
    transition: bottom 0.05s linear;
  }
  #plungerSkillZone {
    position: absolute; left: 0; right: 0;
    bottom: 33%; height: 12%;
    background: rgba(74,222,128,0.35);
    border-top: 1px solid rgba(74,222,128,0.8);
    border-bottom: 1px solid rgba(74,222,128,0.8);
  }
  @media (hover: none) {
    #controls-hint { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="game-container">
    <div id="hud">
      <div class="box">
        <div class="label">Score</div>
        <div class="value" id="scoreVal">0</div>
        <div id="heatTier">Cold</div>
      </div>
      <div class="box right">
        <div class="label">Best</div>
        <div class="value" id="bestVal">0</div>
        <div class="balls" id="ballsVal">●●●</div>
      </div>
    </div>
    <div id="heatBarOuter"><div id="heatBarInner"></div></div>
    <div id="touchzones">
      <div class="tz left" id="tzLeft"></div>
      <div class="tz right" id="tzRight"></div>
    </div>
    <div id="plungerZone">
      <div id="plungerTrack"><div id="plungerSkillZone"></div><div id="plungerKnob"></div></div>
    </div>
    <div id="overlay">
      <h1>SCORCH</h1>
      <p>Keep the ball hot for a bigger multiplier. The hotter it gets, the faster and harder it is to control — bank your multiplier at the Cool Lane before you lose it.</p>
      <div class="stat">Best Score: <b id="overlayBest">0</b></div>
      <button id="startBtn">Launch</button>
    </div>
    <div id="controls-hint">← → or A / D to flip · SPACE hold to plunge · click/drag table edges on mobile</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  const W = 420, H = 760;
  const BEST_KEY = 'scorch_best_score';

  // Heat tiers: name, threshold (0-100 heat), multiplier, color, ballSpeedMult, flipperForgiveness
  const HEAT_TIERS = [
    { name: 'Cold',    min: 0,  mult: 1,   color: '#38bdf8', speed: 1.00, margin: 1.00 },
    { name: 'Warm',    min: 20, mult: 1.5, color: '#4ade80', speed: 1.05, margin: 0.95 },
    { name: 'Hot',     min: 45, mult: 2.5, color: '#fbbf24', speed: 1.12, margin: 0.88 },
    { name: 'Blazing', min: 70, mult: 4,   color: '#f97316', speed: 1.20, margin: 0.80 },
    { name: 'Molten',  min: 92, mult: 6,   color: '#ef4444', speed: 1.30, margin: 0.70 }
  ];
  function tierFor(heat) {
    let t = HEAT_TIERS[0];
    for (const tier of HEAT_TIERS) if (heat >= tier.min) t = tier;
    return t;
  }
  function tierIndex(heat) {
    for (let i = HEAT_TIERS.length - 1; i >= 0; i--) if (heat >= HEAT_TIERS[i].min) return i;
    return 0;
  }

  // ---------- Lightweight synth SFX (standalone; swap for shared sfx.js if desired) ----------
  const SFX = (function () {
    let ctx = null;
    function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
    function tone(freq, dur, type, vol, slideTo) {
      try {
        const c = ac();
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, c.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
        g.gain.setValueAtTime(vol || 0.15, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + dur);
      } catch (e) {}
    }
    return {
      bumper: () => tone(320 + Math.random() * 80, 0.12, 'square', 0.12, 220),
      slingshot: () => tone(180, 0.1, 'sawtooth', 0.12, 90),
      flipper: () => tone(140, 0.05, 'square', 0.08),
      plunge: () => tone(90, 0.25, 'sine', 0.15, 260),
      drain: () => tone(200, 0.4, 'sawtooth', 0.15, 50),
      tierUp: (i) => tone(300 + i * 80, 0.25, 'triangle', 0.18, 600 + i * 120),
      cool: () => tone(700, 0.3, 'sine', 0.2, 1200),
      launch: () => tone(400, 0.15, 'square', 0.12, 700)
    };
  })();

  // ---------- Game state ----------
  const state = {
    score: 0,
    best: parseInt(localStorage.getItem(BEST_KEY) || '0', 10),
    balls: 3,
    heat: 0,
    tierIdx: 0,
    running: false,
    ballInPlay: false,
    combo: 0,
    nextExtraBallAt: 15000
  };

  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const ballsVal = document.getElementById('ballsVal');
  const heatTierEl = document.getElementById('heatTier');
  const heatBarInner = document.getElementById('heatBarInner');
  const overlay = document.getElementById('overlay');
  const overlayBest = document.getElementById('overlayBest');
  const startBtn = document.getElementById('startBtn');

  bestVal.textContent = state.best;
  overlayBest.textContent = state.best;

  function addScore(pts, comboMult) {
    const tier = tierFor(state.heat);
    const final = Math.round(pts * tier.mult * (comboMult || 1));
    state.score += final;
    scoreVal.textContent = state.score;
    checkExtraBallMilestone();
    return final;
  }

  // Extra ball every 15k points, scaling up each time so it never trivializes
  // the run (next threshold = current + 15k, 20k, 25k, ...)
  let extraBallStep = 15000;
  function checkExtraBallMilestone() {
    if (state.score < state.nextExtraBallAt) return;
    state.balls += 1;
    updateBallsHud();
    extraBallStep += 5000;
    state.nextExtraBallAt += extraBallStep;
    if (window.__scorchScene) window.__scorchScene.popText(W / 2, H / 2 - 120, 'EXTRA BALL!', '#4ade80');
  }

  function setHeat(newHeat, scene) {
    const oldIdx = tierIndex(state.heat);
    state.heat = Math.max(0, Math.min(100, newHeat));
    const newIdx = tierIndex(state.heat);
    heatBarInner.style.width = state.heat + '%';
    const tier = HEAT_TIERS[newIdx];
    heatTierEl.textContent = tier.name;
    heatTierEl.style.color = tier.color;
    if (newIdx !== oldIdx) {
      state.tierIdx = newIdx;
      if (newIdx > oldIdx) SFX.tierUp(newIdx);
      if (scene) scene.applyTierVisuals(tier);
    }
  }

  function updateBallsHud() {
    ballsVal.textContent = '●'.repeat(state.balls) + '○'.repeat(Math.max(0, 3 - state.balls));
  }
  updateBallsHud();

  // ---------- Phaser scene ----------
  class TableScene extends Phaser.Scene {
    constructor() { super('table'); }

    preload() {}

    create() {
      window.__scorchScene = this;

      // top disabled here on purpose — we hand-place a top wall below that
      // leaves a gap over the launch lane so a plunged ball can actually
      // curve into the main table instead of bouncing off a sealed ceiling
      this.matter.world.setBounds(0, 0, W, H, 32, true, true, false, false);
      this.matter.world.engine.gravity.y = 1.0;

      this.cameras.main.setBackgroundColor('#0a0a10');
      this.bgTint = this.add.rectangle(W / 2, H / 2, W, H, 0x0a0a10).setDepth(-10);
      this.drawPlayfieldBackground();

      this.drainedThisBall = false;
      this.lastDrainTime = 0;

      this.buildTable();
      this.buildFlippers();
      this.buildPlunger();
      this.buildBall();
      this.buildCoolLane();

      this.input.keyboard.on('keydown-LEFT', () => this.flipLeft(true));
      this.input.keyboard.on('keyup-LEFT', () => this.flipLeft(false));
      this.input.keyboard.on('keydown-A', () => this.flipLeft(true));
      this.input.keyboard.on('keyup-A', () => this.flipLeft(false));
      this.input.keyboard.on('keydown-RIGHT', () => this.flipRight(true));
      this.input.keyboard.on('keyup-RIGHT', () => this.flipRight(false));
      this.input.keyboard.on('keydown-D', () => this.flipRight(true));
      this.input.keyboard.on('keyup-D', () => this.flipRight(false));
      this.input.keyboard.addCapture('SPACE');
      this.spaceHeld = false;
      this.pointerHeld = false;
      this.input.keyboard.on('keydown-SPACE', (e) => { e.preventDefault(); this.spaceHeld = true; this.plungerDown(); });
      this.input.keyboard.on('keyup-SPACE', (e) => { e.preventDefault(); this.spaceHeld = false; this.plungerRelease(); });
      // safety net: if the window loses focus mid-charge (alt-tab, clicking
      // elsewhere) the browser never sends a keyup, so force a release here too
      window.addEventListener('blur', () => this.plungerRelease());

      this.setupTouch();

      this.matter.world.on('collisionstart', (event) => this.handleCollisions(event));

      // heat decay ticker
      this.heatDecayAccum = 0;
    }

    applyTierVisuals(tier) {
      const col = Phaser.Display.Color.HexStringToColor(tier.color);

      // tier-up screen flash so a jump is unmistakable, not just a HUD label change
      const flash = this.add.rectangle(W / 2, H / 2, W, H,
        Phaser.Display.Color.GetColor(col.red, col.green, col.blue), 0.28).setDepth(50);
      this.tweens.add({ targets: flash, alpha: 0, duration: 350, onComplete: () => flash.destroy() });

      // tint bumpers
      this.bumperSprites.forEach(b => {
        this.tweens.add({ targets: b, duration: 300, alpha: 1 });
        b.setFillStyle(Phaser.Display.Color.GetColor(
          Math.min(255, col.red * 0.5 + 20), Math.min(255, col.green * 0.4 + 10), Math.min(255, col.blue * 0.5 + 30)
        ));
        b.setStrokeStyle(3, Phaser.Display.Color.GetColor(col.red, col.green, col.blue), 1);
        if (b.glowRef) b.glowRef.setFillStyle(Phaser.Display.Color.GetColor(col.red, col.green, col.blue), 0.18);
      });
      // subtle background pulse toward tier color (dark-mixed)
      const mix = Phaser.Display.Color.Interpolate.ColorWithColor(
        Phaser.Display.Color.HexStringToColor('#0a0a10'),
        col, 100, 14
      );
      this.cameras.main.setBackgroundColor(Phaser.Display.Color.RGBToString(mix.r, mix.g, mix.b, 255, '#'));
    }

    drawPlayfieldBackground() {
      const g = this.add.graphics().setDepth(-9);
      // vertical gradient: deep navy top -> near-black bottom, warm at very bottom near flippers
      g.fillGradientStyle(0x151225, 0x151225, 0x0a0810, 0x1a0f10, 1);
      g.fillRect(0, 0, W, H);

      // faint diagonal weave texture for a "real table" feel
      g.lineStyle(1, 0xffffff, 0.025);
      for (let i = -H; i < W; i += 26) {
        g.beginPath();
        g.moveTo(i, 0);
        g.lineTo(i + H, H);
        g.strokePath();
      }

      // soft vignette corners
      const vg = this.add.graphics().setDepth(-8);
      vg.fillStyle(0x000000, 0.35);
      vg.fillCircle(0, 0, 220);
      vg.fillCircle(W, 0, 220);
      vg.fillCircle(0, H, 220);
      vg.fillCircle(W, H, 260);
    }

    buildTable() {
      // we won't physically wall the flipper gap — ball drains there
      //
      // top wall stops short of the launch lane on purpose, leaving a real
      // opening so a plunged ball can curve left into the main table instead
      // of hitting a sealed ceiling and bouncing straight back down. These
      // values are stored on `this` so drawVisualWalls can line up exactly
      // with the physics instead of guessing matching numbers separately.
      this.topWallRight = W - 58;
      this.laneDividerTopY = 38;
      this.laneDividerBottomY = 478.8;
      const topWallWidth = this.topWallRight - 10;
      this.matter.add.rectangle(10 + topWallWidth / 2, 14, topWallWidth, 12, { isStatic: true, label: 'wall' });

      this.matter.add.rectangle(12, H / 2, 12, H, { isStatic: true, label: 'wall' });
      this.matter.add.rectangle(W - 12, H / 2, 12, H, { isStatic: true, label: 'wall' });

      // launch lane divider (right side channel for plunger) — stops short of
      // the very top too, matching the gap in the top wall above
      const laneDividerH = this.laneDividerBottomY - this.laneDividerTopY;
      this.matter.add.rectangle(W - 46, this.laneDividerTopY + laneDividerH / 2, 8, laneDividerH, { isStatic: true, label: 'wall' });

      // upper slanted guides funneling ball toward bumpers
      this.addSlant(40, 60, 140, 160, 10);

      // lane-return deflector: catches a ball launched straight up the lane
      // at ANY speed and redirects it into the table. Starts right at the
      // top-right corner (so nothing can sneak past above it, however hard
      // the plunge was) and angles down into the bumper field.
      this.addSlant(W - 6, 10, W - 98, 170, 12);

      // invisible safety ceiling, well above the visible table — pure
      // insurance against a fast-moving ball tunneling through the thin
      // deflector between physics steps. Should never normally be touched.
      this.matter.add.rectangle(W / 2, -40, W * 2, 20, { isStatic: true, label: 'wall' });

      // lane-exit sensor: rather than trusting bounce physics off the angled
      // deflector to redirect the ball reliably (too easy to get a glancing
      // hit that just sends it straight back down the same lane), explicitly
      // detect the ball clearing the top of the lane and hand it a fixed,
      // guaranteed arc into the table every single time.
      // tall enough that even a maximum-power plunge (which can move 15-18px
      // per physics step) can't skip past it between two position samples —
      // a short hold maxed out power fast enough that the old, shorter zone
      // could occasionally be jumped clean over
      this.laneExitSensor = this.matter.add.rectangle(W - 65, 100, 100, 190, {
        isStatic: true, isSensor: true, label: 'laneExit'
      });

      // inlane guides near flippers
      this.addSlant(60, H - 180, 30, H - 70, 8);
      this.addSlant(W - 94, H - 180, W - 64, H - 70, 8);

      this.drawVisualWalls();
    }

    drawVisualWalls() {
      const g = this.add.graphics().setDepth(2);
      const topWallRight = this.topWallRight;

      // outer rail, drawn as separate segments so the lane opening at the
      // top-right is genuinely open in the art too, not just in the physics
      g.fillStyle(0x3a2f1a, 1);
      g.fillRect(0, 0, 8, H);                 // left
      g.fillRect(W - 8, 0, 8, H);              // right
      g.fillRect(0, H - 8, W, 8);               // bottom
      g.fillRect(0, 0, topWallRight + 4, 12);   // top (stops at the lane gap)

      g.lineStyle(2, 0xfbbf24, 0.5);
      g.strokeRect(0, 0, 8, H);
      g.strokeRect(W - 8, 0, 8, H);
      g.strokeRect(0, H - 8, W, 8);
      g.strokeRect(0, 0, topWallRight + 4, 12);

      // launch lane rail — starts only BELOW the opening, so the entrance
      // reads visually as a clear gap, not a sealed channel
      g.fillStyle(0x1e1812, 1);
      g.fillRoundedRect(W - 56, this.laneDividerTopY, 12, this.laneDividerBottomY - this.laneDividerTopY, 4);
      g.lineStyle(2, 0xfbbf24, 0.4);
      g.strokeRoundedRect(W - 56, this.laneDividerTopY, 12, this.laneDividerBottomY - this.laneDividerTopY, 4);

      // small glowing arrow at the opening, pointing into the table, so the
      // entrance is unmistakable rather than just an absence of wall
      const arrowX = W - 42, arrowY = this.laneDividerTopY - 6;
      g.lineStyle(2.5, 0x4ade80, 0.6);
      g.beginPath();
      g.moveTo(arrowX + 10, arrowY);
      g.lineTo(arrowX - 14, arrowY - 10);
      g.moveTo(arrowX + 10, arrowY);
      g.lineTo(arrowX - 2, arrowY + 10);
      g.strokePath();

      // table title near the top, over the sealed portion of the table
      const title = this.add.text(topWallRight / 2 + 2, 20, 'S C O R C H', {
        fontFamily: 'Courier New', fontSize: '13px', fontStyle: 'bold', color: '#fbbf24'
      }).setOrigin(0.5).setDepth(2).setAlpha(0.55);
      title.setShadow(0, 0, '#f97316', 8, true, true);
    }

    addSlant(x1, y1, x2, y2, thickness) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      this.matter.add.rectangle(cx, cy, len, thickness, { isStatic: true, angle, label: 'wall' });
      const g = this.add.graphics().setDepth(2);
      g.save();
      g.translateCanvas(cx, cy);
      g.rotateCanvas(angle);
      g.fillStyle(0x2d2416, 1);
      g.fillRoundedRect(-len / 2, -thickness / 2, len, thickness, thickness / 2);
      g.lineStyle(1.5, 0xfbbf24, 0.45);
      g.strokeRoundedRect(-len / 2, -thickness / 2, len, thickness, thickness / 2);
      g.restore();
    }

    buildBumpers() {}

    buildCoolLane() {
      // Cool lane sits top-center: a narrow gated lane, only "lit"/scoring when tier >= Blazing
      const cx = W / 2, cy = 60;
      this.coolLaneSensor = this.matter.add.rectangle(cx, cy, 70, 26, {
        isStatic: true, isSensor: true, label: 'coolLane'
      });
      this.coolLaneGlow = this.add.circle(cx, cy, 44, 0x38bdf8, 0.12).setDepth(2);
      this.coolLaneGfx = this.add.rectangle(cx, cy, 72, 28, 0x0f2a3a, 0.9).setStrokeStyle(2, 0x38bdf8, 0.8).setDepth(3);
      this.coolLaneText = this.add.text(cx, cy, 'COOL', {
        fontFamily: 'Courier New', fontSize: '13px', fontStyle: 'bold', color: '#7dd3fc'
      }).setOrigin(0.5).setDepth(4);
      this.coolLaneText.setShadow(0, 0, '#38bdf8', 6, true, true);

      // three bumpers below the cool lane, standard scoring ring
      const bumperDefs = [
        { x: W / 2, y: 230, r: 26 },
        { x: W / 2 - 90, y: 310, r: 22 },
        { x: W / 2 + 90, y: 310, r: 22 },
        { x: W / 2 - 50, y: 420, r: 20 },
        { x: W / 2 + 50, y: 420, r: 20 }
      ];
      this.bumperSprites = [];
      bumperDefs.forEach(def => {
        const body = this.matter.add.circle(def.x, def.y, def.r, {
          isStatic: true, restitution: 1.6, friction: 0, label: 'bumper'
        });
        const glow = this.add.circle(def.x, def.y, def.r + 10, 0x38bdf8, 0.18).setDepth(2.5);
        const circ = this.add.circle(def.x, def.y, def.r, 0x1a2f6e).setStrokeStyle(3, 0x60a5fa, 1).setDepth(3);
        const shine = this.add.ellipse(def.x - def.r * 0.3, def.y - def.r * 0.35, def.r * 0.7, def.r * 0.4, 0xffffff, 0.22).setDepth(3.1);
        circ.body = body;
        circ.glowRef = glow;
        body.gameObj = circ;
        this.bumperSprites.push(circ);
      });

      // slingshots near flippers (triangular, high restitution)
      this.buildSlingshot(70, H - 150, 1);
      this.buildSlingshot(W - 70, H - 150, -1);
    }

    buildSlingshot(x, y, dir) {
      const body = this.matter.add.rectangle(x, y, 14, 70, {
        isStatic: true, restitution: 1.8, label: 'slingshot', angle: dir * 0.35
      });
      const g = this.add.graphics().setDepth(3);
      g.save();
      g.translateCanvas(x, y);
      g.rotateCanvas(dir * 0.35);
      g.fillStyle(0x4a1d0a, 1);
      g.fillRoundedRect(-7, -35, 14, 70, 6);
      g.lineStyle(2.5, 0xf97316, 0.9);
      g.strokeRoundedRect(-7, -35, 14, 70, 6);
      g.fillStyle(0xffffff, 0.15);
      g.fillRoundedRect(-7, -35, 5, 70, 4);
      g.restore();
      body.gameObj = g;
    }

    buildFlippers() {
      const flipperY = H - 60;
      const flipperLen = 72, flipperThick = 16;

      // Left flipper
      this.leftPivot = { x: W / 2 - 60, y: flipperY };
      this.leftFlipper = this.matter.add.rectangle(
        this.leftPivot.x + flipperLen / 2, this.leftPivot.y, flipperLen, flipperThick,
        { label: 'flipperL', chamfer: { radius: 8 }, density: 0.01, friction: 0 }
      );
      this.leftPin = this.matter.add.circle(this.leftPivot.x, this.leftPivot.y, 2, { isStatic: true, isSensor: true });
      this.leftConstraint = this.matter.add.joint(this.leftPin, this.leftFlipper, 0, 1, {
        pointA: { x: 0, y: 0 }, pointB: { x: -flipperLen / 2, y: 0 }
      });
      this.leftRestAngle = 0.5;
      this.leftUpAngle = -0.5;
      Phaser.Physics.Matter.Matter.Body.setAngle(this.leftFlipper, this.leftRestAngle);
      this.leftTarget = this.leftRestAngle;
      this.leftGfx = this.add.rectangle(0, 0, flipperLen, flipperThick, 0xfbbf24).setDepth(4);

      // Right flipper (mirrored)
      this.rightPivot = { x: W / 2 + 60, y: flipperY };
      this.rightFlipper = this.matter.add.rectangle(
        this.rightPivot.x - flipperLen / 2, this.rightPivot.y, flipperLen, flipperThick,
        { label: 'flipperR', chamfer: { radius: 8 }, density: 0.01, friction: 0 }
      );
      this.rightPin = this.matter.add.circle(this.rightPivot.x, this.rightPivot.y, 2, { isStatic: true, isSensor: true });
      this.rightConstraint = this.matter.add.joint(this.rightPin, this.rightFlipper, 0, 1, {
        pointA: { x: 0, y: 0 }, pointB: { x: flipperLen / 2, y: 0 }
      });
      this.rightRestAngle = -0.5;
      this.rightUpAngle = 0.5;
      Phaser.Physics.Matter.Matter.Body.setAngle(this.rightFlipper, this.rightRestAngle);
      this.rightTarget = this.rightRestAngle;
      this.rightGfx = this.add.rectangle(0, 0, flipperLen, flipperThick, 0xfbbf24).setDepth(4);

      this.leftActive = false;
      this.rightActive = false;
    }

    flipLeft(down) {
      this.leftActive = down;
      this.leftTarget = down ? this.leftUpAngle : this.leftRestAngle;
      if (down) SFX.flipper();
    }
    flipRight(down) {
      this.rightActive = down;
      this.rightTarget = down ? this.rightUpAngle : this.rightRestAngle;
      if (down) SFX.flipper();
    }

    buildPlunger() {
      const x = W - 46, yTop = H - 80, yBottom = H - 20;
      this.plungerBody = this.matter.add.rectangle(x, yBottom, 32, 16, {
        isStatic: true, label: 'plunger'
      });
      this.plungerMinY = yTop;
      this.plungerMaxY = yBottom;
      this.plungerCharging = false;
      this.plungerPower = 0;
      this.plungerGfx = this.add.rectangle(x, yBottom, 32, 10, 0xfbbf24).setDepth(4);
    }

    plungerDown() {
      if (this.plungerCharging || !state.ballInPlay || !this.ballResting) return;
      this.plungerCharging = true;
      this.plungerPower = 0;
    }

    plungerRelease() {
      if (!this.plungerCharging) return;
      this.plungerCharging = false;
      const power = this.plungerPower;
      if (this.ballResting && this.ball) {
        // stronger floor + stronger scaling so even a quick tap is a real launch
        // capped lower than before — a full-power hold was fast enough to
        // risk skipping past detection zones between physics steps
        const force = -0.08 - power * 0.0013;
        Phaser.Physics.Matter.Matter.Body.setVelocity(this.ball, { x: (Math.random() - 0.5) * 0.5, y: force * 60 });
        SFX.plunge();
        this.ballResting = false;
        this.cameras.main.shake(80, 0.0015);
        // skill shot: releasing with power in the marked green band (55-75%)
        // pays out a bonus once the ball actually clears into the main table
        this.skillShotPending = (power >= 55 && power <= 75);
      }
      this.plungerPower = 0;
    }

    buildBall() {
      this.ball = null;
      this.ballResting = false;
      this.spawnBall();
    }

    spawnBall() {
      this.skillShotPending = false;
      if (this.ball) {
        this.matter.world.remove(this.ball);
        if (this.ballGfx) this.ballGfx.destroy();
      }
      const x = W - 46, y = H - 40;
      this.ball = this.matter.add.circle(x, y, 9, {
        restitution: 0.42, friction: 0.002, frictionAir: 0.0008, density: 0.02, label: 'ball'
      });
      this.ballResting = true;
      this.ballGfx = this.add.circle(x, y, 9, 0xf8fafc).setDepth(5);
      this.ballTierShown = null;
      this.stallTimer = 0;
      state.ballInPlay = true;
    }

    setupTouch() {
      const tzLeft = document.getElementById('tzLeft');
      const tzRight = document.getElementById('tzRight');
      const touchzones = document.getElementById('touchzones');
      touchzones.classList.add('active');

      tzLeft.addEventListener('touchstart', (e) => { e.preventDefault(); this.flipLeft(true); }, { passive: false });
      tzLeft.addEventListener('touchend', (e) => { e.preventDefault(); this.flipLeft(false); }, { passive: false });
      tzRight.addEventListener('touchstart', (e) => { e.preventDefault(); this.flipRight(true); }, { passive: false });
      tzRight.addEventListener('touchend', (e) => { e.preventDefault(); this.flipRight(false); }, { passive: false });

      const plungerZone = document.getElementById('plungerZone');
      const startPlunge = (e) => { e.preventDefault(); this.pointerHeld = true; this.plungerDown(); };
      const endPlunge = (e) => { e.preventDefault(); this.pointerHeld = false; this.plungerRelease(); };
      plungerZone.addEventListener('touchstart', startPlunge, { passive: false });
      plungerZone.addEventListener('touchend', endPlunge, { passive: false });
      plungerZone.addEventListener('mousedown', startPlunge);
      window.addEventListener('mouseup', endPlunge);
    }

    handleCollisions(event) {
      event.pairs.forEach(pair => {
        const labels = [pair.bodyA.label, pair.bodyB.label];
        const other = (lbl) => labels.includes(lbl);

        if (other('bumper') && other('ball')) {
          const bumperBody = pair.bodyA.label === 'bumper' ? pair.bodyA : pair.bodyB;
          this.pulseBumper(bumperBody);
          const comboMult = this.bumpCombo();
          const pts = addScore(100, comboMult);
          this.popText(bumperBody.position.x, bumperBody.position.y, '+' + pts, '#38bdf8');
          if (state.combo >= 2) this.popText(bumperBody.position.x, bumperBody.position.y - 22, 'x' + state.combo + ' combo', '#fbbf24');
          setHeat(state.heat + 4, this);
          SFX.bumper();
        }
        if (other('slingshot') && other('ball')) {
          const comboMult = this.bumpCombo();
          const pts = addScore(60, comboMult);
          setHeat(state.heat + 3, this);
          SFX.slingshot();
        }
        if (other('coolLane') && other('ball')) {
          this.triggerCoolLane();
        }
        if (other('laneExit') && other('ball')) {
          this.handleLaneExit();
        }
      });
    }

    handleLaneExit() {
      if (!this.ball) return;
      const vy = this.ball.velocity.y;
      // only redirect while the ball is actually moving UP through the exit
      // (vy < 0) — ignore it falling back down through the same zone later,
      // and don't re-trigger repeatedly while it lingers inside the sensor
      if (vy >= -0.5 || this.laneExitCooldown) return;
      this.laneExitCooldown = true;
      this.time.delayedCall(400, () => { this.laneExitCooldown = false; });

      // fixed, reliable arc into the bumper field — deterministic regardless
      // of how hard the plunge was, so this can never again just bounce the
      // ball straight back down the lane it came from
      Phaser.Physics.Matter.Matter.Body.setVelocity(this.ball, {
        x: -3.4 - Math.random() * 1.2,
        y: -2.2
      });

      if (this.skillShotPending) {
        this.skillShotPending = false;
        const pts = addScore(250);
        this.popText(W / 2, 140, 'SKILL SHOT +' + pts, '#4ade80');
        SFX.tierUp(1);
      }
    }

    // chains bumper/slingshot hits landed within ~1.1s of each other into a
    // stacking score bonus (+12% per hit after the first, capped at +60%);
    // any gap longer than that resets the chain back to zero
    bumpCombo() {
      state.combo += 1;
      if (this.comboResetTimer) this.comboResetTimer.remove(false);
      this.comboResetTimer = this.time.delayedCall(1100, () => { state.combo = 0; });
      return 1 + Math.min(state.combo - 1, 5) * 0.12;
    }

    pulseBumper(body) {
      const gfx = body.gameObj;
      if (!gfx) return;
      this.tweens.add({
        targets: gfx, scale: 1.3, duration: 70, yoyo: true, ease: 'Quad.easeOut'
      });
      if (gfx.glowRef) {
        this.tweens.add({
          targets: gfx.glowRef, scale: 1.6, alpha: 0.45, duration: 90, yoyo: true, ease: 'Quad.easeOut'
        });
      }
      // shake scales with heat tier so Molten hits feel noticeably bigger than Cold ones
      const tIdx = tierIndex(state.heat);
      this.cameras.main.shake(60 + tIdx * 15, 0.002 + tIdx * 0.0007);
    }

    triggerCoolLane() {
      const idx = tierIndex(state.heat);
      if (idx >= 3) { // Blazing or Molten
        const banked = addScore(300);
        this.popText(W / 2, 60, 'BANKED +' + banked, '#4ade80');
        setHeat(0, this);
        SFX.cool();
        this.coolLaneText.setColor('#4ade80');
        this.tweens.add({
          targets: this.coolLaneText, duration: 400, yoyo: true,
          onComplete: () => this.coolLaneText.setColor('#475569')
        });
      } else {
        this.popText(W / 2, 60, 'not hot enough', '#64748b');
      }
    }

    popText(x, y, msg, color) {
      const t = this.add.text(x, y, msg, {
        fontFamily: 'Courier New', fontSize: '14px', fontStyle: 'bold', color
      }).setOrigin(0.5).setDepth(10);
      this.tweens.add({
        targets: t, y: y - 36, alpha: 0, duration: 650, onComplete: () => t.destroy()
      });
    }

    drain() {
      state.ballInPlay = false;
      SFX.drain();
      this.cameras.main.shake(200, 0.006);
      state.balls -= 1;
      updateBallsHud();
      setHeat(0, this);
      state.combo = 0;
      if (this.comboResetTimer) { this.comboResetTimer.remove(false); this.comboResetTimer = null; }
      if (state.balls <= 0) {
        this.endGame();
      } else {
        this.time.delayedCall(500, () => this.spawnBall());
      }
    }

    endGame() {
      state.running = false;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(BEST_KEY, String(state.best));
      }
      bestVal.textContent = state.best;
      overlayBest.textContent = state.best;
      document.querySelector('#overlay h1').textContent = 'DRAINED';
      document.querySelector('#overlay p').innerHTML =
        'Final score: <b style="color:#fbbf24">' + state.score + '</b>' +
        (state.score >= state.best && state.score > 0 ? '<br><span style="color:#4ade80">New best!</span>' : '');
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    update(time, delta) {
      // flipper spring toward target angle
      const speed = 0.045 * (delta / 16.67) * 10;
      this.updateFlipperAngle(this.leftFlipper, this.leftTarget, speed);
      this.updateFlipperAngle(this.rightFlipper, this.rightTarget, speed);

      // sync flipper graphics
      this.leftGfx.setPosition(this.leftFlipper.position.x, this.leftFlipper.position.y);
      this.leftGfx.setRotation(this.leftFlipper.angle);
      this.rightGfx.setPosition(this.rightFlipper.position.x, this.rightFlipper.position.y);
      this.rightGfx.setRotation(this.rightFlipper.angle);

      // plunger charge
      // holding Space through a drain fires only one keydown event, so if the
      // key is still physically down once the new ball is ready, resume
      // charging ourselves instead of requiring a fresh press
      if ((this.spaceHeld || this.pointerHeld) && !this.plungerCharging && state.ballInPlay && this.ballResting) {
        this.plungerDown();
      }
      if (this.plungerCharging) {
        this.plungerPower = Math.min(100, this.plungerPower + delta * 0.22);
        const pct = this.plungerPower / 100;
        document.getElementById('plungerKnob').style.bottom = (pct * 60) + '%';
        // auto-fire at full charge so a missed keyup (alt-tab, lost focus, etc.)
        // can never leave the plunger stuck mid-charge forever
        if (this.plungerPower >= 100) this.plungerRelease();
      } else {
        document.getElementById('plungerKnob').style.bottom = '0%';
      }

      if (!state.running || !this.ball) return;

      // sync ball graphic
      this.ballGfx.setPosition(this.ball.position.x, this.ball.position.y);

      // heat-based ball speed scaling: apply a small extra impulse toward current velocity when hot
      const tier = tierFor(state.heat);

      // the ball itself reflects how hot it is — the whole game is about this
      if (tier.name !== this.ballTierShown) {
        this.ballTierShown = tier.name;
        const tc = Phaser.Display.Color.HexStringToColor(tier.color);
        const mixed = Phaser.Display.Color.Interpolate.ColorWithColor(
          Phaser.Display.Color.HexStringToColor('#f8fafc'), tc, 100, 55
        );
        this.ballGfx.setFillStyle(Phaser.Display.Color.GetColor(mixed.r, mixed.g, mixed.b));
      }

      // fading trail once the ball is genuinely hot (Hot tier and above)
      const tIdx = tierIndex(state.heat);
      if (tIdx >= 2 && !this.ballResting) {
        if (!this._trailAccum) this._trailAccum = 0;
        this._trailAccum += delta;
        if (this._trailAccum > 28) {
          this._trailAccum = 0;
          const ghost = this.add.circle(this.ball.position.x, this.ball.position.y, 7,
            Phaser.Display.Color.HexStringToColor(tier.color).color, 0.35).setDepth(4.5);
          this.tweens.add({
            targets: ghost, alpha: 0, scale: 0.4, duration: 260, onComplete: () => ghost.destroy()
          });
        }
      }

      if (!this.ballResting) {
        const vel = this.ball.velocity;
        const sp = Math.sqrt(vel.x * vel.x + vel.y * vel.y);
        if (sp > 0.1 && sp < 14) {
          const boost = (tier.speed - 1) * 0.06;
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.ball, {
            x: vel.x * (1 + boost), y: vel.y * (1 + boost)
          });
        }
      }

      // passive heat decay while ball in play (slow)
      if (!this.ballResting) {
        this.heatDecayAccum += delta;
        if (this.heatDecayAccum > 1000) {
          this.heatDecayAccum = 0;
          setHeat(state.heat - 1.5, this);
        }
      }

      // drain check — ball falls below flipper gap at bottom center
      if (!this.ballResting && this.ball.position.y > H + 20) {
        this.drain();
      }

      // unstick watchdog — if the ball is in active play (not resting on the
      // plunger) and its speed drops near zero for too long, it's wedged in
      // a corner or sitting dead on a flipper with nothing moving it. Give
      // it a small nudge instead of leaving it stuck until the player
      // happens to flip something that touches it.
      if (!this.ballResting) {
        const bv = this.ball.velocity;
        const bsp = Math.sqrt(bv.x * bv.x + bv.y * bv.y);
        if (bsp < 0.35) {
          this.stallTimer = (this.stallTimer || 0) + delta;
          if (this.stallTimer > 900) {
            this.stallTimer = 0;
            Phaser.Physics.Matter.Matter.Body.setVelocity(this.ball, {
              x: (Math.random() - 0.5) * 3,
              y: -1.5 - Math.random() * 1.5
            });
          }
        } else {
          this.stallTimer = 0;
        }
      }
    }

    updateFlipperAngle(body, target, maxStep) {
      let diff = target - body.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const step = Phaser.Math.Clamp(diff, -maxStep, maxStep);
      Phaser.Physics.Matter.Matter.Body.setAngularVelocity(body, step);
    }
  }

  // ---------- Boot ----------
  const config = {
    type: Phaser.AUTO,
    width: W,
    height: H,
    parent: 'game-container',
    backgroundColor: '#0a0a10',
    physics: { default: 'matter', matter: { gravity: { y: 1.0 }, debug: false } },
    scene: [TableScene],
    scale: { mode: Phaser.Scale.NONE }
  };

  // Resize to fit viewport while keeping aspect
  function sizeCanvas() {
    const container = document.getElementById('game-container');
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / W, maxH / H, 1.15);
    container.style.width = (W * scale) + 'px';
    container.style.height = (H * scale) + 'px';
    const canvas = container.querySelector('canvas');
    if (canvas) {
      canvas.style.width = (W * scale) + 'px';
      canvas.style.height = (H * scale) + 'px';
    }
  }

  let game = null;
  window.addEventListener('resize', sizeCanvas);

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    if (!game) {
      game = new Phaser.Game(config);
      game.events.once('ready', sizeCanvas);
      setTimeout(sizeCanvas, 50);
    }
    state.score = 0;
    state.balls = 3;
    state.combo = 0;
    extraBallStep = 15000;
    state.nextExtraBallAt = 15000;
    scoreVal.textContent = '0';
    updateBallsHud();
    state.running = true;
    const scene = game.scene.getScene('table');
    if (scene && scene.scene.isActive()) {
      // restart fresh
      setHeat(0, scene);
      scene.spawnBall();
    } else {
      setHeat(0, null);
    }
  });

  // patch: ensure heat resets visually even before scene exists
  setHeat(0, null);
})();
</script>
</body>
</html>
