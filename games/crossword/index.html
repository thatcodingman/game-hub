<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Crossword</title>
<style>
  html, body { margin:0; padding:0; background:#111; overflow:hidden; height:100%; overscroll-behavior:none; touch-action:none; }
  #game-container { display:flex; justify-content:center; align-items:center; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;
const GRID_SIZE = 7;
const CELL = 48;
const GRID_X = (GAME_WIDTH - GRID_SIZE * CELL) / 2;
const GRID_Y = 130;
const BEST_TIME_KEY = 'crossword_best_time_v2';

const COLOR_BG = 0xfffbeb;
const COLOR_CELL_BG = 0xffffff;
const COLOR_CELL_SELECTED = 0xfde047;
const COLOR_WORD_HIGHLIGHT = 0xbae6fd;
const COLOR_WRONG = 0xfca5a5;
const COLOR_BLACK = 0x1c1917;
const COLOR_BORDER = 0x1c1917;
const COLOR_KEY_BG = 0xe7e5e4;
const COLOR_KEY_TEXT = '#1c1917';

// Hand-verified 7x7 crosswords. Every row/column checked programmatically,
// 180-degree symmetric black-square pattern confirmed, no isolated 1-2
// letter cell runs, common English words only, original clues. A random
// puzzle from this pool is picked each time the game (re)starts.
const PUZZLES = [
  {
    grid: [
      '###BOTH',
      '##RETRO',
      '#RATHER',
      'BETWEEN',
      'OTHERS#',
      'TREES##',
      'HORN###'
    ],
    clues: {
      across: {
        1: 'The two considered together',
        5: 'Having a deliberately old-fashioned style',
        6: 'Somewhat; to a certain degree',
        7: 'In the space separating two things',
        8: 'People or things besides those already mentioned',
        9: 'Tall plants with trunks and branches',
        10: "An animal's pointed projection, or a brass instrument"
      },
      down: {
        1: '"___ you and me..."',
        2: 'Everyone else in the group',
        3: 'What a forest is mostly made of',
        4: 'Part of a car that you honk',
        5: '"I\'d ___ not, thanks"',
        6: 'Style seen in vinyl records and arcade games',
        7: '"You can\'t have it ___ ways"'
      }
    }
  },
  {
    grid: [
      '#TAG###',
      'AWFUL##',
      'PERMIT#',
      'TEA#ART',
      '#TIMBER',
      '##DELAY',
      '###NET#'
    ],
    clues: {
      across: {
        1: 'What you play by tapping someone and running',
        4: 'Really bad; terrible',
        6: 'Document allowing you to do something officially',
        8: 'Drink often served with milk or lemon',
        9: 'Paintings and sculptures, collectively',
        11: 'Wood used in construction',
        13: 'To postpone; put off',
        14: 'Mesh that catches the ball in a soccer goal'
      },
      down: {
        1: 'A short post on a social media platform',
        2: 'Scared',
        3: "Chewy treat you're not supposed to swallow",
        4: 'Well-suited; fitting',
        5: 'Legally on the hook for something',
        7: 'A little something special, like candy',
        10: 'To make an attempt',
        12: 'Grown male humans'
      }
    }
  },
  {
    grid: [
      'LAP####',
      'ERA####',
      'DINNER#',
      '#STONE#',
      '#ESTATE',
      '####CRY',
      '####TOE'
    ],
    clues: {
      across: {
        1: 'One circuit of a race track',
        4: 'A distinct period of time in history',
        5: 'The evening meal',
        9: 'A small rock, or a jewel in a ring',
        10: 'A large property, or someone\'s belongings after they pass',
        12: 'To shed tears',
        13: 'Part of your foot with five of them'
      },
      down: {
        1: 'Guided; showed the way',
        2: 'To get up, or to originate from something',
        3: 'Trousers',
        6: 'The opposite of "yes"',
        7: 'To pass a law, or to perform in a play',
        8: 'Vintage-inspired, like some sneaker or video game trends',
        11: 'The organ you see with'
      }
    }
  }
];

const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function buildPuzzleData(puzzleDef) {
  const rawGrid = puzzleDef.grid;
  const solution = rawGrid.map(row => row.split(''));
  const isBlack = (r, c) => solution[r][c] === '#';

  const numbering = {};
  const acrossStarts = {};
  const downStarts = {};
  let num = 0;

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (isBlack(r, c)) continue;
      const startsAcross = (c === 0 || isBlack(r, c - 1)) && (c < GRID_SIZE - 1 && !isBlack(r, c + 1));
      const startsDown = (r === 0 || isBlack(r - 1, c)) && (r < GRID_SIZE - 1 && !isBlack(r + 1, c));
      if (startsAcross || startsDown) {
        num++;
        numbering[r + ',' + c] = num;
        if (startsAcross) acrossStarts[num] = { row: r, col: c };
        if (startsDown) downStarts[num] = { row: r, col: c };
      }
    }
  }
  return { solution, isBlack, numbering, acrossStarts, downStarts, clues: puzzleDef.clues };
}

let PUZZLE = null;

class MainScene extends Phaser.Scene {
  constructor() { super('MainScene'); }

  create() {
    this.puzzleIndex = Phaser.Math.Between(0, PUZZLES.length - 1);
    PUZZLE = buildPuzzleData(PUZZLES[this.puzzleIndex]);
    this.bestTimeKey = BEST_TIME_KEY + '_' + this.puzzleIndex;
    this.solved = false;
    this.elapsedMs = 0;
    this.direction = 'ACROSS';
    this.userGrid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(''));
    this.cellRects = [];
    this.cellTexts = [];
    this.hintsUsed = 0;
    this.wrongCells = new Set();
    this.bestTimeMs = parseInt(localStorage.getItem(this.bestTimeKey) || '0', 10);

    // start on the first white cell
    outer:
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (!PUZZLE.isBlack(r, c)) { this.selectedRow = r; this.selectedCol = c; break outer; }
      }
    }

    this.cameras.main.setBackgroundColor(COLOR_BG);

    this.clueText = this.add.text(GAME_WIDTH / 2, 20, '', {
      fontFamily: 'monospace', fontSize: '12px', color: '#1c1917', align: 'center', wordWrap: { width: 360 }
    }).setOrigin(0.5, 0);

    const belowGridY = GRID_Y + GRID_SIZE * CELL + 12;
    this.timerText = this.add.text(10, belowGridY, 'Time: 0:00', { fontFamily: 'monospace', fontSize: '12px', color: '#57534e' });
    this.bestTimeText = this.add.text(GAME_WIDTH - 10, belowGridY, 'Best: ' + (this.bestTimeMs ? formatTime(this.bestTimeMs) : '--:--'), {
      fontFamily: 'monospace', fontSize: '12px', color: '#57534e'
    }).setOrigin(1, 0);
    this.solvedText = this.add.text(GAME_WIDTH / 2, belowGridY + 20, '', {
      fontFamily: 'monospace', fontSize: '15px', color: '#166534', align: 'center'
    }).setOrigin(0.5, 0);

    this.drawGrid();
    this.drawKeyboard(belowGridY + 60);
    this.refreshHighlights();
    this.refreshClueText();

    this.input.keyboard.on('keydown', (e) => {
      if (this.solved) return;
      if (/^[a-zA-Z]$/.test(e.key)) this.inputLetter(e.key.toUpperCase());
      else if (e.key === 'Backspace') this.inputBackspace();
    });
  }

  drawGrid() {
    const border = this.add.graphics();
    border.lineStyle(3, COLOR_BORDER, 1);
    border.strokeRect(GRID_X, GRID_Y, GRID_SIZE * CELL, GRID_SIZE * CELL);

    for (let r = 0; r < GRID_SIZE; r++) {
      this.cellRects.push([]);
      this.cellTexts.push([]);
      for (let c = 0; c < GRID_SIZE; c++) {
        const x = GRID_X + c * CELL;
        const y = GRID_Y + r * CELL;

        if (PUZZLE.isBlack(r, c)) {
          this.add.rectangle(x + CELL / 2, y + CELL / 2, CELL - 1, CELL - 1, COLOR_BLACK);
          this.cellRects[r].push(null);
          this.cellTexts[r].push(null);
          continue;
        }

        const rect = this.add.rectangle(x + CELL / 2, y + CELL / 2, CELL - 2, CELL - 2, COLOR_CELL_BG)
          .setStrokeStyle(1, COLOR_BORDER, 0.5)
          .setInteractive();
        rect.on('pointerdown', () => this.selectCell(r, c));
        this.cellRects[r].push(rect);

        const key = r + ',' + c;
        if (PUZZLE.numbering[key]) {
          this.add.text(x + 3, y + 1, String(PUZZLE.numbering[key]), {
            fontFamily: 'monospace', fontSize: '8px', color: '#78716c'
          });
        }

        const letterText = this.add.text(x + CELL / 2, y + CELL / 2 + 4, '', {
          fontFamily: 'monospace', fontSize: '20px', color: '#1c1917'
        }).setOrigin(0.5);
        this.cellTexts[r].push(letterText);
      }
    }
  }

  drawKeyboard(startY) {
    const keyH = 32;
    const rowGap = 5;

    KEY_ROWS.forEach((row, rowIndex) => {
      const keyW = 28;
      const gap = 3;
      const totalW = row.length * keyW + (row.length - 1) * gap;
      const startX = (GAME_WIDTH - totalW) / 2;
      const y = startY + rowIndex * (keyH + rowGap);

      row.forEach((letter, i) => {
        const x = startX + i * (keyW + gap) + keyW / 2;
        const key = this.add.rectangle(x, y, keyW, keyH, COLOR_KEY_BG).setStrokeStyle(1, 0xd6d3d1).setInteractive();
        this.add.text(x, y, letter, { fontFamily: 'monospace', fontSize: '12px', color: COLOR_KEY_TEXT }).setOrigin(0.5);
        key.on('pointerdown', () => { if (!this.solved) this.inputLetter(letter); });
      });
    });

    const lastRowY = startY + 3 * (keyH + rowGap);
    const buttonW = 110, buttonGap = 8;
    const totalBtnW = buttonW * 3 + buttonGap * 2;
    const btnStartX = (GAME_WIDTH - totalBtnW) / 2 + buttonW / 2;

    const hintKey = this.add.rectangle(btnStartX, lastRowY, buttonW, keyH, COLOR_KEY_BG).setStrokeStyle(1, 0xd6d3d1).setInteractive();
    this.add.text(btnStartX, lastRowY, 'HINT', { fontFamily: 'monospace', fontSize: '11px', color: COLOR_KEY_TEXT }).setOrigin(0.5);
    hintKey.on('pointerdown', () => { if (!this.solved) this.useHint(); });

    const checkX = btnStartX + buttonW + buttonGap;
    const checkKey = this.add.rectangle(checkX, lastRowY, buttonW, keyH, COLOR_KEY_BG).setStrokeStyle(1, 0xd6d3d1).setInteractive();
    this.add.text(checkX, lastRowY, 'CHECK', { fontFamily: 'monospace', fontSize: '11px', color: COLOR_KEY_TEXT }).setOrigin(0.5);
    checkKey.on('pointerdown', () => { if (!this.solved) this.checkEntries(); });

    const backX = checkX + buttonW + buttonGap;
    const backKey = this.add.rectangle(backX, lastRowY, buttonW, keyH, COLOR_KEY_BG).setStrokeStyle(1, 0xd6d3d1).setInteractive();
    this.add.text(backX, lastRowY, 'BACK', { fontFamily: 'monospace', fontSize: '11px', color: COLOR_KEY_TEXT }).setOrigin(0.5);
    backKey.on('pointerdown', () => { if (!this.solved) this.inputBackspace(); });
  }

  currentWordCells() {
    const cells = [];
    if (this.direction === 'ACROSS') {
      let startC = this.selectedCol;
      while (startC > 0 && !PUZZLE.isBlack(this.selectedRow, startC - 1)) startC--;
      let c = startC;
      while (c < GRID_SIZE && !PUZZLE.isBlack(this.selectedRow, c)) { cells.push([this.selectedRow, c]); c++; }
    } else {
      let startR = this.selectedRow;
      while (startR > 0 && !PUZZLE.isBlack(startR - 1, this.selectedCol)) startR--;
      let r = startR;
      while (r < GRID_SIZE && !PUZZLE.isBlack(r, this.selectedCol)) { cells.push([r, this.selectedCol]); r++; }
    }
    return cells;
  }

  currentClueNumber() {
    const cells = this.currentWordCells();
    const [r, c] = cells[0];
    return PUZZLE.numbering[r + ',' + c];
  }

  selectCell(row, col) {
    if (this.solved || PUZZLE.isBlack(row, col)) return;
    if (row === this.selectedRow && col === this.selectedCol) {
      this.direction = this.direction === 'ACROSS' ? 'DOWN' : 'ACROSS';
    } else {
      this.selectedRow = row;
      this.selectedCol = col;
    }
    this.refreshHighlights();
    this.refreshClueText();
  }

  refreshHighlights() {
    const wordCells = new Set(this.currentWordCells().map(([r, c]) => r + ',' + c));
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (PUZZLE.isBlack(r, c)) continue;
        const key = r + ',' + c;
        const isSelected = r === this.selectedRow && c === this.selectedCol;
        const inWord = wordCells.has(key);
        const isWrong = this.wrongCells.has(key);
        let color = COLOR_CELL_BG;
        if (inWord) color = COLOR_WORD_HIGHLIGHT;
        if (isWrong) color = COLOR_WRONG;
        if (isSelected) color = COLOR_CELL_SELECTED;
        this.cellRects[r][c].setFillStyle(color);
      }
    }
  }

  refreshClueText() {
    const num = this.currentClueNumber();
    const label = this.direction === 'ACROSS' ? 'Across' : 'Down';
    const clue = this.direction === 'ACROSS' ? PUZZLE.clues.across[num] : PUZZLE.clues.down[num];
    this.clueText.setText(num + ' ' + label + ': ' + clue);
  }

  inputLetter(letter) {
    this.userGrid[this.selectedRow][this.selectedCol] = letter;
    this.cellTexts[this.selectedRow][this.selectedCol].setText(letter);
    this.wrongCells.delete(this.selectedRow + ',' + this.selectedCol);
    SFX.blip();

    const cells = this.currentWordCells();
    const idx = cells.findIndex(([r, c]) => r === this.selectedRow && c === this.selectedCol);
    if (idx >= 0 && idx < cells.length - 1) {
      [this.selectedRow, this.selectedCol] = cells[idx + 1];
    }
    this.refreshHighlights();
    this.refreshClueText();
    this.checkCompletion();
  }

  inputBackspace() {
    if (this.userGrid[this.selectedRow][this.selectedCol]) {
      this.userGrid[this.selectedRow][this.selectedCol] = '';
      this.cellTexts[this.selectedRow][this.selectedCol].setText('');
      this.wrongCells.delete(this.selectedRow + ',' + this.selectedCol);
    } else {
      const cells = this.currentWordCells();
      const idx = cells.findIndex(([r, c]) => r === this.selectedRow && c === this.selectedCol);
      if (idx > 0) {
        [this.selectedRow, this.selectedCol] = cells[idx - 1];
        this.userGrid[this.selectedRow][this.selectedCol] = '';
        this.cellTexts[this.selectedRow][this.selectedCol].setText('');
        this.wrongCells.delete(this.selectedRow + ',' + this.selectedCol);
      }
    }
    this.refreshHighlights();
    this.refreshClueText();
  }

  useHint() {
    const r = this.selectedRow, c = this.selectedCol;
    const correct = PUZZLE.solution[r][c];
    if (this.userGrid[r][c] !== correct) {
      this.hintsUsed++;
    }
    this.userGrid[r][c] = correct;
    this.cellTexts[r][c].setText(correct);
    this.wrongCells.delete(r + ',' + c);
    SFX.powerup();
    this.refreshHighlights();
    this.checkCompletion();
  }

  checkEntries() {
    let anyWrong = false;
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (PUZZLE.isBlack(r, c)) continue;
        const val = this.userGrid[r][c];
        if (val && val !== PUZZLE.solution[r][c]) {
          this.wrongCells.add(r + ',' + c);
          anyWrong = true;
        }
      }
    }
    SFX[anyWrong ? 'hit' : 'blip']();
    this.refreshHighlights();
  }

  checkCompletion() {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (PUZZLE.isBlack(r, c)) continue;
        if (!this.userGrid[r][c]) return;
      }
    }
    let correct = true;
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (PUZZLE.isBlack(r, c)) continue;
        if (this.userGrid[r][c] !== PUZZLE.solution[r][c]) correct = false;
      }
    }
    if (correct) this.triggerSolved();
    else this.checkEntries();
  }

  triggerSolved() {
    this.solved = true;
    SFX.combo(3);
    this.burstConfetti();
    let isNewBest = false;
    if (this.hintsUsed === 0 && (!this.bestTimeMs || this.elapsedMs < this.bestTimeMs)) {
      this.bestTimeMs = this.elapsedMs;
      localStorage.setItem(this.bestTimeKey, String(this.bestTimeMs));
      isNewBest = true;
      this.bestTimeText.setText('Best: ' + formatTime(this.bestTimeMs));
    }
    const hintNote = this.hintsUsed > 0 ? '  (' + this.hintsUsed + ' hint' + (this.hintsUsed > 1 ? 's' : '') + ' used)' : '';
    this.solvedText.setText('SOLVED in ' + formatTime(this.elapsedMs) + (isNewBest ? '  NEW BEST!' : '') + hintNote + '\ntap here to play again');
    this.solvedText.setInteractive();
    this.solvedText.on('pointerdown', () => this.scene.restart());
  }

  burstConfetti() {
    const centerX = GRID_X + GRID_SIZE * CELL / 2;
    const centerY = GRID_Y + GRID_SIZE * CELL / 2;
    const colors = [0xfde047, 0x60a5fa, 0xf472b6, 0x4ade80, 0xfb923c];
    for (let i = 0; i < 28; i++) {
      const color = colors[Phaser.Math.Between(0, colors.length - 1)];
      const piece = this.add.rectangle(centerX, centerY, 6, 6, color);
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const dist = Phaser.Math.Between(80, 220);
      const targetX = centerX + Math.cos(angle) * dist;
      const targetY = centerY + Math.sin(angle) * dist - 30;
      this.tweens.add({
        targets: piece,
        x: targetX,
        y: targetY + 160,
        alpha: 0,
        angle: Phaser.Math.Between(-180, 180),
        duration: Phaser.Math.Between(700, 1100),
        ease: 'Cubic.easeOut',
        onComplete: () => piece.destroy()
      });
    }
  }

  update(time, delta) {
    if (this.solved) return;
    this.elapsedMs += delta;
    this.timerText.setText('Time: ' + formatTime(this.elapsedMs));
  }
}

const config = {
  type: Phaser.AUTO,
  audio: { noAudio: true },
  resolution: window.devicePixelRatio || 1,
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  parent: 'game-container',
  backgroundColor: '#fffbeb',
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
