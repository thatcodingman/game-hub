<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One More Second — The Arcade</title>
<style>
  html, body { margin:0; padding:0; background:#0b0e14; overflow:hidden; height:100%; }
  #game-container { width:100vw; height:100vh; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   ONE MORE SECOND
   One-tap arcade game: tap freezes every obstacle for exactly 1 real second.
   The player's own motion (a fixed, autonomous sine path) never stops —
   freezing is purely a tool to let the player's path catch up to safety.
   MVP scope per design doc: one screen, one movement pattern, 5 obstacle
   types, limited freeze charges, instant restart.
   ========================================================================= */

const W = 960, H = 540;
const PLAYER_X = 200;
const PLAYER_R = 11;
const CENTER_Y = H / 2;
const AMPLITUDE = 190;
const ANGULAR_SPEED = 1.15; // rad/sec — player's autonomous vertical rhythm

const FREEZE_MS = 1000;
const MAX_CHARGES = 3;
const CHARGE_REGEN_SEC = 9;         // passive trickle so a bad run isn't dead forever
const PERFECT_MIN_DIST = 18;
const PERFECT_MAX_DIST = 95;

const BASE_SPEED = 175;             // px/sec, obstacle approach speed at t=0

function speedMultiplier(t) {
  if (t < 25) return 1.0;
  if (t < 50) return 1.1;
  if (t < 75) return 1.25;
  return 1.25 + Math.min((t - 75) / 110, 0.4); // keeps creeping up slowly after 75s
}

function spawnInterval(t) {
  if (t < 25) return Phaser.Math.FloatBetween(2.0, 2.6);
  if (t < 50) return Phaser.Math.FloatBetween(1.5, 2.0);
  if (t < 75) return Phaser.Math.FloatBetween(1.1, 1.5);
  return Phaser.Math.FloatBetween(0.8, 1.2);
}

function typePool(t) {
  if (t < 12) return ['wall'];
  if (t < 28) return ['wall', 'proj'];
  if (t < 50) return ['wall', 'proj', 'corridor'];
  if (t < 75) return ['wall', 'proj', 'corridor', 'trap', 'crossing'];
  return ['wall', 'proj', 'corridor', 'trap', 'crossing', 'chain'];
}

// Curated multi-step sequences for the 75s+ phase — each teaches a specific
// "plan two moves ahead" lesson rather than just being two random obstacles
// dumped close together. delay is ms after the pattern triggers.
const CHAIN_PATTERNS = [
  // Freeze the wall to line up your pass, then you're already mid-freeze
  // decision-making when the crossing pair arrives right after.
  { steps: [{ type: 'wall', delay: 0 }, { type: 'crossing', delay: 900 }] },
  // The corridor's gap is actively closing — freezing to hold it open costs
  // you the freeze you'd want for the projectile right behind it.
  { steps: [{ type: 'corridor', delay: 0 }, { type: 'proj', delay: 700 }] },
  // The trap is still arming when the wall shows up — do you freeze early
  // for the wall's gap, or hold out to catch the trap's pop?
  { steps: [{ type: 'trap', delay: 0 }, { type: 'wall', delay: 650 }] },
  // Two gaps in different places, close enough together that one freeze
  // can't cover both — a genuine back-to-back read.
  { steps: [{ type: 'wall', delay: 0 }, { type: 'wall', delay: 750 }] },
  // Fast projectile first, then a corridor already closing by the time
  // you've dealt with it.
  { steps: [{ type: 'proj', delay: 0 }, { type: 'corridor', delay: 550 }] },
];

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#0b0e14');
    this.g = this.add.graphics();
    this.bgFlash = this.add.rectangle(W/2, H/2, W, H, 0x2f7bff, 0).setDepth(-1);

    this.state = 'ready';           // ready | playing | dead
    this.playerClock = 0;
    this.playerY = CENTER_Y;
    this.trail = [];

    this.obstacles = [];
    this.spawnTimer = 0;
    this.runTime = 0;
    this.charges = MAX_CHARGES;
    this.perfects = 0;
    this.perfectStreak = 0;
    this.score = 0;
    this.freezeActive = false;
    this.freezeEndsAt = 0;
    this.regenAccum = 0;
    this.lastChargeUsed = 0;

    this.buildHUD();

    this.input.on('pointerdown', () => this.handleTap());
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
  }

  buildHUD() {
    this.timeText = this.add.text(W/2, 26, '0.0', {
      fontFamily: 'Arial Black, Arial', fontSize: '40px', color: '#e8ecf1'
    }).setOrigin(0.5, 0).setShadow(0, 2, '#000', 6, true, true);

    this.chargeDots = [];
    for (let i = 0; i < MAX_CHARGES; i++) {
      const d = this.add.circle(W/2 - (MAX_CHARGES - 1) * 16 + i * 32, 86, 9, 0x2f7bff);
      this.chargeDots.push(d);
    }

    this.perfectText = this.add.text(20, 20, '', {
      fontFamily: 'Arial', fontSize: '14px', color: '#ffd23f'
    });

    this.scoreText = this.add.text(20, 44, 'Score: 0', {
      fontFamily: 'Arial', fontSize: '14px', color: '#e8ecf1'
    });

    this.toastText = this.add.text(W/2, 150, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '22px', color: '#5be37b'
    }).setOrigin(0.5).setAlpha(0);

    this.centerText = this.add.text(W/2, H/2, 'TAP OR SPACE\nto start', {
      fontFamily: 'Arial Black, Arial', fontSize: '28px', color: '#e8ecf1', align: 'center'
    }).setOrigin(0.5).setShadow(0, 2, '#000', 6, true, true);

    this.subText = this.add.text(W/2, H/2 + 60,
      'Tap freezes every obstacle for 1 second — you keep moving', {
      fontFamily: 'Arial', fontSize: '15px', color: '#7f8a9a', align: 'center'
    }).setOrigin(0.5);
  }

  toast(msg, color) {
    this.toastText.setText(msg).setColor(color).setAlpha(1).setScale(1);
    this.tweens.add({ targets: this.toastText, alpha: 0, y: 130, duration: 700, delay: 250,
      onComplete: () => this.toastText.setY(150) });
  }

  handleTap() {
    if (window.SFX && SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
    if (this.state === 'ready') {
      this.startRun();
      return;
    }
    if (this.state === 'dead') {
      this.scene.restart();
      return;
    }
    if (this.state !== 'playing') return;
    if (this.freezeActive) return;      // already frozen, can't stack
    if (this.charges <= 0) {
      if (window.SFX) SFX.fail();
      this.toast('NO CHARGES', '#ff5a5a');
      return;
    }

    this.charges--;
    this.freezeActive = true;
    this.freezeEndsAt = this.time.now + FREEZE_MS;
    this.playFreezeSound('in');

    // Perfect Freeze — an obstacle was genuinely close when you committed
    const isPerfect = this.obstacles.some(o =>
      o.alive && !o.dormant && (o.x - PLAYER_X) > PERFECT_MIN_DIST && (o.x - PLAYER_X) < PERFECT_MAX_DIST
    );
    if (isPerfect) {
      this.perfectStreak++;
      const bonus = 50 * this.perfectStreak;
      this.score += bonus;
      this.scoreText.setText('Score: ' + this.score);
      this.charges = Math.min(MAX_CHARGES, this.charges + 1);
      this.perfects++;
      const label = this.perfectStreak > 1 ? `PERFECT x${this.perfectStreak}! +${bonus}` : `PERFECT! +${bonus}`;
      this.toast(label, '#5be37b');
      this.perfectText.setText(this.perfectStreak > 1 ? `Streak: ${this.perfectStreak}` : '').setColor('#ffd23f');
      if (window.SFX) (SFX.combo ? SFX.combo(Math.min(this.perfectStreak, 5)) : SFX.success());
    } else {
      if (this.perfectStreak > 1) this.toast('STREAK LOST', '#ff8a3d');
      this.perfectStreak = 0;
      this.perfectText.setText('');
    }
  }

  // Dedicated freeze/unfreeze audio — sfx.js has nothing freeze-shaped built in,
  // so this synthesizes directly through the shared AudioContext, respecting the
  // same mute/volume controls as the rest of the hub's sound.
  playFreezeSound(direction) {
    try {
      if (!window.SFX || !SFX.ctx || SFX.muted) return;
      const ctx = SFX.ctx;
      if (ctx.state === 'suspended') ctx.resume();
      const vol = (typeof SFX.volume === 'number' ? SFX.volume : 1) * 0.5;
      const t0 = ctx.currentTime;
      const dur = direction === 'in' ? 0.26 : 0.20;

      // tonal sweep — descending for freeze-in, ascending for unfreeze
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = direction === 'in' ? 'sine' : 'triangle';
      if (direction === 'in') {
        osc.frequency.setValueAtTime(920, t0);
        osc.frequency.exponentialRampToValueAtTime(150, t0 + dur);
      } else {
        osc.frequency.setValueAtTime(200, t0);
        osc.frequency.exponentialRampToValueAtTime(1100, t0 + dur);
      }
      oscGain.gain.setValueAtTime(0, t0);
      oscGain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
      oscGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);

      // filtered noise whoosh layer for texture
      const bufSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      if (direction === 'in') {
        filter.frequency.setValueAtTime(4000, t0);
        filter.frequency.exponentialRampToValueAtTime(300, t0 + dur);
      } else {
        filter.frequency.setValueAtTime(300, t0);
        filter.frequency.exponentialRampToValueAtTime(5000, t0 + dur);
      }
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0, t0);
      noiseGain.gain.linearRampToValueAtTime(vol * 0.35, t0 + 0.02);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      noise.connect(filter).connect(noiseGain).connect(ctx.destination);
      noise.start(t0);
      noise.stop(t0 + dur + 0.02);
    } catch (err) {
      console.error('freeze sound error (non-fatal):', err);
    }
  }

  startRun() {
    this.state = 'playing';
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    if (window.SFX) SFX.select();
  }

  update(time, delta) {
    const dt = delta / 1000;

    if (this.freezeActive && time >= this.freezeEndsAt) {
      this.freezeActive = false;
      this.playFreezeSound('out');
    }
    if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) this.handleTap();

    // charge dots always reflect current state
    this.chargeDots.forEach((d, i) => d.setFillStyle(i < this.charges ? 0x2f7bff : 0x2a2f3a));

    // background freeze tint
    this.bgFlash.setAlpha(this.freezeActive ? 0.10 : 0);

    if (this.state !== 'playing') {
      this.draw();
      return;
    }

    // player motion — NEVER pauses, freeze or not
    this.playerClock += dt;
    this.playerY = CENTER_Y + AMPLITUDE * Math.sin(this.playerClock * ANGULAR_SPEED);
    this.trail.push({ x: PLAYER_X, y: this.playerY, a: 1 });
    if (this.trail.length > 16) this.trail.shift();
    this.trail.forEach(p => p.a *= 0.9);

    this.runTime += dt;
    this.timeText.setText(this.runTime.toFixed(1));

    // passive charge regen
    this.regenAccum += dt;
    if (this.regenAccum >= CHARGE_REGEN_SEC) {
      this.regenAccum = 0;
      this.charges = Math.min(MAX_CHARGES, this.charges + 1);
    }

    if (!this.freezeActive) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnWave();
        this.spawnTimer = spawnInterval(this.runTime);
      }
      this.updateObstacles(dt);
      if (this.checkCollisions()) {
        this.die();
        return;
      }
    }

    this.obstacles = this.obstacles.filter(o => o.x > -80 && o.alive);
    this.draw();
  }

  spawnWave() {
    const pool = typePool(this.runTime);
    if (pool.includes('chain') && Phaser.Math.Between(0, 100) < 40) {
      this.spawnChainPattern();
      return;
    }
    const type = Phaser.Utils.Array.GetRandom(pool.filter(t => t !== 'chain'));
    this.spawnOne(type);
  }

  spawnChainPattern() {
    const pattern = Phaser.Utils.Array.GetRandom(CHAIN_PATTERNS);
    pattern.steps.forEach(step => {
      this.time.delayedCall(step.delay, () => {
        if (this.state === 'playing') this.spawnOne(step.type);
      });
    });
  }

  spawnOne(type) {
    const speed = BASE_SPEED * speedMultiplier(this.runTime);
    if (type === 'wall') {
      const gapH = Phaser.Math.Between(165, 195);
      this.obstacles.push({
        type: 'wall', x: W + 40, w: 26, speed, age: 0,
        gapY: Phaser.Math.Between(80 + gapH/2, H - 80 - gapH/2), gapH, alive: true
      });
    } else if (type === 'proj') {
      this.obstacles.push({
        type: 'proj', x: W + 30, y: Phaser.Math.Between(70, H - 70), age: 0,
        vy: 0, speed: speed * 1.6, r: 10, alive: true
      });
    } else if (type === 'crossing') {
      const s = speed * 1.5;
      this.obstacles.push({ type: 'proj', x: W + 30, y: 90, vy: 140, speed: s, r: 9, age: 0, alive: true });
      this.obstacles.push({ type: 'proj', x: W + 30, y: H - 90, vy: -140, speed: s, r: 9, age: 0, alive: true });
    } else if (type === 'corridor') {
      this.obstacles.push({
        type: 'corridor', x: W + 40, w: 34, speed: speed * 0.85, age: 0,
        gapCenter: Phaser.Math.Between(150, H - 150), startGap: 320, minGap: 140,
        shrinkClock: 0, alive: true
      });
    } else if (type === 'trap') {
      this.obstacles.push({
        type: 'trap', x: W + 30, y: Phaser.Math.Between(90, H - 90), age: 0,
        speed: speed * 1.1, armClock: 0, armDelay: Phaser.Math.FloatBetween(0.9, 1.3),
        active: false, r: 14, alive: true
      });
    }
  }

  updateObstacles(dt) {
    this.obstacles.forEach(o => {
      o.age += dt;
      if (o.type === 'wall') {
        o.x -= o.speed * dt;
      } else if (o.type === 'proj') {
        o.x -= o.speed * dt;
        o.y += o.vy * dt;
      } else if (o.type === 'corridor') {
        o.x -= o.speed * dt;
        o.shrinkClock += dt;
        const t = Math.min(o.shrinkClock / 2.4, 1);
        o.gapH = o.startGap - (o.startGap - o.minGap) * t;
      } else if (o.type === 'trap') {
        o.x -= o.speed * dt;
        o.armClock += dt;
        o.active = o.armClock >= o.armDelay;
      }
    });
  }

  checkCollisions() {
    for (const o of this.obstacles) {
      if (o.type === 'wall') {
        if (Math.abs(o.x - PLAYER_X) < o.w/2 + PLAYER_R) {
          if (this.playerY - PLAYER_R < o.gapY - o.gapH/2 || this.playerY + PLAYER_R > o.gapY + o.gapH/2) return true;
        }
      } else if (o.type === 'proj') {
        const dx = o.x - PLAYER_X, dy = o.y - this.playerY;
        if (Math.sqrt(dx*dx + dy*dy) < o.r + PLAYER_R) return true;
      } else if (o.type === 'corridor') {
        if (Math.abs(o.x - PLAYER_X) < o.w/2 + PLAYER_R) {
          if (this.playerY - PLAYER_R < o.gapCenter - o.gapH/2 || this.playerY + PLAYER_R > o.gapCenter + o.gapH/2) return true;
        }
      } else if (o.type === 'trap' && o.active) {
        const dx = o.x - PLAYER_X, dy = o.y - this.playerY;
        if (Math.sqrt(dx*dx + dy*dy) < o.r + PLAYER_R) return true;
      }
    }
    return false;
  }

  die() {
    this.state = 'dead';
    if (window.SFX) SFX.hit();
    this.cameras.main.shake(180, 0.008);
    const key = 'oneMoreSecond_best';
    const prevBest = parseFloat(localStorage.getItem(key));
    const isBest = isNaN(prevBest) || this.runTime > prevBest;
    if (isBest) localStorage.setItem(key, this.runTime.toFixed(1));

    const scoreKey = 'oneMoreSecond_bestScore';
    const prevBestScore = parseFloat(localStorage.getItem(scoreKey)) || 0;
    const isBestScore = this.score > prevBestScore;
    if (isBestScore) localStorage.setItem(scoreKey, String(this.score));

    this.centerText.setText(
      `${this.runTime.toFixed(1)}s\n` + (isBest ? 'NEW BEST' : `Best: ${prevBest.toFixed(1)}s`)
    ).setVisible(true);
    const scoreLine = `Score: ${this.score}` + (isBestScore && this.score > 0 ? ' (NEW BEST)' : ` (best: ${Math.max(prevBestScore, this.score)})`);
    this.subText.setText(
      `${scoreLine}\n${this.perfects} perfect freeze${this.perfects === 1 ? '' : 's'}  \u00b7  tap to retry`
    ).setVisible(true);
  }

  draw() {
    const g = this.g;
    g.clear();

    // trail
    this.trail.forEach(p => {
      g.fillStyle(0x2f7bff, p.a * 0.35);
      g.fillCircle(p.x, p.y, PLAYER_R * 1.6);
    });

    // obstacles
    this.obstacles.forEach(o => {
      const col = this.freezeActive ? 0x6fb8ff : 0xff5a5a;
      const colAlt = this.freezeActive ? 0x89c8ff : 0xffb15a;
      const fadeIn = Math.min(o.age / 0.25, 1); // spawn telegraph — nothing appears at full opacity instantly

      if (o.type === 'wall') {
        g.fillStyle(col, fadeIn);
        g.fillRect(o.x - o.w/2, 0, o.w, o.gapY - o.gapH/2);
        g.fillRect(o.x - o.w/2, o.gapY + o.gapH/2, o.w, H - (o.gapY + o.gapH/2));
        // safe-zone glow through the gap, so the passage reads as clearly as the danger
        g.fillStyle(0x5be37b, 0.16 * fadeIn);
        g.fillRect(o.x - o.w, o.gapY - o.gapH/2, o.w * 2, o.gapH);

      } else if (o.type === 'proj') {
        g.fillStyle(colAlt, fadeIn);
        g.fillCircle(o.x, o.y, o.r);
        if (o.age < 0.25) {
          // expanding warning ping on spawn
          g.lineStyle(2, colAlt, 1 - fadeIn);
          g.strokeCircle(o.x, o.y, o.r + 14 * fadeIn);
        }

      } else if (o.type === 'corridor') {
        // colour drifts toward red as the gap closes in, telegraphing the urgency
        const closeT = Phaser.Math.Clamp(o.shrinkClock / 2.4, 0, 1);
        const gb = Math.round(Phaser.Math.Linear(90, 20, closeT));
        const fillCol = this.freezeActive ? col : Phaser.Display.Color.GetColor(255, gb, gb);
        g.fillStyle(fillCol, fadeIn);
        g.fillRect(o.x - o.w/2, 0, o.w, o.gapCenter - o.gapH/2);
        g.fillRect(o.x - o.w/2, o.gapCenter + o.gapH/2, o.w, H - (o.gapCenter + o.gapH/2));
        g.fillStyle(0x5be37b, 0.16 * fadeIn);
        g.fillRect(o.x - o.w, o.gapCenter - o.gapH/2, o.w * 2, o.gapH);

      } else if (o.type === 'trap') {
        if (o.active) {
          g.fillStyle(col, 1);
          g.fillCircle(o.x, o.y, o.r);
          g.lineStyle(2, 0xffffff, 0.6);
          g.strokeCircle(o.x, o.y, o.r + 3);
        } else {
          const armT = o.armClock / o.armDelay;
          if (armT > 0.6) {
            // pre-arm pulse — the last ~40% of the wait telegraphs the pop clearly
            const p = (armT - 0.6) / 0.4;
            const pulse = 0.5 + 0.5 * Math.sin(this.time.now / 90);
            const rad = 6 + p * 7 * (0.6 + 0.4 * pulse);
            g.fillStyle(0xff8a3d, 0.35 + 0.4 * p * pulse);
            g.fillCircle(o.x, o.y, rad);
            g.fillStyle(0xffd23f, 0.8);
            g.fillCircle(o.x, o.y, 6);
          } else {
            g.fillStyle(0xffd23f, 0.55);
            g.fillCircle(o.x, o.y, 6);
          }
        }
      }
    });

    // player
    g.fillStyle(0xffffff, 0.25);
    g.fillCircle(PLAYER_X, this.playerY, PLAYER_R * 2.1);
    g.fillStyle(this.freezeActive ? 0x9fe3ff : 0xffffff, 1);
    g.fillCircle(PLAYER_X, this.playerY, PLAYER_R);
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#0b0e14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
