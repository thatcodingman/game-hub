<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rhythm Shift — The Arcade</title>
<style>
  html, body {
    margin:0; padding:0; background:#0a0a0d; overflow:hidden; height:100%;
    overscroll-behavior: none; /* stop pull-to-refresh/rubber-banding from
                                   firing when a tap lands near a screen edge */
  }
  #game-container { width:100vw; height:100vh; }
  canvas {
    display:block; touch-action:none;
    -webkit-touch-callout: none; /* no long-press context menu on a tap-heavy game */
    -webkit-user-select: none; user-select: none; /* no accidental text selection while tapping fast */
    -webkit-tap-highlight-color: transparent; /* no gray flash box on every tap */
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
/* =========================================================================
   RHYTHM SHIFT
   "You don't follow the beat. You control it."


   One input. Every tap measures the interval since your last tap, and THAT
   interval becomes the new beat period — your own tapping cadence literally
   is the world's tempo, not a fixed metronome you're matching. Gates only
   open in a short window right after each beat fires; whether a scrolling
   gate's arrival lines up with an open window depends entirely on the
   rhythm you've set for yourself.

   MVP scope: one obstacle type (gates), difficulty via spawn-rate ramp.
   The "rhythms start overlapping / the level stops giving you a beat"
   late-game escalation from the design brief is deliberately deferred —
   prove this core loop is fun first.
   ========================================================================= */

const W = 960, H = 540;
const PLAYER_X = 200;
const PLAYER_R = 13;
const SCROLL_SPEED_BASE = 150;
const GATE_R = 16; // half-height of the gap the player must be inside

const BEAT_PERIOD_DEFAULT = 700;
const BEAT_PERIOD_MIN = 240; // ~250 BPM ceiling. Safe to raise now — the open window
                              // is proportional (65% at ANY tempo, not extra-generous
                              // only at the extreme), so a faster cap doesn't reintroduce
                              // the old fast-tempo duty-cycle exploit
const BEAT_PERIOD_MAX = 1500;
const TARGET_BPM_MIN = 75;
const TARGET_BPM_MAX = 130; // the sweet spot — fast enough that windows come around often,
                             // slow enough that each one stays wide and humanly hittable
const OPEN_FRACTION = 0.65; // open window is a % of YOUR beat period, not a fixed time —
                             // otherwise a fast tempo makes the window always-open (a free win)
const OPEN_MIN_MS = 110; // now mostly a defensive backstop — with the higher
                          // BEAT_PERIOD_MIN, the 45% proportional rule alone
                          // already keeps the fastest tempo's window reasonable
const PERFECT_FRACTION = 0.3; // the first 30% of the open window counts as PERFECT
const SCORE_PASS = 10;
const SCORE_PERFECT = 50;

// Telegraph tuning: gates closer than this to the player drop the preview
// outline and defer entirely to the real isOpen fill (foresight stops being
// useful once precision matters). The fade range controls how far out the
// preview starts appearing and how quickly it ramps up to full opacity.
const TELEGRAPH_NEAR_PX = 90;
const TELEGRAPH_FADE_RANGE_PX = 260;

// LATE-GAME ESCALATION — the two-phase version of the design brief's
// "rhythms start overlapping / the level stops giving you a beat":
//
// Phase 1 (AUTO_BEAT_STOP_SEC): the free auto-tick that's been carrying you
// between taps is switched off. From here on, a beat only fires because you
// tapped it — the game genuinely stops giving you a beat, not just a speed
// bump.
//
// Phase 2 (ECHO_START_SEC): a second, independent rhythm the level runs on
// its own appears — its own random tempo, its own open window, gating some
// gates instead of yours. You don't control it and can't influence it. Some
// incoming gates now belong to it instead of you, so from here on you're
// reading two overlapping rhythms at once, not one.
const AUTO_BEAT_STOP_SEC = 60;
const ECHO_START_SEC = 100;
const ECHO_PERIOD_MIN = 500;
const ECHO_PERIOD_MAX = 900;
const ECHO_OPEN_FRACTION = 0.5;
const ECHO_CHANNEL_CHANCE = 0.35; // of gates spawned once the echo is active, the fraction that belong to it instead of your beat

const MISS_EFFECT_DURATION_MS = 420; // how long the shatter burst at a missed gate's position plays before fading out

// HAPTICS — mobile-only, no-ops silently anywhere navigator.vibrate isn't
// available (desktop, iOS Safari, unsupported browsers). A single number is
// one buzz of that many ms; an array is an on/off vibration pattern.
function vibrate(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (err) { /* non-fatal — haptics are a nice-to-have, never block play */ }
}

function spawnIntervalFor(t) {
  if (t < 25) return Phaser.Math.FloatBetween(2.8, 3.4);
  if (t < 50) return Phaser.Math.FloatBetween(2.2, 2.8);
  if (t < 75) return Phaser.Math.FloatBetween(1.7, 2.2);
  return Phaser.Math.FloatBetween(1.4, 1.8);
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0a0d');
    this.g = this.add.graphics();

    this.state = 'ready';
    this.gates = [];
    this.missEffects = [];
    this.buildHUD();

    this.input.on('pointerdown', () => this.handleTap());
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
  }

  buildHUD() {
    this.timeText = this.add.text(W/2, 26, '0.0', {
      fontFamily: 'Arial Black, Arial', fontSize: '40px', color: '#e8ecf1'
    }).setOrigin(0.5, 0).setShadow(0, 2, '#000', 6, true, true);

    this.scoreText = this.add.text(20, 20, '0', {
      fontFamily: 'Arial Black, Arial', fontSize: '20px', color: '#ffd23f'
    }).setOrigin(0, 0);

    this.bpmText = this.add.text(W/2, 78, '', {
      fontFamily: 'Arial', fontSize: '13px', color: '#7f8a9a'
    }).setOrigin(0.5);

    // NEXT BEAT bar — a plain, literal countdown so you don't have to
    // interpret the abstract pulsing ring alone to know when to tap
    this.beatBarLabel = this.add.text(W/2, 96, 'NEXT BEAT', {
      fontFamily: 'Arial Black, Arial', fontSize: '10px', color: '#7f8a9a'
    }).setOrigin(0.5);
    this.beatBarBg = this.add.rectangle(W/2, 112, 260, 8, 0x1c2128).setStrokeStyle(1, 0x000000);
    this.beatBarFill = this.add.rectangle(W/2 - 129, 112, 0, 6, 0x4fd1ff).setOrigin(0, 0.5);

    // ECHO bar — only shown once the level's own second rhythm kicks in.
    // Thinner and set apart so it never reads as "another one of your bars,"
    // it's the level's own pulse, not yours
    this.echoBarLabel = this.add.text(W/2, 128, 'ECHO', {
      fontFamily: 'Arial Black, Arial', fontSize: '9px', color: '#a084c4'
    }).setOrigin(0.5).setVisible(false);
    this.echoBarBg = this.add.rectangle(W/2, 142, 200, 5, 0x1c2128).setStrokeStyle(1, 0x000000).setVisible(false);
    this.echoBarFill = this.add.rectangle(W/2 - 99, 142, 0, 3, 0xba7dff).setOrigin(0, 0.5).setVisible(false);

    this.toastText = this.add.text(W/2, 150, '', {
      fontFamily: 'Arial Black, Arial', fontSize: '22px', color: '#5be37b'
    }).setOrigin(0.5).setAlpha(0);

    this.centerText = this.add.text(W/2, H/2 - 30, 'RHYTHM SHIFT', {
      fontFamily: 'Arial Black, Arial', fontSize: '30px', color: '#e8ecf1', align: 'center'
    }).setOrigin(0.5).setShadow(0, 2, '#000', 6, true, true);
    this.subText = this.add.text(W/2, H/2 + 30,
      `You don\u2019t follow the beat. You control it.\ntap twice to set your rhythm \u2014 aim for a steady ${TARGET_BPM_MIN}\u2013${TARGET_BPM_MAX} BPM to start\ngates only open right after each beat \u2014 you get 3 misses before a run ends`, {
      fontFamily: 'Arial', fontSize: '14px', color: '#7f8a9a', align: 'center', wordWrap: { width: 560 }
    }).setOrigin(0.5);
  }

  toast(msg, color) {
    this.toastText.setText(msg).setColor(color).setAlpha(1).setY(150);
    this.tweens.add({ targets: this.toastText, alpha: 0, y: 130, duration: 500, delay: 250 });
  }

  handleTap() {
    vibrate(8); // a light buzz on every tap — start, restart, or in-run — so touch play has the same instant tactile confirmation a click already implies
    if (this.state === 'ready') { this.startRun(); return; }
    if (this.state === 'dead') { this.scene.restart(); return; }
    if (this.state !== 'playing') return;

    const now = this.time.now;
    const interval = now - this.lastTapAt;
    this.lastTapAt = now;

    // your own tap cadence becomes the new beat period — this is the whole
    // mechanic. Ignore absurd double-taps or long pauses as unintentional.
    if (interval > 180 && interval < 3000) {
      // rolling average of your last 4 taps, not just a blend with the
      // previous value — a single mistimed tap now only makes up ~25% of
      // your rhythm instead of being able to swing it on its own
      const target = Phaser.Math.Clamp(interval, BEAT_PERIOD_MIN, BEAT_PERIOD_MAX);
      this.tapIntervals.push(target);
      if (this.tapIntervals.length > 4) this.tapIntervals.shift();
      this.beatPeriod = this.tapIntervals.reduce((a, b) => a + b, 0) / this.tapIntervals.length;
    }
    this.fireBeat(now, true);
  }

  startRun() {
    this.state = 'playing';
    this.centerText.setVisible(false);
    this.subText.setVisible(false);
    this.beatPeriod = BEAT_PERIOD_DEFAULT;
    this.lastTapAt = this.time.now;
    this.tapIntervals = [];
    this.misses = 0;
    this.lastBeatAt = this.time.now;
    this.nextBeatAt = this.time.now + this.beatPeriod;
    this.runTime = 0;
    this.score = 0;
    this.scoreText.setText('0');
    this.gates = [];
    this.spawnTimer = 2.5;
    this.missEffects = [];

    // escalation state — starts off, flips on once runTime crosses each
    // threshold (see update())
    this.autoBeatStopped = false;
    this.echoActive = false;
    this.echoBeatPeriod = Phaser.Math.Between(ECHO_PERIOD_MIN, ECHO_PERIOD_MAX);
    this.lastEchoBeatAt = this.time.now;
    this.nextEchoBeatAt = this.time.now + this.echoBeatPeriod;
    this.echoPulseFlash = 0;

    if (window.SFX) SFX.select();
  }

  fireBeat(now, tapped) {
    this.lastBeatAt = now;
    this.nextBeatAt = now + this.beatPeriod;
    this.pulseFlash = 1;
    this.playBeatTick(tapped);
  }

  // A real audible pulse on every beat — a rhythm game with no sound marking
  // the beat itself was the biggest gap. Tapped beats (you just took control)
  // ring a touch brighter/higher than beats that fired on their own, so the
  // ear can tell the difference between "I acted" and "the world continued."
  playBeatTick(tapped) {
    if (!window.SFX || !SFX.ctx || SFX.muted) return;
    try {
      const ctx = SFX.ctx;
      const t0 = ctx.currentTime;
      const vol = (typeof SFX.volume === 'number' ? SFX.volume : 1) * 0.28;
      const startFreq = tapped ? 1150 : 850;
      const endFreq = tapped ? 700 : 520;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(startFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + 0.05);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.1);
    } catch (err) {
      console.error('beat tick sound error (non-fatal):', err);
    }
  }

  // The echo's own pulse — deliberately NOT a variant of playBeatTick.
  // Detuned square wave instead of a clean sine, so your ear never confuses
  // "the level's rhythm just fired" with "my rhythm just fired"
  playEchoTick() {
    if (!window.SFX || !SFX.ctx || SFX.muted) return;
    try {
      const ctx = SFX.ctx;
      const t0 = ctx.currentTime;
      const vol = (typeof SFX.volume === 'number' ? SFX.volume : 1) * 0.2;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(160, t0 + 0.07);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.11);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.12);
    } catch (err) {
      console.error('echo tick sound error (non-fatal):', err);
    }
  }

  // Distinct bright ascending chime for a PERFECT pass, separate from both
  // the beat tick and the normal-pass pickup sound
  playPerfectSound() {
    if (!window.SFX || !SFX.ctx || SFX.muted) return;
    try {
      const ctx = SFX.ctx;
      const t0 = ctx.currentTime;
      const vol = (typeof SFX.volume === 'number' ? SFX.volume : 1) * 0.35;
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1300, t0);
      osc.frequency.exponentialRampToValueAtTime(1900, t0 + 0.07);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.22);
    } catch (err) {
      console.error('perfect sound error (non-fatal):', err);
    }
  }

  // a quick celebratory ring burst at the gate you just perfected
  burst(x, y) {
    const ring = this.add.circle(x, y, 6, 0xffd23f, 0.6).setStrokeStyle(2, 0xfff2c9);
    this.tweens.add({
      targets: ring, radius: 46, alpha: 0, duration: 320, ease: 'Cubic.Out',
      onUpdate: () => ring.setStrokeStyle(2, 0xfff2c9, ring.alpha), onComplete: () => ring.destroy()
    });
  }

  update(time, delta) {
    const dt = delta / 1000;

    if (this.state !== 'playing') {
      this.bpmText.setText(this.state === 'ready' ? `target ${TARGET_BPM_MIN}\u2013${TARGET_BPM_MAX} BPM` : '');
      this.bpmText.setColor('#7f8a9a');
      this.beatBarLabel.setVisible(false);
      this.beatBarBg.setVisible(false);
      this.beatBarFill.setVisible(false);
      this.echoBarLabel.setVisible(false);
      this.echoBarBg.setVisible(false);
      this.echoBarFill.setVisible(false);
      this.draw();
      return;
    }

    this.beatBarLabel.setVisible(true);
    this.beatBarBg.setVisible(true);
    this.beatBarFill.setVisible(true);

    const bpm = Math.round(60000 / this.beatPeriod);
    const inRange = bpm >= TARGET_BPM_MIN && bpm <= TARGET_BPM_MAX;
    this.bpmText.setText(`${bpm} BPM  \u00b7  target ${TARGET_BPM_MIN}\u2013${TARGET_BPM_MAX}`);
    this.bpmText.setColor(inRange ? '#5be37b' : '#ff8a3d');

    if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) this.handleTap();

    this.runTime += dt;
    this.timeText.setText(this.runTime.toFixed(1));

    // ESCALATION PHASE 1: the free auto-tick shuts off. From this moment,
    // fireBeat only ever gets called from handleTap() — the world genuinely
    // stops handing you a beat, not just slows down.
    if (!this.autoBeatStopped && this.runTime >= AUTO_BEAT_STOP_SEC) {
      this.autoBeatStopped = true;
      this.beatBarLabel.setText('NEXT BEAT \u2014 TAP TO FIRE').setColor('#ff8a3d');
      this.toast('THE BEAT IS YOURS NOW', '#ff8a3d');
    }
    if (!this.autoBeatStopped && time >= this.nextBeatAt) this.fireBeat(this.nextBeatAt, false);
    this.pulseFlash = Math.max(0, (this.pulseFlash || 0) - dt * 4);

    // the bar fills toward the next beat. Once the auto-tick is off, it just
    // holds full instead of flipping and firing on its own — a plain visual
    // of "this beat is overdue and nothing is coming unless you tap"
    const beatProgress = Phaser.Math.Clamp((time - this.lastBeatAt) / this.beatPeriod, 0, 1);
    this.beatBarFill.width = 258 * beatProgress;
    this.beatBarFill.setFillStyle(beatProgress > 0.8 ? 0xffd23f : 0x4fd1ff);

    // ESCALATION PHASE 2: a second rhythm the level runs entirely on its
    // own appears. Independent tempo, independent open window, no input
    // from you drives it — from here your gates are governed by two
    // overlapping rhythms, not one.
    if (!this.echoActive && this.runTime >= ECHO_START_SEC) {
      this.echoActive = true;
      this.lastEchoBeatAt = time;
      this.nextEchoBeatAt = time + this.echoBeatPeriod;
      this.toast('A SECOND RHYTHM EMERGES', '#ba7dff');
    }
    if (this.echoActive) {
      this.echoBarLabel.setVisible(true);
      this.echoBarBg.setVisible(true);
      this.echoBarFill.setVisible(true);
      if (time >= this.nextEchoBeatAt) {
        this.lastEchoBeatAt = this.nextEchoBeatAt;
        this.echoBeatPeriod = Phaser.Math.Between(ECHO_PERIOD_MIN, ECHO_PERIOD_MAX);
        this.nextEchoBeatAt = this.lastEchoBeatAt + this.echoBeatPeriod;
        this.echoPulseFlash = 1;
        this.playEchoTick();
      }
      this.echoPulseFlash = Math.max(0, (this.echoPulseFlash || 0) - dt * 4);
      const echoProgress = Phaser.Math.Clamp((time - this.lastEchoBeatAt) / this.echoBeatPeriod, 0, 1);
      this.echoBarFill.width = 198 * echoProgress;
    } else {
      this.echoBarLabel.setVisible(false);
      this.echoBarBg.setVisible(false);
      this.echoBarFill.setVisible(false);
    }

    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawnTimer = spawnIntervalFor(this.runTime);
      this.spawnGate();
    }

    const openDuration = Math.max(this.beatPeriod * OPEN_FRACTION, OPEN_MIN_MS);
    const timeSinceBeat = time - this.lastBeatAt;
    const isOpen = timeSinceBeat < openDuration;

    const echoOpenDuration = Math.max(this.echoBeatPeriod * ECHO_OPEN_FRACTION, OPEN_MIN_MS);
    const echoTimeSinceBeat = time - this.lastEchoBeatAt;
    const echoIsOpen = this.echoActive && echoTimeSinceBeat < echoOpenDuration;

    for (let i = this.gates.length - 1; i >= 0; i--) {
      const g = this.gates[i];
      g.x -= SCROLL_SPEED_BASE * dt;
      if (!g.resolved && g.x < PLAYER_X - GATE_R * 2) {
        // it's fully passed the player without a collision check ever
        // triggering below — shouldn't normally happen, but never let a
        // gate silently vanish unresolved
        g.resolved = true;
      }
      if (!g.resolved && Math.abs(g.x - PLAYER_X) < GATE_R + PLAYER_R) {
        g.resolved = true;
        const onEcho = g.channel === 'echo';
        const chOpen = onEcho ? echoIsOpen : isOpen;
        const chTimeSinceBeat = onEcho ? echoTimeSinceBeat : timeSinceBeat;
        const chOpenDuration = onEcho ? echoOpenDuration : openDuration;
        if (chOpen) {
          // PERFECT only applies on your own beat — the echo's timing isn't
          // something you set, so there's no "tight timing" to reward there,
          // just whether you read the window right
          const perfect = !onEcho && chTimeSinceBeat < chOpenDuration * PERFECT_FRACTION;
          if (perfect) {
            this.score += SCORE_PERFECT;
            this.toast(`PERFECT! +${SCORE_PERFECT}`, '#ffd23f');
            this.burst(g.x, H/2);
            this.playPerfectSound();
            vibrate([12, 30, 12]); // a distinct double-pulse for PERFECT — should never feel like the plain tap buzz
          } else {
            this.score += SCORE_PASS;
            this.toast(`PASS +${SCORE_PASS}`, onEcho ? '#ba7dff' : '#5be37b');
            if (window.SFX) SFX.pickup();
          }
          this.scoreText.setText(`${this.score}`);
        } else {
          this.registerMiss(g.x, onEcho);
        }
      }
      if (g.x < -60) this.gates.splice(i, 1);
    }

    // age out miss shatter effects — pure visual, resolved independently of
    // the gate that triggered them (which may have already scrolled off)
    for (let i = this.missEffects.length - 1; i >= 0; i--) {
      this.missEffects[i].t += dt * 1000;
      if (this.missEffects[i].t > MISS_EFFECT_DURATION_MS) this.missEffects.splice(i, 1);
    }

    this.draw();
  }

  spawnGate() {
    const channel = (this.echoActive && Math.random() < ECHO_CHANNEL_CHANCE) ? 'echo' : 'beat';
    this.gates.push({ x: W + 40, resolved: false, channel });
  }

  registerMiss(x, onEcho) {
    this.misses++;
    this.toast(`MISSED (${this.misses}/3)`, '#ff5a5a');
    if (window.SFX) SFX.fail();
    this.cameras.main.shake(80, 0.004);
    vibrate(35); // one sharp buzz, longer than the tap/PERFECT patterns — reads as a fault, not a confirmation

    // MISS FEEDBACK: a shatter burst pinned to exactly where the gate that
    // beat you was, not a generic effect that could've been about any gate
    // on screen. Fragment angles/lengths are fixed at creation so they don't
    // jitter frame-to-frame — only their distance and fade animate.
    const frags = [];
    for (let i = 0; i < 6; i++) {
      frags.push({
        ang: Phaser.Math.FloatBetween(0, Math.PI * 2),
        len: Phaser.Math.FloatBetween(8, 18)
      });
    }
    this.missEffects.push({ x, onEcho, t: 0, frags });

    if (this.misses >= 3) this.die();
  }

  die() {
    if (this.state !== 'playing') return;
    this.state = 'dead';
    if (window.SFX) SFX.hit();
    this.cameras.main.shake(180, 0.008);
    const key = 'rhythmShift_best';
    const prevBest = parseFloat(localStorage.getItem(key));
    const isBest = isNaN(prevBest) || this.runTime > prevBest;
    if (isBest) localStorage.setItem(key, this.runTime.toFixed(1));

    const scoreKey = 'rhythmShift_bestScore';
    const prevBestScore = parseFloat(localStorage.getItem(scoreKey)) || 0;
    const isBestScore = this.score > prevBestScore;
    if (isBestScore) localStorage.setItem(scoreKey, String(this.score));

    this.centerText.setText(`${this.runTime.toFixed(1)}s\n` + (isBest ? 'NEW BEST' : `Best: ${prevBest.toFixed(1)}s`)).setVisible(true);
    this.subText.setText(
      `Score: ${this.score}` + (isBestScore ? ' (NEW BEST)' : ` (best: ${Math.max(prevBestScore, this.score)})`) + '\ntap to try again'
    ).setVisible(true);
  }

  draw() {
    const g = this.g;
    g.clear();

    const openDuration = Math.max(this.beatPeriod * OPEN_FRACTION, OPEN_MIN_MS);
    const timeSinceBeat = this.time.now - this.lastBeatAt;
    const isOpen = this.state === 'playing' && timeSinceBeat < openDuration;

    const echoOpenDuration = Math.max(this.echoBeatPeriod * ECHO_OPEN_FRACTION, OPEN_MIN_MS);
    const echoTimeSinceBeat = this.time.now - this.lastEchoBeatAt;
    const echoIsOpen = this.state === 'playing' && this.echoActive && echoTimeSinceBeat < echoOpenDuration;

    // a glowing lane line connecting the player to the gates, only visible
    // while the beat window is open — ties the player's beat state and the
    // gates' passable state into one connected visual instead of two
    // separate things you have to mentally link yourself
    if (this.state === 'playing' && isOpen) {
      const openProgress = 1 - timeSinceBeat / openDuration; // 1 right at the beat, fading to 0 as the window closes
      g.lineStyle(3, 0xffd23f, 0.15 + openProgress * 0.35);
      g.lineBetween(PLAYER_X, H/2, W, H/2);
    }

    // gates — red/gold for your beat channel, dark/bright violet for echo
    // channel gates, with a brighter edge glow right on the gap lips while
    // open so the "safe zone" reads instantly. This shared-clock color is a
    // global blink per channel (every gate on that channel reads the same
    // instant), which tells you nothing about a specific gate until it's
    // basically already here — that's what the telegraph below is for.
    this.gates.forEach(gt => {
      const onEcho = gt.channel === 'echo';
      const chOpen = onEcho ? echoIsOpen : isOpen;
      const col = onEcho ? (chOpen ? 0xba7dff : 0x4a3566) : (chOpen ? 0xffd23f : 0xff5a5a);
      g.fillStyle(col, 1);
      g.fillRect(gt.x - 6, 0, 12, H/2 - GATE_R);
      g.fillRect(gt.x - 6, H/2 + GATE_R, 12, H/2 - GATE_R);
      if (chOpen) {
        g.lineStyle(2, onEcho ? 0xe8d9ff : 0xfff2c9, 0.6);
        g.strokeRect(gt.x - 6, H/2 - GATE_R - 4, 12, 4);
        g.strokeRect(gt.x - 6, H/2 + GATE_R, 12, 4);
      }

      // TELEGRAPH: distance-based foresight, separate from the blink above.
      // Project this gate's own arrival time from its remaining distance
      // and current scroll speed, then check where that lands in ITS
      // channel's beat cycle if that channel's tempo holds steady. Fades in
      // with distance so it reads as "here's how this one's shaping up,"
      // and hands off to the authoritative chOpen fill once the gate is
      // close enough that precision (not foresight) is what matters.
      const distToPlayer = gt.x - PLAYER_X;
      if (distToPlayer > TELEGRAPH_NEAR_PX) {
        const chPeriod = onEcho ? this.echoBeatPeriod : this.beatPeriod;
        const chLastBeatAt = onEcho ? this.lastEchoBeatAt : this.lastBeatAt;
        const chOpenDuration = onEcho ? echoOpenDuration : openDuration;
        const msToArrive = (distToPlayer / SCROLL_SPEED_BASE) * 1000;
        const arrivalTime = this.time.now + msToArrive;
        const sinceBeatAtArrival = ((arrivalTime - chLastBeatAt) % chPeriod + chPeriod) % chPeriod;
        const previewOpen = sinceBeatAtArrival < chOpenDuration;
        const fadeIn = Phaser.Math.Clamp(1 - (distToPlayer - TELEGRAPH_NEAR_PX) / TELEGRAPH_FADE_RANGE_PX, 0.15, 0.55);
        g.lineStyle(2, previewOpen ? (onEcho ? 0xd9bfff : 0x4fd1ff) : 0xff8a3d, fadeIn);
        g.strokeRect(gt.x - 9, H/2 - GATE_R - 9, 18, 5);
        g.strokeRect(gt.x - 9, H/2 + GATE_R + 4, 18, 5);
      }
    });

    // pulsing anticipation ring — grows from the last beat toward the next
    // one, brightens and thickens the instant the gate window is open, and
    // a sharp expanding burst flashes right at the beat moment itself
    if (this.state === 'playing') {
      const progress = Phaser.Math.Clamp(timeSinceBeat / this.beatPeriod, 0, 1);
      const ringR = 18 + progress * 36;
      g.lineStyle(isOpen ? 3 : 2, isOpen ? 0xffd23f : 0x4fd1ff, isOpen ? 0.75 : (0.5 - progress * 0.3));
      g.strokeCircle(PLAYER_X, H/2, ringR);

      const flash = this.pulseFlash || 0;
      if (flash > 0) {
        const burstR = 14 + (1 - flash) * 50;
        g.fillStyle(0xffffff, flash * 0.55);
        g.fillCircle(PLAYER_X, H/2, burstR);
        g.lineStyle(2, 0xffffff, flash * 0.6);
        g.strokeCircle(PLAYER_X, H/2, burstR);
      }

      // the echo's own ring — deliberately drawn wider/looser than the beat
      // ring so it never reads as "the same thing," a second, independent
      // pulse you're tracking alongside your own
      if (this.echoActive) {
        const echoProgress = Phaser.Math.Clamp(echoTimeSinceBeat / this.echoBeatPeriod, 0, 1);
        const echoRingR = 30 + echoProgress * 54;
        g.lineStyle(echoIsOpen ? 3 : 1, echoIsOpen ? 0xba7dff : 0x6b4f96, echoIsOpen ? 0.6 : (0.35 - echoProgress * 0.2));
        g.strokeCircle(PLAYER_X, H/2, echoRingR);

        const echoFlash = this.echoPulseFlash || 0;
        if (echoFlash > 0) {
          const echoBurstR = 26 + (1 - echoFlash) * 60;
          g.lineStyle(2, 0xba7dff, echoFlash * 0.5);
          g.strokeCircle(PLAYER_X, H/2, echoBurstR);
        }
      }
    }

    // MISS FEEDBACK — a shatter burst exactly where the gate that beat you
    // was: a sharp white flash on the gap edges right at the instant, then
    // fragment lines flying outward and fading. Distinct from the PERFECT
    // burst() (a clean expanding ring) so a good pass and a miss never read
    // as "the same effect in a different color"
    this.missEffects.forEach(fx => {
      const progress = Phaser.Math.Clamp(fx.t / MISS_EFFECT_DURATION_MS, 0, 1);
      const flashAlpha = Math.max(0, 1 - progress * 3.5);
      if (flashAlpha > 0) {
        g.fillStyle(0xffffff, flashAlpha * 0.7);
        g.fillRect(fx.x - 7, H/2 - GATE_R - 6, 14, 12);
        g.fillRect(fx.x - 7, H/2 + GATE_R - 6, 14, 12);
      }
      const fragCol = fx.onEcho ? 0xba7dff : 0xff5a5a;
      const fragAlpha = (1 - progress) * 0.8;
      g.lineStyle(2, fragCol, fragAlpha);
      fx.frags.forEach((fr, idx) => {
        const anchorY = idx % 2 === 0 ? H/2 - GATE_R : H/2 + GATE_R;
        const dist = fr.len + progress * 28;
        const ex = fx.x + Math.cos(fr.ang) * dist;
        const ey = anchorY + Math.sin(fr.ang) * dist * 0.6;
        g.lineBetween(fx.x, anchorY, ex, ey);
      });
    });

    // player
    g.fillStyle(0xffffff, 0.25);
    g.fillCircle(PLAYER_X, H/2, PLAYER_R * 2);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(PLAYER_X, H/2, PLAYER_R);
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: W,
  height: H,
  backgroundColor: '#0a0a0d',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [PlayScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
