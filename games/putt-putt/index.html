<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tee Time — Hole 1</title>
<style>
  :root{
    --cream:#f4ecd8;
    --panel:rgba(14,22,16,0.72);
    --panel-border:rgba(201,162,75,0.4);
    --gold:#c9a24b;
    --gold-soft:#e4c87a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0c1410; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color:var(--cream); -webkit-user-select:none; user-select:none;
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%; cursor:crosshair;}
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:3; box-shadow: inset 0 0 180px rgba(0,0,0,0.5); }

  .hud{ position:fixed; z-index:5; pointer-events:none; }
  #topbar{ top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:16px 22px; }
  .badge{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:9px 16px; backdrop-filter:blur(6px); box-shadow:0 4px 16px rgba(0,0,0,0.35); }
  .badge .label{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-soft); opacity:0.85; margin-bottom:2px; }
  .badge .value{ font-size:19px; font-weight:600; }
  #course-title{ text-align:center; }
  #course-title .name{ font-size:24px; letter-spacing:0.07em; color:var(--gold-soft); text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  #course-title .sub{ font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream); opacity:0.6; margin-top:2px; }

  #club-wrap{ position:fixed; z-index:6; top:72px; right:22px; pointer-events:all; }
  #club-btn{ font-family:inherit; background:var(--panel); border:1px solid var(--panel-border); color:var(--cream); border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; }
  #club-btn .tag{ color:var(--gold-soft); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; display:block; margin-bottom:1px; }
  #club-list{ position:absolute; top:calc(100% + 6px); right:0; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; overflow:hidden; display:none; min-width:170px; backdrop-filter:blur(6px); }
  #club-list.show{ display:block; }
  #club-list button{ display:block; width:100%; text-align:left; font-family:inherit; background:none; border:none; color:var(--cream); padding:9px 14px; font-size:13px; cursor:pointer; }
  #club-list button:hover, #club-list button.selected{ background:rgba(201,162,75,0.2); }
  #club-list button .carry{ float:right; color:#9fb3a3; font-size:11px; }

  #hint{ position:fixed; left:50%; bottom:168px; transform:translateX(-50%); font-size:13px; opacity:0.55; z-index:5; letter-spacing:0.02em; transition:opacity 0.3s; }

  #swing-wrap{ position:fixed; z-index:5; left:50%; bottom:40px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; opacity:0; transition:opacity 0.2s; }
  #swing-wrap.show{ opacity:1; }
  #power-track{ position:relative; width:280px; height:16px; border-radius:8px; background:rgba(14,22,16,0.8); border:1px solid var(--panel-border); overflow:hidden; }
  #power-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#6fae63,var(--gold-soft) 72%,#e3684f 96%); }
  #power-lock{ position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; opacity:0; }
  #accuracy-track{ position:relative; width:280px; height:16px; border-radius:8px; background:rgba(14,22,16,0.8); border:1px solid var(--panel-border); overflow:hidden; display:none; }
  #accuracy-track.show{ display:block; }
  #accuracy-center{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.4); }
  #accuracy-marker{ position:absolute; top:-3px; bottom:-3px; width:4px; background:var(--gold-soft); border-radius:2px; left:50%; }
  #swing-label{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-soft); opacity:0.85; }

  #sink-panel{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(8,14,10,0.55); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity 0.4s; }
  #sink-panel.show{ opacity:1; pointer-events:all; }
  #sink-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:34px 46px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.5); transform:translateY(14px); transition:transform 0.4s; }
  #sink-panel.show #sink-card{ transform:translateY(0); }
  #sink-card .result{ font-size:28px; color:var(--gold-soft); letter-spacing:0.05em; margin-bottom:6px; }
  #sink-card .strokes{ font-size:14px; opacity:0.8; margin-bottom:20px; }
  #sink-card button{ font-family:inherit; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; background:var(--gold); color:#1c2b22; border:none; border-radius:8px; padding:11px 24px; cursor:pointer; pointer-events:all; font-weight:700; }
  #sink-card button:hover{ background:var(--gold-soft); }

  #toast{ position:fixed; z-index:7; left:50%; top:90px; transform:translateX(-50%) translateY(-8px); background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:8px 18px; font-size:13px; opacity:0; transition:all 0.35s; pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="canvas-wrap"></div>
<div id="vignette"></div>

<div class="hud" id="topbar">
  <div class="badge"><div class="label">Hole 1 · Par 4</div><div class="value" id="strokeVal">0 strokes</div></div>
  <div id="course-title"><div class="name">Tee Time</div><div class="sub">Front Nine · Hole 1 of 9</div></div>
  <div class="badge"><div class="label">To Pin</div><div class="value" id="distVal">380 yd</div></div>
</div>

<div id="club-wrap">
  <button id="club-btn"><span class="tag">Club</span><span id="club-name">Driver</span></button>
  <div id="club-list"></div>
</div>

<div class="hud" id="hint">move mouse to aim · click to start swing, click to set power, click to set accuracy</div>

<div id="swing-wrap">
  <div id="swing-label">power</div>
  <div id="power-track"><div id="power-fill"></div><div id="power-lock"></div></div>
  <div id="accuracy-track"><div id="accuracy-center"></div><div id="accuracy-marker"></div></div>
</div>

<div id="toast"></div>

<div id="sink-panel">
  <div id="sink-card">
    <div class="result" id="sinkResult">Birdie!</div>
    <div class="strokes" id="sinkStrokes">Holed in 4</div>
    <button id="replayBtn">Replay Hole</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- audio ---------- */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function sfxCtx(){ if(!actx) actx = new AudioCtx(); return actx; }
  function sfxSwing(power){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(340 + power*260, ctx.currentTime+0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18+power*0.12, ctx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.18);
  }
  function sfxPutt(power){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(170+power*80, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+0.1);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18+power*0.14, ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.18);
  }
  function sfxBounce(strength){
    const ctx = sfxCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(280, ctx.currentTime);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.05*Math.min(1,strength), ctx.currentTime+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.08);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.09);
  }
  function sfxSplash(){
    const ctx = sfxCtx();
    const bufferSize = ctx.sampleRate*0.3;
    const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=900;
    const g = ctx.createGain(); g.gain.value=0.25;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }
  function sfxSand(){
    const ctx = sfxCtx();
    const bufferSize = ctx.sampleRate*0.18;
    const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 3);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=1400;
    const g = ctx.createGain(); g.gain.value=0.2;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }
  function sfxSink(){
    const ctx = sfxCtx();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = ctx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.16,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.45);
    });
  }

  /* ---------- renderer / scene ---------- */
  const wrap = document.getElementById("canvas-wrap");
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  const skyGeo = new THREE.SphereGeometry(500, 24, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ top:{value:new THREE.Color(0x3b4f7a)}, mid:{value:new THREE.Color(0xd99a6b)}, bottom:{value:new THREE.Color(0xf2d9a8)} },
    vertexShader:`varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec3 vPos; uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;
      void main(){ float h=normalize(vPos).y; vec3 col = h>0.08 ? mix(mid,top,smoothstep(0.08,0.9,h)) : mix(bottom,mid,smoothstep(-0.15,0.08,h)); gl_FragColor=vec4(col,1.0); }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  scene.fog = new THREE.Fog(0xd9b588, 110, 420);

  const sun = new THREE.DirectionalLight(0xffe9c2, 2.0);
  sun.position.set(-40, 70, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-60; sun.shadow.camera.right=60; sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
  sun.shadow.camera.near=1; sun.shadow.camera.far=220;
  sun.shadow.bias = -0.0012;
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x9fb8c9, 0.55));
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x3a4a2e, 0.45));
  const camFill = new THREE.DirectionalLight(0xfff1e2, 0.75);
  camFill.position.set(-6, 9, -12);
  scene.add(camFill);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 700);

  /* ---------- textures ---------- */
  function stripeTex(c1,c2,flecks,size,stripeH){
    const c = document.createElement("canvas"); c.width=size; c.height=size;
    const ctx = c.getContext("2d");
    for(let y=0;y<size;y+=stripeH) { ctx.fillStyle=(Math.floor(y/stripeH)%2===0)?c1:c2; ctx.fillRect(0,y,size,stripeH); }
    ctx.globalAlpha=0.09;
    for(let i=0;i<flecks;i++){ ctx.fillStyle=Math.random()<0.5?c1:c2; ctx.fillRect(Math.random()*size,Math.random()*size,1.3,1.3); }
    ctx.globalAlpha=1;
    const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.colorSpace=THREE.SRGBColorSpace;
    return tex;
  }
  function solidTex(base, flecks, fleckColors, size){
    const c = document.createElement("canvas"); c.width=size; c.height=size;
    const ctx = c.getContext("2d");
    ctx.fillStyle = base; ctx.fillRect(0,0,size,size);
    ctx.globalAlpha = 0.3;
    for(let i=0;i<flecks;i++){ ctx.fillStyle = fleckColors[Math.random()<0.5?0:1]; ctx.fillRect(Math.random()*size,Math.random()*size,2,2); }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.colorSpace=THREE.SRGBColorSpace;
    return tex;
  }
  const fairwayTex = stripeTex("#3c7a3f","#346b37", 7000, 512, 26); fairwayTex.repeat.set(10,70);
  const roughTex = solidTex("#2c5230", 3500, ["#1f3f23","#3a6b3c"], 256); roughTex.repeat.set(40,110);
  const greenTex = stripeTex("#4a9850","#428c48", 4000, 256, 10); greenTex.repeat.set(6,6);
  const bunkerTex = solidTex("#d9c88f", 2500, ["#e7dba8","#c7b478"], 256); bunkerTex.repeat.set(4,4);

  /* ---------- hole geometry ---------- */
  const PAR = 4;
  const TEE_Z = 0, PIN_Z = 380, PIN_X = 2;
  const GREEN_R = 13;
  function fairwayHalfWidth(z){
    const flare = THREE.MathUtils.smoothstep ? 0 : 0;
    const t = Math.min(1, z/55);
    return THREE.MathUtils.lerp(23, 17, t*t*(3-2*t));
  }
  // bunker: ellipse front-right of green
  const BUNKER_CX=12, BUNKER_CZ=352, BUNKER_RX=9, BUNKER_RZ=7;
  // water: ellipse left side, landing-zone risk
  const WATER_CX=-19, WATER_CZ=270, WATER_RX=11, WATER_RZ=26;

  function distEllipse(x,z,cx,cz,rx,rz){ return Math.pow((x-cx)/rx,2)+Math.pow((z-cz)/rz,2); }

  function heightAt(x,z){
    const dx=x-PIN_X, dz=z-PIN_Z, dPin = Math.sqrt(dx*dx+dz*dz);
    if(dPin < GREEN_R){
      // gentle false-front slope down toward a low point behind-left of pin
      const lowX = PIN_X-4, lowZ = PIN_Z+3;
      const dl = Math.sqrt((x-lowX)**2+(z-lowZ)**2);
      const t = Math.min(1, dl/GREEN_R);
      return -0.55*(1-t*t);
    }
    return 0;
  }
  function slopeAt(x,z){
    const e=0.1;
    const h0=heightAt(x,z), hx=heightAt(x+e,z), hz=heightAt(x,z+e);
    return { gx:(hx-h0)/e, gz:(hz-h0)/e };
  }
  function surfaceAt(x,z){
    const dx=x-PIN_X, dz=z-PIN_Z;
    if(Math.sqrt(dx*dx+dz*dz) < GREEN_R) return "green";
    if(distEllipse(x,z,BUNKER_CX,BUNKER_CZ,BUNKER_RX,BUNKER_RZ) < 1) return "bunker";
    if(distEllipse(x,z,WATER_CX,WATER_CZ,WATER_RX,WATER_RZ) < 1) return "water";
    if(z < 8 && Math.abs(x) < 6) return "tee";
    if(Math.abs(x) < fairwayHalfWidth(z) && z < PIN_Z-GREEN_R+4) return "fairway";
    return "rough";
  }
  const FRICTION = { fairway:1.5, rough:3.4, green:1.1, tee:1.5, bunker:5.5 };
  const ROLL_ONLAND = { fairway:0.62, rough:0.3, green:0.55, tee:0.6, bunker:0.08 };

  // ground base (rough, everywhere)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(220, PIN_Z+70, 1,1),
    new THREE.MeshStandardMaterial({ map: roughTex, roughness:1 })
  );
  ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.03,PIN_Z/2-10);
  ground.receiveShadow = true;
  scene.add(ground);

  // fairway ribbon (segmented to taper width)
  const FW_SEGZ = 90;
  const fwGeo = new THREE.PlaneGeometry(1, PIN_Z-GREEN_R+4, 40, FW_SEGZ);
  fwGeo.rotateX(-Math.PI/2);
  {
    const pos = fwGeo.attributes.position;
    const fwLen = PIN_Z-GREEN_R+4;
    for(let i=0;i<pos.count;i++){
      const nx = pos.getX(i), nzLocal = pos.getZ(i);
      const z = nzLocal + fwLen/2;
      const hw = fairwayHalfWidth(z);
      pos.setX(i, nx*hw*2);
      pos.setY(i, heightAt(nx*hw*2, z)+0.004);
    }
    fwGeo.computeVertexNormals();
  }
  const fairway = new THREE.Mesh(fwGeo, new THREE.MeshStandardMaterial({ map:fairwayTex, roughness:0.9 }));
  fairway.position.set(0,0,(PIN_Z-GREEN_R+4)/2);
  fairway.receiveShadow = true;
  scene.add(fairway);

  // green disc
  const greenSegR=28, greenSegA=40;
  const greenGeo = new THREE.CircleGeometry(GREEN_R, 40);
  greenGeo.rotateX(-Math.PI/2);
  { const pos=greenGeo.attributes.position; for(let i=0;i<pos.count;i++){ const x=pos.getX(i)+PIN_X, z=pos.getZ(i)+PIN_Z; pos.setY(i, heightAt(x,z)+0.006); } greenGeo.computeVertexNormals(); }
  const green = new THREE.Mesh(greenGeo, new THREE.MeshStandardMaterial({ map:greenTex, roughness:0.75 }));
  green.position.set(PIN_X,0,PIN_Z);
  green.receiveShadow = true;
  scene.add(green);

  // bunker patch
  const bunkerGeo = new THREE.CircleGeometry(1,28);
  bunkerGeo.scale(BUNKER_RX,1,BUNKER_RZ);
  bunkerGeo.rotateX(-Math.PI/2);
  const bunker = new THREE.Mesh(bunkerGeo, new THREE.MeshStandardMaterial({ map:bunkerTex, roughness:1 }));
  bunker.position.set(BUNKER_CX, 0.012, BUNKER_CZ);
  bunker.receiveShadow = true;
  scene.add(bunker);

  // water patch
  const waterGeo = new THREE.CircleGeometry(1,32);
  waterGeo.scale(WATER_RX,1,WATER_RZ);
  waterGeo.rotateX(-Math.PI/2);
  const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color:0x2f6fa0, roughness:0.15, metalness:0.3, transparent:true, opacity:0.88 }));
  water.position.set(WATER_CX, -0.05, WATER_CZ);
  scene.add(water);

  // simple trees bordering the hole
  function makeTree(x,z,scale){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,2.4,7), new THREE.MeshStandardMaterial({color:0x5b4430, roughness:0.9}));
    trunk.position.y=1.2; trunk.castShadow=true;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.8,8,7), new THREE.MeshStandardMaterial({color:0x3f7a44, roughness:0.85}));
    leaves.position.y=2.9; leaves.castShadow=true; leaves.scale.y=1.15;
    g.add(trunk,leaves); g.position.set(x,0,z); g.scale.setScalar(scale);
    return g;
  }
  const treeSpots = [];
  for(let z=20; z<PIN_Z-20; z+=24){
    treeSpots.push([-(fairwayHalfWidth(z)+10+Math.random()*10), z+Math.random()*8, 1.0+Math.random()*0.4]);
    treeSpots.push([ (fairwayHalfWidth(z)+10+Math.random()*10), z+Math.random()*8, 1.0+Math.random()*0.4]);
  }
  treeSpots.forEach(([x,z,s])=>{ if(surfaceAt(x,z)!=="water") scene.add(makeTree(x,z,s)); });

  /* ---------- cup + flag ---------- */
  const cupY = heightAt(PIN_X,PIN_Z);
  const cupRim = new THREE.Mesh(new THREE.TorusGeometry(0.235,0.028,10,24), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.4, metalness:0.1 }));
  cupRim.rotation.x = Math.PI/2; cupRim.position.set(PIN_X, cupY+0.01, PIN_Z); scene.add(cupRim);
  const cupHole = new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,0.3,20,1,true), new THREE.MeshBasicMaterial({ color:0x050505, side:THREE.BackSide }));
  cupHole.position.set(PIN_X, cupY-0.14, PIN_Z); scene.add(cupHole);

  const flagGroup = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,1.5,8), new THREE.MeshStandardMaterial({ color:0xf0e6d2, roughness:0.4 }));
  pole.position.y=0.75; pole.castShadow=true; flagGroup.add(pole);
  const flagGeo = new THREE.PlaneGeometry(0.42,0.26,8,4);
  const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ color:0xc9473b, roughness:0.6, side:THREE.DoubleSide }));

  function sstep(t){ return t*t*(3-2*t); }
  // body of revolution along +Y with smoothly blended radius keys and rounded end caps
  function loft(keys, opts){
    opts = opts || {};
    const seg = opts.seg || 36, n = opts.n || 44;
    const capB = opts.capB !== undefined ? opts.capB : 0.03, capT = opts.capT !== undefined ? opts.capT : 0.03;
    const pts = [];
    const y0 = keys[0][0], r0 = keys[0][1];
    const y1 = keys[keys.length-1][0], r1 = keys[keys.length-1][1];
    for(let i=0;i<=6;i++){ const a=i/6*Math.PI/2; pts.push(new THREE.Vector2(Math.max(0.0001, r0*Math.sin(a)), y0 - capB*Math.cos(a))); }

      let k = 0; while(k < keys.length-2 && y > keys[k+1][0]) k++;
      const t = sstep(THREE.MathUtils.clamp((y-keys[k][0])/(keys[k+1][0]-keys[k][0]),0,1));
      pts.push(new THREE.Vector2(THREE.MathUtils.lerp(keys[k][1], keys[k+1][1], t), y));
    }

  window.addEventListener("keydown",(e)=>{
    if(swingState!=="aim") return;
    const nudge = THREE.MathUtils.degToRad(0.4); // fine keyboard adjustment for precise lines
    if(e.key==="ArrowLeft"){ aimAngleTarget -= nudge; e.preventDefault(); }
    else if(e.key==="ArrowRight"){ aimAngleTarget += nudge; e.preventDefault(); }
    aimAngleTarget = THREE.MathUtils.clamp(aimAngleTarget, -Math.PI*0.3, Math.PI*0.3);
  });
  renderer.domElement.addEventListener("mousedown",()=>{
    sfxCtx();
    if(swingState==="aim"){
      clubListEl.classList.remove("show");
      swingState="power"; powerStart=performance.now()/1000;
      document.getElementById("swing-wrap").classList.add("show");
      document.getElementById("hint").style.opacity=0;
      document.getElementById("power-lock").style.opacity=0;
      document.getElementById("accuracy-track").classList.remove("show");
    } else if(swingState==="power"){
      lockedPower = currentPower();
      document.getElementById("power-lock").style.left = (lockedPower*100)+"%";
      document.getElementById("power-lock").style.opacity=1;
      swingState="accuracy"; accStart=performance.now()/1000;
      document.getElementById("accuracy-track").classList.add("show");
    } else if(swingState==="accuracy"){
      let acc = currentAccuracy();
      if(Math.abs(acc) < ACC_DEADZONE) acc = 0; // forgive near-center clicks
      lockedAcc = acc;
      executeShot(lockedPower, lockedAcc);
    }
  });
  window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function currentPower(){
    const t = ((performance.now()/1000 - powerStart) % POWER_CYCLE);
    const half = POWER_CYCLE/2;
    return t<half ? t/half : 1-(t-half)/half;
  }
  function currentAccuracy(){
    const t = ((performance.now()/1000 - accStart) % ACC_CYCLE);
    const half = ACC_CYCLE/2;
    const v = t<half ? t/half : 1-(t-half)/half; // 0..1..0
    return (v*2-1); // -1..1
  }

  const SW_BACK = 0.55, SW_IMPACT = 0.68, SW_END = 1.25;
  function executeShot(power, acc){
    strokes++; updateHud();
    document.getElementById("swing-wrap").classList.remove("show");
    golferSwingT0 = performance.now()/1000;
    golferAmp = CLUBS[clubIndex].name==="Putter" ? 0.18 : 0.6 + 0.4*power;
    pendingShot = { power, acc };
    swingState = "swing";
  }
  function launchShot(power, acc){
    const club = CLUBS[clubIndex];
    const dir = new THREE.Vector3(Math.sin(aimAngle),0,Math.cos(aimAngle));
    if(club.name==="Putter"){
      sfxPutt(power);
      const maxPutt = 2 + power*(Math.min(currentDistance()*1.35, 46));
      const angOff = acc * 0.1;
      const a2 = aimAngle + angOff;
      vel.set(Math.sin(a2)*maxPutt*0.42, Math.cos(a2)*maxPutt*0.42);
      swingState = "rolling";
    } else {
      sfxSwing(power);
      const distYd = club.carry * power;
      const angOff = (acc) * THREE.MathUtils.degToRad(club.maxDev) * (0.4+Math.abs(acc));
      const a2 = aimAngle + angOff;
      const g = 24; // fictional gravity, yd/s^2 equivalent tuned for feel
      const theta = THREE.MathUtils.degToRad(club.launch);
      const v0 = Math.sqrt(Math.max(1, distYd*g/Math.sin(2*theta)));
      vel.set(Math.sin(a2)*v0*Math.cos(theta), Math.cos(a2)*v0*Math.cos(theta));
      ballVY = v0*Math.sin(theta);
      flightTarget = { club, lateralCurve: acc*0.6 };
      swingState = "flight";
    }
  }

  /* ---------- physics ---------- */
  const GRAV = 24;
  function stepPhysics(dt){
    if(swingState==="flight"){
      ballVY -= GRAV*dt;
      ballY += ballVY*dt;
      // slight hook/slice curve while airborne
      const curve = flightTarget ? flightTarget.lateralCurve : 0;
      const perpX = Math.cos(aimAngle), perpZ = -Math.sin(aimAngle);
      vel.x += perpX*curve*dt*1.4;
      vel.y += perpZ*curve*dt*1.4;
      ball.position.x += vel.x*dt;
      ball.position.z += vel.y*dt;
      const groundY = heightAt(ball.position.x, ball.position.z);
      if(ballY <= groundY){
        ballY = groundY;
        const surf = surfaceAt(ball.position.x, ball.position.z);
        if(surf==="water"){
          sfxSplash(); toast("Splash! +1 penalty stroke");
          strokes++; updateHud();
          // drop near entry point
          ball.position.x = THREE.MathUtils.clamp(ball.position.x, -fairwayHalfWidth(ball.position.z)+2, fairwayHalfWidth(ball.position.z)-2);
          ballY = heightAt(ball.position.x, ball.position.z);
          vel.set(0,0); ball.position.y = ballY+BALL_R;
          finishRoll(); return;
        }
        const roll = ROLL_ONLAND[surf] !== undefined ? ROLL_ONLAND[surf] : 0.5;
        if(surf==="bunker") sfxSand(); else sfxBounce(vel.length()/30);
        vel.multiplyScalar(roll);
        ball.position.y = ballY + BALL_R;
        swingState = "rolling";
      } else {
        ball.position.y = ballY + BALL_R;
      }
      return;
    }
    if(swingState!=="rolling") return;
    const speed = vel.length();
    const surf = surfaceAt(ball.position.x, ball.position.z);
    const stopThresh = surf==="bunker" ? 0.12 : 0.05;
    if(speed < stopThresh){ vel.set(0,0); finishRoll(); return; }
    const g = slopeAt(ball.position.x, ball.position.z);
    const slopeAccel = surf==="green" ? 3.2 : 0.6;
    vel.x -= g.gx*slopeAccel*dt;
    vel.y -= g.gz*slopeAccel*dt;
    const fr = FRICTION[surf] !== undefined ? FRICTION[surf] : 2.0;
    vel.multiplyScalar(Math.max(0, 1-fr*dt));
    let nx = ball.position.x + vel.x*dt;
    let nz = ball.position.z + vel.y*dt;
    const nsurf = surfaceAt(nx,nz);
    if(nsurf==="water"){
      sfxSplash(); toast("Rolled into the water — +1 penalty stroke");
      strokes++; updateHud();
      vel.set(0,0);
      finishRoll(); return;
    }
    ball.position.x = nx; ball.position.z = nz;
    ball.position.y = heightAt(nx,nz) + BALL_R;
    const rollAxis = new THREE.Vector3(vel.y,0,-vel.x);
    if(rollAxis.lengthSq() > 0.00001) ball.rotateOnWorldAxis(rollAxis.normalize(), vel.length()*dt/BALL_R);
    // cup check only matters on green
    if(nsurf==="green"){
      const dx=nx-PIN_X, dz=nz-PIN_Z, d=Math.sqrt(dx*dx+dz*dz);
      if(d < 0.21){
        if(speed < 2.2){ sinkBall(); return; }
        else { const nxn=dx/Math.max(d,0.001), nzn=dz/Math.max(d,0.001); vel.x+=nxn*1.0; vel.y+=nzn*1.0; sfxBounce(0.4); }
      }
    }
  }
  function finishRoll(){
    swingState = "aim";
    const d = currentDistance();
    document.getElementById("distVal").textContent = Math.round(d)+" yd";
    if(onGreen()){ clubIndex = CLUBS.length-1; } else { clubIndex = suggestClub(d); }
    refreshClubUI();
    aimToPin();
    aimCamera(true);
    placeGolferAtBall();
    document.getElementById("hint").style.opacity=0.55;
  }
  function placeGolferAtBall(){
    golferSwingT0 = Infinity; pendingShot = null;
    const sa = Math.sin(aimAngle), ca = Math.cos(aimAngle);
    // stand on the right of the target line, facing it; ball sits just ahead of the club head
    golfer.position.set(
      ball.position.x + ca*1.0 - sa*0.19,
      heightAt(ball.position.x, ball.position.z),
      ball.position.z - sa*1.0 - ca*0.19
    );
    golfer.rotation.y = aimAngle - Math.PI/2;
  }
  function aimToPin(){
    const dx = PIN_X-ball.position.x, dz = PIN_Z-ball.position.z;
    let a = Math.atan2(dx,dz);
    a = THREE.MathUtils.clamp(a, -Math.PI*0.3, Math.PI*0.3);
    aimAngle = a; aimAngleTarget = a; // snap instantly, no lerp-in after a shot settles
  }

  function sinkBall(){
    swingState = "sunk"; holeDone = true; vel.set(0,0);
    sfxSink();
    const startY = ball.position.y, dropTarget = startY-0.32;
    const t0 = performance.now();
    (function anim(){
      const t = Math.min(1, (performance.now()-t0)/260);
      ball.position.y = THREE.MathUtils.lerp(startY, dropTarget, t);
      ball.scale.setScalar(THREE.MathUtils.lerp(1,0.25,t));
      if(t<1) requestAnimationFrame(anim); else showSinkPanel();
    })();
  }
  function showSinkPanel(){
    const diff = strokes-PAR;
    const names = {"-3":"Albatross!","-2":"Eagle!","-1":"Birdie!","0":"Par.","1":"Bogey.","2":"Double Bogey."};
    const label = strokes===1 ? "Hole in One!" : (names[String(diff)] || (diff>2?"Still counts.":"Nice."));
    document.getElementById("sinkResult").textContent = label;
    document.getElementById("sinkStrokes").textContent = "Holed in "+strokes+(strokes===1?" stroke":" strokes")+" · Par "+PAR;
    document.getElementById("sink-panel").classList.add("show");
  }
  document.getElementById("replayBtn").addEventListener("click", ()=>{
    document.getElementById("sink-panel").classList.remove("show");
    strokes=0; holeDone=false; vel.set(0,0); ballY=0; ballVY=0;
    ball.position.copy(ballStart); ball.scale.setScalar(1);
    clubIndex=0; refreshClubUI(); aimAngle=0; aimAngleTarget=0;
    swingState="aim"; updateHud();
    document.getElementById("hint").style.opacity=0.55;
    aimCamera(true);
    placeGolferAtBall();
  });

  updateHud();

  /* ---------- loop ---------- */
  let last = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.033,(now-last)/1000); last = now;

    if(swingState==="aim"){
      aimAngle = THREE.MathUtils.lerp(aimAngle, aimAngleTarget, Math.min(1, dt*14));
    }
    stepPhysics(dt);
    updateAimIndicator();

    if(swingState==="flight") flightCamera();
    else if(swingState!=="sunk") aimCamera(false);

    ballShadow.position.set(ball.position.x, heightAt(ball.position.x,ball.position.z)+0.015, ball.position.z);

    const posAttr = flag.geometry.attributes.position;
    for(let i=0;i<posAttr.count;i++){
      const bx = flagBasePos[i*3];
      posAttr.setZ(i, Math.sin(now*0.004+bx*7)*0.02*(bx+0.21)/0.42);
    }
    posAttr.needsUpdate = true;

    // golfer: track the aim line, breathe at address, swing club + arms as one rig, drift cigar smoke
    if(swingState==="aim" || swingState==="power" || swingState==="accuracy"){
      const sa = Math.sin(aimAngle), ca = Math.cos(aimAngle);
      golfer.position.x = ball.position.x + ca*1.0 - sa*0.19;
      golfer.position.z = ball.position.z - sa*1.0 - ca*0.19;
      golfer.rotation.y = aimAngle - Math.PI/2;
    }
    const gd = golfer.userData;
    const swingT = now/1000 - golferSwingT0;
    let psi = 0, coil = 0;
    if(swingT >= 0){
      const A = golferAmp;
      if(swingT < SW_BACK){ psi = -2.2*A*sstep(swingT/SW_BACK); }
      else if(swingT < SW_IMPACT){ const p=(swingT-SW_BACK)/(SW_IMPACT-SW_BACK); psi = THREE.MathUtils.lerp(-2.2*A, 0.12, p*p); }
      else { const p=Math.min(1,(swingT-SW_IMPACT)/(SW_END-SW_IMPACT)); psi = THREE.MathUtils.lerp(0.12, 2.0*A, 1-(1-p)*(1-p)); }
      coil = THREE.MathUtils.clamp(-psi/2.2, -0.9, 1);
      if(swingState==="swing" && pendingShot && swingT >= SW_IMPACT){
        const ps = pendingShot; pendingShot = null; launchShot(ps.power, ps.acc);
      }
    }
    gd.rig.rotation.z = THREE.MathUtils.lerp(gd.rig.rotation.z, psi, swingT>=0 ? 1 : 0.2);
    gd.torso.rotation.y = THREE.MathUtils.lerp(gd.torso.rotation.y, -coil*0.7, 0.35);
    gd.hips.rotation.y = THREE.MathUtils.lerp(gd.hips.rotation.y, -coil*0.3, 0.35);
    gd.torso.rotation.x = gd.LEAN + Math.sin(now*0.0016)*0.012;   // slow breathing at address
    gd.ember.getWorldPosition(_tmpV);
    const st = (now/1000*0.45) % 1;
    smoke.position.set(_tmpV.x, _tmpV.y + 0.05 + st*0.5, _tmpV.z);
    smoke.material.opacity = 0.35*(1-st);
    smoke.scale.setScalar(1 + st*2.2);
    smoke.quaternion.copy(camera.quaternion);

    if(swingState==="power"){
      document.getElementById("power-fill").style.width = (currentPower()*100).toFixed(0)+"%";
    }
    if(swingState==="accuracy"){
      document.getElementById("accuracy-marker").style.left = (50+currentAccuracy()*50)+"%";
    }

    renderer.render(scene,camera);
  }
  animate();

})();
</script>
</body>
</html>
