<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reel Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(9,22,30,.58);--glass2:rgba(9,22,30,.82);--edge:rgba(255,255,255,.14);--cream:#f6efe0;--dim:#a9bcc4;--aqua:#7fe3d0;--gold:#f2c46d;--red:#ff6b5b;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
--c0:#cfd8dc;--c1:#7be08b;--c2:#62b4ff;--c3:#ffc247}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a141a;color:var(--cream);font-family:var(--sans);user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,8,14,.45) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .5s}
#fade{position:absolute;inset:0;pointer-events:none;background:#06121a;opacity:0;transition:opacity .45s;z-index:50}
#fade.on{opacity:1;pointer-events:auto}
.hidden{display:none!important}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{position:absolute}
.pill{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:9px;white-space:nowrap}
#top-l{top:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#p-money b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:16px}
#p-lvl .xpbar{display:block;width:90px;height:6px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}
#p-lvl .xpbar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),#b6ffe9);border-radius:9px;transition:width .5s}
#top-c{top:14px;left:50%;transform:translateX(-50%);text-align:center}
#site-name{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#activity{margin-top:4px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;min-height:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#top-r{top:16px;right:16px;display:flex;gap:8px;pointer-events:auto}
button{font-family:var(--sans);cursor:pointer}
.btn{background:var(--glass);color:var(--cream);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;letter-spacing:.04em;transition:.15s}
.btn:hover{background:rgba(40,70,84,.7);border-color:rgba(255,255,255,.3)}
.btn.main{background:linear-gradient(180deg,#f7d58a,#e0a94a);color:#2a1d05;border:none;box-shadow:0 6px 22px rgba(240,180,70,.35)}
.btn.main:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
#tackle{left:16px;bottom:16px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#tackle .chip{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:14px;padding:7px 12px 7px 8px;cursor:pointer}
#tackle .chip canvas{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.07)}
#tackle small{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
#tackle b{font-size:13px}
#prompt{bottom:84px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:999px;padding:9px 20px;font-size:14px;font-weight:600;max-width:min(94vw,820px);text-align:center;transition:opacity .25s}
#prompt kbd{background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800;margin:0 2px}
#prompt.off{opacity:0}
#prompt.top{bottom:auto;top:84px;font-size:13px;padding:7px 16px}
#castmeter{bottom:130px;left:50%;transform:translateX(-50%);width:min(70vw,360px);height:12px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--edge);overflow:hidden}
#castmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fe3d0,#f2c46d,#ff6b5b)}
#castdist{bottom:148px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:22px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#fight{inset:0}
#fight>*{position:absolute}
#gauge{bottom:22px;left:50%;transform:translateX(-50%);width:min(60vw,330px)}
#gauge svg{width:100%;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
#gauge .lab{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
#fbars{right:20px;top:50%;transform:translateY(-50%);display:flex;gap:14px;align-items:flex-end;height:230px}
.vbar{width:16px;height:100%;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid var(--edge);position:relative;overflow:hidden}
.vbar i{position:absolute;left:0;right:0;bottom:0;border-radius:10px;transition:height .1s linear}
.vbar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);letter-spacing:.1em;font-weight:800;text-transform:uppercase}
.vwrap{position:relative;height:100%}
#sta i{background:linear-gradient(0deg,#ff8c5b,#ffd17a)}
#dis i{background:linear-gradient(0deg,#4fb9ff,#8ff0ff)}
#compass{bottom:214px;left:50%;transform:translateX(-50%);width:min(52vw,300px);height:30px}
#compass .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid var(--edge)}
#compass .zone{position:absolute;top:8px;height:14px;border-radius:7px;background:rgba(127,227,208,.35);border:1px solid rgba(127,227,208,.7);transition:left .12s,width .12s}
#compass .fd{position:absolute;top:2px;width:26px;height:26px;margin-left:-13px;transform:translateX(0);font-size:20px;line-height:26px;text-align:center;color:#ffd17a;text-shadow:0 0 10px rgba(255,170,60,.8)}
#compass .st{position:absolute;top:5px;width:6px;height:20px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff}
#combo{bottom:252px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);transition:transform .12s;white-space:nowrap}
#combo small{font-family:var(--sans);font-size:11px;letter-spacing:.16em;color:var(--cream);margin-left:8px;opacity:.85}
#warn{top:30%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,64px);letter-spacing:.06em;text-shadow:0 4px 24px rgba(0,0,0,.65);opacity:0;white-space:nowrap}
#warn.show{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#toasts{top:78px;right:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--glass2);border:1px solid var(--edge);border-left:3px solid var(--gold);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;animation:tin .35s ease-out;max-width:300px}
.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(6,16,22,.15),rgba(6,16,22,.72));flex-direction:column;text-align:center;padding:20px}
#title h1{font-family:var(--serif);font-weight:700;font-size:clamp(54px,11vw,128px);margin:0;letter-spacing:.04em;line-height:.95;text-shadow:0 6px 40px rgba(0,0,0,.55);background:linear-gradient(180deg,#fff7e0,#f2c46d 70%,#d99a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{font-family:var(--serif);font-size:clamp(17px,2.4vw,26px);font-style:italic;color:var(--cream);opacity:.9;margin:8px 0 28px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#title .how{margin-top:26px;font-size:13px;color:var(--dim);line-height:1.8;max-width:560px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#title .how b{color:var(--cream)}
#title .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#menu{background:rgba(5,14,20,.62);backdrop-filter:blur(6px)}
.panel{background:var(--glass2);border:1px solid var(--edge);border-radius:20px;width:min(1020px,94vw);height:min(660px,90vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ptabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--edge);align-items:center}
.ptabs .tab{background:none;border:none;color:var(--dim);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:11px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs .tab.on{color:var(--cream);border-color:var(--gold)}
.ptabs .sp{flex:1}
.pbody{flex:1;overflow:auto;padding:18px 20px}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:14px;padding:12px;position:relative}
.card h4{margin:0 0 3px;font-size:14px}
.card .meta{font-size:11px;color:var(--dim);letter-spacing:.06em}
.card.eq{border-color:var(--aqua);box-shadow:0 0 0 1px rgba(127,227,208,.3) inset}
.card.lock{opacity:.55}
.stat{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.08em;text-transform:uppercase}
.stat i{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.stat i u{display:block;height:100%;background:var(--aqua);border-radius:5px}
.stat span{width:50px}
.sec{font-family:var(--serif);font-size:22px;font-weight:700;margin:6px 0 10px;color:var(--gold)}
.price{font-weight:800;color:var(--gold)}
.site{display:flex;gap:14px;align-items:stretch}
.site .pic{width:150px;min-height:110px;border-radius:12px;flex:none;position:relative;overflow:hidden}
.site .pic:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 55%)}
.fcard canvas{width:100%;height:68px;display:block;margin-bottom:6px}
.badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:9px;border:1px solid currentColor}
.prog{height:7px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.prog u{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--gold))}
#card{background:radial-gradient(ellipse at 28% 50%,rgba(0,0,0,0) 0%,rgba(4,10,16,.55) 80%);justify-content:flex-end;padding-right:max(3vw,24px);pointer-events:none}
#card.hidden{display:none}
.cc{pointer-events:auto;width:min(420px,92vw);background:var(--glass2);border:1px solid var(--edge);border-radius:22px;padding:20px 22px 18px;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:ccin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes ccin{from{opacity:0;transform:translateX(60px) scale(.96)}}
.cc .rib{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.cc h2{font-family:var(--serif);font-size:38px;margin:2px 0 4px;line-height:1}
.cc canvas{width:100%;height:110px;display:block;margin:6px 0}
.cc .sizes{display:flex;gap:18px;font-family:var(--serif);font-size:26px;font-weight:700}
.cc .sizes small{display:block;font-family:var(--sans);font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.cc .tag{display:inline-block;margin:2px 4px 2px 0;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.1)}
.cc .tag.g{background:rgba(242,196,109,.2);color:var(--gold)}
.cc .tag.n{background:rgba(127,227,208,.2);color:var(--aqua)}
.lines{margin:10px 0;border-top:1px solid var(--edge);padding-top:8px}
.lines div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;opacity:0;animation:li .35s forwards}
@keyframes li{to{opacity:1}}
.lines .tot{font-weight:800;font-size:17px;border-top:1px solid var(--edge);margin-top:5px;padding-top:6px}
.lines b{color:var(--gold)}
.cc .acts{display:flex;gap:10px;margin-top:12px}
.cc .acts .btn{flex:1;padding:11px}
#lvlup{top:34%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--serif);font-weight:700;font-size:clamp(32px,5vw,54px);color:var(--gold);text-shadow:0 4px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none}
#lvlup small{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.2em;color:var(--cream);font-weight:700}
#lvlup.show{animation:pop 2.6s ease-out forwards}
input[type=range]{accent-color:#7fe3d0}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);font-size:14px}
@media(max-width:700px){#fbars{height:160px;right:10px}.site .pic{width:90px}.panel{height:94vh}#top-c{top:56px}}

</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="top-l"><div class="pill" id="p-money">$ <b>0</b></div><div class="pill" id="p-lvl"><span>Lv <b>1</b></span><i class="xpbar"><u></u></i></div></div>
  <div id="top-c"><div id="site-name"></div><div id="activity"></div></div>
  <div id="top-r"><button class="btn" id="b-menu">Menu · Tab</button><button class="btn" id="b-snd">Sound</button></div>
  <div id="tackle"><div class="chip" id="t-bait"><canvas width="68" height="68"></canvas><div><small>Bait</small><b></b></div></div><div class="chip" id="t-rod"><canvas width="68" height="68"></canvas><div><small>Rod</small><b></b></div></div></div>
  <div id="castdist" class="hidden"></div>
  <div id="castmeter" class="hidden"><i></i></div>
  <div id="prompt"></div>
  <div id="fight" class="hidden">
    <div id="warn"></div>
    <div id="combo"></div>
    <div id="compass"><div class="tr"></div><div class="zone"></div><div class="fd">◆</div><div class="st"></div></div>
    <div id="gauge"><svg viewBox="0 0 330 190"><g id="gzones"></g><g id="gticks"></g><line id="gneedle" x1="165" y1="170" x2="165" y2="46" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="165" cy="170" r="11" fill="#fff"/><text id="gnum" x="165" y="132" text-anchor="middle" fill="#fff" font-size="30" font-family="Cormorant Garamond,serif" font-weight="700"></text></svg><div class="lab">Line Tension</div></div>
    <div id="fbars"><div class="vwrap"><div class="vbar" id="sta"><i></i></div><span>Stamina</span></div><div class="vwrap"><div class="vbar" id="dis"><i></i></div><span>Distance</span></div></div>
  </div>
  <div id="lvlup"></div>
  <div id="toasts"></div>
</div>
<div id="title" class="screen hidden"></div>
<div id="menu" class="screen hidden"></div>
<div id="card" class="screen hidden"></div>
<div id="fade" class="on"></div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dampf=(k,dt)=>1-Math.exp(-k*dt);
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(x,y,s=1){const h=(i,j)=>{let n=Math.sin(i*127.1*s+j*311.7*s+s*17.3)*43758.5453;return n-Math.floor(n)};
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h(xi,yi),h(xi+1,yi),u),lerp(h(xi,yi+1),h(xi+1,yi+1),u),v)}
function fbm(x,y,s=1,o=4){let a=.5,f=1,r=0;for(let i=0;i<o;i++){r+=a*vnoise(x*f,y*f,s+i);a*=.5;f*=2.03}return r}
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

/* ---------- renderer ---------- */
const QUAL=lsGet('reeldeep.q',{pr:Math.min(window.devicePixelRatio||1,1.75),shadows:true});
const cv=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(QUAL.pr);
renderer.shadowMap.enabled=QUAL.shadows;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.08,2200);
function onResize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',onResize);onResize();
let T=0; // global elapsed seconds

/* ---------- input ---------- */
const inp={reel:false,give:false,steer:0,mx:0,pressed:false,released:false,twitch:false,holdT:0,keys:{},any:false};
function btnDown(){if(inp.reel)return;inp.reel=true;inp.pressed=true;inp.holdT=0;inp.any=true}
function btnUp(){if(!inp.reel)return;inp.reel=false;inp.released=true}
cv.addEventListener('mousedown',e=>{Snd.init();Snd.resume();if(e.button===0)btnDown();else if(e.button===2)inp.give=true;e.preventDefault()});
addEventListener('mouseup',e=>{if(e.button===0)btnUp();else if(e.button===2)inp.give=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{inp.mx=(e.clientX/innerWidth-.5)*2});
cv.addEventListener('touchstart',e=>{Snd.init();Snd.resume();const t=e.touches[0];inp.mx=(t.clientX/innerWidth-.5)*2;btnDown();e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];inp.mx=(t.clientX/innerWidth-.5)*2;e.preventDefault()},{passive:false});
cv.addEventListener('touchend',e=>{btnUp();e.preventDefault()},{passive:false});
const keyHandlers=[];
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();inp.keys[k]=true;
  if(k===' '){Snd.init();Snd.resume();btnDown();e.preventDefault()}
  if(k==='shift'||k==='s')inp.give=true;
  for(const h of keyHandlers)h(k,e);
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();inp.keys[k]=false;if(k===' ')btnUp();if(k==='shift'||k==='s')inp.give=false});
function steerInput(dt){let t=inp.mx*1.25;if(inp.keys['a']||inp.keys['arrowleft'])t=-1;if(inp.keys['d']||inp.keys['arrowright'])t=1;inp.steer+=(clamp(t,-1,1)-inp.steer)*dampf(9,dt)}

/* ---------- audio ---------- */
const Snd=(()=>{
  let ctx=null,master,wet,nb,on=lsGet('reeldeep.snd',true),amb=null,sq=null,musicT=0,site='lake';
  function init(){if(ctx)return;try{
    ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=on?.75:0;master.connect(ctx.destination);

/* ---------- fish model ---------- */
function prof(t,k){let p;if(t<k)p=Math.pow(Math.sin(t/k*Math.PI/2),.6);else p=Math.pow(Math.cos((t-k)/(1-k)*Math.PI/2),1.1);return Math.max(p,t>.86?.05:0)}
function hh(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}
function makeFish(sp,o={}){
  const lk=sp.look,N=o.lod?12:30,M=o.lod?6:14,k=lk.k,H=lk.asp/2,W=H*lk.wf;
  const back=HEX(lk.back),belly=HEX(lk.belly),mc=HEX(lk.mc||'#000'),fin=HEX(lk.fin),tmp=new THREE.Color();
  const P=[],C=[],I=[];
  for(let i=0;i<=N;i++){const t=i/N,x=.5-t;let p=prof(t,k);if(lk.head==='big'&&t<.3)p*=1.07;
    for(let j=0;j<=M;j++){const ph=j/M*Math.PI*2,cy=Math.cos(ph),sz=Math.sin(ph);
      let y=H*p*cy*(cy<0?.9:1),z=W*p*sz;
      if((lk.head==='long')&&t<.2){z*=.75;y*=.8}
      if(lk.head==='blunt'&&t<.22){y*=1.1}
      P.push(x,y,z);
      const b=sstep(.3,-.45,cy);tmp.copy(back).lerp(belly,b);
      const m=lk.mark;
      if(m==='bars'&&cy>-.2&&t>.2&&t<.88){const w=Math.sin(t*Math.PI*9)*.5+.5;tmp.lerp(mc,sstep(.6,.85,w)*(1-b)*.85)}
      else if(m==='stripe'){const band=1-sstep(.1,.34,Math.abs(cy+.02));if(t>.16)tmp.lerp(mc,band*.9)}
      else if(m==='lines'){const l=Math.sin(cy*16);if(l>.72&&cy>-.45&&t>.12)tmp.lerp(mc,.55)}
      else if(m==='spots'){if(cy>-.3&&t>.14&&hh(i*1.7,j*2.3)>.8)tmp.lerp(mc,.9)}
      else if(m==='mottle'){const n=vnoise(t*16,ph*2.4,3);if(n>.56&&t>.14)tmp.lerp(mc,.65*(1-b*.6))}
      else if(m==='scales'){const s=Math.abs(Math.sin(t*70))*Math.abs(Math.sin(ph*9+t*30));tmp.lerp(mc,sstep(.7,.95,s)*.28)}
      else if(m==='scutes'){const r=Math.abs(cy-.55)<.13||Math.abs(cy+.5)<.1||Math.abs(cy-.02)<.09;if(r&&t>.2&&Math.sin(t*90)>.2)tmp.lerp(mc,.7)}
      if(lk.stripe&&Math.abs(cy-.05)<.26&&t>.2&&t<.9)tmp.lerp(HEX(lk.stripe),.7*(1-Math.abs(cy-.05)/.26));
      if(lk.cheek&&t>.1&&t<.19&&Math.abs(cy-.05)<.45&&Math.abs(sz)>.6)tmp.lerp(HEX(lk.cheek),.9);
      if(t>.18&&t<.205)tmp.multiplyScalar(.72);
      tmp.multiplyScalar(.95+.1*hh(i,j*1.3));
      C.push(tmp.r,tmp.g,tmp.b);
    }}
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;I.push(a,a+1,b,a+1,b+1,b)}
  const ga=new THREE.BufferGeometry();ga.setAttribute('position',new THREE.Float32BufferAttribute(P,3));ga.setAttribute('color',new THREE.Float32BufferAttribute(C,3));ga.setIndex(I);ga.computeVertexNormals();
  // parts (fins, eyes, tail) non-indexed
  const bp=[],bc=[];
  const tri=(a,b,c,ca,cb,cc)=>{bp.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);const q=ca,r=cb||ca,s=cc||ca;bc.push(q.r,q.g,q.b,r.r,r.g,r.b,s.r,s.g,s.b)};
  const finBase=fin.clone().multiplyScalar(.85),finTip=fin.clone().lerp(mc,.18).multiplyScalar(1.08);
  const strip=(t0,t1,hd,top,shape,zo=0,mirror=false)=>{const n=lod(8,4);let prev=null;for(let s=0;s<=n;s++){const u=s/n,t=lerp(t0,t1,u),x=.5-t,p=prof(t,k),sgn=top?1:-1;
      const hgt=hd*shape(u)*H;const base=[x,sgn*H*p*.92,zo],tipP=[x-(top?.03:.04)*u*hd/H*.4,sgn*(H*p*.92+hgt),zo];
      if(prev){tri(prev[0],prev[1],base,finBase,finTip,finBase);tri(prev[1],tipP,base,finTip,finTip,finBase)}prev=[base,tipP]}};
  function lod(a,b){return o.lod?b:a}
  const dors=lk.dors;
  if(dors==='single')strip(.34,.58,.75,true,u=>Math.sin(Math.pow(u,.7)*Math.PI)*(1-.3*u)+.05);
  else if(dors==='double'){strip(.27,.5,.6,true,u=>(Math.sin(u*Math.PI*4.5)*.15+.85)*Math.sin(Math.pow(u,.6)*Math.PI)+.04);strip(.55,.69,.5,true,u=>Math.sin(u*Math.PI)*.8+.1)}
  else if(dors==='long')strip(.2,.8,.42,true,u=>Math.sin(u*Math.PI)*.8+.2);
  else if(dors==='sail')strip(.17,.84,1.55,true,u=>Math.pow(Math.sin(Math.pow(u,.8)*Math.PI),.8)*(1-.15*u)+.04);
  else if(dors==='back'){strip(.62,.76,.8,true,u=>Math.sin(u*Math.PI)*.9+.1);strip(.64,.77,.7,false,u=>Math.sin(u*Math.PI)*.9+.1)}
  if(dors!=='back'&&dors!=='sail')strip(.64,.78,.55,false,u=>Math.sin(u*Math.PI)*.85+.15);
  if(dors==='sail')strip(.66,.8,.6,false,u=>Math.sin(u*Math.PI)*.85+.1);
  // pelvic + pectoral
  for(const sgn of[-1,1]){
    const t=.26,x=.5-t,p=prof(t,k),y=-H*p*.32,z=sgn*W*p*.97,L=lk.dors==='sail'&&sp.id==='mahi'?.16:.1;
    tri([x,y,z],[x-L,y-H*.12,z+sgn*.05],[x-L*.55,y+H*.1,z+sgn*.03],finBase,finTip,finBase);
    const t2=.4,x2=.5-t2,p2=prof(t2,k),y2=-H*p2*.88,z2=sgn*W*p2*.3;
    tri([x2,y2,z2],[x2-.08,y2-H*.3,z2+sgn*.02],[x2-.03,y2-H*.05,z2],finBase,finTip,finBase);
    if(!o.lod){const t3=.115,x3=.5-t3,p3=prof(t3,k),e=Math.max(.008,H*.17);
      const ey=H*p3*.25,ez=sgn*W*p3*.9;const eye=HEX(lk.eye||'#111');const white=new THREE.Color('#e9e9dc');
      // eyeball as 2 small octa-discs
      const R=e,ez2=ez+sgn*e*.35;
      for(let a=0;a<8;a++){const a0=a/8*Math.PI*2,a1=(a+1)/8*Math.PI*2;tri([x3,ey,ez2],[x3+Math.cos(a0)*R*1.15,ey+Math.sin(a0)*R*1.15,ez2],[x3+Math.cos(a1)*R*1.15,ey+Math.sin(a1)*R*1.15,ez2],white);
        tri([x3,ey,ez2+sgn*.0015],[x3+Math.cos(a0)*R*.62,ey+Math.sin(a0)*R*.62,ez2+sgn*.0015],[x3+Math.cos(a1)*R*.62,ey+Math.sin(a1)*R*.62,ez2+sgn*.0015],eye)}}
  }
  // barbels
  if(lk.whisk){for(const sgn of[-1,1])for(const yy of[-.22,-.4]){const x=.5-.01,z=sgn*W*.35;tri([x,H*yy,z],[x+.09,H*yy-.12*H,z+sgn*W*.9],[x+.02,H*yy-.03*H,z+sgn*W*.2],finBase,finTip,finBase)}}
  // bill
  if(lk.bill){const L=.24,r=H*.16,pts=[0,1,2,3].map(a=>[Math.cos(a*Math.PI/2)*r,Math.sin(a*Math.PI/2)*r*.8]);const bc2=HEX(lk.back).multiplyScalar(.65);
    for(let a=0;a<4;a++){const p0=pts[a],p1=pts[(a+1)%4];tri([.5,p0[1],p0[0]],[.5,p1[1],p1[0]],[.5+L,0,0],bc2)}}
  // tail
  const tl=.17,pw=Math.max(.008,H*.07),th=H*(lk.tail==='lunate'?1.15:lk.tail==='round'?.8:1.0),X=-.5;
  let poly;
  if(lk.tail==='lunate')poly=[[0,pw],[-tl*1.3,th*1.25],[-tl*.75,0],[-tl*1.3,-th*1.25],[0,-pw]];
  else if(lk.tail==='round')poly=[[0,pw],[-tl*.6,th*.85],[-tl*1.05,th*.35],[-tl*1.1,0],[-tl*1.05,-th*.35],[-tl*.6,-th*.85],[0,-pw]];
  else if(lk.tail==='square')poly=[[0,pw],[-tl,th],[-tl*.88,0],[-tl,-th],[0,-pw]];
  else if(lk.tail==='hetero')poly=[[0,pw],[-tl*1.6,th*1.5],[-tl*.55,th*.1],[-tl*.95,-th*.6],[0,-pw]];
  else poly=[[0,pw],[-tl,th],[-tl*.6,0],[-tl,-th],[0,-pw]];
  const ctr=[-tl*.15,0];
  for(let i=0;i<poly.length-1;i++){const a=poly[i],b=poly[i+1];tri([X+ctr[0],ctr[1],0],[X+a[0],a[1],0],[X+b[0],b[1],0],finBase,finTip,finTip)}
  tri([X+ctr[0],ctr[1],0],[X+poly[poly.length-1][0],poly[poly.length-1][1],0],[X+poly[0][0],poly[0][1],0],finBase,finTip,finTip);
  const gb=new THREE.BufferGeometry();gb.setAttribute('position',new THREE.Float32BufferAttribute(bp,3));gb.setAttribute('color',new THREE.Float32BufferAttribute(bc,3));gb.computeVertexNormals();
  let mA,mB;
  if(o.mat){mA=o.mat;mB=o.mat}
  else{mA=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.42,metalness:.05,clearcoat:.7,clearcoatRoughness:.25,sheen:.5,sheenColor:new THREE.Color('#ffffff')});
    mB=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.65,side:THREE.DoubleSide});
    if(lk.glow){mA.emissive=HEX(lk.glow);mA.emissiveIntensity=.06;mB.emissive=HEX(lk.glow);mB.emissiveIntensity=.05}}
  const A=new THREE.Mesh(ga,mA),B=new THREE.Mesh(gb,mB);
  const g=new THREE.Group();g.add(A,B);
  const parts=[{geo:ga,base:Float32Array.from(ga.attributes.position.array)},{geo:gb,base:Float32Array.from(gb.attributes.position.array)}];
  const obj={group:g,A,B,parts,sp,shade:!o.mat,
    setLen(m){g.scale.setScalar(m);this.len=m},
    bend(time,amp,freq){for(const pt of parts){const pa=pt.geo.attributes.position.array,ba=pt.base;for(let v=0;v<pa.length;v+=3){const t=.5-ba[v];const tt=t>0?Math.pow(t,1.5):0;pa[v+2]=ba[v+2]+amp*(.08+.92*tt)*Math.sin(time*freq-t*3.4)}pt.geo.attributes.position.needsUpdate=true}
      if(this.shade){ga.computeVertexNormals()}},
    dispose(){ga.dispose();gb.dispose();if(!o.mat){mA.dispose();mB.dispose()}}};
  return obj;
}
// size roll
function rollSize(sp,bias=0){const u=Math.pow(Math.random(),2.2-bias*.5);const wt=lerp(sp.wt[0],sp.wt[1],u);const lf=Math.pow(u,.85);const len=lerp(sp.len[0],sp.len[1],clamp(lf*(.92+Math.random()*.08),0,1));return{wt:Math.round(wt*100)/100,len:Math.round(len*10)/10,u,trophy:u>.78}}
function fishValue(sp,wt,trophy){const r=RAR[sp.rar];return Math.round(sp.price*wt+r.bonus)}

/* ---------- 2D fish art (journal, cards, icons) ---------- */
function drawFish2D(c,sp,o={}){
  const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
  const lk=sp.look,H=lk.asp/2;let L=Math.min(w*.8,(h*.8)/(Math.max(lk.asp*1.9,.2)));L=Math.min(L,w*.8);if(lk.bill)L*=.78;
  const cx=w*.54,cy=h*.52,sil=o.sil;
  const X=t=>cx+(.5-t)*L,Y=(t,top)=>cy+(top?-1:.9)*H*L*prof(t,lk.k);
  const back=sil?'#0a141a':lk.back,belly=sil?'#0a141a':lk.belly,fin=sil?'#0a141a':lk.fin,mc=lk.mc||'#000';
  ctx.globalAlpha=sil?.55:1;
  // tail
  const tl=L*.17,th=H*L*(lk.tail==='lunate'?1.15:1.0),tx=X(1);
  ctx.fillStyle=fin;ctx.beginPath();ctx.moveTo(tx+2,cy-L*.01);
  if(lk.tail==='round'){ctx.bezierCurveTo(tx-tl*.7,cy-th,tx-tl*1.2,cy-th*.4,tx-tl*1.1,cy);ctx.bezierCurveTo(tx-tl*1.2,cy+th*.4,tx-tl*.7,cy+th,tx+2,cy+L*.01)}
  else{const sw=lk.tail==='lunate'?1.35:1;ctx.lineTo(tx-tl*sw,cy-th*1.1);ctx.quadraticCurveTo(tx-tl*.5,cy,tx-tl*sw,cy+th*1.1);ctx.lineTo(tx+2,cy+L*.01)}
  ctx.closePath();ctx.fill();
  // dorsal/anal
  const finPoly=(t0,t1,hd,top)=>{ctx.beginPath();const n=10;for(let s=0;s<=n;s++){const u=s/n,t=lerp(t0,t1,u);const hg=hd*H*L*(Math.sin(Math.pow(u,.8)*Math.PI)*.9+.05);const y=cy+(top?-1:1)*(H*L*prof(t,lk.k)*.9+hg);s===0?ctx.moveTo(X(t),cy+(top?-1:1)*H*L*prof(t,lk.k)*.8):ctx.lineTo(X(t),y)}
    ctx.lineTo(X(t1),cy+(top?-1:1)*H*L*prof(t1,lk.k)*.8);ctx.closePath();ctx.fill()};
  ctx.fillStyle=fin;
  const d=lk.dors;
  if(d==='single')finPoly(.34,.58,.8,true);else if(d==='double'){finPoly(.27,.5,.7,true);finPoly(.55,.69,.55,true)}else if(d==='long')finPoly(.2,.8,.45,true);else if(d==='sail')finPoly(.17,.84,1.6,true);else if(d==='back'){finPoly(.62,.76,.9,true);finPoly(.64,.77,.8,false)}

const PH={calm:{pull:.4},windup:{pull:.65},run:{pull:1.5},dive:{pull:1.2},jump:{pull:.6},thrash:{pull:.95},tired:{pull:.22}};

function updateFight(dt){
  const F=G.fight;if(!F)return;F.time+=dt;F.pt+=dt;
  const rod=F.rod,reel=F.reel,sp=F.sp;const sf=F.stamina/F.sta0;

    if(F.phase==='run'){F.runStartTh=F.th;F.runAlign=0;F.runT=0}
    if(F.phase==='jump'){F.jumpU=0;F.jumpGive=0;F.jumpHigh=0;Snd.splash(1.2);splashAt(...heroXZ(F),1.1)}

    if(F.phase==='jump'){if(F.jumpGive>.45){F.bows++;F.stamina-=F.sta0*.07;UI.warn('BOWED TO THE JUMP!','#8dffcf');Snd.ding(3)}splashAt(...heroXZ(F),1.3)}
    F.phase=F.stamina<F.sta0*.2?'tired':'calm';F.pt=0;F.pdur=rnd(1.1,2.4)*(0.7+0.6*sf)}
  if(F.phase==='tired'&&!F.tired){F.tired=true;UI.warn('He\'s tiring — reel him in!','#8dffcf')}

  // band & combo

  if(inBand){F.band+=dt;F.outT=0;F.comboT+=dt;if(F.comboT>=1){F.comboT-=1;F.combo=Math.min(9,F.combo+1);F.maxCombo=Math.max(F.maxCombo,F.combo);if(F.combo>=3)Snd.tick(2)}}
  else{F.outT+=dt;if(F.outT>.55&&F.combo>0){F.combo=Math.max(0,F.combo-1);F.outT=0;F.comboT=0}}
  F.maxCombo=Math.max(F.maxCombo,F.combo);

  if(inBand)drain*=1;else if(reeling)drain*=.35;else drain*=.1;

  if(!reeling&&!give&&Tapp<30)F.stamina=Math.min(F.sta0,F.stamina+dt*.9);
  // distance

  if(F.phase==='calm')swim=.35*(.4+.6*sf);else if(F.phase==='run')swim=3.0*sw*clamp(1-.5*Math.max(0,align),.4,1);else if(F.phase==='dive')swim=1.7*sw;else if(F.phase==='thrash')swim=.15;else if(F.phase==='tired')swim=-.05;else if(F.phase==='windup')swim=.2;

  else if(F.phase==='calm'||F.phase==='windup'||F.phase==='tired'){F.thV+=(Math.random()-.5)*dt*3;F.thV*=1-1.5*dt;F.th+=F.thV*dt*.4;F.th+=(steer*.45-F.th)*dt*.22*(rod.ctl/1.3)}

  else if(F.phase==='thrash'){y=-.04+Math.sin(F.time*14)*.04;amp=.2;fr=28;roll=Math.sin(F.time*13)*.9;if(Math.random()<dt*22)FXd.emit(hx,.05,hz,rnd(-1,1),rnd(1.5,3),rnd(-1,1),.6,.05,'#eaf8ff',9.8,.1,.2,.9)}
  else if(F.phase==='jump'){const u=clamp(F.pt/F.pdur,0,1);const hgt=clamp(.5+F.rec.len*.025*(sp.beh.jump*.5),.6,2.4);y=4*hgt*u*(1-u)-.2;pitch=(1-2*u)*.9;amp=.18;fr=26;roll=u*6.28*(sp.beh.jump>1.5?1:0)*.5;F.jumpHigh=Math.max(F.jumpHigh,y)}

function startLanding(F){

function updateLanding(dt){
  const F=G.result.F;G.landT+=dt;const t=G.landT;
  const sp=F.sp,rar=sp.rar;const tot=2.7;

let camBurst=0;

/* ---------- per-frame game update ---------- */
const tmpV=V3(),tmpV2=V3();
function lureWorld(){const L=G.lure;return V3(L.x,L.y,L.z)}
function updateGame(dt){
  G.stT=(G.stT||0)+dt;steerInput(dt);const st=G.state;const L=G.lure;
  if(inp.reel)inp.holdT+=dt;
  if(st==='idle'||st==='charge'){
    let t=inp.mx*.62;if(inp.keys['a']||inp.keys['arrowleft'])t=-.62;if(inp.keys['d']||inp.keys['arrowright'])t=.62;G.aimT=clamp(t,-.62,.62);G.aim+=(G.aimT-G.aim)*dampf(5,dt);An.g.rotation.y=-G.aim}

    if(inp.pressed){startCast()}
    Target.visible=false;
  }else if(st==='charge'){
    G.power+=G.pdir*dt*.85;if(G.power>=1){G.power=1;G.pdir=-1}if(G.power<=0){G.power=0;G.pdir=1}
    An.tgt.pitch=lerp(.75,2.25,G.power);An.tgt.lean=-.18*G.power;An.tgt.bend=.3*G.power;An.tgt.rate=9;An.tgt.twist=-.25*G.power;

  }else if(st==='casting'){

      Bob.g.position.set(L.x,L.y,L.z);Bob.g.rotation.set(0,Math.atan2(L.tx-L.sx,L.tz-L.sz),0);Bob.g.visible=true;Line.set(An.tipW,Bob.g.position,.35*(1-u),false);
      if(u>=1)lureLanded()}
    else if(c.launched&&G.stT>0.6&&st==='casting'&&!L.fly&&!L.on){setState('idle')}
    if(c.t>.4)An.tgt.rate=8,An.tgt.pitch=.6,An.tgt.bend=.15,An.tgt.lean=.04;
  }else if(st==='wait'){
    An.pose('wait');An.tgt.look=lureWorld();

    else{
      if(inp.reel&&inp.holdT>.22){moving=true;retrieve(dt,gear.bait().kind==='lure'?1.15:.75)}
      if(inp.released&&inp.holdT<.22&&!L.beach)twitch();
      const spook=(moving&&gear.bait().kind==='bait')?1.8:0;
      if(moving&&gear.bait().kind==='lure'&&Life.dir.st==='wait')Life.dir.wait-=dt*.55;
      if(Life.lure)Life.updateDirector(dt,spook);
    }
    An.tgt.crankV=moving?8:0;if(moving){G.nibT-=dt;if(G.nibT<=0){G.nibT=.11;Snd.tick(.6)}}
    // line floats

    if(L.dist<2.2||Math.hypot(L.x-0,L.z-ANG_Z)<2.4)reelInLure();
  }else if(st==='bite'){
    const b=G.bite;b.t+=dt;An.tgt.look=lureWorld();
    G.lure.dip=.32+.08*Math.sin(T*30);

    Bob.bobber.rotation.z=Math.sin(T*1.7)*.07;Bob.wake.visible=true;Bob.wake.position.set(L.x,.05,L.z);const s=.5+.12*Math.sin(T*2.3);Bob.wake.scale.set(s,1,s);Bob.wake.material.opacity=.25;

  }else{Bob.wake.visible=false;if(st==='idle'||st==='fight'||st==='landing')Bob.g.visible=st==='casting'}
  if(!(st==='fight'||st==='landing'||st==='wait'||st==='bite'||st==='casting'))Line.l.visible=false;
  if(st==='lost'){Line.l.visible=false}

/* ---------- camera ---------- */
function updateCamera(dt){
  const st=G.state;let dp=V3(),dt_=V3(),k=4,fov=58;const ap=AP();
  if(st==='title'||st==='boot'||G.paused&&G.menuOrbit){
    const a=Math.sin(T*.06)*1.15+.55,r=10.5+Math.sin(T*.04)*2;dp.set(Math.sin(a)*r*.9-2,3.3+Math.sin(T*.05)*.5,ap.z+1.5+Math.cos(a)*r*.9);dt_.set(0,1.3,-3-Math.sin(T*.07)*4);k=2.2;fov=60}
  else if(st==='fight'&&G.fight){const F=G.fight;const a=G.aim+F.th*.5;const sd=V3(Math.cos(a),0,Math.sin(a));const fw=aimFwd(a);
    dp.copy(ap).addScaledVector(sd,2.5).addScaledVector(fw,-4.8).add(V3(0,2.5,0));const[hx,hz]=heroXZ(F);
    dt_.set(lerp(ap.x,hx,.6),.3,lerp(ap.z,hz,.6));k=4.5;fov=57-(F.phase==='jump'?2:0)}
  else if(st==='landing'||st==='card'){const f=aimFwd(G.aim);const sd=V3(-f.z,0,f.x);const rc=V3(f.z,0,-f.x);const t=clamp(G.landT/1.6,0,1);const orb=st==='card'?Math.sin(T*.4)*.35:0;
    const hold=ap.clone().add(V3(0,1.2,0)).addScaledVector(f,.75);
    dp.copy(hold).addScaledVector(f,lerp(4.4,2.9,t)).addScaledVector(sd,lerp(-.4,-.9,t)+orb).add(V3(0,lerp(.7,.25,t),0));
    dt_.copy(hold).addScaledVector(rc,lerp(.2,1.25,t)).add(V3(0,-.15,0));k=lerp(2.5,3.2,t);fov=lerp(52,46,t)}
  else{const a=G.aim*.85;const sd=V3(Math.cos(a),0,Math.sin(a));const fw=aimFwd(a);
    dp.copy(ap).addScaledVector(sd,1.35).addScaledVector(fw,-3.3).add(V3(0,1.95,0));
    const base=ap.clone().addScaledVector(aimFwd(G.aim),9).add(V3(0,.2,0));
    if(G.lure.on&&(st==='wait'||st==='bite'||st==='casting')){const lw=lureWorld();base.lerp(lw,.5)}
    dt_.copy(base);k=3.4;fov=58}
  Cam.pos.lerp(dp,dampf(k,dt));Cam.tgt.lerp(dt_,dampf(k*1.15,dt));
  camera.fov+=(fov-camera.fov)*dampf(3,dt);camera.updateProjectionMatrix();
  camera.position.copy(Cam.pos);
  G.shake*=Math.exp(-2.4*dt);const sk=G.shake*.35;camera.position.x+=rnd(-1,1)*sk*.5;camera.position.y+=rnd(-1,1)*sk*.5;camera.position.z+=rnd(-1,1)*sk*.5;
  camera.position.y=Math.max(camera.position.y,.8);
  camera.lookAt(Cam.tgt);
}

      <div style="display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:150px;text-align:center">${here?'<span class="badge" style="color:var(--aqua)">You are here</span>':unl?`<button class="btn main" data-go="${id}">Travel</button>`:`<div class="meta">Requires Lv ${s.lvl}<br><span class="price">${money(s.cost)}</span></div><button class="btn main" data-buy="${id}" ${canBuy?'':'disabled'}>Unlock site</button>`}</div></div>`}
    h+=`<div class="card" style="opacity:.55;text-align:center"><div class="meta">More waters are being charted…</div></div></div>`;b.innerHTML=h;
    b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{UI.closeMenu();if(G.state==='title'){SV.site=x.dataset.go;saveGame();buildSite(SV.site);Life.init(Wd.site);UI.showTitle()}else travel(x.dataset.go)});
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>{const s=SITES[x.dataset.buy];if(SV.money<s.cost||levelInfo().lv<s.lvl)return;SV.money-=s.cost;SV.sites.push(s.id);saveGame();Snd.ding(5);UI.toast('Unlocked <b>'+s.name+'</b>!','#7fe3d0');UI.refreshHUD();UI.renderMenu()})},
  shopTab(b){const li=levelInfo();let h='';
    const sect=(title,type,arr)=>{h+=`<div class="sec">${title}</div><div class="grid">`;
      for(const it of arr){const own=SV.owned[type].includes(it.id),eq=SV.eq[type]===it.id,lock=li.lv<it.lvl;
        let st='';if(type==='rod')st=statBar('Cast',it.cast,52)+statBar('Power',it.pow,3.6)+statBar('Control',it.ctl,2);else if(type==='reel')st=statBar('Speed',it.speed,1.95)+statBar('Drag',it.drag,1.8);else if(type==='line')st=statBar('Strength',it.lb,90);
        else{const tg=Object.entries(it.aff).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${TAGN[k]||k} ×${v}`);st=`<div class="meta" style="margin-top:6px;line-height:1.5">${tg.join('<br>')}</div>`}
        h+=`<div class="card ${eq?'eq':''} ${lock?'lock':''}"><canvas class="gi" width="120" height="70" data-t="${type}" data-i="${it.id}" style="width:100%;height:60px;display:block;margin-bottom:4px"></canvas><h4>${it.name}</h4><div class="meta">${it.desc}</div>${st}
        <div style="margin-top:9px;display:flex;justify-content:space-between;align-items:center">${own?(eq?'<span class="badge" style="color:var(--aqua)">Equipped</span>':`<button class="btn sm" data-eq="${type}:${it.id}">Equip</button>`):lock?`<span class="meta">Lv ${it.lvl}</span>`:`<span class="price">${money(it.cost)}</span>`}
        ${!own&&!lock?`<button class="btn sm main" data-buy="${type}:${it.id}" ${SV.money>=it.cost?'':'disabled'}>Buy</button>`:''}</div></div>`}
      h+='</div>'};
    sect('Rods','rod',RODS);sect('Reels','reel',REELS);sect('Lines','line',LINES);sect('Bait & lures','bait',BAITS);b.innerHTML=h;
    b.querySelectorAll('canvas.gi').forEach(c=>{const arr=GEAR[c.dataset.t];gearIcon(c,c.dataset.t,arr.find(x=>x.id===c.dataset.i))});
    b.querySelectorAll('[data-eq]').forEach(x=>x.onclick=()=>{const[t,i]=x.dataset.eq.split(':');SV.eq[t]=i;saveGame();UI.refreshHUD();UI.renderMenu();const sc=$('mbody');})
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>{const[t,i]=x.dataset.buy.split(':');const it=GEAR[t].find(y=>y.id===i);if(SV.money<it.cost)return;SV.money-=it.cost;SV.owned[t].push(i);SV.eq[t]=i;saveGame();Snd.coin();Snd.ding(2);UI.toast('Bought <b>'+it.name+'</b>','#f2c46d');UI.refreshHUD();const y=b.scrollTop;UI.renderMenu();$('mbody').scrollTop=y})
  },
  journalTab(b){let h=`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">${SITE_ORDER.map(id=>`<button class="btn sm ${id===this.jsite?'main':''}" data-js="${id}">${SITES[id].name}</button>`).join('')}</div>`;
    const S=SITES[this.jsite];const sp=S.fish.map(f=>SP[f]);const got=sp.filter(s=>SV.journal[s.id]).length;
    h+=`<div class="meta" style="margin-bottom:10px">${got}/${sp.length} species logged at ${S.name}</div><div class="grid">`;
    for(const s of sp){const j=SV.journal[s.id];h+=`<div class="card fcard"><canvas width="240" height="110" data-f="${s.id}"></canvas><h4>${j?s.name:'???'}</h4><span class="badge" style="color:${RAR[s.rar].col}">${RAR[s.rar].name}</span>
      ${j?`<div class="meta" style="margin-top:7px">Caught ×${j.n} · Best <b style="color:var(--gold)">${j.best} lb</b> · ${j.bestLen} in</div><div class="meta" style="margin-top:4px;font-style:italic;line-height:1.4">${s.desc}</div><div class="meta" style="margin-top:5px">Likes: ${s.tags.map(t=>TAGN[t]||t).join(', ')}</div>`:`<div class="meta" style="margin-top:7px">Not yet caught. ${s.rar===3?'Rumours say something huge lurks here…':'Try different baits and distances.'}</div>`}</div>`}
    b.innerHTML=h+'</div>';
    b.querySelectorAll('canvas[data-f]').forEach(c=>{const s=SP[c.dataset.f];drawFish2D(c,s,SV.journal[s.id]?{}:{sil:true,q:true})});
    b.querySelectorAll('[data-js]').forEach(x=>x.onclick=()=>{this.jsite=x.dataset.js;this.renderMenu()})},
  goalsTab(b){const row=c=>`<div class="card" style="${c.done?'border-color:var(--aqua)':''}"><div style="display:flex;justify-content:space-between"><b>${chText(c)}</b><span class="price">${money(c.money)} · ${c.xp} XP</span></div><div class="prog"><u style="width:${c.prog/c.n*100}%"></u></div><div class="meta" style="margin-top:5px">${c.done?'Complete':c.prog+' / '+c.n}</div></div>`;
    const s=SV.stats;b.innerHTML=`<div class="sec">Today’s goals</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${SV.daily.list.map(row).join('')}</div><div class="sec" style="margin-top:20px">Weekly challenge</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${SV.weekly.item?row(SV.weekly.item):''}</div>
    <div class="sec" style="margin-top:20px">Career</div><div class="grid">${[['Fish landed',s.catch],['Released',s.release],['Total earned',money(s.earn)],['Fights won with great control',s.perfect],['Trophy fish',s.trophy],['Lines snapped',s.snaps],['Got away',s.lost]].map(([a,v])=>`<div class="card"><div class="meta">${a}</div><div style="font-family:var(--serif);font-size:28px;font-weight:700">${v}</div></div>`).join('')}</div>`},
  setTab(b){b.innerHTML=`<div class="sec">Settings</div><div class="setrow"><span>Sound & music</span><button class="btn sm" id="sset">${Snd.on?'On':'Off'}</button></div>
  <div class="setrow"><span>Render resolution <small style="color:var(--dim)">(lower = faster)</small></span><input type="range" id="qpr" min="0.6" max="2" step="0.1" value="${QUAL.pr}"></div>
  <div class="setrow"><span>Shadows</span><button class="btn sm" id="qsh">${QUAL.shadows?'On':'Off'}</button></div>
  <div class="setrow"><span>Controls</span><span class="meta">Click/Space = cast · hook · reel &nbsp; Mouse or A/D = aim &amp; steer &nbsp; Shift/S/Right-click = give line &nbsp; Q/E = bait &nbsp; Tab = menu</span></div>
  <div class="setrow"><span>Reset all progress</span><button class="btn sm" id="rst" style="color:#ff8a7a">Reset…</button></div>`;
    $('sset').onclick=()=>{Snd.toggle();UI.renderMenu()};$('qpr').oninput=e=>{QUAL.pr=+e.target.value;renderer.setPixelRatio(QUAL.pr);onResize();lsSet('reeldeep.q',QUAL)};
    $('qsh').onclick=()=>{QUAL.shadows=!QUAL.shadows;renderer.shadowMap.enabled=QUAL.shadows;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});lsSet('reeldeep.q',QUAL);UI.renderMenu()};
    $('rst').onclick=()=>{if(confirm('Erase all Reel Deep progress?')){try{localStorage.removeItem('reeldeep.save')}catch(e){}location.reload()}}},
  /* catch card */
  showCatch(F){
    const sp=F.sp,rec=F.rec,r=RAR[sp.rar];const j=SV.journal[sp.id];const isNew=!j,isRec=!!j&&rec.wt>j.best;
    const base=fishValue(sp,rec.wt);const ctrl=F.band/Math.max(1,F.time);const perfect=ctrl>=.55&&F.shake<.6&&F.snap<.5;
    const lines=[['Catch value',base]];
    if(rec.trophy)lines.push(['Trophy size',Math.round(base*.25)]);
    if(perfect)lines.push(['Great control',Math.round(base*.2)]);
    if(F.maxCombo>=5)lines.push(['Master combo ×'+F.maxCombo,Math.round(base*.1)]);
    if(F.perfectHook)lines.push(['Perfect hook set',Math.round(base*.05)]);
    if(isNew)lines.push(['New species discovery',[30,70,160,500][sp.rar]]);
    if(isRec)lines.push(['New personal record',40+Math.round(rec.wt*2)]);
    const total=lines.reduce((a,b)=>a+b[1],0);
    let xp=r.xp*(.7+.8*rec.u)*(perfect?1.3:1)+(isNew?[20,45,100,400][sp.rar]:0)+F.holds*6+F.bows*6;xp=Math.round(xp);
    G.pending={sp,rec,total,xp,perfect,isNew,isRec,F};
    const tags=(rec.trophy?'<span class="tag g">TROPHY</span>':'')+(isNew?'<span class="tag n">NEW SPECIES</span>':'')+(isRec?'<span class="tag n">NEW RECORD</span>':'')+(perfect?'<span class="tag g">GREAT CONTROL</span>':'')+(F.holds?`<span class="tag">Held ${F.holds} run${F.holds>1?'s':''}</span>`:'')+(F.bows?`<span class="tag">Bowed ×${F.bows}</span>`:'');
    const c=$('card');c.classList.remove('hidden');c.innerHTML=`<div class="cc" style="border-color:${r.col}66;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px ${r.col}33">
      <div class="rib" style="color:${r.col}">${r.name}${sp.rar===3?' · LEGEND':''}</div><h2>${sp.name}</h2>
      <canvas id="ccv" width="440" height="150"></canvas>
      <div class="sizes"><div><small>Weight</small>${rec.wt} lb</div><div><small>Length</small>${rec.len} in</div><div><small>Value</small>${money(base)}</div></div>
      <div style="margin-top:8px">${tags}</div>
      <div class="lines">${lines.map((l,i)=>`<div style="animation-delay:${.35+i*.22}s"><span>${l[0]}</span><b>+${money(l[1])}</b></div>`).join('')}<div class="tot" style="animation-delay:${.4+lines.length*.22}s"><span>Total</span><b>${money(total)}</b></div><div style="animation-delay:${.5+lines.length*.22}s"><span>Experience</span><b style="color:var(--aqua)">+${xp} XP</b></div></div>
      <div class="meta" style="font-style:italic;margin-bottom:6px">${sp.desc}</div>
      <div class="acts"><button class="btn main" id="ckeep">Keep &amp; sell · ${money(total)}</button><button class="btn" id="crel">Release · +${Math.round(xp*.5)} bonus XP</button></div></div>`;
    drawFish2D($('ccv'),sp,{});setState('card');
    $('ckeep').onclick=()=>UI.finishCatch(true);$('crel').onclick=()=>UI.finishCatch(false);
    Snd.coin()},
  finishCatch(keep){
    const p=G.pending;if(!p)return;G.pending=null;const{sp,rec,total,xp,perfect,isNew,isRec,F}=p;const S=SV.stats;
    S.catch++;let jr=SV.journal[sp.id];if(!jr)jr=SV.journal[sp.id]={n:0,best:0,bestLen:0,rel:0};jr.n++;if(rec.wt>jr.best){jr.best=rec.wt;jr.bestLen=rec.len}
    if(rec.trophy)S.trophy++;if(perfect)S.perfect++;
    let gx=xp;if(keep){addMoney(total);S.earn+=total;chBump('earn',total);Snd.coin()}else{jr.rel++;S.release++;gx=Math.round(xp*1.5);chBump('release');UI.toast('Released — it swims off strong.','#7fe3d0')}
    chBump('catch');if(sp.rar>=1)chBump('unc');if(sp.rar>=2)chBump('rare');if(perfect)chBump('perfect');if(rec.trophy)chBump('trophy');
    gainXP(gx);if(isNew)UI.toast('<b>'+sp.name+'</b> added to your journal','#7fe3d0');
    saveGame();$('card').classList.add('hidden');killHero();Line.l.visible=false;G.result=null;G.cardShown=false;G.landFX=false;G.fight=null;
    An.pose('idle');An.tgt.look=null;setState('idle')}
};

window.__rd={simulate,sim(n,dt=.033){for(let i=0;i<n;i++)simulate(dt)},render(){renderer.render(scene,camera)},G,SV,Life,Wd,An,UI,SP,SITES,buildSite,travel,Cam,Snd,camera,scene,renderer,inp,startFight,updateFight,addRipple,splashAt,levelInfo,gear,fishValue,rollSize,makeFish,drawFish2D,get T(){return T},setT(v){T=v},get Hero(){return Hero}};
boot();



})();
