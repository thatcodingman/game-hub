<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reel Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(9,22,30,.58);--glass2:rgba(9,22,30,.82);--edge:rgba(255,255,255,.14);--cream:#f6efe0;--dim:#a9bcc4;--aqua:#7fe3d0;--gold:#f2c46d;--red:#ff6b5b;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
--c0:#cfd8dc;--c1:#7be08b;--c2:#62b4ff;--c3:#ffc247}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a141a;color:var(--cream);font-family:var(--sans);user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,8,14,.45) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .5s}
#fade{position:absolute;inset:0;pointer-events:none;background:#06121a;opacity:0;transition:opacity .45s;z-index:50}
#fade.on{opacity:1;pointer-events:auto}
.hidden{display:none!important}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{position:absolute}
.pill{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:9px;white-space:nowrap}
#top-l{top:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#p-money b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:16px}
#p-lvl .xpbar{display:block;width:90px;height:6px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}
#p-lvl .xpbar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),#b6ffe9);border-radius:9px;transition:width .5s}
#top-c{top:14px;left:50%;transform:translateX(-50%);text-align:center}
#site-name{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#activity{margin-top:4px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;min-height:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#top-r{top:16px;right:16px;display:flex;gap:8px;pointer-events:auto}
button{font-family:var(--sans);cursor:pointer}
.btn{background:var(--glass);color:var(--cream);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;letter-spacing:.04em;transition:.15s}
.btn:hover{background:rgba(40,70,84,.7);border-color:rgba(255,255,255,.3)}
.btn.main{background:linear-gradient(180deg,#f7d58a,#e0a94a);color:#2a1d05;border:none;box-shadow:0 6px 22px rgba(240,180,70,.35)}
.btn.main:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
#tackle{left:16px;bottom:16px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#tackle .chip{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:14px;padding:7px 12px 7px 8px;cursor:pointer}
#tackle .chip canvas{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.07)}
#tackle small{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
#tackle b{font-size:13px}
#prompt{bottom:84px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);border-radius:999px;padding:9px 20px;font-size:14px;font-weight:600;max-width:min(94vw,820px);text-align:center;transition:opacity .25s}
#prompt kbd{background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800;margin:0 2px}
#prompt.off{opacity:0}
#prompt.top{bottom:auto;top:84px;font-size:13px;padding:7px 16px}
#castmeter{bottom:130px;left:50%;transform:translateX(-50%);width:min(70vw,360px);height:12px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--edge);overflow:hidden}
#castmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fe3d0,#f2c46d,#ff6b5b)}
#castdist{bottom:148px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:22px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#fight{inset:0}
#fight>*{position:absolute}
#gauge{bottom:22px;left:50%;transform:translateX(-50%);width:min(60vw,330px)}
#gauge svg{width:100%;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
#gauge .lab{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
#fbars{right:20px;top:50%;transform:translateY(-50%);display:flex;gap:14px;align-items:flex-end;height:230px}
.vbar{width:16px;height:100%;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid var(--edge);position:relative;overflow:hidden}
.vbar i{position:absolute;left:0;right:0;bottom:0;border-radius:10px;transition:height .1s linear}
.vbar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);letter-spacing:.1em;font-weight:800;text-transform:uppercase}
.vwrap{position:relative;height:100%}
#sta i{background:linear-gradient(0deg,#ff8c5b,#ffd17a)}
#dis i{background:linear-gradient(0deg,#4fb9ff,#8ff0ff)}
#compass{bottom:214px;left:50%;transform:translateX(-50%);width:min(52vw,300px);height:30px}
#compass .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid var(--edge)}
#compass .zone{position:absolute;top:8px;height:14px;border-radius:7px;background:rgba(127,227,208,.35);border:1px solid rgba(127,227,208,.7);transition:left .12s,width .12s}
#compass .fd{position:absolute;top:2px;width:26px;height:26px;margin-left:-13px;transform:translateX(0);font-size:20px;line-height:26px;text-align:center;color:#ffd17a;text-shadow:0 0 10px rgba(255,170,60,.8)}
#compass .st{position:absolute;top:5px;width:6px;height:20px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff}
#combo{bottom:252px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);transition:transform .12s;white-space:nowrap}
#combo small{font-family:var(--sans);font-size:11px;letter-spacing:.16em;color:var(--cream);margin-left:8px;opacity:.85}
#warn{top:30%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,64px);letter-spacing:.06em;text-shadow:0 4px 24px rgba(0,0,0,.65);opacity:0;white-space:nowrap}
#warn.show{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#toasts{top:78px;right:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--glass2);border:1px solid var(--edge);border-left:3px solid var(--gold);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;animation:tin .35s ease-out;max-width:300px}
.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(6,16,22,.15),rgba(6,16,22,.72));flex-direction:column;text-align:center;padding:20px}
#title h1{font-family:var(--serif);font-weight:700;font-size:clamp(54px,11vw,128px);margin:0;letter-spacing:.04em;line-height:.95;text-shadow:0 6px 40px rgba(0,0,0,.55);background:linear-gradient(180deg,#fff7e0,#f2c46d 70%,#d99a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{font-family:var(--serif);font-size:clamp(17px,2.4vw,26px);font-style:italic;color:var(--cream);opacity:.9;margin:8px 0 28px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#title .how{margin-top:26px;font-size:13px;color:var(--dim);line-height:1.8;max-width:560px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#title .how b{color:var(--cream)}
#title .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#menu{background:rgba(5,14,20,.62);backdrop-filter:blur(6px)}
.panel{background:var(--glass2);border:1px solid var(--edge);border-radius:20px;width:min(1020px,94vw);height:min(660px,90vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ptabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--edge);align-items:center}
.ptabs .tab{background:none;border:none;color:var(--dim);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:11px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs .tab.on{color:var(--cream);border-color:var(--gold)}
.ptabs .sp{flex:1}
.pbody{flex:1;overflow:auto;padding:18px 20px}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:14px;padding:12px;position:relative}
.card h4{margin:0 0 3px;font-size:14px}
.card .meta{font-size:11px;color:var(--dim);letter-spacing:.06em}
.card.eq{border-color:var(--aqua);box-shadow:0 0 0 1px rgba(127,227,208,.3) inset}
.card.lock{opacity:.55}
.stat{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.08em;text-transform:uppercase}
.stat i{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.stat i u{display:block;height:100%;background:var(--aqua);border-radius:5px}
.stat span{width:50px}
.sec{font-family:var(--serif);font-size:22px;font-weight:700;margin:6px 0 10px;color:var(--gold)}
.price{font-weight:800;color:var(--gold)}
.site{display:flex;gap:14px;align-items:stretch}
.site .pic{width:150px;min-height:110px;border-radius:12px;flex:none;position:relative;overflow:hidden}
.site .pic:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 55%)}
.fcard canvas{width:100%;height:68px;display:block;margin-bottom:6px}
.badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:9px;border:1px solid currentColor}
.prog{height:7px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.prog u{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--gold))}
#card{background:radial-gradient(ellipse at 28% 50%,rgba(0,0,0,0) 0%,rgba(4,10,16,.55) 80%);justify-content:flex-end;padding-right:max(3vw,24px);pointer-events:none}
#card.hidden{display:none}
.cc{pointer-events:auto;width:min(420px,92vw);background:var(--glass2);border:1px solid var(--edge);border-radius:22px;padding:20px 22px 18px;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:ccin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes ccin{from{opacity:0;transform:translateX(60px) scale(.96)}}
.cc .rib{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.cc h2{font-family:var(--serif);font-size:38px;margin:2px 0 4px;line-height:1}
.cc canvas{width:100%;height:110px;display:block;margin:6px 0}
.cc .sizes{display:flex;gap:18px;font-family:var(--serif);font-size:26px;font-weight:700}
.cc .sizes small{display:block;font-family:var(--sans);font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.cc .tag{display:inline-block;margin:2px 4px 2px 0;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.1)}
.cc .tag.g{background:rgba(242,196,109,.2);color:var(--gold)}
.cc .tag.n{background:rgba(127,227,208,.2);color:var(--aqua)}
.lines{margin:10px 0;border-top:1px solid var(--edge);padding-top:8px}
.lines div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;opacity:0;animation:li .35s forwards}
@keyframes li{to{opacity:1}}
.lines .tot{font-weight:800;font-size:17px;border-top:1px solid var(--edge);margin-top:5px;padding-top:6px}
.lines b{color:var(--gold)}
.cc .acts{display:flex;gap:10px;margin-top:12px}
.cc .acts .btn{flex:1;padding:11px}
#lvlup{top:34%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--serif);font-weight:700;font-size:clamp(32px,5vw,54px);color:var(--gold);text-shadow:0 4px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none}
#lvlup small{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.2em;color:var(--cream);font-weight:700}
#lvlup.show{animation:pop 2.6s ease-out forwards}
input[type=range]{accent-color:#7fe3d0}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);font-size:14px}
@media(max-width:700px){#fbars{height:160px;right:10px}.site .pic{width:90px}.panel{height:94vh}#top-c{top:56px}}

#finder{position:absolute;top:70px;right:16px;width:150px;height:150px;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 24px rgba(120,255,210,.18);pointer-events:none}
#finder.hidden{display:none}
@media(max-width:700px){#finder{width:104px;height:104px;top:62px}}

#rowpad{position:absolute;right:16px;bottom:96px;display:none;flex-direction:column;gap:8px;pointer-events:auto}
#rowpad button{background:var(--glass);border:1px solid var(--edge);color:#fff;border-radius:14px;padding:16px 20px;font:800 15px inherit;font-family:inherit;backdrop-filter:blur(10px);touch-action:none}
@media(pointer:coarse){#rowpad:not(.hidden){display:flex}}

/* touch + tutorial */
#swap{position:absolute;left:16px;bottom:86px;display:none;gap:8px;pointer-events:auto}
#swap.off{opacity:0;pointer-events:none}
#swap button,#b-give{background:var(--glass);border:1px solid var(--edge);color:#fff;border-radius:14px;font:800 15px inherit;font-family:inherit;backdrop-filter:blur(10px);touch-action:none;user-select:none;-webkit-user-select:none}
#swap button{padding:12px 18px}
#b-give{position:absolute;left:18px;bottom:22px;width:92px;height:92px;border-radius:50%;pointer-events:auto;font-size:13px;line-height:1.2;letter-spacing:.06em;background:rgba(240,89,74,.35);border-color:rgba(255,160,150,.6)}
#b-give:active{background:rgba(240,89,74,.7)}
#b-give.hidden{display:none}
html.touch #swap{display:flex}
html:not(.touch) #b-give{display:none}
#tut{position:absolute;top:128px;left:50%;transform:translateX(-50%);max-width:min(560px,90vw);display:flex;gap:12px;align-items:center;background:rgba(10,22,30,.82);border:1px solid #7fe3d0;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.35;pointer-events:auto;animation:tutin .4s ease}
#tut.hidden{display:none}
#tut kbd{background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800}
#tut button{background:transparent;border:1px solid var(--edge);color:var(--dim);border-radius:999px;padding:4px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
@keyframes tutin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#071217;color:#fff;align-items:center;justify-content:center;text-align:center;font:700 22px/1.5 system-ui;padding:20px}
#rotate small{display:block;font-weight:400;font-size:14px;color:#9fb9c4}
@media(pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
html.touch,html.touch body,html.touch #app{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media(pointer:coarse) and (max-height:520px){#prompt{bottom:10px;font-size:12px;padding:6px 14px;max-width:62vw;text-align:center}#tackle{bottom:10px;left:10px}#tackle .chip small{display:none}#swap{bottom:60px;left:10px}#top-l,#top-r{top:8px}#top-l{left:10px}#top-r{right:10px}#top-c{top:6px}#rowpad{bottom:60px}#tut{top:124px;font-size:12px}.btn{padding:7px 12px;font-size:12px}#b-give{width:78px;height:78px;bottom:14px;left:14px}}

</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="top-l"><div class="pill" id="p-money">$ <b>0</b></div><div class="pill" id="p-lvl"><span>Lv <b>1</b></span><i class="xpbar"><u></u></i></div></div>
  <div id="top-c"><div id="site-name"></div><div id="activity"></div></div>
  <div id="top-r"><button class="btn" id="b-boat">Boat · B</button><button class="btn" id="b-menu">Menu · Tab</button><button class="btn" id="b-snd">Sound</button></div>
  <div id="tackle"><div class="chip" id="t-bait"><canvas width="68" height="68"></canvas><div><small>Bait</small><b></b></div></div><div class="chip" id="t-rod"><canvas width="68" height="68"></canvas><div><small>Rod</small><b></b></div></div></div>
  <div id="rowpad" class="hidden"><button id="row-f">▲ Row</button><button id="row-b">▼</button></div>
  <canvas id="finder" class="hidden" width="300" height="300"></canvas>
  <div id="castdist" class="hidden"></div>
  <div id="castmeter" class="hidden"><i></i></div>
  <div id="prompt"></div>
  <div id="fight" class="hidden">
    <div id="warn"></div>
    <div id="combo"></div>
    <div id="compass"><div class="tr"></div><div class="zone"></div><div class="fd">◆</div><div class="st"></div></div>
    <div id="gauge"><svg viewBox="0 0 330 190"><g id="gzones"></g><g id="gticks"></g><line id="gneedle" x1="165" y1="170" x2="165" y2="46" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="165" cy="170" r="11" fill="#fff"/><text id="gnum" x="165" y="132" text-anchor="middle" fill="#fff" font-size="30" font-family="Cormorant Garamond,serif" font-weight="700"></text></svg><div class="lab">Line Tension</div></div>
    <div id="fbars"><div class="vwrap"><div class="vbar" id="sta"><i></i></div><span>Stamina</span></div><div class="vwrap"><div class="vbar" id="dis"><i></i></div><span>Distance</span></div></div>
  </div>
  <div id="swap"><button id="sw-l" aria-label="Previous bait">◀</button><button id="sw-r" aria-label="Next bait">▶</button></div>
  <button id="b-give" class="hidden">GIVE<br>LINE</button>
  <div id="tut" class="hidden"><span></span><button id="tut-x">Skip</button></div>
  <div id="lvlup"></div>
  <div id="toasts"></div>
</div>
<div id="title" class="screen hidden"></div>
<div id="menu" class="screen hidden"></div>
<div id="card" class="screen hidden"></div>
<div id="rotate"><div>↻<br>Rotate your phone<br><small>Reel Deep plays best in landscape</small></div></div>
<div id="fade" class="on"></div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dampf=(k,dt)=>1-Math.exp(-k*dt);

/* ---------- fish model ---------- */
function prof(t,k){let p;if(t<k)p=Math.pow(Math.sin(t/k*Math.PI/2),.6);else p=Math.pow(Math.cos((t-k)/(1-k)*Math.PI/2),1.1);return Math.max(p,t>.86?.05:0)}
function hh(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}
function makeFish(sp,o={}){
  const lk=sp.look,N=o.lod?12:30,M=o.lod?6:14,k=lk.k,H=lk.asp/2,W=H*lk.wf;
  const back=HEX(lk.back),belly=HEX(lk.belly),mc=HEX(lk.mc||'#000'),fin=HEX(lk.fin),tmp=new THREE.Color();
  const P=[],C=[],I=[];const WHT=new THREE.Color('#ffffff');
  for(let i=0;i<=N;i++){const t=i/N,x=.5-t;let p=prof(t,k);if(lk.head==='big'&&t<.3)p*=1.07;
    for(let j=0;j<=M;j++){const ph=j/M*Math.PI*2,cy=Math.cos(ph),sz=Math.sin(ph);
      let y=H*p*cy*(cy<0?.9:1),z=W*p*sz;
      if((lk.head==='long')&&t<.2){z*=.75;y*=.8}
      if(lk.head==='blunt'&&t<.22){y*=1.1}
      P.push(x,y,z);
      const b=sstep(.3,-.45,cy);tmp.copy(back).lerp(belly,b);
      const m=lk.mark;
      if(m==='bars'&&cy>-.2&&t>.2&&t<.88){const w=Math.sin(t*Math.PI*9)*.5+.5;tmp.lerp(mc,sstep(.6,.85,w)*(1-b)*.85)}
      else if(m==='stripe'){const band=1-sstep(.1,.34,Math.abs(cy+.02));if(t>.16)tmp.lerp(mc,band*.9)}
      else if(m==='lines'){const l=Math.sin(cy*16);if(l>.72&&cy>-.45&&t>.12)tmp.lerp(mc,.55)}
      else if(m==='spots'){if(cy>-.3&&t>.14&&hh(i*1.7,j*2.3)>.8)tmp.lerp(mc,.9)}
      else if(m==='mottle'){const n=vnoise(t*16,ph*2.4,3);if(n>.56&&t>.14)tmp.lerp(mc,.65*(1-b*.6))}
      else if(m==='scales'){const s=Math.abs(Math.sin(t*70))*Math.abs(Math.sin(ph*9+t*30));tmp.lerp(mc,sstep(.7,.95,s)*.28)}
      else if(m==='scutes'){const r=Math.abs(cy-.55)<.13||Math.abs(cy+.5)<.1||Math.abs(cy-.02)<.09;if(r&&t>.2&&Math.sin(t*90)>.2)tmp.lerp(mc,.7)}
      if(lk.stripe&&Math.abs(cy-.05)<.26&&t>.2&&t<.9)tmp.lerp(HEX(lk.stripe),.7*(1-Math.abs(cy-.05)/.26));
      if(lk.cheek&&t>.1&&t<.19&&Math.abs(cy-.05)<.45&&Math.abs(sz)>.6)tmp.lerp(HEX(lk.cheek),.9);
      if(t>.18&&t<.205)tmp.multiplyScalar(.72);
      if(t>.205&&t<.23&&cy>-.5)tmp.multiplyScalar(1.1);
      if(t>.2&&t<.86){const fl=Math.exp(-Math.pow((cy+.12)*2.6,2));tmp.lerp(WHT,.13*fl*(1-.5*sstep(.5,.9,t)));if(Math.abs(cy-.02)<.045&&t>.22)tmp.multiplyScalar(.82)}
      if(t<.045&&cy<-.2&&cy>-.6)tmp.multiplyScalar(.55);
      if(t>.5&&cy>.7)tmp.multiplyScalar(.9);
      tmp.multiplyScalar(.95+.1*hh(i,j*1.3));
      C.push(tmp.r,tmp.g,tmp.b);
    }}
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;I.push(a,a+1,b,a+1,b+1,b)}
  const ga=new THREE.BufferGeometry();ga.setAttribute('position',new THREE.Float32BufferAttribute(P,3));ga.setAttribute('color',new THREE.Float32BufferAttribute(C,3));ga.setIndex(I);ga.computeVertexNormals();
  // parts (fins, eyes, tail) non-indexed
  const bp=[],bc=[];
  const tri=(a,b,c,ca,cb,cc)=>{bp.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);const q=ca,r=cb||ca,s=cc||ca;bc.push(q.r,q.g,q.b,r.r,r.g,r.b,s.r,s.g,s.b)};
  const finBase=fin.clone().multiplyScalar(.85),finTip=fin.clone().lerp(mc,.18).multiplyScalar(1.08);
  const strip=(t0,t1,hd,top,shape,zo=0,mirror=false)=>{const n=lod(8,4);let prev=null;for(let s=0;s<=n;s++){const u=s/n,t=lerp(t0,t1,u),x=.5-t,p=prof(t,k),sgn=top?1:-1;
      const hgt=hd*shape(u)*H;const base=[x,sgn*H*p*.92,zo],tipP=[x-(top?.03:.04)*u*hd/H*.4,sgn*(H*p*.92+hgt),zo];
      if(prev){tri(prev[0],prev[1],base,finBase,finTip,finBase);tri(prev[1],tipP,base,finTip,finTip,finBase)}prev=[base,tipP]}};
  function lod(a,b){return o.lod?b:a}
  const dors=lk.dors;
  if(dors==='single')strip(.34,.58,.75,true,u=>Math.sin(Math.pow(u,.7)*Math.PI)*(1-.3*u)+.05);
  else if(dors==='double'){strip(.27,.5,.6,true,u=>(Math.sin(u*Math.PI*4.5)*.15+.85)*Math.sin(Math.pow(u,.6)*Math.PI)+.04);strip(.55,.69,.5,true,u=>Math.sin(u*Math.PI)*.8+.1)}
  else if(dors==='long')strip(.2,.8,.42,true,u=>Math.sin(u*Math.PI)*.8+.2);
  else if(dors==='sail')strip(.17,.84,1.55,true,u=>Math.pow(Math.sin(Math.pow(u,.8)*Math.PI),.8)*(1-.15*u)+.04);
  else if(dors==='back'){strip(.62,.76,.8,true,u=>Math.sin(u*Math.PI)*.9+.1);strip(.64,.77,.7,false,u=>Math.sin(u*Math.PI)*.9+.1)}
  if(dors!=='back'&&dors!=='sail')strip(.64,.78,.55,false,u=>Math.sin(u*Math.PI)*.85+.15);
  if(dors==='sail')strip(.66,.8,.6,false,u=>Math.sin(u*Math.PI)*.85+.1);
  // pelvic + pectoral
  for(const sgn of[-1,1]){
    const t=.26,x=.5-t,p=prof(t,k),y=-H*p*.32,z=sgn*W*p*.97,L=lk.dors==='sail'&&sp.id==='mahi'?.16:.1;
    tri([x,y,z],[x-L,y-H*.12,z+sgn*.05],[x-L*.55,y+H*.1,z+sgn*.03],finBase,finTip,finBase);
    const t2=.4,x2=.5-t2,p2=prof(t2,k),y2=-H*p2*.88,z2=sgn*W*p2*.3;
    tri([x2,y2,z2],[x2-.08,y2-H*.3,z2+sgn*.02],[x2-.03,y2-H*.05,z2],finBase,finTip,finBase);
    if(!o.lod){const t3=.115,x3=.5-t3,p3=prof(t3,k),e=Math.max(.008,H*.17);
      const ey=H*p3*.25,ez=sgn*W*p3*.9;const eye=HEX(lk.eye||'#111');const white=new THREE.Color('#e9e9dc');const hi=new THREE.Color('#ffffff');
      // eyeball as 2 small octa-discs
      const R=e,ez2=ez+sgn*e*.35;
      for(let a=0;a<8;a++){const a0=a/8*Math.PI*2,a1=(a+1)/8*Math.PI*2;tri([x3,ey,ez2],[x3+Math.cos(a0)*R*1.15,ey+Math.sin(a0)*R*1.15,ez2],[x3+Math.cos(a1)*R*1.15,ey+Math.sin(a1)*R*1.15,ez2],white);
        if(a===1)tri([x3-R*.2,ey+R*.25,ez2+sgn*.003],[x3-R*.05,ey+R*.25,ez2+sgn*.003],[x3-R*.12,ey+R*.4,ez2+sgn*.003],hi);
        tri([x3,ey,ez2+sgn*.0015],[x3+Math.cos(a0)*R*.62,ey+Math.sin(a0)*R*.62,ez2+sgn*.0015],[x3+Math.cos(a1)*R*.62,ey+Math.sin(a1)*R*.62,ez2+sgn*.0015],eye)}}
  }
  // barbels
  if(lk.whisk){for(const sgn of[-1,1])for(const yy of[-.22,-.4]){const x=.5-.01,z=sgn*W*.35;tri([x,H*yy,z],[x+.09,H*yy-.12*H,z+sgn*W*.9],[x+.02,H*yy-.03*H,z+sgn*W*.2],finBase,finTip,finBase)}}
  // bill
  if(lk.bill){const L=.24,r=H*.16,pts=[0,1,2,3].map(a=>[Math.cos(a*Math.PI/2)*r,Math.sin(a*Math.PI/2)*r*.8]);const bc2=HEX(lk.back).multiplyScalar(.65);
    for(let a=0;a<4;a++){const p0=pts[a],p1=pts[(a+1)%4];tri([.5,p0[1],p0[0]],[.5,p1[1],p1[0]],[.5+L,0,0],bc2)}}
  // tail

  let poly;

  else if(lk.tail==='round')poly=[[0,pw],[-tl*.6,th*.85],[-tl*1.05,th*.35],[-tl*1.1,0],[-tl*1.05,-th*.35],[-tl*.6,-th*.85],[0,-pw]];

  else if(lk.tail==='hetero')poly=[[0,pw],[-tl*1.6,th*1.5],[-tl*.55,th*.1],[-tl*.95,-th*.6],[0,-pw]];

  for(let i=0;i<poly.length-1;i++){const a=poly[i],b=poly[i+1];tri([X+ctr[0],ctr[1],0],[X+a[0],a[1],0],[X+b[0],b[1],0],finBase,finTip,finTip)}

  const gb=new THREE.BufferGeometry();gb.setAttribute('position',new THREE.Float32BufferAttribute(bp,3));gb.setAttribute('color',new THREE.Float32BufferAttribute(bc,3));gb.computeVertexNormals();

/* ---------- boat: rowing, boarding, deep hole ---------- */
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function findPit(S){if(S.lake.pit)return{x:S.lake.cx+S.lake.pit.x,z:S.lake.cz+S.lake.pit.z,r:S.lake.pit.r};let best=null,bs=-1e9;
  for(let z=-125;z<=-42;z+=3)for(let x=-55;x<=55;x+=3){const h=Wd.H(x,z);if(h>-3.2)continue;let m=0;for(const[dx,dz]of[[9,0],[-9,0],[0,9],[0,-9]])m+=Wd.H(x+dx,z+dz);m/=4;if(m>-2.2)continue;
    const sc=-h-Math.abs(x)*.04-Math.abs(z+78)*.035;if(sc>bs){bs=sc;best={x,z,r:15}}}
  if(!best){best={x:S.lake.cx*.3,z:-70,r:15}}return best}
Wd.pitInt=(x,z)=>{const p=Wd.pit;if(!p)return 0;return sstep(1.05,.4,Math.hypot(x-p.x,z-p.z)/p.r)};
function boatToast(m){if(T-Bt.tt>2.5){Bt.tt=T;UI.toast(m,'#ffd27a')}}
function updateBoat(dt){const h=Bt.hull;if(!h)return;let mv=0;
  if(Bt.on&&G.state==='idle'&&!G.paused){
    const up=inp.keys['w']||inp.keys['arrowup'],dn=inp.keys['s']||inp.keys['arrowdown'];const acc=up?1:dn?-.6:0;
    Bt.v+=acc*2.5*dt;Bt.v*=Math.exp(-(acc?.45:1.3)*dt);Bt.v=clamp(Bt.v,-1.7,3.6);
    if(Math.abs(Bt.v)>.1){
      if(Bt.v>0)Bt.hd+=angDiff(G.aim,Bt.hd)*Math.min(1,dt*1.9*Math.min(1,Bt.v/1.3));
      const fx=Math.sin(Bt.hd),fz=-Math.cos(Bt.hd),nx=Bt.hx+fx*Bt.v*dt,nz=Bt.hz+fz*Bt.v*dt;
      const ok=Wd.H(nx,nz)<-1.4&&Wd.H(nx+fx*2.2,nz+fz*2.2)<-1&&Wd.H(nx-fx*2.2,nz-fz*2.2)<-.8&&Math.hypot(nx,nz)<(Wd.site.maxRow||MAXROW)&&!(nz>-2.8&&Math.abs(nx)<2.7)&&!(Wd.obst&&Wd.obst.some(o=>Math.hypot(nx-o.x,nz-o.z)<o.r+1.3));
      if(ok){Bt.hx=nx;Bt.hz=nz}else{if(Math.abs(Bt.v)>.8)boatToast(Math.hypot(nx,nz)>=MAXROW-1?'That is as far as the oars go':Wd.obst&&Wd.obst.some(o=>Math.hypot(nx-o.x,nz-o.z)<o.r+1.3)?'A cypress is in the way':'Too shallow to row on');Bt.v*=-.25}}
    mv=Math.abs(Bt.v)}
  else Bt.v*=Math.exp(-3*dt);
  if(!Bt.on)Bt.hd=-(.05+Math.sin(T*.25)*.03);
  // oars
  Bt.ph+=mv*dt*2.1;const row=mv>.25?1:0;

  const s=Math.sin(Bt.ph);if(row&&s*Bt.lastS<0&&Math.cos(Bt.ph)>0){const side=Math.cos(Bt.hd),sz=Math.sin(Bt.hd);for(const sg of[-1,1]){const ox=Bt.hx+side*sg*1.6,oz=Bt.hz+sz*sg*1.6;splashAt(ox,oz,.16,false);}Snd.splash(.12)}Bt.lastS=s;
  const bob=Math.sin(T*.9)*.04;h.position.set(Bt.hx,bob,Bt.hz);h.rotation.set(Math.sin(T*.6)*.015-Bt.v*.008,-Bt.hd,Math.sin(T*.7+1)*.025+(Bt.on?-Bt.v*.003:0));

  const fx=Math.sin(Bt.hd),fz=-Math.cos(Bt.hd);
  if(Bt.on){Bt.x=Bt.hx-fx*.45;Bt.z=Bt.hz-fz*.45;Bt.y=bob-.2;An.g.position.set(Bt.x,Bt.y,Bt.z)}
  else{Bt.x=0;Bt.z=ANG_Z;Bt.y=DECK;An.g.position.set(0,DECK,ANG_Z)}

    const bx=Bt.hx+fx*2.1,bz=Bt.hz+fz*2.1;if(mv>1.2)addRipple(bx,bz,.12+mv*.04)}}
}

/* ---------- camera ---------- */
function updateCamera(dt){
  const st=G.state;let dp=V3(),dt_=V3(),k=4,fov=58;const ap=AP();
  if(st==='title'||st==='boot'||G.paused&&G.menuOrbit){
    const a=Math.sin(T*.06)*1.15+.55,r=10.5+Math.sin(T*.04)*2;dp.set(Math.sin(a)*r*.9-2,3.3+Math.sin(T*.05)*.5,ap.z+1.5+Math.cos(a)*r*.9);dt_.set(0,1.3,-3-Math.sin(T*.07)*4);k=2.2;fov=60}
  else if(st==='fight'&&G.fight){const F=G.fight;const a=G.aim+F.th*.5;const sd=V3(Math.cos(a),0,Math.sin(a));const fw=aimFwd(a);
    dp.copy(ap).addScaledVector(sd,2.5).addScaledVector(fw,-4.8).add(V3(0,2.5,0));const[hx,hz]=heroXZ(F);
    dt_.set(lerp(ap.x,hx,.6),.3,lerp(ap.z,hz,.6));k=4.5;fov=57-(F.phase==='jump'?2:0)}
  else if(st==='landing'||st==='card'){const f=aimFwd(G.aim);const sd=V3(-f.z,0,f.x);const rc=V3(f.z,0,-f.x);const t=clamp(G.landT/1.6,0,1);const orb=st==='card'?Math.sin(T*.4)*.35:0;
    const hold=ap.clone().add(V3(0,1.2,0)).addScaledVector(f,.75);
    dp.copy(hold).addScaledVector(f,lerp(4.4,2.9,t)).addScaledVector(sd,lerp(-.4,-.9,t)+orb).add(V3(0,lerp(.7,.25,t),0));
    dt_.copy(hold).addScaledVector(rc,lerp(.2,1.25,t)).add(V3(0,-.15,0));k=lerp(2.5,3.2,t);fov=lerp(52,46,t)}
  else{const a=G.aim*.85;const sd=V3(Math.cos(a),0,Math.sin(a));const fw=aimFwd(a);
    dp.copy(ap).addScaledVector(sd,Bt.on?1.9:1.35).addScaledVector(fw,Bt.on?-5.2:-3.3).add(V3(0,Bt.on?2.9:1.95,0));
    const base=ap.clone().addScaledVector(aimFwd(G.aim),9).add(V3(0,.2,0));
    if(G.lure.on&&(st==='wait'||st==='bite'||st==='casting')){const lw=lureWorld();base.lerp(lw,.5)}
    dt_.copy(base);k=3.4;fov=58}
  Cam.pos.lerp(dp,dampf(k,dt));Cam.tgt.lerp(dt_,dampf(k*1.15,dt));
  camera.fov+=(fov-camera.fov)*dampf(3,dt);camera.updateProjectionMatrix();
  camera.position.copy(Cam.pos);
  G.shake*=Math.exp(-2.4*dt);const sk=G.shake*.35;camera.position.x+=rnd(-1,1)*sk*.5;camera.position.y+=rnd(-1,1)*sk*.5;camera.position.z+=rnd(-1,1)*sk*.5;
  camera.position.y=Math.max(camera.position.y,.8);
  camera.lookAt(Cam.tgt);
}

/* ---------- main loop ---------- */
let last=performance.now(),fpsAcc=0,fpsN=0;
function simulate(dt){
  T+=dt;waterUni.uTime.value=T;skyUni.uTime.value=T;
  if(!G.paused){updateGame(dt)}
  updateBoat(dt);An.update(dt);
  Life.update(dt);UI.finder();for(const f of Wd.upd)f(dt,T);
  updateRings(dt);FXd.update(dt);FXa.update(dt);
  Snd.music(dt);
  if(!G.free)updateCamera(dt);
  skyMesh.position.copy(camera.position);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.manual)return;
  simulate(dt*G.slow);Post.render();
  if(document.visibilityState==='visible'&&!G.paused){const raw=Math.min(.25,(now-(frame.pt||now))/1000);frame.pt=now;frame.acc=(frame.acc||0)+raw;frame.n=(frame.n||0)+1;
    if(frame.acc>3){const fps=frame.n/frame.acc;frame.acc=0;frame.n=0;frame.warm=(frame.warm||0)+1;
      if(frame.warm>1&&fps<27){if(QUAL.refl!==false){QUAL.refl=false;UI.toast('Reflections turned off to keep things smooth — Menu → Settings','#ffd27a')}else if(QUAL.post!==false){QUAL.post=false;UI.toast('Effects turned off to keep things smooth — Menu → Settings','#ffd27a')}}}}
}
function travel(id){
  const fade=$('fade');fade.classList.add('on');
  setTimeout(()=>{
    if(G.fight){G.fight=null;Snd.tension(0)}killHero();Line.l.visible=false;Bob.g.visible=false;G.lure.on=false;Life.clearLure();
    SV.site=id;saveGame();buildSite(id);Life.init(Wd.site);Snd.ambience(Wd.site.amb==='sea'?'cove':id);Snd.ambience(id);
    Snd.ambience(id);UI.refreshHUD();setState('idle');G.aim=0;
    setTimeout(()=>{fade.classList.remove('on')},350)},480);
}
function boot(){
  genChallenges();saveGame();
  buildSite(SV.site);Life.init(Wd.site);
  setState('title');UI.build();UI.showTitle();
  requestAnimationFrame(frame);
  setTimeout(()=>$('fade').classList.remove('on'),400);
}
