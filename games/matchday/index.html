<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matchday</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;color:#f4f7ff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)}
  canvas#c{filter:contrast(1.07) saturate(1.14) brightness(1.02);position:fixed;inset:0;width:100%;height:100%;display:block}
  #score{position:fixed;top:18px;left:22px;display:none;align-items:stretch;height:44px;background:rgba(8,12,24,.88);border-radius:6px;overflow:hidden;font-weight:800;letter-spacing:.06em;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #score .tm{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:20px}
  #score .tm i{width:10px;height:26px;border-radius:2px;display:block}
  #score .sc{min-width:42px;display:flex;align-items:center;justify-content:center;background:#fff;color:#0a1020;font-size:26px}
  #score .clk{display:flex;align-items:center;padding:0 14px;font-size:20px;background:#16213f;font-variant-numeric:tabular-nums;min-width:96px;justify-content:center}
  #half{position:fixed;top:68px;left:22px;font-size:12px;letter-spacing:.14em;color:#9fb0d6;display:none;font-weight:700}
  #cards{position:fixed;top:86px;left:22px;font-size:12px;display:none;gap:10px;font-weight:700;color:#c8d3ef}
  #banner{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:84px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .18s,transform .18s}
  #banner.on{opacity:1;transform:scale(1)}
  #banner small{display:block;font-size:26px;letter-spacing:.2em;color:#ffd24d;margin-top:6px}
  #lower{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(8,12,24,.88);padding:9px 22px;border-left:5px solid #ffd24d;font-weight:700;letter-spacing:.06em;font-size:15px;display:none;border-radius:3px}
  #power{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:260px;height:12px;background:rgba(8,12,24,.8);border-radius:6px;overflow:hidden;display:none;border:1px solid rgba(255,255,255,.18)}
  #power b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#fde047,#ef4444)}
  #stam{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:120px;height:4px;background:rgba(8,12,24,.7);border-radius:3px;overflow:hidden;display:none}
  #stam b{display:block;height:100%;width:100%;background:#38bdf8}
  #radar{position:fixed;right:18px;bottom:18px;width:190px;height:123px;border-radius:6px;display:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #pname{position:fixed;left:18px;bottom:62px;font-size:15px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 2px 6px #000;display:none}
  #ctrl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:6px 9px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:min(96vw,740px);padding:8px 12px;background:rgba(6,10,22,.72);border:1px solid rgba(255,255,255,.1);border-radius:12px;backdrop-filter:blur(4px);pointer-events:none;transition:opacity .3s}
  #ctrl .ci{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#cdd8f5;white-space:nowrap}
  #ctrl .k{min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:linear-gradient(#f4f7ff,#c9d3ea);color:#0b1224;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 2px 0 #7f8cab}
  #ctrl .k.pad{border-radius:50%;min-width:26px;padding:0;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.5)}
  #ctrl .ci.dim{opacity:.5}
  #ctrl .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px}
  #ctrl .ttl{font-size:11px;color:#ffd24d;letter-spacing:.14em;font-weight:800}
  #ctrl.big{bottom:50%;transform:translate(-50%,50%) scale(1.25);padding:14px 18px}
  #hint{position:fixed;left:18px;bottom:14px;font-size:11px;color:#8fa0c8;letter-spacing:.06em;display:none;line-height:1.5;font-weight:600}
  #rep{position:fixed;top:20px;right:22px;background:#e11d48;padding:6px 16px;font-weight:900;letter-spacing:.2em;border-radius:4px;display:none}
  #cine{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(14,24,52,.78),rgba(3,5,12,.95))}
  #ov.clear{background:rgba(3,5,12,.55)}
  .panel{min-width:460px;max-width:92vw;text-align:center}
  .logo{font-size:92px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#4ade80,#38bdf8,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .sub{color:#9fb0d6;letter-spacing:.35em;font-size:13px;margin:10px 0 44px;font-weight:700}
  .blink{animation:bl 1.1s infinite;font-weight:800;letter-spacing:.2em;font-size:18px}
  @keyframes bl{50%{opacity:.25}}
  .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 22px;margin:7px 0;background:rgba(255,255,255,.06);border-radius:6px;font-weight:700;letter-spacing:.08em;font-size:17px;border:2px solid transparent}
  .row.sel{background:rgba(255,255,255,.16);border-color:#ffd24d}
  .row .l{color:#9fb0d6;font-size:13px}
  .row .v{display:flex;align-items:center;gap:10px}
  .row .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.4)}
  .row.go{justify-content:center;background:#16a34a;font-size:20px;letter-spacing:.2em}
  .row.go.sel{background:#22c55e}
  h2.t{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;font-weight:900}
  .big{font-size:72px;font-weight:900;margin:8px 0 18px}
  table.st{width:100%;border-collapse:collapse;margin:14px 0;font-weight:700}
  table.st td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px}
  table.st td:nth-child(2){color:#9fb0d6;font-size:12px;letter-spacing:.12em;text-align:center}
  table.st td:first-child{text-align:right}table.st td:last-child{text-align:left}
  .foot{color:#7f90b8;font-size:12px;letter-spacing:.1em;margin-top:18px}
  @media(max-width:900px){.logo{font-size:54px}#banner{font-size:44px}#radar{width:140px;height:90px}.panel{min-width:0;width:94vw}#hint{display:none!important}}

<body>

<div id="score"><div class="tm"><i id="kitA"></i><b id="abA">HOM</b></div><div class="sc" id="scA">0</div><div class="clk" id="clk">00:00</div><div class="sc" id="scB">0</div><div class="tm"><b id="abB">AWY</b><i id="kitB"></i></div></div>

<div id="ctrl"></div>
<div id="hint">MOVE WASD/ARROWS &nbsp; SPRINT SHIFT &nbsp; PASS J &nbsp; THROUGH K &nbsp; LOB L &nbsp; SHOOT SPACE (HOLD) &nbsp; SWITCH Q &nbsp; ZOOM Z<br>DEFENDING: J TACKLE &nbsp; K SLIDE &nbsp; &nbsp; PAUSE P &nbsp; &nbsp; GAMEPAD SUPPORTED</div>

<div id="cine"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const hyp=(x,z)=>Math.sqrt(x*x+z*z), angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
const HL=52.5,HW=34,GW=3.66,GH=2.44,BR=0.17,GRAV=9.8;

const TEAMS=[
 {n:'Northgate United',a:'NGU',c1:0xd32f2f,c2:0xffffff,r:82},
 {n:'Harbor City',a:'HBC',c1:0x4fc3f7,c2:0x0d2c54,r:84},
 {n:'Real Valdora',a:'RVA',c1:0xf5f5f5,c2:0x6a1b9a,r:85},
 {n:'Atletico Sol',a:'ASO',c1:0xffd600,c2:0x111111,r:79},
 {n:'Ironworks FC',a:'IRN',c1:0x212121,c2:0xff6d00,r:77},
 {n:'Lakeside Rovers',a:'LSR',c1:0x2e7d32,c2:0xffffff,r:75},
 {n:'Dynamo Kestrel',a:'DKE',c1:0x1a237e,c2:0xffc107,r:80},
 {n:'Borough Wanderers',a:'BWA',c1:0x7b1f2e,c2:0x64b5f6,r:74}
];
// formations: [fx (0 own goal..1 opp goal), fy lateral -1..1]; index 0 is the goalkeeper
const FORMS={
 '4-4-2':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.45,-.8],[.42,-.25],[.42,.25],[.45,.8],[.68,-.2],[.68,.2]],
 '4-3-3':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.4,0],[.5,-.38],[.5,.38],[.7,-.75],[.78,0],[.7,.75]],
 '4-2-3-1':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.37,-.25],[.37,.25],[.58,-.7],[.58,0],[.58,.7],[.78,0]]
};
const DIFFS=[{n:'Amateur',spd:.88,react:.7,gk:.58,acc:.62},{n:'Pro',spd:.97,react:1,gk:.74,acc:.84},{n:'World Class',spd:1.04,react:1.3,gk:.88,acc:.95}];
const CFG={home:0,away:1,form:'4-4-2',diff:1,half:3};

/* ---------- audio ---------- */
let AC=null,master,crowdGain,crowdFilter,crowdTarget=.22;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.75;master.connect(AC.destination);
  const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.03*(Math.random()*2-1))/1.03;d[i]=l*4;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  crowdFilter=AC.createBiquadFilter();crowdFilter.type='bandpass';crowdFilter.frequency.value=520;crowdFilter.Q.value=.6;
  crowdGain=AC.createGain();crowdGain.gain.value=.2;
  src.connect(crowdFilter);crowdFilter.connect(crowdGain);crowdGain.connect(master);src.start();
}
function tone(f,dur,type,vol,slide,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function burst(dur,vol,freq,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900;
  const g=AC.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const SND={
  kick(p){tone(150+p*60,.12,'sine',.28+p*.2,-90);burst(.07,.12+p*.15,1500);},
  bounce(v){tone(110,.08,'sine',Math.min(.2,v*.02),-50);},
  post(){tone(880,.35,'triangle',.3,-300);tone(1320,.25,'sine',.15,-500);burst(.05,.2,3000);},
  net(){burst(.45,.28,700);},
  whistle(long){const n=long?3:1;for(let i=0;i<n;i++){tone(2850,.42,'square',.07,40,i*.5);tone(3000,.42,'sine',.1,0,i*.5);}},
  tackle(){burst(.16,.3,500);tone(90,.12,'sine',.25,-40);},
  card(){tone(660,.12,'triangle',.15);tone(990,.18,'triangle',.15,0,.1);},
  cheer(a){S.excite=Math.min(.8,a);},
  save(){burst(.12,.22,900);tone(200,.1,'sine',.2,-60);},
  menu(){tone(520,.06,'square',.06);},
  ok(){tone(780,.1,'square',.07);tone(1040,.14,'square',.07,0,.07);}
};

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  keys[e.code]=true;initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('pointerdown',()=>initAudio());
const KB={up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],
  pass:['KeyJ'],through:['KeyK'],lob:['KeyL'],shoot:['Space','KeyI'],sprint:['ShiftLeft','ShiftRight'],
  sw:['KeyQ','KeyE'],mod:['KeyC'],knock:['KeyV'],ok:['Enter'],back:['Escape','Backspace'],pause:['KeyP'],zoom:['KeyZ'],help:['KeyH']};
let prevHeld={},rsHeld=false;
function pollInput(){
  const h={};for(const k in KB)h[k]=KB[k].some(c=>keys[c]);
  let mx=(h.right?1:0)-(h.left?1:0),mz=(h.down?1:0)-(h.up?1:0);
  let gp=null;
  try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const g of pads){if(g&&g.connected){gp=g;break;}}}catch(e){}
  if(gp){
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0,b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    if(Math.hypot(ax,ay)>.2){mx+=ax;mz+=ay;}
    if(b(12))mz-=1;if(b(13))mz+=1;if(b(14))mx-=1;if(b(15))mx+=1;
    h.mod=h.mod||b(6)||(gp.buttons[6]&&gp.buttons[6].value>.35);h.knock=h.knock||b(5);h.pass=h.pass||b(0);h.lob=h.lob||b(1);h.shoot=h.shoot||b(2);h.through=h.through||b(3);
    h.sw=h.sw||b(4);h.sprint=h.sprint||b(7);h.ok=h.ok||b(0)||b(9);h.back=h.back||b(1);h.pause=h.pause||b(9);h.zoom=h.zoom||b(11);
    h.up=h.up||b(12)||ay<-.55;h.down=h.down||b(13)||ay>.55;h.left=h.left||b(14)||ax<-.55;h.right=h.right||b(15)||ax>.55;
  }
  let fl=null;
  if(gp){const rx=gp.axes[2]||0,ry=gp.axes[3]||0,rm=Math.hypot(rx,ry);
    if(rm>.82&&!rsHeld){fl={x:rx/rm,z:ry/rm};}rsHeld=rm>.5;}
  const m=Math.hypot(mx,mz);if(m>1){mx/=m;mz/=m;}
  const IN={mx,mz,h,e:{},r:{},fl};
  for(const k in h){IN.e[k]=h[k]&&!prevHeld[k];IN.r[k]=!h[k]&&!!prevHeld[k];}
  prevHeld=h;return IN;
}
let SHK=0,FP=0,SUN=null;

/* ---------- scene ---------- */
let renderer,scene,camera,ballMesh,activeRing,activeArrow,targetRing;
const cam={x:0,y:23,z:38,lx:0,lz:0,mode:'broadcast',zoom:1};
function initScene(){
  renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c1426);
  scene.fog=new THREE.Fog(0x0c1426,110,230);
  camera=new THREE.PerspectiveCamera(38,1,.5,400);
  scene.add(new THREE.HemisphereLight(0xcfdcff,0x1d3a1d,.95));
  const sun=new THREE.DirectionalLight(0xfff1dc,.9);sun.position.set(-30,60,40);scene.add(sun);scene.add(sun.target);SUN=sun;
  sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc_=sun.shadow.camera;sc_.left=-40;sc_.right=40;sc_.top=32;sc_.bottom=-32;sc_.near=20;sc_.far=150;sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;
  const rim=new THREE.DirectionalLight(0x7fa0ff,.32);rim.position.set(35,30,-45);scene.add(rim);
  buildSky();initParticles();
  buildPitch();buildStadium();buildGoals();
  const bt=document.createElement('canvas');bt.width=128;bt.height=64;const g=bt.getContext('2d');
  g.fillStyle='#f5f5f5';g.fillRect(0,0,128,64);g.fillStyle='#16181d';
  for(let i=0;i<14;i++){g.beginPath();const x=(i%7)*19+8,y=i<7?18:46;for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;g.lineTo(x+Math.cos(a)*8,y+Math.sin(a)*8);}g.fill();}
  const btex=new THREE.CanvasTexture(bt);
  ballMesh=new THREE.Mesh(new THREE.SphereGeometry(BR,20,14),new THREE.MeshStandardMaterial({map:btex,roughness:.45,emissive:0x222222}));
  ballMesh.castShadow=true;scene.add(ballMesh);
  const bsh=new THREE.Mesh(new THREE.CircleGeometry(BR*1.3,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.45}));
  bsh.rotation.order='YXZ';bsh.rotation.x=-Math.PI/2;bsh.rotation.y=.927;bsh.position.y=.04;scene.add(bsh);ballMesh.userData.shadow=bsh;
  activeRing=new THREE.Mesh(new THREE.RingGeometry(.85,1.05,28),new THREE.MeshBasicMaterial({color:0xffd24d,side:THREE.DoubleSide,transparent:true,opacity:.95}));
  activeRing.rotation.x=-Math.PI/2;activeRing.position.y=.06;scene.add(activeRing);
  activeArrow=new THREE.Mesh(new THREE.ConeGeometry(.38,.8,4),new THREE.MeshBasicMaterial({color:0xffd24d}));
  activeArrow.rotation.x=Math.PI;scene.add(activeArrow);
  targetRing=new THREE.Mesh(new THREE.RingGeometry(.7,.88,24),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:.85}));
  targetRing.rotation.x=-Math.PI/2;targetRing.position.y=.07;targetRing.visible=false;scene.add(targetRing);
  initTraj();
  onResize();addEventListener('resize',onResize);
}
function placeBallShadow(x,y,z){const sh=ballMesh.userData.shadow,k=clamp(1.2-y*.08,.4,1.2);sh.position.set(x+.6*y*.9,.04,z-.8*y*.9);sh.scale.set(k*(1+Math.min(1.2,y*.3)),k,1);}
function onResize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function buildPitch(){
  const PX=16,W=125,H=86,cv=document.createElement('canvas');cv.width=W*PX;cv.height=H*PX;const g=cv.getContext('2d');
  const X=x=>(x+W/2)*PX,Y=z=>(z+H/2)*PX;
  let sd=7;const rr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  const SW=W*PX/14;
  for(let i=0;i<14;i++){
    g.fillStyle=i%2?'#2c7630':'#38893b';g.fillRect(i*SW,0,SW+1,H*PX);
    const gr=g.createLinearGradient(i*SW,0,(i+1)*SW,0);gr.addColorStop(0,'rgba(255,255,255,.035)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.05)');
    g.fillStyle=gr;g.fillRect(i*SW,0,SW+1,H*PX);
  }
  // large soft patches
  for(let i=0;i<90;i++){const x=rr()*W*PX,y=rr()*H*PX,r=60+rr()*260,l=rr()<.5;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,l?'rgba(150,210,100,.07)':'rgba(5,40,10,.09)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  // wear: goalmouths, spots, centre
  const wear=(x,z,rx,rz,a)=>{const cx=X(x),cy=Y(z),gr=g.createRadialGradient(cx,cy,0,cx,cy,rx*PX);gr.addColorStop(0,'rgba(96,78,44,'+a+')');gr.addColorStop(1,'rgba(96,78,44,0)');
    g.save();g.translate(cx,cy);g.scale(1,rz/rx);g.translate(-cx,-cy);g.fillStyle=gr;g.fillRect(cx-rx*PX,cy-rx*PX,rx*2*PX,rx*2*PX);g.restore();};
  for(const s2 of[-1,1]){wear(s2*(HL-3),0,7,12,.3);wear(s2*(HL-11),0,2.2,2.2,.33);}

/* ---------- human control ---------- */
function humanControl(p,dt){

function execSet(p,t,kind,charge,aim){

  }

function switchPlayer(){

  if(bq)S.active=bq;S.swCD=.6;
}
function autoSwitch(dt){
  if(S.mode!=='play')return;

  S.swCD-=dt;if(S.swCD>0)return;

  for(const q of TM[0].players){if(q.out||q.gk)continue;const d=hyp(q.x-ball.x-ball.vx*.4,q.z-ball.z-ball.vz*.4);if(d<bd){bd=d;bq=q;}}

/* ---------- skill moves, first touch, headers & volleys ---------- */
const SKD={step:.62,roll:.46,drag:.62,roul:.78,rain:.9,knock:.5};
const rightOf=f=>({x:-Math.sin(f),z:Math.cos(f)});
const ez=x=>x*x*(3-2*x);
function evade(p){ // tackle-resistance while performing a skill / shielding the ball
  if(p.sk&&p.sk.type!=='knock'&&p.sk.type!=='rain'&&p.sk.t<p.sk.dur*.85)return .28;
  if(p.sk&&p.sk.type==='rain')return .5;
  if(p.cc)return .6;

}
function startSkill(p,type,ix,iz){
  if(p.sk||p.gk||p.st!=='idle'||p.skCD>0||S.mode!=='play'||ball.owner!==p)return false;
  const F={x:Math.cos(p.face),z:Math.sin(p.face)},R=rightOf(p.face),mag=hyp(ix||0,iz||0),sp=hyp(p.vx,p.vz);
  let ux=0,uz=0;if(mag>.3){ux=ix/mag;uz=iz/mag;}
  const op=nearestOpp(p.x,p.z,p.team);
  let side;

  else if(op.p)side=-(Math.sign((op.p.x-p.x)*R.x+(op.p.z-p.z)*R.z)||1);

  else if(type==='roll'){const e=norm(F.x*.3+R.x*side,F.z*.3+R.z*side);k.ex=e[0];k.ez=e[1];}
  else if(type==='drag'){k.turn=mag>.3&&ux*F.x+uz*F.z<.2?Math.atan2(uz,ux):p.face+Math.PI+side*.4;}

function skillStep(p,c,dt){

  const F={x:Math.cos(k.f0),z:Math.sin(k.f0)};
  c.sprint=true;c.look=undefined;

    case'drag':

        ball.owner=null;ball.vx=k.ex*vh;ball.vz=k.ez*vh;ball.vy=6.6;ball.y=Math.max(ball.y,BR+.05);ball.last=p;ball.lastTeam=p.team;ball.spin=0;
        p.noTouch=.6;k.fired=true;SND.kick(.3);

/* where the ball sits relative to the carrier during a skill move */
function skBall(k){
  const s=k.t/k.dur;
  switch(k.type){
    case'step':return{dist:.55,lat:k.side*.28*ez(clamp((s-.4)/.3,0,1))};

/* ---------- first touch ---------- */
function startTrap(p){
  const b=ball,R=rightOf(p.face);
  const y=b.y,kind=y>1.0?'chest':y>.42?'thigh':'foot';
  p.trap={t:0,dur:kind==='chest'?.66:kind==='thigh'?.58:.5,k:kind,y0:Math.max(y,BR),lat:(b.x-p.x)*R.x+(b.z-p.z)*R.z};

/* ---------- aerial play: headers & volleys ---------- */
function aerPath(){

function aerPlan(p,pts,zone,slackMax){

function aerReady(p){return!p.out&&!p.gk&&!p.aer&&!p.sk&&p.st==='idle'&&p.aerCD<=0&&p.noTouch<=0;}

function aerIntent(p,type){

function aerStrike(p,a){

  if(!ok)return;
  const T=TM[p.team],d=T.dir,gx=d*HL,acc=accOf(p),IN=S.IN,human=p===S.active&&humanOn()&&!globalThis.__AI;
  const nopp=nearestOpp(p.x,p.z,p.team).d;
  let intent=a.intent;
  if(human){ // let a late press decide
    if(S.shootBuf>0||IN.h.shoot)intent='shoot';else if(S.passBuf>0||IN.h.pass)intent='pass';
  }
  if(intent==='pass'){
    const q=human?pickTarget(p,IN.mx,IN.mz,'short'):aiPassChoice(p,true).q;
    if(q){
      const pd=passDest(p,q,'short'),dd=hyp(pd.tx-p.x,pd.tz-p.z);
      aimedKick(p,pd.tx,pd.tz,BR+.35,clamp(9+dd*.8,12,24),(1-acc)*.2+.04+(nopp<2.5?.03:0));

    }

    const gk=TM[1-p.team].players[0];
    let tz;
    if(human&&Math.abs(IN.mz)>.3)tz=clamp(IN.mz,-1,1)*(GW-.7);
    else tz=(gk&&!gk.out?-Math.sign(gk.z||(Math.random()-.5)):(Math.random()<.5?-1:1))*rnd(1.6,3);
    const dd=hyp(gx-p.x,tz-p.z),vol=!head;

}

/* ---------- team prep (per frame) ---------- */
function teamPrep(){
  for(const T of TM){
    const d=T.dir;let a=null,b=null,da=1e9,db=1e9;
    const tx=ball.owner?ball.owner.x:ball.x+ball.vx*.35,tz=ball.owner?ball.owner.z:ball.z+ball.vz*.35;
    for(const p of T.players){
      if(p.out||p.gk||p.st==='down'||(T.idx===0&&p===S.active&&humanOn()))continue;
      const dd=hyp(p.x-tx,p.z-tz);if(dd<da){b=a;db=da;a=p;da=dd;}else if(dd<db){b=p;db=dd;}
    }
    T.chaser=a;T.second=b;T.cd=da;
    const xs=TM[1-T.idx].players.filter(q=>!q.out).map(q=>q.x*d).sort((m,n)=>n-m);
    T.line=xs[1]!==undefined?xs[1]:0;
    // marking assignments
    T.marks=new Map();
    const defs=T.players.filter(p=>!p.out&&!p.gk&&p!==T.chaser&&p!==T.second&&p.fx<.65);
    const taken=new Set();
    const att=TM[1-T.idx].players.filter(q=>!q.out&&!q.gk&&q!==ball.owner).sort((m,n)=>(n.x*-d)-(m.x*-d));
    for(const o of att){
      let bq=null,bd=15;for(const p of defs){if(taken.has(p))continue;const dd=hyp(p.x-o.x,p.z-o.z);if(dd<bd){bd=dd;bq=p;}}
      if(bq){taken.add(bq);T.marks.set(bq,o);}
    }
  }
}
function aiControl(p,dt){
  const c={dx:0,dz:0,mag:0,sprint:false};
  const go=(tx,tz,sp,spr)=>{const dx=tx-p.x,dz=tz-p.z,dd=hyp(dx,dz);if(dd>.4){c.dx=dx/dd;c.dz=dz/dd;c.mag=Math.min(1,dd/2.2)*sp;}c.sprint=!!spr;};
  const T=TM[p.team],d=T.dir,m=S.mode;
  if(m==='goal'){
    if(p.team===S.scoringTeam&&S.scorer&&!p.gk&&p!==S.scorer&&hyp(S.scorer.x-p.x,S.scorer.z-p.z)>3.5)go(S.scorer.x,S.scorer.z,1,true);
    else if(!p.gk){const b=basePos(p,false);go(b.x,b.z,.3,false);}
    return c;
  }
  if(m==='kickoff'||m==='setpiece'||m==='penalty')return aiSetPiece(p,c,go,dt);
  if(p.gk)return aiKeeper(p,c,go,dt);
  const react=p.team?DIFFS[CFG.diff].react:1,sk=T.sk;
  if(ball.owner===p)return aiOnBall(p,c,dt,go);
  if(p.rT>0&&!ball.owner&&ball.lastTeam===p.team){go(p.rx,p.rz,1,hyp(p.rx-p.x,p.rz-p.z)>5);return c;}
  const oppHas=poss()===1-p.team,teamHas=poss()===p.team,loose=!ball.owner;
  if(p===T.chaser&&!teamHas){
    const ox=ball.owner?ball.owner.x:ball.x+ball.vx*.3,oz=ball.owner?ball.owner.z:ball.z+ball.vz*.3,dd=hyp(ox-p.x,oz-p.z);
    if(oppHas){ // approach goal-side, tackle when close
      const gxs=ox-d*.9,gzs=oz*.97;go(dd>5?ox:gxs,dd>5?oz:gzs,1,dd>5);
      if(dd<1.85&&p.tackleCD<=0&&Math.random()<(.9+sk)*react*dt*1.1)doTackle(p,false);
      else if(dd>2.4&&dd<3.6&&hyp(p.vx,p.vz)>6&&p.tackleCD<=0&&Math.random()<.35*react*dt)doTackle(p,true);
    }else go(ox,oz,1,dd>3);
    return c;
  }
  if(p===T.second&&oppHas&&T.cd<16&&p.fx>.2){const o=ball.owner;go(o.x-d*3,o.z+(p.z>o.z?2.5:-2.5),.95,hyp(o.x-p.x,o.z-p.z)>8);return c;}
  const b=basePos(p,false);let tx=b.x,tz=b.z;
  if(p.wall){go(p.wall.x,p.wall.z,1,true);return c;}
  if(teamHas){
    const ph=Math.sin(S.t*.4+p.run);
    if(p.fx>.5){tx+=d*clamp(3+6*ph,0,8);tz+=Math.sin(S.t*.3+p.run*2)*3;}
    else if(p.fx>.3){tx+=d*clamp(2+3*ph,0,5);}

    if(loose&&p.fx>.2&&T.cd>12){tx=b.x;tz=b.z;}
  }
  go(tx,tz,.85+.15*react,hyp(tx-p.x,tz-p.z)>12);

}
function laneBlocked(p,q){
  const dx=q.x-p.x,dz=q.z-p.z,L=hyp(dx,dz)||1;
  for(const o of TM[1-p.team].players){if(o.out)continue;const t=((o.x-p.x)*dx+(o.z-p.z)*dz)/(L*L);if(t<.1||t>.95)continue;
    const px=p.x+dx*t,pz=p.z+dz*t;if(hyp(o.x-px,o.z-pz)<1.7)return true;}

function aiPassChoice(p,pressed){
  const T=TM[p.team],d=T.dir;let best=null,bs=-1e9;

    const op=nearestOpp(q.x,q.z,p.team).d;
    let s=(q.x-p.x)*d*.13+Math.min(op,10)*.32-Math.abs(dist-15)*.045+(q.gk?(pressed&&p.x*d<-HL*.45?1.2:-4):0);

function aiOnBall(p,c,dt,go){

  const al=hyp(ax,az)||1;c.dx=ax/al;c.dz=az/al;c.mag=1;c.sprint=op.d>4||p.x*d>HL-30;

  if(dg<26&&Math.abs(p.z)<24&&p.x*d>HL-28){
    const pr=(dg<12?.7:dg<18?.45:.2)*(.65+.6*sk)*(pressed?1.15:1);
    if(Math.random()<pr){
      const side=gk&&!gk.out?-Math.sign(gk.z||(Math.random()-.5)):(Math.random()<.5?-1:1);

    let tq=null,bs=-1;for(const q of T.players){if(q===p||q.out||q.gk)continue;if(q.x*d>HL-18&&Math.abs(q.z)<14){const s=10-nearestOpp(q.x,q.z,p.team).d*.0+(q.fx>.6?2:0)+Math.random()*3;if(s>bs){bs=s;tq=q;}}}

    const F={x:Math.cos(p.face),z:Math.sin(p.face)};
    if(op.p&&op.d<3.3&&op.d>.9&&Math.random()<.14*(.4+.9*sk)){

}
/* ---------- goalkeeper ---------- */
function keeperPredict(gk){
  const d=TM[gk.team].dir,gx=-d*HL,b=ball;
  if(b.owner||b.vx*(-d)<4||b.lastTeam===gk.team)return null;
  const tG=(gx-b.x)/b.vx;if(tG<=0||tG>1.5)return null;
  return{tG,zp:b.z+b.vz*tG,yp:Math.max(.2,b.y+b.vy*tG-.5*GRAV*tG*tG),sp:hyp(b.vx,b.vz)};
}
function aiKeeper(p,c,go,dt){
  const T=TM[p.team],d=T.dir,gx=-d*HL;
  if(ball.owner===p){ // holding after a back-pass
    p.hold-=dt;c.mag=0;if(p.hold<=0){const op=nearestOpp(p.x,p.z,p.team).d,tq=pickTarget(p,d,0,op<8?'lob':'short');if(tq)passBall(p,tq,op<8?'lob':'short');else kickBall(p,d,0,20,7,0,null);}
    return c;
  }
  const pr=keeperPredict(p);
  if(pr&&Math.abs(pr.zp)<GW+3&&pr.yp<GH+1.3){
    if(p.errShot!==ball.shot){p.errShot=ball.shot;p.err=(Math.random()-.5)*2*(1-(p.team?DIFFS[CFG.diff].gk:.62))*2.4;}
    let tz=clamp(pr.zp+p.err,-GW-.6,GW+.6);if(S.lastSet==='penalty')tz=S.guess*2.5;
    p.x+=(gx+d*1.2-p.x)*Math.min(1,dt*6);
    if(Math.abs(tz-p.z)>.6){c.dx=0;c.dz=Math.sign(tz-p.z);c.mag=1;c.sprint=true;
      if(pr.tG<.6&&Math.abs(tz-p.z)>1.1&&p.diveT<=0&&p.saved!==ball.shot){p.diveT=.55;p.diveDir=Math.sign(tz-p.z);}}
    return c;
  }
  // loose ball inside own box / just outside: claim it if nearest
  const bd=hyp(ball.x-p.x,ball.z-p.z),inBox=insideBox(p.team,ball.x,ball.z);
  if(!ball.owner&&inBox&&hyp(ball.vx,ball.vz)<9&&bd<14&&T.cd>bd-1){go(ball.x,ball.z,1,true);return c;}
  const bg=hyp(ball.x-gx,ball.z),adv=poss()===p.team&&Math.abs(ball.x-gx)>45?clamp((bg-34)*.15,0,5):0;
  const ang=Math.atan2(ball.z,Math.abs(ball.x-gx)+2);
  go(gx+d*(1.4+adv+clamp(8/(bg+1)*3,0,1.4)),clamp(Math.tan(ang)*3.2,-GW+.5,GW-.5),.9,false);
  c.look=Math.atan2(ball.z-p.z,ball.x-p.x);
  return c;
}
function keeperLogic(){
  if(S.mode!=='play')return;
  for(const T of TM){
    const gk=T.players[0];if(gk.out)continue;
    const pr=keeperPredict(gk);if(!pr||gk.saved===ball.shot||pr.tG>.075)continue;
    gk.saved=ball.shot;
    const onTarget=Math.abs(pr.zp)<GW-.05&&pr.yp<GH-.05;if(!onTarget)continue;
    const d=T.dir,skill=T.idx?DIFFS[CFG.diff].gk*(.9+.2*T.sk):.74+.14*T.sk;
    const dz=Math.abs(gk.z-pr.zp),reach=gk.diveT>0?3.1:1.5;
    let ch=skill*(1-clamp((pr.sp-16)/60,0,.5));
    ch*=dz<reach?1-dz/reach*.5:0;
    if(pr.yp>1.9)ch*=.65;if(Math.abs(pr.zp)>GW-.8)ch*=.75;
    if(Math.random()<ch){
      const gx=-d*HL;ball.last=gk;ball.lastTeam=gk.team;ball.hit=2;SND.save();
      ball.x=gx+d*.9;ball.z=clamp(pr.zp,-GW,GW);ball.y=Math.max(ball.y,.4);
      if(pr.sp<17&&pr.yp<1.7&&Math.random()<.6){ball.vx=ball.vz=ball.vy=0;takeOwner(gk);lower('SAVED!',1.5);}
      else{ball.vx=d*rnd(3,8);ball.vz=(Math.random()<.5?-1:1)*rnd(3,8);ball.vy=rnd(2,5);lower('GREAT SAVE',1.6);}
    }
  }
}
/* ---------- set-piece AI ---------- */
function aiSetPiece(p,c,go,dt){
  const sp=S.sp,T=TM[p.team],d=T.dir;
  if(!sp)return c;
  if(p===sp.taker){
    c.mag=0;sp.wait-=dt;
    if(sp.wait<=0)aiExecSet(p,sp);
    return c;
  }
  if(sp.type==='penalty'){if(p.gk&&p.team!==sp.team){go(d*-HL+d*.6,0,.5,false);c.mag=0;}return c;}
  if(sp.type==='kickoff'){c.mag=0;return c;}
  if(p.gk){if(sp.type==='corner'&&p.team!==sp.team)go(-d*HL+d*1.3,sp.z>0?1.5:-1.5,.8,false);else{const b=basePos(p,false);go(b.x,b.z,.6,false);}return c;}
  const atk=p.team===sp.team;
  if(sp.type==='corner'){
    const k=T.players.filter(q=>!q.out&&!q.gk&&q!==sp.taker).indexOf(p);
    const zs=[-6,0,6,-3,3,9,-9,0,5,-5];
    if(atk){if(k<6)go(Math.sign(sp.x)*(HL-6-(k%3)*2.6),zs[k],1,true);else{const b=basePos(p,false);go(b.x,b.z,.8,false);}}
    else{go((sp.x>0?1:-1)*(HL-4-(k%3)*2.6),zs[(k+3)%zs.length]*.9,1,true);}
    return c;
  }
  if(sp.type==='free'){
    if(p.wall){go(p.wall.x,p.wall.z,1,true);return c;}
    const near=hyp(sp.x-TM[sp.team].dir*HL,sp.z)<32;
    if(atk&&near&&p.fx>.55){const k=p.idx;go(d*(HL-14-(k%3)*3),((k%4)-1.5)*6,.9,false);return c;}
  }
  const b=basePos(p,false);go(b.x,b.z,.85,hyp(b.x-p.x,b.z-p.z)>10);
  if(sp.type==='throw'&&atk){const dd=hyp(sp.x-p.x,sp.z-p.z);if(dd<14&&p.fx>.2){const a=(p.idx*1.7)%3.1-1.5;go(sp.x+Math.cos(a)*9*(sp.z>0?1:1),sp.z+(sp.z>0?-1:1)*Math.abs(Math.sin(a))*10-(sp.z>0?4:-4),.9,true);}}
  return c;
}
function aiExecSet(p,sp){
  const T=TM[p.team],d=T.dir,type=sp.type;
  if(type==='kickoff'){const q=T.players.filter(o=>!o.out&&!o.gk&&o!==p).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z))[0];passBall(p,q,'short');return;}
  if(type==='penalty'){shootBall(p,rnd(.72,.92),(Math.random()<.5?-1:1)*rnd(1.6,3.1),false);return;}
  if(type==='corner'){
    let tq=null,bs=-1;for(const q of T.players){if(q===p||q.out||q.gk)continue;if(Math.abs(q.x)>HL-20&&Math.abs(q.z)<12){const s=Math.random()*4+(q.fx>.6?2:0);if(s>bs){bs=s;tq=q;}}}
    if(tq)passBall(p,tq,'lob');else kickBall(p,d*(HL-10)-p.x,rnd(-4,4)-p.z,19,7,0,null);return;
  }
  if(type==='free'){
    if(hyp(d*HL-p.x,p.z)<30&&Math.random()<.7){shootBall(p,rnd(.7,.95),rnd(-2.8,2.8),true);return;}
    const ch=aiPassChoice(p,false);if(ch.q){passBall(p,ch.q,hyp(ch.q.x-p.x,ch.q.z-p.z)>26?'lob':'short');return;}
  }
  if(type==='goalkick'||type==='gkhold'){
    const tq=pickTarget(p,d,0,'lob')||pickTarget(p,d,0,'short');if(tq){passBall(p,tq,type==='goalkick'||Math.random()<.5?'lob':'short');return;}
  }
  if(type==='throw'){
    const c=T.players.filter(o=>!o.out&&!o.gk&&o!==p&&Math.abs(o.z)<HW-3&&hyp(o.x-p.x,o.z-p.z)<26).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z)).slice(0,3);
    const q=c.length?c[(Math.random()*c.length)|0]:null;
    if(q){passBall(p,q,'short');return;}

  }
  const ch=aiPassChoice(p,false);
  if(ch.q)passBall(p,ch.q,'short');else kickBall(p,d,0,16,3,0,null);
}
/* ---------- mode logic ---------- */
function endHalf(){
  S.endPending=false;SND.whistle(true);ball.owner=null;ball.vx=ball.vz=ball.vy=0;
  if(S.half===1){S.mode='ht';S.mt=0;showHalftime();}else{S.mode='ft';S.mt=0;showFulltime();}
}
function updateModeLogic(dt){
  S.mt+=dt;const m=S.mode;
  if(m==='play'||m==='setpiece'){
    const len=CFG.half*60;if(S.halfT<len+30)S.halfT+=dt;
    if(S.halfT>=len)S.endPending=true;
    if(S.endPending&&m==='play'&&S.halfT>len+8)endHalf();
  }
  if(m==='foul'&&S.mt>1.8)resolvePending();
  if(m==='goal'){
    S.goalT+=dt;
    if(S.goalT>3.9){S.rp=S.rpFrames;if(S.rp&&S.rp.length>30){startReplay();}else afterGoal();}
  }
}
function afterGoal(){
  S.scorer=null;for(const p of P)if(p.st==='cele')p.st='idle';
  $('rep').style.display='none';
  setupKickoff(1-S.scoringTeam);
}

/* ---------- menus ---------- */
const menu={screen:'title',cur:0,v:{home:0,away:1,form:0,diff:1,half:1}};
const HALF_OPTS=[2,3,4,5],FORM_KEYS=Object.keys(FORMS);
function setOv(html,clear){const o=$('ov');o.innerHTML=html;o.style.display=html?'flex':'none';o.classList.toggle('clear',!!clear);}
function hex(c){return '#'+('000000'+c.toString(16)).slice(-6);}
function setupRows(){
  const v=menu.v;
  return[
    {k:'home',l:'YOUR CLUB',t:TEAMS[v.home].n,sw:TEAMS[v.home].c1},
    {k:'away',l:'OPPONENT',t:TEAMS[v.away].n,sw:TEAMS[v.away].c1},
    {k:'form',l:'FORMATION',t:FORM_KEYS[v.form]},
    {k:'diff',l:'DIFFICULTY',t:DIFFS[v.diff].n},
    {k:'half',l:'HALF LENGTH',t:HALF_OPTS[v.half]+' MIN'},
    {k:'go',l:'KICK OFF'}
  ];
}
function rowHtml(r,i){
  if(r.k==='go')return '<div class="row go'+(menu.cur===i?' sel':'')+'">'+r.l+'</div>';
  return '<div class="row'+(menu.cur===i?' sel':'')+'"><span class="l">'+r.l+'</span><span class="v">'+(r.sw!==undefined?'<span class="sw" style="background:'+hex(r.sw)+'"></span>':'')+'◀ '+r.t+' ▶</span></div>';
}
function statsHtml(){
  const a=S.st[0],b=S.st[1],tot=Math.max(1,a.poss+b.poss),pa=Math.round(a.poss/tot*100);
  const rows=[['SHOTS',a.shots,b.shots],['ON TARGET',a.sot,b.sot],['POSSESSION',pa+'%',(100-pa)+'%'],['PASSES',a.pass,b.pass],['FOULS',a.fouls,b.fouls],['YELLOW CARDS',a.yc,b.yc],['RED CARDS',a.rc,b.rc],['CORNERS',a.corners,b.corners],['OFFSIDES',a.offs,b.offs]];
  return '<table class="st">'+rows.map(r=>'<tr><td>'+r[1]+'</td><td>'+r[0]+'</td><td>'+r[2]+'</td></tr>').join('')+'</table>';
}
function renderMenu(){
  const sc=menu.screen;
  if(sc==='none'){setOv('');return;}
  if(sc==='title')setOv('<div class="panel"><div class="logo">Matchday</div><div class="sub">11 v 11 &nbsp;•&nbsp; BROADCAST EDITION</div><div class="blink">PRESS ENTER OR (A) TO START</div><div class="foot">MOVE WASD / ARROWS &nbsp;•&nbsp; PASS J &nbsp;•&nbsp; THROUGH K &nbsp;•&nbsp; LOB L &nbsp;•&nbsp; SHOOT SPACE &nbsp;•&nbsp; SPRINT SHIFT &nbsp;•&nbsp; SWITCH Q<br>KEYBOARD OR GAMEPAD</div></div>');
  else if(sc==='setup')setOv('<div class="panel"><h2 class="t">Match Setup</h2><div class="foot" style="margin:0 0 14px">▲▼ SELECT &nbsp;•&nbsp; ◀▶ CHANGE &nbsp;•&nbsp; ENTER CONFIRM</div>'+setupRows().map(rowHtml).join('')+'</div>');
  else if(sc==='pause'){const r=['RESUME','RESTART MATCH','QUIT TO MENU'];setOv('<div class="panel"><h2 class="t">Paused</h2>'+r.map((t,i)=>'<div class="row go'+(menu.cur===i?' sel':'')+'" style="background:'+(menu.cur===i?'#2563eb':'rgba(255,255,255,.08)')+'">'+t+'</div>').join('')+'</div>',true);}
  else if(sc==='ht')setOv('<div class="panel"><h2 class="t">Half Time</h2><div class="big">'+S.score[0]+' - '+S.score[1]+'</div><div class="foot" style="margin:0">'+TM[0].def.n.toUpperCase()+' &nbsp;v&nbsp; '+TM[1].def.n.toUpperCase()+'</div>'+statsHtml()+'<div class="blink">PRESS ENTER FOR THE SECOND HALF</div></div>');
  else if(sc==='ft'){
    const w=S.score[0]>S.score[1]?'VICTORY':S.score[0]<S.score[1]?'DEFEAT':'DRAW',r=['REMATCH','MAIN MENU'];
    setOv('<div class="panel"><h2 class="t">Full Time — '+w+'</h2><div class="big">'+S.score[0]+' - '+S.score[1]+'</div><div class="foot" style="margin:0">'+TM[0].def.n.toUpperCase()+' &nbsp;v&nbsp; '+TM[1].def.n.toUpperCase()+'</div>'+statsHtml()+r.map((t,i)=>'<div class="row go'+(menu.cur===i?' sel':'')+'" style="background:'+(menu.cur===i?'#16a34a':'rgba(255,255,255,.08)')+'">'+t+'</div>').join('')+'</div>');
  }
}
function gotoMenu(s){menu.screen=s;menu.cur=0;renderMenu();}
function menuInput(IN){
  const sc=menu.screen,e=IN.e;
  if(sc==='title'){if(e.ok){SND.ok();gotoMenu('setup');}return;}
  if(sc==='setup'){
    const rows=setupRows();
    if(e.up){menu.cur=(menu.cur+rows.length-1)%rows.length;SND.menu();renderMenu();}
    if(e.down){menu.cur=(menu.cur+1)%rows.length;SND.menu();renderMenu();}
    const dir=(e.right?1:0)-(e.left?1:0),r=rows[menu.cur];
    if(dir&&r.k!=='go'){
      const v=menu.v,n={home:TEAMS.length,away:TEAMS.length,form:FORM_KEYS.length,diff:DIFFS.length,half:HALF_OPTS.length}[r.k];
      v[r.k]=(v[r.k]+dir+n)%n;
      if(v.home===v.away){v[r.k==='home'?'away':'home']=(v.away+1)%TEAMS.length;}
      SND.menu();renderMenu();
    }
    if(e.ok&&r.k==='go'){SND.ok();startMatch();}
    else if(e.ok){SND.menu();menu.cur=Math.min(menu.cur+1,rows.length-1);renderMenu();}
    if(e.back)gotoMenu('title');
    return;
  }
  if(sc==='pause'){
    if(e.up){menu.cur=(menu.cur+2)%3;renderMenu();}if(e.down){menu.cur=(menu.cur+1)%3;renderMenu();}
    if(e.pause||e.back){togglePause();return;}
    if(e.ok){SND.ok();if(menu.cur===0)togglePause();else if(menu.cur===1){S.paused=false;startMatch();}else{S.paused=false;toMenu();}}
    return;
  }
  if(sc==='ht'){if(e.ok){SND.ok();startSecondHalf();}return;}
  if(sc==='ft'){
    if(e.up||e.down){menu.cur=1-menu.cur;renderMenu();}
    if(e.ok){SND.ok();if(menu.cur===0)startMatch();else toMenu();}
  }
}
function toMenu(){
  S.mode='menu';S.paused=false;showHud(false);S.score=[0,0];S.half=1;S.halfT=0;S.endPending=false;
  buildTeams();S.kickTeam=0;S.st=newStats();setupKickoff(0);S.mode='menu';gotoMenu('setup');
}
function showHud(on){for(const id of['score','half','radar','hint'])$(id).style.display=on?(id==='score'?'flex':'block'):'none';if(!on){$('power').style.display='none';$('stam').style.display='none';$('lower').style.display='none';$('banner').classList.remove('on');$('rep').style.display='none';}}
function togglePause(){
  if(!S.paused){if(['menu','ht','ft','replay'].includes(S.mode))return;S.paused=true;menu.screen='pause';menu.cur=0;renderMenu();}
  else{S.paused=false;menu.screen='none';renderMenu();}
}
/* ---------- match flow ---------- */
function startMatch(){
  CFG.home=menu.v.home;CFG.away=menu.v.away;CFG.form=FORM_KEYS[menu.v.form];CFG.diff=menu.v.diff;CFG.half=HALF_OPTS[menu.v.half];
  S.paused=false;buildTeams();S.score=[0,0];S.half=1;S.halfT=0;S.endPending=false;S.st=newStats();S.rec=[];S.rpFrames=null;S.scorer=null;S.pending=null;S.lastSet=null;
  ball.off=null;ball.shot=0;ball.last=null;ball.lastTeam=0;
  $('scA').textContent='0';$('scB').textContent='0';
  menu.screen='none';renderMenu();showHud(true);
  setupKickoff(0);snapCamera();banner('KICK OFF',TM[0].def.n.toUpperCase()+' v '+TM[1].def.n.toUpperCase(),'#fff',2.4);
}
function startSecondHalf(){
  for(const T of TM)T.dir*=-1;
  S.half=2;S.halfT=0;S.endPending=false;
  for(const p of P)p.stam=Math.min(1,p.stam+.4);
  menu.screen='none';renderMenu();setupKickoff(1);snapCamera();banner('SECOND HALF',null,'#fff',1.6);
}
function showHalftime(){menu.screen='ht';renderMenu();}
function showFulltime(){menu.screen='ft';menu.cur=0;renderMenu();SND.cheer(.4);}
/* ---------- replay ---------- */
const STC={idle:0,slide:1,down:2,cele:3,stumble:4,lunge:5},STN=['idle','slide','down','cele','stumble','lunge'];
function recordFrame(dt){
  S.recT+=dt;if(S.recT<.04)return;S.recT-=.04;
  const f=new Float32Array(3+P.length*5);f[0]=ball.x;f[1]=ball.y;f[2]=ball.z;
  P.forEach((p,i)=>{const o=3+i*5;f[o]=p.x;f[o+1]=p.z;f[o+2]=p.face;f[o+3]=hyp(p.vx,p.vz);f[o+4]=STC[p.st]||0;});
  S.rec.push(f);if(S.rec.length>180)S.rec.shift();
}
function startReplay(){
  S.mode='replay';S.rp=S.rpFrames;S.rpi=0;S.rpFrames=null;$('rep').style.display='block';banner('INSTANT REPLAY',null,'#fff',1.4);
  cam.lx=S.rp[0][0];cam.x=cam.lx;
}
function replayStep(dt){
  const rp=S.rp,n=rp.length;
  if(S.IN&&(S.IN.e.ok||S.IN.e.back)){S.rpi=n;}
  S.rpi+=dt*25*(S.rpi>n-40?.5:1);
  const i=Math.min(n-1,Math.floor(S.rpi)),f=rp[i];
  ball.x=f[0];ball.y=f[1];ball.z=f[2];ballMesh.position.set(f[0],f[1],f[2]);placeBallShadow(f[0],f[1],f[2]);
  P.forEach((p,k)=>{const o=3+k*5;p.x=f[o];p.z=f[o+1];p.face=f[o+2];const sp=f[o+3];p.vx=Math.cos(p.face)*sp;p.vz=Math.sin(p.face)*sp;p.st=STN[f[o+4]]||'idle';p.kickT=0;});
  if(S.rpi>=n){$('rep').style.display='none';for(const p of P){p.vx=p.vz=0;p.st='idle';}afterGoal();}
}
/* ---------- HUD per frame ---------- */
function hudFrame(dt){
  hudTick(dt);
  const run=!['menu','ht','ft'].includes(S.mode);
  if(!run){hideRibbon(TRJ&&TRJ.aim);hideRibbon(TRJ&&TRJ.fly);if(TRJ)TRJ.land.visible=false;$('ctrl').style.display='none';return;}
  $('clk').textContent=gameClockText()+(S.endPending?' +':'');
  $('half').textContent=(S.half===1?'1ST HALF':'2ND HALF')+(S.mode==='replay'?'':(S.mode==='play'?'':''));
  drawRadar();
  const a=S.active,show=a&&!a.out&&(S.mode==='play'||S.mode==='setpiece'||S.mode==='kickoff'||S.mode==='penalty');
  activeRing.visible=activeArrow.visible=!!show;
  if(show){activeRing.position.set(a.x,.06,a.z);activeArrow.position.set(a.x,3.3+Math.sin(S.t*6)*.15,a.z);
    $('pname').style.display='block';$('pname').textContent=a.num+' \u00b7 '+a.name.toUpperCase();
    $('stam').style.display='block';$('stam').firstChild.style.width=(a.stam*100)+'%';}
  else{$('stam').style.display='none';$('pname').style.display='none';}
  const tg=show&&S.tgt&&(ball.owner===a);targetRing.visible=!!tg;if(tg)targetRing.position.set(S.tgt.x,.07,S.tgt.z);
  $('power').style.display=S.charging?'block':'none';if(S.charging)$('power').firstChild.style.width=(S.charge*100)+'%';
  $('hint').style.display='none';ctrlFrame(dt);
  trajFrame(a,show);
}

/* ---------- on-screen control prompts ---------- */
let ctrlKey='',ctrlBigT=0;
function padOn(){try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const g of ps)if(g&&g.connected)return true;}catch(e){}return false;}
const PADC={A:'#3ccf5a',B:'#ff4d4d',X:'#4d8dff',Y:'#ffd24d'};
function ctrlItems(kind,pad){
  const R={atk:'mv spr J K L S',def:'mv spr J K Q A',set:'mv J L S',pen:'mv S',loose:'mv spr Q J A'}[kind].split(' ');
  const o=(id,i)=>({...i,on:R.includes(id)||id==='x'||!!i.sk});
  return pad?[
    o('mv',{k:'L',pad:1,c:'#8895b8',t:'MOVE'}),o('spr',{k:'RT',pad:1,c:'#8895b8',t:'SPRINT'}),
    o('J',{k:'A',pad:1,c:PADC.A,t:'PASS · TACKLE'}),o('K',{k:'Y',pad:1,c:PADC.Y,t:'THROUGH · SLIDE'}),o('L',{k:'B',pad:1,c:PADC.B,t:'LOB'}),o('S',{k:'X',pad:1,c:PADC.X,t:'SHOOT (HOLD)'}),
    o('A',{k:'X',pad:1,c:PADC.X,t:'VOLLEY · HEADER'}),
    o('Q',{k:'LB',pad:1,c:'#8895b8',t:'SWITCH'}),o('x',{k:'R3',pad:1,c:'#8895b8',t:'ZOOM'}),o('x',{k:'START',pad:1,c:'#8895b8',t:'PAUSE'}),
    o('c1',{k:'LT',pad:1,c:'#b07cff',t:'CLOSE CONTROL',sk:1}),o('c2',{k:'LT+A',pad:1,c:'#b07cff',t:'STEPOVER',sk:1}),o('c3',{k:'LT+Y',pad:1,c:'#b07cff',t:'ROLL·TURN·ROULETTE',sk:1}),
    o('c4',{k:'LT+B',pad:1,c:'#b07cff',t:'RAINBOW',sk:1}),o('c5',{k:'LT+X',pad:1,c:'#b07cff',t:'FINESSE',sk:1}),o('c6',{k:'RB',pad:1,c:'#8895b8',t:'KNOCK-ON',sk:1}),o('c7',{k:'R-STICK',pad:1,c:'#b07cff',t:'FLICK SKILLS',sk:1})
  ]:[
    o('mv',{k:'WASD',t:'MOVE'}),o('spr',{k:'SHIFT',t:'SPRINT'}),
    o('J',{k:'J',t:'PASS · TACKLE'}),o('K',{k:'K',t:'THROUGH · SLIDE'}),o('L',{k:'L',t:'LOB'}),o('S',{k:'SPACE',t:'SHOOT (HOLD)'}),
    o('A',{k:'SPACE',t:'VOLLEY · HEADER'}),
    o('Q',{k:'Q',t:'SWITCH PLAYER'}),o('x',{k:'Z',t:'ZOOM'}),o('x',{k:'P',t:'PAUSE'}),
    o('c1',{k:'HOLD C',t:'CLOSE CONTROL',sk:1}),o('c2',{k:'C+J',t:'STEPOVER',sk:1}),o('c3',{k:'C+K',t:'ROLL·TURN·ROULETTE',sk:1}),
    o('c4',{k:'C+L',t:'RAINBOW',sk:1}),o('c5',{k:'C+SPACE',t:'FINESSE',sk:1}),o('c6',{k:'V',t:'KNOCK-ON',sk:1})
  ];
}
function ctrlFrame(dt){
  const el=$('ctrl');const live=(S.mode==='play'||S.mode==='setpiece'||S.mode==='kickoff'||S.mode==='penalty')&&menu.screen==='none'&&!S.paused;
  if(!live||S.hideCtrl){el.style.display='none';return;}
  const a=S.active;let kind='loose';
  if(S.mode==='penalty')kind=S.sp&&S.sp.team===0?'pen':'loose';
  else if((S.mode==='setpiece'||S.mode==='kickoff')&&S.sp&&S.sp.team===0&&S.sp.taker===a)kind='set';
  else if(a&&ball.owner===a)kind='atk';
  else if(ball.owner&&ball.owner.team===1)kind='def';
  const pad=padOn();const key=kind+(pad?'p':'k');
  if(key!==ctrlKey){ctrlKey=key;
    const it=ctrlItems(kind,pad).filter(i=>!i.sk||kind==='atk'),ttl={atk:'ATTACKING',def:'DEFENDING',set:'SET PIECE',pen:'PENALTY',loose:'LOOSE BALL'}[kind];
    el.innerHTML='<span class="ttl">'+ttl+'</span><span class="sep"></span>'+it.map(i=>'<span class="ci'+(i.on?'':' dim')+'"><span class="k'+(i.pad?' pad':'')+'"'+(i.c?' style="background:'+i.c+'"':'')+'>'+i.k+'</span>'+i.t+'</span>').join('')+'<span class="sep"></span><span class="ci"><span class="k">H</span>HIDE</span>';
  }
  el.style.display='flex';
  if(S.t<ctrlBigT0){}
}
let ctrlBigT0=0;
/* ---------- main loop ---------- */
function stepAll(dt){
  S.t+=dt;
  const m=S.mode;
  if(m==='replay'){replayStep(dt);return;}
  if(m==='menu'||m==='ht'||m==='ft')return;
  teamPrep();updateModeLogic(dt);
  if(S.mode==='ht'||S.mode==='ft')return;
  if(S.mode==='goal'&&S.rpGrab>0){S.rpGrab-=dt;if(S.rpGrab<=0)S.rpFrames=S.rec.slice(-165);}
  autoSwitch(dt);aerialScan(dt);updatePlayers(dt);stepBall(dt);
  if(S.mode==='play'){updateOwnership(dt);keeperLogic();checkBounds();}
  recordFrame(dt);
}
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.06,(now-lastT)/1000||.016);lastT=now;
  if(S.mode==='goal'&&S.goalT<1.1)dt*=.38+.62*clamp(S.goalT/1.1,0,1); /* goal slow-mo */
  const IN=pollInput();S.IN=IN;
  if(menu.screen!=='none')menuInput(IN);
  else if(IN.e.pause&&S.mode!=='replay')togglePause();
  if(IN.e.zoom&&menu.screen==='none')cam.zoom=(cam.zoom+1)%3;
  if(IN.e.help&&menu.screen==='none'){S.hideCtrl=!S.hideCtrl;try{localStorage.setItem('md_hideCtrl',S.hideCtrl?'1':'');}catch(e){}}
  if(!S.paused){
    const n=Math.max(1,Math.ceil(dt/.018)),sub=dt/n;
    for(let i=0;i<n;i++){
      stepAll(sub);
      if(i===0&&S.IN){S.IN={mx:IN.mx,mz:IN.mz,h:IN.h,e:{},r:{}};}
    }
  }
  for(const p of P)if(!p.out)animPlayer(p,dt);
  if(S.mode==='menu'||S.mode==='ht'||S.mode==='ft'){
    const t=S.t*.12;S.t+=dt;cam.x=Math.sin(t)*34;cam.z=Math.cos(t)*34;camera.position.set(cam.x,16,cam.z);camera.lookAt(0,1,0);
  }else updateCamera(dt);
  hudFrame(dt);crowdUpdate(dt);fxFrame(dt);
  if(AC&&crowdGain){
    const base=.2+.12*clamp((Math.abs(ball.x)-25)/27,0,1),tg=base+S.excite;
    crowdGain.gain.value+=(tg-crowdGain.gain.value)*Math.min(1,dt*3);crowdFilter.frequency.value=420+tg*700;
  }
  renderer.render(scene,camera);
}
function boot(){
  if(typeof THREE==='undefined'){setOv('<div class="panel"><h2 class="t">Could not load 3D engine</h2><div class="foot">CHECK YOUR CONNECTION AND REFRESH</div></div>');return;}
  try{S.hideCtrl=!!localStorage.getItem('md_hideCtrl');}catch(e){}
  initScene();buildTeams();S.st=newStats();S.kickTeam=0;setupKickoff(0);S.mode='menu';
  $('ov').addEventListener('pointerdown',()=>{initAudio();if(menu.screen==='title'){SND.ok();gotoMenu('setup');}});
  renderMenu();requestAnimationFrame(frame);
}
boot();
</script>
