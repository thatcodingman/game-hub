<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Matchday</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;color:#f4f7ff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)}
  canvas#c{filter:contrast(1.07) saturate(1.14) brightness(1.02);position:fixed;inset:0;width:100%;height:100%;display:block}
  #score{position:fixed;top:18px;left:22px;display:none;align-items:stretch;height:44px;background:rgba(8,12,24,.88);border-radius:6px;overflow:hidden;font-weight:800;letter-spacing:.06em;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #score .tm{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:20px}
  #score .tm i{width:10px;height:26px;border-radius:2px;display:block}
  #score .sc{min-width:42px;display:flex;align-items:center;justify-content:center;background:#fff;color:#0a1020;font-size:26px}
  #score .clk{display:flex;align-items:center;padding:0 14px;font-size:20px;background:#16213f;font-variant-numeric:tabular-nums;min-width:96px;justify-content:center}
  #half{position:fixed;top:68px;left:22px;font-size:12px;letter-spacing:.14em;color:#9fb0d6;display:none;font-weight:700}
  #cards{position:fixed;top:86px;left:22px;font-size:12px;display:none;gap:10px;font-weight:700;color:#c8d3ef}
  #banner{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:84px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .18s,transform .18s}
  #banner.on{opacity:1;transform:scale(1)}
  #banner small{display:block;font-size:26px;letter-spacing:.2em;color:#ffd24d;margin-top:6px}
  #lower{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(8,12,24,.88);padding:9px 22px;border-left:5px solid #ffd24d;font-weight:700;letter-spacing:.06em;font-size:15px;display:none;border-radius:3px}
  #power{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:260px;height:12px;background:rgba(8,12,24,.8);border-radius:6px;overflow:hidden;display:none;border:1px solid rgba(255,255,255,.18)}
  #power b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#fde047,#ef4444)}
  #stam{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:120px;height:4px;background:rgba(8,12,24,.7);border-radius:3px;overflow:hidden;display:none}
  #stam b{display:block;height:100%;width:100%;background:#38bdf8}
  #radar{position:fixed;right:18px;bottom:18px;width:190px;height:123px;border-radius:6px;display:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #pname{position:fixed;left:18px;bottom:62px;font-size:15px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 2px 6px #000;display:none}
  #ctrl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:6px 9px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:min(96vw,740px);padding:8px 12px;background:rgba(6,10,22,.72);border:1px solid rgba(255,255,255,.1);border-radius:12px;backdrop-filter:blur(4px);pointer-events:none;transition:opacity .3s}
  #ctrl .ci{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#cdd8f5;white-space:nowrap}
  #ctrl .k{min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:linear-gradient(#f4f7ff,#c9d3ea);color:#0b1224;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 2px 0 #7f8cab}
  #ctrl .k.pad{border-radius:50%;min-width:26px;padding:0;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.5)}
  #tags{position:fixed;left:0;top:0;pointer-events:none;z-index:4}
  #tags .tg{position:absolute;left:0;top:0;font-size:11px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:4px;color:#fff;background:rgba(8,12,24,.72);border-bottom:2px solid #fff;white-space:nowrap;text-shadow:0 1px 2px #000;display:none}
  #tags .tg.me{background:#ffd24d;color:#14110a;border-color:#fff;font-size:12px;text-shadow:none}
  #tags .tg.opp{background:rgba(190,30,40,.85);border-color:#ff8a8a}
  #tags .tg.tgt{background:rgba(255,255,255,.9);color:#0a1224;border-color:#ffd24d;text-shadow:none}
  #ctrl .ci.dim{opacity:.5}
  #ctrl .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px}
  #ctrl .ttl{font-size:11px;color:#ffd24d;letter-spacing:.14em;font-weight:800}
  #ctrl.big{bottom:50%;transform:translate(-50%,50%) scale(1.25);padding:14px 18px}
  #hint{position:fixed;left:18px;bottom:14px;font-size:11px;color:#8fa0c8;letter-spacing:.06em;display:none;line-height:1.5;font-weight:600}
  #comm{position:fixed;left:50%;top:108px;transform:translate(-50%,-8px);max-width:min(80vw,640px);display:flex;align-items:center;gap:8px;padding:4px 12px 4px 9px;background:rgba(8,12,24,.82);border-left:3px solid #5aa9ff;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
  #comm.on{opacity:1;transform:translate(-50%,0)}#comm.an{border-left-color:#4ade80}#comm.warm{border-left-color:#ffb020}#comm.hot{border-left-color:#ff4d4d;font-weight:800}
  #comm.cs1{font-size:13px}#comm.cs2{font-size:16px}
  #comm .mic{font-size:8px;font-weight:900;letter-spacing:.16em;color:#9fb4d6}
  .row.cp{padding:6px 18px;margin:3px 0;font-size:14px}.row.cp .l{font-size:11px}.panel.wide{min-width:min(560px,94vw)}
  #rep{position:fixed;top:20px;right:22px;background:#e11d48;padding:6px 16px;font-weight:900;letter-spacing:.2em;border-radius:4px;display:none}
  #cine{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(14,24,52,.78),rgba(3,5,12,.95))}
  #ov.clear{background:rgba(3,5,12,.55)}
  .panel{min-width:460px;max-width:92vw;text-align:center}
  .logo{font-size:92px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#4ade80,#38bdf8,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .sub{color:#9fb0d6;letter-spacing:.35em;font-size:13px;margin:10px 0 44px;font-weight:700}
  .blink{animation:bl 1.1s infinite;font-weight:800;letter-spacing:.2em;font-size:18px}
  @keyframes bl{50%{opacity:.25}}
  .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 22px;margin:7px 0;background:rgba(255,255,255,.06);border-radius:6px;font-weight:700;letter-spacing:.08em;font-size:17px;border:2px solid transparent}
  .row.sel{background:rgba(255,255,255,.16);border-color:#ffd24d}
  .row .l{color:#9fb0d6;font-size:13px}
  .row .v{display:flex;align-items:center;gap:10px}
  .row .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.4)}
  .row.go{justify-content:center;background:#16a34a;font-size:20px;letter-spacing:.2em}
  .row.go.sel{background:#22c55e}
  h2.t{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;font-weight:900}
  .big{font-size:72px;font-weight:900;margin:8px 0 18px}
  table.st{width:100%;border-collapse:collapse;margin:14px 0;font-weight:700}
  table.st td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px}
  table.st td:nth-child(2){color:#9fb0d6;font-size:12px;letter-spacing:.12em;text-align:center}
  table.st td:first-child{text-align:right}table.st td:last-child{text-align:left}
  .foot{color:#7f90b8;font-size:12px;letter-spacing:.1em;margin-top:18px}
  @media(max-width:900px){.logo{font-size:54px}#banner{font-size:44px}#radar{width:140px;height:90px}.panel{min-width:0;width:94vw}#hint{display:none!important}}

  /* ---- replay overlays ---- */
  #rpinfo{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);display:none;align-items:stretch;background:rgba(8,12,24,.9);border-radius:3px;overflow:hidden;font-weight:800;letter-spacing:.07em;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.5);max-width:94vw;white-space:nowrap}
  #rpinfo .ty{padding:8px 14px;background:#ffd24d;color:#0a1020;font-weight:900;letter-spacing:.14em;font-size:13px;display:flex;align-items:center}
  #rpinfo .tx{padding:8px 16px;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis}
  #rpinfo.near .ty{background:#ff7a3d}#rpinfo.save .ty{background:#4da3ff}
  #rphint{position:fixed;right:22px;bottom:18px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#c9d6f2;background:rgba(8,12,24,.7);padding:5px 10px;border-radius:3px;display:none;pointer-events:none}
  #wipe{position:fixed;top:-5vh;bottom:-5vh;left:0;width:22vw;pointer-events:none;opacity:0;z-index:20;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 45%,rgba(255,210,77,.9) 55%,rgba(255,255,255,0))}
  #wipe.go{animation:wipe .62s cubic-bezier(.5,0,.3,1)}
  @keyframes wipe{0%{transform:translateX(-30vw) skewX(-16deg);opacity:1}100%{transform:translateX(120vw) skewX(-16deg);opacity:1}}
  /* ---- touch ---- */
  html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #tc{position:fixed;inset:0;display:none;pointer-events:none;z-index:6;--u:clamp(40px,13vh,64px);--s:1}
  #tc.s0{--s:.85}#tc.s2{--s:1.18}
  #tcz{position:absolute;left:0;bottom:0;width:48%;height:78%;pointer-events:auto;touch-action:none}
  #tcj{position:absolute;width:calc(var(--u)*2.3*var(--s));height:calc(var(--u)*2.3*var(--s));margin:calc(var(--u)*-1.15*var(--s)) 0 0 calc(var(--u)*-1.15*var(--s));border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);pointer-events:none;opacity:.55;transition:opacity .15s}
  #tcj.on{opacity:1;border-color:rgba(255,255,255,.55)}
  #tcj i{position:absolute;left:50%;top:50%;width:calc(var(--u)*1.05*var(--s));height:calc(var(--u)*1.05*var(--s));margin:calc(var(--u)*-.525*var(--s)) 0 0 calc(var(--u)*-.525*var(--s));border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7)}
  .tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(18,26,48,.62);color:#fff;font:800 calc(var(--u)*.25*var(--s))/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-tap-highlight-color:transparent;padding:0}
  .tb.dn{background:rgba(255,255,255,.55);color:#0a1020;transform:scale(.93)}
  .tb.dim{opacity:.35}
  #tbS{width:calc(var(--u)*1.6*var(--s));height:calc(var(--u)*1.6*var(--s));right:calc(var(--u)*.35 + env(safe-area-inset-right));bottom:calc(var(--u)*.35 + env(safe-area-inset-bottom));background:rgba(77,141,255,.55);border-color:#9cc3ff}
  #tbP{width:calc(var(--u)*1.2*var(--s));height:calc(var(--u)*1.2*var(--s));right:calc(var(--u)*2.15*var(--s) + env(safe-area-inset-right));bottom:calc(var(--u)*.3 + env(safe-area-inset-bottom));background:rgba(60,207,90,.5);border-color:#9ff0b2}
  #tbT{width:calc(var(--u)*1.2*var(--s));height:calc(var(--u)*1.2*var(--s));right:calc(var(--u)*.55 + env(safe-area-inset-right));bottom:calc(var(--u)*2.15*var(--s) + env(safe-area-inset-bottom));background:rgba(255,210,77,.5);border-color:#ffe48f}
  #tbL{width:calc(var(--u)*1.1*var(--s));height:calc(var(--u)*1.1*var(--s));right:calc(var(--u)*2.05*var(--s) + env(safe-area-inset-right));bottom:calc(var(--u)*1.85*var(--s) + env(safe-area-inset-bottom));background:rgba(255,77,77,.48);border-color:#ff9c9c}
  #tbR{width:calc(var(--u)*1.05*var(--s));height:calc(var(--u)*1.05*var(--s));right:calc(var(--u)*3.65*var(--s) + env(safe-area-inset-right));bottom:calc(var(--u)*.55 + env(safe-area-inset-bottom))}
  #tbW{width:calc(var(--u)*.95*var(--s));height:calc(var(--u)*.95*var(--s));right:calc(var(--u)*3.55*var(--s) + env(safe-area-inset-right));bottom:calc(var(--u)*1.95*var(--s) + env(safe-area-inset-bottom))}
  #tbK{width:calc(var(--u)*.95*var(--s));height:calc(var(--u)*.95*var(--s));right:calc(var(--u)*.7 + env(safe-area-inset-right));bottom:calc(var(--u)*3.55*var(--s) + env(safe-area-inset-bottom));border-color:#c9a8ff;background:rgba(176,124,255,.4)}
  #tcpause{position:absolute;pointer-events:auto;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(18,26,48,.62);color:#fff;font-size:16px;font-weight:900;touch-action:none;padding:0}
  body.touch #radar{top:10px;right:62px;bottom:auto;width:124px;height:80px}
  body.touch #rep{top:96px;right:12px;padding:4px 12px;font-size:12px}
  body.touch #comm{top:52px}
  body.touch #pname{left:12px;bottom:auto;top:76px;font-size:12px}
  body.touch #stam{bottom:auto;top:98px;left:12px;transform:none;width:90px}
  body.touch #power{bottom:auto;top:8px;left:50%;width:200px}
  body.touch #rphint{bottom:20px;right:14px}
  body.touch #rpinfo{bottom:20px;max-width:70vw}
  @media(max-height:520px){
    #score{top:8px;left:10px;height:34px}#score .tm{font-size:15px;padding:0 9px;gap:6px}#score .tm i{height:20px}#score .sc{min-width:32px;font-size:20px}#score .clk{font-size:15px;min-width:70px;padding:0 9px}
    #half{top:46px;left:12px;font-size:10px}
    #banner{font-size:38px!important;top:20%}#banner small{font-size:15px}
    #lower{bottom:20px;font-size:12px;padding:6px 14px}
    #rpinfo{font-size:12px}#rpinfo .ty{font-size:11px;padding:6px 10px}#rpinfo .tx{padding:6px 10px}
    .panel{max-height:98vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.row{padding:6px 14px;margin:3px 0;font-size:13px;border-width:1px}.row.go{font-size:15px;letter-spacing:.14em}.panel .t{font-size:20px!important;margin:0 0 4px!important}.panel .foot{font-size:10px;margin:0 0 6px!important}.panel .big{font-size:40px}.logo{font-size:42px!important}
  }
  .panel.wide{max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #rot{position:fixed;inset:0;display:none;z-index:60;background:#05070d;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:800;letter-spacing:.12em;text-align:center;font-size:16px;padding:20px}
  #rot b{font-size:54px;display:block;animation:rotp 2s ease-in-out infinite}
  @keyframes rotp{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media(orientation:portrait){body.touch.live #rot{display:flex}}

  /* ---- lineup / summary screens ---- */
  .lu{width:min(980px,96vw)}
  .lu-g{display:grid;grid-template-columns:1fr minmax(260px,330px) 1fr;gap:16px;text-align:left;align-items:start}
  .lu-h{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:4px;font-size:14px;letter-spacing:.06em}
  .lu-h i,.sl i,.mo i{width:10px;height:22px;border-radius:2px;display:block;flex:none}
  .lu-h em{white-space:nowrap;margin-left:auto;font-style:normal;color:#9fb0d6;font-size:12px;font-weight:800}
  .lu-r{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
  .lu-r .nu{width:20px;font-weight:900;color:#9fb0d6}.lu-r .po{width:28px;font-size:10px;color:#7f90b8;font-weight:800}.lu-r .nm{flex:1;font-weight:700;letter-spacing:.02em}.lu-r .ov{font-weight:900;color:#ffd24d;width:24px;text-align:right}
  .lu-pitch{width:100%;display:block;border-radius:5px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  .lu-f{margin-top:8px;text-align:center;font-size:11px;letter-spacing:.14em;color:#9fb0d6;font-weight:800}
  .sl{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:14px;margin:4px 0 10px}
  .st1{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:.06em;text-align:left}
  .st1 small{flex-basis:100%;font-size:11px;color:#9fb0d6;font-weight:700;letter-spacing:.04em;line-height:1.35;padding-left:18px}
  .st1.r{justify-content:flex-end;text-align:right}.st1.r small{padding:0 18px 0 0}
  .sl .big{margin:0;font-size:46px;line-height:1}
  .sg{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;text-align:left;align-items:start}
  .sbs .sb{display:grid;grid-template-columns:34px 1fr 98px 1fr 34px;align-items:center;gap:6px;padding:4px 0}
  .sb .v{font-weight:900;font-size:14px;text-align:center}.sb .n{font-size:10px;letter-spacing:.12em;color:#9fb0d6;text-align:center;font-weight:800}
  .sb .bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;display:flex}.sb .bar.l{justify-content:flex-end}.sb .bar i{display:block;height:100%;width:0;border-radius:4px;border:0;margin:0}
  .mo{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-left:4px solid #ffd24d;border-radius:4px;padding:9px 12px;margin-bottom:10px}
  .mo small{display:block;font-size:10px;letter-spacing:.14em;color:#ffd24d;font-weight:900}.mo b{display:block;font-size:15px;letter-spacing:.04em}.mo span{display:block;font-size:11px;color:#9fb0d6;font-weight:600}
  .mo em{margin-left:auto;font-style:normal;font-size:26px;font-weight:900;color:#ffd24d}
  .panel.sm .row.go{margin:5px 0;font-size:15px;letter-spacing:.12em}
  @media(max-width:760px){.lu-g{grid-template-columns:1fr 1fr}.lu-m{grid-column:1/-1;order:-1}.sg{grid-template-columns:1fr}.sl .big{font-size:34px}}
  @media(max-height:520px){.lu-r{font-size:11px;padding:2px 6px}.lu-h{font-size:12px;padding:4px 6px}.sbs .sb{padding:2px 0}.mo{padding:6px 10px;margin-bottom:6px}.mo b{font-size:13px}.sl .big{font-size:30px}.st1{font-size:12px}.lu-f{display:none}}
  .sbl{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}.sbl .row{margin:0}.row.sp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;font-size:13px}.row.sp small{color:#9fb0d6;margin-left:4px}.sbk{grid-column:1/-1}
  .fb{display:inline-block;width:44px;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;vertical-align:middle}.fb i{display:block;height:100%}
  @media(max-height:520px){.row.sp{padding:4px 9px;font-size:11px}.sbl{gap:3px 6px}}
  #so{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(8,12,24,.82);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 12px;display:none;font:800 12px system-ui;color:#fff;letter-spacing:.06em}
  #so .sor{display:flex;align-items:center;gap:5px;margin:2px 0}#so b{width:34px;color:#9fb0d6}#so em{font-style:normal;margin-left:6px;font-size:15px}

const STYLES=[{k:'bal',n:'BALANCED'},{k:'att',n:'ATTACKING'},{k:'def',n:'DEFENSIVE'},{k:'cnt',n:'COUNTER-ATTACK'}];
function posOf(p){return p.gk?'GK':p.fx<.3?'DF':p.fx<.6?'MF':'FW';}
function fitOf(p){return Math.round((1-(p.fat||0))*100);}
function subsLeft(t){return 5-TM[t].subs-TM[t].pend.length;}
function subNow(){return ['ht','kickoff','setpiece'].includes(S.mode);}
function queueSub(t,outP,rec){
  const T=TM[t];if(outP.out||outP.gk!==(rec.pos==='GK'))return false;
  const ex=T.pend.findIndex(q=>q.p===outP);if(ex>=0)T.pend.splice(ex,1);
  if(subsLeft(t)<=0)return false;
  T.pend=T.pend.filter(q=>q.rec!==rec);T.pend.push({p:outP,rec});
  if(subNow())applyPending([t]);return true;
}
function cancelSub(t,outP){const T=TM[t],i=T.pend.findIndex(q=>q.p===outP);if(i>=0){T.pend.splice(i,1);return true;}return false;}
function applySub(t,p,rec){
  const T=TM[t],bi=T.bench.indexOf(rec);if(bi<0||p.out)return null;
  const old={team:t,idx:p.idx,gk:p.gk,fx:p.fx,fy:p.fy,name:p.name,num:p.num,ovr:p.ovr,ps:p.ps,yc:p.yc,subbed:true};
  T.gone.push(old);T.bench.splice(bi,1);T.subs++;
  scene.remove(p.mesh);
  p.name=rec.name;p.num=rec.num;p.ovr=rec.ovr;p.at=rec.at;p.tr=rec.tr;p.inj=0;p.ps=rec.ps;p.yc=rec.yc;p.mo=rec.mo;p.fat=0;p.stam=1;p.sm=smOf(p);p.tackleCD=0;p.iw=0;p.tw=0;p.st='idle';p.stT=0;p.sk=null;p.aer=null;p.trap=null;p.pos=undefined;p.ks=undefined;
  mkMesh(p);scene.add(p.mesh);p.mesh.position.set(p.x,0,p.z);
  return old;
}
function applyPending(ts){
  const done=[];
  for(const t of (ts||[0,1])){
    const T=TM[t];if(!T.pend.length)continue;
    const list=T.pend.slice();T.pend.length=0;
    for(const q of list){const old=applySub(t,q.p,q.rec);if(old)done.push({t,p:q.p,old});}
  }
  if(!done.length)return;
  SND.ok();
  if(done.length===1){const d=done[0];banner('SUBSTITUTION',TM[d.t].def.a+' &nbsp;#'+d.old.num+' '+d.old.name.toUpperCase()+' ▶ #'+d.p.num+' '+d.p.name.toUpperCase(),'#fff',2.4);}
  else banner('SUBSTITUTIONS',done.length+' CHANGES &nbsp;•&nbsp; '+TM[done[0].t].def.a,'#fff',2.4);
  for(const d of done)mdEmit('sub',{team:d.t,p:d.p,v:{name:d.old.name}});
}
function changeForm(t,key){
  const T=TM[t],f=FORMS[key];if(!f||T.fk===key)return;
  const pl=T.players.filter(p=>!p.gk).sort((a,b)=>a.fx-b.fx||a.fy-b.fy);
  const sl=f.slice(1).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  // keep lateral order within a role band sensible
  pl.forEach((p,i)=>{p.fx=sl[i][0];p.fy=sl[i][1];});
  T.fk=key;
}
function setStyle(t,k){TM[t].style=k;}
function styleName(k){return STYLES.find(s=>s.k===k).n;}
/* ----- smart AI manager ----- */
function aiManage(t,atHT){
  const T=TM[t],mins=gameMinute(),me=S.score[t]-S.score[1-t];
  for(const p of T.players){if(p.inj&&!p.gk&&!p.out&&!T.pend.some(q=>q.p===p)&&T.subs+T.pend.length<5){let pool=T.bench.filter(b=>b.pos===posOf(p)&&!T.pend.some(q=>q.rec===b));if(!pool.length)pool=T.bench.filter(b=>b.pos!=='GK'&&!T.pend.some(q=>q.rec===b));pool.sort((a,b)=>b.ovr-a.ovr);if(pool[0])queueSub(t,p,pool[0]);}}
  // substitutions
  if(T.subs+T.pend.length<5){
    const lastGap=mins-(T.lastSub||-99);
    const want=atHT?2:(mins>=58&&lastGap>=6?1:0);
    for(let n=0;n<want&&T.subs+T.pend.length<5;n++){
      const cand=T.players.filter(p=>!p.gk&&!p.out&&!T.pend.some(q=>q.p===p)).sort((a,b)=>(b.fat||0)-(a.fat||0));
      let out=cand[0];if(!out||(out.fat||0)<(atHT?.38:.5))break;
      let grp=posOf(out);
      // chasing / protecting tweaks
      if(mins>=60&&me<0){const f=cand.filter(p=>posOf(p)==='DF'&&(p.fat||0)>.3)[0];if(f&&T.bench.some(b=>b.pos==='FW')){out=f;grp='FW';}}
      else if(mins>=75&&me>0){const f=cand.filter(p=>posOf(p)==='FW'&&(p.fat||0)>.3)[0];if(f&&T.bench.some(b=>b.pos==='DF')){out=f;grp='DF';}}
      else grp=posOf(out);
      let pool=T.bench.filter(b=>b.pos===grp&&!T.pend.some(q=>q.rec===b));
      if(!pool.length)pool=T.bench.filter(b=>b.pos!=='GK'&&!T.pend.some(q=>q.rec===b));
      pool.sort((a,b)=>b.ovr-a.ovr);
      if(pool[0]&&queueSub(t,out,pool[0])){T.lastSub=mins;}else break;
    }
  }
  // tactics
  if(mins>=25&&mins-(T.lastTact||-99)>=8||atHT){
    let st='bal',fm=null;
    if(me<0){if(mins>=55){st='att';if(me<=-2||mins>=72)fm='3-4-3';else if(T.fk==='4-4-2'||T.fk==='4-2-3-1')fm='4-3-3';}else if(me<=-2){st='att';}}
    else if(me>0&&mins>=65){st='def';if(mins>=78&&me>=1)fm='5-3-2';else if(mins>=70&&me>=1)fm='4-1-4-1';}
    else if(me===0&&mins>=82){st='att';}
    else if(me>0){st='cnt';}
    const chg=(st!==T.style)||(fm&&fm!==T.fk);
    if(chg){
      setStyle(t,st);if(fm)changeForm(t,fm);T.lastTact=mins;
      mdEmit('tact',{team:t,style:st});
    }
  }
}
function aiStoppage(){

function crossTo(p,tx,tz,curl){
  const d=TM[p.team].dir,acc=accOf(p),e=(1-acc)*3.2;
  tx+=rnd(-1,1)*e;tz+=rnd(-1,1)*e;
  let ang=Math.atan2(tz-p.z,tx-p.x);const dist=hyp(tx-p.x,tz-p.z);
  const sh=clamp(dist*.55+6,11,23),t=dist/sh,vy=clamp(GRAV*t/2,3,11);
  ang-=curl*.3*d;
  S.lastShooter=null;
  kickBall(p,Math.cos(ang),Math.sin(ang),sh,vy,curl*d*2.8,null);
  S.st[p.team].pass++;p.ps.pass++;

}

function soDecided(){
  const K=S.so.k,G=S.so.g;
  if(K[0]<=5&&K[1]<=5){for(let t=0;t<2;t++)if(G[t]>G[1-t]+(5-K[1-t]))return t;return -1;}
  if(K[0]===K[1]&&G[0]!==G[1])return G[0]>G[1]?0:1;return -1;
}
function soNext(){
  const so=S.so,K=so.k;

function soResult(res){
  const so=S.so;if(!so||so.res)return;
  so.res=res;const t=so.team;so.k[t]++;so.kicks[t].push(res==='goal');if(res==='goal')so.g[t]++;

  if(res==='goal'){SHK=.4;SND.net();SND.cheer(.8);fxConfetti(HL-8,0,120);banner('GOAL!',TM[t].def.a+' &nbsp;'+so.g[0]+' - '+so.g[1],'#ffd24d',2.2);if(p){p.st='cele';p.stT=2.4;}}

function soCheck(){
  const so=S.so;if(!so||S.mode!=='play'||!so.kk||so.res)return;
  const b=ball;
  if(Math.abs(b.z)<GW-.05&&b.y<GH-.05&&b.x>HL+.15){soResult('goal');return;}
  if(b.owner&&b.owner.gk){soResult('saved');return;}
  if(b.hit===2&&b.last&&b.last.gk&&b.lastTeam!==so.team){soResult('saved');return;}
  const dt=S.t-so.t0;
  if(Math.abs(b.x)>HL+.2||Math.abs(b.z)>HW||(dt>1&&hyp(b.vx,b.vz)<1.2&&b.y<BR+.1)||dt>5)soResult('miss');

function soLogic(dt){
  const so=S.so;if(!so||!so.on)return;
  if(so.phase==='intro'){so.gapT-=dt;if(so.gapT<=0)soNext();}
  else if(so.phase==='kick'){
    if(S.mode==='play'&&!so.kk){so.kk=1;so.t0=S.t;}
  }else if(so.phase==='gap'){
    so.gapT-=dt;
    if(so.gapT<=0){
      const w=soDecided();
      if(w>=0){so.winner=w;so.phase='end';so.gapT=3.2;banner(TM[w].def.n.toUpperCase(),'WIN ON PENALTIES &nbsp; '+so.g[0]+' - '+so.g[1],'#ffd24d',3.2);SND.cheer(1);SND.whistle(true);mdEmit('so',{team:w,res:'win',g:so.g.slice()});}
      else soNext();
    }
  }else if(so.phase==='end'){
    so.gapT-=dt;
    if(so.gapT<=0){so.on=false;so.done=true;S.mode='ft';S.mt=0;soHud(false);showFulltime();}
  }
}

let CUP=null;

const SQ_POS=['GK','GK','DF','DF','DF','DF','DF','DF','MF','MF','MF','MF','MF','MF','FW','FW','FW','FW'];

function genSquad(ti){
  const def=TEAMS[ti],names=NAMEPOOL.slice().sort(()=>Math.random()-.5),pl=[];
  SQ_POS.forEach((pos,i)=>{const g=genStats(pos,def,i%2===0&&pos!=='GK',i>=11);pl.push(Object.assign({name:names.pop(),num:SQ_NUM[i],pos,mo:newMo(pos==='GK')},g));});
  const sq={players:pl,xi:[]};sq.xi=autoXI(sq,FORMS['4-4-2'],{});return sq;

function grpOf(f){return f[0]<.3?'DF':f[0]<.6?'MF':'FW';}
function autoXI(sq,form,susp){
  const ok=sq.players.map((r,i)=>i).filter(i=>!(susp&&susp[sq.players[i].name]>0));
  const need={DF:0,MF:0,FW:0};form.slice(1).forEach(f=>need[grpOf(f)]++);
  const by=g=>ok.filter(i=>sq.players[i].pos===g).sort((a,b)=>sq.players[b].ovr-sq.players[a].ovr);
  const xi=[],used=new Set();
  const gk=by('GK')[0];if(gk!==undefined){xi.push(gk);used.add(gk);}
  for(const g of ['DF','MF','FW'])for(const i of by(g)){if(need[g]<=0)break;xi.push(i);used.add(i);need[g]--;}
  const rest=ok.filter(i=>!used.has(i)&&sq.players[i].pos!=='GK').sort((a,b)=>sq.players[b].ovr-sq.players[a].ovr);
  while(xi.length<11&&rest.length)xi.push(rest.shift());
  return xi;
}
function cupStarters(ti,fk,isYou){

  let xi=isYou?sq.xi.slice():autoXI(sq,form,{});

  if(bad)xi=autoXI(sq,form,susp);

  const grp={GK:0,DF:1,MF:2,FW:3};
  const recs=xi.map(i=>sq.players[i]);

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simTie(a,b){
  const ra=TEAMS[a].r,rb=TEAMS[b].r,la=1.35*Math.pow(ra/rb,4),lb=1.35*Math.pow(rb/ra,4);
  const m={a,b,sa:poisson(la),sb:poisson(lb),pa:-1,pb:-1,w:-1};
  if(m.sa>m.sb)m.w=a;else if(m.sb>m.sa)m.w=b;
  else{let x=0,y=0;const pw=.5+(ra-rb)*.01;for(let i=0;i<5;i++){if(Math.random()<.76)x++;if(Math.random()<.76)y++;}
    while(x===y){if(Math.random()<.76)x++;if(Math.random()<.76)y++;if(Math.random()<.5){x+=0;}if(x===y&&Math.random()<.3){Math.random()<pw?x++:y++;}}
    m.pa=x;m.pb=y;m.w=x>y?a:b;}
  return m;
}
function cupStart(you){

function cupFinishRound(){

  const nx=[];for(let i=0;i<R.length;i+=2)nx.push({a:R[i].w,b:R[i+1].w,sa:0,sb:0,pa:-1,pb:-1,w:-1});

function cupAfterMatch(){

  const yourSide=m.a===CUP.you?0:1,sc=S.score;
  const my=sc[0],th=sc[1];let w;
  if(my>th)w=CUP.you;else if(th>my)w=m.a===CUP.you?m.b:m.a;else w=S.so&&S.so.winner===0?CUP.you:(m.a===CUP.you?m.b:m.a);
  const pm=S.so&&S.so.done?S.so.g:[-1,-1];
  m.sa=yourSide===0?my:th;m.sb=yourSide===0?th:my;m.pa=yourSide===0?pm[0]:pm[1];m.pb=yourSide===0?pm[1]:pm[0];m.w=w;
  CUP.last={r:CUP.r,w};
  // cards: served suspensions, then new ones
  for(const k of Object.keys(CUP.susp)){CUP.susp[k]--;if(CUP.susp[k]<=0)delete CUP.susp[k];}
  for(const o of TM[0].players.concat(TM[0].gone)){

  }
  cupFinishRound();

function teamPrep(){

  const pr=keeperPredict(p);
  if(pr&&Math.abs(pr.zp)<GW+3&&pr.yp<GH+1.3){
    if(p.errShot!==ball.shot){p.errShot=ball.shot;p.err=(Math.random()-.5)*2*(1-(p.team?DIFFS[CFG.diff].gk:.62))*2.4;}
    let tz=clamp(pr.zp+p.err,-GW-.6,GW+.6);if(S.lastSet==='penalty'){tz=(p.team===0&&S.pkHuman&&S.IN&&!(p.diveT>0))?(S.IN.mz>.3?1:S.IN.mz<-.3?-1:0)*2.6:(p.team===0&&S.pkHuman?p.z+p.diveDir*2:S.guess*2.5);}
    p.x+=(gx+d*1.2-p.x)*Math.min(1,dt*6);
    if(Math.abs(tz-p.z)>.6){c.dx=0;c.dz=Math.sign(tz-p.z);c.mag=1;c.sprint=true;
      if(pr.tG<.6&&Math.abs(tz-p.z)>1.1&&p.diveT<=0&&p.saved!==ball.shot){p.diveT=.55;p.diveDir=Math.sign(tz-p.z);}}
    return c;
  }
  // loose ball inside own box / just outside: claim it if nearest
  const bd=hyp(ball.x-p.x,ball.z-p.z),inBox=insideBox(p.team,ball.x,ball.z);
  if(!ball.owner&&inBox&&hyp(ball.vx,ball.vz)<9&&bd<14&&T.cd>bd-1){go(ball.x,ball.z,1,true);return c;}
  if(ks==='sweeper'&&!ball.owner&&!inBox&&poss()!==p.team&&bd<22&&hyp(ball.vx,ball.vz)<16&&(ball.x-gx)*(-d)>0&&Math.abs(ball.x-gx)<30&&T.cd>bd-2&&(ball.x-gx)*(-d)<30){go(ball.x,ball.z,1,true);return c;}
  const bg=hyp(ball.x-gx,ball.z),adv=(poss()===p.team&&Math.abs(ball.x-gx)>45?clamp((bg-34)*.15,0,5):0)*(ks==='sweeper'?1.8:ks==='line'?.6:1)+(ks==='sweeper'&&poss()!==1-p.team?1.2:0);
  const ang=Math.atan2(ball.z,Math.abs(ball.x-gx)+2);
  go(gx+d*(1.4+adv+clamp(8/(bg+1)*3,0,1.4)),clamp(Math.tan(ang)*3.2,-GW+.5,GW-.5),.9,false);
  c.look=Math.atan2(ball.z-p.z,ball.x-p.x);
  return c;
}
function keeperLogic(){
  if(S.mode!=='play')return;
  for(const T of TM){
    const gk=T.players[0];if(gk.out)continue;
    const pr=keeperPredict(gk);if(!pr||gk.saved===ball.shot||pr.tG>.075)continue;
    gk.saved=ball.shot;
    const onTarget=Math.abs(pr.zp)<GW-.05&&pr.yp<GH-.05;if(!onTarget)continue;
    const d=T.dir,ks=ksOf(gk),skill=(T.idx?DIFFS[CFG.diff].gk*(.9+.2*T.sk):.74+.14*T.sk)*(ks==='line'?1.07:ks==='shaky'?.85:1)*(.85+.3*(((gk.at.tkl+gk.at.pac)/2)-40)/58);
    const dz=Math.abs(gk.z-pr.zp),reach=gk.diveT>0?3.1:1.5;
    let ch=skill*(1-clamp((pr.sp-16)/60,0,.5));
    ch*=dz<reach?1-dz/reach*.5:0;
    if(pr.yp>1.9)ch*=.65;if(Math.abs(pr.zp)>GW-.8)ch*=.75;
    if(Math.random()<ch){
      const gx=-d*HL;ball.last=gk;ball.lastTeam=gk.team;ball.hit=2;SND.save();gk.ps.sav++;mdEmit('save',{k:gk});
      ball.x=gx+d*.9;ball.z=clamp(pr.zp,-GW,GW);ball.y=Math.max(ball.y,.4);
      if(pr.sp<17&&pr.yp<1.7&&Math.random()<(ks==='shaky'?.3:ks==='line'?.72:.6)){ball.vx=ball.vz=ball.vy=0;takeOwner(gk);lower('SAVED!',1.5);}
      else{ball.vx=d*rnd(3,8);ball.vz=(Math.random()<.5?-1:1)*rnd(3,8);ball.vy=rnd(2,5);lower('GREAT SAVE',1.6);}
    }
  }
}
/* ---------- set-piece AI ---------- */
function aiSetPiece(p,c,go,dt){
  const sp=S.sp,T=TM[p.team],d=T.dir;
  if(!sp)return c;
  if(p===sp.taker){
    c.mag=0;sp.wait-=dt;
    if(sp.wait<=0)aiExecSet(p,sp);
    return c;
  }
  if(sp.type==='penalty'){if(p.gk&&p.team!==sp.team){go(d*-HL+d*.6,0,.5,false);c.mag=0;}return c;}
  if(sp.type==='kickoff'){c.mag=0;return c;}
  if(p.gk){if(sp.type==='corner'&&p.team!==sp.team)go(-d*HL+d*1.3,sp.z>0?1.5:-1.5,.8,false);else{const b=basePos(p,false);go(b.x,b.z,.6,false);}return c;}
  const atk=p.team===sp.team;
  if(sp.type==='corner'){
    const k=T.players.filter(q=>!q.out&&!q.gk&&q!==sp.taker).indexOf(p);
    const zs=[-6,0,6,-3,3,9,-9,0,5,-5];
    if(atk){if(k<6)go(Math.sign(sp.x)*(HL-6-(k%3)*2.6),zs[k],1,true);else{const b=basePos(p,false);go(b.x,b.z,.8,false);}}
    else{go((sp.x>0?1:-1)*(HL-4-(k%3)*2.6),zs[(k+3)%zs.length]*.9,1,true);}
    return c;
  }
  if(sp.type==='free'){
    if(p.wall){go(p.wall.x,p.wall.z,1,true);return c;}
    const near=hyp(sp.x-TM[sp.team].dir*HL,sp.z)<32;
    if(atk&&near&&p.fx>.55){const k=p.idx;go(d*(HL-14-(k%3)*3),((k%4)-1.5)*6,.9,false);return c;}
  }
  const b=basePos(p,false);go(b.x,b.z,.85,hyp(b.x-p.x,b.z-p.z)>10);
  if(sp.type==='throw'&&atk){const dd=hyp(sp.x-p.x,sp.z-p.z);if(dd<14&&p.fx>.2){const a=(p.idx*1.7)%3.1-1.5;go(sp.x+Math.cos(a)*9*(sp.z>0?1:1),sp.z+(sp.z>0?-1:1)*Math.abs(Math.sin(a))*10-(sp.z>0?4:-4),.9,true);}}
  return c;
}
function aiExecSet(p,sp){
  const T=TM[p.team],d=T.dir,type=sp.type;
  if(type==='kickoff'){const q=T.players.filter(o=>!o.out&&!o.gk&&o!==p).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z))[0];passBall(p,q,'short');return;}
  if(type==='penalty'){shootBall(p,rnd(.72,.92),(Math.random()<.5?-1:1)*rnd(1.6,3.1),false);return;}
  if(type==='corner'){
    if(Math.random()<.18){const sq=T.players.filter(q=>q!==p&&!q.out&&!q.gk&&hyp(q.x-p.x,q.z-p.z)<22).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z))[0];if(sq){passBall(p,sq,'short');return;}}
    let tq=null,bs=-1;for(const q of T.players){if(q===p||q.out||q.gk)continue;if(Math.abs(q.x)>HL-20&&Math.abs(q.z)<12){const s=Math.random()*4+(q.fx>.6?2:0);if(s>bs){bs=s;tq=q;}}}
    if(tq)passBall(p,tq,'lob');else kickBall(p,d*(HL-10)-p.x,rnd(-4,4)-p.z,19,7,0,null);return;
  }
  if(type==='free'){
    if(hyp(d*HL-p.x,p.z)<30&&Math.random()<.7){shootBall(p,rnd(.7,.95),rnd(-2.8,2.8),true);return;}
    const ch=aiPassChoice(p,false);if(ch.q){passBall(p,ch.q,hyp(ch.q.x-p.x,ch.q.z-p.z)>26?'lob':'short');return;}
  }
  if(type==='goalkick'||type==='gkhold'){
    const tq=pickTarget(p,d,0,'lob')||pickTarget(p,d,0,'short');if(tq){passBall(p,tq,type==='goalkick'||Math.random()<.5?'lob':'short');return;}
  }
  if(type==='throw'){
    const c=T.players.filter(o=>!o.out&&!o.gk&&o!==p&&Math.abs(o.z)<HW-3&&hyp(o.x-p.x,o.z-p.z)<26).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z)).slice(0,3);
    const q=c.length?c[(Math.random()*c.length)|0]:null;
    if(q){passBall(p,q,'short');return;}
    kickBall(p,d*3,-Math.sign(sp.z||1)*8,10,2,0,null);return;
  }
  const ch=aiPassChoice(p,false);
  if(ch.q)passBall(p,ch.q,'short');else kickBall(p,d,0,16,3,0,null);
}

function endHalf(){
  S.endPending=false;clipFlush();SND.whistle(true);ball.owner=null;ball.vx=ball.vz=ball.vy=0;
  if(S.half===1){S.mode='ht';S.mt=0;showHalftime();}else{S.mode='replay';S.mt=0;playFullTimeReel(()=>{if(CFG.so&&S.score[0]===S.score[1]){soStart();}else{S.mode='ft';S.mt=0;showFulltime();}});}
}
function updateModeLogic(dt){
  S.mt+=dt;const m=S.mode;
  if(S.so&&S.so.on){soLogic(dt);return;}
  if(m==='play'||m==='setpiece'){
    const len=CFG.half*60;if(S.halfT<len+30)S.halfT+=dt;
    if(S.halfT>=len)S.endPending=true;
    if(S.endPending&&m==='play'&&S.halfT>len+8)endHalf();
  }
  if(S.adv)advTick(dt);
  if(m==='foul'&&S.mt>1.8)resolvePending();
  if(m==='goal'){
    S.goalT+=dt;
    if(S.goalT>3.9){S.goalT=-99;playGoalReplay(afterGoal);}
  }
}

function boot(){
