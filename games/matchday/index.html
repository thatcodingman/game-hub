<!DOCTYPE html>
<html lang="en">
<head>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;color:#f4f7ff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #score{position:fixed;top:18px;left:22px;display:none;align-items:stretch;height:44px;background:rgba(8,12,24,.88);border-radius:6px;overflow:hidden;font-weight:800;letter-spacing:.06em;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #score .tm{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:20px}
  #score .tm i{width:10px;height:26px;border-radius:2px;display:block}
  #score .sc{min-width:42px;display:flex;align-items:center;justify-content:center;background:#fff;color:#0a1020;font-size:26px}
  #score .clk{display:flex;align-items:center;padding:0 14px;font-size:20px;background:#16213f;font-variant-numeric:tabular-nums;min-width:96px;justify-content:center}
  #half{position:fixed;top:68px;left:22px;font-size:12px;letter-spacing:.14em;color:#9fb0d6;display:none;font-weight:700}
  #cards{position:fixed;top:86px;left:22px;font-size:12px;display:none;gap:10px;font-weight:700;color:#c8d3ef}
  #banner{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:84px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .18s,transform .18s}
  #banner.on{opacity:1;transform:scale(1)}
  #banner small{display:block;font-size:26px;letter-spacing:.2em;color:#ffd24d;margin-top:6px}
  #lower{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(8,12,24,.88);padding:9px 22px;border-left:5px solid #ffd24d;font-weight:700;letter-spacing:.06em;font-size:15px;display:none;border-radius:3px}
  #power{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:260px;height:12px;background:rgba(8,12,24,.8);border-radius:6px;overflow:hidden;display:none;border:1px solid rgba(255,255,255,.18)}
  #power b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#fde047,#ef4444)}
  #stam{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:120px;height:4px;background:rgba(8,12,24,.7);border-radius:3px;overflow:hidden;display:none}
  #stam b{display:block;height:100%;width:100%;background:#38bdf8}
  #radar{position:fixed;right:18px;bottom:18px;width:190px;height:123px;border-radius:6px;display:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #pname{position:fixed;left:18px;bottom:62px;font-size:15px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 2px 6px #000;display:none}
  #hint{position:fixed;left:18px;bottom:14px;font-size:11px;color:#8fa0c8;letter-spacing:.06em;display:none;line-height:1.5;font-weight:600}
  #rep{position:fixed;top:20px;right:22px;background:#e11d48;padding:6px 16px;font-weight:900;letter-spacing:.2em;border-radius:4px;display:none}
  #cine{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(14,24,52,.78),rgba(3,5,12,.95))}
  #ov.clear{background:rgba(3,5,12,.55)}
  .panel{min-width:460px;max-width:92vw;text-align:center}
  .logo{font-size:92px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#4ade80,#38bdf8,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .sub{color:#9fb0d6;letter-spacing:.35em;font-size:13px;margin:10px 0 44px;font-weight:700}
  .blink{animation:bl 1.1s infinite;font-weight:800;letter-spacing:.2em;font-size:18px}
  @keyframes bl{50%{opacity:.25}}
  .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 22px;margin:7px 0;background:rgba(255,255,255,.06);border-radius:6px;font-weight:700;letter-spacing:.08em;font-size:17px;border:2px solid transparent}
  .row.sel{background:rgba(255,255,255,.16);border-color:#ffd24d}
  .row .l{color:#9fb0d6;font-size:13px}
  .row .v{display:flex;align-items:center;gap:10px}
  .row .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.4)}
  .row.go{justify-content:center;background:#16a34a;font-size:20px;letter-spacing:.2em}
  .row.go.sel{background:#22c55e}
  h2.t{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;font-weight:900}
  .big{font-size:72px;font-weight:900;margin:8px 0 18px}
  table.st{width:100%;border-collapse:collapse;margin:14px 0;font-weight:700}
  table.st td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px}
  table.st td:nth-child(2){color:#9fb0d6;font-size:12px;letter-spacing:.12em;text-align:center}
  table.st td:first-child{text-align:right}table.st td:last-child{text-align:left}
  .foot{color:#7f90b8;font-size:12px;letter-spacing:.1em;margin-top:18px}
  @media(max-width:900px){.logo{font-size:54px}#banner{font-size:44px}#radar{width:140px;height:90px}.panel{min-width:0;width:94vw}#hint{display:none!important}}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const hyp=(x,z)=>Math.sqrt(x*x+z*z), angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
const HL=52.5,HW=34,GW=3.66,GH=2.44,BR=0.28,GRAV=9.8;

const TEAMS=[
 {n:'Northgate United',a:'NGU',c1:0xd32f2f,c2:0xffffff,r:82},
 {n:'Harbor City',a:'HBC',c1:0x4fc3f7,c2:0x0d2c54,r:84},
 {n:'Real Valdora',a:'RVA',c1:0xf5f5f5,c2:0x6a1b9a,r:85},
 {n:'Atletico Sol',a:'ASO',c1:0xffd600,c2:0x111111,r:79},
 {n:'Ironworks FC',a:'IRN',c1:0x212121,c2:0xff6d00,r:77},
 {n:'Lakeside Rovers',a:'LSR',c1:0x2e7d32,c2:0xffffff,r:75},
 {n:'Dynamo Kestrel',a:'DKE',c1:0x1a237e,c2:0xffc107,r:80},
 {n:'Borough Wanderers',a:'BWA',c1:0x7b1f2e,c2:0x64b5f6,r:74}
];
// formations: [fx (0 own goal..1 opp goal), fy lateral -1..1]; index 0 is the goalkeeper
const FORMS={
 '4-4-2':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.45,-.8],[.42,-.25],[.42,.25],[.45,.8],[.68,-.2],[.68,.2]],
 '4-3-3':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.4,0],[.5,-.38],[.5,.38],[.7,-.75],[.78,0],[.7,.75]],
 '4-2-3-1':[[.03,0],[.22,-.8],[.2,-.27],[.2,.27],[.22,.8],[.37,-.25],[.37,.25],[.58,-.7],[.58,0],[.58,.7],[.78,0]]
};
const DIFFS=[{n:'Amateur',spd:.88,react:.7,gk:.58,acc:.62},{n:'Pro',spd:.97,react:1,gk:.74,acc:.84},{n:'World Class',spd:1.04,react:1.3,gk:.88,acc:.95}];
const CFG={home:0,away:1,form:'4-4-2',diff:1,half:3};

/* ---------- audio ---------- */
let AC=null,master,crowdGain,crowdFilter,crowdTarget=.22;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.75;master.connect(AC.destination);
  const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.03*(Math.random()*2-1))/1.03;d[i]=l*4;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  crowdFilter=AC.createBiquadFilter();crowdFilter.type='bandpass';crowdFilter.frequency.value=520;crowdFilter.Q.value=.6;
  crowdGain=AC.createGain();crowdGain.gain.value=.2;
  src.connect(crowdFilter);crowdFilter.connect(crowdGain);crowdGain.connect(master);src.start();
}
function tone(f,dur,type,vol,slide,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function burst(dur,vol,freq,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900;
  const g=AC.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const SND={
  kick(p){tone(150+p*60,.12,'sine',.28+p*.2,-90);burst(.07,.12+p*.15,1500);},
  bounce(v){tone(110,.08,'sine',Math.min(.2,v*.02),-50);},
  post(){tone(880,.35,'triangle',.3,-300);tone(1320,.25,'sine',.15,-500);burst(.05,.2,3000);},
  net(){burst(.45,.28,700);},
  whistle(long){const n=long?3:1;for(let i=0;i<n;i++){tone(2850,.42,'square',.07,40,i*.5);tone(3000,.42,'sine',.1,0,i*.5);}},
  tackle(){burst(.16,.3,500);tone(90,.12,'sine',.25,-40);},
  card(){tone(660,.12,'triangle',.15);tone(990,.18,'triangle',.15,0,.1);},
  cheer(a){S.excite=Math.min(.8,a);},
  save(){burst(.12,.22,900);tone(200,.1,'sine',.2,-60);},
  menu(){tone(520,.06,'square',.06);},
  ok(){tone(780,.1,'square',.07);tone(1040,.14,'square',.07,0,.07);}
};

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  keys[e.code]=true;initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('pointerdown',()=>initAudio());
const KB={up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],
  pass:['KeyJ'],through:['KeyK'],lob:['KeyL'],shoot:['Space','KeyI'],sprint:['ShiftLeft','ShiftRight'],
  sw:['KeyQ','KeyE'],ok:['Enter'],back:['Escape','Backspace'],pause:['KeyP'],zoom:['KeyZ']};
let prevHeld={};
function pollInput(){
  const h={};for(const k in KB)h[k]=KB[k].some(c=>keys[c]);
  let mx=(h.right?1:0)-(h.left?1:0),mz=(h.down?1:0)-(h.up?1:0);
  let gp=null;
  try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const g of pads){if(g&&g.connected){gp=g;break;}}}catch(e){}
  if(gp){
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0,b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    if(Math.hypot(ax,ay)>.2){mx+=ax;mz+=ay;}
    if(b(12))mz-=1;if(b(13))mz+=1;if(b(14))mx-=1;if(b(15))mx+=1;
    h.pass=h.pass||b(0);h.lob=h.lob||b(1);h.shoot=h.shoot||b(2);h.through=h.through||b(3);
    h.sw=h.sw||b(4);h.sprint=h.sprint||b(5)||b(7);h.ok=h.ok||b(0)||b(9);h.back=h.back||b(1);h.pause=h.pause||b(9);h.zoom=h.zoom||b(11);
    h.up=h.up||b(12)||ay<-.55;h.down=h.down||b(13)||ay>.55;h.left=h.left||b(14)||ax<-.55;h.right=h.right||b(15)||ax>.55;
  }
  const m=Math.hypot(mx,mz);if(m>1){mx/=m;mz/=m;}
  const IN={mx,mz,h,e:{},r:{}};
  for(const k in h){IN.e[k]=h[k]&&!prevHeld[k];IN.r[k]=!h[k]&&!!prevHeld[k];}
  prevHeld=h;return IN;
}

/* ---------- scene ---------- */
let renderer,scene,camera,ballMesh,activeRing,activeArrow,targetRing;
const cam={x:0,y:23,z:38,lx:0,lz:0,mode:'broadcast',zoom:1};
function initScene(){
  renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c1426);
  scene.fog=new THREE.Fog(0x0c1426,110,230);
  camera=new THREE.PerspectiveCamera(38,1,.5,400);
  scene.add(new THREE.HemisphereLight(0xcfdcff,0x1d3a1d,.95));
  const sun=new THREE.DirectionalLight(0xfff4e0,.7);sun.position.set(-30,60,40);scene.add(sun);
  buildPitch();buildStadium();buildGoals();
  const bt=document.createElement('canvas');bt.width=128;bt.height=64;const g=bt.getContext('2d');
  g.fillStyle='#f5f5f5';g.fillRect(0,0,128,64);g.fillStyle='#16181d';
  for(let i=0;i<14;i++){g.beginPath();const x=(i%7)*19+8,y=i<7?18:46;for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;g.lineTo(x+Math.cos(a)*8,y+Math.sin(a)*8);}g.fill();}
  const btex=new THREE.CanvasTexture(bt);
  ballMesh=new THREE.Mesh(new THREE.SphereGeometry(.34,20,14),new THREE.MeshStandardMaterial({map:btex,roughness:.5}));
  scene.add(ballMesh);
  const bsh=new THREE.Mesh(new THREE.CircleGeometry(.4,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.4}));
  bsh.rotation.x=-Math.PI/2;bsh.position.y=.04;scene.add(bsh);ballMesh.userData.shadow=bsh;
  activeRing=new THREE.Mesh(new THREE.RingGeometry(.85,1.05,28),new THREE.MeshBasicMaterial({color:0xffd24d,side:THREE.DoubleSide,transparent:true,opacity:.95}));
  activeRing.rotation.x=-Math.PI/2;activeRing.position.y=.06;scene.add(activeRing);
  activeArrow=new THREE.Mesh(new THREE.ConeGeometry(.38,.8,4),new THREE.MeshBasicMaterial({color:0xffd24d}));
  activeArrow.rotation.x=Math.PI;scene.add(activeArrow);
  targetRing=new THREE.Mesh(new THREE.RingGeometry(.7,.88,24),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:.85}));
  targetRing.rotation.x=-Math.PI/2;targetRing.position.y=.07;targetRing.visible=false;scene.add(targetRing);
  onResize();addEventListener('resize',onResize);
}
function onResize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function buildPitch(){
  const PX=16,W=125,H=86,cv=document.createElement('canvas');cv.width=W*PX;cv.height=H*PX;const g=cv.getContext('2d');
  const X=x=>(x+W/2)*PX,Y=z=>(z+H/2)*PX;
  for(let i=0;i<14;i++){g.fillStyle=i%2?'#2f7d32':'#348a37';g.fillRect(i*W*PX/14,0,W*PX/14+1,H*PX);}
  g.strokeStyle='#f2f6f2';g.lineWidth=.13*PX;g.fillStyle='#f2f6f2';
  const rect=(x1,z1,x2,z2)=>g.strokeRect(X(x1),Y(z1),(x2-x1)*PX,(z2-z1)*PX);
  rect(-HL,-HW,HL,HW);
  g.beginPath();g.moveTo(X(0),Y(-HW));g.lineTo(X(0),Y(HW));g.stroke();
  g.beginPath();g.arc(X(0),Y(0),9.15*PX,0,7);g.stroke();
  g.beginPath();g.arc(X(0),Y(0),.3*PX,0,7);g.fill();
  for(const s of[-1,1]){
    rect(s>0?HL-16.5:-HL,-20.16,s>0?HL:-HL+16.5,20.16);
    rect(s>0?HL-5.5:-HL,-9.16,s>0?HL:-HL+5.5,9.16);
    g.beginPath();g.arc(X(s*(HL-11)),Y(0),.3*PX,0,7);g.fill();
    g.beginPath();g.arc(X(s*(HL-11)),Y(0),9.15*PX,s>0?Math.PI-.93:-.93,s>0?Math.PI+.93:.93);g.stroke();
  }
  for(const sx of[-1,1])for(const sz of[-1,1]){g.beginPath();g.arc(X(sx*HL),Y(sz*HW),PX,0,7);g.stroke();}
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshLambertMaterial({map:tex}));
  m.rotation.x=-Math.PI/2;scene.add(m);
  const out=new THREE.Mesh(new THREE.PlaneGeometry(400,300),new THREE.MeshLambertMaterial({color:0x143018}));
  out.rotation.x=-Math.PI/2;out.position.y=-.05;scene.add(out);
}
function crowdTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#1a2038';g.fillRect(0,0,512,128);
  const cols=['#d32f2f','#f5f5f5','#4fc3f7','#ffd600','#2e7d32','#6a1b9a','#ff6d00','#263238','#e0e0e0'];
  for(let i=0;i<2600;i++){g.fillStyle=cols[(Math.random()*cols.length)|0];g.fillRect(Math.random()*512,Math.random()*128,2.2,3);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function adTexture(txt){
  const c=document.createElement('canvas');c.width=512;c.height=32;const g=c.getContext('2d');
  g.fillStyle='#0b1328';g.fillRect(0,0,512,32);g.fillStyle='#ffd24d';g.font='bold 20px Arial';g.textAlign='center';g.fillText(txt,256,23);
  const t=new THREE.CanvasTexture(c);return t;
}
function buildStadium(){
  const ct=crowdTexture();
  const mkStand=(w,h,x,y,z,ry)=>{
    const grp=new THREE.Group();grp.position.set(x,y,z);grp.rotation.y=ry;
    const t=ct.clone();t.needsUpdate=true;t.repeat.set(w/20,h/12);
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,color:0xb0b8d0}));
    pl.rotation.x=-.62;grp.add(pl);scene.add(grp);
  };
  mkStand(150,26,0,12,-HW-17,0);
  mkStand(90,22,HL+19,10,0,-Math.PI/2);
  mkStand(90,22,-HL-19,10,0,Math.PI/2);
  const ads=['MATCHDAY','ARCADE LEAGUE','NORTHGATE ENERGY','HARBOR BANK','VALDORA AIR','SOL TELECOM'];
  const mkAd=(w,x,z,ry,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,1,.3),new THREE.MeshBasicMaterial({map:adTexture(ads[i%ads.length]+'   •   '+ads[(i+2)%ads.length])}));m.position.set(x,.5,z);m.rotation.y=ry;scene.add(m);};
  for(let i=0;i<5;i++){mkAd(22,-44+i*22,-HW-3.5,0,i);mkAd(22,-44+i*22,HW+3.5,0,i+1);}
  for(let i=0;i<3;i++){mkAd(22,HL+4,-22+i*22,Math.PI/2,i);mkAd(22,-HL-4,-22+i*22,Math.PI/2,i+1);}
  const tw=new THREE.MeshBasicMaterial({color:0xfff6d8});
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,34,6),new THREE.MeshLambertMaterial({color:0x2a3040}));pole.position.set(sx*(HL+12),17,sz*(HW+10));scene.add(pole);

function poss(){return ball.owner?ball.owner.team:-1;}
function basePos(p,ko){

function nearestOpp(x,z,team){let b=99,q=null;for(const o of TM[1-team].players){if(o.out)continue;const d=hyp(o.x-x,o.z-z);if(d<b){b=d;q=o;}}return{d:b,p:q};}
/* ---------- ball physics ---------- */
const _q=new THREE.Quaternion(),_ax=new THREE.Vector3();
function stepBall(dt){

      if(d<BR+.08&&b.y<GH+.1){const nx=dx/(d||1),nz=dz/(d||1),vn=b.vx*nx+b.vz*nz;if(vn<0){b.vx-=1.55*vn*nx;b.vz-=1.55*vn*nz;b.x=gx+nx*(BR+.09);b.z=pz+nz*(BR+.09);if(-vn>4)SND.post();b.hit=1;}}}
    if(Math.abs(b.z)<GW+.1&&Math.abs(b.x-gx)<BR+.1){const dx=b.x-gx,dy=b.y-GH,d=hyp(dx,dy);
      if(d<BR+.08){const nx=dx/(d||1),ny=dy/(d||1),vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.55*vn*nx;b.vy-=1.55*vn*ny;b.x=gx+nx*(BR+.09);b.y=GH+ny*(BR+.09);if(-vn>3)SND.post();b.hit=1;}}}

  }
  // visual
  ballMesh.position.set(b.x,b.y,b.z);
  const sp=hyp(b.vx,b.vz);if(sp>.05&&b.y<BR+.2){_ax.set(b.vz,0,-b.vx).normalize();_q.setFromAxisAngle(_ax,sp*dt/.34);ballMesh.quaternion.premultiply(_q);}

}
function carryBall(dt){

  p.touchPh+=dt*(.9+sp*.28);
  const thr=S.mode==='setpiece'&&S.sp&&S.sp.type==='throw'&&S.sp.taker===p,hold=p.gk&&p.diveT<=0;

  if(sp>7.2&&Math.floor(p.touchPh)>Math.floor(prev)&&Math.random()<.012+.025*(1-TM[p.team].sk)&&S.mode==='play'){
    ball.owner=null;b.vx=p.vx*1.3+Math.cos(p.face)*2;b.vz=p.vz*1.3+Math.sin(p.face)*2;p.noTouch=.3;
  }

function accOf(p){return p.team?DIFFS[CFG.diff].acc*(.85+.2*TM[1].sk):.9+.08*TM[0].sk;}
function kickBall(p,dx,dz,speed,vy,spin,passInfo){

  p.noTouch=.35;p.kickT=.22;ball.last=p;ball.lastTeam=p.team;ball.shot++;ball.hit=0;

function markOffside(p){
  const d=TM[p.team].dir,xs=TM[1-p.team].players.filter(q=>!q.out).map(q=>q.x*d).sort((a,b)=>b-a);
  const line=Math.max(xs[1]!==undefined?xs[1]:0,ball.x*d,0),set=new Set();
  for(const q of TM[p.team].players)if(q!==p&&!q.out&&q.x*d>line+.4)set.add(q);

function pickTarget(p,dx,dz,kind){
  const T=TM[p.team],d=T.dir;let best=null,bs=-1e9;
  const dn=hyp(dx,dz),hasDir=dn>.3;if(hasDir){dx/=dn;dz/=dn;}
  for(const q of T.players){
    if(q===p||q.out)continue;const vx=q.x-p.x,vz=q.z-p.z,dist=hyp(vx,vz);if(dist<2)continue;

function passBall(p,q,kind){
  if(!q)return;
  const acc=accOf(p),op=nearestOpp(p.x,p.z,p.team).d;
  let tx=q.x,tz=q.z,dist=hyp(tx-p.x,tz-p.z);
  const d=TM[p.team].dir;
  if(kind==='through'){tx=q.x+q.vx*1.0+d*7;tz=q.z+q.vz*.8;}
  else if(kind==='short'){const t=dist/Math.max(10,7+dist*.9);tx+=q.vx*t*.8;tz+=q.vz*t*.8;}
  tx=clamp(tx,-HL+1,HL-1);tz=clamp(tz,-HW+1,HW-1);dist=hyp(tx-p.x,tz-p.z);
  let ang=Math.atan2(tz-p.z,tx-p.x)+(Math.random()-.5)*2*((1-acc)*.32+(op<2.5?(2.5-op)*.03:0));
  let sp,vy=0;

  else if(kind==='through'){sp=clamp(9+dist*.95,12,28);}
  else{sp=clamp(6.5+dist*.75,8.5,22);}
  if(S.mode==='setpiece'&&S.sp.type==='throw'){sp=clamp(8+dist*.5,9,15);vy=clamp(dist*.18,3,6);}
  S.st[p.team].pass++;
  kickBall(p,Math.cos(ang),Math.sin(ang),sp*(1+(Math.random()-.5)*(1-acc)*.1),vy,0,{off:true});
  q.rx=tx;q.rz=tz;q.rT=Math.min(3,dist/Math.max(8,sp)+1.2);

}
function shootBall(p,charge,aimZ,finesse){
  const d=TM[p.team].dir,gx=d*HL,acc=accOf(p),op=nearestOpp(p.x,p.z,p.team).d;
  charge=clamp(charge,.12,1);
  const tz=clamp(aimZ,-GW+.6,GW-.6);

  const dG0=hyp(gx-p.x,tz-p.z);

/* ---------- tackling / fouls / cards ---------- */
function doTackle(p,slide){
  if(p.tackleCD>0||(p.st!=='idle'&&p.st!=='stumble'))return false;
  p.tackleCD=slide?1.5:.9;
  const fx=Math.cos(p.face),fz=Math.sin(p.face);
  if(slide){p.st='slide';p.stT=.6;p.vx=fx*9.5;p.vz=fz*9.5;}else{p.st='lunge';p.stT=.28;p.vx+=fx*3.2;p.vz+=fz*3.2;}

  for(const q of TM[1-p.team].players){if(q.out||q.st==='down')continue;const dx=q.x-p.x,dz=q.z-p.z,d=hyp(dx,dz);
    if(d<reach&&(dx*fx+dz*fz)/(d||1)>.2&&d<bd){bd=d;victim=q;}}
  if(victim){
    const carrying=ball.owner===victim,vfx=Math.cos(victim.face),vfz=Math.sin(victim.face);
    const behind=((p.x-victim.x)*vfx+(p.z-victim.z)*vfz)<-.25;
    let foulP=(behind?.55:.09)+(slide?.14:0)+(carrying?0:.3)-TM[p.team].sk*.05;

    if(!carrying&&hasBallNear)foulP-=.18;
    if(Math.random()<foulP){victim.st='down';victim.stT=1.5;victim.vx=victim.vz=0;SND.tackle();callFoul(p,victim,behind,slide);return true;}
    if(carrying&&Math.random()<(slide?.5:.56)*(.8+.4*TM[p.team].sk)/(.8+.4*TM[victim.team].sk)){
      ball.owner=null;ball.vx=fx*7+rnd(-1,1);ball.vz=fz*7+rnd(-1,1);ball.last=p;ball.lastTeam=p.team;victim.st='stumble';victim.stT=.8;victim.noTouch=.5;p.noTouch=0;ball.off=null;SND.tackle();
    }else SND.tackle();
  }else if(slide){
    const dx=ball.x-p.x,dz=ball.z-p.z,d=hyp(dx,dz);
    if(!ball.owner&&d<2.6&&ball.y<1){ball.vx=fx*10;ball.vz=fz*10;ball.last=p;ball.lastTeam=p.team;SND.tackle();}
  }

}
function insideBox(team,x,z){const x0=-TM[team].dir*HL;return Math.abs(x-x0)<16.5&&Math.abs(z)<20.16;}
function callFoul(off,vic,behind,slide){
  if(S.mode!=='play')return;
  SND.whistle();S.st[off.team].fouls++;
  const r=Math.random();let card=null;
  if(r<(behind||slide?.5:.2))card='y';
  if(!off.gk&&r<(behind?.07:.015))card='r';
  if(card==='y'){off.yc++;S.st[off.team].yc++;if(off.yc>=2&&!off.gk)card='r';}
  S.mode='foul';S.mt=0;S.pending={team:vic.team,x:vic.x,z:vic.z,off,card,kind:'foul'};
  ball.owner=null;ball.vx=ball.vy=ball.vz=0;ball.y=BR;
  banner('FOUL','#'+off.num+' '+off.name.toUpperCase(),'#fff',1.4);
  if(card){setTimeout(()=>{SND.card();banner(card==='y'?'YELLOW CARD':'RED CARD','#'+off.num+' '+off.name.toUpperCase(),card==='y'?'#ffd600':'#ff3b3b',1.6);},650);}
}
function sendOff(p){

}
function callOffside(p){

function resolvePending(){

  if(pd.card){const o=pd.off;if(pd.card==='r'){sendOff(o);}}

/* ---------- set pieces ---------- */
function setPiece(type,team,x,z){
  if(S.endPending){endHalf();return;}
  const T=TM[team],d=T.dir;
  if(type==='throw'){z=Math.sign(z||1)*HW;x=clamp(x,-HL+2,HL-2);}
  if(type==='goalkick'){x=-d*(HL-5.5);z=0;}
  if(type==='gkhold'){x=clamp(x,-HL+1.5,HL-1.5);z=clamp(z,-GW*2,GW*2);}
  if(type==='corner'){x=Math.sign(x)*HL;z=Math.sign(z||1)*HW;S.st[team].corners++;}
  if(type==='free'){x=clamp(x,-HL+1,HL-1);z=clamp(z,-HW+1,HW-1);}
  let taker=null;
  if(type==='goalkick'||type==='gkhold')taker=T.players.find(p=>p.gk&&!p.out)||T.players.find(p=>!p.out);
  else{let bd=1e9;for(const p of T.players){if(p.out||p.gk)continue;let dd=hyp(p.x-x,p.z-z);if(type==='corner')dd+=(Math.abs(p.fy)>.6?0:12);if(dd<bd){bd=dd;taker=p;}}}

  S.mode='setpiece';S.mt=0;S.sp={type,team,taker,x,z,face,wait:rnd(1.4,2.4)};
  if(type==='free'||type==='corner'){SND.whistle();}

  snapCameraSoft();

function setupWall(team,x,z){
  const d=TM[team].dir,gx=d*HL,dist=hyp(gx-x,z);

  if(gk){gk.x=d*HL-d*.6;gk.z=0;gk.vx=gk.vz=0;gk.face=d>0?Math.PI:0;gk.st='idle';gk.saved=-1;}

/* ---------- ownership, goals, bounds ---------- */
function updateOwnership(dt){

      if(q.out||q.st==='down'||q.st==='slide'||q.noTouch>0)continue;
      const d=hyp(q.x-b.x,q.z-b.z);
      if(d<1.05&&!o.gk){
        const rate=.5*(.75+.5*TM[q.team].sk)/(.75+.5*TM[o.team].sk)*(hyp(o.vx,o.vz)>6?.85:1)*(q.team?DIFFS[CFG.diff].react:1);
        if(Math.random()<rate*dt){
          const front=Math.cos(q.face)*(b.x-q.x)+Math.sin(q.face)*(b.z-q.z)>0;
          if(front&&Math.random()<.75){takeOwner(q);}

  }

  }

    b.vx*=.4+rnd(0,.2);b.vz*=.4+rnd(-.2,.2);b.vy=Math.abs(b.vy)*.3+1;best.noTouch=.25;b.last=best;b.lastTeam=best.team;if(best.team!==(ball.off&&ball.off.team))ball.off=null;SND.kick(.2);return;

function takeOwner(p){

function scoreGoal(s){

/* ---------- players update ---------- */
function humanOn(){return S.mode==='play'||S.mode==='kickoff'||S.mode==='setpiece'||S.mode==='penalty';}
function updatePlayers(dt){

  for(const p of P){
    if(p.out)continue;
    p.noTouch-=dt;p.tackleCD-=dt;p.kickT-=dt;p.stT-=dt;p.rT-=dt;p.diveT-=dt;
    if(frozen){p.vx*=.8;p.vz*=.8;if(p.st==='down'&&p.stT<=0&&S.mode!=='foul')p.st='idle';continue;}
    if(p.st==='down'){p.vx*=.9;p.vz*=.9;if(p.stT<=0)p.st='idle';p.x+=p.vx*dt;p.z+=p.vz*dt;continue;}

    if(p.st==='stumble'&&p.stT<=0)p.st='idle';

}
function moveP(p,c,dt){

/* ---------- human control ---------- */
function humanControl(p,dt){

function execSet(p,t,kind,charge,aim){

function switchPlayer(){

function autoSwitch(dt){

/* ---------- team prep (per frame) ---------- */
function teamPrep(){
  for(const T of TM){
    const d=T.dir;let a=null,b=null,da=1e9,db=1e9;
    const tx=ball.owner?ball.owner.x:ball.x+ball.vx*.35,tz=ball.owner?ball.owner.z:ball.z+ball.vz*.35;
    for(const p of T.players){
      if(p.out||p.gk||p.st==='down'||(T.idx===0&&p===S.active&&humanOn()))continue;
      const dd=hyp(p.x-tx,p.z-tz);if(dd<da){b=a;db=da;a=p;da=dd;}else if(dd<db){b=p;db=dd;}
    }
    T.chaser=a;T.second=b;T.cd=da;
    const xs=TM[1-T.idx].players.filter(q=>!q.out).map(q=>q.x*d).sort((m,n)=>n-m);
    T.line=xs[1]!==undefined?xs[1]:0;
    // marking assignments
    T.marks=new Map();
    const defs=T.players.filter(p=>!p.out&&!p.gk&&p!==T.chaser&&p!==T.second&&p.fx<.65);
    const taken=new Set();
    const att=TM[1-T.idx].players.filter(q=>!q.out&&!q.gk&&q!==ball.owner).sort((m,n)=>(n.x*-d)-(m.x*-d));
    for(const o of att){
      let bq=null,bd=15;for(const p of defs){if(taken.has(p))continue;const dd=hyp(p.x-o.x,p.z-o.z);if(dd<bd){bd=dd;bq=p;}}
      if(bq){taken.add(bq);T.marks.set(bq,o);}
    }
  }
}
function aiControl(p,dt){

function aiOnBall(p,c,dt,go){
  const T=TM[p.team],d=T.dir,gx=d*HL,dg=hyp(gx-p.x,p.z),op=nearestOpp(p.x,p.z,p.team),react=p.team?DIFFS[CFG.diff].react:1,sk=T.sk;
  // dribble vector
  let ax=d*1,az=-p.z*.035;
  for(const o of TM[1-p.team].players){if(o.out)continue;const ox=p.x-o.x,oz=p.z-o.z,dd=hyp(ox,oz);if(dd<7&&dd>.1){const w=(7-dd)/7;ax+=ox/dd*w*1.5;az+=oz/dd*w*1.5;}}
  const al=hyp(ax,az)||1;c.dx=ax/al;c.dz=az/al;c.mag=1;c.sprint=op.d>4||p.x*d>HL-30;
  p.aiT-=dt;p.ob=(p.ob||0)+dt;
  if(p.aiT>0)return c;
  p.aiT=rnd(.2,.42)/react;
  const gk=TM[1-p.team].players[0],pressed=op.d<2.4||(op.d<3.4&&p.ob>1.3);
  if(dg<26&&Math.abs(p.z)<24&&p.x*d>HL-28){
    const pr=(dg<12?.7:dg<18?.45:.2)*(.65+.6*sk)*(pressed?1.15:1);
    if(Math.random()<pr){
      const side=gk&&!gk.out?-Math.sign(gk.z||(Math.random()-.5)):(Math.random()<.5?-1:1);
      shootBall(p,rnd(.62,.95),side*rnd(1.7,3),dg<22&&Math.random()<.3);return c;
    }
  }
  // crossing
  if(Math.abs(p.z)>HW-15&&p.x*d>HL-26&&Math.random()<.5){
    let tq=null,bs=-1;for(const q of T.players){if(q===p||q.out||q.gk)continue;if(q.x*d>HL-18&&Math.abs(q.z)<14){const s=10-nearestOpp(q.x,q.z,p.team).d*.0+(q.fx>.6?2:0)+Math.random()*3;if(s>bs){bs=s;tq=q;}}}
    if(tq){passBall(p,tq,'lob');return c;}
  }
  if(pressed||(p.ob>1&&Math.random()<.12)||(p.x*d<-HL*.45&&op.d<5)){
    const ch=aiPassChoice(p,pressed);
    if(ch.q&&(ch.s>-2.5||(pressed&&ch.s>-8))){
      const q=ch.q,dist=hyp(q.x-p.x,q.z-p.z),ahead=(q.x-p.x)*d;
      const kind=dist>30?'lob':(ahead>12&&q.fx>.5&&!laneBlocked(p,q)&&Math.random()<.4?'through':'short');

    }
    if(pressed&&p.x*d<-HL*.4){ // clearance
      const tq=T.players.filter(q=>!q.out&&!q.gk&&q!==p).sort((m,n)=>n.fx-m.fx)[0];if(tq)passBall(p,tq,'lob');
    }
  }
  return c;
}
/* ---------- goalkeeper ---------- */
function keeperPredict(gk){
  const d=TM[gk.team].dir,gx=-d*HL,b=ball;
  if(b.owner||b.vx*(-d)<4||b.lastTeam===gk.team)return null;
  const tG=(gx-b.x)/b.vx;if(tG<=0||tG>1.5)return null;
  return{tG,zp:b.z+b.vz*tG,yp:Math.max(.2,b.y+b.vy*tG-.5*GRAV*tG*tG),sp:hyp(b.vx,b.vz)};
}
function aiKeeper(p,c,go,dt){
  const T=TM[p.team],d=T.dir,gx=-d*HL;
  if(ball.owner===p){ // holding after a back-pass
    p.hold-=dt;c.mag=0;if(p.hold<=0){const op=nearestOpp(p.x,p.z,p.team).d,tq=pickTarget(p,d,0,op<8?'lob':'short');if(tq)passBall(p,tq,op<8?'lob':'short');else kickBall(p,d,0,20,7,0,null);}
    return c;
  }
  const pr=keeperPredict(p);
  if(pr&&Math.abs(pr.zp)<GW+3&&pr.yp<GH+1.3){
    if(p.errShot!==ball.shot){p.errShot=ball.shot;p.err=(Math.random()-.5)*2*(1-(p.team?DIFFS[CFG.diff].gk:.62))*2.4;}
    let tz=clamp(pr.zp+p.err,-GW-.6,GW+.6);if(S.lastSet==='penalty')tz=S.guess*2.5;
    p.x+=(gx+d*1.2-p.x)*Math.min(1,dt*6);
    if(Math.abs(tz-p.z)>.6){c.dx=0;c.dz=Math.sign(tz-p.z);c.mag=1;c.sprint=true;
      if(pr.tG<.6&&Math.abs(tz-p.z)>1.1&&p.diveT<=0&&p.saved!==ball.shot){p.diveT=.55;p.diveDir=Math.sign(tz-p.z);}}
    return c;
  }
  // loose ball inside own box / just outside: claim it if nearest
  const bd=hyp(ball.x-p.x,ball.z-p.z),inBox=insideBox(p.team,ball.x,ball.z);
  if(!ball.owner&&inBox&&hyp(ball.vx,ball.vz)<9&&bd<14&&T.cd>bd-1){go(ball.x,ball.z,1,true);return c;}
  const bg=hyp(ball.x-gx,ball.z),adv=poss()===p.team&&Math.abs(ball.x-gx)>45?clamp((bg-34)*.15,0,5):0;
  const ang=Math.atan2(ball.z,Math.abs(ball.x-gx)+2);
  go(gx+d*(1.4+adv+clamp(8/(bg+1)*3,0,1.4)),clamp(Math.tan(ang)*3.2,-GW+.5,GW-.5),.9,false);
  c.look=Math.atan2(ball.z-p.z,ball.x-p.x);
  return c;
}
function keeperLogic(){
  if(S.mode!=='play')return;
  for(const T of TM){
    const gk=T.players[0];if(gk.out)continue;
    const pr=keeperPredict(gk);if(!pr||gk.saved===ball.shot||pr.tG>.075)continue;
    gk.saved=ball.shot;
    const onTarget=Math.abs(pr.zp)<GW-.05&&pr.yp<GH-.05;if(!onTarget)continue;
    const d=T.dir,skill=T.idx?DIFFS[CFG.diff].gk*(.9+.2*T.sk):.74+.14*T.sk;
    const dz=Math.abs(gk.z-pr.zp),reach=gk.diveT>0?3.1:1.5;
    let ch=skill*(1-clamp((pr.sp-16)/60,0,.5));
    ch*=dz<reach?1-dz/reach*.5:0;
    if(pr.yp>1.9)ch*=.65;if(Math.abs(pr.zp)>GW-.8)ch*=.75;
    if(Math.random()<ch){
      const gx=-d*HL;ball.last=gk;ball.lastTeam=gk.team;ball.hit=2;SND.save();
      ball.x=gx+d*.9;ball.z=clamp(pr.zp,-GW,GW);ball.y=Math.max(ball.y,.4);
      if(pr.sp<17&&pr.yp<1.7&&Math.random()<.6){ball.vx=ball.vz=ball.vy=0;takeOwner(gk);lower('SAVED!',1.5);}
      else{ball.vx=d*rnd(3,8);ball.vz=(Math.random()<.5?-1:1)*rnd(3,8);ball.vy=rnd(2,5);lower('GREAT SAVE',1.6);}
    }
  }
}
/* ---------- set-piece AI ---------- */
function aiSetPiece(p,c,go,dt){
  const sp=S.sp,T=TM[p.team],d=T.dir;
  if(!sp)return c;
  if(p===sp.taker){
    c.mag=0;sp.wait-=dt;
    if(sp.wait<=0)aiExecSet(p,sp);
    return c;
  }
  if(sp.type==='penalty'){if(p.gk&&p.team!==sp.team){go(d*-HL+d*.6,0,.5,false);c.mag=0;}return c;}
  if(sp.type==='kickoff'){c.mag=0;return c;}
  if(p.gk){if(sp.type==='corner'&&p.team!==sp.team)go(-d*HL+d*1.3,sp.z>0?1.5:-1.5,.8,false);else{const b=basePos(p,false);go(b.x,b.z,.6,false);}return c;}
  const atk=p.team===sp.team;
  if(sp.type==='corner'){
    const k=T.players.filter(q=>!q.out&&!q.gk&&q!==sp.taker).indexOf(p);
    const zs=[-6,0,6,-3,3,9,-9,0,5,-5];
    if(atk){if(k<6)go(Math.sign(sp.x)*(HL-6-(k%3)*2.6),zs[k],1,true);else{const b=basePos(p,false);go(b.x,b.z,.8,false);}}
    else{go((sp.x>0?1:-1)*(HL-4-(k%3)*2.6),zs[(k+3)%zs.length]*.9,1,true);}
    return c;
  }
  if(sp.type==='free'){
    if(p.wall){go(p.wall.x,p.wall.z,1,true);return c;}
    const near=hyp(sp.x-TM[sp.team].dir*HL,sp.z)<32;
    if(atk&&near&&p.fx>.55){const k=p.idx;go(d*(HL-14-(k%3)*3),((k%4)-1.5)*6,.9,false);return c;}
  }
  const b=basePos(p,false);go(b.x,b.z,.85,hyp(b.x-p.x,b.z-p.z)>10);
  if(sp.type==='throw'&&atk){const dd=hyp(sp.x-p.x,sp.z-p.z);if(dd<14&&p.fx>.2){const a=(p.idx*1.7)%3.1-1.5;go(sp.x+Math.cos(a)*9*(sp.z>0?1:1),sp.z+(sp.z>0?-1:1)*Math.abs(Math.sin(a))*10-(sp.z>0?4:-4),.9,true);}}
  return c;
}
function aiExecSet(p,sp){
  const T=TM[p.team],d=T.dir,type=sp.type;
  if(type==='kickoff'){const q=T.players.filter(o=>!o.out&&!o.gk&&o!==p).sort((a,b)=>hyp(a.x-p.x,a.z-p.z)-hyp(b.x-p.x,b.z-p.z))[0];passBall(p,q,'short');return;}
  if(type==='penalty'){shootBall(p,rnd(.72,.92),(Math.random()<.5?-1:1)*rnd(1.6,3.1),false);return;}
  if(type==='corner'){
    let tq=null,bs=-1;for(const q of T.players){if(q===p||q.out||q.gk)continue;if(Math.abs(q.x)>HL-20&&Math.abs(q.z)<12){const s=Math.random()*4+(q.fx>.6?2:0);if(s>bs){bs=s;tq=q;}}}
    if(tq)passBall(p,tq,'lob');else kickBall(p,d*(HL-10)-p.x,rnd(-4,4)-p.z,19,7,0,null);return;
  }
  if(type==='free'){
    if(hyp(d*HL-p.x,p.z)<30&&Math.random()<.7){shootBall(p,rnd(.7,.95),rnd(-2.8,2.8),true);return;}
    const ch=aiPassChoice(p,false);if(ch.q){passBall(p,ch.q,hyp(ch.q.x-p.x,ch.q.z-p.z)>26?'lob':'short');return;}
  }
  if(type==='goalkick'||type==='gkhold'){
    const tq=pickTarget(p,d,0,'lob')||pickTarget(p,d,0,'short');if(tq){passBall(p,tq,type==='goalkick'||Math.random()<.5?'lob':'short');return;}
  }
  const ch=aiPassChoice(p,false);
  if(ch.q)passBall(p,ch.q,'short');else kickBall(p,d,0,16,3,0,null);
}

  const run=!['menu','ht','ft'].includes(S.mode);
  if(!run)return;
  $('clk').textContent=gameClockText()+(S.endPending?' +':'');
  $('half').textContent=(S.half===1?'1ST HALF':'2ND HALF')+(S.mode==='replay'?'':(S.mode==='play'?'':''));
  drawRadar();
  const a=S.active,show=a&&!a.out&&(S.mode==='play'||S.mode==='setpiece'||S.mode==='kickoff'||S.mode==='penalty');
  activeRing.visible=activeArrow.visible=!!show;
  if(show){activeRing.position.set(a.x,.06,a.z);activeArrow.position.set(a.x,3.3+Math.sin(S.t*6)*.15,a.z);
    $('pname').style.display='block';$('pname').textContent=a.num+' \u00b7 '+a.name.toUpperCase();
    $('stam').style.display='block';$('stam').firstChild.style.width=(a.stam*100)+'%';}
  else{$('stam').style.display='none';$('pname').style.display='none';}
  const tg=show&&S.tgt&&(ball.owner===a);targetRing.visible=!!tg;if(tg)targetRing.position.set(S.tgt.x,.07,S.tgt.z);
  $('power').style.display=S.charging?'block':'none';if(S.charging)$('power').firstChild.style.width=(S.charge*100)+'%';
  $('hint').style.display=(S.mode==='play'||S.mode==='setpiece')?'block':'none';
}
/* ---------- main loop ---------- */
function stepAll(dt){
  S.t+=dt;
  const m=S.mode;
  if(m==='replay'){replayStep(dt);return;}
  if(m==='menu'||m==='ht'||m==='ft')return;
  teamPrep();updateModeLogic(dt);
  if(S.mode==='ht'||S.mode==='ft')return;
  if(S.mode==='goal'&&S.rpGrab>0){S.rpGrab-=dt;if(S.rpGrab<=0)S.rpFrames=S.rec.slice(-165);}
  autoSwitch(dt);updatePlayers(dt);stepBall(dt);
  if(S.mode==='play'){updateOwnership(dt);keeperLogic();checkBounds();}
  recordFrame(dt);
}
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.06,(now-lastT)/1000||.016);lastT=now;
  const IN=pollInput();S.IN=IN;
  if(menu.screen!=='none')menuInput(IN);
  else if(IN.e.pause&&S.mode!=='replay')togglePause();
  if(IN.e.zoom&&menu.screen==='none')cam.zoom=(cam.zoom+1)%3;
  if(!S.paused){
    const n=Math.max(1,Math.ceil(dt/.018)),sub=dt/n;
    for(let i=0;i<n;i++){
      stepAll(sub);
      if(i===0&&S.IN){S.IN={mx:IN.mx,mz:IN.mz,h:IN.h,e:{},r:{}};}
    }
  }
  for(const p of P)if(!p.out)animPlayer(p,dt);
  if(S.mode==='menu'||S.mode==='ht'||S.mode==='ft'){
    const t=S.t*.12;S.t+=dt;cam.x=Math.sin(t)*34;cam.z=Math.cos(t)*34;camera.position.set(cam.x,16,cam.z);camera.lookAt(0,1,0);
  }else updateCamera(dt);
  hudFrame(dt);
  if(AC&&crowdGain){
    S.excite=Math.max(0,(S.excite||0)-dt*.22);
    const base=.2+.12*clamp((Math.abs(ball.x)-25)/27,0,1),tg=base+S.excite;
    crowdGain.gain.value+=(tg-crowdGain.gain.value)*Math.min(1,dt*3);crowdFilter.frequency.value=420+tg*700;
  }
  renderer.render(scene,camera);
}
function boot(){
  if(typeof THREE==='undefined'){setOv('<div class="panel"><h2 class="t">Could not load 3D engine</h2><div class="foot">CHECK YOUR CONNECTION AND REFRESH</div></div>');return;}
  initScene();buildTeams();S.st=newStats();S.kickTeam=0;setupKickoff(0);S.mode='menu';
  $('ov').addEventListener('pointerdown',()=>{initAudio();if(menu.screen==='title'){SND.ok();gotoMenu('setup');}});
  renderMenu();requestAnimationFrame(frame);
}
boot();
</script>
