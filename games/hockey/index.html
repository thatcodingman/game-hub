<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hockey — Puck Physics Prototype</title>
<style>
  html, body { margin:0; padding:0; background:#0a0e14; overflow:hidden; height:100%; }
  #ui {
    position:fixed; top:10px; left:10px; z-index:10;
    font-family: -apple-system, system-ui, sans-serif;
    color:#dfe7f0; background:rgba(10,14,20,0.75); border:1px solid #2a3442;
    border-radius:8px; padding:12px 16px; font-size:13px; line-height:1.6;
    max-width:320px;
  }
  #ui b { color:#6fd3ff; }
  #ui .row { display:flex; justify-content:space-between; gap:12px; }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<div id="ui">
  <div><b>Puck Physics Prototype — no players yet</b></div>
  <div class="row"><span>Click/tap rink</span><span>shoot puck toward point</span></div>
  <div class="row"><span>Hold+drag then release</span><span>slingshot (velocity = drag)</span></div>
  <div class="row"><span>R</span><span>reset puck to center</span></div>
  <div class="row"><span>[ / ]</span><span>restitution -/+ (<span id="restVal">0.65</span>)</span></div>
  <div class="row"><span>, / .</span><span>friction -/+ (<span id="airVal">0.0020</span>)</span></div>
  <div style="margin-top:6px; opacity:0.7;">Goal line markers shown. Puck speed: <span id="speedVal">0</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(() => {
  const { Engine, Render, Runner, World, Bodies, Body, Events, Vector, Composite } = Matter;

  // ---- Rink dimensions (scaled down NHL-proportions: 200ft x 85ft -> px) ----
  const SCALE = 6.2; // px per foot
  const RINK_W = Math.round(200 * SCALE);
  const RINK_H = Math.round(85 * SCALE);
  const CORNER_R = Math.round(28 * SCALE); // NHL corner radius ~28ft
  const WALL_THICK = 24;

  const canvasEl = document.createElement('canvas');
  document.body.appendChild(canvasEl);

  function resize() {
    const pad = 40;
    const scale = Math.min(
      (window.innerWidth - pad) / RINK_W,
      (window.innerHeight - pad) / RINK_H,
      1
    );
    canvasEl.style.width = (RINK_W * scale) + 'px';
    canvasEl.style.height = (RINK_H * scale) + 'px';
  }

  const engine = Engine.create();
  engine.gravity.y = 0; // top-down, no gravity
  const world = engine.world;

  const render = Render.create({
    canvas: canvasEl,
    engine: engine,
    options: {
      width: RINK_W,
      height: RINK_H,
      wireframes: false,
      background: '#0b1622'
    }
  });
  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  resize();
  window.addEventListener('resize', resize);

  // ---- Build rounded-rink boundary out of straight wall segments + arc approximations ----
  // We approximate the rounded corners with a series of short straight segments (polygon arc).
  const wallParts = [];
  const wallOpts = {
    isStatic: true,
    restitution: 0.65,
    friction: 0.05,
    render: { fillStyle: '#2a4a63' },
    label: 'wall'
  };

  function addWall(x1, y1, x2, y2) {
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const len = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const seg = Bodies.rectangle(cx, cy, len, WALL_THICK, { ...wallOpts });
    Body.setAngle(seg, angle);
    wallParts.push(seg);
  }

  function arcPoints(cx, cy, r, startAngle, endAngle, segments) {
    const pts = [];
    for (let i = 0; i <= segments; i++) {
      const t = startAngle + (endAngle - startAngle) * (i / segments);
      pts.push({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) });
    }
    return pts;
  }

  const left = 0, top = 0, right = RINK_W, bottom = RINK_H;
  const r = CORNER_R;

  // Straight segments (top, bottom, left, right) between corner arcs
  addWall(left + r, top, right - r, top);                 // top
  addWall(left + r, bottom, right - r, bottom);            // bottom
  addWall(left, top + r, left, bottom - r);                // left
  addWall(right, top + r, right, bottom - r);               // right

  // Corner arcs (approximate with short segments), centers inset by r
  const corners = [
    { cx: left + r,  cy: top + r,    start: Math.PI,        end: Math.PI * 1.5 }, // top-left
    { cx: right - r, cy: top + r,    start: Math.PI * 1.5,  end: Math.PI * 2 },   // top-right
    { cx: right - r, cy: bottom - r, start: 0,              end: Math.PI * 0.5 }, // bottom-right
    { cx: left + r,  cy: bottom - r, start: Math.PI * 0.5,  end: Math.PI }        // bottom-left
  ];
  const ARC_SEGMENTS = 10;
  corners.forEach(c => {
    const pts = arcPoints(c.cx, c.cy, r, c.start, c.end, ARC_SEGMENTS);
    for (let i = 0; i < pts.length - 1; i++) {
      addWall(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    }
  });

  World.add(world, wallParts);

  // ---- Goal mouths (small gaps in the boards at each end, just visual markers for now) ----
  const GOAL_WIDTH = 6 * SCALE; // NHL goal mouth = 6ft
  const goalY1 = RINK_H / 2 - GOAL_WIDTH / 2;
  const goalY2 = RINK_H / 2 + GOAL_WIDTH / 2;

  // ---- Center ice / faceoff dots (visual only) ----
  const centerX = RINK_W / 2, centerY = RINK_H / 2;

  // ---- Puck ----
  const PUCK_RADIUS = Math.round(1.5 * SCALE); // ~3in diameter in-game, scaled up for visibility/playability
  let restitution = 0.65;
  let airFriction = 0.0020; // Matter 'frictionAir' - simulates ice friction/drag

  let puck = Bodies.circle(centerX, centerY, PUCK_RADIUS, {
    restitution: restitution,
    friction: 0.01,
    frictionAir: airFriction,
    density: 0.004,
    render: { fillStyle: '#1a1a1a', strokeStyle: '#444', lineWidth: 1 },
    label: 'puck'
  });
  World.add(world, puck);

  function resetPuck() {
    Body.setPosition(puck, { x: centerX, y: centerY });
    Body.setVelocity(puck, { x: 0, y: 0 });
    Body.setAngularVelocity(puck, 0);
  }

  // ---- Input: click-drag-release slingshot ----
  let dragStart = null;
  let isDragging = false;

  function getCanvasPoint(evt) {
    const rect = canvasEl.getBoundingClientRect();
    const scaleX = RINK_W / rect.width;
    const scaleY = RINK_H / rect.height;
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  canvasEl.addEventListener('mousedown', (e) => {
    dragStart = getCanvasPoint(e);
    isDragging = true;
  });
  canvasEl.addEventListener('touchstart', (e) => {
    dragStart = getCanvasPoint(e);
    isDragging = true;
  }, { passive: true });

  function endDrag(evt) {
    if (!isDragging || !dragStart) return;
    const end = getCanvasPoint(evt.changedTouches ? evt.changedTouches[0] : evt);
    const dx = dragStart.x - end.x; // slingshot: pull back, release forward (away from drag)
    const dy = dragStart.y - end.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 4) {
      // treat as a simple click: shoot puck toward click point from its current position
      const px = puck.position.x, py = puck.position.y;
      const tx = end.x - px, ty = end.y - py;
      const tdist = Math.hypot(tx, ty) || 1;
      const SHOT_SPEED = 18;
      Body.setVelocity(puck, { x: (tx / tdist) * SHOT_SPEED, y: (ty / tdist) * SHOT_SPEED });
    } else {
      // slingshot proportional to drag distance, capped
      const POWER = 0.18;
      const MAX_SPEED = 28;
      let vx = dx * POWER, vy = dy * POWER;
      const speed = Math.hypot(vx, vy);
      if (speed > MAX_SPEED) {
        vx = (vx / speed) * MAX_SPEED;
        vy = (vy / speed) * MAX_SPEED;
      }
      Body.setVelocity(puck, { x: vx, y: vy });
    }
    isDragging = false;
    dragStart = null;
  }

  canvasEl.addEventListener('mouseup', endDrag);
  canvasEl.addEventListener('touchend', endDrag);

  // ---- Keyboard: reset + tuning ----
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') resetPuck();
    if (e.key === '[') { restitution = Math.max(0, +(restitution - 0.05).toFixed(2)); applyTuning(); }
    if (e.key === ']') { restitution = Math.min(1.2, +(restitution + 0.05).toFixed(2)); applyTuning(); }
    if (e.key === ',') { airFriction = Math.max(0, +(airFriction - 0.0005).toFixed(4)); applyTuning(); }
    if (e.key === '.') { airFriction = Math.min(0.02, +(airFriction + 0.0005).toFixed(4)); applyTuning(); }
  });

  function applyTuning() {
    puck.restitution = restitution;
    puck.frictionAir = airFriction;
    wallParts.forEach(w => w.restitution = restitution);
    document.getElementById('restVal').textContent = restitution.toFixed(2);
    document.getElementById('airVal').textContent = airFriction.toFixed(4);
  }

  // ---- HUD speed readout ----
  setInterval(() => {
    const speed = Math.hypot(puck.velocity.x, puck.velocity.y);
    document.getElementById('speedVal').textContent = speed.toFixed(1);
  }, 100);

  // ---- Custom rendering overlay: rink markings (center line, faceoff circles, goal lines) ----
  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();

    // Center red line
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(centerX, 0);
    ctx.lineTo(centerX, RINK_H);
    ctx.stroke();

    // Center faceoff circle
    ctx.strokeStyle = '#3a7fd9';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 9 * SCALE, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#3a7fd9';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
    ctx.fill();

    // Blue lines (at 25% / 75% roughly NHL proportions)
    ctx.strokeStyle = '#3a7fd9';
    ctx.lineWidth = 3;
    [0.25, 0.75].forEach(frac => {
      ctx.beginPath();
      ctx.moveTo(RINK_W * frac, 0);
      ctx.lineTo(RINK_W * frac, RINK_H);
      ctx.stroke();
    });

    // Goal lines + goal mouths near each end
    const goalLineInset = 11 * SCALE; // NHL goal line ~11ft from end boards
    [goalLineInset, RINK_W - goalLineInset].forEach(gx => {
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, RINK_H);
      ctx.stroke();

      // goal mouth marker
      ctx.strokeStyle = '#f5d76e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(gx, goalY1);
      ctx.lineTo(gx, goalY2);
      ctx.stroke();
    });

    ctx.restore();
  });
})();
</script>
</body>
</html>
