<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Home Run Derby</title>
<style>
  html, body { margin:0; padding:0; background:#111; overflow:hidden; height:100%; overscroll-behavior:none; touch-action:none; }
  #game-container { display:flex; justify-content:center; align-items:center; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;
const PITCH_SPAWN_Y = 130;
const PLATE_Y = 560;
const BALL_MIN_RADIUS = 4;
const BALL_MAX_RADIUS = 11;
const PERFECT_WINDOW = 45;
const GOOD_WINDOW = 100;
const FOUL_WINDOW = 180;
const MAX_STRIKES = 3;
const BEST_KEY = 'homerunderby_best';
const BEST_DISTANCE_KEY = 'homerunderby_best_distance';

const COLOR_SKY = 0x7dd3fc;
const COLOR_GRASS = 0x4d7c0f;
const COLOR_DIRT = 0xca8a04;
const COLOR_FENCE = 0x365314;
const COLOR_GOLD = 0xfacc15;
const COLOR_STRIKE = 0xef4444;
const COLOR_HIT = 0x4ade80;
const COLOR_FOUL = 0xfb923c;

// Timing bar: half-range of time (ms) shown on each side of the ideal moment.
const BAR_HALF_RANGE = FOUL_WINDOW + 60;
const BAR_WIDTH = 300;
const BAR_Y = 615;

function getPitchDifficulty(hits) {
  if (hits < 5)  return { duration: 900, label: 'Warm-up' };
  if (hits < 12) return { duration: 750, label: 'Building' };
  if (hits < 20) return { duration: 620, label: 'Heat' };
  return { duration: 520, label: 'Ace' };
}

const PHASE_VISUALS = {
  'Warm-up':  { skyTop: 0x7dd3fc, skyBottom: 0xbae6fd, grass: 0x4d7c0f, crowdSpeed: 900, lights: false },
  'Building': { skyTop: 0x60a5fa, skyBottom: 0xfde68a, grass: 0x4d7c0f, crowdSpeed: 650, lights: false },
  'Heat':     { skyTop: 0xfb923c, skyBottom: 0xf87171, grass: 0x3f6212, crowdSpeed: 450, lights: true },
  'Ace':      { skyTop: 0x1e1b4b, skyBottom: 0x312e81, grass: 0x1a2e05, crowdSpeed: 280, lights: true }
};

class MainScene extends Phaser.Scene {
  constructor() { super('MainScene'); }

  create() {
    this.started = false;
    this.gameOver = false;
    this.score = 0;
    this.hits = 0;
    this.strikes = 0;
    this.pitchCount = 0;
    this.currentPhaseLabel = 'Warm-up';
    this.combo = 1;
    this.pitchElapsed = 0;
    this.pitchDuration = 900;
    this.swungThisPitch = true;
    this.ballVisual = null;
    this.bestScore = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    this.bestDistance = parseInt(localStorage.getItem(BEST_DISTANCE_KEY) || '0', 10);

    this.drawField();
    this.drawTimingBar();
    this.pitcherVisual = this.createPitcherVisual();
    this.batVisual = this.createBatVisual();

    this.scoreText = this.add.text(10, 10, 'Score: 0', { fontFamily: 'monospace', fontSize: '18px', color: '#f8fafc' }).setScrollFactor(0);
    this.hitsText = this.add.text(10, 34, 'Hits: 0', { fontFamily: 'monospace', fontSize: '14px', color: '#e0f2fe' }).setScrollFactor(0);
    this.pitchText = this.add.text(10, 54, 'Pitch: 0', { fontFamily: 'monospace', fontSize: '14px', color: '#e0f2fe' }).setScrollFactor(0);
    this.phaseText = this.add.text(GAME_WIDTH / 2, 4, 'WARM-UP', { fontFamily: 'monospace', fontSize: '11px', color: '#e0f2fe' }).setOrigin(0.5, 0).setScrollFactor(0);
    this.bestText = this.add.text(10, 74, 'Best: ' + this.bestScore, { fontFamily: 'monospace', fontSize: '13px', color: '#cbd5e1' }).setScrollFactor(0);
    this.bestDistText = this.add.text(10, 92, 'Best Dist: ' + this.bestDistance + ' FT', { fontFamily: 'monospace', fontSize: '13px', color: '#cbd5e1' }).setScrollFactor(0);

    this.strikeText = this.add.text(GAME_WIDTH - 10, 10, 'Strikes: OOO', {
      fontFamily: 'monospace', fontSize: '16px', color: '#f8fafc'
    }).setOrigin(1, 0).setScrollFactor(0);
    this.comboText = this.add.text(GAME_WIDTH - 10, 34, 'Combo: x1', {
      fontFamily: 'monospace', fontSize: '15px', color: COLOR_GOLD === 0xfacc15 ? '#facc15' : '#facc15'
    }).setOrigin(1, 0).setScrollFactor(0);

    this.startText = this.add.text(GAME_WIDTH / 2, 250, 'Tap to Swing', {
      fontFamily: 'monospace', fontSize: '22px', color: '#f8fafc'
    }).setOrigin(0.5).setScrollFactor(0);

    this.gameOverText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2, '', {
      fontFamily: 'monospace', fontSize: '20px', color: '#f8fafc', align: 'center'
    }).setOrigin(0.5).setScrollFactor(0);

    this.input.on('pointerdown', () => {
      if (!this.started) this.startGame();
      else if (this.gameOver) this.scene.restart();
      else this.handleSwing();
    });
    this.input.keyboard.on('keydown-SPACE', () => {
      if (!this.started) this.startGame();
      else if (this.gameOver) this.scene.restart();
      else this.handleSwing();
    });
  }

  drawField() {
    this.skyGraphics = this.add.graphics().setScrollFactor(0);
    this.grassGraphics = this.add.graphics().setScrollFactor(0);
    this.redrawSkyAndGrass(COLOR_SKY, 0xbae6fd, COLOR_GRASS);

    const g = this.add.graphics().setScrollFactor(0);
    g.fillStyle(COLOR_FENCE, 1);
    g.fillRect(0, 250, GAME_WIDTH, 12);

    g.fillStyle(COLOR_DIRT, 1);
    g.fillEllipse(GAME_WIDTH / 2, PITCH_SPAWN_Y + 20, 60, 22);

    g.fillStyle(COLOR_DIRT, 1);
    g.fillCircle(GAME_WIDTH / 2, PLATE_Y + 20, 90);
    g.fillStyle(COLOR_GRASS, 1);
    g.fillCircle(GAME_WIDTH / 2, PLATE_Y + 20, 70);
    g.fillStyle(COLOR_DIRT, 1);
    g.fillCircle(GAME_WIDTH / 2, PLATE_Y + 20, 40);

    this.add.polygon(GAME_WIDTH / 2, PLATE_Y + 40, [-14,-10, 14,-10, 14,4, 0,14, -14,4], 0xf8fafc).setScrollFactor(0);

    this.stadiumLights = this.createStadiumLights();
    this.crowdDots = this.createCrowd();
  }

  redrawSkyAndGrass(skyTop, skyBottom, grassColor) {
    this.skyGraphics.clear();
    this.skyGraphics.fillGradientStyle(skyTop, skyTop, skyBottom, skyBottom, 1);
    this.skyGraphics.fillRect(0, 0, GAME_WIDTH, 260);

    this.grassGraphics.clear();
    this.grassGraphics.fillStyle(grassColor, 1);
    this.grassGraphics.fillRect(0, 260, GAME_WIDTH, GAME_HEIGHT - 260);
  }

  createStadiumLights() {
    const positions = [[30, 20], [GAME_WIDTH - 30, 20], [90, 45], [GAME_WIDTH - 90, 45]];
    const lights = [];
    positions.forEach(([x, y]) => {
      const glow = this.add.circle(x, y, 14, 0xfef9c3, 0.25).setScrollFactor(0).setVisible(false);
      const core = this.add.circle(x, y, 5, 0xfef9c3, 0.9).setScrollFactor(0).setVisible(false);
      lights.push(glow, core);
    });
    return lights;
  }

  createCrowd() {
    const dots = [];
    const y = 244;
    for (let i = 0; i < 16; i++) {
      const x = 15 + i * ((GAME_WIDTH - 30) / 15);
      const dot = this.add.circle(x, y, 3, 0x1e293b, 0.8).setScrollFactor(0);
      dot.baseY = y;
      dots.push(dot);
    }
    return dots;
  }

  drawTimingBar() {
    const g = this.add.graphics().setScrollFactor(0);
    const halfW = BAR_WIDTH / 2;
    const cx = GAME_WIDTH / 2;

    const perfectHalf = (PERFECT_WINDOW / BAR_HALF_RANGE) * halfW;
    const hitHalf = (GOOD_WINDOW / BAR_HALF_RANGE) * halfW;
    const foulHalf = (FOUL_WINDOW / BAR_HALF_RANGE) * halfW;

    // outer (strike) zone
    g.fillStyle(0x64748b, 1);
    g.fillRect(cx - halfW, BAR_Y - 8, BAR_WIDTH, 16);
    // foul zone
    g.fillStyle(COLOR_FOUL, 1);
    g.fillRect(cx - foulHalf, BAR_Y - 8, foulHalf * 2, 16);
    // hit zone
    g.fillStyle(COLOR_HIT, 1);
    g.fillRect(cx - hitHalf, BAR_Y - 8, hitHalf * 2, 16);
    // perfect zone
    g.fillStyle(COLOR_GOLD, 1);
    g.fillRect(cx - perfectHalf, BAR_Y - 8, perfectHalf * 2, 16);

    g.lineStyle(2, 0xf8fafc, 0.9);
    g.strokeRect(cx - halfW, BAR_Y - 8, BAR_WIDTH, 16);

    this.barLabel = this.add.text(cx, BAR_Y + 18, 'TIMING', {
      fontFamily: 'monospace', fontSize: '11px', color: '#e2e8f0'
    }).setOrigin(0.5).setScrollFactor(0);

    this.barMarker = this.add.triangle(cx, BAR_Y - 16, 0, 10, 10, -6, -10, -6, 0xf8fafc).setScrollFactor(0);
  }

  createBallVisual() {
    const c = this.add.container(0, 0);
    const body = this.add.circle(0, 0, BALL_MAX_RADIUS, 0xffffff).setStrokeStyle(1, 0xcbd5e1);
    const stitch1 = this.add.line(0, 0, -5, -3, 5, 3, 0xef4444).setLineWidth(1.2);
    const stitch2 = this.add.line(0, 0, -5, 3, 5, -3, 0xef4444).setLineWidth(1.2);
    c.add([body, stitch1, stitch2]);
    return c;
  }

  createPitcherVisual() {
    const c = this.add.container(GAME_WIDTH / 2, PITCH_SPAWN_Y + 12);
    const legL = this.add.rectangle(-5, 10, 6, 16, 0xe2e8f0);
    const legR = this.add.rectangle(5, 10, 6, 16, 0xe2e8f0);
    const torso = this.add.rectangle(0, -8, 20, 22, 0xf8fafc);
    const armBack = this.add.rectangle(-12, -14, 6, 16, 0xf8fafc).setOrigin(0.5, 0).setAngle(15);
    const armThrow = this.add.rectangle(12, -14, 6, 16, 0xf8fafc).setOrigin(0.5, 0).setAngle(-20);
    const head = this.add.circle(0, -26, 7, 0xfcd9b8);
    const cap = this.add.arc(0, -29, 8, 180, 360, false, 0x1e3a8a, 1);
    c.add([legL, legR, torso, armBack, armThrow, head, cap]);
    c.armThrow = armThrow;
    return c;
  }

  createBatVisual() {
    const bat = this.add.rectangle(GAME_WIDTH / 2 + 26, PLATE_Y + 8, 6, 50, 0x92400e).setOrigin(0.5, 1).setAngle(-70).setScrollFactor(0);
    return bat;
  }

  swingBat() {
    if (!this.batVisual) return;
    this.tweens.killTweensOf(this.batVisual);
    this.batVisual.setAngle(-70);
    this.tweens.add({ targets: this.batVisual, angle: 40, duration: 140, yoyo: true, ease: 'Quad.easeOut' });
  }

  startGame() {
    this.started = true;
    this.startText.setVisible(false);
    this.spawnPitch();
  }

  spawnPitch() {
    this.pitchElapsed = 0;
    this.swungThisPitch = false;
    this.pitchCount++;
    const diff = getPitchDifficulty(this.hits);
    this.pitchDuration = diff.duration;

    if (diff.label !== this.currentPhaseLabel) {
      this.currentPhaseLabel = diff.label;
      this.applyPhaseVisuals(diff.label);
      this.phaseText.setText(diff.label.toUpperCase());
      if (diff.label !== 'Warm-up') {
        this.showPhaseAnnouncement(diff.label);
        SFX.powerup();
      }
    }

    if (this.ballVisual) this.ballVisual.destroy();
    this.ballVisual = this.createBallVisual();
    this.ballVisual.setPosition(GAME_WIDTH / 2, PITCH_SPAWN_Y);
    this.ballVisual.setScale(BALL_MIN_RADIUS / BALL_MAX_RADIUS);
    this.pitchText.setText('Pitch: ' + this.pitchCount);

    if (this.pitcherVisual && this.pitcherVisual.armThrow) {
      const arm = this.pitcherVisual.armThrow;
      this.tweens.killTweensOf(arm);
      arm.setAngle(-20);
      this.tweens.add({ targets: arm, angle: 55, duration: 180, yoyo: true, ease: 'Quad.easeInOut' });
    }
  }

  applyPhaseVisuals(label) {
    const v = PHASE_VISUALS[label];
    this.redrawSkyAndGrass(v.skyTop, v.skyBottom, v.grass);
    this.stadiumLights.forEach(l => l.setVisible(v.lights));
    this.crowdDots.forEach(dot => {
      this.tweens.killTweensOf(dot);
      this.tweens.add({
        targets: dot,
        y: dot.baseY - (v.lights ? 6 : 3),
        duration: v.crowdSpeed,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
    });
  }

  showPhaseAnnouncement(label) {
    const t = this.add.text(GAME_WIDTH / 2, 180, label.toUpperCase() + '!', {
      fontFamily: 'monospace', fontSize: '28px', color: '#fde68a', align: 'center'
    }).setOrigin(0.5).setScrollFactor(0).setAlpha(0).setScale(0.7);
    this.tweens.add({ targets: t, alpha: 1, scale: 1, duration: 220, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, duration: 400, delay: 700, onComplete: () => t.destroy() });
  }

  updateHud() {
    this.scoreText.setText('Score: ' + this.score);
    this.hitsText.setText('Hits: ' + this.hits);
    this.comboText.setText('Combo: x' + this.combo);
  }

  updateStrikeHud() {
    this.strikeText.setText('Strikes: ' + '\u25CF'.repeat(this.strikes) + '\u25CB'.repeat(MAX_STRIKES - this.strikes));
  }

  showFloatingText(x, y, text, color) {
    const t = this.add.text(x, y, text, {
      fontFamily: 'monospace', fontSize: '18px', color: '#' + color.toString(16).padStart(6, '0'), align: 'center'
    }).setOrigin(0.5).setScrollFactor(0).setAlpha(0);
    this.tweens.add({ targets: t, alpha: 1, y: y - 10, duration: 120, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, y: y - 40, duration: 400, delay: 350, ease: 'Quad.easeOut', onComplete: () => t.destroy() });
  }

  animateBallAway(mode) {
    if (!this.ballVisual) return;
    const ball = this.ballVisual;
    this.ballVisual = null;

    if (mode === 'foul') {
      const side = Math.random() < 0.5 ? -1 : 1;
      this.tweens.add({ targets: ball, x: ball.x + side * 220, y: ball.y - 40, alpha: 0, duration: 300, ease: 'Quad.easeOut', onComplete: () => ball.destroy() });
    } else if (mode === 'homerun') {
      this.tweens.add({ targets: ball, y: ball.y - 520, x: ball.x + (Math.random() - 0.5) * 150, scale: 1.7, alpha: 0, duration: 550, ease: 'Quad.easeOut', onComplete: () => ball.destroy() });
    } else if (mode === 'hit') {
      const side = Math.random() < 0.5 ? -1 : 1;
      this.tweens.add({ targets: ball, x: ball.x + side * 180, y: ball.y - 150, alpha: 0, duration: 400, ease: 'Quad.easeOut', onComplete: () => ball.destroy() });
    } else {
      this.tweens.add({ targets: ball, alpha: 0, duration: 200, onComplete: () => ball.destroy() });
    }
  }

  handleSwing() {
    if (this.swungThisPitch) return;
    this.swungThisPitch = true;
    const diff = Math.abs(this.pitchElapsed - this.pitchDuration);

    if (diff <= PERFECT_WINDOW) this.registerHomeRun(diff);
    else if (diff <= GOOD_WINDOW) this.registerBaseHit();
    else if (diff <= FOUL_WINDOW) this.registerFoul();
    else this.registerStrike('STRIKE!', true);
  }

  registerHomeRun(timingDiff) {
    this.hits++;
    this.combo++;
    const distance = Math.round(380 + Math.random() * 20 + (1 - timingDiff / PERFECT_WINDOW) * 80);
    const points = 100 + this.combo * 30;
    this.score += points;

    let isNewDistBest = false;
    if (distance > this.bestDistance) {
      this.bestDistance = distance;
      localStorage.setItem(BEST_DISTANCE_KEY, String(this.bestDistance));
      isNewDistBest = true;
      this.bestDistText.setText('Best Dist: ' + this.bestDistance + ' FT');
    }

    SFX.combo(this.combo);
    this.cameras.main.shake(180, 0.010);
    this.swingBat();
    this.animateBallAway('homerun');

    this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, 'PERFECT!', COLOR_GOLD);
    this.time.delayedCall(150, () => this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, 'HOME RUN!', COLOR_GOLD));
    this.time.delayedCall(320, () => this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, distance + ' FT' + (isNewDistBest ? ' NEW BEST!' : ''), 0xffffff));
    this.time.delayedCall(480, () => this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, '+' + points + '  COMBO x' + this.combo, COLOR_GOLD));

    this.updateHud();
    this.spawnPitch();
  }

  registerBaseHit() {
    this.hits++;
    // combo maintained, not incremented, not reset
    this.score += 40 + this.combo * 10;
    SFX.pickup();
    this.swingBat();
    this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, 'Base Hit', 0xffffff);
    this.animateBallAway('hit');
    this.updateHud();
    this.spawnPitch();
  }

  registerFoul() {
    this.combo = Math.max(1, this.combo - 1);
    SFX.blip();
    this.swingBat();
    this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, 'Foul Ball', COLOR_FOUL);
    this.animateBallAway('foul');
    this.updateHud();
    this.spawnPitch();
  }

  registerStrike(label, wasSwing) {
    this.strikes++;
    this.combo = 1;
    SFX.hit();
    if (wasSwing) this.swingBat();
    this.showFloatingText(GAME_WIDTH / 2, PLATE_Y - 70, label, COLOR_STRIKE);
    this.animateBallAway('strike');
    this.updateHud();
    this.updateStrikeHud();

    if (this.strikes >= MAX_STRIKES) {
      this.triggerGameOver();
    } else {
      this.spawnPitch();
    }
  }

  triggerGameOver() {
    this.gameOver = true;
    SFX.scream();
    let isNewBest = false;
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      localStorage.setItem(BEST_KEY, String(this.bestScore));
      isNewBest = true;
    }
    this.gameOverText.setText(
      "STRUCK OUT\n" +
      'Score: ' + this.score + '\n' +
      'Hits: ' + this.hits + '\n' +
      'Pitches: ' + this.pitchCount + '\n' +
      'Best Dist: ' + this.bestDistance + ' FT\n' +
      'Best: ' + this.bestScore + (isNewBest ? '  NEW BEST!' : '') + '\n\n' +
      'Tap to retry'
    );
  }

  update(time, delta) {
    if (this.gameOver || !this.started) return;
    this.pitchElapsed += delta;

    const progress = Math.min(1, this.pitchElapsed / this.pitchDuration);
    const y = PITCH_SPAWN_Y + (PLATE_Y - PITCH_SPAWN_Y) * progress;
    const scale = (BALL_MIN_RADIUS + (BALL_MAX_RADIUS - BALL_MIN_RADIUS) * progress) / BALL_MAX_RADIUS;
    if (this.ballVisual) {
      this.ballVisual.setPosition(GAME_WIDTH / 2, y);
      this.ballVisual.setScale(scale);

      // Motion trail — makes the approach read as a moving pitch, not a
      // static object that happens to be getting bigger.
      if (Math.random() < 0.55) {
        const trail = this.add.circle(this.ballVisual.x, this.ballVisual.y, Math.max(1, BALL_MAX_RADIUS * scale * 0.6), 0xffffff, 0.35);
        this.tweens.add({ targets: trail, alpha: 0, scale: 0.4, duration: 200, onComplete: () => trail.destroy() });
      }
    }

    // Timing bar marker tracks elapsed time relative to the ideal moment.
    const offset = Phaser.Math.Clamp(this.pitchElapsed - this.pitchDuration, -BAR_HALF_RANGE, BAR_HALF_RANGE);
    this.barMarker.x = GAME_WIDTH / 2 + (offset / BAR_HALF_RANGE) * (BAR_WIDTH / 2);

    if (!this.swungThisPitch && this.pitchElapsed > this.pitchDuration + FOUL_WINDOW) {
      this.swungThisPitch = true;
      this.registerStrike('STRIKE! (looking)', false);
    }
  }
}

const config = {
  type: Phaser.AUTO,
  audio: { noAudio: true },
  resolution: window.devicePixelRatio || 1,
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  parent: 'game-container',
  backgroundColor: '#7dd3fc',
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
