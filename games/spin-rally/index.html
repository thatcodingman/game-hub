  return (r<<16)|(g<<8)|b;
}

/* ============================================================
   CHARACTER DRAWING (shared by the match, and the Customize preview)
   ============================================================ */
function optOf(list, i){ return list[i] || list[0]; }
function contrastOf(c){
  var lum = (0.299*(c>>16&255) + 0.587*(c>>8&255) + 0.114*(c&255))/255;
  return shadeColor(c, lum>0.55 ? -0.28 : 0.30);
}

/* Table tennis paddle: handle, throat, dark edge-tape rim, colored rubber face, sheen.
   (hx,hy) is the grip point; ang tilts the paddle about the grip (radians). */
function drawPaddleShape(g, hx, hy, s, rubberColor, ang){
  var ca = Math.cos(ang), sa = Math.sin(ang);
  function P(lx, ly){ return { x: hx + (lx*ca - ly*sa)*s, y: hy + (lx*sa + ly*ca)*s }; }
  function ell(cx, cy, rx, ry){
    var pts = [];
    for (var i=0;i<28;i++){ var a = i/28*Math.PI*2; pts.push(P(cx + Math.cos(a)*rx, cy + Math.sin(a)*ry)); }
    return pts;
  }
  g.fillStyle(0xc89a60, 1);
  g.fillPoints([P(-1.9,-3), P(1.9,-3), P(2.6,10.5), P(-2.6,10.5)], true);
  g.fillStyle(0x8f6637, 1);
  g.fillPoints([P(-2.6,8.5), P(2.6,8.5), P(2.9,11), P(-2.9,11)], true);
  g.fillStyle(0xe7c58f, 0.55);
  g.fillPoints([P(-1.2,-2), P(-0.2,-2), P(-0.5,9), P(-1.5,9)], true);
  g.fillStyle(0xb98a52, 1);
  g.fillPoints([P(-4.2,-6.2), P(4.2,-6.2), P(1.9,-1.5), P(-1.9,-1.5)], true);
  g.fillStyle(0x151515, 1);
  g.fillPoints(ell(0, -13, 7.9, 8.6), true);
  g.fillStyle(rubberColor, 1);
  g.fillPoints(ell(0, -13, 6.9, 7.6), true);
  g.fillStyle(0xffffff, 0.2);
  g.fillPoints(ell(-2.2, -16, 3.1, 2.4), true);
  g.lineStyle(1, 0xffffff, 0.28);
  g.strokePoints(ell(0, -12.5, 2.6, 2.8), true);
}

/* Head only: ears, face, hair style, face details and head extras (shared by the full figure and portraits). */
function drawHead(g, px, headCy, s, look, front){
  var skin   = optOf(SKIN_TONES, look.skin).v;
  var skinShade = shadeColor(skin, -0.10);
  var hairC  = optOf(HAIR_COLORS, look.hairColor).v;
  var jersey = optOf(JERSEY_COLORS, look.jerseyColor).v;
  var alt    = contrastOf(jersey);
  var hairStyle = optOf(HAIR_STYLES, look.hairStyle).key;
  var extra  = optOf(EXTRAS, look.extra).key;
  // head: ears, face, hair
  g.fillStyle(skinShade, 1);
  g.fillCircle(px - 8.4*s, headCy + 1*s, 2.2*s);
  g.fillCircle(px + 8.4*s, headCy + 1*s, 2.2*s);
  g.fillStyle(skin, 1);
  g.fillCircle(px, headCy, 8.5*s);

  function hairCap(alpha){
    g.fillStyle(hairC, alpha);
    g.beginPath();
    g.arc(px, headCy, 8.6*s, Math.PI, 0, false);
    g.fillPath();
  }
  if (hairStyle === 'short' || hairStyle === 'ponytail'){ hairCap(1); }
  else if (hairStyle === 'buzz'){ hairCap(0.5); }
  else if (hairStyle === 'long'){
    hairCap(1);
    g.fillStyle(hairC, 1);
    g.fillRect(px - 8.6*s, headCy - 1*s, 3*s, 11*s);
    g.fillRect(px + 5.6*s, headCy - 1*s, 3*s, 11*s);
  } else if (hairStyle === 'curly'){
    hairCap(1);
    g.fillStyle(hairC, 1);
    for (var c=0;c<6;c++){
      var ca = Math.PI*(1.04 + c*0.184);
      g.fillCircle(px + Math.cos(ca)*8.6*s, headCy + Math.sin(ca)*8.6*s, 3.6*s);
    }
  } else { // bald: just a soft highlight on the scalp
    g.fillStyle(0xffffff, 0.14);
    g.fillEllipse(px - 2.5*s, headCy - 5*s, 5*s, 2.6*s);
  }

  if (front){
    g.fillStyle(0x23201d, 1);
    g.fillCircle(px - 3*s, headCy + 1*s, 1.1*s);
    g.fillCircle(px + 3*s, headCy + 1*s, 1.1*s);
    g.lineStyle(1.1*s, 0x7a3b2e, 1);
    g.beginPath();
    g.arc(px, headCy + 3*s, 2.6*s, 0.25, Math.PI-0.25, false);
    g.strokePath();
  }

  if (extra === 'headband'){
    g.lineStyle(2.6*s, alt, 1);
    g.lineBetween(px - 7.9*s, headCy - 3.2*s, px + 7.9*s, headCy - 3.2*s);
  } else if (extra === 'glasses'){
    g.lineStyle(0.9*s, 0x1a1a1a, 1);
    if (front){
      g.strokeCircle(px - 3.4*s, headCy + 1*s, 2.7*s);
      g.strokeCircle(px + 3.4*s, headCy + 1*s, 2.7*s);
      g.lineBetween(px - 0.7*s, headCy + 0.6*s, px + 0.7*s, headCy + 0.6*s);
    } else {
      g.lineBetween(px - 8.4*s, headCy + 0.6*s, px + 8.4*s, headCy + 0.6*s);
    }
  } else if (extra === 'cap'){
    g.fillStyle(jersey, 1);
    g.beginPath();
    g.arc(px, headCy - 0.6*s, 9.2*s, Math.PI, 0, false);
    g.fillPath();
    g.fillStyle(alt, 1);
    if (front) g.fillEllipse(px, headCy - 0.4*s, 15*s, 3.4*s); // brim
    else g.fillRect(px - 2.2*s, headCy - 3*s, 4.4*s, 2.2*s);   // back strap
  }

}

/* Head-and-shoulders portrait centered on the head at (cx, cy). locked = dark silhouette. */
function drawPortrait(g, cx, cy, s, look, locked){
  if (locked){
    g.fillStyle(0x2a2336, 1);
    g.fillCircle(cx, cy, 8.5*s);
    g.fillRoundedRect(cx-10.5*s, cy+8.5*s, 21*s, 13*s, {tl:6*s, tr:6*s, bl:0, br:0});
    return;
  }
  var skin   = optOf(SKIN_TONES, look.skin).v;
  var hairC  = optOf(HAIR_COLORS, look.hairColor).v;
  var jersey = optOf(JERSEY_COLORS, look.jerseyColor).v;
  var hairStyle = optOf(HAIR_STYLES, look.hairStyle).key;
  if (hairStyle === 'long'){
    g.fillStyle(hairC, 1);
    g.fillRoundedRect(cx - 10*s, cy - 3*s, 20*s, 22*s, 7*s);
  } else if (hairStyle === 'ponytail'){
    g.fillStyle(hairC, 1);
    g.fillEllipse(cx + 10*s, cy + 4*s, 5.5*s, 12*s);
  }
  g.fillStyle(jersey, 1);
  g.fillRoundedRect(cx-10.5*s, cy+8.5*s, 21*s, 13*s, {tl:6*s, tr:6*s, bl:0, br:0});
  g.fillStyle(skin, 1);
  g.fillRect(cx-3*s, cy+6*s, 6*s, 4*s);
  g.fillTriangle(cx-3.4*s, cy+8.8*s, cx+3.4*s, cy+8.8*s, cx, cy+13.5*s);
  drawHead(g, cx, cy, s, look, true);
}

/* Hands: built from small skin-colored ellipses (palm, four fingers, thumb) with soft finger separations,
   instead of a single round ball. */
function fillEllRot(g, cx, cy, rx, ry, rot, n){
  var pts = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (var i=0;i<(n||14);i++){
    var a = i/(n||14)*Math.PI*2, ex = Math.cos(a)*rx, ey = Math.sin(a)*ry;
    pts.push({ x: cx + ex*cr - ey*sr, y: cy + ex*sr + ey*cr });
  }
  g.fillPoints(pts, true);
}
// relaxed hand hanging at the side: palm, four fingers pointing down, thumb toward the body
function drawRelaxedHand(g, x, y, s, skin, side){
  var shade = shadeColor(skin, -0.12);
  g.fillStyle(shade, 1);
  fillEllRot(g, x + side*2.7*s, y + 0.2*s, 0.85*s, 1.8*s, side*0.5, 10);          // thumb (shaded, behind palm)
  for (var i=0;i<4;i++){
    var fx = x + (-1.65 + i*1.1)*s, fl = (i===1||i===2) ? 2.15 : 1.8;
    g.fillStyle(i%2 ? skin : shade, 1);
    fillEllRot(g, fx, y + (1.9 + (fl-1.8)*0.5)*s, 0.62*s, fl*s, 0, 10);              // fingers
  }
  g.fillStyle(skin, 1);
  fillEllRot(g, x, y, 2.5*s, 2.3*s, 0, 14);                                           // palm
}
// hand wrapped around the paddle handle (drawn after the paddle so fingers sit in front of it)
function drawGripHand(g, hx, hy, s, skin, ang){
  var ca = Math.cos(ang), sa = Math.sin(ang);
  function P(lx, ly){ return { x: hx + (lx*ca - ly*sa)*s, y: hy + (lx*sa + ly*ca)*s }; }
  var shade = shadeColor(skin, -0.14);
  var pp = P(0, 3.6);
  g.fillStyle(skin, 1);
  fillEllRot(g, pp.x, pp.y, 3.2*s, 3.0*s, ang, 14);                                    // palm over the grip
  for (var i=0;i<4;i++){                                                              // four fingers wrapped across the handle
    var fp = P(0.3, 2.6 + i*1.55);
    g.fillStyle(i%2 ? skin : shade, 1);
    fillEllRot(g, fp.x, fp.y, 3.0*s, 0.95*s, ang, 12);
  }
  var tp = P(-2.6, 1.0);
  g.fillStyle(skin, 1);
  fillEllRot(g, tp.x, tp.y, 1.15*s, 2.4*s, ang - 0.55, 12);                             // thumb along the handle, toward the blade
  g.lineStyle(0.6*s, shade, 0.7);
  var a0 = P(-2.6, 5.4), a1 = P(2.9, 5.4);
  g.lineBetween(a0.x, a0.y, a1.x, a1.y);                                              // knuckle crease
}

/* Full figure from one anchor point (px = center x, anchorY = feet baseline, s = scale).
   side: +1 paddle arm reaches right, -1 left.  swing: 0..1.  front: true = facing the camera
   (shows a face); false = seen from behind/side (no face, glasses become a thin band). */
function drawFigure(g, px, anchorY, s, look, paddleColor, side, swing, front, swingVar){
  swing = swing || 0; swingVar = swingVar || 0;
  var skin   = optOf(SKIN_TONES, look.skin).v;
  var hairC  = optOf(HAIR_COLORS, look.hairColor).v;
  var jersey = optOf(JERSEY_COLORS, look.jerseyColor).v;
  var alt    = contrastOf(jersey);
  var shorts = optOf(SHORTS_COLORS, look.shortsColor).v;
  var hairStyle = optOf(HAIR_STYLES, look.hairStyle).key;
  var jStyle = optOf(JERSEY_STYLES, look.jerseyStyle).key;
  var extra  = optOf(EXTRAS, look.extra).key;
  var skinShade = shadeColor(skin, -0.10);
  var sleeve = (jStyle === 'yoke') ? alt : jersey;

  var hipY = anchorY - 14*s, shoulderY = anchorY - 34*s, headCy = shoulderY - 9*s, feetY = anchorY;

  g.fillStyle(0x060b09, 0.32);
  g.fillEllipse(px, feetY + 6*s, 26*s, 6*s);

  // long hair hangs behind the body, ponytail swings off the back of the head
  if (hairStyle === 'long'){
    g.fillStyle(hairC, 1);
    g.fillRoundedRect(px - 10*s, headCy - 3*s, 20*s, 24*s, 7*s);
  } else if (hairStyle === 'ponytail'){
    g.fillStyle(hairC, 1);
    g.fillEllipse(px - side*10*s, headCy + 4*s, 5.5*s, 12*s);
  }

  // legs (skin) with white socks and shoes
  g.fillStyle(skin, 1);
  g.fillRect(px - 7*s, hipY, 5*s, feetY-hipY);
  g.fillRect(px + 2*s, hipY, 5*s, feetY-hipY);
  g.fillStyle(0xf2f2ee, 1);
  g.fillRect(px - 7*s, feetY - 5*s, 5*s, 5*s);
  g.fillRect(px + 2*s, feetY - 5*s, 5*s, 5*s);
  g.fillStyle(0x111214, 1);
  g.fillEllipse(px - 4.5*s, feetY, 7*s, 3.5*s);
  g.fillEllipse(px + 4.5*s, feetY, 7*s, 3.5*s);

  // shorts
  g.fillStyle(shorts, 1);
  g.fillRoundedRect(px-9*s, hipY-7*s, 18*s, 11*s, 3*s);

  // torso (jersey) + style details
  g.fillStyle(jersey, 1);
  g.fillRoundedRect(px-9*s, shoulderY, 18*s, hipY-shoulderY+2*s, 4*s);
  g.fillStyle(alt, 1);
  if (jStyle === 'stripe'){
    for (var k=0;k<3;k++) g.fillRect(px-9*s, shoulderY + (5+k*6.5)*s, 18*s, 3*s);
  } else if (jStyle === 'sash'){
    g.fillPoints([
      {x:px-9*s,y:shoulderY+1*s},{x:px-2*s,y:shoulderY+1*s},{x:px+9*s,y:shoulderY+15*s},
      {x:px+9*s,y:shoulderY+21*s},{x:px+2*s,y:shoulderY+21*s},{x:px-9*s,y:shoulderY+7*s}
    ], true);
  } else if (jStyle === 'yoke'){
    g.fillRoundedRect(px-9*s, shoulderY, 18*s, 7*s, {tl:4*s, tr:4*s, bl:0, br:0});
  }
  // V-neck showing a bit of skin
  g.fillStyle(skin, 1);
  g.fillTriangle(px-3.4*s, shoulderY, px+3.4*s, shoulderY, px, shoulderY+4.5*s);

  // arms are two-bone limbs (fixed upper-arm and forearm lengths, round joints), so they never stretch or
  // leave stubby corners; they are drawn as capsules (line + round end caps)
  function limb(x0, y0, x1, y1, w, color){
    g.lineStyle(w, color, 1);
    g.lineBetween(x0, y0, x1, y1);
    g.fillStyle(color, 1);
    g.fillCircle(x0, y0, w/2);
    g.fillCircle(x1, y1, w/2);
  }
  // far-side arm hangs relaxed beside the body
  var fsx = px - side*8.2*s, fsy = shoulderY + 3*s;
  var fex = px - side*10.6*s, fey = shoulderY + 11.5*s;
  var fhx = px - side*10.9*s, fhy = shoulderY + 19.5*s;
  limb(fsx, fsy, fex, fey, 4.2*s, sleeve);
  limb(fex, fey, fhx, fhy - 2*s, 3.2*s, skin);
  drawRelaxedHand(g, fhx, fhy, s, skin, side);

  // paddle arm: shoulder -> elbow -> hand, rotating about each joint during the swing
  var sw = Math.sin(swing*Math.PI);
  var psx = px + side*8.5*s, psy = shoulderY + 3*s;
  var psi = deg2rad(lerp(55, 75 + swingVar*22, sw));
  var elbowX = psx + side*Math.cos(psi)*9*s, elbowY = psy + Math.sin(psi)*9*s;
  var phi = deg2rad(lerp(-65, -170 + swingVar*45, sw));
  var handX = elbowX + side*Math.cos(phi)*8*s, handY = elbowY + Math.sin(phi)*8*s;
  limb(psx, psy, elbowX, elbowY, 4.2*s, sleeve);
  limb(elbowX, elbowY, handX, handY, 3.2*s, skin);
  if (extra === 'wristband'){
    g.fillStyle(0xf2f2ee, 1);
    g.fillCircle(lerp(handX, elbowX, 0.28), lerp(handY, elbowY, 0.28), 2.3*s);
  }

  drawHead(g, px, headCy, s, look, front);

  var padAng = side*(0.22 - (1.2 + swingVar*0.55)*sw);
  drawPaddleShape(g, handX, handY, s, paddleColor, padAng);
  drawGripHand(g, handX, handY, s, skin, padAng);
}

/* ============================================================
   SFX  -- small synthesized sound set (WebAudio), no sample files
   ============================================================ */
var SFX = (function(){
  var ctx=null, enabled=true;
  function ensureCtx(){
    if (!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if (ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function jitter(v, amt){ return v * (1 - amt + Math.random()*amt*2); }
  // short pitched body with a fast exponential decay (the "tok" of wood / the "pok" of a ball)
  function thump(freq, dur, vol, slide, type, delay){
    if (!enabled) return;
    var c = ensureCtx(); if (!c) return;
    var t0 = c.currentTime + (delay||0);
    var osc = c.createOscillator(); osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq*(slide||0.5)), t0+dur);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  // filtered noise: q high = a tight click, q low = whoosh / rattle; sweepTo glides the filter
  function noise(dur, vol, freq, q, sweepTo, delay){
    if (!enabled) return;
    var c = ensureCtx(); if (!c) return;
    var t0 = c.currentTime + (delay||0);
    var n = Math.floor(c.sampleRate*dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q||1;
    f.frequency.setValueAtTime(freq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0+dur);
    var g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0);
  }
  function note(freq, dur, vol, delay, type){ thump(freq, dur, vol, 0.98, type||'triangle', delay); }
  return {
    setEnabled:function(v){ enabled=!!v; },
    // rubber-on-celluloid "tok": crisp click on top, wooden body underneath; harder hits are brighter
    paddleHit:function(speedNorm){
      var s = clamp(speedNorm,0,1);
      noise(0.035, 0.30+0.25*s, jitter(2600+s*1600, 0.06), 3.5);
      thump(jitter(210+s*90, 0.05), 0.07, 0.40+0.25*s, 0.6, 'triangle');
      thump(jitter(1150+s*500, 0.05), 0.03, 0.12, 0.7, 'sine');
    },
    // hollow "pok" off the table, slightly different every time
    tableBounce:function(){
      thump(jitter(430, 0.08), 0.06, 0.30, 0.55, 'sine');
      noise(0.02, 0.10, 3200, 2);
    },
    // soft mesh rattle + dull tap
    netClip:function(){
      noise(0.16, 0.30, 1100, 0.8, 500);
      thump(150, 0.09, 0.22, 0.6, 'sine');
    },
    // paddle cutting through air
    swing:function(){ noise(0.13, 0.16, 500, 0.9, 1800); },
    serveTone:function(){ thump(jitter(760, 0.06), 0.045, 0.14, 0.8, 'sine'); },
    pointPlayer:function(){ note(659,0.14,0.22,0); note(784,0.14,0.22,0.09); note(1047,0.22,0.24,0.18); },
    // crowd: applause-like noise swell (bigger when the player scores) -- matches the jumping crowd
    crowd:function(big){
      noise(0.55, big?0.20:0.10, 1500, 0.5, 2600);
      noise(0.45, big?0.14:0.07, 2400, 0.7, 1200, 0.10);
    },
    pointAI:function(){ note(392,0.16,0.20,0,'sine'); note(294,0.24,0.20,0.11,'sine'); },
    gameWin:function(){ note(523,0.16,0.26,0.30); note(659,0.16,0.26,0.42); note(784,0.16,0.26,0.54); note(1047,0.40,0.30,0.66); },
    gameLose:function(){ note(392,0.22,0.22,0.30,'sine'); note(330,0.22,0.22,0.46,'sine'); note(262,0.40,0.24,0.62,'sine'); },
    matchWin:function(){
      var seq=[523,659,784,1047,784,1047,1319];
      for (var i=0;i<seq.length;i++) note(seq[i], i===seq.length-1?0.7:0.15, 0.28, 0.30+i*0.13);
      noise(0.9, 0.10, 3500, 0.6, 1500, 0.30);
    },
    matchLose:function(){ note(330,0.3,0.22,0.30,'sine'); note(294,0.3,0.22,0.55,'sine'); note(220,0.7,0.24,0.80,'sine'); }
  };
})();

/* ============================================================
   BALL PHYSICS
   ============================================================ */
function makeBall(){
  return { x:TABLE.width/2, y:0.55, h:0.35, vx:0, vy:0, vh:0,
    topSpin:0, sideSpin:0, alive:false, lastHitBy:null,
    lastBounceSideSameHit:null, bouncesSinceHit:0, servePhase:false,
    serveBounceSeq:[], pendingServe:null, trail:[] };
}

function stepBall(ball, dt, onBounce, onNet, onOut){
  if (!ball.alive) return;
  var prevY = ball.y, prevH = ball.h;
  var speed = Math.hypot(ball.vx, ball.vy);
  var ax = clamp(0.18*ball.sideSpin*speed, -3, 3);
  var ah = clamp(-0.08*ball.topSpin*speed, -1.5, 1.5);
  ball.vx += ax*dt;
  ball.vh += (ah - GRAVITY)*dt;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;
  ball.h += ball.vh*dt;

  // net crossing
  if (!ball.alive) return;
  if ((prevY - TABLE.netY) * (ball.y - TABLE.netY) < 0){
    if (ball.h < TABLE.netHeight + BALL_RADIUS){
      ball.vy = -ball.vy*0.15;
      ball.vx *= 0.8;
      if (onNet) onNet(ball);
    }
  }

  // table bounce
  if (ball.h <= 0 && ball.vh < 0 && ball.x >= -0.05 && ball.x <= TABLE.width+0.05 && ball.y >= -0.05 && ball.y <= TABLE.length+0.05){
    ball.h = 0;
    ball.vy *= (1 + 0.10*ball.topSpin);
    ball.vh = -ball.vh * (0.87 - 0.08*ball.topSpin);
    ball.vx += 0.06*ball.sideSpin*Math.abs(ball.vy);
    ball.vx *= 0.99; ball.vy *= 0.99;
    ball.topSpin *= 0.72; ball.sideSpin *= 0.72;
    var side = ball.y < TABLE.netY ? 'human' : 'ai';
    if (onBounce) onBounce(ball, side);
  }

  // out of play volume
  if (ball.y < -0.5 || ball.y > TABLE.length+0.5 || ball.x < -0.6 || ball.x > TABLE.width+0.6 || ball.h < -1.0){
    if (onOut) onOut(ball);
  }

  ball.trail.push({x:ball.x,y:ball.y,h:ball.h,t:0});
  if (ball.trail.length > 10) ball.trail.shift();
  for (var i=0;i<ball.trail.length;i++) ball.trail[i].t += dt;
}

/* Solve a launch velocity that lands the ball at (targetX,targetY,0) over time T,
   stepping T upward until the flight clears the net by the required margin
   (or falls back to a slow high arc rather than firing it through the net). */
function solveShot(ball, targetX, targetY, baseT){
  var g = GRAVITY;
  var T = clamp(baseT||0.52, 0.22, 0.95);
  var vx, vy, vh, cleared=false;
  var guard = 0;
  while (T <= 0.95+1e-6 && guard < 30){
    vx = (targetX - ball.x)/T;
    vy = (targetY - ball.y)/T;
    vh = (0 - ball.h + 0.5*g*T*T)/T;
    var tn = (TABLE.netY - ball.y)/vy;
    if (tn > 0 && tn < T){
      var hAtNet = ball.h + vh*tn - 0.5*g*tn*tn;
      if (hAtNet > TABLE.netHeight + 0.04){ cleared = true; break; }
    } else {
      cleared = true; break;
    }
    T += 0.02; guard++;
  }
  if (!cleared){
    T = 1.0;
    vx = (targetX - ball.x)/T;
    vy = (targetY - ball.y)/T;
    vh = (0 - ball.h + 0.5*g*T*T)/T * 1.18;
  }
  return { vx:vx, vy:vy, vh:vh, T:T };
}

/* Resolve a paddle contact: computes power/control quality from timing + offset,
   applies paddle stats + spin selection, and launches the ball toward the chosen
   lane/depth target with aim error inversely proportional to control quality. */
function resolveHit(ball, hitterSide, opts){
  var timingQ = clamp(1 - Math.abs(opts.timingError)/TIMING_WINDOW, 0, 1);
  var centerQ = clamp(1 - Math.abs(opts.offset), 0, 1);
  var chg = opts.charge || 0;                                   // 0..1 hold-to-charge: more power + spin, wider aim error
  var power = Math.min(1.35, 0.55 + 0.45*timingQ + 0.35*chg);
  var control = 0.55 + 0.45*centerQ;
  var aimErrorM = (1-control) * 0.18 + chg*0.10*(1 - 0.5*timingQ);
  var finalTargetX = clamp(opts.targetX + randRange(-aimErrorM, aimErrorM), BALL_RADIUS, TABLE.width - BALL_RADIUS);

  var baseT = lerp(0.78, 0.52, power) / Math.max(0.5, opts.paddleStats.power);
  baseT *= (opts.speedMul || 1); // rally mode speeds the ball up as the rally grows
  var shot = solveShot(ball, finalTargetX, opts.targetY, baseT);

  ball.vx = shot.vx; ball.vy = shot.vy; ball.vh = shot.vh;
  ball.topSpin = opts.spinTop * opts.paddleStats.spin * (0.5+0.5*timingQ) * (1 + 0.6*chg);
  ball.sideSpin = opts.spinSide * opts.paddleStats.spin * (0.5+0.5*timingQ) * (1 + 0.6*chg);
  ball.lastHitBy = hitterSide;
  ball.lastBounceSideSameHit = null;
  ball.bouncesSinceHit = 0;
  // Any hit ends serve-phase bookkeeping -- the serve's own bounce sequence is only
  // relevant up until it is first legally returned (executeServe re-arms it right
  // after this call for the serve itself). Leaving it set after a return hit was
  // the bug that let a later, unrelated bounce get misread as part of the original
  // serve's legality check and award a contradictory point.
  ball.servePhase = false;

  ball.fxPending = { power:power, timingQ:timingQ, by:hitterSide, x:ball.x, y:ball.y, h:ball.h };
  SFX.paddleHit(power);
  return { power:power, control:control, timingQ:timingQ, centerQ:centerQ };
}

function targetCoords(laneIndex, depthIndex, towardAi){
  var x = LANE_FRACS[laneIndex] * TABLE.width;
  var yHuman = depthIndex===0 ? DEPTH_SHORT : DEPTH_LONG; // distance measured from y=0 end
  var y = towardAi ? yHuman : (TABLE.length - yHuman);
  return { x:x, y:y };
}

/* ---------- projection (fixed 1280x720 design resolution via Phaser Scale.FIT) ---------- */
MatchScene.prototype.project = function(x,y,h){
  var W = this.scale.width;
  var t = clamp(y/TABLE.length, 0, 1);
  var tableWidthPx = lerp(405,327,t);
  var centerX = W/2;
  var leftPx = centerX - tableWidthPx/2;
  var screenX = leftPx + (x/TABLE.width)*tableWidthPx;
  var groundY = lerp(645,225,t);
  var screenY = groundY - h*lerp(150,85,t);
  return { x:screenX, y:screenY, groundY:groundY, scale:tableWidthPx/TABLE.width };
};
MatchScene.prototype.screenXToTableX = function(sx, y){
  var W = this.scale.width;
  var t = clamp(y/TABLE.length, 0, 1);
  var tableWidthPx = lerp(405,327,t);
  var centerX = W/2;
  var leftPx = centerX - tableWidthPx/2;
  return clamp((sx-leftPx)/tableWidthPx * TABLE.width, 0, TABLE.width);
};

/* ---------- leaving a match / tournament flow ---------- */

MatchScene.prototype.earn = function(c, x){
  var sv = this.save, e = this.earned, before = levelInfo(sv.xp).lvl;
  sv.coins = (sv.coins||0) + c; sv.xp = (sv.xp||0) + x; e.coins += c; e.xp += x;
  var after = levelInfo(sv.xp).lvl;
  for (var L = before+1; L <= after; L++){ var b = 20*L; sv.coins += b; e.coins += b; e.levelUps.push(L); }
  Save.save(sv);
};

MatchScene.prototype.matchRewards = function(won){
  if (this.surv){ if (won) this.earn(12 + 6*this.surv.level, 20 + 3*this.surv.level); else this.earn(3, 8); return; }
  if (!won){ this.earn(5, 10); return; }
  var mul = this.daily ? 1 : ({easy:0.8, normal:1, hard:1.3}[this.diffKey] || 1);
  this.earn(Math.round(25*mul), 30);
  if (this.mode === 'tourney'){
    this.earn(15*(this.oppIndex+1), 10*(this.oppIndex+1));
    if (this.oppIndex === OPPONENTS.length-1) this.earn(150, 100);
  }
  if (this.daily){
    var d = this.save.daily, t = dayKey(0);
    if (!(d.date === t && d.won)){
      d.streak = (d.lastWon === dayKey(-1)) ? d.streak + 1 : 1;
      d.date = t; d.won = true; d.lastWon = t; this.save.dailyBest = Math.max(this.save.dailyBest||0, d.streak);

};
MatchScene.prototype.leaveMatch = function(){
  if (this.leaving) return;
  this.leaving = true;
  var m = this.match;
  if (this.mode === 'tourney' && m.matchWinner === 'human' && this.oppIndex < OPPONENTS.length-1)
    this.scene.start('Match', { mode:'tourney', round:this.oppIndex+1 });
  else if (this.surv && m.matchWinner === 'human') this.scene.start('Match', { mode:'survival', level:this.surv.level+1, lives:this.surv.lives });
  else if (this.surv && this.surv.lives > 1) this.scene.start('Match', { mode:'survival', level:this.surv.level, lives:this.surv.lives-1 });
  else this.scene.start('Menu');
};

/* ---------- target practice ---------- */
var ZONE_LANE_EDGES = [0, 0.36, 0.64, 1];
var ZONE_DEPTH_EDGES = [TABLE.netY + 0.10, 2.27, TABLE.length];
function zoneOf(x, y){
  var f = x / TABLE.width;
  var lane = f < ZONE_LANE_EDGES[1] ? 0 : (f < ZONE_LANE_EDGES[2] ? 1 : 2);
  return (y < ZONE_DEPTH_EDGES[1] ? 0 : 1)*3 + lane;
}
function zoneName(i){ return (i<3?'SHORT ':'DEEP ') + LANE_NAMES[i%3]; }
MatchScene.prototype.zonePoints = function(i){
  var lane = i%3, dep = i<3?0:1;
  var x0 = ZONE_LANE_EDGES[lane]*TABLE.width, x1 = ZONE_LANE_EDGES[lane+1]*TABLE.width;
  var y0 = ZONE_DEPTH_EDGES[dep], y1 = ZONE_DEPTH_EDGES[dep+1];
  var a = this.project(x0+0.02,y0+0.02,0), b = this.project(x1-0.02,y0+0.02,0), c = this.project(x1-0.02,y1-0.02,0), d = this.project(x0+0.02,y1-0.02,0);
  return [{x:a.x,y:a.y},{x:b.x,y:b.y},{x:c.x,y:c.y},{x:d.x,y:d.y}];
};
MatchScene.prototype.targetLanded = function(ball){
  var t = this.target;
  if (t.resolved || this.match.state === 'rallyOver') return;
  t.resolved = true; t.shots++;
  var zone = zoneOf(ball.x, ball.y), p = this.project(ball.x, ball.y, 0), txt, col;
  if (zone === t.lit){
    t.combo++; t.hits++;
    var pts = 10 + Math.min(t.combo-1, 5)*2;
    t.score += pts; txt = '+' + pts + (t.combo > 1 ? '  x' + t.combo : ''); col = '#FCDE5A';
    SFX.pointPlayer();
    this.addRing(p.x, p.y, 4, 46, 520, 0xFCDE5A, 0.95, 0.4);
    this.addSparks(p.x, p.y, 14, 0, -1, 3.2, 150, 600, 0xFCDE5A, 2.6);
  } else {
    t.combo = 0; t.score += 2; txt = '+2'; col = '#9FE1CB';
  }
  t.float = { text:txt, color:col, x:p.x, y:p.y - 18, at:this.time.now };
};
MatchScene.prototype.targetPoint = function(winner, reason){
  var m = this.match, t = this.target;
  if (m.state === 'rallyOver') return;
  if (!t.resolved){
    t.combo = 0; t.shots++;
    t.float = { text:'MISS', color:'#F09595', x:640, y:430, at:this.time.now };
  }
  t.resolved = false;
  var prev = t.lit; do { t.lit = Math.floor(Math.random()*6); } while (t.lit === prev);
  m.pointMsg = ''; m.pointWinner = 'human';
  m.server = 'ai'; m.state = 'pointPause'; m.pointTimer = 0.55;

MatchScene.prototype.endTarget = function(){
  var m = this.match, t = this.target;
  if (m.state === 'rallyOver') return;
  m.state = 'rallyOver'; m.overT = 0;
  this.ball.alive = false;
  t.newBest = t.score > t.startBest && t.score > 0;
  this.earn(Math.floor(t.score/25), Math.floor(t.score/10)); this.showEarn(486);
  if (t.score > (this.save.targetBest||0)){ this.save.targetBest = t.score; Save.save(this.save); this.checkAch({}); }
  if (t.newBest) SFX.gameWin(); else SFX.gameLose();

  u.hint.setText(this.touchUi ? 'Tap anywhere to play again' : 'Press Space or click to play again   ·   Esc for menu');

/* ---------- return trainer ---------- */
MatchScene.prototype.trainerLanded = function(ball){
  var t = this.trn;
  if (t.resolved || this.match.state === 'rallyOver') return;
  t.resolved = true; t.returned++;
  SFX.pointPlayer();
  var p = this.project(ball.x, ball.y, 0), onT = false;
  if (t.serve){
    t.lastZone = zoneOf(ball.x, ball.y); onT = t.lastZone === t.lit; t.lastHit = onT; if (onT) t.hits++;
    this.hitFeedback = onT ? { text:'ON TARGET!', color:'#FCDE5A', at:this.time.now } : { text:'IN  ·  ' + zoneName(t.lastZone), color:'#9FE1CB', at:this.time.now };
  }
  this.addRing(p.x, p.y, 4, onT ? 52 : 38, 460, onT ? 0xFCDE5A : 0x9FE1CB, 0.9, 0.4);

MatchScene.prototype.trainerPoint = function(winner, reason){
  var m = this.match, t = this.trn;
  if (m.state === 'rallyOver') return;
  if (!t.serve && reason === 'Serve fault' && !t.resolved){                    // a bad feed doesn't count against you: just feed again
    m.pointMsg = ''; m.server = 'ai'; m.state = 'pointPause'; m.pointTimer = 0.85; return;
  }
  var landed = t.resolved;
  t.ball++; t.resolved = false;
  if (t.serve){ var pl = t.lit; do { t.lit = Math.floor(Math.random()*6); } while (t.lit === pl); }   // next target zone
  if (t.ball >= t.total){ this.endTrainer(); return; }
  m.pointMsg = landed ? '' : (t.serve ? 'FAULT' : 'MISSED'); m.pointWinner = landed ? 'human' : 'ai'; m.msgPopAt = this.time.now;
  m.server = t.serve ? 'human' : 'ai'; m.state = 'pointPause'; m.pointTimer = 0.85;
};
MatchScene.prototype.endTrainer = function(){
  var m = this.match, t = this.trn;
  if (m.state === 'rallyOver') return;
  m.state = 'rallyOver'; m.overT = 0;
  this.ball.alive = false;
  var score = t.serve ? t.hits : t.returned;                       // serving is scored on target hits, returns on balls returned
  var best = this.save.trainerBest[t.drill] || 0, nb = score > best && score > 0;
  if (nb){ this.save.trainerBest[t.drill] = score; Save.save(this.save); }
  this.earn(Math.floor(score/4) + (t.serve ? Math.floor(t.returned/5) : 0), score*2 + (t.serve ? t.returned : 0)); this.showEarn(486);
  if (nb) SFX.gameWin(); else SFX.gameLose();
  var avg = t.n ? t.sum/t.n : 0, ms = Math.round(Math.abs(avg)*1000);
  var tend = !t.n ? 'No swings this time - give it another go' : ms < 20 ? 'Your timing is well centered' : avg > 0 ? 'You swing early by about ' + ms + ' ms - wait a touch longer' : 'You swing late by about ' + ms + ' ms - start a touch sooner';
  var u = this.rallyUi, dn = TRAINER_DRILLS.filter(function(d){ return d.key === t.drill; })[0].name;
  u.title.setText(nb ? 'NEW BEST!' : 'DRILL COMPLETE'); u.title.setColor(nb ? '#FCDE5A' : '#EAF3E7');
  if (t.serve){
    u.label.setText('SERVING DRILL  ·  ON TARGET');
    u.count.setText(t.hits + '/' + t.total);
    u.best.setText('In ' + t.returned + '   ·   Toss timing: perfect ' + t.q.perfect + ', good ' + t.q.good + ', weak ' + t.q.weak);
    tend = t.returned < 14 ? 'Too many faults - hit the serve at the top of the toss' : t.hits >= 14 ? 'Excellent placement' : 'Pick the glowing zone before you serve (keys 1-6)';
  } else {
    u.label.setText(dn.toUpperCase() + ' DRILL  ·  RETURNED');
    u.count.setText(t.returned + '/' + t.total);
    u.best.setText('Perfect ' + t.perfect + '   ·   Good ' + t.good + '   ·   Early ' + t.early + '   ·   Late ' + t.late);
  }
  u.hint.setText(tend + '   ·   ' + (this.touchUi ? 'Tap to run it again' : 'Space to run it again'));
  for (var k in u) if (k !== 'g') u[k].setVisible(true);
};

/* ---------- rally challenge ---------- */
MatchScene.prototype.countRallyReturn = function(){
  var r = this.rally;

MatchScene.prototype.rallyPoint = function(winner, reason){
  var m = this.match;

  m.pointMsg = 'Bot slipped\n\nKeep going!';

  u.hint.setText(this.touchUi ? 'Tap anywhere to play again' : 'Press Space or click to play again   ·   Esc for menu');
  for (var k in u) if (k !== 'g') u[k].setVisible(true);
};
MatchScene.prototype.buildRallyUi = function(){
  var st = {fontFamily:'Georgia,serif', color:'#EAF3E7', align:'center'};
  this.rallyUi = {
    g:     this.add.graphics().setDepth(100),
    title: this.add.text(640, 190, '', Object.assign({}, st, {fontSize:'44px'})).setOrigin(0.5).setDepth(101),

    best:  this.add.text(640, 448, '', {fontFamily:'Arial', fontSize:'22px', color:'#EAF3E7'}).setOrigin(0.5).setDepth(101),
    hint:  this.add.text(640, 520, '', {fontFamily:'Arial', fontSize:'16px', color:'#b8aee0'}).setOrigin(0.5).setDepth(101),
    menu:  this.add.text(640, 588, 'BACK TO MENU', {fontFamily:'Arial', fontSize:'16px', color:'#EAF3E7', fontStyle:'bold'}).setOrigin(0.5).setDepth(101)
  };

MatchScene.prototype.updateRallyOver = function(dt){
  var m = this.match; m.overT += dt;
  var g = this.rallyUi.g; g.clear();
  g.fillStyle(0x0b0a14, 0.9); g.fillRect(0, 0, 1280, 720);
  g.fillStyle(0x241a3a, 1); g.fillRoundedRect(400, 120, 480, 500, 18);
  g.lineStyle(2, 0x4a3d6b, 1); g.strokeRoundedRect(400, 120, 480, 500, 18);
  g.fillStyle(0x3c3489, 1); g.fillRoundedRect(540, 564, 200, 44, 10);
  g.lineStyle(2, 0xF2A34C, 1); g.strokeRoundedRect(540, 564, 200, 44, 10);

/* ---------- doubles: four players, real rules ----------
   Serve order cycles you -> opp1 -> partner -> opp2 (2 points each, 1 each at deuce); the receiver of each serve is the next
   player in that order. Partners alternate hits: whoever hit last, their partner hits next. Serves go diagonally:
   bounce on the server's right half, then the receiver's right half. */
MatchScene.prototype.doublesOrder = function(gameNum){ return (gameNum % 2 === 1) ? ['you','a1','pt','a2'] : ['a1','you','a2','pt']; };
MatchScene.prototype.actorOf = function(id){ return id === 'you' ? this.human : id === 'pt' ? this.pt : id === 'a1' ? this.ai : this.ai2; };
MatchScene.prototype.nameOf = function(id){ return id === 'you' ? 'You' : id === 'pt' ? PARTNER.short : id === 'a1' ? OPPONENTS[this.oppIndex].short : this.opp2.short; };
MatchScene.prototype.setDoublesServe = function(){
  var m = this.match, t = m.score.human + m.score.ai;
  var k = t < 20 ? Math.floor(t/2) % 4 : (10 + (t-20)) % 4;
  var o = this.doublesOrder(m.gameNum);
  m.serverPlayer = o[k]; m.receiverPlayer = o[(k+1) % 4]; m.server = D_TEAM[m.serverPlayer];
  if (m.swapTeam && D_TEAM[m.receiverPlayer] === m.swapTeam) m.receiverPlayer = D_MATE[m.receiverPlayer];   // after the change of ends the receiving pair swaps its order
  m.next = {}; m.next[D_TEAM[m.serverPlayer]] = m.serverPlayer; m.next[D_TEAM[m.receiverPlayer]] = m.receiverPlayer;
};
MatchScene.prototype.humanServes = function(){ var m = this.match; return this.isDoubles ? m.serverPlayer === 'you' : m.server === 'human'; };
MatchScene.prototype.serverName = function(){ var m = this.match;
  if (!this.isDoubles) return m.server === 'human' ? 'You' : this.opponent.name;
  return this.nameOf(m.serverPlayer) + (m.receiverPlayer ? '  →  ' + this.nameOf(m.receiverPlayer) : ''); };
MatchScene.prototype.updateDoublesActors = function(dt){
  var self = this, ball = this.ball, m = this.match, W = TABLE.width;
  ['pt','a1','a2'].forEach(function(id){
    var ac = self.actorOf(id), team = D_TEAM[id], mate = self.actorOf(D_MATE[id]);
    var tier = id === 'pt' ? self.ptTier : id === 'a1' ? self.aiTier : self.ai2Tier;
    var isNext = m.next && m.next[team] === id;
    var incoming = !ball.servePhase && ball.alive && (team === 'ai' ? (ball.vy > 0 && ball.lastHitBy !== 'ai') : (ball.vy < 0 && ball.lastHitBy !== 'human'));
    var strikeY = team === 'ai' ? STRIKE_Y_AI : STRIKE_Y_HUMAN;
    if (ac.reactTimer > 0) ac.reactTimer -= dt*1000;
    if (isNext && incoming){
      if (ac.reactTimer <= 0 && Math.abs(ball.vy) > 0.01){
        var tA = (strikeY - ball.y)/ball.vy;
        if (tA > 0) ac.targetX = clamp(ball.x + ball.vx*tA, PADDLE_X_MIN, PADDLE_X_MAX);
      }
    } else if (isNext){
      // ready stance: servers and receivers wait in their right half, everyone else near the middle
      var right = team === 'human' ? 0.72 : 0.28;
      ac.targetX = (m.serverPlayer === id || m.receiverPlayer === id) ? W*right : W*0.5;
    } else {
      ac.targetX = clamp(mate.x < W/2 ? mate.x + 0.62 : mate.x - 0.62, PADDLE_X_MIN, PADDLE_X_MAX);   // clear the way for the partner
    }
    var maxStep = tier.paddleSpeed*dt, old = ac.x;
    ac.x = clamp(ac.x + clamp(ac.targetX - ac.x, -maxStep, maxStep), PADDLE_X_MIN, PADDLE_X_MAX);
    ac.vx = lerp(ac.vx || 0, dt > 0 ? (ac.x - old)/dt : 0, 0.3);
  });
};
MatchScene.prototype.checkDoublesAiHits = function(){
  var ball = this.ball, m = this.match;
  if (ball.servePhase || ball.diagCheck || !m.next) return;       // a serve has to bounce on the receiver's side first
  var inH = ball.h >= STRIKE_H_MIN && ball.h <= STRIKE_H_MAX;
  var ida = m.next.ai, aca = this.actorOf(ida);
  if (inH && ball.vy > 0 && ball.lastHitBy !== 'ai' && ball.y >= STRIKE_Y_AI - 0.02 && ball.y <= STRIKE_Y_AI + 0.35 && Math.abs(ball.x - aca.x) <= PADDLE_HALF_W*1.3)
    this.doublesAiHit(ida);
  if (m.next.human === 'pt' && inH && ball.vy < 0 && ball.lastHitBy !== 'human' && ball.y <= STRIKE_Y_HUMAN + 0.02 && ball.y >= STRIKE_Y_HUMAN - 0.35 && Math.abs(ball.x - this.pt.x) <= PADDLE_HALF_W*1.5)
    this.doublesAiHit('pt');
};
MatchScene.prototype.doublesAiHit = function(id){
  var ball = this.ball, m = this.match, team = D_TEAM[id], ac = this.actorOf(id);
  var tier = id === 'pt' ? this.ptTier : id === 'a1' ? this.aiTier : this.ai2Tier;
  var style = id === 'pt' ? PARTNER.style : id === 'a1' ? this.opponent.style : this.opp2.style;
  var foe = this.actorOf(team === 'ai' ? m.next.human : m.next.ai);
  ac.reactTimer = tier.reactMs; ac.swingUntil = this.time.now + 180;
  var plan = this.planAiShot(foe.x, style, tier);
  var target = targetCoords(plan.laneIndex, plan.depthIndex, team === 'human');
  resolveHit(ball, team, {
    targetX: target.x, targetY: target.y,
    offset: randRange(-tier.aimErr, tier.aimErr)*(plan.errMul||1)/PADDLE_HALF_W,
    timingError: randRange(-tier.timeErr, tier.timeErr)*(plan.errMul||1),
    paddleStats: PADDLES.starter, spinTop: plan.spinTop, spinSide: plan.spinSide, speedMul: this.pace
  });
  m.next[team] = D_MATE[id]; ball.lastHitter = id;
  this.curRally++;
};
MatchScene.prototype.beginServeSequence = function(){
  var m = this.match;
  this.ball = makeBall();
  if (this.isDoubles) this.setDoublesServe();
  var serverIsHuman = this.humanServes();
  this.charge.on = false;
  if (this.scout) this.scout.last = null;                       // only learn from rallies the AI actually played in
  this.rec = []; this.curRally = 0; m.serveCount++; this.pickPrev = null; this.pickSeed = Math.random(); this.swingVar = (Math.random()-0.5)*0.6;
  this.ruleHint = null;
  if (this.isMatch && !this.isDoubles && m.serveCount > 5 && !this.save.hintsSeen){ this.save.hintsSeen = true; Save.save(this.save); }
  if (this.isMatch && !this.isDoubles && !this.save.hintsSeen && m.serveCount <= 5){
    var holdw = this.touchUi ? 'Hold SWING' : 'Hold Space';
    var tapw = this.touchUi ? 'Tap SWING' : 'Press Space', aimw = this.touchUi ? 'the AIM buttons' : 'keys 1-6';
    this.ruleHint = serverIsHuman
      ? ['Serving: ' + tapw + ' at the top of the toss. The ball must bounce on YOUR side first, then clear the net.',
         'Serves swap every 2 points. First to 11 (win by 2) takes the game.',
         'Aim your serve with ' + aimw + ', or leave it and it goes deep to the open side.',
         this.touchUi ? 'Tip: pick a spin on the SPIN buttons under AIM.' : 'Spin: use the SPIN buttons, or hold W/S/Q/E.',
         'Power shot: ' + holdw + ' BEFORE the ball is in range, then release to hit. More charge = more pace and spin, but a wider miss.'][m.serveCount-1]
      : ['Receiving: the ball bounces on their side, then yours. Swing when the prompt says SWING NOW.',
         'Move with ' + (this.touchUi ? 'your thumb (drag)' : 'A/D (or drag)') + ' so the paddle is under the ball.',
         'Green PERFECT timing hits harder and straighter.',
         'Low balls get pushed short with backspin; high balls get attacked.',
         'Power shot: ' + holdw + ' as the ball comes, release when it is in range. Charge a high ball past the line for a SMASH.'][m.serveCount-1];
  }
  if (this.isDoubles){
    if (m.serveCount > 5 && !this.save.doublesHintSeen){ this.save.doublesHintSeen = true; Save.save(this.save); }
    if (!this.save.doublesHintSeen && m.serveCount <= 5){
      this.ruleHint = ['Doubles: serve DIAGONALLY. Bounce it on your right half, then it must land in their right half.',
        'Partners take turns: you hit one ball, ' + PARTNER.short + ' hits the next. The amber marker shows who is up.',
        'The serve passes through all four players, 2 points each. Aim and spin work as usual.',
        'On ' + PARTNER.short + '\'s turn just stay clear. ' + PARTNER.short + ' will play the ball.',
        'On your turn you can still hold Space early for a charged power shot.'][m.serveCount-1];
    }
  }
  this.ball.x = this.isDoubles ? this.actorOf(m.serverPlayer).x : TABLE.width/2;
  this.ball.y = m.server === 'human' ? STRIKE_Y_HUMAN : STRIKE_Y_AI;
  this.ball.h = 0.30;
  this.ball.alive = false;
  this.ball.servePhase = true;
  this.ball.serveBounceSeq = [];
  this.serveToss = { active:true, t:0, window: serverIsHuman?2.2:0.001 };
  m.state = 'serveToss';
  if (!serverIsHuman){
    this.aiServeTimer = randRange(0.5,0.9);
  }
};

/* A legal serve has to bounce on the SERVER'S OWN side before crossing to the
   receiver -- one paddle hit can't physically produce two separately-aimed
   bounces from a single solveShot call (that solver aims one flight at one
   landing point). So a serve is executed as two legs: an initial, lightly-aimed
   toss-hit that lands on the server's own side (this is the only part resolved
   here), then onBallBounce redirects the ball toward the real chosen target the
   instant that first bounce happens -- see the servePhase handling there. */
MatchScene.prototype.executeServe = function(side, quality){
  var m = this.match;
  var ball = this.ball;
  ball.alive = true;
  var towardAi = side === 'human';
  var laneIndex, depthIndex, spinTop, spinSide, offset, timingError, paddleStats;
  if (side === 'human' && this.humanServes()){
    laneIndex = this.human.laneIndex; depthIndex = this.human.depthIndex;
    spinTop = this.human.spinTop; spinSide = this.human.spinSide;
    paddleStats = this.paddleStats;
    offset = 0; timingError = (1-quality)*TIMING_WINDOW*0.6;
  } else {
    var plan = this.planAiServe();
    laneIndex = plan.laneIndex; depthIndex = plan.depthIndex; spinTop = plan.spinTop; spinSide = plan.spinSide;
    paddleStats = PADDLES.starter;
    offset = plan.offsetNoise; timingError = plan.timingNoise;
  }
  if (this.trn && this.trn.serve && side === 'human'){ var tq = this.trn.q; if (quality >= 0.8) tq.perfect++; else if (quality >= 0.5) tq.good++; else tq.weak++; }
  var realTarget = targetCoords(laneIndex, depthIndex, towardAi);
  ball.pendingServe = { targetX: realTarget.x, targetY: realTarget.y, offset: offset, timingError: timingError,
    paddleStats: paddleStats, spinTop: spinTop, spinSide: spinSide };

  var ownY = side === 'human' ? SERVE_OWN_Y_HUMAN : SERVE_OWN_Y_AI;
  var ownX = LANE_FRACS[laneIndex] * TABLE.width;
  if (this.isDoubles){                                  // diagonal serve: own right half -> receiver's right half
    var lowF = [0.08,0.20,0.32], highF = [0.68,0.80,0.92], srvNear = side === 'human';
    ownX = (srvNear ? highF : lowF)[laneIndex] * TABLE.width;
    ball.pendingServe.targetX = (srvNear ? lowF : highF)[laneIndex] * TABLE.width;
    ball.diagCheck = true; ball.diagSide = srvNear ? 'ai' : 'human'; ball.diagLow = srvNear;
    m.next[side] = D_MATE[m.serverPlayer]; ball.lastHitter = m.serverPlayer;
    this.actorOf(m.serverPlayer).swingUntil = this.time.now + 180;
  }
  var shot = solveShot(ball, ownX, ownY, 0.30);
  ball.vx = shot.vx; ball.vy = shot.vy; ball.vh = shot.vh;
  ball.topSpin = 0; ball.sideSpin = 0;
  ball.lastHitBy = side;
  ball.servePhase = true;
  ball.serveBounceSeq = [];
  SFX.paddleHit(0.4);
  this.curRally = 1;
  if (this.mode === 'target') this.target.started = true;
  m.state = 'rally';
};

MatchScene.prototype.planAiServe = function(){
  if (this.trn){                                                 // trainer: the machine feeds the chosen spin
    var d = this.trn.drill, pk = d === 'mixed' ? ['top','back','side'][Math.floor(Math.random()*3)] : d;
    this.trn.cur = pk;
    return { laneIndex:Math.floor(Math.random()*3), depthIndex:Math.random() < 0.5 ? 0 : 1, spinTop: pk === 'top' ? 1 : pk === 'back' ? -1 : 0,
      spinSide: pk === 'side' ? (Math.random() < 0.5 ? -1 : 1) : 0, offsetNoise:0, timingNoise:0 };
  }
  var tier = this.aiTier;
  var laneIndex = Math.floor(randRange(0,3));
  var depthIndex = Math.random() < 0.5 ? 0 : 1;
  var useSpin = Math.random() < tier.spinUse;
  var spinTop = useSpin ? (Math.random()<0.5?1:-1) : 0;
  var spinSide = (useSpin && Math.random()<0.5) ? (Math.random()<0.5?-1:1) : 0;
  return { laneIndex:laneIndex, depthIndex:depthIndex, spinTop:spinTop, spinSide:spinSide,
    offsetNoise: randRange(-tier.aimErr,tier.aimErr), timingNoise: randRange(-tier.timeErr,tier.timeErr) };
};

/* ============================================================
   UPDATE
   ============================================================ */
MatchScene.prototype.update = function(t, dtMs){
  var dt = Math.min(dtMs/1000, 0.05);
  var m = this.match;

  var escNow = this.keys.esc.isDown, escEdge = escNow && !this.prevEsc; this.prevEsc = escNow;
  if (escEdge){
    if (this.paused) this.setPause(false);
    else if (m.state === 'rallyOver' || m.state === 'matchOver' || m.state === 'intro'){ this.scene.start('Menu'); return; }
    else this.setPause(true);
  }
  if (this.paused){ this.updatePause(); return; }

  this.handleContinuousInput(dt);

  if (this.mode === 'target' && this.target.started && m.state !== 'rallyOver'){
    this.target.timeLeft -= dt;
    if (this.target.timeLeft <= 0){ this.target.timeLeft = 0; this.endTarget(); }
  }

  if (m.state === 'rallyOver'){
    this.updateRallyOver(dt);
  } else if (m.state === 'intro'){
    this.updateIntro(dt);
  } else if (m.state === 'serveToss'){
    this.updateServeToss(dt);
  } else if (m.state === 'rally'){
    this.updateRally(dt);
  } else if (m.state === 'pointPause'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()){
      this.advanceAfterPoint();
    }
  } else if (m.state === 'gameOver'){
    m.pointTimer -= dt;
    if (m.pointTimer <= 0 || this.pressedEnter()) this.startNextGame();
  } else if (m.state === 'matchOver'){
    m.overT += dt;
    var pe = this.pressedEnter(), ps = this.pressedSpace();
    if (m.overT > 0.6 && (pe || ps)) this.leaveMatch();
  }

  this.render();
};

/* ---------- pause ---------- */
var PAUSE_BTNS = [ {k:'resume', t:'Resume', y:300}, {k:'restart', t:'Restart', y:364}, {k:'quit', t:'Quit to menu', y:428} ];
MatchScene.prototype.canPause = function(){
  var st = this.match.state;
  return !this.paused && (st === 'serveToss' || st === 'rally' || st === 'pointPause' || st === 'gameOver');
};
MatchScene.prototype.setPause = function(v){
  if (v === this.paused) return;
  if (v && !this.canPause()) return;
  this.paused = v; this.charge.on = false; this.touchHeld = false; this.touchHeldId = null;
  if (!this.pauseUi){
    var st = {fontFamily:'Arial', fontSize:'18px', color:'#EAF3E7', fontStyle:'bold'};
    var u = { g:this.add.graphics().setDepth(200), title:this.add.text(640, 232, 'PAUSED', {fontFamily:'Georgia,serif', fontSize:'44px', color:'#EAF3E7'}).setOrigin(0.5).setDepth(201), labels:[] };
    for (var i=0;i<PAUSE_BTNS.length;i++) u.labels.push(this.add.text(640, PAUSE_BTNS[i].y, PAUSE_BTNS[i].t, st).setOrigin(0.5).setDepth(201));
    u.hint = this.add.text(640, 500, 'Esc / Space to resume', {fontFamily:'Arial', fontSize:'14px', color:'#b8aee0'}).setOrigin(0.5).setDepth(201);
    this.pauseUi = u;
  }
  var u2 = this.pauseUi;
  u2.title.setVisible(v); u2.hint.setVisible(v);
  for (var j=0;j<u2.labels.length;j++) u2.labels[j].setVisible(v);
  u2.g.clear();
  if (v){
    u2.g.fillStyle(0x0b0a14, 0.78); u2.g.fillRect(0, 0, 1280, 720);
    for (var k=0;k<PAUSE_BTNS.length;k++){
      var b = PAUSE_BTNS[k];
      u2.g.fillStyle(k === 0 ? 0xF2A34C : 0x3c3489, 1); u2.g.fillRoundedRect(540, b.y-23, 200, 46, 10);
      if (k === 0) u2.labels[k].setColor('#2c1a05'); else u2.labels[k].setColor('#EAF3E7');
    }
    this.prevSpace = this.keys.space.isDown; this.prevEnter = this.keys.enter.isDown;
    this.pPrevA = this.keys.space.isDown; this.pPrevB = this.keys.enter.isDown;
  } else {
    // swallow keys still held from the pause screen so resuming never fires a serve / swing
    this.prevSpace = true; this.prevEnter = true; this.pointerDown = false; this.movePointerId = null;
    this.touchBtnAt = -9999;
  }
};
MatchScene.prototype.updatePause = function(){
  var a = this.keys.space.isDown, b = this.keys.enter.isDown;
  var edge = (a && !this.pPrevA) || (b && !this.pPrevB);
  this.pPrevA = a; this.pPrevB = b;
  if (edge) this.setPause(false);
};
MatchScene.prototype.pauseClick = function(x, y){
  if (x < 540 || x > 740) return;
  for (var i=0;i<PAUSE_BTNS.length;i++){
    var b = PAUSE_BTNS[i];
    if (y >= b.y-23 && y <= b.y+23){
      if (b.k === 'resume') this.setPause(false);
      else if (b.k === 'restart') this.scene.restart(this.surv ? { mode:'survival', level:1, lives:3 } : this.cfg);
      else this.scene.start('Menu');
      return;
    }
  }
};

MatchScene.prototype.inTouchBtn = function(x, y){
  var b = this.touchBtn, dx = x - b.x, dy = y - b.y;
  return dx*dx + dy*dy <= (b.r+10)*(b.r+10);
};
// a touch tap counts once, and only if it is fresh (so a tap during a pause can't fire a later serve)
MatchScene.prototype.takeTouchTap = function(){
  if (!this.touchUi) return false;
  if (this.time.now - this.touchBtnAt < 160){ this.touchBtnAt = -9999; return true; }
  return false;
};
MatchScene.prototype.pressedSpace = function(){
  var now = this.keys.space.isDown;
  var edge = now && !this.prevSpace;
  this.prevSpace = now;
  var st = this.match.state;
  if (st === 'serveToss' || st === 'rally' || st === 'matchOver' || st === 'intro' || st === 'rallyOver') edge = this.takeTouchTap() || edge;
  return edge;
};
MatchScene.prototype.pressedEnter = function(){
  var now = this.keys.enter.isDown;
  var edge = now && !this.prevEnter;
  this.prevEnter = now;
  var st = this.match.state;
  if (st === 'pointPause' || st === 'gameOver') edge = this.takeTouchTap() || edge;
  return edge;
};

MatchScene.prototype.handleContinuousInput = function(dt){
  var h = this.human;
  var speed = 1.9;
  if (this.keys.left.isDown || this.keys.a.isDown) h.x -= speed*dt;
  if (this.keys.right.isDown || this.keys.d.isDown) h.x += speed*dt;
  if (this.pointerDown && this.pointerX != null){
    var ty = STRIKE_Y_HUMAN;
    var tx = this.screenXToTableX(this.pointerX, ty);
    h.x += clamp(tx - h.x, -speed*dt, speed*dt);
  }
  h.x = clamp(h.x, PADDLE_X_MIN, PADDLE_X_MAX);

  var nowMs = this.time.now;
  if (this.keys.one.isDown || this.keys.two.isDown || this.keys.three.isDown ||
      this.keys.four.isDown || this.keys.five.isDown || this.keys.six.isDown) this.manualZoneAt = nowMs;
  if (this.keys.w.isDown || this.keys.s.isDown || this.keys.q.isDown || this.keys.e.isDown || this.mobileSpinLock) this.manualSpinAt = nowMs;
  if (this.keys.one.isDown){ h.laneIndex=0; h.depthIndex=0; }
  else if (this.keys.two.isDown){ h.laneIndex=1; h.depthIndex=0; }
  else if (this.keys.three.isDown){ h.laneIndex=2; h.depthIndex=0; }
  else if (this.keys.four.isDown){ h.laneIndex=0; h.depthIndex=1; }
  else if (this.keys.five.isDown){ h.laneIndex=1; h.depthIndex=1; }
  else if (this.keys.six.isDown){ h.laneIndex=2; h.depthIndex=1; }

  if (this.keys.w.isDown) h.spinTop = 1;
  else if (this.keys.s.isDown) h.spinTop = -1;
  else if (!this.mobileSpinLock) h.spinTop = 0;

  if (this.keys.q.isDown && !this.keys.e.isDown) h.spinSide = -1;
  else if (this.keys.e.isDown && !this.keys.q.isDown) h.spinSide = 1;
  else if (!this.mobileSpinLock) h.spinSide = 0;
};

/* AIM strip: six small buttons in the top-left, clear of both players. Index i: 0-2 short L/C/R, 3-5 deep L/C/R. */
var ZONE_STRIP = { x:16, y:50, w:50, h:30, gap:2 };
function applyTouchStrip(){ ZONE_STRIP.w = 54; ZONE_STRIP.h = 40; ZONE_STRIP.gap = 2; SPIN_STRIP.w = 54; SPIN_STRIP.h = 32; SPIN_STRIP.gap = 2; }
MatchScene.prototype.handleZoneTap = function(sx,sy){
  var sp = SPIN_STRIP, spy = spinStripY();
  if (this.mode !== 'target' && sy >= spy - 4 && sy <= spy + sp.h + 4){
    for (var j=0;j<6;j++){
      var sx0 = sp.x + j*(sp.w+sp.gap);
      if (sx >= sx0 && sx <= sx0 + sp.w){ this.spinPick = SPIN_OPTS[j].k; this.applySpinPick(); return true; }
    }
    return false;
  }
  var z = ZONE_STRIP;
  if (sy < z.y - 4 || sy > z.y + z.h + 4) return false;
  for (var i=0;i<6;i++){
    var x0 = z.x + i*(z.w+z.gap);
    if (sx >= x0 && sx <= x0 + z.w){
      this.human.laneIndex = i%3;
      this.human.depthIndex = i<3?0:1;
      this.manualZoneAt = this.time.now;
      return true;
    }
  }
  return false;
};

/* a spin chosen on the SPIN strip beats the automatic one (W/S/Q/E held keys still win while held) */
MatchScene.prototype.applySpinPick = function(){
  if (this.spinPick === 'auto' || this.mode === 'target') return;
  var anyKey = this.keys.w.isDown || this.keys.s.isDown || this.keys.q.isDown || this.keys.e.isDown;
  if (anyKey) return;
  for (var i=0;i<SPIN_OPTS.length;i++) if (SPIN_OPTS[i].k === this.spinPick){
    this.human.spinTop = SPIN_OPTS[i].top; this.human.spinSide = this.isFeed ? 0 : SPIN_OPTS[i].side; return;
  }
};
MatchScene.prototype.pickLabel = function(isServe, manual){
  var h = this.human, b = this.ball;
  var base = isServe ? 'SERVE' : shotKind(h.depthIndex, h.spinTop, b.h);
  var spin = isServe ? (h.spinTop > 0 ? ' · TOPSPIN' : h.spinTop < 0 ? ' · BACKSPIN' : '') : '';
  var side = h.spinSide < 0 ? ' · SIDE-L' : h.spinSide > 0 ? ' · SIDE-R' : '';
  return (manual ? 'MANUAL ' : '') + base + ' ' + (h.depthIndex ? 'DEEP ' : 'SHORT ') + LANE_NAMES[h.laneIndex] + spin + side;
};
MatchScene.prototype.applyAutoServeAim = function(){
  var now = this.time.now, h = this.human;
  // serves use the same scoring as returns (a mid-height ball, you perfectly centred): deep/short, any corner, spin
  var a = pickAutoShot({ x:TABLE.width/2, h:0.22, topSpin:0 }, TABLE.width/2, this.ai, this.aiTier, this.pickPrev, this.assist, this.pickSeed);
  this.pickPrev = a;
  var mz = (now - (this.manualZoneAt||-9999)) < 1500, ms = (now - (this.manualSpinAt||-9999)) < 1500;
  if (!mz){ h.laneIndex = a.laneIndex; h.depthIndex = a.depthIndex; }
  if (this.trn && this.trn.serve){ mz = true; ms = true; }          // serving drill: your own aim and spin, never the auto pick
  if (!ms){ h.spinTop = a.spinTop; h.spinSide = 0; }
  this.applySpinPick();
  this.autoShot = { label: this.pickLabel(true, mz || ms || this.spinPick !== 'auto') };
};

/* ---------- serve toss timing ---------- */
MatchScene.prototype.updateServeToss = function(dt){
  var m = this.match;
  var serverIsHuman = this.humanServes();
  this.serveToss.t += dt;
  var tossT = this.serveToss.t;
  if (this.isDoubles){ this.updateDoublesActors(dt); if (!serverIsHuman) this.ball.x = this.actorOf(m.serverPlayer).x; }
  var peak = 0.9;
  this.ball.h = 0.30 + Math.max(0, (peak - Math.abs(tossT-peak))) * 0.9;

  if (serverIsHuman){
    this.applyAutoServeAim();
    if (this.pressedSpace()){
      var quality = 1 - clamp(Math.abs(tossT-peak)/peak, 0, 1);
      this.human.swingUntil = this.time.now + 180;
      SFX.swing();
      SFX.serveTone();
      this.executeServe('human', quality);
      return;
    }
    if (tossT > this.serveToss.window){
      // double fault on serve timeout
      this.awardPoint('ai', 'Serve fault');
    }
  } else {
    this.aiServeTimer -= dt;
    if (this.aiServeTimer <= 0){
      SFX.serveTone();
      this.executeServe(m.server, 0.85);
    }
  }
};

/* ---------- rally ---------- */
MatchScene.prototype.updateRally = function(dt){
  var self = this;
  var ball = this.ball;
  var steps = Math.max(1, Math.round(dt/DT));
  var subDt = dt/steps;
  for (var i=0;i<steps;i++){
    if (!ball.alive) break;
    stepBall(ball, subDt,
      function(b, side){ self.onBallBounce(b, side); },
      function(b){ SFX.netClip(); self.spawnNetFx(b); b.netTouchedThisFlight = true; },
      function(b){ self.onBallOut(b); }
    );
  }
  this.recPush();
  if (!ball.alive) return;

  if (this.isDoubles) this.updateDoublesActors(dt); else this.updateAiPaddle(dt);
  if (ball.lastHitBy !== 'human' && !ball.servePhase) this.applyAutoAim();
  this.checkHumanSwing();
  if (this.isDoubles) this.checkDoublesAiHits(); else this.checkAiAutoHit();
};

MatchScene.prototype.recPush = function(){
  var b = this.ball, rec = this.rec, now = this.time.now;
  function sw(ac){ if (!ac) return 0; return ac.swingUntil < now ? 0 : clamp(1 - (ac.swingUntil - now)/180, 0, 1); }
  rec.push({ t:now, x:b.x, y:b.y, h:b.h,
    hx:this.human.x, ax:this.ai.x, px:this.pt ? this.pt.x : 0, bx:this.ai2 ? this.ai2.x : 0,
    hs:sw(this.human), as:sw(this.ai), ps:sw(this.pt), bs:sw(this.ai2) });
  while (rec.length > 2 && rec[rec.length-1].t - rec[0].t > 2000) rec.shift();
};
var MP_SLOW = 0.35;   // match-point replay speed
/* where the replay is right now: two recorded frames and the blend between them (null when there is nothing to show) */
MatchScene.prototype.sampleReplay = function(){
  var rec = this.rec;
  if (!rec || rec.length < 3) return null;
  var dur = rec[rec.length-1].t - rec[0].t;
  if (dur < 100) return null;
  var mp = this.mpReplay, el = (this.time.now - this.replayStart) * (mp ? MP_SLOW : 0.5);
  if (mp) el = Math.min(el, dur); else el = el % (dur + 500);      // match point holds on the last frame
  var tt = rec[0].t + Math.min(el, dur);
  var i = 0; while (i < rec.length-1 && rec[i+1].t <= tt) i++;
  var a = rec[i], b = rec[Math.min(i+1, rec.length-1)];
  var k = b.t > a.t ? clamp((tt-a.t)/(b.t-a.t), 0, 1) : 0;
  return { i:i, a:a, b:b, k:k, mp:mp };
};
MatchScene.prototype.drawReplay = function(g){
  var rec = this.rec, rs = this.sampleReplay();
  if (!rs) return;
  var mp = rs.mp, i = rs.i, a = rs.a, b = rs.b, k = rs.k;
  var cx = lerp(a.x,b.x,k), cy = lerp(a.y,b.y,k), ch = lerp(a.h,b.h,k);
  var tl = mp ? 30 : 14;
  for (var j = Math.max(0,i-tl); j < i; j++){
    var p0 = this.project(rec[j].x, rec[j].y, rec[j].h), p1 = this.project(rec[j+1].x, rec[j+1].y, rec[j+1].h);
    g.lineStyle(mp ? 3.5 : 2.5, 0xFCDE5A, 0.15 + 0.5*(j-Math.max(0,i-tl))/tl);
    g.lineBetween(p0.x, p0.y, p1.x, p1.y);
  }
  var sh = this.project(cx, cy, 0), bp = this.project(cx, cy, ch);
  g.fillStyle(COLORS.shadow, 0.35); g.fillEllipse(sh.x, sh.y+2, 12, 4);
  g.fillStyle(0xFCDE5A, 0.35); g.fillCircle(bp.x, bp.y, mp ? 16 : 11);
  g.fillStyle(COLORS.ball, 1); g.fillCircle(bp.x, bp.y, mp ? 8 : 6);
};

/* ---------- hit / bounce / net effects (screen-space rings and sparks) ---------- */
MatchScene.prototype.addRing = function(x, y, r0, r1, life, color, alpha, flat){
  this.fxList.push({ kind:'ring', x:x, y:y, r0:r0, r1:r1, life:life, color:color, alpha:alpha, flat:flat||1, born:this.time.now });
};
MatchScene.prototype.addSparks = function(x, y, n, dirX, dirY, spread, speed, life, color, size){
  var base = Math.atan2(dirY, dirX);
  for (var i=0;i<n;i++){
    var a = base + (Math.random()-0.5)*spread;
    var v = speed*(0.5+Math.random()*0.7);
    this.fxList.push({ kind:'spark', x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:life*(0.7+Math.random()*0.5),
      color:color, size:size*(0.7+Math.random()*0.6), born:this.time.now });
  }
};
MatchScene.prototype.spawnHitFx = function(info){
  var bp = this.project(info.x, info.y, info.h);
  var human = info.by === 'human';
  var q = info.timingQ;
  var col = !human ? 0xE8EEF5 : (q > 0.8 ? 0xFCDE5A : (q > 0.5 ? 0xFFFFFF : 0xC9C3DA));
  var big = human ? (0.7 + 0.5*q) : 0.7;
  this.addRing(bp.x, bp.y, 4, 30*big, 340, col, 0.95);
  if (human && q > 0.8) this.addRing(bp.x, bp.y, 2, 46, 440, 0xFCDE5A, 0.7);
  // sparks fly the way the ball is going (+y is up the screen)
  var b = this.ball, dx = b.vx*0.6, dy = -b.vy;
  var len = Math.max(0.001, Math.sqrt(dx*dx+dy*dy)); dx/=len; dy/=len;
  this.addSparks(bp.x, bp.y, Math.round(5 + 9*info.power), dx, dy, 1.5, 150 + 160*info.power, 520, col, 2.6);
  var spinCol = null;
  if (b.topSpin > 0.15) spinCol = COLORS.topSpin; else if (b.topSpin < -0.15) spinCol = COLORS.backSpin; else if (Math.abs(b.sideSpin) > 0.15) spinCol = COLORS.sideSpin;
  if (spinCol !== null) this.addSparks(bp.x, bp.y, 6, dx, dy, 2.6, 110, 580, spinCol, 2.4);
};
MatchScene.prototype.spawnBounceFx = function(ball){
  var p = this.project(ball.x, ball.y, 0);
  var sc = lerp(1, 0.7, clamp(ball.y/TABLE.length, 0, 1));
  this.addRing(p.x, p.y, 3*sc, 20*sc, 320, 0xFFFFFF, 0.6, 0.32); // flat ring skimming the table
  this.addSparks(p.x, p.y, 3, 0, -1, 1.2, 70*sc, 260, 0xFFFFFF, 1.6);
};
MatchScene.prototype.spawnNetFx = function(ball){
  var p = this.project(ball.x, ball.y, Math.max(0.02, Math.min(ball.h, TABLE.netHeight)));
  this.addSparks(p.x, p.y, 7, 0, 1, 3.4, 80, 380, 0xE8EEF5, 1.8);
};
MatchScene.prototype.drawFx = function(fx){
  var now = this.time.now, keep = [];
  for (var i=0;i<this.fxList.length;i++){
    var e = this.fxList[i], age = now - e.born;
    if (age >= e.life) continue;
    var k = age / e.life;
    if (e.kind === 'ring'){
      var r = lerp(e.r0, e.r1, 1-(1-k)*(1-k));
      fx.lineStyle(2.5*(1-k)+0.5, e.color, e.alpha*(1-k));
      fx.strokeEllipse(e.x, e.y, r*2, r*2*e.flat);
    } else {
      var t = age/1000;
      var px = e.x + e.vx*t, py = e.y + e.vy*t + 260*t*t; // small gravity pull
      fx.fillStyle(e.color, 1-k);
      fx.fillCircle(px, py, e.size*(1-0.5*k));
    }
    keep.push(e);
  }
  this.fxList = keep;
};

MatchScene.prototype.onBallBounce = function(ball, side){
  SFX.tableBounce();
  this.spawnBounceFx(ball);
  if (ball.servePhase){
    var expected = ball.lastHitBy === 'human' ? 'human' : 'ai';
    if (side !== expected){
      // didn't bounce on the server's own side first -- a genuine serve fault
      this.awardPoint(ball.lastHitBy==='human'?'ai':'human', 'Serve fault');
      ball.alive = false;
      return;
    }
    // legal first bounce on the server's own side -- redirect toward the real
    // chosen target now, same as any other paddle contact. This is what actually
    // sends the ball over the net; servePhase is cleared inside resolveHit.
    var p = ball.pendingServe;
    if (p){
      resolveHit(ball, ball.lastHitBy, {
        targetX: p.targetX, targetY: p.targetY, offset: p.offset, timingError: p.timingError,
        paddleStats: p.paddleStats, spinTop: p.spinTop, spinSide: p.spinSide
      });
      ball.pendingServe = null;
      ball.fxPending = null; // the serve's redirect off the table is not a paddle contact
    } else {
      ball.servePhase = false;
    }
    return;
  }

  if (this.isDoubles && ball.diagCheck && side === ball.diagSide){
    ball.diagCheck = false;
    var okHalf = ball.diagLow ? ball.x < TABLE.width/2 : ball.x > TABLE.width/2;
    if (!okHalf){ this.awardPoint(ball.lastHitBy === 'human' ? 'ai' : 'human', 'Serve fault'); ball.alive = false; return; }
  }
  if (this.mode === 'target' && ball.lastHitBy === 'human' && side === 'ai' && ball.lastBounceSideSameHit !== 'ai') this.targetLanded(ball);
  if (this.mode === 'trainer' && ball.lastHitBy === 'human' && side === 'ai' && ball.lastBounceSideSameHit !== 'ai') this.trainerLanded(ball);
  if (ball.lastBounceSideSameHit === side){
    // double bounce on the same side without a return in between -- fault
    var faultSide = side === 'human' ? 'human' : 'ai';
    this.awardPoint(faultSide === 'human' ? 'ai' : 'human', 'No return');
    ball.alive = false;
    return;
  }
  ball.lastBounceSideSameHit = side;
};

MatchScene.prototype.onBallOut = function(ball){
  if (!ball.alive) return;
  ball.alive = false;
  var hitter = ball.lastHitBy;
  if (!hitter){ this.awardPoint('human', 'Out'); return; }
  var receiver = hitter === 'human' ? 'ai' : 'human';
  // If the shot legally bounced on the receiver's side first and the receiver simply
  // didn't get to it, that is a winner for the hitter. Only a ball that left without
  // ever landing on the receiver's side is the hitter's fault.
  var landedLegally = ball.lastBounceSideSameHit === receiver;
  if (landedLegally) this.awardPoint(hitter, 'Winner');
  else this.awardPoint(receiver, 'Out');
};

/* ---------- automatic shot selection ----------
   The player only has to time Space. Target lane/depth and spin are chosen from the
   incoming ball:
     lane  : aim away from the AI (AI on the left half -> right lane, and vice versa);
             if the AI is near center, go cross-court from where the ball is arriving
             (ball on the left -> right lane), or center for a ball right down the middle.
     height: HIGH ball (>=0.30m)  -> ATTACK: deep + topspin
             MID ball  (0.17-0.30) -> DRIVE : deep, flat
             LOW ball  (<0.17m)    -> PUSH  : short + backspin (keeps it safe and low)
   Holding a zone key (1-6), tapping a zone button, or holding a spin key (W/S/Q/E)
   still overrides that part manually for ~1.5s. */
var LANE_NAMES = ['LEFT','CENTER','RIGHT'];
var CROWD_DOUBLES = [0x4a5d7a,0x8a4a4a,0xcfc6b0,0x4a5d7a,0x6b6f7a];
var CROWD_SINGLES = [0x4a5d7a,0xa05a52,0xcfc6b0,0x5f8a78,0xc79a52,0x7a6a98,0x4a5d7a,0x8a4a4a];
/* Smart shot picker. Every combination of lane (L/C/R) x depth (short/deep) x spin (top/flat/back) that makes sense for
   the ball's height is scored, and the best one wins.
     + winning chance : how far the opponent is from that landing spot MINUS how far they can run before the ball arrives
                        (their paddle speed and reaction time, so Hard opponents need a harder shot than Easy ones)
     + wrong-foot     : a bonus for going the opposite way to where the opponent is already moving
     - risk           : low balls are risky to hit deep / with topspin, high balls are wasted on a safe push, an incoming
                        backspin ball sinks a flat shot, and being off-centre on the ball makes corners less accurate
   The previous pick is kept unless a new one is clearly better, so the label doesn't flicker as the ball moves. */
function shotKind(depth, spin, h){
  if (depth === 1 && spin === 0) return 'DRIVE';
  if (depth === 1 && spin === 1) return h >= 0.30 ? 'ATTACK' : (h >= 0.17 ? 'LOOP' : 'LIFT');
  if (depth === 1 && spin === -1) return 'CHOP';
  if (depth === 0 && spin === 1) return 'DROP';
  if (depth === 0 && spin === 0) return 'BLOCK';
  return 'PUSH';
}
function scoreShot(c, lane, depth, spin){
  var laneX = LANE_FRACS[lane] * TABLE.width;
  var dist = Math.abs(laneX - c.aiX);
  var flight = depth ? 0.52 : 0.62;                              // rough time (s) the ball takes to reach the opponent
  var reach = c.aiSpeed * Math.max(0, flight - c.aiReact/1000);  // how far they can run in that time
  var margin = dist - reach;
  var s = 3.0 * c.as.read * clamp(margin/0.45, -6, 1.4);
  // wrong-foot: opponent is already travelling away from this lane
  var toward = laneX - c.aiX;
  if (c.aiVx*toward < 0) s += 0.8 * c.as.wf * clamp(Math.abs(c.aiVx)/1.5, 0, 1);
  var low  = clamp((0.17 - c.h)/0.12, 0, 1);    // 1 = very low ball
  var high = clamp((c.h - 0.17)/0.18, 0, 1);    // 1 = high ball
  var risk = 0;
  if (depth){
    risk += 0.35 + 1.6*low*(spin>0 ? 1 : spin===0 ? 0.85 : 0.15);
    if (spin > 0) s += 1.0*high + 0.35*(1-low);                  // a high ball wants a deep topspin kill
  } else {
    risk += 0.25 + 0.7*high*(spin>0 ? 0.35 : 1);                 // short on a high ball wastes the chance
    if (low > 0.3 && spin < 0) s += 0.5*low;                     // short push is the safe answer to a low ball
  }
  if (spin < 0) risk += 0.1 + 0.9*high;                          // backspin on a high ball is a gift
  if (spin > 0 && c.inTop > 0.15) risk += 0.3;                   // looping a topspin ball is harder
  if (spin === 0 && depth && c.inTop < -0.15) risk += 0.6;       // a flat shot into backspin sinks
  var corner = lane === 1 ? 0.3 : 1;
  risk += c.off*0.12*corner + (depth ? c.off*0.08 : 0);          // off-centre contact = wider aim error
  // fixed per-ball "misjudgement": higher difficulty = the auto-pick is less reliable
  var nz = (Math.abs(Math.sin(c.seed*12.9898 + (lane*6 + depth*3 + spin + 1)*78.233)*43758.5453) % 1 - 0.5) * 2;
  return s - risk*c.as.safety + nz*c.as.noise*2.2;
}
function pickAutoShot(ball, humanX, ai, tier, prev, assist, seed){
  var c = { as:assist || {safety:1,wf:0.8,read:0.9,noise:0.35}, seed:seed||0.5, aiX:ai.x, aiVx:ai.vx||0, aiSpeed:tier.paddleSpeed, aiReact:tier.reactMs, h:ball.h,
            inTop:ball.topSpin||0, off:Math.min(3, Math.abs(ball.x - humanX)/PADDLE_HALF_W) };
  var spins = c.h >= 0.30 ? [1,0] : (c.h >= 0.17 ? [0,1,-1] : [-1,0,1]);
  var best = null;
  for (var ln=0; ln<3; ln++) for (var d=0; d<2; d++) for (var si=0; si<spins.length; si++){
    var sc = scoreShot(c, ln, d, spins[si]);
    if (!best || sc > best.score) best = { laneIndex:ln, depthIndex:d, spinTop:spins[si], score:sc };
  }
  if (prev && spins.indexOf(prev.spinTop) >= 0){
    var ps = scoreShot(c, prev.laneIndex, prev.depthIndex, prev.spinTop);
    if (best.score - ps < 0.35) best = { laneIndex:prev.laneIndex, depthIndex:prev.depthIndex, spinTop:prev.spinTop, score:ps };
  }
  best.spinSide = 0;
  best.label = shotKind(best.depthIndex, best.spinTop, c.h) + ' ' + (best.depthIndex?'DEEP':'SHORT') + ' ' + LANE_NAMES[best.laneIndex];
  return best;
}
MatchScene.prototype.applyAutoAim = function(){
  var now = this.time.now;
  var h = this.human;
  if (this.mode === 'target'){
    // target practice: YOU choose where the ball lands (keys 1-6 or the AIM buttons); no automatic shot, no spin
    h.spinTop = 0; h.spinSide = 0;
    this.autoShot = { label: 'AIM ' + zoneName(h.depthIndex*3 + h.laneIndex) };
    return;
  }
  var oppA = this.ai, oppT = this.aiTier;
  if (this.isDoubles && this.match.next && this.match.next.ai === 'a2'){ oppA = this.ai2; oppT = this.ai2Tier; }
  var a = pickAutoShot(this.ball, h.x, oppA, oppT, this.pickPrev, this.assist, this.pickSeed);
  this.pickPrev = a;
  var manualZone = (now - (this.manualZoneAt||-9999)) < 1500;
  var manualSpin = (now - (this.manualSpinAt||-9999)) < 1500;
  if (!manualZone){ h.laneIndex = a.laneIndex; h.depthIndex = a.depthIndex; }
  if (!manualSpin){ h.spinTop = a.spinTop; h.spinSide = a.spinSide; }
  this.applySpinPick();
  this.autoShot = { label: this.pickLabel(false, manualZone || manualSpin || this.spinPick !== 'auto'), score: a.score };
};

MatchScene.prototype.swingDown = function(){ return this.keys.space.isDown || this.touchHeld; };
/* is the incoming ball in range of your paddle right now? */
MatchScene.prototype.humanRange = function(){
  var ball = this.ball;
  if (this.isDoubles && this.match.next && this.match.next.human !== 'you') return null;   // your partner's ball
  if (this.isDoubles && ball.diagCheck) return null;                                        // let the serve bounce first
  if (!ball.alive || ball.lastHitBy === 'human' || ball.servePhase) return null;
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return null;
  if (ball.vy >= 0) return null;                                  // must be approaching your side
  var t = (STRIKE_Y_HUMAN - ball.y) / ball.vy;
  if (Math.abs(t) > TIMING_WINDOW*2.2*this.winScale) return null; // not close enough to even attempt
  var off = (ball.x - this.human.x) / PADDLE_HALF_W;
  if (Math.abs(off) > this.reach) return null;                    // nowhere near the paddle
  return { t:t, off:off };
};
/* TAP while the ball is in range = normal hit (as before).
   HOLD before it is in range = charge a power shot, then RELEASE while it is in range to hit. */
MatchScene.prototype.checkHumanSwing = function(){
  var pressed = this.pressedSpace(), down = this.swingDown(), now = this.time.now, ball = this.ball, ch = this.charge;
  var rng = this.humanRange();
  this.swingPromptActive = !!rng;
  if (this.isDoubles && this.match.next && this.match.next.human !== 'you'){ ch.on = false; return; }
  var incoming = ball.alive && ball.lastHitBy !== 'human' && !ball.servePhase && ball.vy < 0;
  if (pressed){
    if (rng && !ch.on){ this.doHumanHit(rng.t, rng.off, 0); return; }
    if (incoming && !ch.on){ ch.on = true; ch.start = now; }
    return;
  }
  if (ch.on){
    if (!down){
      ch.on = false;
      if (rng) this.doHumanHit(rng.t, rng.off, clamp((now - ch.start)/CHARGE_MS, 0, 1));
      else { this.human.swingUntil = now + 140; SFX.swing(); }     // released too early: a wasted swing
      return;
    }
    if (!incoming || ball.y < STRIKE_Y_HUMAN - 0.3) ch.on = false;   // the ball has passed you
  }
};
MatchScene.prototype.doHumanHit = function(timeToPlane, offset, charge){
  var ball = this.ball, c = charge || 0;
  this.human.swingUntil = this.time.now + 180 + 80*c;
  SFX.swing();
  var target = targetCoords(this.human.laneIndex, this.human.depthIndex, true);
  var te = Math.abs(timeToPlane) / this.winScale;
  var qNow = clamp(1 - te/TIMING_WINDOW, 0, 1);
  // landing depth varies with contact quality: a clean hit goes deeper / a mistimed one lands shorter; charging adds spread
  target.y += (qNow - 0.5) * (this.human.depthIndex ? 0.14 : 0.08) + (Math.random()-0.5)*(0.05 + 0.2*c);
  target.y = clamp(target.y, TABLE.netY + 0.25, TABLE.length - 0.06);
  var kind = shotKind(this.human.depthIndex, this.human.spinTop, ball.h);
  if (c >= 0.6 && ball.h >= 0.28 && this.human.depthIndex === 1 && this.human.spinTop >= 0) kind = 'SMASH';   // high ball + big charge
  var lf = this.save.life; lf.kinds[kind] = (lf.kinds[kind]||0) + 1;
  if (this.touchUi) buzz(c > 0.6 ? 34 : qNow > 0.8 ? 22 : 12);
  var fb = te < 0.05 ? ['PERFECT!', '#FCDE5A'] : te < 0.12 ? ['GOOD', '#9FE1CB'] : [timeToPlane > 0 ? 'EARLY' : 'LATE', '#F09595'];
  if (kind === 'SMASH') fb = te < 0.12 ? ['SMASH!', '#FF9F43'] : [fb[0], fb[1]];
  else if (c >= 0.6 && te < 0.05) fb = ['POWER SHOT!', '#FF9F43'];
  this.hitFeedback = { text: fb[0], color: fb[1], at: this.time.now };
  if (this.trn){ var tn = this.trn; tn.n++; tn.sum += timeToPlane/this.winScale; if (te < 0.05) tn.perfect++; else if (te < 0.12) tn.good++; else if (timeToPlane > 0) tn.early++; else tn.late++; }
  resolveHit(ball, 'human', {
    targetX: target.x, targetY: target.y, charge: c,
    offset: offset, timingError: timeToPlane / this.winScale, speedMul: (KIND_PACE[kind] || 1) * (1 - 0.18*c),
    paddleStats: this.paddleStats, spinTop: this.human.spinTop, spinSide: this.isFeed ? 0 : this.human.spinSide
  });
  this.curRally++;
  if (this.isDoubles){ this.match.next.human = 'pt'; ball.lastHitter = 'you'; }
  this.pickPrev = null; this.pickSeed = Math.random();
  this.swingVar = clamp(offset/3, -1, 1)*0.7 + (this.human.spinTop > 0 ? 0.35 : this.human.spinTop < 0 ? -0.5 : 0) + (Math.random()-0.5)*0.3 + c*0.5;
  if (this.isMatch){ this.match.stats.swings++; if (te < 0.05) this.match.stats.perfect++; }
  if (this.mode === 'rally') this.countRallyReturn();
};

MatchScene.prototype.updateAiPaddle = function(dt){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (ball.lastHitBy !== 'human' && ball.lastHitBy !== null){
    // ball is heading away from AI or already handled; still track toward center softly
  }
  if (ai.reactTimer > 0){
    ai.reactTimer -= dt*1000;
  } else if (ball.vy > 0 && ball.lastHitBy !== 'ai'){
    // predict landing x at AI's strike plane
    if (Math.abs(ball.vy) > 0.01){
      var tArrive = (STRIKE_Y_AI - ball.y)/ball.vy;
      if (tArrive > 0){
        ai.targetX = clamp(ball.x + ball.vx*tArrive, PADDLE_X_MIN, PADDLE_X_MAX);
      }
    }
  }
  if (this.mode === 'rally' && ball.vy > 0) ai.targetX = clamp(ball.x + ball.vx*0.1, PADDLE_X_MIN, PADDLE_X_MAX);
  var maxStep = tier.paddleSpeed*dt;
  var oldAx = ai.x;
  ai.x += clamp(ai.targetX-ai.x, -maxStep, maxStep);
  ai.x = clamp(ai.x, PADDLE_X_MIN, PADDLE_X_MAX);
  ai.vx = lerp(ai.vx || 0, dt > 0 ? (ai.x - oldAx)/dt : 0, 0.3);
};

MatchScene.prototype.checkAiAutoHit = function(){
  var ball = this.ball, ai = this.ai, tier = this.aiTier;
  if (this.mode === 'target' || this.mode === 'trainer') return; // the ball machine only feeds
  if (ball.lastHitBy === 'ai') return;
  if (ball.servePhase) return; // can't return a serve before it legally bounces on the server's own side
  if (ball.vy <= 0) return; // only hit balls approaching the AI side
  if (ball.h < STRIKE_H_MIN || ball.h > STRIKE_H_MAX) return;
  // hit as soon as the ball reaches the strike plane. (A narrow +/- window made the AI miss whenever a frame
  // advanced the ball further than the window -- i.e. on slow or phone-class frame rates.)
  if (ball.y < STRIKE_Y_AI - 0.02 || ball.y > STRIKE_Y_AI + 0.35) return;
  if (Math.abs(ball.x - ai.x) > (this.mode === 'rally' ? PADDLE_HALF_W*4 : PADDLE_HALF_W*1.3)) return;

  // reset reaction gate for the next incoming ball once this one resolves
  this.ai.reactTimer = tier.reactMs;

  var plan = this.planAiShot();
  this.scout.last = plan;
  var target = targetCoords(plan.laneIndex, plan.depthIndex, false);
  resolveHit(ball, 'ai', {
    targetX: target.x, targetY: target.y,
    offset: randRange(-tier.aimErr,tier.aimErr)*(plan.errMul||1)/PADDLE_HALF_W,
    timingError: randRange(-tier.timeErr,tier.timeErr)*(plan.errMul||1),
    paddleStats: PADDLES.starter, spinTop: plan.spinTop, spinSide: plan.spinSide,
    speedMul: this.mode === 'rally' ? Math.max(0.62, 1 - 0.012*this.rally.count) : this.pace
  });
  this.curRally++;
};

MatchScene.prototype.planAiShot = function(foeX, styleArg, tierArg){
  var tier = tierArg || this.aiTier;
  if (this.mode === 'rally'){
    var n = this.rally.count;
    return { laneIndex: n < 4 ? 1 : Math.floor(Math.random()*3), depthIndex: (n < 3 || Math.random() < 0.65) ? 1 : 0, spinTop:0, spinSide:0, errMul:1 };
  }
  var r = Math.random;
  var humanFrac = clamp((foeX !== undefined ? foeX : this.human.x)/TABLE.width, 0, 1);
  var away = humanFrac < 0.5 ? 2 : 0;
  var plan = { laneIndex:1, depthIndex:(r() < (0.4 + tier.aggressive*0.3)) ? 1 : 0, spinTop:0, spinSide:0, errMul:1 };
  var useSpin = r() < tier.spinUse;
  if (r() < tier.aggressive) plan.laneIndex = away;
  if (useSpin){ plan.spinTop = r()<0.6 ? 1 : -1; if (r() < 0.5) plan.spinSide = r()<0.5 ? -1 : 1; }
  var st = styleArg !== undefined ? styleArg : (this.isMatch ? this.opponent.style : null);
  if (st === 'errorprone'){
    plan.errMul = r() < 0.16 ? 3.2 : 1;                         // now and then a wild one
  } else if (st === 'steady'){
    plan.laneIndex = r() < 0.7 ? 1 : (r()<0.5 ? 0 : 2); plan.depthIndex = r() < 0.5 ? 1 : 0; plan.spinTop = 0; plan.spinSide = 0; plan.errMul = 0.6;
  } else if (st === 'looper'){
    plan.spinTop = r() < 0.75 ? 1 : 0; plan.depthIndex = r() < 0.7 ? 1 : 0; plan.laneIndex = r() < 0.6 ? away : plan.laneIndex;
  } else if (st === 'spinner'){
    if (r() < 0.85){ plan.spinTop = [1,-1,0][Math.floor(r()*3)]; plan.spinSide = r() < 0.7 ? (r()<0.5 ? -1 : 1) : 0; }
    plan.laneIndex = r() < 0.5 ? away : Math.floor(r()*3);
  } else if (st === 'smasher'){
    plan.depthIndex = r() < 0.8 ? 1 : 0; plan.spinTop = r() < 0.7 ? 1 : 0; plan.spinSide = 0; plan.laneIndex = r() < 0.7 ? away : plan.laneIndex; plan.errMul = r() < 0.2 ? 2.2 : 1;
  } else if (st === 'chopper'){
    plan.spinTop = r() < 0.8 ? -1 : 0; plan.depthIndex = r() < 0.5 ? 1 : 0; plan.spinSide = r() < 0.3 ? (r()<0.5 ? -1 : 1) : 0; plan.laneIndex = r() < 0.5 ? away : Math.floor(r()*3); plan.errMul = 0.6;
  } else if (st === 'allround'){
    plan.spinTop = [1,-1,0][Math.floor(r()*3)]; plan.depthIndex = r() < 0.6 ? 1 : 0; plan.laneIndex = r() < 0.65 ? away : Math.floor(r()*3); plan.spinSide = r() < 0.4 ? (r()<0.5 ? -1 : 1) : 0; plan.errMul = 0.55;
  } else if (st === 'wall'){
    plan.depthIndex = r() < 0.55 ? 0 : 1; plan.spinTop = r() < 0.5 ? -1 : 0; plan.spinSide = 0; plan.laneIndex = r() < 0.5 ? away : 1; plan.errMul = 0.5;
  }
  // scouting: lean on the lane and spin that have been beating you
  var sc = this.scout;
  if (this.isMatch && !this.isDoubles && sc && tier.adapt > 0 && sc.n >= 3 && r() < tier.adapt){
    var bl = 0; for (var li=1; li<3; li++) if (sc.lane[li] > sc.lane[bl] + 0.01) bl = li;
    if (sc.lane[bl] >= 1.5){
      plan.laneIndex = bl;
      var bs = sc.spin.top >= sc.spin.back ? 1 : -1;
      if (Math.max(sc.spin.top, sc.spin.back) >= 1.5 && plan.spinTop !== 0 && r() < 0.5) plan.spinTop = bs;
      if (!sc.noted){ sc.noted = true; sc.noteDue = this.opponent.short + ' has spotted your ' + ['left','middle','right'][bl] + ' side'; }
    }
  }
  return plan;
};

/* ============================================================
   SCORING
   ============================================================ */
MatchScene.prototype.awardPoint = function(winner, reason){
