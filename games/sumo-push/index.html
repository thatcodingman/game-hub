<title>Sumo Push — The Arcade</title>
<style>
  html, body {
    margin:0; padding:0; background:#0a0a0d; overflow:hidden; height:100%;
    overscroll-behavior: none;
  }
  #game-container { width:100vw; height:100vh; }
  canvas {
    display:block; touch-action:none;

<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js?v=2"></script>
<script>
/* =========================================================================
   SUMO PUSH
   "One ring. One shove. One mistake."

   A minimalist 1v1 sumo duel built on momentum, not a moveset. There is no
   punch/kick/grapple/block button — just movement and ONE charge-dash.
   Hold to charge (the longer you hold, the harder and more committed the
   dash), release to shove. Two wrestlers colliding resolve as a physical
   momentum exchange: whoever is carrying more speed into the hit shoves the
   other back. Two equally-committed dashes colliding is a CLASH — a
   dedicated slow-mo/camera-shake moment, not a scripted special move.

   Distance from the ring's edge is the resource that matters, not HP. A
   missed dash leaves you in a brief recovery window (slow, vulnerable) —
   the dash is a bet: commit right and shove them out, miss and you're the
   one who's exposed.

   AI difficulty (per design) comes from decision-making and timing, never
   from faster reactions or hidden stat boosts:
     Easy   — overcommits, ignores its own edge risk.
     Normal — reacts to an obvious charge with a basic counter-charge.
     Hard   — holds the center, baits you into over-extending.
     Expert — waits for you to commit before reacting, and bait-positions
              you toward the edge first.
   ========================================================================= */

const W = 960, H = 540;
const RING_CX = 480, RING_CY = 285;
const RING_RADIUS_BASE = 190;
const WRESTLER_R = 34;

const MOVE_ACCEL = 900;
const MOVE_MAX_SPEED = 220;
const FRICTION = 700;
const STAGGER_FRICTION = 650; // separate, much lower decel than movement friction would suggest —
  // this is what actually stops a knocked-back wrestler; too low and any real hit crosses the
  // whole ring (the bug that made every match end in ~3-5s regardless of AI tier)
const CHARGE_MOVE_MULT = 0.35;
const RECOVERY_MOVE_MULT = 0.5;
const STAGGER_MOVE_MULT = 0.4;

const MAX_CHARGE_MS = 900;
const CHARGE_STAGE1_MS = 300;
const CHARGE_STAGE2_MS = 600;
// The AI's reaction check used to gate on CHARGE_STAGE1_MS (300ms) — the visible
// "lowered stance" telegraph — which meant any player dash held for LESS than
// 300ms (a quick tap, still a perfectly strong dash per the speed curve) was
// completely invisible to the AI's reaction system at every difficulty tier.
// This is a much shorter, decoupled "did I notice you moved" delay instead.
const AI_REACT_DELAY_MS = 110;
const DASH_MIN_SPEED = 380;
const DASH_MAX_SPEED = 760;
const DASH_FRICTION = 500;
const DASH_MAX_DURATION_MS = 320;
const RECOVERY_MS = 550;
const STAGGER_MS = 480;

const CRITICAL_EDGE_DIST = 45;
const CLASH_SPEED_THRESHOLD = 45; // if both dashing, hitting reasonably head-on, and closing-speed diff is under this, it's a mutual clash
const CLASH_HEADON_MIN = 0.6; // fraction of each wrestler's speed that must be along the contact normal — keeps glancing hits from becoming Clashes
// Rebalanced down hard: the old values (BASE 45 / SCALE 1.05 / CAP 520 with the
// old low STAGGER friction) launched a knocked-back wrestler 150-320px on any
// solid hit — more than the entire ring's radius — so literally any landed
// dash was an automatic ring-out regardless of AI tier, and matches ended in
// 3-5 seconds every time. These numbers, paired with STAGGER_FRICTION above,
// mean a clean hit is a real shove (needs several to ring out from center)
// and only a hit landed while the loser is already in the Critical zone
// reliably finishes the round.
const PUSH_BASE = 30, PUSH_SCALE = 0.6, PUSH_CAP = 280;
const CRITICAL_PUSH_MULT = 1.4;

// ------------------------------------------------------------ PUSH STRUGGLE
// The moment two wrestlers actually collide with real force behind it (at
// least one of them dashing) no longer resolves instantly off pure momentum
// alone. It freezes into a short skill-based tug-of-war: a few rounds of
// on-screen directional prompts, matched on the SAME movement keys each
// wrestler already uses to play. Momentum from the hit still seeds the
// outcome (charging harder / hitting cleaner still counts for something),
// but who actually keeps up with the prompts tips who wins the shove — real
// moment-to-moment player control instead of the result being fully locked
// in the instant two bodies touch.
const STRUGGLE_ROUNDS_LOCAL = 3;  // 2P local has no difficulty tier — fair, fixed round count for both humans
const STRUGGLE_WINDOW_MS_LOCAL = 550; // 2P local has no difficulty tier — fair, fixed window for both humans
const STRUGGLE_GAP_MS = 150;      // brief pause between prompts
const STRUGGLE_MOMENTUM_WEIGHT = 0.35; // how much the original hit's momentum still counts
const STRUGGLE_MATCH_FORCE = 85;  // force-equivalent per net round won
const STRUGGLE_DIR_GLYPH = { up: '↑', down: '↓', left: '←', right: '→' };
const STRUGGLE_DIRS = ['up', 'down', 'left', 'right'];

const ROUNDS_TO_WIN = 2;
const RING_MIN_RADIUS = 125;
// Each round of a match escalates — tighter starting ring and a faster fuse
// to Sudden Death — so Round 1 feels like a probe and the decider feels like
// a decider, without changing the core physics round to round.
const ROUND_TIMING = [
  { suddenDeathMs: 19000, shrinkMs: 11000, ringRadius: RING_RADIUS_BASE },      // Round 1 — feel each other out
  { suddenDeathMs: 16000, shrinkMs: 9000,  ringRadius: RING_RADIUS_BASE - 12 }, // Round 2 — tighter, faster
  { suddenDeathMs: 12000, shrinkMs: 7000,  ringRadius: RING_RADIUS_BASE - 22 } // Round 3 / decider — no room to hide
];

const DIFFICULTY_DEFS = {
  // chargeChance/minCharge/maxCharge: how often & how long the AI commits on its own.
  // edgeAwareness: how much it avoids charging when IT is the one near the edge.
  // reactChance: odds it responds at all to seeing the opponent visibly charging.
  // waitForCommit: of those reactions, odds it holds off and waits for the opponent's
  //   release instead of pre-emptively charging (a true counter-timing read).
  // centerPull: how strongly it drifts back toward the ring's center by default.
  // chargeChance must ASCEND with difficulty like every other parameter here —
  // it was inverted (Easy highest, Expert lowest), which made Easy spam charges
  // (feels aggressive/hard) while Expert barely initiated anything on its own
  // (feels passive/normal). Now the AI actually gets more active, not just
  // smarter, as difficulty rises.
  // punishChance: odds it seizes a spotted opening (opponent recovering/staggered/
  //   near-edge) THE MOMENT it appears, instead of waiting on the slow chargeChance
  //   roll. This is the parameter that actually reads as "intelligence" to a
  //   player — reactChance/waitForCommit alone partly cancel each other out
  //   perceptually, but visibly punishing a mistake the instant it happens does not.
  // aiPushResist: scales DOWN the push the AI receives when IT is the loser of
  // an exchange (never scales the player's own push — the player is always at
  // full vulnerability). This is the "levels remapped" lever: a higher tier
  // isn't just smarter, it's also genuinely harder to ring out in the first
  // place, so 2-3 quick hits can't blow through Expert the way they could
  // through Easy. Replaces the old both-sides-equal knockbackMult.
  // aiPushBonus: scales UP the push the AI deals when IT wins an exchange
  // (never affects the player's own winning pushes). Pairs with aiPushResist
  // so Hard/Expert aren't just harder to knock over — their own hits actually
  // hurt more too, once they've correctly identified an opening.
  // openingReactChance/openingReactDelayMs: how sharp the AI's reactions are
  // ONLY during the ~1.5s "tachiai" window right as a round goes live (see
  // startRound). Easy is left at its normal (slow) reaction values on purpose -
  // it's supposed to be genuinely catchable by an instant opening rush.
  // struggleAccuracy: odds the AI correctly matches each push-struggle prompt
  // (rolled at a randomized moment within the prompt's window, not instantly,
  // so it feels like a reaction rather than a read of the answer).
  // struggleWindowMs: how long the PLAYER gets to match each prompt. This is
  // the one struggle stat that also affects the human side directly — a
  // higher tier isn't just a sharper AI, the whole exchange is faster and
  // less forgiving, the same way real sumo doesn't slow down for a weaker
  // opponent. struggleReactMin/Max: the fraction of that (now shorter)
  // window the AI's own hit is rolled within — a lower, tighter range means
  // it reacts faster AND more consistently, not just more often.
  // struggleRounds: how many prompts the WHOLE exchange runs for. Easy is a
  // quick 2-round formality; Expert drags it out to 5 — a longer, more
  // grueling tug-of-war where a single lucky/unlucky round matters less and
  // genuine consistency matters more.
  // driftScale/tiltScale: per-arena environmental-effect multipliers (see
  // ARENA_DEFS below) — Drifting Dohyo's ring movement and Tilt Ring's
  // nudging force are both barely-there on Easy and strongest on Expert, so
  // the same arena stays fair for a beginner but genuinely tests adaptation
  // at the top tier, without needing to restrict which arenas a tier can
  // even pick.
  // All four must move together with difficulty: window DESCENDS, accuracy
  // and reaction speed ASCEND (tighter/earlier react range).
  easy:   { name: 'Easy',   chargeChance: 0.008, minChargeMs: 150, maxChargeMs: 450, edgeAwareness: 0.0, reactChance: 0.10, waitForCommit: 0.0,  centerPull: 0.10, punishChance: 0.05, aiPushResist: 1.00, aiPushBonus: 1.00, openingReactChance: 0.10, openingReactDelayMs: AI_REACT_DELAY_MS, struggleAccuracy: 0.30, struggleWindowMs: 700, struggleReactMin: 0.40, struggleReactMax: 0.90, struggleRounds: 2, driftScale: 0.25, tiltScale: 0.0 },
  normal: { name: 'Normal', chargeChance: 0.015, minChargeMs: 250, maxChargeMs: 600, edgeAwareness: 0.45, reactChance: 0.40, waitForCommit: 0.20, centerPull: 0.30, punishChance: 0.35, aiPushResist: 0.85, aiPushBonus: 1.00, openingReactChance: 0.55, openingReactDelayMs: 70, struggleAccuracy: 0.50, struggleWindowMs: 560, struggleReactMin: 0.30, struggleReactMax: 0.70, struggleRounds: 3, driftScale: 0.6, tiltScale: 0.3 },
  hard:   { name: 'Hard',   chargeChance: 0.028, minChargeMs: 350, maxChargeMs: 700, edgeAwareness: 0.80, reactChance: 0.78, waitForCommit: 0.60, centerPull: 0.60, punishChance: 0.85, aiPushResist: 0.50, aiPushBonus: 1.15, openingReactChance: 0.85, openingReactDelayMs: 45, struggleAccuracy: 0.72, struggleWindowMs: 440, struggleReactMin: 0.18, struggleReactMax: 0.50, struggleRounds: 4, driftScale: 1.0, tiltScale: 1.0 },
  expert: { name: 'Expert', chargeChance: 0.040, minChargeMs: 380, maxChargeMs: 750, edgeAwareness: 1.0,  reactChance: 0.92, waitForCommit: 0.80, centerPull: 0.70, punishChance: 0.95, aiPushResist: 0.35, aiPushBonus: 1.30, openingReactChance: 0.97, openingReactDelayMs: 25, struggleAccuracy: 0.88, struggleWindowMs: 350, struggleReactMin: 0.08, struggleReactMax: 0.32, struggleRounds: 5, driftScale: 1.15, tiltScale: 1.3 }
};
const DIFFICULTY_ORDER = ['easy', 'normal', 'hard', 'expert'];
const DIFFICULTY_KEY = 'sumoPush_difficulty';
function loadDifficulty() {
  try { const d = localStorage.getItem(DIFFICULTY_KEY); return DIFFICULTY_DEFS[d] ? d : 'normal'; }
  catch (err) { return 'normal'; }
}
function saveDifficulty(key) { try { localStorage.setItem(DIFFICULTY_KEY, key); } catch (err) {} }

// ------------------------------------------------------------------ ARENAS
// Six selectable rings that all share the exact same combat system —
// movement, charging, collision, push-struggle, Critical state, ring-out.
// Each arena changes exactly ONE thing about how the ring itself behaves,
// never the fight rules underneath it, so a loss always traces back to a
// readable cause: overcommitted, got baited, lost a collision, camped an
// edge, mistimed a contraction, or failed to adapt — never "the physics
// worked differently that round."
const ARENA_DEFS = {
  classic:   { name: 'Classic Dohyo', desc: 'Pure rules, no gimmicks.' },
  // Smaller starting ring + a faster fuse to Sudden Death. No new mechanic —
  // pure pressure from less room and less time.
  iron:      { name: 'Iron Dohyo', desc: 'Smaller ring, faster shrink. Pure pressure.', radiusDelta: -15, timeMult: 0.85 },
  // The ring's CENTER wanders slowly in a lazy figure-eight. The boundary
  // math stays the same distance-from-center check — only the center moves.
  drifting:  { name: 'Drifting Dohyo', desc: 'The ring itself slowly drifts.', ampX: 45, ampY: 22, periodMs: 9000 },
  // Reuses the existing edge-distance check to detect a band near the
  // boundary and softens friction there. The boundary itself never moves.
  slipsand:  { name: 'Slip Sand', desc: 'Low-friction band near the edge.' },
  // One dramatic mid-round contraction (with a clear announce+cue) on top
  // of the normal Sudden-Death shrink, instead of one smooth taper.
  risingsun: { name: 'Rising Sun', desc: 'Ring contracts in dramatic timed stages.', stageDrop: 25, stageFrac: 0.5 },
  // A small shared, slowly-rotating force nudges both wrestlers' movement
  // equally. Never touches collision normals or push strength.
  tilt:      { name: 'Tilt Ring', desc: 'A subtle force nudges movement. Advanced.' }
};
const ARENA_ORDER = ['classic', 'iron', 'drifting', 'slipsand', 'risingsun', 'tilt'];
const ARENA_VISUALS = {
  classic:   { bg: 0x1b140d, outer: 0x3a2c1a, inner: 0xc9a15a, strokeOuter: 0x8a6a35, strokeInner: 0x6b4f24 },
  iron:      { bg: 0x0c0d10, outer: 0x2a2e36, inner: 0x565f6b, strokeOuter: 0x8fa0b5, strokeInner: 0x3a4150 },
  drifting:  { bg: 0x0a0a18, outer: 0x1a1030, inner: 0x2e2255, strokeOuter: 0x7fd3ff, strokeInner: 0x4a3a80 },
  slipsand:  { bg: 0x241f14, outer: 0x4a4028, inner: 0xe8d9a8, strokeOuter: 0xc9b86a, strokeInner: 0xa89454 },
  risingsun: { bg: 0x1a0d0a, outer: 0x4a1f14, inner: 0xd9622f, strokeOuter: 0xff9f4a, strokeInner: 0x8a3a1a },
  tilt:      { bg: 0x0d1114, outer: 0x2a3238, inner: 0x6b7880, strokeOuter: 0xb5c4cc, strokeInner: 0x3f4a50 }
};
const SLIP_SAND_BAND_WIDTH = 35;
const SLIP_SAND_FRICTION_MULT = 0.65;
const TILT_ACCEL_BASE = MOVE_ACCEL * 0.035; // ~3.5% of normal move accel at full (Expert) scale
const TILT_PERIOD_MS = 7000;
const ARENA_KEY = 'sumoPush_arena';
function loadArena() {
  try { const a = localStorage.getItem(ARENA_KEY); return ARENA_DEFS[a] ? a : 'classic'; }
  catch (err) { return 'classic'; }
}
function saveArena(key) { try { localStorage.setItem(ARENA_KEY, key); } catch (err) {} }

const Sound = {
  chargeTick(stage) {

    else if (tier === 'medium') SFX.tone(220, 0.1, 'sawtooth', 0.16, 140);

  suddenDeath() { if (!window.SFX) return; SFX.tone(140, 0.28, 'sawtooth', 0.2, 70); SFX.tone(1400, 0.1, 'square', 0.12, 1600, 120); },
  struggleStart() { if (!window.SFX) return; SFX.tone(320, 0.08, 'sawtooth', 0.12, 500); },

  struggleMiss() { if (!window.SFX) return; SFX.tone(160, 0.06, 'sawtooth', 0.08, 200); },
  struggleWin() { if (!window.SFX) return; SFX.tone(500, 0.1, 'triangle', 0.16, 760); SFX.tone(720, 0.12, 'triangle', 0.16, 980, 90); },
  struggleLose() { if (!window.SFX) return; SFX.tone(260, 0.16, 'sawtooth', 0.15, 130); },
  struggleTie() { if (!window.SFX) return; SFX.tone(380, 0.08, 'square', 0.1, 420); },
  contraction() { if (!window.SFX) return; SFX.tone(200, 0.18, 'square', 0.15, 650); SFX.tone(500, 0.12, 'square', 0.1, 900, 90); }
};

// ------------------------------------------------------------- TOUCH INPUT
// Two small DOM overlay controls (not Phaser game objects) so they sit above
// the canvas regardless of Phaser's FIT scaling: a virtual joystick for
// movement, and a press-and-hold button standing in for the charge/dash key.
// The joystick ALSO doubles as the push-struggle's directional input — a
// flick past the deadzone in a cardinal direction is a one-shot "press",
// mirroring how the desktop version reuses each wrestler's own movement
// keys to match struggle prompts instead of a separate button.
function createTouchStick(container, side) {
  const base = document.createElement('div');
  const knob = document.createElement('div');
  base.appendChild(knob);
  container.appendChild(base);
  base.style.cssText = `position:absolute; bottom:28px; ${side}:28px; width:112px; height:112px; border-radius:50%; background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.22); touch-action:none; pointer-events:auto;`;
  knob.style.cssText = 'position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.32); left:33px; top:33px;';

  const MAXD = 56 - 23;
  const state = {
    x: 0, y: 0, lastDir: null, justDir: null,
    consumeDir(dir) { if (this.justDir === dir) { this.justDir = null; return true; } return false; }
  };
  let activeId = null;

  function dominant(nx, ny) {
    const mag = Math.hypot(nx, ny);
    if (mag < 0.55) return null;
    return Math.abs(nx) > Math.abs(ny) ? (nx > 0 ? 'right' : 'left') : (ny > 0 ? 'down' : 'up');
  }
  function move(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > MAXD) { dx = dx / dist * MAXD; dy = dy / dist * MAXD; }
    knob.style.left = (33 + dx) + 'px'; knob.style.top = (33 + dy) + 'px';
    state.x = dx / MAXD; state.y = dy / MAXD;
    const dir = dominant(state.x, state.y);
    if (dir && dir !== state.lastDir) state.justDir = dir;
    state.lastDir = dir;
  }
  function reset() {
    activeId = null; state.x = 0; state.y = 0; state.lastDir = null;
    knob.style.left = '33px'; knob.style.top = '33px';
    knob.style.background = 'rgba(255,255,255,0.32)';
  }

  base.addEventListener('pointerdown', e => {
    e.preventDefault(); activeId = e.pointerId;
    try { base.setPointerCapture(e.pointerId); } catch (err) {}
    knob.style.background = 'rgba(255,255,255,0.55)';
    move(e.clientX, e.clientY);
  });
  base.addEventListener('pointermove', e => { if (e.pointerId === activeId) move(e.clientX, e.clientY); });
  base.addEventListener('pointerup', e => { if (e.pointerId === activeId) reset(); });
  base.addEventListener('pointercancel', e => { if (e.pointerId === activeId) reset(); });

  return state;
}

function createTouchChargeButton(container, side) {
  const btn = document.createElement('div');
  container.appendChild(btn);
  btn.textContent = 'DASH';
  btn.style.cssText = `position:absolute; bottom:38px; ${side}:34px; width:86px; height:86px; border-radius:50%; background:rgba(255,159,107,0.16); border:2px solid rgba(255,159,107,0.5); color:#fff; font:bold 13px Arial,sans-serif; display:flex; align-items:center; justify-content:center; touch-action:none; pointer-events:auto; user-select:none;`;
  let down = false;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); down = true;
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    btn.style.background = 'rgba(255,159,107,0.4)';
  });
  const up = () => { down = false; btn.style.background = 'rgba(255,159,107,0.16)'; };
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  return { isDown: () => down };
}

class SumoPushScene extends Phaser.Scene {
  constructor() { super('SumoPushScene'); }

  create() {
    this.mode = null;
    this.difficulty = loadDifficulty();
    this.arenaKey = loadArena();
    this.state = 'menu';
    this.isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    this.buildRing();
    this.buildEntities();
    this.buildHUD();
    this.buildInput();
    this.buildOverPanel();
    this.buildModeSelect();
    this.buildArenaSelect();
    this.buildDifficultySelect();
    this.buildStruggleUI();
    if (this.isTouch) this.buildTouchControls();

    this.setHudVisible(false);
    this.setOverVisible(false);
    this.setDifficultySelectVisible(false);
    this.setArenaSelectVisible(false);
    this.setModeSelectVisible(true);
  }

  // ----------------------------------------------------------------- RING
  buildRing() {
    this.ringG = this.add.graphics();
    this.ringRadius = RING_RADIUS_BASE;
    this.ringCenterX = RING_CX;
    this.ringCenterY = RING_CY;
    this.drawRing();
    this.bgFlash = this.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0).setDepth(-1);
    this.dustParticles = [];
    this.dustG = this.add.graphics();
    this.edgeWarnG = this.add.graphics().setDepth(1);
  }

  drawRing() {
    const vis = ARENA_VISUALS[this.arenaKey] || ARENA_VISUALS.classic;
    const cx = this.ringCenterX, cy = this.ringCenterY;
    this.ringG.clear();
    this.ringG.fillStyle(vis.bg, 1);
    this.ringG.fillRect(0, 0, W, H);
    // dohyo (sand circle) + raised straw-rope border rings, recolored per arena
    this.ringG.fillStyle(vis.outer, 1);
    this.ringG.fillCircle(cx, cy, this.ringRadius + 16);
    this.ringG.fillStyle(vis.inner, 1);
    this.ringG.fillCircle(cx, cy, this.ringRadius);
    this.ringG.lineStyle(5, vis.strokeOuter, 1);
    this.ringG.strokeCircle(cx, cy, this.ringRadius);
    this.ringG.lineStyle(2, vis.strokeInner, 0.6);
    this.ringG.strokeCircle(cx, cy, this.ringRadius - 10);
    // Slip Sand: draw the low-friction band's own inner boundary so the
    // player can actually SEE where footing gets loose, per the "communicate
    // mechanics visually" rule — this is a readout only, never a second
    // collision boundary.
    if (this.arenaKey === 'slipsand' && this.ringRadius - SLIP_SAND_BAND_WIDTH > RING_MIN_RADIUS * 0.5) {
      this.ringG.lineStyle(2, 0xfff3c4, 0.5);
      this.ringG.strokeCircle(cx, cy, this.ringRadius - SLIP_SAND_BAND_WIDTH);
    }
  }

  // -------------------------------------------------------------- ENTITIES
  buildEntities() {
    this.p1 = this.createWrestler(0x8fd3ff, 0x3f6fa8, 0);
    this.p2 = this.createWrestler(0xff9f6b, 0xa85f3f, Math.PI);
    this.slowUntil = 0;
    this.openingAlertUntil = 0;
    this.struggle = null;
    this.p1RoundWins = 0;
    this.p2RoundWins = 0;
  }

  createWrestler(color, dark, facing) {
    return {
      x: 0, y: 0, vx: 0, vy: 0, facing, color, dark,
      state: 'idle', // idle | charging | dashing | recovering | staggered
      chargeStart: 0, chargeKeyWasDown: false, dashStartedAt: 0, staggerUntil: 0, recoveryUntil: 0,
      dashTier: 'quick', reachedStage1: false, reachedStage2: false,
      // AI-only bookkeeping (inert for the human-controlled wrestler)
      reactedToThisCharge: false, pendingCounter: false, plannedReleaseAt: 0,
      wasCritical: false,
      graphic: this.add.graphics()
    };
  }

  resetWrestler(f, x, y, facing) {
    f.x = x; f.y = y; f.vx = 0; f.vy = 0; f.facing = facing;
    f.state = 'idle'; f.chargeStart = 0; f.chargeKeyWasDown = false;
    f.dashStartedAt = 0; f.staggerUntil = 0; f.recoveryUntil = 0;
    f.reachedStage1 = false; f.reachedStage2 = false;
    f.reactedToThisCharge = false; f.pendingCounter = false; f.plannedReleaseAt = 0;
    f.wasCritical = false;
  }

  // ------------------------------------------------------------------ HUD
  buildHUD() {
    this.p1PipRow = [];
    this.p2PipRow = [];
    for (let i = 0; i < ROUNDS_TO_WIN; i++) {
      this.p1PipRow.push(this.add.circle(W / 2 - 60 - i * 20, 20, 6, 0x2a2e36).setStrokeStyle(1, 0x5a5030, 1));
      this.p2PipRow.push(this.add.circle(W / 2 + 60 + i * 20, 20, 6, 0x2a2e36).setStrokeStyle(1, 0x5a5030, 1));
    }
    this.roundText = this.add.text(W / 2, 20, 'ROUND 1', { fontFamily: 'Arial Black', fontSize: '16px', color: '#cbd5e1' }).setOrigin(0.5);
    this.phaseText = this.add.text(W / 2, H - 18, '', { fontFamily: 'Arial', fontSize: '12px', color: '#7f8a9a' }).setOrigin(0.5);
    this.arenaLabelText = this.add.text(W - 10, 20, '', { fontFamily: 'Arial', fontSize: '11px', color: '#7f8a9a' }).setOrigin(1, 0.5);
    this.bannerText = this.add.text(W / 2, H / 2 - 30, '', { fontFamily: 'Arial Black', fontSize: '42px', color: '#ffffff' }).setOrigin(0.5).setAlpha(0).setDepth(5);

    this.hudGroup = [...this.p1PipRow, ...this.p2PipRow, this.roundText, this.phaseText, this.arenaLabelText];
  }

  setHudVisible(v) {
    this.hudGroup.forEach(o => o.setVisible(v));
    // Touch controls are VS-AI only (2P local shares a keyboard on one
    // device already; two on-screen stick clusters don't fit a phone
    // screen well) and only ever shown during actual play, never menus.
    if (this.touchUIWrap) this.touchUIWrap.style.display = (v && this.mode === 'ai') ? 'block' : 'none';
  }
  updateRoundPips() {
    this.p1PipRow.forEach((p, i) => p.setFillStyle(i < this.p1RoundWins ? 0x8fd3ff : 0x2a2e36));
    this.p2PipRow.forEach((p, i) => p.setFillStyle(i < this.p2RoundWins ? 0xff9f6b : 0x2a2e36));
  }

  // ------------------------------------------------------------ STRUGGLE UI
  buildStruggleUI() {
    const glyphStyle = { fontFamily: 'Arial Black', fontSize: '30px', color: '#ffffff', stroke: '#000000', strokeThickness: 4 };
    this.struggleTextA = this.add.text(0, 0, '', glyphStyle).setOrigin(0.5).setDepth(6).setVisible(false);
    this.struggleTextB = this.add.text(0, 0, '', glyphStyle).setOrigin(0.5).setDepth(6).setVisible(false);
    this.struggleLabel = this.add.text(W / 2, H / 2 - 118, 'PUSH-OFF!', { fontFamily: 'Arial Black', fontSize: '20px', color: '#ffd23f', stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6).setVisible(false);

    // Tug-of-war bar: a live readout of who's ahead in the exchange so far,
    // not just the arrows themselves. The marker slides toward whoever has
    // matched more prompts and blends color from p2's toward p1's as it goes.
    const barY = H / 2 - 92;
    this.struggleBarW = 200;
    this.struggleBarBg = this.add.rectangle(W / 2, barY, this.struggleBarW, 10, 0x151a24).setStrokeStyle(1, 0x3a4150).setDepth(6).setVisible(false);
    this.struggleBarMid = this.add.rectangle(W / 2, barY, 2, 16, 0x5a6578).setDepth(6).setVisible(false);
    this.struggleBarMarker = this.add.rectangle(W / 2, barY, 10, 20, 0xffffff).setDepth(7).setVisible(false);
  }

  // Slides/recolors the tug-of-war marker to reflect the current round score.
  updateStruggleBar() {
    const s = this.struggle;
    const frac = Phaser.Math.Clamp((s.aWins - s.bWins) / s.totalRounds, -1, 1); // -1 = p2 fully ahead, +1 = p1 fully ahead
    this.struggleBarMarker.setX(W / 2 + frac * (this.struggleBarW / 2 - 6));
    const t = (frac + 1) / 2; // 0 = fully p2's color, 1 = fully p1's color
    const c2 = Phaser.Display.Color.ValueToColor(this.p2.color);
    const c1 = Phaser.Display.Color.ValueToColor(this.p1.color);
    const r = Phaser.Math.Linear(c2.red, c1.red, t);
    const g = Phaser.Math.Linear(c2.green, c1.green, t);
    const b = Phaser.Math.Linear(c2.blue, c1.blue, t);
    this.struggleBarMarker.setFillStyle(Phaser.Display.Color.GetColor(r, g, b));
  }

  // Quick scale-punch feedback on a successful match.
  punchStruggleGlyph(txt) {
    this.tweens.add({ targets: txt, scale: 1.4, duration: 90, yoyo: true, ease: 'Quad.Out' });
  }

  // ------------------------------------------------------------ OVER PANEL
  buildOverPanel() {
    const items = [];
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.55);
    const headline = this.add.text(W / 2, H / 2 - 40, '', { fontFamily: 'Arial Black', fontSize: '30px', color: '#ffffff' }).setOrigin(0.5);
    const sub = this.add.text(W / 2, H / 2, '', { fontFamily: 'Arial', fontSize: '16px', color: '#cbd5e1' }).setOrigin(0.5);
    const rematchBg = this.add.rectangle(W / 2, H / 2 + 60, 220, 50, 0x151a24).setStrokeStyle(2, 0xffd23f).setInteractive({ useHandCursor: true });
    const rematchLabel = this.add.text(W / 2, H / 2 + 60, 'REMATCH', { fontFamily: 'Arial Black', fontSize: '18px', color: '#ffd23f' }).setOrigin(0.5);
    const menuLabel = this.add.text(W / 2, H / 2 + 110, 'MENU', { fontFamily: 'Arial', fontSize: '14px', color: '#7f8a9a' }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    rematchBg.on('pointerover', () => rematchBg.setStrokeStyle(3, 0xffd23f));
    rematchBg.on('pointerout', () => rematchBg.setStrokeStyle(2, 0xffd23f));
    rematchBg.on('pointerdown', () => {
      if (window.SFX) SFX.click();
      this.setOverVisible(false);
      const matchDecided = this.p1RoundWins >= ROUNDS_TO_WIN || this.p2RoundWins >= ROUNDS_TO_WIN;
      if (matchDecided) this.startMatch(this.mode);
      else this.startNextRound();
    });
    menuLabel.on('pointerdown', () => {
      if (window.SFX) { SFX.click(); if (typeof SFX.stopMusic === 'function') SFX.stopMusic(); }
      this.setOverVisible(false);
      this.setHudVisible(false);
      this.state = 'menu';
      this.setModeSelectVisible(true);
    });

    items.push(dim, headline, sub, rematchBg, rematchLabel, menuLabel);
    this.overItems = items;
    this.overHeadline = headline;
    this.overSub = sub;
    this.rematchLabel = rematchLabel;
  }
  setOverVisible(v) { this.overItems.forEach(o => o.setVisible(v)); }

  // --------------------------------------------------------------- MATCH
  startMatch(mode) {
    this.mode = mode;
    this.p1RoundWins = 0;
    this.p2RoundWins = 0;
    this.updateRoundPips();
    this.currentRound = 1;
    this.setHudVisible(true);
    this.startRound();
  }

  startNextRound() {
    this.currentRound++;
    this.startRound();
  }

  startRound() {
    this.isDeciderRound = this.p1RoundWins === ROUNDS_TO_WIN - 1 && this.p2RoundWins === ROUNDS_TO_WIN - 1;
    const timing = this.isDeciderRound ? ROUND_TIMING[ROUND_TIMING.length - 1] : ROUND_TIMING[Math.min(this.currentRound - 1, ROUND_TIMING.length - 1)];
    const arenaDef = ARENA_DEFS[this.arenaKey];
    if (this.arenaKey === 'iron') {
      // Pure pressure: smaller starting ring, faster fuse to Sudden Death —
      // no new mechanic, just less room and less time.
      this.roundSuddenDeathMs = Math.round(timing.suddenDeathMs * arenaDef.timeMult);
      this.roundShrinkMs = Math.round(timing.shrinkMs * arenaDef.timeMult);
      this.ringRadius = Math.max(timing.ringRadius + arenaDef.radiusDelta, RING_MIN_RADIUS + 15);
    } else {
      this.roundSuddenDeathMs = timing.suddenDeathMs;
      this.roundShrinkMs = timing.shrinkMs;
      this.ringRadius = timing.ringRadius;
    }
    this.ringCenterX = RING_CX;
    this.ringCenterY = RING_CY;
    this.risingSunStaged = false;
    this.arenaLabelText.setText(arenaDef.name);
    this.drawRing();
    this.roundElapsed = 0;
    this.suddenDeath = false;
    this.resetWrestler(this.p1, this.ringCenterX - 90, this.ringCenterY, 0);
    this.resetWrestler(this.p2, this.ringCenterX + 90, this.ringCenterY, Math.PI);
    this.roundText.setText(this.isDeciderRound ? 'FINAL ROUND' : `ROUND ${this.currentRound}`);
    this.roundText.setColor(this.isDeciderRound ? '#ff5a5a' : '#cbd5e1');
    this.phaseText.setText('');
    this.state = 'countdown';
    this.countdownUntil = this.time.now + 900;
    this.announce(this.isDeciderRound ? 'FINAL ROUND' : `ROUND ${this.currentRound}`, this.isDeciderRound ? '#ff5a5a' : '#ffd23f');
    if (window.SFX && typeof SFX.playMusic === 'function') SFX.playMusic('sumoAmbient'); // every round starts back on the calm loop, even a Sudden-Death carry-over round
    this.time.delayedCall(900, () => {
      if (this.state !== 'countdown') return;
      // Input is never processed during the countdown, so a key held through it
      // would otherwise be read as a brand-new press the instant play starts -
      // a guaranteed, zero-reaction-time opening dash. Arm the edge-detector
      // with whatever's actually held right now so a pre-held key requires a
      // real release+press before it counts.
      this.armChargeKeys();
      // Both wrestlers are primed for the tachiai (the sumo opening charge) -
      // give the AI a brief window of much sharper reactions right as the round
      // goes live, scaled by tier, so an instant opening rush isn't a free win
      // at Hard/Expert. Easy keeps its normal (slow) reactions - it's supposed
      // to be genuinely catchable off guard.
      this.openingAlertUntil = this.time.now + 1500;
      this.state = 'playing';
    });
  }

  armChargeKeys() {
    const p1Key = this.mode === 'ai' ? this.keys.space.isDown : this.keys.f.isDown;
    this.p1.chargeKeyWasDown = p1Key;
    if (this.mode === 'local') this.p2.chargeKeyWasDown = this.keys.l.isDown;
  }

  announce(text, color) {
    this.bannerText.setText(text).setColor(color).setAlpha(1).setScale(0.6);
    this.tweens.add({ targets: this.bannerText, scale: 1.05, duration: 220, ease: 'Back.Out' });
    this.tweens.add({ targets: this.bannerText, alpha: 0, delay: 900, duration: 400 });
  }

  // --------------------------------------------------------------- UPDATE
  update(time, delta) {
    if (this.state !== 'playing' && this.state !== 'countdown') return;
    const realDt = Math.min(delta, 40);
    if (this.state === 'countdown') return; // frozen, waiting for the round to open

    this.roundElapsed += realDt;
    this.updateRingShrink();
    this.updateArenaEffects();

    if (this.struggle) {
      // Frozen mid-collision: normal input/AI/physics/collision all pause while
      // the interactive push-struggle plays out, but the world keeps breathing
      // around it (ring shrink already ticked above, dust settles, the edge
      // glow keeps pulsing) so it never feels like the game itself stalled.
      this.updateStruggle(realDt);
      this.updateDust(realDt);
      this.updateEdgeWarning();
      this.drawWrestlers();
      this.updatePhaseText();
      return;
    }

    const slowMo = this.time.now < this.slowUntil;
    const dt = slowMo ? realDt * 0.28 : realDt;

    this.handleWrestlerInput(this.p1, this.mode === 'ai' ? 'p1ArrowsSpace' : 'p1WasdF', dt);
    if (this.mode === 'ai') this.updateAI(dt);
    else this.handleWrestlerInput(this.p2, 'p2ArrowsL', dt);

    this.integrateWrestler(this.p1, dt);
    this.integrateWrestler(this.p2, dt);
    this.resolveCollision();
    this.clampToCanvas(this.p1);
    this.clampToCanvas(this.p2);
    this.checkRingOut();
    this.updateDust(realDt);
    this.updateEdgeWarning();
    this.drawWrestlers();
    this.updatePhaseText();
  }

  // ------------------------------------------------------------ EDGE WARNING
  updateEdgeWarning() {
    [this.p1, this.p2].forEach(f => {
      const critical = this.edgeDistance(f) <= CRITICAL_EDGE_DIST;
      if (critical && !f.wasCritical) Sound.edgeWarning();
      f.wasCritical = critical;
    });
    this.edgeWarnG.clear();
    const anyCritical = this.edgeDistance(this.p1) <= CRITICAL_EDGE_DIST || this.edgeDistance(this.p2) <= CRITICAL_EDGE_DIST;
    if (!anyCritical) return;
    const pulse = 0.35 + Math.sin(this.time.now * 0.012) * 0.25;
    this.edgeWarnG.lineStyle(7, 0xff5a5a, pulse);
    this.edgeWarnG.strokeCircle(this.ringCenterX, this.ringCenterY, this.ringRadius);
  }

  // -------------------------------------------------------------- RING SHRINK
  updateRingShrink() {
    // Rising Sun: one dramatic, clearly-announced mid-round contraction on
    // top of the normal Sudden-Death shrink below, instead of one smooth
    // taper — the ring visibly steps down in stages rather than creeping.
    if (this.arenaKey === 'risingsun' && !this.suddenDeath && !this.risingSunStaged) {
      const def = ARENA_DEFS.risingsun;
      if (this.roundElapsed >= this.roundSuddenDeathMs * def.stageFrac) {
        this.risingSunStaged = true;
        const target = Math.max(this.ringRadius - def.stageDrop, RING_MIN_RADIUS + 10);
        this.announce('HIGH SUN', '#ff9f4a');
        Sound.contraction();
        this.tweens.add({ targets: this, ringRadius: target, duration: 900, ease: 'Sine.InOut', onUpdate: () => this.drawRing() });
      }
    }
    if (!this.suddenDeath && this.roundElapsed >= this.roundSuddenDeathMs) {
      this.suddenDeath = true;
      this.suddenDeathAt = this.roundElapsed;
      this.suddenDeathStartRadius = this.ringRadius;
      this.announce('SUDDEN DEATH', '#ff5a5a');
      Sound.suddenDeath();
      if (window.SFX && typeof SFX.playMusic === 'function') SFX.playMusic('sumoTense');
    }
    if (this.suddenDeath) {
      const t = Phaser.Math.Clamp((this.roundElapsed - this.suddenDeathAt) / this.roundShrinkMs, 0, 1);
      this.ringRadius = Phaser.Math.Linear(this.suddenDeathStartRadius, RING_MIN_RADIUS, t);
      this.drawRing();
    }
  }

  // -------------------------------------------------------------- ARENA FX
  // Drifting Dohyo's moving ring center. Everything else (Slip Sand's
  // friction band, Tilt Ring's nudging force) hooks into existing physics
  // functions instead, since they don't need their own per-frame driver.
  updateArenaEffects() {
    if (this.arenaKey !== 'drifting') return;
    const def = ARENA_DEFS.drifting;
    const tierScale = this.mode === 'ai' ? DIFFICULTY_DEFS[this.difficulty].driftScale : 0.6;
    const t = this.roundElapsed;
    // Two different frequencies/phases on X vs Y so the center wanders in a
    // lazy figure-eight rather than a simple back-and-forth line.
    this.ringCenterX = RING_CX + Math.sin(t / def.periodMs * Math.PI * 2) * def.ampX * tierScale;
    this.ringCenterY = RING_CY + Math.sin(t / def.periodMs * Math.PI * 2 * 0.55 + 1.3) * def.ampY * tierScale;
    this.drawRing();
  }

  updatePhaseText() {
    if (this.suddenDeath) {
      this.phaseText.setText('SUDDEN DEATH — the ring is closing in');
    } else {
      const remain = Math.max(0, this.roundSuddenDeathMs - this.roundElapsed);
      this.phaseText.setText(`Sudden Death in ${Math.ceil(remain / 1000)}s`);
    }
  }

  // --------------------------------------------------------------- INPUT
  // scheme: 'p1WasdF' | 'p1ArrowsSpace' | 'p2ArrowsL'
  handleWrestlerInput(f, scheme, dt) {
    let dirX = 0, dirY = 0, chargeKeyDown = false, usedStick = false;
    if (scheme === 'p1WasdF') {
      if (this.keys.a.isDown) dirX = -1; else if (this.keys.d.isDown) dirX = 1;
      if (this.keys.w.isDown) dirY = -1; else if (this.keys.s.isDown) dirY = 1;
      chargeKeyDown = this.keys.f.isDown;
    } else if (scheme === 'p1ArrowsSpace') {
      if (this.keys.left.isDown) dirX = -1; else if (this.keys.right.isDown) dirX = 1;
      if (this.keys.up.isDown) dirY = -1; else if (this.keys.down.isDown) dirY = 1;
      chargeKeyDown = this.keys.space.isDown;
      if (this.p1Touch) {
        const st = this.p1Touch.stick;
        if (st.x !== 0 || st.y !== 0) { dirX = st.x; dirY = st.y; usedStick = true; }
        if (this.p1Touch.charge.isDown()) chargeKeyDown = true;
      }
    } else { // p2ArrowsL
      if (this.keys.left.isDown) dirX = -1; else if (this.keys.right.isDown) dirX = 1;
      if (this.keys.up.isDown) dirY = -1; else if (this.keys.down.isDown) dirY = 1;
      chargeKeyDown = this.keys.l.isDown;
    }

    // The digital ±1/±1 correction only applies to keyboard's 8-way input —
    // the touch stick already reports a proper analog unit vector.
    if (!usedStick && dirX !== 0 && dirY !== 0) { dirX *= 0.7071; dirY *= 0.7071; }
    f.inputX = dirX; f.inputY = dirY;

    // charge start/release on key edge, human wrestlers only (AI drives its own state machine)
    if (chargeKeyDown && !f.chargeKeyWasDown && f.state === 'idle') {
      f.state = 'charging'; f.chargeStart = this.time.now; f.reachedStage1 = false; f.reachedStage2 = false;
    } else if (!chargeKeyDown && f.chargeKeyWasDown && f.state === 'charging') {
      this.releaseDash(f);
    }
    f.chargeKeyWasDown = chargeKeyDown;

    if (f.state === 'charging') {
      const held = this.time.now - f.chargeStart;
      if (held >= CHARGE_STAGE1_MS && !f.reachedStage1) { f.reachedStage1 = true; Sound.chargeTick(1); }
      if (held >= CHARGE_STAGE2_MS && !f.reachedStage2) { f.reachedStage2 = true; Sound.chargeTick(2); }
    }
  }

  releaseDash(f) {
    const heldMs = Phaser.Math.Clamp(this.time.now - f.chargeStart, 0, MAX_CHARGE_MS);
    const t = heldMs / MAX_CHARGE_MS;
    const speed = Phaser.Math.Linear(DASH_MIN_SPEED, DASH_MAX_SPEED, t);
    // dash direction: whatever direction is currently held, else last facing, else toward opponent
    let dx = f.inputX, dy = f.inputY;
    if (dx === 0 && dy === 0) { dx = Math.cos(f.facing); dy = Math.sin(f.facing); }
    const mag = Math.hypot(dx, dy) || 1;
    dx /= mag; dy /= mag;
    f.facing = Math.atan2(dy, dx);
    f.vx = dx * speed; f.vy = dy * speed;
    f.state = 'dashing'; f.dashStartedAt = this.time.now;
    f.dashTier = heldMs < CHARGE_STAGE1_MS ? 'quick' : (heldMs < CHARGE_STAGE2_MS ? 'medium' : 'strong');
    Sound.dash(f.dashTier);
  }

  // ------------------------------------------------------------- PHYSICS
  integrateWrestler(f, dt) {
    const now = this.time.now;
    const dirX = f.inputX || 0, dirY = f.inputY || 0;

    // Tilt Ring: a small shared force nudges BOTH wrestlers' movement
    // identically (never targeted, never applied mid-dash) — it modifies
    // velocity only, so collision normals and push strength downstream are
    // completely untouched.
    if (this.arenaKey === 'tilt' && f.state !== 'dashing') {
      const tierScale = this.mode === 'ai' ? DIFFICULTY_DEFS[this.difficulty].tiltScale : 0.6;
      if (tierScale > 0) {
        const ang = (this.time.now / TILT_PERIOD_MS) * Math.PI * 2;
        f.vx += Math.cos(ang) * TILT_ACCEL_BASE * tierScale * (dt / 1000);
        f.vy += Math.sin(ang) * TILT_ACCEL_BASE * tierScale * (dt / 1000) * 0.6;
      }
    }

    if (f.state === 'charging') {
      if (dirX || dirY) { f.vx += dirX * MOVE_ACCEL * CHARGE_MOVE_MULT * (dt / 1000); f.vy += dirY * MOVE_ACCEL * CHARGE_MOVE_MULT * (dt / 1000); f.facing = Math.atan2(dirY, dirX); }
      this.applyFriction(f, dt, FRICTION);
      this.clampSpeed(f, MOVE_MAX_SPEED * CHARGE_MOVE_MULT);
    } else if (f.state === 'dashing') {
      this.applyFriction(f, dt, DASH_FRICTION);
      const speed = Math.hypot(f.vx, f.vy);
      if (now - f.dashStartedAt >= DASH_MAX_DURATION_MS || speed < 40) {
        f.state = 'recovering'; f.recoveryUntil = now + RECOVERY_MS;
      }
    } else if (f.state === 'recovering') {
      if (dirX || dirY) { f.vx += dirX * MOVE_ACCEL * RECOVERY_MOVE_MULT * (dt / 1000); f.vy += dirY * MOVE_ACCEL * RECOVERY_MOVE_MULT * (dt / 1000); f.facing = Math.atan2(dirY, dirX); }
      this.applyFriction(f, dt, FRICTION);
      this.clampSpeed(f, MOVE_MAX_SPEED * RECOVERY_MOVE_MULT);
      if (now >= f.recoveryUntil) f.state = 'idle';
    } else if (f.state === 'staggered') {
      if (dirX || dirY) { f.vx += dirX * MOVE_ACCEL * STAGGER_MOVE_MULT * (dt / 1000); f.vy += dirY * MOVE_ACCEL * STAGGER_MOVE_MULT * (dt / 1000); }
      this.applyFriction(f, dt, STAGGER_FRICTION);
      if (now >= f.staggerUntil) f.state = 'idle';
    } else { // idle
      if (dirX || dirY) { f.vx += dirX * MOVE_ACCEL * (dt / 1000); f.vy += dirY * MOVE_ACCEL * (dt / 1000); f.facing = Math.atan2(dirY, dirX); }
      this.applyFriction(f, dt, FRICTION);
      this.clampSpeed(f, MOVE_MAX_SPEED);
    }

    f.x += f.vx * (dt / 1000);
    f.y += f.vy * (dt / 1000);
  }

  applyFriction(f, dt, amount) {
    const speed = Math.hypot(f.vx, f.vy);
    if (speed <= 0) return;
    // Slip Sand: the outer band near the boundary (same edgeDistance() check
    // everything else uses) is looser footing — friction softens there, the
    // boundary itself never moves.
    if (this.arenaKey === 'slipsand' && this.edgeDistance(f) <= SLIP_SAND_BAND_WIDTH) {
      amount *= SLIP_SAND_FRICTION_MULT;
    }
    const drop = amount * (dt / 1000);
    const newSpeed = Math.max(0, speed - drop);
    const scale = speed > 0 ? newSpeed / speed : 0;
    f.vx *= scale; f.vy *= scale;
  }

  clampSpeed(f, max) {
    const speed = Math.hypot(f.vx, f.vy);
    if (speed > max) { const s = max / speed; f.vx *= s; f.vy *= s; }
  }

  clampToCanvas(f) {
    f.x = Phaser.Math.Clamp(f.x, WRESTLER_R, W - WRESTLER_R);
    f.y = Phaser.Math.Clamp(f.y, WRESTLER_R + 30, H - WRESTLER_R - 10);
  }

  edgeDistance(f) {
    const d = Phaser.Math.Distance.Between(f.x, f.y, this.ringCenterX, this.ringCenterY);
    return this.ringRadius - d;
  }

  // ------------------------------------------------------------ COLLISION
  resolveCollision() {
    const a = this.p1, b = this.p2;
    if (this.struggle) return; // frozen mid push-struggle — nothing to resolve until it finishes
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDist = WRESTLER_R * 2;
    if (dist >= minDist) return;

    const nx = dx / dist, ny = dy / dist;
    const overlap = minDist - dist;
    a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2; b.y += ny * overlap / 2;

    const aAlong = a.vx * nx + a.vy * ny;   // a's speed toward b
    const bAlong = b.vx * nx + b.vy * ny;   // b's speed away from a (positive = retreating, negative = charging at a)
    // BUG FIX: this was "aAlong - bAlong", which is the relative velocity of
    // approach, NOT a measure of who has more momentum. When both wrestlers
    // dash directly at each other (the single most common collision in the
    // game), aAlong is positive and bAlong is negative, so aAlong - bAlong
    // summed BOTH wrestlers' speed into one huge always-positive number -
    // meaning "a" (the human player, p1) won essentially every head-on
    // exchange regardless of which side actually dashed harder. b's own
    // "aggression toward a" is -bAlong, so the correct comparison is
    // aAlong - (-bAlong) = aAlong + bAlong. This also means genuinely
    // balanced head-on hits now correctly land near zero and can trigger
    // a Clash, instead of the old sum almost always blowing past the
    // Clash threshold.
    const netForce = aAlong + bAlong;       // positive => a is winning the exchange

    const aSpeedTotal = Math.hypot(a.vx, a.vy) || 1;
    const bSpeedTotal = Math.hypot(b.vx, b.vy) || 1;
    const isHeadOn = (Math.abs(aAlong) / aSpeedTotal) > CLASH_HEADON_MIN && (Math.abs(bAlong) / bSpeedTotal) > CLASH_HEADON_MIN;

    const bothDashing = a.state === 'dashing' && b.state === 'dashing';
    if (bothDashing && isHeadOn && Math.abs(netForce) < CLASH_SPEED_THRESHOLD) {
      this.triggerClash(a, b, nx, ny);
      return;
    }

    // Any hit that involves a real dash (i.e. one that actually matters) no
    // longer resolves the instant two bodies touch. It freezes into the
    // interactive push-struggle instead — momentum still seeds who's ahead,
    // but the player's own key-matching now decides who actually wins it.
    // A stray idle/idle jostle (nobody dashing, near-zero force either way)
    // isn't worth a mini-game, so it still resolves instantly below.
    const involvesDash = a.state === 'dashing' || b.state === 'dashing';
    if (involvesDash) {
      this.startStruggle(a, b, nx, ny, netForce);
      return;
    }

    this.applyPushResolution(a, b, nx, ny, netForce);
  }

  applyPushResolution(a, b, nx, ny, netForce) {
    const winner = netForce >= 0 ? a : b;
    const loser = netForce >= 0 ? b : a;
    const dir = netForce >= 0 ? 1 : -1;
    let pushMag = Math.min(Math.abs(netForce) * PUSH_SCALE + PUSH_BASE, PUSH_CAP);
    // A little organic variance so identical inputs don't always produce the
    // identical outcome (a real shove is never perfectly repeatable).
    pushMag *= 0.87 + Math.random() * 0.26; // 0.87x - 1.13x
    if (this.mode === 'ai') {
      const def = DIFFICULTY_DEFS[this.difficulty];
      if (loser === this.p2) {
        // AI-only resistance, scaled by tier - a higher difficulty is genuinely
        // harder to ring out, not just smarter. Never applies to the player.
        pushMag *= def.aiPushResist;
      } else if (winner === this.p2) {
        // AI-only offense bonus - once it's correctly won an exchange, a
        // higher tier's shove actually hurts more too. Never applies to the
        // player's own winning pushes.
        pushMag *= def.aiPushBonus;
      }
    }
    const loserCritical = this.edgeDistance(loser) <= CRITICAL_EDGE_DIST;
    if (loserCritical) pushMag *= CRITICAL_PUSH_MULT;

    loser.vx += nx * dir * pushMag;
    loser.vy += ny * dir * pushMag;
    winner.vx -= nx * dir * pushMag * 0.22;
    winner.vy -= ny * dir * pushMag * 0.22;

    this.applyStagger(loser);
    if (winner.state === 'charging') { winner.state = 'idle'; } // a clean win also cancels a charge-in-progress
    Sound.impact(pushMag > 260);
    this.cameras.main.shake(pushMag > 300 ? 100 : 55, pushMag > 300 ? 0.007 : 0.0035);
    const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
    this.spawnDust(midX, midY, Math.min(pushMag / 32, 14));
    this.spawnImpactFlash(midX, midY, nx, ny, dir, pushMag, winner.color);
  }

  // ------------------------------------------------------------ PUSH STRUGGLE
  // Freezes both wrestlers at the point of contact for a short best-of-N
  // key-matching contest. Each round shows one shared directional prompt;
  // each side races to press their OWN matching movement key (the AI rolls
  // its own success chance instead). Net rounds won converts to a force
  // bonus that's blended with the original hit's momentum and fed straight
  // into the same applyPushResolution() everything else already uses — so
  // difficulty tuning (aiPushResist/aiPushBonus/critical multiplier/etc.)
  // still governs the final shove exactly as before.
  startStruggle(a, b, nx, ny, netForce) {
    a.vx = 0; a.vy = 0; b.vx = 0; b.vy = 0;
    a.state = 'struggling'; b.state = 'struggling';
    // Total rounds scales with difficulty too — Easy is a quick 2-round
    // formality, Expert drags it out to a grueling 5, same as the window
    // and AI reaction speed.
    const totalRounds = this.mode === 'ai' ? DIFFICULTY_DEFS[this.difficulty].struggleRounds : STRUGGLE_ROUNDS_LOCAL;
    this.struggle = {
      a, b, nx, ny,
      seedForce: netForce * STRUGGLE_MOMENTUM_WEIGHT,
      aWins: 0, bWins: 0,
      round: 0,
      totalRounds,
      dir: null,
      phase: 'gap',
      phaseUntil: this.time.now + 200,
      aHit: false, bHit: false,
      aiWillHit: false, aiHitAt: 0
    };
    this.struggleLabel.setVisible(true);
    this.struggleBarBg.setVisible(true);
    this.struggleBarMid.setVisible(true);
    this.struggleBarMarker.setVisible(true).setFillStyle(0xffffff).setX(W / 2);
    Sound.struggleStart();
  }

  getWrestlerDirKeys(who) {
    if (who === this.p1) {
      return this.mode === 'ai'
        ? { up: this.keys.up, down: this.keys.down, left: this.keys.left, right: this.keys.right }
        : { up: this.keys.w, down: this.keys.s, left: this.keys.a, right: this.keys.d };
    }
    // p2's keys are only read here in local mode — the AI's own "input" is
    // simulated in updateStruggle via struggleAccuracy, never read from keys.
    return { up: this.keys.up, down: this.keys.down, left: this.keys.left, right: this.keys.right };
  }

  updateStruggle(dt) {
    const s = this.struggle;
    const now = this.time.now;

    if (s.phase === 'gap') {
      if (now < s.phaseUntil) return;
      if (s.round >= s.totalRounds) { this.resolveStruggle(); return; }
      s.round++;
      s.dir = Phaser.Utils.Array.GetRandom(STRUGGLE_DIRS);
      s.aHit = false; s.bHit = false;
      s.phase = 'prompt';
      // The window itself scales with difficulty (not just AI accuracy) so a
      // struggle against Expert genuinely doesn't feel like the same contest
      // as Easy — less time to react on top of a sharper, faster opponent.
      const windowMs = this.mode === 'ai' ? DIFFICULTY_DEFS[this.difficulty].struggleWindowMs : STRUGGLE_WINDOW_MS_LOCAL;
      s.phaseUntil = now + windowMs;
      if (this.mode === 'ai') {
        const def = DIFFICULTY_DEFS[this.difficulty];
        s.aiWillHit = Math.random() < def.struggleAccuracy;
        s.aiHitAt = now + windowMs * Phaser.Math.Linear(def.struggleReactMin, def.struggleReactMax, Math.random());
      }
      this.showStrugglePrompt();
      return;
    }

    // phase === 'prompt'
    if (!s.aHit) {
      const keys = this.getWrestlerDirKeys(s.a);
      const touchHit = this.p1Touch && this.p1Touch.stick.consumeDir(s.dir);
      if (touchHit || Phaser.Input.Keyboard.JustDown(keys[s.dir])) {
        s.aHit = true; s.aWins++;
        Sound.struggleHit();
        this.struggleTextA.setColor('#5be37b');
        this.punchStruggleGlyph(this.struggleTextA);
        this.updateStruggleBar();
      }
    }
    if (!s.bHit) {
      if (this.mode === 'ai') {
        if (s.aiWillHit && now >= s.aiHitAt) {
          s.bHit = true; s.bWins++;
          this.struggleTextB.setColor('#5be37b');
          this.punchStruggleGlyph(this.struggleTextB);
          this.updateStruggleBar();
        }
      } else {
        const keys = this.getWrestlerDirKeys(s.b);
        if (Phaser.Input.Keyboard.JustDown(keys[s.dir])) {
          s.bHit = true; s.bWins++;
          Sound.struggleHit();
          this.struggleTextB.setColor('#5be37b');
          this.punchStruggleGlyph(this.struggleTextB);
          this.updateStruggleBar();
        }
      }
    }

    if (now >= s.phaseUntil) {
      if (!s.aHit) { Sound.struggleMiss(); this.struggleTextA.setColor('#ff5a5a'); }
      if (!s.bHit) this.struggleTextB.setColor('#ff5a5a');
      s.phase = 'gap';
      s.phaseUntil = now + STRUGGLE_GAP_MS;
      this.hideStrugglePrompt();
    }
  }

  showStrugglePrompt() {
    const s = this.struggle;
    const glyph = STRUGGLE_DIR_GLYPH[s.dir];
    this.struggleTextA.setText(glyph).setPosition(s.a.x, s.a.y - 58).setColor('#ffffff').setAlpha(1).setScale(1).setVisible(true);
    this.struggleTextB.setText(glyph).setPosition(s.b.x, s.b.y - 58).setColor('#ffffff').setAlpha(1).setScale(1).setVisible(true);
  }

  hideStrugglePrompt() {
    // Fade rather than snap invisible so a red (missed) or green (hit) glyph
    // gets a beat to actually read before it disappears.
    [this.struggleTextA, this.struggleTextB].forEach(txt => {
      if (!txt.visible) return;
      this.tweens.add({
        targets: txt, alpha: 0, duration: 160,
        onComplete: () => { txt.setVisible(false).setAlpha(1); }
      });
    });
  }

  resolveStruggle() {
    const s = this.struggle;
    const matchDiff = s.aWins - s.bWins; // positive => p1 (a) matched more prompts
    const netForce = s.seedForce + matchDiff * STRUGGLE_MATCH_FORCE;
    if (this.mode === 'ai') {
      if (matchDiff > 0) Sound.struggleWin();
      else if (matchDiff < 0) Sound.struggleLose();
      else Sound.struggleTie();
    }
    this.hideStrugglePrompt();
    this.struggleLabel.setVisible(false);
    this.struggleBarBg.setVisible(false);
    this.struggleBarMid.setVisible(false);
    this.struggleBarMarker.setVisible(false);
    this.struggle = null;
    s.a.state = 'idle'; s.b.state = 'idle';
    this.applyPushResolution(s.a, s.b, s.nx, s.ny, netForce);
  }

  // ------------------------------------------------------------ IMPACT FLASH
  // A quick radial "IMPACT!" burst at the contact point — not a directional
  // vector diagram. It has to read in a glance and be gone: spikes + a ring,
  // scaling outward and fading in ~100ms, so the eye moves on to the actual
  // displacement/edge-danger instead of lingering on the effect itself.
  spawnImpactFlash(x, y, nx, ny, dir, mag, color) {
    const g = this.add.graphics().setDepth(4).setPosition(x, y);
    const size = Phaser.Math.Clamp(mag / 9, 9, 24);
    const spikes = 7;
    g.lineStyle(3, 0xffffff, 1);
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2 + Math.random() * 0.4;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * size, Math.sin(a) * size); g.strokePath();
    }
    g.lineStyle(2, color, 0.9);
    g.strokeCircle(0, 0, size * 0.55);
    g.setScale(0.4);
    this.tweens.add({
      targets: g, scale: 1.5, alpha: 0,
      duration: Phaser.Math.Clamp(80 + mag * 0.1, 80, 120),
      ease: 'Cubic.Out',
      onComplete: () => g.destroy()
    });
  }

  applyStagger(f) {
    f.state = 'staggered';
    f.staggerUntil = this.time.now + STAGGER_MS;
  }

  triggerClash(a, b, nx, ny) {
    // Sequenced like a real impact rather than one instant burst: slowdown starts
    // immediately, the heavy hit lands, then dust and camera shake follow it —
    // matching how a real collision's shockwave reads a beat after contact.
    this.slowUntil = this.time.now + 320;
    Sound.clash();
    this.announce('CLASH!', '#ffd23f');
    const bounce = 300;
    a.vx -= nx * bounce; a.vy -= ny * bounce;
    b.vx += nx * bounce; b.vy += ny * bounce;
    a.state = 'recovering'; a.recoveryUntil = this.time.now + RECOVERY_MS;
    b.state = 'recovering'; b.recoveryUntil = this.time.now + RECOVERY_MS;
    const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
    this.time.delayedCall(70, () => this.spawnDust(midX, midY, 10));
    this.time.delayedCall(100, () => this.cameras.main.shake(150, 0.014));
    this.time.delayedCall(130, () => this.spawnDust(midX, midY, 10));
  }

  spawnDust(x, y, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 120;
      this.dustParticles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 300 + Math.random() * 200, maxLife: 500 });
    }
  }

  updateDust(dt) {
    this.dustG.clear();
    this.dustParticles = this.dustParticles.filter(p => {
      p.life -= dt;
      if (p.life <= 0) return false;
      p.x += p.vx * (dt / 1000); p.y += p.vy * (dt / 1000);
      p.vx *= 0.92; p.vy *= 0.92;
      const a = Phaser.Math.Clamp(p.life / p.maxLife, 0, 1) * 0.5;
      this.dustG.fillStyle(0xc9a15a, a).fillCircle(p.x, p.y, 3 + a * 4);
      return true;
    });
  }

  // ------------------------------------------------------------ RING-OUT
  checkRingOut() {
    if (this.state !== 'playing') return;
    const p1Out = this.edgeDistance(this.p1) <= 0;
    const p2Out = this.edgeDistance(this.p2) <= 0;
    if (!p1Out && !p2Out) return;
    Sound.ringOut();
    if (p1Out && p2Out) { this.finishRound(Math.random() < 0.5 ? 'p2' : 'p1'); return; }
    this.finishRound(p1Out ? 'p2' : 'p1');
  }

  finishRound(winnerSide) {
    this.state = 'roundOver';
    if (window.SFX && typeof SFX.stopMusic === 'function') SFX.stopMusic(); // let the round/match-over stinger and panel breathe without the loop under it
    if (winnerSide === 'p1') this.p1RoundWins++; else this.p2RoundWins++;
    this.updateRoundPips();
    const matchDecided = this.p1RoundWins >= ROUNDS_TO_WIN || this.p2RoundWins >= ROUNDS_TO_WIN;
    const p1Won = winnerSide === 'p1';

    if (matchDecided) {
      const headline = this.mode === 'ai' ? (p1Won ? 'YOU WIN THE MATCH' : 'CPU WINS THE MATCH') : (p1Won ? 'P1 WINS THE MATCH' : 'P2 WINS THE MATCH');
      this.overHeadline.setText(headline);
      this.overSub.setText(`Rounds: ${this.p1RoundWins} — ${this.p2RoundWins}`);
      this.rematchLabel.setText('REMATCH');
    } else {
      const headline = this.mode === 'ai' ? (p1Won ? `YOU WIN ROUND ${this.currentRound}` : `CPU WINS ROUND ${this.currentRound}`) : (p1Won ? `P1 WINS ROUND ${this.currentRound}` : `P2 WINS ROUND ${this.currentRound}`);
      this.overHeadline.setText(headline);
      this.overSub.setText(`Round score: ${this.p1RoundWins} — ${this.p2RoundWins}`);
      this.rematchLabel.setText('NEXT ROUND');
    }
    this.setOverVisible(true);
  }

  // ------------------------------------------------------------------ AI
  updateAI(dt) {
    const ai = this.p2, foe = this.p1;
    const def = DIFFICULTY_DEFS[this.difficulty];
    const now = this.time.now;

    // reset the reaction flag once the foe stops charging (so it can react to the next charge)
    if (foe.state !== 'charging') ai.reactedToThisCharge = false;

    // reactive counter: foe has started charging (checked well before the
    // visible telegraph so quick taps aren't invisible to the AI's reactions).
    // During the opening tachiai window, use the tier's sharper opening
    // reactions instead of its normal (slower) ones.
    const inOpeningWindow = now < this.openingAlertUntil;
    const reactDelay = inOpeningWindow ? def.openingReactDelayMs : AI_REACT_DELAY_MS;
    const reactChance = inOpeningWindow ? def.openingReactChance : def.reactChance;
    if (foe.state === 'charging' && (now - foe.chargeStart) >= reactDelay && !ai.reactedToThisCharge
        && ai.state !== 'charging' && ai.state !== 'dashing') {
      ai.reactedToThisCharge = true;
      if (Math.random() < reactChance) {
        if (Math.random() < def.waitForCommit) {
          // Start charging NOW and hold — the counter's own strength builds for
          // as long as it waits, so a foe who fully charges gets met with a
          // comparably-charged counter instead of a token tap. (This used to
          // release with a fixed ~130ms reflex charge regardless of how long
          // the foe charged, which loses to ANY real commitment by ~325 speed —
          // a "smart" AI that waits should not be an automatic loss.)
          ai.pendingCounter = true;
          ai.state = 'charging'; ai.chargeStart = now; ai.reachedStage1 = false; ai.reachedStage2 = false;
        } else {
          ai.state = 'charging'; ai.chargeStart = now; ai.reachedStage1 = false; ai.reachedStage2 = false;
          ai.plannedReleaseAt = now + Phaser.Math.Between(def.minChargeMs, def.maxChargeMs);
        }
      }
    }
    if (ai.pendingCounter && foe.state === 'dashing') {
      ai.pendingCounter = false;
      ai.inputX = Math.cos(Math.atan2(foe.y - ai.y, foe.x - ai.x));
      ai.inputY = Math.sin(Math.atan2(foe.y - ai.y, foe.x - ai.x));
      this.releaseDash(ai);
    }

    // spontaneous aggression / punish window: this is the parameter that actually
    // reads as "intelligence" — a foe caught recovering, staggered, or pinned near
    // the edge is a mistake, and higher tiers seize it immediately via punishChance
    // instead of waiting on the slow, uniform chargeChance roll.
    if (ai.state === 'idle' && !ai.pendingCounter) {
      const foeEdgeDist = this.edgeDistance(foe);
      const aiEdgeDist = this.edgeDistance(ai);
      const selfSafeToCommit = aiEdgeDist > this.ringRadius * 0.3 || def.edgeAwareness < 0.3;
      const foeExposed = foeEdgeDist < this.ringRadius * 0.35;
      const foeVulnerable = foe.state === 'recovering' || foe.state === 'staggered' || foeEdgeDist <= CRITICAL_EDGE_DIST;

      let shouldCharge = false;
      if (selfSafeToCommit) {
        if (foeVulnerable && Math.random() < def.punishChance) shouldCharge = true;
        else if (foeExposed || Math.random() < def.chargeChance) shouldCharge = true;
      }
      if (shouldCharge) {
        ai.state = 'charging'; ai.chargeStart = now; ai.reachedStage1 = false; ai.reachedStage2 = false;
        ai.plannedReleaseAt = now + Phaser.Math.Between(def.minChargeMs, def.maxChargeMs);
      }
    }

    if (ai.state === 'charging' && ai.plannedReleaseAt && now >= ai.plannedReleaseAt) {
      ai.plannedReleaseAt = 0;
      // Aim the actual dash straight at the foe's current position — NOT whatever
      // inputX/Y was left over from this frame's movement (that's chase blended
      // with centerPull, which points toward ring center for the higher tiers and
      // was making every AI-initiated dash release increasingly off-target the
      // harder the difficulty, the opposite of the intended effect).
      const aimAngle = Math.atan2(foe.y - ai.y, foe.x - ai.x);
      ai.inputX = Math.cos(aimAngle); ai.inputY = Math.sin(aimAngle);
      this.releaseDash(ai);
    }

    // movement: while bracing for a counter, HOLD GROUND instead of drifting/chasing —
    // a visibly still opponent is the tell that it's watching for your release, and
    // is what actually sells "waiting for your mistake" rather than the timer alone.
    if (ai.pendingCounter) {
      ai.inputX = 0; ai.inputY = 0;
    } else if (ai.state === 'idle' || ai.state === 'charging') {
      // Uses the CURRENT ring center (this.ringCenterX/Y), not the fixed
      // canvas point — on Drifting Dohyo the AI needs to pull toward wherever
      // the ring actually is right now, not a stale spot it wandered away from.
      const targetX = Phaser.Math.Linear(foe.x, this.ringCenterX, def.centerPull);
      const targetY = Phaser.Math.Linear(foe.y, this.ringCenterY, def.centerPull);
      const dx = targetX - ai.x, dy = targetY - ai.y;
      const dist = Math.hypot(dx, dy) || 1;
      ai.inputX = dist > 8 ? dx / dist : 0;
      ai.inputY = dist > 8 ? dy / dist : 0;
    } else if (ai.state === 'staggered' && def.edgeAwareness >= 0.3) {
      // Scramble back toward the ring's center — STAGGER_MOVE_MULT already
      // gives a staggered wrestler SOME movement, but the AI's input was
      // always forced to 0 here, so it was a frozen target for however long
      // it stayed staggered. That's exactly why pinning it at the edge felt
      // unbeatable: every follow-up hit landed on someone with zero chance to
      // recover position. Easy (edgeAwareness 0) stays a sitting duck on
      // purpose - matches its "poor edge decisions" persona - but Normal and
      // up now genuinely fight to survive a knockback near the edge.
      const dx = this.ringCenterX - ai.x, dy = this.ringCenterY - ai.y;
      const dist = Math.hypot(dx, dy) || 1;
      ai.inputX = dist > 8 ? dx / dist : 0;
      ai.inputY = dist > 8 ? dy / dist : 0;
    } else {
      ai.inputX = 0; ai.inputY = 0;
    }

    if (ai.state === 'charging') {
      const held = now - ai.chargeStart;
      if (held >= CHARGE_STAGE1_MS && !ai.reachedStage1) { ai.reachedStage1 = true; Sound.chargeTick(1); }
      if (held >= CHARGE_STAGE2_MS && !ai.reachedStage2) { ai.reachedStage2 = true; Sound.chargeTick(2); }
    }
  }

  // ---------------------------------------------------------------- DRAW
  drawWrestlers() {
    [this.p1, this.p2].forEach(f => this.drawWrestler(f));
  }

  drawWrestler(f) {
    const g = f.graphic;
    g.clear();
    const now = this.time.now;
    const charging = f.state === 'charging';
    const dashing = f.state === 'dashing';
    const staggered = f.state === 'staggered';
    const critical = this.edgeDistance(f) <= CRITICAL_EDGE_DIST;

    const chargeT = charging ? Phaser.Math.Clamp((now - f.chargeStart) / MAX_CHARGE_MS, 0, 1) : 0;
    const squat = charging ? 1 - chargeT * 0.22 : (dashing ? 1.12 : 1);
    const stretch = dashing ? 1.25 : (charging ? 1 + chargeT * 0.12 : 1);
    const r = WRESTLER_R;

    let leanX = staggered ? -Math.cos(f.facing) * 10 : (dashing ? Math.cos(f.facing) * 6 : 0);
    let leanY = staggered ? -Math.sin(f.facing) * 10 : (dashing ? Math.sin(f.facing) * 6 : 0);
    if (critical) {
      const outAngle = Math.atan2(f.y - this.ringCenterY, f.x - this.ringCenterX);
      leanX += Math.cos(outAngle) * 4;
      leanY += Math.sin(outAngle) * 4;
    }

    const bodyColor = staggered ? Phaser.Display.Color.GetColor(255, 90, 90) : f.color;
    const alpha = staggered ? 0.7 + Math.sin(now * 0.03) * 0.15 : 1;

    // thick short legs (broad stance)
    g.fillStyle(f.dark, alpha);
    g.fillRect(f.x - r * 0.55, f.y + r * 0.35, r * 0.4, r * 0.55);
    g.fillRect(f.x + r * 0.15, f.y + r * 0.35, r * 0.4, r * 0.55);

    // body (squashed/stretched ellipse for weight + lean for stagger/dash)
    g.fillStyle(bodyColor, alpha);
    g.save && g.save();
    g.fillEllipse(f.x + leanX, f.y + leanY, r * 1.7 * stretch, r * 1.5 * squat);
    g.lineStyle(3, critical ? 0xff5a5a : f.dark, critical ? (0.6 + Math.sin(now * 0.015) * 0.4) : 1);
    g.strokeEllipse(f.x + leanX, f.y + leanY, r * 1.7 * stretch, r * 1.5 * squat);

    // head
    const headX = f.x + leanX + Math.cos(f.facing) * r * 0.85;
    const headY = f.y + leanY + Math.sin(f.facing) * r * 0.85 * 0.5;
    g.fillStyle(f.dark, alpha);
    g.fillCircle(headX, headY, r * 0.42);

    // arms (thick lines, spread wide when charging/braced)
    const armSpread = charging ? 0.9 : (dashing ? 0.5 : 0.65);
    const armFwd = charging ? -0.3 - chargeT * 0.3 : (dashing ? 0.9 : 0.2);
    const ax = f.x + leanX + Math.cos(f.facing) * r * armFwd;
    const ay = f.y + leanY + Math.sin(f.facing) * r * armFwd;
    g.lineStyle(6, f.dark, alpha);
    g.beginPath(); g.moveTo(f.x + leanX, f.y + leanY - r * 0.5); g.lineTo(ax, ay - r * armSpread * 0.7); g.strokePath();
    g.beginPath(); g.moveTo(f.x + leanX, f.y + leanY + r * 0.5); g.lineTo(ax, ay + r * armSpread * 0.7); g.strokePath();

    const moveSpeed = Math.hypot(f.vx, f.vy);
    if (dashing || (staggered && moveSpeed > 60)) {
      // motion/slide streak along actual velocity — a dash commits along facing,
      // but a shoved (staggered) wrestler slides wherever the push sent them.
      const moveAngle = moveSpeed > 5 ? Math.atan2(f.vy, f.vx) : f.facing;
      g.lineStyle(4, f.color, staggered ? 0.28 : 0.35);
      const bx = f.x - Math.cos(moveAngle) * r * 1.6, by = f.y - Math.sin(moveAngle) * r * 1.6;
      g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(bx, by); g.strokePath();
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game-container',
  backgroundColor: '#0a0a0d',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [SumoPushScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
