<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Highway Heat</title>
<style>
  html, body { margin:0; padding:0; background:#18181b; overflow:hidden; height:100%; overscroll-behavior:none; touch-action:none; }
  #game-container { display:flex; justify-content:center; align-items:center; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;
const LANE_X = [65, 155, 245, 335];
const PLAYER_Y = 560;
const CAR_W = 46;
const CAR_H = 80;
const ROAD_LEFT = 20;
const ROAD_RIGHT = 380;

const MAX_GAP = 220;
const START_GAP = 220;
const COLLISION_THRESHOLD = 16;
const NEAR_MISS_ADJACENT_ONLY = true;
const NEAR_MISS_GAP_BONUS = 38;
const CRITICAL_GAP = 55;

const OIL_COOLDOWN_MS = 6000;
const OIL_RECEDE_SPEED = 230;
const OIL_MATCH_Y_THRESHOLD = 18;
const OIL_MATCH_X_THRESHOLD = 38;
const OIL_GAP_BOOST = 90;

const ROADBLOCK_CHECK_MS = 4200;
const PRESSURE_DURATION_MS = 3800;
const PRESSURE_EXTRA_DRAIN_RATE = 22;
const CHECKPOINT_DISTANCE_INTERVAL = 25;
const CHECKPOINT_GAP_BOOST = 70;
const SPECIAL_SPAWN_MIN_GAP_MS = 900;

const TRAFFIC_COLORS = [0x64748b, 0x94a3b8, 0xdc2626, 0x2563eb, 0xca8a04, 0x9333ea];
const PLAYER_COLOR = 0xfbbf24;
const BEST_KEY = 'highwayheat_best';

function getPhase(dist) {
  if (dist < 8) return { trafficSpeed: 180, spawnMs: 950, gapCloseRate: 6, policeCount: 1, roadblockChance: 0, pressureEnabled: false };
  if (dist < 20) return { trafficSpeed: 210, spawnMs: 850, gapCloseRate: 9, policeCount: 1, roadblockChance: 0, pressureEnabled: false };
  if (dist < 40) return { trafficSpeed: 240, spawnMs: 750, gapCloseRate: 12, policeCount: 2, roadblockChance: 0.18, pressureEnabled: true };
  if (dist < 65) return { trafficSpeed: 270, spawnMs: 680, gapCloseRate: 16, policeCount: 2, roadblockChance: 0.28, pressureEnabled: true };
  return { trafficSpeed: 300, spawnMs: 620, gapCloseRate: 20, policeCount: 3, roadblockChance: 0.4, pressureEnabled: true };
}

function getHeatTier(dist) {
  if (dist < 8) return 0;
  if (dist < 20) return 1;
  if (dist < 40) return 2;
  if (dist < 65) return 3;
  return 4;
}

function heatDots(tier) {
  let s = '';
  for (let i = 0; i < 5; i++) s += i <= tier ? '\u25cf' : '\u25cb';
  return s;
}

function formatDist(n) {
  return Math.floor(n) + 'm';
}

const MULTIPLIER_TIERS = [
  { threshold: 25, mult: 5 },
  { threshold: 10, mult: 3 },
  { threshold: 5, mult: 2 },
  { threshold: 0, mult: 1 }
];

function getMultiplier(carsPassed) {
  for (const tier of MULTIPLIER_TIERS) {
    if (carsPassed >= tier.threshold) return tier.mult;
  }
  return 1;
}

const FUEL_DRAIN_RATE = 1.8;
const FUEL_REFILL_AMOUNT = 32;
const GAS_CHECK_MS = 3500;

function getGasChance(dist) {
  if (dist < 20) return 0.55;
  if (dist < 40) return 0.42;
  if (dist < 65) return 0.32;
  return 0.24;
}

function drawCarShape(scene, x, y, color, w, h) {
  w = w || CAR_W;
  h = h || CAR_H;
  const body = scene.add.rectangle(0, 0, w, h, color).setStrokeStyle(2, 0x000000, 0.35);
  const windshield = scene.add.rectangle(0, -h * 0.18, w * 0.72, h * 0.28, 0x0f172a, 0.55);
  const container = scene.add.container(x, y, [body, windshield]);
  container.body = body;
  container.carW = w;
  container.carH = h;
  return container;
}

const TRAFFIC_TYPES = [
  { type: 'car', width: CAR_W, height: CAR_H, weight: 0.6 },
  { type: 'truck', width: CAR_W * 1.35, height: CAR_H * 1.2, weight: 0.22 },
  { type: 'motorcycle', width: CAR_W * 0.5, height: CAR_H * 0.7, weight: 0.18 }
];

function pickTrafficType() {
  const r = Math.random();
  let acc = 0;
  for (const t of TRAFFIC_TYPES) {
    acc += t.weight;
    if (r < acc) return t;
  }
  return TRAFFIC_TYPES[0];
}

// Adaptive background audio: a continuous engine drone (pitch rises with
// speed) plus a rhythmic pulse layer that accelerates as the police gap
// closes. Built on SFX's shared AudioContext rather than a second one, and
// polls SFX.muted/SFX.volume every frame since sfx.js has no change event.
class MusicEngine {
  constructor() {
    this.running = false;
    this.droneOsc = null;
    this.droneFilter = null;
    this.droneGain = null;
    this.pulseNext = 0;
  }

  start() {
    SFX.ensureContext();
    if (!SFX.ctx) return;
    const ctx = SFX.ctx;

    this.droneOsc = ctx.createOscillator();
    this.droneOsc.type = 'sawtooth';
    this.droneOsc.frequency.value = 55;
    this.droneFilter = ctx.createBiquadFilter();
    this.droneFilter.type = 'lowpass';
    this.droneFilter.frequency.value = 220;
    this.droneGain = ctx.createGain();
    this.droneGain.gain.value = 0;
    this.droneOsc.connect(this.droneFilter);
    this.droneFilter.connect(this.droneGain);
    this.droneGain.connect(ctx.destination);
    this.droneOsc.start();

    this.running = true;
    this.pulseNext = 0;
  }

  update(delta, speedRatio, gapRatio) {
    if (!this.running || !SFX.ctx) return;
    const now = SFX.ctx.currentTime;

    const targetGain = SFX.muted ? 0 : 0.05 * SFX.volume;
    this.droneGain.gain.setTargetAtTime(targetGain, now, 0.05);

    const targetFreq = 55 + speedRatio * 22;
    this.droneOsc.frequency.setTargetAtTime(targetFreq, now, 0.3);

    this.pulseNext -= delta;
    if (this.pulseNext <= 0) {
      this.playPulse();
      this.pulseNext = Phaser.Math.Linear(900, 260, 1 - gapRatio);
    }
  }

  playPulse() {
    if (SFX.muted || !SFX.ctx) return;
    const ctx = SFX.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.12);
    const v = 0.09 * SFX.volume;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(v, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.17);
  }

  stop() {
    if (!this.running) return;
    this.running = false;
    if (this.droneOsc && SFX.ctx) {
      const now = SFX.ctx.currentTime;
      this.droneGain.gain.setTargetAtTime(0, now, 0.12);
      const osc = this.droneOsc, filter = this.droneFilter, gain = this.droneGain;
      setTimeout(() => {
        try { osc.stop(); } catch (e) {}
        osc.disconnect();
        filter.disconnect();
        gain.disconnect();
      }, 500);
    }
    this.droneOsc = null;
  }
}

class MainScene extends Phaser.Scene {
  constructor() { super('MainScene'); }

  create() {
    this.state = 'START';
    this.music = new MusicEngine();
    this.bestDist = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    this.cameras.main.setBackgroundColor(0x27272a);

    this.roadGraphics = this.add.graphics();
    this.dashOffset = 0;
    this.drawRoad();

    this.player = drawCarShape(this, LANE_X[1], PLAYER_Y, PLAYER_COLOR);
    this.currentLane = 1;

    this.policeCars = [];
    for (let i = 0; i < 3; i++) {
      const car = drawCarShape(this, LANE_X[1], GAME_HEIGHT + 200, 0x111827);
      const lightBar = this.add.rectangle(0, -CAR_H * 0.4, CAR_W * 0.5, 6, 0xef4444);
      car.add(lightBar);
      car.lightBar = lightBar;

      // officer leaning out the side window, radar gun aimed forward at the player
      const head = this.add.circle(CAR_W / 2 + 6, -18, 6, 0xd97757);
      const arm = this.add.rectangle(CAR_W / 2 + 12, -12, 4, 14, 0xd97757).setRotation(-0.5);
      const gun = this.add.rectangle(CAR_W / 2 + 19, -24, 15, 4, 0x27272a).setRotation(-0.5);
      const gunTip = this.add.circle(CAR_W / 2 + 25, -29, 2.5, 0xef4444);
      car.add([arm, head, gun, gunTip]);
      car.gunTip = gunTip;

      car.setVisible(false);
      this.policeCars.push(car);
    }

    this.distText = this.add.text(10, 12, '', { fontFamily: 'monospace', fontSize: '16px', color: '#f4f4f5' });
    this.bestText = this.add.text(GAME_WIDTH - 10, 12, 'Best: ' + formatDist(this.bestDist), {
      fontFamily: 'monospace', fontSize: '13px', color: '#a1a1aa'
    }).setOrigin(1, 0);

    this.gapBarBg = this.add.rectangle(GAME_WIDTH / 2, 38, 220, 10, 0x000000, 0.4).setStrokeStyle(1, 0x3f3f46);
    this.gapBarFill = this.add.rectangle(GAME_WIDTH / 2 - 110, 38, 220, 10, 0x22c55e).setOrigin(0, 0.5);
    this.gapLabel = this.add.text(GAME_WIDTH / 2, 52, 'DISTANCE FROM POLICE', {
      fontFamily: 'monospace', fontSize: '9px', color: '#a1a1aa'
    }).setOrigin(0.5, 0);
    this.gapIcon = this.add.container(76, 38, [
      this.add.rectangle(-5, 0, 9, 8, 0xef4444),
      this.add.rectangle(5, 0, 9, 8, 0x3b82f6)
    ]);

    this.fuelBarBg = this.add.rectangle(GAME_WIDTH / 2, 78, 220, 10, 0x000000, 0.4).setStrokeStyle(1, 0x3f3f46);
    this.fuelBarFill = this.add.rectangle(GAME_WIDTH / 2 - 110, 78, 220, 10, 0x38bdf8).setOrigin(0, 0.5);
    this.fuelLabel = this.add.text(GAME_WIDTH / 2, 92, 'FUEL', {
      fontFamily: 'monospace', fontSize: '9px', color: '#a1a1aa'
    }).setOrigin(0.5, 0);
    this.fuelIcon = this.add.container(76, 78, [
      this.add.rectangle(0, 1, 12, 15, 0xdc2626).setStrokeStyle(1, 0x1c1917),
      this.add.rectangle(0, -7, 6, 4, 0x1c1917)
    ]);

    this.scoreText = this.add.text(10, 108, '', {
      fontFamily: 'monospace', fontSize: '11px', color: '#fde047'
    });

    this.oilButtonBg = this.add.rectangle(GAME_WIDTH - 46, GAME_HEIGHT - 54, 74, 46, 0x1c1917, 0.85)
      .setStrokeStyle(2, 0x44403c).setInteractive();
    this.oilButtonText = this.add.text(GAME_WIDTH - 46, GAME_HEIGHT - 54, 'OIL', {
      fontFamily: 'monospace', fontSize: '13px', color: '#fbbf24', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.oilButtonBg.on('pointerdown', () => this.dropOilSlick());

    this.pressureOverlay = this.add.rectangle(LANE_X[0], GAME_HEIGHT / 2, 82, GAME_HEIGHT, 0xef4444, 0.22).setVisible(false);
    this.pressureText = this.add.text(GAME_WIDTH / 2, 126, '', {
      fontFamily: 'monospace', fontSize: '11px', color: '#fca5a5', fontStyle: 'bold', align: 'center'
    }).setOrigin(0.5, 0).setVisible(false);

    this.centerText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40, '', {
      fontFamily: 'monospace', fontSize: '25px', color: '#f4f4f5', align: 'center', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.subText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10, '', {
      fontFamily: 'monospace', fontSize: '13px', color: '#d4d4d8', align: 'center', wordWrap: { width: 320 }
    }).setOrigin(0.5);

    this.showStartScreen();

    this.traffic = [];
    this.oilSlicks = [];
    this.roadblocks = [];
    this.checkpoints = [];
    this.gasCans = [];

    this.input.on('pointerdown', (p) => { this.dragStartX = p.x; });
    this.input.on('pointerup', (p) => {
      if (this.state === 'START' || this.state === 'OVER') { this.startRun(); return; }
      if (this.dragStartX === undefined) return;
      const dx = p.x - this.dragStartX;
      if (Math.abs(dx) > 14) this.changeLane(dx > 0 ? 1 : -1);
    });

    this.input.keyboard.on('keydown', (e) => {
      if (this.state === 'START' || this.state === 'OVER') {
        if (e.key === ' ' || e.key === 'Enter') this.startRun();
        return;
      }
      if (e.key === 'ArrowLeft') this.changeLane(-1);
      else if (e.key === 'ArrowRight') this.changeLane(1);
    });
  }

  drawRoad() {
    this.roadGraphics.clear();
    this.roadGraphics.fillStyle(0x3f3f46, 1);
    this.roadGraphics.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, GAME_HEIGHT);
    this.roadGraphics.lineStyle(4, 0xfacc15, 0.55);
    for (let i = 1; i < LANE_X.length; i++) {
      const x = (LANE_X[i - 1] + LANE_X[i]) / 2;
      let y = (this.dashOffset % 56) - 56;
      while (y < GAME_HEIGHT) {
        this.roadGraphics.lineBetween(x, y, x, y + 28);
        y += 56;
      }
    }
  }

  showStartScreen() {
    this.centerText.setText('HIGHWAY HEAT');
    this.subText.setText('Swipe to change lanes.\nAvoid traffic. Keep your distance from the cops.\nWatch your fuel.\n\ntap to start');
    this.distText.setText('');
    this.gapBarBg.setVisible(false);
    this.gapBarFill.setVisible(false);
    this.gapLabel.setVisible(false);
    this.gapIcon.setVisible(false);
    this.fuelBarBg.setVisible(false);
    this.fuelBarFill.setVisible(false);
    this.fuelLabel.setVisible(false);
    this.fuelIcon.setVisible(false);
    this.scoreText.setVisible(false);
    this.oilButtonBg.setVisible(false);
    this.oilButtonText.setVisible(false);
  }

  startRun() {
    this.state = 'PLAYING';
    this.centerText.setText('');
    this.subText.setText('');
    this.gapBarBg.setVisible(true);
    this.gapBarFill.setVisible(true);
    this.gapLabel.setVisible(true);
    this.gapIcon.setVisible(true);
    this.fuelBarBg.setVisible(true);
    this.fuelBarFill.setVisible(true);
    this.fuelLabel.setVisible(true);
    this.fuelIcon.setVisible(true);
    this.scoreText.setVisible(true);
    this.oilButtonBg.setVisible(true);
    this.oilButtonText.setVisible(true);

    this.dist = 0;
    this.score = 0;
    this.carsPassed = 0;
    this.fuel = 100;
    this.currentLane = 1;
    this.player.setPosition(LANE_X[1], PLAYER_Y);
    this.gap = START_GAP;
    this.oilCooldownRemaining = 0;
    this.sirenTimer = 0;
    this.music.stop();
    this.music.start();

    this.roadblockTimer = ROADBLOCK_CHECK_MS;
    this.gasTimer = GAS_CHECK_MS;
    this.pressureLane = null;
    this.pressureTimer = 0;
    this.pressureCheckTimer = Phaser.Math.Between(5000, 8000);
    this.pressureOverlay.setVisible(false);
    this.pressureText.setVisible(false);
    this.nextCheckpointDist = CHECKPOINT_DISTANCE_INTERVAL;

    this.traffic.forEach(t => t.container.destroy());
    this.traffic = [];
    this.oilSlicks.forEach(s => s.shape.destroy());
    this.oilSlicks = [];
    this.roadblocks.forEach(r => r.container.destroy());
    this.roadblocks = [];
    this.checkpoints.forEach(c => c.container.destroy());
    this.checkpoints = [];
    this.gasCans.forEach(g => g.container.destroy());
    this.gasCans = [];
    this.lastSpawn = 0;
    this.lastSpecialSpawnElapsed = -9999;
    this.elapsed = 0;
    this.distText.setText('0m  ' + heatDots(0));
    this.updateGapBar();
    this.updateFuelBar();
    this.scoreText.setText('SCORE: 0   x1');
  }

  changeLane(dir) {
    if (this.state !== 'PLAYING') return;
    const next = Phaser.Math.Clamp(this.currentLane + dir, 0, LANE_X.length - 1);
    if (next === this.currentLane) return;
    this.currentLane = next;
    this.tweens.add({ targets: this.player, x: LANE_X[next], duration: 100, ease: 'Cubic.easeOut' });
  }

  spawnTraffic() {
    const lane = Phaser.Math.Between(0, LANE_X.length - 1);
    const color = TRAFFIC_COLORS[Phaser.Math.Between(0, TRAFFIC_COLORS.length - 1)];
    const vType = pickTrafficType();
    const container = drawCarShape(this, LANE_X[lane], -80, color, vType.width, vType.height);
    this.traffic.push({ container, lane, prevY: -80, resolved: false, width: vType.width });
  }

  spawnRoadblock() {
    const numBlocked = Phaser.Math.Between(1, 2);
    const laneIdx = [0, 1, 2, 3];
    Phaser.Utils.Array.Shuffle(laneIdx);
    const blockedLanes = laneIdx.slice(0, numBlocked);

    const container = this.add.container(0, -90);
    blockedLanes.forEach(lane => {
      const bar = this.add.rectangle(LANE_X[lane], 0, 84, 26, 0xf97316).setStrokeStyle(2, 0x1c1917);
      const s1 = this.add.line(0, 0, LANE_X[lane] - 32, -9, LANE_X[lane] - 12, 9, 0x1c1917).setLineWidth(4);
      const s2 = this.add.line(0, 0, LANE_X[lane] - 8, -9, LANE_X[lane] + 12, 9, 0x1c1917).setLineWidth(4);
      const s3 = this.add.line(0, 0, LANE_X[lane] + 16, -9, LANE_X[lane] + 32, 9, 0x1c1917).setLineWidth(4);
      container.add([bar, s1, s2, s3]);
    });

    this.roadblocks.push({ container, blockedLanes, prevY: -90, resolved: false });
    if (!this.taughtRoadblock) {
      this.taughtRoadblock = true;
      this.showToast('ROADBLOCK AHEAD \u2014 FIND AN OPEN LANE');
    }
  }

  spawnCheckpoint() {
    const container = this.add.container(GAME_WIDTH / 2, -90);
    const banner = this.add.rectangle(0, 0, ROAD_RIGHT - ROAD_LEFT, 30, 0x22c55e, 0.85).setStrokeStyle(3, 0xffffff, 0.7);
    const label = this.add.text(0, 0, 'CHECKPOINT', {
      fontFamily: 'monospace', fontSize: '13px', color: '#052e16', fontStyle: 'bold'
    }).setOrigin(0.5);
    container.add([banner, label]);
    this.checkpoints.push({ container, prevY: -90, resolved: false });
    if (!this.taughtCheckpoint) {
      this.taughtCheckpoint = true;
      this.showToast('DRIVE THROUGH FOR A BOOST');
    }
  }

  canSpawnSpecial() {
    return this.elapsed - this.lastSpecialSpawnElapsed >= SPECIAL_SPAWN_MIN_GAP_MS;
  }

  showToast(text) {
    const toast = this.add.text(GAME_WIDTH / 2, 150, text, {
      fontFamily: 'monospace', fontSize: '13px', color: '#fde047', fontStyle: 'bold',
      align: 'center', wordWrap: { width: 300 }, backgroundColor: '#000000'
    }).setOrigin(0.5).setAlpha(0).setPadding(10, 6, 10, 6);
    this.tweens.add({
      targets: toast, alpha: 1, duration: 200,
      onComplete: () => {
        this.time.delayedCall(2200, () => {
          this.tweens.add({ targets: toast, alpha: 0, duration: 400, onComplete: () => toast.destroy() });
        });
      }
    });
  }

  hitCheckpoint() {
    this.gap = Math.min(MAX_GAP, this.gap + CHECKPOINT_GAP_BOOST);
    this.updateGapBar();
    SFX.success();
    this.cameras.main.flash(200, 34, 197, 94);
  }

  spawnGasCan() {
    const laneOrder = Phaser.Utils.Array.Shuffle([0, 1, 2, 3]);
    let lane = laneOrder[0];
    for (const candidate of laneOrder) {
      const occupied = this.traffic.some(t => t.lane === candidate);
      if (!occupied) { lane = candidate; break; }
    }
    const container = this.add.container(LANE_X[lane], -60);
    const body = this.add.rectangle(0, 0, 22, 30, 0xdc2626).setStrokeStyle(2, 0x1c1917);
    const cap = this.add.rectangle(0, -18, 10, 8, 0x1c1917);
    const label = this.add.rectangle(0, 2, 14, 10, 0xfde047);
    container.add([body, cap, label]);
    this.gasCans.push({ container, lane, prevY: -60, resolved: false });
    if (!this.taughtGas) {
      this.taughtGas = true;
      this.showToast('GRAB FUEL BEFORE YOU RUN DRY');
    }
  }

  startPressureEvent() {
    this.pressureLane = Phaser.Math.Between(0, LANE_X.length - 1);
    this.pressureTimer = PRESSURE_DURATION_MS;
    this.pressureOverlay.x = LANE_X[this.pressureLane];
    this.pressureOverlay.setVisible(true);
    this.pressureText.setText("POLICE ARE PUSHING YOU OUT OF THIS LANE");
    this.pressureText.setVisible(true);
    SFX.alert();
  }

  endPressureEvent() {
    this.pressureLane = null;
    this.pressureOverlay.setVisible(false);
    this.pressureText.setVisible(false);
  }

  updateGapBar() {
    const ratio = Phaser.Math.Clamp(this.gap / MAX_GAP, 0, 1);
    this.gapBarFill.width = 220 * ratio;
    const color = this.gap < CRITICAL_GAP ? 0xef4444 : (ratio < 0.5 ? 0xf59e0b : 0x22c55e);
    this.gapBarFill.fillColor = color;
  }

  updateFuelBar() {
    const ratio = Phaser.Math.Clamp(this.fuel / 100, 0, 1);
    this.fuelBarFill.width = 220 * ratio;
    const color = ratio < 0.2 ? 0xef4444 : (ratio < 0.45 ? 0xf59e0b : 0x38bdf8);
    this.fuelBarFill.fillColor = color;
  }

  update(time, delta) {
    this.dashOffset += (delta / 1000) * 260;
    this.drawRoad();

    if (this.state !== 'PLAYING') return;
    this.elapsed += delta;
    const dt = delta / 1000;
    const phase = getPhase(this.dist);

    if (this.oilCooldownRemaining > 0) {
      this.oilCooldownRemaining = Math.max(0, this.oilCooldownRemaining - delta);
      this.oilButtonBg.fillColor = 0x1c1917;
      this.oilButtonBg.fillAlpha = 0.4;
      this.oilButtonText.setText(Math.ceil(this.oilCooldownRemaining / 1000) + 's');
    } else {
      this.oilButtonBg.fillColor = 0x1c1917;
      this.oilButtonBg.fillAlpha = 0.85;
      this.oilButtonText.setText('OIL');
    }

    if (!this.taughtOil && this.elapsed > 3000) {
      this.taughtOil = true;
      this.showToast('TAP OIL TO SPIN OUT THE LEAD COP');
    }

    this.dist += dt * 9;
    this.distText.setText(formatDist(this.dist) + '  ' + heatDots(getHeatTier(this.dist)));

    this.fuel = Math.max(0, this.fuel - FUEL_DRAIN_RATE * dt);
    this.updateFuelBar();
    if (this.fuel <= 0) {
      this.strand();
      return;
    }

    const multiplier = getMultiplier(this.carsPassed);
    this.score += dt * 10 * multiplier;
    this.scoreText.setText('SCORE: ' + Math.floor(this.score) + '   x' + multiplier);

    if (this.elapsed - this.lastSpawn > phase.spawnMs) {
      this.lastSpawn = this.elapsed;
      this.spawnTraffic();
    }

    const dy = phase.trafficSpeed * dt;
    for (let i = this.traffic.length - 1; i >= 0; i--) {
      const t = this.traffic[i];
      t.prevY = t.container.y;
      t.container.y += dy;

      if (!t.resolved && t.prevY < PLAYER_Y && t.container.y >= PLAYER_Y) {
        t.resolved = true;
        const dx = Math.abs(t.container.x - this.player.x);
        const threshold = (t.width + CAR_W) / 2 * 0.72;
        if (dx < threshold) {
          this.crash();
        } else {
          this.carsPassed++;
          if (Math.abs(t.lane - this.currentLane) === 1) {
            this.nearMiss();
          }
        }
      }

      if (t.container.y > GAME_HEIGHT + 80) {
        t.container.destroy();
        this.traffic.splice(i, 1);
      }
    }

    if (phase.roadblockChance > 0) {
      this.roadblockTimer -= delta;
      if (this.roadblockTimer <= 0) {
        this.roadblockTimer = ROADBLOCK_CHECK_MS;
        if (Math.random() < phase.roadblockChance && this.canSpawnSpecial()) {
          this.spawnRoadblock();
          this.lastSpecialSpawnElapsed = this.elapsed;
        }
      }
    }

    for (let i = this.roadblocks.length - 1; i >= 0; i--) {
      const rb = this.roadblocks[i];
      rb.prevY = rb.container.y;
      rb.container.y += dy;

      if (!rb.resolved && rb.prevY < PLAYER_Y && rb.container.y >= PLAYER_Y) {
        rb.resolved = true;
        if (rb.blockedLanes.includes(this.currentLane)) {
          this.crash();
        }
      }

      if (rb.container.y > GAME_HEIGHT + 80) {
        rb.container.destroy();
        this.roadblocks.splice(i, 1);
      }
    }

    if (this.dist >= this.nextCheckpointDist && this.canSpawnSpecial()) {
      this.nextCheckpointDist += CHECKPOINT_DISTANCE_INTERVAL;
      this.spawnCheckpoint();
      this.lastSpecialSpawnElapsed = this.elapsed;
    }

    for (let i = this.checkpoints.length - 1; i >= 0; i--) {
      const cp = this.checkpoints[i];
      cp.prevY = cp.container.y;
      cp.container.y += dy;

      if (!cp.resolved && cp.prevY < PLAYER_Y && cp.container.y >= PLAYER_Y) {
        cp.resolved = true;
        this.hitCheckpoint();
      }

      if (cp.container.y > GAME_HEIGHT + 80) {
        cp.container.destroy();
        this.checkpoints.splice(i, 1);
      }
    }

    this.gasTimer -= delta;
    if (this.gasTimer <= 0) {
      this.gasTimer = GAS_CHECK_MS;
      if (Math.random() < getGasChance(this.dist) && this.canSpawnSpecial()) {
        this.spawnGasCan();
        this.lastSpecialSpawnElapsed = this.elapsed;
      }
    }

    for (let i = this.gasCans.length - 1; i >= 0; i--) {
      const g = this.gasCans[i];
      g.prevY = g.container.y;
      g.container.y += dy;

      if (!g.resolved && g.prevY < PLAYER_Y && g.container.y >= PLAYER_Y) {
        g.resolved = true;
        if (g.lane === this.currentLane) {
          this.fuel = Math.min(100, this.fuel + FUEL_REFILL_AMOUNT);
          this.updateFuelBar();
          SFX.pickup();
          g.container.destroy();
          this.gasCans.splice(i, 1);
          continue;
        }
      }

      if (g.container.y > GAME_HEIGHT + 60) {
        g.container.destroy();
        this.gasCans.splice(i, 1);
      }
    }

    if (this.state !== 'PLAYING') return;

    this.gap = Math.max(0, this.gap - phase.gapCloseRate * dt);
    this.updateGapBar();

    if (this.gap < CRITICAL_GAP) {
      this.sirenTimer -= delta;
      if (this.sirenTimer <= 0) {
        SFX.alert();
        const urgency = 1 - Phaser.Math.Clamp(this.gap / CRITICAL_GAP, 0, 1);
        this.sirenTimer = Phaser.Math.Linear(650, 160, urgency);
      }
    } else {
      this.sirenTimer = 0;
    }

    if (phase.pressureEnabled) {
      if (this.pressureLane === null) {
        this.pressureCheckTimer -= delta;
        if (this.pressureCheckTimer <= 0) {
          this.pressureCheckTimer = Phaser.Math.Between(5000, 8000);
          this.startPressureEvent();
        }
      } else {
        this.pressureTimer -= delta;
        if (this.currentLane === this.pressureLane) {
          this.gap = Math.max(0, this.gap - PRESSURE_EXTRA_DRAIN_RATE * dt);
          this.updateGapBar();
        }
        if (this.pressureTimer <= 0) {
          this.endPressureEvent();
        }
      }
    }

    this.updatePoliceVisuals(phase);

    const speedRatio = Phaser.Math.Clamp((phase.trafficSpeed - 180) / (300 - 180), 0, 1);
    const gapRatio = Phaser.Math.Clamp(this.gap / MAX_GAP, 0, 1);
    this.music.update(delta, speedRatio, gapRatio);

    for (let i = this.oilSlicks.length - 1; i >= 0; i--) {
      const slick = this.oilSlicks[i];
      slick.distanceBehind += dt * OIL_RECEDE_SPEED;
      slick.shape.y = PLAYER_Y + slick.distanceBehind;

      const leadCar = this.policeCars[0];
      const yHit = Math.abs(this.gap - slick.distanceBehind) < OIL_MATCH_Y_THRESHOLD;
      const xHit = Math.abs(leadCar.x - LANE_X[slick.lane]) < OIL_MATCH_X_THRESHOLD;
      if (leadCar.visible && yHit && xHit) {
        this.spinOutLeadPolice(slick);
        slick.shape.destroy();
        this.oilSlicks.splice(i, 1);
        continue;
      }

      if (slick.distanceBehind > MAX_GAP + 60 || slick.shape.y > GAME_HEIGHT + 40) {
        slick.shape.destroy();
        this.oilSlicks.splice(i, 1);
      }
    }

    if (this.gap <= 0) {
      this.busted();
    }
  }

  updatePoliceVisuals(phase) {
    const activeCount = phase.policeCount;
    for (let i = 0; i < this.policeCars.length; i++) {
      const car = this.policeCars[i];
      if (i >= activeCount) { car.setVisible(false); continue; }
      car.setVisible(true);
      const laneOffset = i === 0 ? 0 : (i % 2 === 1 ? -1 : 1) * (i);
      const targetLaneIdx = Phaser.Math.Clamp(this.currentLane + laneOffset, 0, LANE_X.length - 1);
      const targetX = LANE_X[targetLaneIdx];
      const targetY = PLAYER_Y + (this.gap / MAX_GAP) * 110 + i * 10;
      car.x += (targetX - car.x) * 0.08;
      car.y += (targetY - car.y) * 0.15;
      const blink = Math.floor(this.elapsed / 150) % 2 === 0;
      car.lightBar.fillColor = blink ? 0xef4444 : 0x3b82f6;
      const radarPulse = Math.floor(this.elapsed / 400) % 2 === 0;
      car.gunTip.setScale(radarPulse ? 1.4 : 1);
    }
  }

  nearMiss() {
    this.gap = Math.min(MAX_GAP, this.gap + NEAR_MISS_GAP_BONUS);
    this.updateGapBar();
    SFX.blip();
    this.cameras.main.shake(90, 0.004);
  }

  dropOilSlick() {
    if (this.state !== 'PLAYING' || this.oilCooldownRemaining > 0) return;
    this.oilCooldownRemaining = OIL_COOLDOWN_MS;
    this.taughtOil = true;
    const lane = this.currentLane;
    const shape = this.add.ellipse(LANE_X[lane], PLAYER_Y + 20, 40, 22, 0x18181b, 0.85).setStrokeStyle(2, 0x3f3f46);
    this.oilSlicks.push({ shape, lane, distanceBehind: 20 });
    SFX.swoosh();
  }

  spinOutLeadPolice(slick) {
    this.gap = Math.min(MAX_GAP, this.gap + OIL_GAP_BOOST);
    this.updateGapBar();
    SFX.scream();
    this.cameras.main.shake(140, 0.006);
    const car = this.policeCars[0];
    this.tweens.add({
      targets: car,
      angle: car.angle + 360,
      duration: 500,
      ease: 'Cubic.easeOut'
    });
  }

  crash() {
    this.state = 'OVER';
    SFX.explosion();
    this.cameras.main.shake(200, 0.012);
    this.spawnDebris();
    this.music.stop();
    this.pressureOverlay.setVisible(false);
    this.pressureText.setVisible(false);
    this.finishRun('CRASHED');
  }

  busted() {
    this.state = 'OVER';
    SFX.hit();
    this.cameras.main.shake(160, 0.008);
    this.spawnSirenWash();
    this.music.stop();
    this.pressureOverlay.setVisible(false);
    this.pressureText.setVisible(false);
    this.finishRun('BUSTED');
  }

  strand() {
    this.state = 'OVER';
    SFX.fail();
    this.music.stop();
    this.pressureOverlay.setVisible(false);
    this.pressureText.setVisible(false);
    this.spawnSmokePuffs();
    this.finishRun('STRANDED');
  }

  spawnSmokePuffs() {
    for (let i = 0; i < 6; i++) {
      const puff = this.add.circle(this.player.x + Phaser.Math.Between(-10, 10), this.player.y - 20, Phaser.Math.Between(6, 11), 0x71717a, 0.6);
      this.tweens.add({
        targets: puff,
        y: puff.y - Phaser.Math.Between(40, 80),
        x: puff.x + Phaser.Math.Between(-20, 20),
        alpha: 0,
        scale: 1.8,
        duration: Phaser.Math.Between(900, 1400),
        delay: i * 90,
        ease: 'Cubic.easeOut',
        onComplete: () => puff.destroy()
      });
    }
  }

  spawnDebris() {
    const colors = [0xf97316, 0x71717a, 0xfacc15, 0x27272a];
    for (let i = 0; i < 18; i++) {
      const color = colors[Phaser.Math.Between(0, colors.length - 1)];
      const piece = this.add.rectangle(this.player.x, this.player.y, Phaser.Math.Between(4, 9), Phaser.Math.Between(4, 9), color);
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const dist = Phaser.Math.Between(50, 160);
      this.tweens.add({
        targets: piece,
        x: piece.x + Math.cos(angle) * dist,
        y: piece.y + Math.sin(angle) * dist,
        alpha: 0,
        angle: Phaser.Math.Between(-360, 360),
        duration: Phaser.Math.Between(500, 850),
        ease: 'Cubic.easeOut',
        onComplete: () => piece.destroy()
      });
    }
  }

  spawnSirenWash() {
    const wash = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0xef4444, 0.45);
    let flips = 0;
    const flip = () => {
      flips++;
      wash.fillColor = flips % 2 === 0 ? 0xef4444 : 0x3b82f6;
      if (flips < 7) {
        this.time.delayedCall(90, flip);
      } else {
        this.tweens.add({ targets: wash, alpha: 0, duration: 250, onComplete: () => wash.destroy() });
      }
    };
    flip();
  }

  finishRun(reason) {
    let isNewBest = false;
    if (this.dist > this.bestDist) {
      this.bestDist = this.dist;
      localStorage.setItem(BEST_KEY, String(Math.floor(this.bestDist)));
      isNewBest = true;
      this.bestText.setText('Best: ' + formatDist(this.bestDist));
    }
    this.centerText.setText(reason);
    this.subText.setText(formatDist(this.dist) + (isNewBest ? '  NEW BEST!' : '') + '\nScore: ' + Math.floor(this.score) + '\ntap to retry');
  }
}

const config = {
  type: Phaser.AUTO,
  audio: { noAudio: true },
  resolution: window.devicePixelRatio || 1,
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  parent: 'game-container',
  backgroundColor: '#27272a',
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
