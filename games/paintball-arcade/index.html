<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paintball Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
  #game-root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; cursor: crosshair; }
</style>
</head>
<body>
<div id="game-root"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="../../assets/sfx.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // PAINTBALL ARCADE — MVP per the finalized design spec.
  // Core identity: "a one-shot positioning duel where every shot gives
  // away information." One-hit elimination, 1v1 vs an AI that actually
  // uses cover (seek/hold/peek/shoot/reposition/flank), limited hopper
  // ammo, persistent paint splatter, best-of-5 match. No health bar —
  // the whole game is about not being seen when you don't have to be.
  //
  // Fog-of-war is the piece that makes the hook actually work: the AI
  // is only DRAWN on screen while the player has line of sight to it
  // (see playerHasLOS below) — otherwise you only get a fading "last
  // seen" ghost marker. Without that, a top-down view with everything
  // always visible would make cover meaningless. Symmetrically, the AI
  // never reads the player's true live position either — only what its
  // own line-of-sight check actually lets it see (plus a short-lived,
  // approximate "heard that shot" ping when you fire nearby).
  // ---------------------------------------------------------------------

  const W = 960;
  const HUD_H = 56;
  const FIELD_H = 600;
  const H = HUD_H + FIELD_H;
  const WALL = 6;

  const PLAYER_R = 13;
  const AI_R = 13;
  const PLAYER_SPEED = 3.3;
  const AI_SPEED = 3.0;
  const FIRE_COOLDOWN = 190;
  const BALL_SPEED = 15;
  const BALL_R = 3.5;
  const HOPPER_MAX = 12;
  const PICKUP_AMOUNT = 6;
  const ROUNDS_TO_WIN = 3;
  const HIT_STUN_MS = 90;

  const PLAYER_COLOR = 0x38bdf8;   // player's paint — cyan
  const AI_COLOR = 0xf97316;       // AI's paint — orange

  // Condensed technical face for the start menu — reads like a tactical
  // HUD legend instead of a generic system font. Falls back cleanly if
  // the webfont hasn't loaded (see the boot gate at the bottom of the file).
  const MENU_FONT = '"Chakra Petch", system-ui, sans-serif';

  // AI difficulty — per the spec's reaction-time bands. Aim error also
  // tightens on Hard so a fast reaction isn't undercut by sloppy aim,
  // and loosens further on Easy than the base spec called for so the
  // gap between tiers is actually felt, not just theoretical.
  const DIFFICULTY_SPECS = {
    easy:   { label: 'EASY',   reaction: [450, 650], aimError: 0.16 },
    normal: { label: 'NORMAL', reaction: [300, 500], aimError: 0.09 },
    hard:   { label: 'HARD',   reaction: [180, 350], aimError: 0.05 }
  };

  // ---- Arena: 960x600 field below a 56px HUD strip. Bunker layout is
  // symmetric top-bottom (rows A/E and B/D mirror each other, row C is
  // the shared center line) so a bottom player spawn vs a top AI spawn
  // is inherently fair. S/M/L sizing and the S-M-S / M-L-L-M alternating
  // pattern follow the spec's ASCII layout — reskinned as real inflatable
  // speedball props instead of plain boxes: 'can' (a squat cylinder),
  // 'tower' (a taller/wider cylinder), and 'dorito' (the classic
  // triangular wedge, with a facing angle). Collision and line-of-sight
  // both treat every bunker as a circle of radius r — close enough to
  // each prop's actual footprint that gameplay reads the same as the
  // rectangle version did, while the art can be properly round/angular. ----
  const BUNKER_SPECS = [
    // row A
    { x: 330, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 }, { x: 480, y: 110, r: 27, shape: 'can' }, { x: 630, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 },
    // row B
    { x: 190, y: 205, r: 27, shape: 'can' }, { x: 385, y: 205, r: 38, shape: 'tower' }, { x: 575, y: 205, r: 38, shape: 'tower' }, { x: 770, y: 205, r: 27, shape: 'can' },
    // row C — center line
    { x: 330, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 480, y: 300, r: 27, shape: 'can' }, { x: 630, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 },
    // row D
    { x: 190, y: 395, r: 27, shape: 'can' }, { x: 385, y: 395, r: 38, shape: 'tower' }, { x: 575, y: 395, r: 38, shape: 'tower' }, { x: 770, y: 395, r: 27, shape: 'can' },
    // row E
    { x: 330, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 480, y: 490, r: 27, shape: 'can' }, { x: 630, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }
  ];

  // ---- Second arena layout — same spawn points, pickups and wall
  // margins so nothing else about the ruleset has to change, but a
  // different bunker rhythm (staggered rows, tighter can/tower cluster
  // down the middle, doritos pushed wider) so a match doesn't always
  // play out on the exact same sightlines. Picked at random per match. ----
  const BUNKER_SPECS_ALT = [
    // row A
    { x: 380, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 }, { x: 530, y: 110, r: 27, shape: 'can' }, { x: 680, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 },
    // row B
    { x: 170, y: 205, r: 27, shape: 'can' }, { x: 365, y: 205, r: 38, shape: 'tower' }, { x: 555, y: 205, r: 38, shape: 'tower' }, { x: 750, y: 205, r: 27, shape: 'can' },
    // row C — center line. Sits at x=480, dead on the player/AI spawn
    // axis (both spawns are x=480) — every layout needs a bunker here or
    // the round starts with a free bee-line shot the instant GO hits.
    { x: 370, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 480, y: 300, r: 27, shape: 'can' }, { x: 670, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 },
    // row D
    { x: 170, y: 395, r: 27, shape: 'can' }, { x: 365, y: 395, r: 38, shape: 'tower' }, { x: 555, y: 395, r: 38, shape: 'tower' }, { x: 750, y: 395, r: 27, shape: 'can' },
    // row E
    { x: 380, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 530, y: 490, r: 27, shape: 'can' }, { x: 680, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }
  ];

  // ---- Third arena layout — big center towers stack up the middle of
  // every row instead of the other two layouts' open lattice, funneling
  // fights out to the side lanes. A different tactical read (flank wide
  // or die trying) rather than another shuffled version of the same
  // crossing-lanes shape. ----
  const BUNKER_SPECS_BOTTLENECK = [
    // row A
    { x: 300, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 }, { x: 480, y: 110, r: 27, shape: 'can' }, { x: 660, y: 110, r: 17, shape: 'dorito', rot: Math.PI / 2 },
    // row B
    { x: 160, y: 205, r: 27, shape: 'can' }, { x: 400, y: 205, r: 38, shape: 'tower' }, { x: 560, y: 205, r: 38, shape: 'tower' }, { x: 800, y: 205, r: 27, shape: 'can' },
    // row C — center line, a big tower instead of a can for a wider,
    // more emphatic center block than the other two layouts
    { x: 300, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 480, y: 300, r: 38, shape: 'tower' }, { x: 660, y: 300, r: 17, shape: 'dorito', rot: -Math.PI / 2 },
    // row D
    { x: 160, y: 395, r: 27, shape: 'can' }, { x: 400, y: 395, r: 38, shape: 'tower' }, { x: 560, y: 395, r: 38, shape: 'tower' }, { x: 800, y: 395, r: 27, shape: 'can' },
    // row E
    { x: 300, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }, { x: 480, y: 490, r: 27, shape: 'can' }, { x: 660, y: 490, r: 17, shape: 'dorito', rot: -Math.PI / 2 }
  ];

  const LAYOUTS = [
    { name: 'Crossroads', bunkers: BUNKER_SPECS },
    { name: 'Crossfire', bunkers: BUNKER_SPECS_ALT },
    { name: 'Bottleneck', bunkers: BUNKER_SPECS_BOTTLENECK }
  ];

  const PICKUP_SPECS = [
    { x: 140, y: 160 }, { x: 820, y: 160 },
    { x: 140, y: 440 }, { x: 820, y: 440 }
  ];

  // Per-shape color pairs for the bunkers — real inflatable speedball props
  // come in loud, distinct colors (not one brick-red for everything), and
  // splitting left/right by color reads as "two teams' gear" rather than
  // a uniform prop stamped out repeatedly.
  const BUNKER_PALETTE = {
    can:    [ { base: 0xb91c1c, hi: 0xf87171, rim: 0x450a0a }, { base: 0x1d4ed8, hi: 0x93c5fd, rim: 0x0c1f4d } ],
    tower:  [ { base: 0xca8a04, hi: 0xfde047, rim: 0x422006 }, { base: 0x1f2937, hi: 0x6b7280, rim: 0x000000 } ],
    dorito: [ { base: 0xea580c, hi: 0xfdba74, rim: 0x431407 }, { base: 0xe2e8f0, hi: 0xffffff, rim: 0x475569 } ]
  };

  // Purely cosmetic field dressing — none of these collide with anything,
  // they just fill the dead space between bunkers so the field doesn't
  // read as empty grass + props. Positions are hand-picked to clear every
  // bunker, pickup and spawn by a healthy margin.
  const DECOR_SPECS = [
    { x: 55,  y: 92,  type: 'tirestack' },
    { x: 905, y: 92,  type: 'crate', rot: 0.15 },
    { x: 55,  y: 300, type: 'barrel' },
    { x: 905, y: 300, type: 'tirestack' },
    { x: 55,  y: 508, type: 'crate', rot: -0.2 },
    { x: 905, y: 508, type: 'barrel' },
    { x: 258, y: 108, type: 'hay', rot: 0.3 },
    { x: 702, y: 108, type: 'tirestack' },
    { x: 258, y: 492, type: 'tirestack' },
    { x: 702, y: 492, type: 'hay', rot: -0.4 },
    { x: 60,  y: 205, type: 'hay', rot: 0.6 },
    { x: 900, y: 395, type: 'crate', rot: 0.5 }
  ];

  // mirrored about the field's vertical center (HUD_H + FIELD_H/2 = 356)
  // so both spawns sit the same safe distance from their nearest wall
  const PLAYER_SPAWN = { x: 480, y: 560 };
  const AI_SPAWN = { x: 480, y: 152 };

  // -----------------------------------------------------------------------
  // Geometry helpers — everything AI perception, cover scoring and fog of
  // war rests on. LOS is point-sampled along the segment rather than a
  // true segment/rect intersection: simpler to get right, and cheap enough
  // (a few hundred point-in-rect checks) at this scale.
  // -----------------------------------------------------------------------
  function pointInBunker(px, py, b) {
    const dx = px - b.x, dy = py - b.y;
    return dx * dx + dy * dy < b.r * b.r;
  }

  function hasLineOfSight(x1, y1, x2, y2, bunkers) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.floor(dist / 8));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const px = x1 + dx * t, py = y1 + dy * t;
      for (let b = 0; b < bunkers.length; b++) {
        if (pointInBunker(px, py, bunkers[b])) return false;
      }
    }
    return true;
  }

  function resolveBunkerCollision(actor, bunkers) {
    for (const b of bunkers) {
      const dx = actor.x - b.x, dy = actor.y - b.y;
      const distSq = dx * dx + dy * dy;
      const minDist = actor.radius + b.r;
      if (distSq < minDist * minDist) {
        const dist = Math.sqrt(distSq) || 0.001;
        const nx = dx / dist, ny = dy / dist;
        const push = minDist - dist;
        actor.x += nx * push;
        actor.y += ny * push;
      }
    }
  }

  function clampToField(actor) {
    actor.x = Phaser.Math.Clamp(actor.x, WALL + actor.radius, W - WALL - actor.radius);
    actor.y = Phaser.Math.Clamp(actor.y, HUD_H + WALL + actor.radius, H - WALL - actor.radius);
  }

  // "Stand point" for a bunker: a spot on the far side of the bunker from
  // some reference point, so the bunker itself sits between the two —
  // that's what cover actually means geometrically.
  function coverStandPoint(bunker, awayX, awayY) {
    const dx = bunker.x - awayX, dy = bunker.y - awayY;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    const standoff = bunker.r + 22;
    return { x: bunker.x + nx * standoff, y: bunker.y + ny * standoff };
  }

  // left/right peek points — lateral offsets from the stand point, along
  // the perpendicular of the bunker/reference axis.
  function peekPoints(bunker, awayX, awayY) {
    const dx = bunker.x - awayX, dy = bunker.y - awayY;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    const px = -ny, py = nx;
    const lateral = bunker.r + 16;
    const standoff = bunker.r + 8;
    const baseX = bunker.x + nx * standoff, baseY = bunker.y + ny * standoff;
    return [
      { x: baseX + px * lateral, y: baseY + py * lateral, side: 1 },
      { x: baseX - px * lateral, y: baseY - py * lateral, side: -1 }
    ];
  }

  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function nearWall(x, y) {
    return x < WALL + 40 || x > W - WALL - 40 || y < HUD_H + WALL + 40 || y > H - WALL - 40;
  }

  // =====================================================================
  // MUSIC — a bespoke, reactive score, not a generic looping track. Built
  // straight on the Web Audio API and fully self-contained here (it never
  // touches the shared assets/sfx.js engine other hub games also rely on).
  // The one rule driving every design choice below: the sound should come
  // from the game's own mechanics, not sit on top of them. So the live
  // layer is a sub-bass pulse plus a "geiger-tick" whose rate and pitch
  // are wired straight to playerHasLOS — the exact fog-of-war flag the
  // whole game is built around — and to ammo/match-point state. Lose
  // sight of the bot and the score tightens; find it again and it eases.
  // =====================================================================
  const Music = (function () {
    // IMPORTANT: this does NOT create its own AudioContext or its own
    // mute control. The hub's shared ArcadeSFX engine (assets/sfx.js)
    // already owns exactly one AudioContext per page (window.SFX.ctx,
    // lazily created/resumed by window.SFX.ensureContext()) and already
    // mounts its own floating mute/volume panel — running a second,
    // independent audio stack alongside it is what was breaking sound
    // entirely. So every sound below is scheduled straight onto SFX's own
    // context, through a gain node that continuously mirrors SFX.muted
    // and SFX.volume — one shared context, one shared mute switch.
    let localMaster = null, noiseBuffer = null;
    let menuNodes = null;      // { o1, o2, lfo, g, blipTimer }
    let liveActive = false;
    let tickAcc = 0, pulseAcc = 0, tension = 0;

    function sfxReady() {
      return typeof SFX !== 'undefined' && SFX && typeof SFX.ensureContext === 'function';
    }

    // Everything below is a nice-to-have layered on top of the game, never
    // load-bearing — so ensureCtx (and every exported entry point, wrapped
    // at the bottom via `safe()`) is written to fail silently on any
    // unsupported/blocked/limited browser, or if SFX itself isn't present,
    // rather than ever throwing back into the game's own logic.
    function ensureCtx() {
      try {
        if (!sfxReady()) return null;
        SFX.ensureContext();
        const c = SFX.ctx;
        if (!c) return null;
        if (!localMaster || localMaster.context !== c) {
          localMaster = c.createGain();
          localMaster.connect(c.destination);
          // one second of white noise, reused (filtered differently each
          // time) for every tick/burst sound below — no sample assets needed
          const len = Math.floor(c.sampleRate * 1);
          const buf = c.createBuffer(1, len, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          noiseBuffer = buf;
        }
        syncLevel(c);
        return c;
      } catch (e) {
        return null;
      }
    }

    // keeps our own gain glued to SFX's own mute button / volume slider —
    // there is only ever one mute switch on the page, and this is it
    function syncLevel(c) {
      if (!localMaster) return;
      const muted = !!(SFX && SFX.muted);
      const vol = (SFX && typeof SFX.volume === 'number') ? SFX.volume : 1;
      // 0.55 headroom so the music sits under SFX's own effects, never over them
      const level = muted ? 0 : Math.max(0, Math.min(1, vol)) * 0.55;
      localMaster.gain.setTargetAtTime(level, c.currentTime, 0.05);
    }

    function unlock() { ensureCtx(); }

    // ---- shared primitives ----
    function tone(freq, dur, opts) {
      const c = ensureCtx(); if (!c) return;
      opts = opts || {};
      const osc = c.createOscillator();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, c.currentTime + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : 0.16, c.currentTime + (opts.attack || 0.012));
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(g); g.connect(localMaster);
      osc.start(); osc.stop(c.currentTime + dur + 0.03);
    }

    function noiseBurst(dur, freq, q, vol) {
      const c = ensureCtx(); if (!c || !noiseBuffer) return;
      const src = c.createBufferSource();
      src.buffer = noiseBuffer; src.loop = true;
      const filt = c.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = q;
      const g = c.createGain();
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(filt); filt.connect(g); g.connect(localMaster);
      src.start(); src.stop(c.currentTime + dur + 0.03);
    }

    function subThump(freq, dur, vol) {
      const c = ensureCtx(); if (!c) return;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.6), c.currentTime + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(g); g.connect(localMaster);
      osc.start(); osc.stop(c.currentTime + dur + 0.03);
    }

    // ---- menu ambience: a quiet open-fifth drone that slowly breathes,
    // plus sparse high "recon blip" pings at random intervals — a field
    // at rest before the match, not silence and not a jingle ----
    function startMenuAmbience() {
      stopMenuAmbience();
      const c = ensureCtx(); if (!c) return;
      const g = c.createGain(); g.gain.value = 0; g.connect(localMaster);
      const filt = c.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 420; filt.connect(g);
      const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 55 * 1.5; // fifth
      o1.connect(filt); o2.connect(filt);
      o1.start(); o2.start();
      g.gain.linearRampToValueAtTime(0.16, c.currentTime + 1.4);
      const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.09;
      const lfoGain = c.createGain(); lfoGain.gain.value = 0.05;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      lfo.start();

      menuNodes = { o1, o2, lfo, g, blipTimer: null };
      const scheduleBlip = () => {
        if (!menuNodes) return;
        ensureCtx(); // keeps volume/mute synced even during idle menu time
        noiseBurst(0.05, 1400 + Math.random() * 900, 9, 0.05);
        menuNodes.blipTimer = setTimeout(scheduleBlip, 1800 + Math.random() * 2600);
      };
      menuNodes.blipTimer = setTimeout(scheduleBlip, 1400);
    }

    function stopMenuAmbience() {
      if (!menuNodes) return;
      const n = menuNodes; menuNodes = null;
      clearTimeout(n.blipTimer);
      const c = SFX && SFX.ctx;
      if (c) {
        n.g.gain.setTargetAtTime(0, c.currentTime, 0.25);
        setTimeout(() => { try { n.o1.stop(); n.o2.stop(); n.lfo.stop(); } catch (e) {} }, 500);
      }
    }

    // ---- live tension loop: driven every frame from the game's own
    // update(), fed the exact fog-of-war flag the whole game is built
    // around plus ammo/match-point state. No fixed tempo — the sub-bass
    // pulse and the geiger-tick's rate and pitch track how much danger
    // you're actually in right now, moment to moment. ----
    function startLiveLoop() { liveActive = true; tickAcc = 0; pulseAcc = 0; tension = 0; }
    function stopLiveLoop() { liveActive = false; }

    function updateTension(dt, params) {
      if (!liveActive) return;
      ensureCtx(); // cheap; keeps volume/mute synced live during play
      params = params || {};
      let target = 0;
      if (!params.hasLOS) target += 0.55;      // can't see the bot = the core threat
      if (params.ammo != null && params.ammo <= 3) target += 0.3; // running dry
      if (params.matchPoint) target = 1;       // the deciding shot overrides everything
      target = Phaser.Math.Clamp(target, 0, 1);
      tension += (target - tension) * Math.min(1, dt / 600);

      tickAcc += dt;
      const tickInterval = 950 - tension * 760; // 950ms calm -> ~190ms max tension
      if (tickAcc >= tickInterval) {
        tickAcc = 0;
        noiseBurst(0.035, 1500 + tension * 1800 + Math.random() * 120, 14, 0.045 + tension * 0.05);
      }

      pulseAcc += dt;
      const pulseInterval = 1500 - tension * 700;
      if (pulseAcc >= pulseInterval) {
        pulseAcc = 0;
        subThump(58 + tension * 10, 0.28, 0.09 + tension * 0.08);
      }
    }

    // a rising, tightening drone layered over the deciding shot's own
    // slow-mo window (on top of the tick/pulse above, not instead of it)
    function matchPointDrone() {
      const c = ensureCtx(); if (!c) return;
      const osc = c.createOscillator(); osc.type = 'sawtooth';
      const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 800;
      const g = c.createGain(); g.gain.value = 0;
      osc.connect(filt); filt.connect(g); g.connect(localMaster);
      osc.frequency.setValueAtTime(90, c.currentTime);
      osc.frequency.linearRampToValueAtTime(260, c.currentTime + 0.9);
      g.gain.linearRampToValueAtTime(0.09, c.currentTime + 0.15);
      g.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.9);
      osc.start(); osc.stop(c.currentTime + 0.95);
